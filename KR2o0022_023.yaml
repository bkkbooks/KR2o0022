body:
  text: 欽定四庫全書御批續資治通鑑綱目卷十八起戊辰宋寧宗嘉定元年盡甲申宋寧宗嘉定十七年凡十七年戊辰嘉定元年金泰和八年春正月以史彌遠知樞密院事王柟還自汴三月以韓托胄蘇師旦首畀金柟至汴請依靖康故事世為伯姪之國增嵗幣為三十萬犒軍錢三百萬貫蘇師旦等俟和議定後當函首以獻完顔匡具以柟言奏於金主璟命匡移書索韓托胄首以贖淮南地改高軍錢為銀三百萬兩會錢象祖移書金帥府喻以誅韓托胄事柟未之知也一日匡問柟曰韓托胄貴顯幾年矣柟曰已十餘年平章國事才二年耳匡曰今欲去此人可乎柟曰主上英斷去之何難匡顧之而笑和議始決遣柟持書求函托胄首以贖淮南柟還言於朝詔百官議吏部尚書樓鑰曰和議重事待此而決姦究已斃之首又何足惜遂命臨安府斫棺取首裊之兩淮仍諭諸路以函首畀金之事遂以托胄及師旦之首付王柟送金師以易淮陜侵地發明嗚呼宋事至此浸不可為大抵為國之道當以自強而勉於為善則國之大小不足計也致堂胡氏曰有父之讐忍恥不報則曰春秋貴息兵以華夏之尊臣服仇敵則曰文王事昆夷宋自高宗以迄於今武功之不競未有甚於此時者也國勢之不振未有踈於此時者也姑即和議一事觀之開禧啓釁兵連禍結淮南陜石相繼陷沒民之死於鋒鏑者不可勝計而竟不能與之一決徒以遣使連肩丐求和好欲增嵗幣則不吝增之欲得首謀則以首畀之如子事父罔敢違逆殊不知國體之損亦多矣當時樓鑰諸臣以為姦宄已斃之首又何足惜然亦誤矣蓋已斃之首固不足惜一國之體誠為可惜畀之以首其如國體何然則宋之君臣奚若是之愚哉綱目書此文無貶詞乃所以深貶之爾廣義二姦死首固不足惜與之適足以弱國體耳復秦檜爵諡廣義和議乃檜亡宋之術非為宋之本心也宋人至此尚不覺悟悲哉或云此舉畏金其言然矣臨安大火火凡四日焚御史臺等官舍十餘所民舍五萬八千九十七家城內外亘十餘里死者甚衆城中廬舍十燬其七百官多僦舟以居民訛言相驚亡賴因而縱火為姦發明秦檜權姦誤國得以棺槨全終不為不幸又何王爵之可加乎前書追奪王爵改諡繆醜此固天下之公議於兹而復抑何禮耶然追奪之者必悟和議之失耳前日之奪是則今日之復為非今日之復是則前日之奪為非寧宗必居一於是矣當時闕政匪一奚屑屑以復秦檜之爵諡為事哉秦檜之爵諡甫復臨安之大火隨見夫以賊檜之見絶於天而災異承之速於桴鼓之相應此蓋人神共憤特假此以示宋不宜追復焉爾惜乎寧宗不足以語此也綱目比而書之其義自見夏六月金人來歸大散闕及濠州王柟以韓托胄蘇師旦首至金金主璟御應天門備黃麾立仗受之百官上表稱賀懸二首并畫像於通衢令百姓縱觀然後漆其首藏於軍器庫遂命完顔匡等罷兵更元帥府為樞密院遣使來歸大散闕及濠州衛涇罷林大中卒秋七月召邱崈同知樞密院事未至卒崈儀狀魁傑機神英悟嘗慷慨曰生無以報國死願為猛將以報敵其忠義蓋天性也八月以婁機同知樞密院事樓鑰同知院事鑰持論堅正忤韓托胄意奉祠纍年機初為太常少卿托胄開邉機曰恢復之名非不美今人才難得財力未裕萬一兵連禍結奈何鄧友龍曰不逐此人則異議無所回遂斥外及入樞府時干戈甫定信使往來機禆贊之功為多尤惜名器守法度進退人物直言可否不市私恩不避嫌怨廣義機鑰並用可謂得人文無美辭而美自見矣賑江淮流民出來二十萬石錢一百萬緡命江浙制置司賑之九月金遣使來和議成下詔以和議成諭天下吕中曰和戎國家之不得已也然必有以折其氣而後可以要其成今嘉定之和敵有求於我歟我有求於敵歟彼欲得權幸之首則與之彼欲增嵗幣之數則與之屈己而和皆由於我敵情反覆寧無易我之心乎未及數期渝盟犯順然則和議詎可恃邪發明開禧至是宋遣使如金往來不一必飽其欲然後報聘其輕侮於宋可知也曰和議成譏宋也宋金不共戴天之讐纍世偷安固無足齒然縱不能定鼎於中原亦當保境自守勿與通和以示不忘大讐可也夫何既啓敵釁仍又乞盟屈己於戎有求必得意以讐不可復敵為可信女真之志遂矣其如宋室何哉莊公與齊通好君子以為親仇讐而譏之宋之和金奚異於是直書於册深貶之也冬十月以錢象祖史彌遠為左右丞相雷孝友知樞密院事樓鑰同知院事婁機參知政事金主璟卒衛王永濟立永濟世宗第七子也金主無子疏忌宗室以永濟柔弱鮮智能故愛之欲傳位焉會永濟自武定入朝金主已感疾遂留不遣金主殂元妃李氏黃門李新喜平章政事完顔匡等定策奉永濟即位廣義觀分注所載則知女真之運其衰矣乎噫女真之衰蒙古之盛天所以啓元祚而厭金德之衰歟贈趙汝愚太師沂國公諡忠定後追封福王發明汝愚輔相光宗有奠安宗社之功固非他相比也然誣遘讒忌以沒其身至是追復官爵加以褒贈是亦公論之不容泯者書以豫之宜矣十二月錢象祖罷己巳二年金主永濟大安元年春正月以樓鑰參知政事章良能同知樞密院事宇文紹節簽書院事夏四月金主永濟殺其故主璟妃李氏初章宗遺詔內人有娠者二人生男則立為儲二平章政事布薩端承金主意奏先帝承御賈氏當以十一月免乳今已逾期范氏産期合在正月今醫稱胎形已失願削髮為尼金主乃以范氏損其遺腹詔中外而殺元妃李氏承御賈氏以布薩端為右丞相發明永濟章宗之弟李氏章宗之妃永濟承章宗之統其可因讒而殺兄之妾乎蓋宮人損胎又非李氏之故永濟不能察理無辜殺之則是傷其故兄之情矣正名定分永濟安得而擅殺哉故綱目斥名而書殺所以深罪之也廣義永濟初立即肆殘忍而自斬其澤豈能享國久乎五月起復右丞相史彌遠彌遠以母憂歸治喪太子請賜第行在令就第持服以便咨訪發明有書起復者書起復何譏也非有金革之事奪人之喪自奪其喪皆非矣故雖以舊職起復而書若新職者所以志其非金革也然起復由君終喪由臣茍能力辭不起寧宗安得而強之乎蓋由慕富貴之心勝蔑禮法之心輕一聞起復怡然就道略無可否於其間者豈不深可哀哉直書起復其惡自可見矣廣義大抵居廟堂而與天子相可否者宰相也宰相之重即唐虞之百揆有周之冡宰故百官焉以表率庶民焉以仰賴為上為德為下為民社稷之安危係焉生民之休戚關焉誠所謂禮樂之原風化之本也詩云赫赫師尹民具爾瞻此之謂乎一有偏蔽則上無以正君下無以善俗所謂辟則天下僇者此也况孝為百行之源相乃百僚之倡烏可棄衰絰以叨富貴而犯不韙之名乎且明王以孝治天下也獨不思曰三年通喪貴賤無間孝宗能行三年之喪士庶賢之光宗不肯成服人心離二吾為首相奚可冒哀匿服上與天子相唯諾耶縱不愧於人獨不愧於心乎蓋心者一身之主宰萬事之本根此心既忍為此則何事而不可忍為耶其流毒至於殺濟王者此其心一念之忍故也厥後執政起復恬不知恥動以彌遠藉口甚則至於賈似道復以亡宋者皆彌逺之作俑也居是位者可不鑒諸蒙古入靈州夏主安全降夏自是益衰秋八月罷四川宣撫司冬十二月輝和爾國降於蒙古輝和爾唐之高昌也庚午三年金大安二年夏四月朔日食秋八月夏侵金葭州夏自天會初與金議和八十餘年未嘗交兵至是為蒙古所功求救於金金主永濟新立不能出師夏人怨之遂侵葭州金慶善努擊敗之而去冬十二月婁機罷機立朝能正言好稱奬人才不遺寸長訪問賢能疏列姓名及其可用之實以備采取至是以老罷蒙古侵金金主永濟嗣位有詔至蒙古傳言當拜受蒙古主問金使曰新君為誰使曰衛王也蒙古主遽南面唾曰我謂中原皇帝是天上人做此等庸懦亦為之邪何以拜為即乘馬北去金使還言永濟怒欲俟蒙古入貢就害之蒙古主知之遂與金絶益嚴兵為備數侵掠金西北之境其勢漸盛金人皇皇遂禁百姓傳説邉事發明外邦相攻不書此何以書著蒙古之漸強明女真之漸弱也侵者潛師入境之謂自是兵連禍結而浸為傾宋之謀矣故特謹而書之廣義金人之亡其兆於此且邉事之報是豈當禁者耶其禁百姓傳説邉事者即後唐怕見石郎之説也可笑也夫辛未四年金大安三年春三月臨安大火焚省部等宮舍延及太廟詔遷神主於壽慈宮三日火息仍還太廟省部皆寓治驛寺焚民居二千七十餘家發明臨安大火至是屢見矣嘉泰元年一書四年一書嘉定元年一書是年一書然前之所驗者為托胄擅權開邉啓釁而發此之所驗者為金人浸強漸為宋患之應嗚呼禍患未形而災異先見無非欲世主兢業自強勉於為善故耳宋之君臣方且既與敵盟常敦歡好而置邉事於不問豈有災異頻仍視為常數而般樂怠傲者尚可與論治國之道哉一書再書存後鑒也夏四月金使人求和於蒙古蒙古不許初納哈塔邁珠守北鄙知蒙古將侵邉奔告於金主金主曰彼於我無釁汝何言此邁珠曰近見其鄰部附從西夏獻女而造箭製楯不休凡行營則令男子乘車蓋欲惜馬力也非圖我而何金主以其擅生邉隙囚之及蒙古侵擾雲中九原連嵗不休遂破大水礫以進金主始恐釋邁珠而遣西北路招討使鈕祜祿哈逹求和蒙古不許金主乃命平章政事通吉遷嘉努參知政事完顔呼實行省事於撫州西京留守赫舍哩呼沙呼行樞密院事以禦蒙古廣義抑觀阿古逹之造金也何其智勇之多永濟之繼世也何其愚弱之甚噫此豈人之所能哉今也金人求和於蒙古蒙古不許昔也汴宋求和於金人金人亦嘗不許孰謂天道之不好還也哉六月遣使如金不至而還賀生辰也時金有蒙古之難不暇延使者至涿州而還尋詔江淮京湖四川制置司謹飭邉備發明昭二十三公如晉至河有疾乃復君子明其有疾乃復殺恥也寧宗遣使如金固多而一見止不得入以中國之胄萬乘之君執幣帛修敵國之好而不見納斯亦可哀矣胡氏曰有恥而後能知憤知憤而後能自強自強而後能為善為善而後能立身身立而後能行其政令保其國家矣寧宗內則受制於權臣外則見陵於強敵此正憂患疢疾有德慧術智保生免死之時也而安於屈辱甘處微弱無憤恥自強之心其國勢陵夷終於不振其自取之哉秋八月夏主安全卒族子遵頊立遵頊改元光定號安全曰襄宗蒙古攻金西京留守赫舍哩呼沙呼棄城遁金西北諸州皆降蒙古金通吉遷嘉努完顔呼實至烏舍堡未及設備蒙古兵奄至拔烏舍堡及烏雲營蒙古主乘勝破白登城遂攻西京凡七日呼沙呼懼以麾下棄城突圍遁去蒙古主以精騎三千馳之金兵大敗追至翠屏口遂取西京及桓撫州蒙古主復遣其子卓沁察罕台烏格台三人帥兵分取雲內東勝武朔豐靖等州由是金德興𢎞州昌平懷來縉山豐潤密雲撫寧集寧東過平欒南至清滄由臨潢過遼河西南至欣代皆降於蒙古發明呼沙呼既為留守親統強兵當蒙古驟至之時正委身報國之日則不辱君命矣不能以此自明而乃效匹夫之行遁逃茍免不亦恥乎由是西北諸州皆降蒙古其罪可勝誅哉特書棄城遁所以著其不知命之罪也金氏之亡於兹決矣閏九月金兵禦蒙古敗績於會河蒙古遂入居庸關大掠而去蒙古主既破撫州休士牧馬將遂南向金主復命招討使完顔紏堅監軍完顔萬努等率兵號四十萬駐野狐嶺以備呼實率重兵為後繼或謂紏堅曰蒙古新破撫州方以所獲賜其下馬牧於野當乘其不虞掩擊之紏堅曰此危道也不若馬步俱進為計萬全蒙古主聞之進兵於獾兒觜紏堅遣麾下明安問蒙古舉兵之故明安反降於蒙古以虛實告之蒙古主遂與紏堅等戰金兵大敗人馬蹂躪死者不可勝計蒙古乘鋭而前呼實畏其鋒不敢拒戰引兵南行蒙古兵踵擊之至會河堡金兵又大敗呼實僅以身免走入宣德蒙古兵乘勝薄宣德遂克晉安縣遊兵至居庸關守將完顔福夀棄關遁蒙古兵克之金中都戒嚴禁男子不得輒出城蒙古遊奕至都城下金主欲南奔汴會衛卒誓死迎戰蒙古兵損折頗多遂襲金羣牧監驅其馬而去金主乃止命秦州刺史珠格高琪屯通玄門外尋降呼實為咸平路兵馬總管將士以其罰輕由是益不用命發明春秋之法言敗不言戰均敵也書金兵禦蒙古敗績於會河所以惡金主失道故以金兵自敗為文行師之道當得老成之人今以四十萬衆而無所統又以小人臨之取敗之道也夫以步騎四十萬之衆一旦無故而敗績然則金之不亡豈有是理乎大掠而去所以見金人雖有精兵而人不用命師徒撓敗國勢漸危悲夫雖然金人慿陵中國占據土宇兵連禍結今而蒙古之侵殆亦天意假手以示好還之報耳夫豈偶然之故哉冬十一月朔日食金以圖克坦鎰為右丞相赫舍哩呼沙呼為右副元帥鎰為上京留守聞中都戒嚴曰事急矣乃選兵二萬遣同知烏克遜鄂屯將之入衛金主嘉之徴拜尚書右丞相先是鎰上言曰自國家與逹靼交兵以來彼聚而行我散而守以聚攻散其敗必然不若入保大城併力備禦昌桓撫三州素號富貴人皆健勇可內徒之以益兵勢人畜財貨不至亡失參政梁􅚻曰如此是自蹙境土也金主從􅚻謀鎰復奏曰遼東國家根本距中都數千里萬一受兵州府顧望必須報可誤事多矣可遣大臣行省以鎮之金主不悅曰無故置行省徒搖人心耳不從及失三州又聞東京不守金主乃大悔曰從丞相之言當不至此我見丞相恥哉呼沙呼之棄西京而還也至蔚州擅取官庫銀五千兩及衣幣諸物奪官民馬與從行人入紫荆關殺來水令至中都金主皆不問以為右副元師呼沙呼益無所忌憚自請兵二萬北屯宣德金主與之三千令屯媯川呼沙呼不悅金益都楊安兒兵起初益都人楊安國少無賴以粥鞍才為業市人呼為鞍兒遂自名楊安兒泰和中金人南侵山東無賴往往聚聚剽掠命州縣招捕之安兒時為羣盜亦請降𨽻名軍中纍官至防禦使及蒙古兵薄中都詔招鐡瓦敢戰軍得千餘人以唐古哈逹為都統安兒副之以戍邉安兒至雞鳴山不進亡歸山東與張汝楫聚黨攻劫州縣殺掠官吏山東大擾發明按劉氏書法曰兵起何盜也盜也曷為以兵起書金仇敵也然則曷為不書起兵衆詞也與起義者微異矣夏人蒙古侵不書寇敵不書盜皆所以貶而外之之詞也綱目之旨綦嚴矣哉後書起兵亦倣此壬申五年金崇寧元年春三月金赫舍哩呼沙呼有罪放歸田里呼沙呼欲移屯南口移文尚書省曰韃靼兵來必不能支一身不足惜三千兵為可憂十二關建春萬寧宮且不保金主惡其言下有司按問詔𢾗其十五罪罷歸田里蒙古克金宣德府蒙古主既克宣德遂攻德興府坎墉而登金人禦之蒙古兵不利蒙古主第四子圖壘與齊竒駙馬復擁楯先登而射之金兵引却蒙古遂盡拔德興境內諸城堡而去金人復守之夏五月安南王李龍􅧪死其壻陳日煚襲主國事龍􅧪卒子昊旵嗣尋卒無子以女昭聖主國事其壻陳日煚因襲取之李氏自公藴八傳凡二百二十餘年而易姓金河東陜西大飢斗米錢數千流莩滿野發明胡氏曰凡外災告則書所謂災者害及民物如水火兵戎飢饉旱乾之類是也是時女真中徵四境洶洶生民塗炭河東陜西根本之地而乃斗米錢𢾗千流莩滿野兼之兵戈四起魚肉羣黎金之業亦殆矣哉即綱目之所書驗金國之得失則人心天命可以觀矣金泰安劉二祖兵起掠淄沂州秋七月雷雨太廟屋壞權直學士院真德秀上疏曰臣博觀經籍史傳所志自非甚無道之世未聞震霆之驚及於宗廟者魯之展氏人臣耳己卯之異春秋猶謹書之蓋震霆者上天至怒之威宗廟者國家至嚴之地以至怒之威而加諸至嚴之地其為可畏也明矣古先哲王遇非常之變異則必應之以非常之德政未嘗僅舉故事而已今日避殿損膳之外咸無聞焉或者固已妄議升下務為應天之文而不究其實矣臣願升下內揆之一身外察諸庶政勉進君德毋以豢養安逸為心博通下情深求致異召和之本庶幾善祥日應咎徵日消矣發明文十三經書世室屋壞君子譏其怠慢蓋太廟天子祖宗之廟也書太廟屋壞譏久不修也何以知其久乎自常時不雨則無壞道也雷雨於七月而先君之廟壞不恭甚矣凡此皆志寧宗怠慢不謹事宗廟以致宋室衰削之由垂戒切矣廣義德秀之疏可謂通天人之至言也寧宗得此而不知省其無敬天之實可知己書曰逹於上下敬哉有土寧宗何足以知此癸酉六年金至寧元年九月以後宣宗珣真祐元年春正月宇文紹節卒二月樓鑰罷故遼人耶律琉格取金遼東州郡自立為遼王琉格契丹人仕金為北邉千户蒙古兵起金人疑遼遺民有他志琉格不自安遁至龍安聚衆至十餘萬自為都元帥遣使附於蒙古金遣呼實率兵往攻琉格大敗之遂自立為遼王改元元統盡有遼東州郡遂都咸平發明書故遼人豫義也遼為金滅不共戴天茍能倡義復君之地者亦綱目之所豫琉格遼國之胄既取故地自立為王少延遼國之祀豈不深可取哉故書豫之綱目急於復讐之意切矣夏四月以章良能參知政事五月夏侵金保安慶陽金主永濟復以赫舍哩呼沙呼為右副元帥秋八月呼沙呼弒永濟而立升王珣自為太師尚書令都元帥封澤王金主復用呼沙呼使將兵屯燕城北圖克坦鎰諌不聼呼沙呼與其黨完顔綽諾富察陸錦烏庫哩道喇等謀作亂會金主以蒙古兵在居庸關而呼沙呼日務馳獵不恤軍事遣使責之使者至呼沙呼怒遂妄稱知大興府圖克坦南平反奉詔入討分其軍為三由章義門入自將一軍由通玄門入恐城中兵出拒先遣一騎馳抵東華門大呼曰韃靼至北關已接戰矣既又遣一騎往亦如之使其黨圖克坦金夀召圖克坦南平南平不知至廣陽門呼沙呼遇之於馬上手刃殺之完顔石古乃聞亂召兵五百迎戰不勝皆死之呼沙呼至東華門護衛實呼竒爾等納之呼沙呼入宮盡以其黨易宿衛自稱監國都元帥居大興府陳兵自衛召聲伎與親黨會飲明日以兵逼金主出居衛邸遣武衛兵二百固守之呼沙呼欲除拜其黨令黃門入宮收璽尚宮左夫人鄭氏掌寶璽拒之曰璽天子所用呼沙呼人取將何為黃門曰今天時大變主上且不保况璽乎御侍當思自脫計鄭氏厲聲罵曰若輩宮中近侍恩遇尤隆君難不以死報反為逆竪奪璽邪我死可必璽必不與遂瞑目不語黃門乃還呼沙呼復遣人奪取宣命之寶除拜其黨數十人丞相圖克坦鎰以墜馬傷足在告聞難作命駕將入省或告之曰省府皆以軍士守不可入矣少頃軍士索人於閭巷鎰乃還第呼沙呼欲僣位猶豫不決以鎰人望乃詣訪之鎰從容謂曰翼王章宗之兄顯宗長子衆望所屬元帥決䇿立之萬世之功也呼沙呼默然乃遣宦者李思中弒金主於邸時完顔綱將兵十萬行省事於縉山呼沙呼誘而殺之因盡撤沿邉諸軍赴中都平州騎兵屯薊州以自重遣圖克坦鎰迎升王珣於彰德九月至燕即位立其子守忠為太子追廢永濟為東海郡侯後追復衛王諡曰紹發明書復以赫舍哩呼沙呼為右副元帥二過之詞也春秋之法趙盾以不越境而書弒許世子止以不嘗藥而書弒鄭歸生以憚老懼讒而書弒楚公子比以不能效死不立而書弒齊陳乞以廢長立幼而書弒呼沙呼身為元帥親行悖逆執其主於宮使宦者李思中弒之謀立升王尚復何辭綱目凡專國之臣於其進爵則必以自為書之况呼沙呼擁兵脅制弒君立幼天子在其掌握則以自為太師尚書令都元帥封澤王書之夫豈過哉例以春秋誅心之法參諸綱目之所書而益信廣義永濟暗弱呼沙呼暴橫難乎免於其弒矣若然非蒙古能亡女直女直自亡之耳於蒙古乎何尤冬十月蒙古大敗金將珠格高琪於懷來進圍燕高琪還殺呼沙呼金主以高琪為左副元帥蒙古兵至懷來金元帥右監軍珠格高琪拒之敗績僵尸四十餘里蒙古乘勝至古北口金兵保居庸不能入蒙古主乃留克特卜齊等頓兵拒守而自以衆趨紫荆關敗金兵於五回嶺拔涿易二州分命哲伯將兵反自南口攻居庸關破之出北口與克特卜齊軍合既而又選諸部精兵五千騎竒爾台哈台二將圍守中都方蒙古兵至早河欲渡高橋呼沙呼病足乘車督戰蒙古兵大敗翌日再戰呼沙呼創甚不能出期高琪以乣軍五千拒之高琪失期不至呼沙呼欲斬之金主以其有功諭令免死呼沙呼乃益其兵令出戰戒之曰勝則贖罪不勝斬汝高琪出戰自夕至曉北風大作吹石揚沙不能舉目金兵大潰高琪自度必為呼沙呼所殺乃以糾軍入中都圍呼沙呼之第呼沙呼聞難作登後垣欲走衣絓墜而傷股軍士就斬之高琪取其首詣闕請罪金主赦之因詔暴呼沙呼之罪奪其官爵以高琪為左副元帥一行將士論功行賞發明殺者殺無罪也呼沙呼弒君之賊法所必討金不能殺而高琪殺之宜也何不書誅而書殺原情也呼沙呼固為有罪然高琪之殺非誠於討賊者特因師敗懼誅殺之所以避己之罪耳故書殺而不書誅不豫其討有罪也金主不别可否遂受元帥之職何其名器之倒施乎然則綱目上書蒙古大敗珠格高琪而下書高琪還殺呼沙呼則其義亦深切而著明矣豈以亂賊之故而遂廢權衡之公哉廣義呼沙呼暴橫而弒其主天假手於髙琪殺之嗚呼上天之降罰豈爽其報復哉蒙古以史天倪為萬户屯霸州時蒙古穆呼哩統兵侵金所向殘破永清人史秉直聚族謀曰方今國家喪亂吾家百口何以自保既而知降者皆得免乃率里中數千人詣涿州軍門降穆呼哩欲用秉直辭乃以其子天倪為萬戶領降人家屬屯霸州十二月夏取金涇州蒙古分兵拔金河北河東諸州郡蒙古主留竒爾及哈台屯燕城北分降人楊伯遇劉林漢軍四十六都統并韃靼兵為三道命其子卓沁察罕台烏格台三人為右軍循太行而南破保州中山邢洛磁相衛輝懷孟諸郡徑抵黃河大掠平陽太原别將克特卜齊等遵海而東破灤薊大掠于遼西之地蒙古主自將與子圖壘由中道破雄漠清滄景獻河間濱隸濟南等郡引兵復自大口以逼中都時中原諸路之兵皆僉往山後防遏悉僉鄉民為兵上城守禦蒙古盡驅其家屬來攻父子兄弟往往遙呼相認由是人無固志故所至郡邑皆下凡破金九十餘郡兩河山東𢾗千里人民殺戮幾盡金帛子女牛馬羊畜皆席卷而去屋廬焚燬城郭邱墟惟大名真定青鄆邳海沃順通州有兵堅守未能破甲戌七年金真祐二年春正月章良能卒三月召安丙同知樞密院事未至改知潭州丙使所愛吏安蕃何九齡合官軍夜襲秦州敗歸沔州都統制王大才執九齡等七人斬之而訟丙於朝故有潭州之命金以其故主永濟之女歸蒙古夏四月及蒙古平蒙古主還自山東屯燕城北諸將請乘勝破燕蒙古主不從遣使諭金主曰汝山東河北郡縣悉為我有汝所守惟燕京耳天既弱汝我復迫汝於險天其謂我何我今還軍汝不能犒師以弭我諸將之怒耶金丞相高琪言於金主曰韃靼人馬疲病當決一戰完顔承暉曰不可我軍身在都城家屬各居諸路其心向背未可知戰敗必散茍勝亦思妻子而去社稷安危在此一舉莫如遣使議和待彼還軍更為之計金主然之遂遣承暉求和蒙古主欲得其公主金主乃以東海郡侯少女及金帛童男女各五百馬三千與之蒙古主引歸出居庸關取所虜山東兩河少壯男女數十萬皆殺之金主以蒙古既和大赦其國內廣義分注云金遣承暉往求和且許以公主歸之金銀男女各五百嗚呼金索宋金銀未已尋以之而許蒙古所謂黃雀利於螳螂而挾彈者已在其後矣天綱之密良可畏夫然則書曰及者何以見金人之汲汲然也兩國強弱之勢判矣金以布薩安貞為山東安撫使金左丞相圖克坦鎰卒金主將遷都於汴鎰曰鑾輿一動北路皆不守矣今已講和聚兵積粟固守京師䇿之上也南京四面受兵遼東根本之地依山負海其險足恃備禦一面以為後圖䇿之次也金主不從鎰尋卒鎰明敏方正學問該貫一時名士皆出其門廣義圖克坦鎰諫遷都䇿最為有得金主不聼者是自促其亡也而由乎蒙古哉五月金主珣徙都汴扈衛乣軍叛降蒙古秋七月蒙古復圍燕金主以國蹙兵弱財用匱乏不能守中都乃議遷於汴諫者皆不納五月命平章政事都元帥完顔承暉左丞穆延盡忠奉太子守忠留守中都遂與六宮啓行蒙古主聞之怒曰既和而遷是有疑心而不釋憾特以解和為疑我之計耳復圖南侵金主至良鄉命護衛乣軍元給鎧馬悉復還官乣軍怨之遂作亂殺其主帥素溫推卓多必實哷勒扎拉爾三人為帥北還完顔承暉聞變以兵阻盧溝卓多擊敗之軍勢既張遣使乞降於蒙古蒙古主遂遣明安援卓多合其兵圍燕京金主聞之遣人召太子應奉翰林文字完顔素蘭以為不可平章珠格高琪曰主上居此太子冝從且汝能保都城必完乎素蘭曰完固不敢必但太子在彼則聲勢俱重邉隘有守則都城無虞昔唐明皇幸蜀太子實在靈武蓋將以擊天下之心也不從竟召太子太子既行中都益懼發明孟子曰遷國以圖存者權也守正而效死者義也是時西北盡失所存者燕京乃金咽喉之地必守而不可棄也况既與敵和復謀遷汴不惟人心不從抑且敵得藉口既而扈衛軍亂敵復圍燕自是燕京甫失敵長驅以至於汴矣然則金之遷國果何益哉茍信圖克坦鎰之言勿為忘動則國亦未至於遽亡也惜乎金主不足以語此耳吁廣義蒙古之於女直嘗欲得其瑕釁而指為興兵之端金之南遷適足以為蒙古之口實也且逆女未幾而敗盟蒙古肆侮於金也甚矣然則蒙古之必欲追取詎可以盟誓要乎罷金嵗幣時金人屢遣使來督嵗幣起居舍人真德秀上疏請絶之其略曰女真以蒙古侵陵徒巢於汴此吾國之至憂也蓋蒙古之圖滅女真猶獵師之志在得鹿鹿之所走獵必從之既能越三關之阻以攻燕豈不能絶黃河一帶之水以趨汴使蒙古遂能如劉聰石勒之據有中原則疆場相望便為鄰國固非我之利也或如耶律德光之不能即安中土則姦雄必將投隙而取之尤非我之福也今當乘敵之將亡亟圖自立之䇿不可幸敵之未亡姑為自安之計也夫用忠賢修政事屈群䇿收衆心者自立之本訓兵戎擇將帥繕城池飭戍守者自立之具以忍恥和戎為福以息兵忘戰為常積安邉之金繒飾行人之玉帛女真尚存則用之女真強敵更生則施之強敵此茍安之計也升下以自立為規模則國勢日張人心日奮雖強敵驟興不能為我患以茍安為志嚮則國勢日削人心日偷雖弱金僅存不能無外憂蓋安危存亡皆所自取若夫當事變方興之日而示人以可侮之形是堂上召兵戶內延敵也微臣區區竊所深慮反覆𢾗千言帝納之遂罷金國嵗幣發明自金人暴慢江左偷安稱叔姪增嵗幣委為固然略無可否則是辱祖宗而尊敵國睃百姓以益強鄰其敵愾之氣為之大屈矣兹因真德秀之言遂罷金之嵗幣可謂能從善者耳宋人此舉差強人意故特表而出之以鄭昭先簽書樞密院事夏人請會師伐金不報夏人以書來四川議夾攻金以恢復故疆時董居誼初入蜀不之報由是邉訊中絶發明書夏人請會師伐金豫向義也書不報譏失䇿也宋金世讐理宜報伐幸而夏人請討三面合兵破之必矣奈何姑息之心久讐恥之念忘違而不報豈禮也哉安有堂堂天朝忘其至恨逮夫邉夷請討拂而不從者其無能為明矣是故豫在夏人則罪在宋室矣九月朔日食蒙古將穆呼哩攻金遼西州郡下之穆呼哩進兵攻金北京守將銀青帥衆二十萬禦於花道敗還嬰城自守其禆將完顔實哷高德玉等殺銀青推音逹琿為帥穆呼哩命史天祥等趣兵進攻音逹琿遂舉城降穆呼哩怒其降緩欲坑之蕭額森曰北京為遼西重鎮既降而坑之後豈有降者乎穆呼哩從之奏音逹琿權北京留守以烏頁爾權兵馬帥府事以鎮之於是金順成懿通州相繼降於蒙古冬十二月金濰州李全兵起全濰州北海農家子鋭頭蜂目權譎善下人弓馬趫捷能運鐡鎗人號李鐡鎗開禧中戚拱嘗結之以復漣水金主遷汴賦斂益橫河北山東遺民保寨阻險群聚為盜寇掠州郡皆衣紅衲襖以相識時目為紅襖賊全與仲兄福亦聚數千鈔掠山東劉慶福國安用鄭衍德田四於洋於潭等皆附之金張鯨據錦州自稱臨海王附於蒙古時興中府石天應亦降蒙古乙亥八年金貞祐三年春二月雷孝友罷金布薩安貞擊楊安兒安兒敗死三月安貞復破劉二祖斬之布薩安貞至益都敗安兒於城東安兒奔登州刺史耿格納之安兒遂僣號置官屬改元天順衆數十萬安貞復與山東行省完顔霆經厯洪果將花帽軍討敗之殱其衆安兒乘舟入海欲走岠􅀈山舟人曲成等擊之安兒墜水死無子其妹四娘子狡悍善騎射劉全收餘黨奉之稱曰姑姑衆尚萬餘掠食至磨騎山李全以其衆附之楊氏因與私通遂以為夫安貞遣瓜爾佳錫爾格破劉二祖斬之餘黨推霍儀為帥彭義斌石圭夏全時青裴淵葛平楊德廣王顯忠附焉金主遣兵救燕與蒙古兵遇於霸州大潰夏五月中都留守右丞相完顔承暉自殺蒙古遂入燕時金中都被圍既久完顔承暉以穆延盡忠久在軍旅悉以兵付之而自總持大綱又遣人以礬寫奏告急金主命左監軍永錫將中山真定軍左都監烏庫哩慶夀將大名軍萬八千西南路步騎萬一千河北軍一萬御史中丞李英運糧大名行省富珠哩調遣繼發以救中都英至大名得兵數萬馭衆素無紀律三月英被酒與蒙古兵遇於霸州北大敗盡失所運糧英死士卒殱焉慶夀永錫軍聞之皆潰歸自是中都援絶內外不通承暉與盡忠會議期同死社稷盡忠不從承暉怒即起還第然兵柄既皆屬盡忠承暉無如之何乃辭家廟召左右司郎中趙思文謂之曰事勢至此惟有一死以報國家耳五月一日承暉作遺表付尚書省令史師安石書之皆論國家大計及平章政事高琪姦狀且謝不能終保都城之罪從容若平日盡出財物召家人隨年勞多寡分給之舉家號泣承暉神色泰然方與安石舉白引滿謂之曰承暉於五經皆經師授謹守而力行之不為虛文既被酒取筆與安石訣最為倒寫二字投筆曰遽爾謬誤得非神志亂邪謂安石曰子行矣安石出門聞哭聲復還問之則已仰藥死矣家人匆匆瘞庭中是日暮凡在都中妃嬪聞盡忠將南奔皆束裝至通玄門盡忠給之曰我當先出與諸妃啓途諸妃信之盡忠乃與愛妾及所親者先出城不復反顧蒙古兵遂入都中吏民死者甚衆宮室為亂兵所焚火月餘不滅時蒙古主在桓州聞燕陷遣使勞明安等而輦其府庫之實北去於是金祖宗神御及諸妃嬪皆淪沒焉盡忠行至中山謂所親曰若與諸妃皆來我輩豈得至此安石奉承暉遺表至汴贈尚書令廣平郡王諡忠肅盡忠至汴金主釋不問仍以為平章政事未幾以謀逆伏誅發明區區金事浸不可為者中都圍久糧盡援絶正宜選將擇兵使之往救而乃以素無紀律之李英將之是弟子輿尸而又不正也若曰金兵非有能潰之者金自潰之焉耳數萬之兵一時潰散金之不亡又可得乎承暉固守中都竭其智力為穆延盡忠所制知事無成仰藥而死是亦明於君臣之大義者矣回視偷生迎降之徒豈不異哉故書自殺所以豫其殺身成仁之義也臨難無茍免承睴無愧焉或以付託非人而罪承暉則誤矣廣義完顔承暉之死可謂盡忠於金矣綱目不以死節豫之而以自殺書者何蓋承暉死於蒙古未入燕之前而不死於蒙古入燕之後故也觀其書遂入燕其義見矣秋七月以鄭昭先參知政事曽從龍簽書樞密院事八月金命侯摰行尚書省事於河北冬十月夏取金臨洮蒙古攻金潼關不克遂自嵩山趨汴金人敗之乃還蒙古主駐軍魚兒濼遣繖格巴圖帥萬騎自西夏趨京兆以攻潼關不能下乃由嵩山小路趨汝州遇山澗輒以鐡鎗相鎖連接為橋以渡遂赴汴京金主急召花帽軍於山東蒙古兵至杏花營距汴京二十里花帽軍擊敗之蒙古兵還至陜州適河氷合遂渡而北金人專守關輔時蒙古兵所向皆下金主遣使求和蒙古主欲許之謂薩木哈曰譬如圍場中獐鹿吾已取之矣獨餘一盍遂舍之薩木哈恥於無功不從遣人謂金主曰若欲議和可去帝號稱目當封汝為王議遂不成十一月復遣使如金賀正旦也刑部侍郎劉鑰等及太學諸生上章言其不可不報發明莊八年師及齊師圍郕君子以親仇讐為罪今寧宗與金主不與共戴天無時焉可通也而遣使往賀正旦是忘親釋怨不義甚矣夫賀者親執玉帛往之彼國捧觴上夀屈滕於敵以為有人心者冝於此焉變矣故削其使名而特曰復遣以著其罪當時劉爚諸臣非不諫諌而不聼寧宗何其愚哉以真德秀為江東轉運副使德秀朝辭奏五事一曰宗社之恥不可忘言國家之於金人蓋萬世必報之讐高宗孝宗值其方強不得已以太王自處而以勾踐望後人今天亡其國近在朝夕誠能以待敵之禮而遇天下之豪傑以遺金之費而厲天下之甲兵人心奮張士氣自倍何憚於金人而猶事之哉且重於絶彼者畏召怨而啓釁也然能不召怨於亡金而不能不啓釁於新敵權其利害孰重孰輕臣願升下勉勾踐之良圖懲謝元之失䇿則王業興隆可冀矣二曰比鄰之道不可輕言蒙古及山東之盜茍得志而鄰於吾莫大之憂也願朝廷毋輕二敵日夜講其攻守之策以逆杜窺窬之心三曰幸安之謀不可恃言今之議者大抵以金之存亡為我欣戚聞危蹙之報則冀其非實得安靜之耗則幸其必然是猶以朽壤為垣而望其能障盜賊也願升下自強之志恢立武之經毋以敵存為喜敵亡為畏則大勢舉矣四曰導諛之言不可聼言今邉事方殷正君臣戒懼之日而薦紳大夫工為諛説或以五福足恃為言夫乾象告愆邇日尤甚其可恃讖緯不經之説而忽昭昭之警戒乎惟升下鑒天人之相因察諛佞之有害益修其本以格天休宗社之慶也五曰至公之論不可忽言公論國之元氣也元氣痞鬲不可以為人公論湮鬱不可以為國深未今日實公論屈伸之機朝廷之上若以言者為愛君為報國無猜忌之意而有聼用之誠則公論自此愈伸若以言者為沮事為徼名無聼用之誠而有猜忌之意則公論自此復屈夫公論伸屈乃治亂存亡之所繇分故臣於篇終反復極言惟升下亮臣愚忠也廣義分注載德秀之論五事可謂老成謀國者矣於時寧宗遂當惕然於中昭示其書於中外與群臣朝夕策勵君臣未睦思以睦之國用未足思以足之邉境未備思以備之士卒未訓思以訓之若之何而為君子必欲進之若之何而為小人必欲退之虛心以受直言勿拒諫也誠心以待臣下勿外貌也固我國本無先敵人俟敵有釁然後起而圖之可也昔者有論中國禦戎之䇿以為中國之處外敵如富人與貧人鄰冝待之以禮結之以恩高其墻垣威以刑法蓋待之以禮者使命往來嚴夫條約禮數以束之結之以恩者嵗遺餘物以飽飫之高其墻垣則高城深池以堅吾之守備威以刑法則俟其有釁然後興師問罪斯言得之矣寧宗君臣不此之慮而徒欲恢復正孔子所謂暴虎馮河者也君子奚取焉十二月蒙古穆呼哩殺張鯨鯨弟致復據錦州自稱瀛玉蒙古以張鯨總北京十提領兵從奪呼蘭薩里必南征鯨懷反側穆呼哩覺之令蕭額森監其軍至平州鯨稱疾逗遛不進額森執而殺之鯨弟致憤其兄被害乃殺長史據錦州自稱瀛王改元興隆略平灤瑞利義懿廣寧等州下之穆呼哩帥先鋒蒙古布哈權帥烏頁爾等軍討之州郡皆復降蒙古丙子九年金貞祐四年春二月朔日食東西兩川地大震馬湖夷界山崩入十里江水不通發明事有未形而應先見者機有未發而兆先成者可見天道之與人心焉可誣也地乃隂質而外患小人乃隂類東西兩川地為大震則強敵竊發之機萌矣不踰年而金人又至變不虛生信哉宋君目茍能明此益飭邉備思患預防則天道之警於我乎得焉惜其不能以自是懼逮夫金兵既臨倉卒遣備嗚呼亦晚矣綱目特書於册以見天道人心有感必應常相符而不相遠者爾噫夏四月遼王琉格降蒙古蒙古主以為元帥令居廣寧府金以胥鼎為尚書左丞行省事於平陽鼎知平陽府聞蒙古兵渡潼關遣必喇阿嚕岱圖克坦百家帥兵萬五千由便道濟河以趨關陜而自以精兵援汴京又遣布薩薩固珠帥兵會諸將以拒蒙古之自關而東者金主以其忠拜鼎左丞遣還平陽六月張致降金金以致行北京路元帥府事秋七月金郝定稱帝於山東侯摰討殺之時摯移行省於東平獲紅襖賊訊之知其渠帥郝定僣號署官改元已攻陷滕兖單諸州萊蕪新泰等卜餘縣道路不通摯帥師進擊執定送汴京誅之冬十月蒙古克金潼關蒙古兵次嵩汝間金御史臺言敵兵踰潼關崤沔深入重地近抵西郊彼知京師屯宿重兵不復叩城索戰但以遊騎遮絶道路而别兵攻擊州縣是亦困京師之漸也若專以城守為事中都之危又將見於今日况公私蓄積視中都百不及一此臣等所以寒心也願升下命陜西兵扼距潼關與伊爾必斯為犄角之勢選在京勇敢之將十數各付精兵隨冝伺察且戰且守復諭河北亦以此待之金主以奏付尚書省平章珠格高琪曰臺官素不習兵備禦方略非所知也遂止高琪以蒙古兵日逼欲以重兵屯駐汴京以自固州郡殘破不復恤金主惑之國勢益衰十一月蒙古穆呼哩圍錦州殺張致穆呼哩以致兵精且依險為阻欲設竒取之乃遣烏頁爾等别攻溜石山堡且諭之曰汝等急攻溜石賊必遣兵往援我出其不意斷其歸路可一戰擒也又令蒙古布哈别屯永德縣西十里以伺之致聞溜石被圍果以兵救蒙古布哈遣騎扼其歸路且馳報穆呼哩夜半引軍疾馳比曙抵神水與致遇而蒙古布哈兵亦會前後夾擊大破之致遂奔潰進圍錦州致屢戰不利乃閉門拒守月餘其監軍高益縳致出降穆呼哩殺之金胥鼎敗蒙古於平陽鼎慮蒙古兵扼河乃檄綘解隰吉孟五州經略司相與會師為夾攻之勢及蒙古自三門析津北渡至平陽鼎遣兵拒戰蒙古兵敗乃去金以苗道潤為中都經略使道潤貞祐初為河北義軍隊長以擊群盜有功屢遷知中山府頃之復有是命道潤有勇略敢戰鬪能得衆心前後撫定五十餘城署保定張柔為元帥右監軍行元帥府事丁丑十年金興定元年春正月金主珣謀伐夏不果金主命選兵三萬五千圖門呼圖克們統之西征尚書左丞胥鼎馳奏以為非便略曰北兵經過之後民食不給兵力未完若又出帥非獨饋運為勞民將流亡愈至失所或宋人乘隙而動復何以制之此繫國家社稷大計方今事勢止當禦備南邉西征未可議也遂止尋進鼎平章政事封莘國公地震二月金尚書省請罷府州學生廪給金主不許尚書省以軍儲不繼請罷州府學生廪給金主曰今自古文武並用向在中都設學養士猶未嘗廢况日乎其令仍舊給之發明觀金主於國家顛沛流離之際而能不忘養士之心亦可以知所本矣特書於册蓋豫之也三月金以武仙同知真定府事金主徵山東兵接應苗道潤共復中都而石海方據真定叛慮為所梗乃集鈕祜祿貞郭文振威州刺史武仙所部精鋭與東平為犄角之勢圖之武仙率兵斬石海及其黨二百餘人降葛仲趙林張立等軍盡獲海僣擬物故有是命夏四月金人分道入寇詔京湖江淮四川制置使趙方李珏董居誼飭兵禦之初金有王世安者獻取盱眙楚州之䇿金主以為淮南招撫使遂有南侵之謀珠格高琪復勸金主侵宋以廣疆土金主始猶不然至是命烏庫哩慶夀完顔薩布帥師南侵遂渡淮犯光州中渡鎮執榷場官盛允升殺之慶夀分兵犯樊城圍棗陽光化軍别遣完顔阿林入大散關以攻西和階成州朝廷聞之詔趙方李珏董居誼俱便冝行事以禦之先是金右司諌許古上疏請遣使與宋議和則蒙古聞之亦將斂迹不冝用兵以益敵金主即命古草議和牒文既成示參政高汝礪汝礪言有哀祈之意徒示微弱無足取者議遂寢平章政事胥鼎亦切諌南侵有六不可高琪不從金主以南北用兵西夏復擾財匱兵弱為憂集百官議守禦之策高琪心忌之有所言皆不用發明嗚呼金人自取滅亡之道矣是時北有蒙古之侵西有夏人之擾惟東南粗安盜賊充斥正宜保境自治尚恐弗支今信姦謀搆兵於宋則是東南西北腹背受敵雖欲不亡其可得乎雖然金與蒙古世為仇讐不能北向一決却乃稱兵犯順是豈剛則不吐柔則不茹之道哉故下書救棗陽金人敗走所以見中國非久屈者又以見仇敵非可結之以信也綱目可謂深切著明者矣廣義金主不虞蒙古之吞噬與夫宋讐之將復反惑於珠格高琪之言而欲南侵以自廣是猶寒疾不汙之人而飯乎秫也嗚呼殆哉金侯摯遣兵擊劉二祖餘黨執霍儀斬之其衆皆散時濟南泰安滕兖等州賊並起摯遣完顔霆率兵討之霆自清河出徐州斬儀前後斬首千餘招降偽元帥石圭夏全餘衆皆潰五月趙方遣統制扈再興鈐轄孟宗政等救棗陽金人敗走金人犯襄陽棗陽方語其子范葵曰朝廷和戰未定觀此益亂人意吾策決矣惟有提兵臨邉決戰以報國爾遂抗疏主戰因親往襄陽檄統制扈再興陳祥鈐轄孟宗政等禦之仍增戍光化信陽均州以聮聲勢金人來自團山勢如風雨再興等分三陳設伏以待既至再興中出一陳復郤金人逐之宗政與祥合左右兩翼掩擊之金人三面受敵大敗血肉枕籍山谷間尋報棗陽圍急宗政午發峴首遲明抵棗陽馳突如神金人大駭宵遁方聞捷大喜以宗政權知棗陽軍未幾京湖將王辛劉世興亦敗金兵於光山隨州六月詔伐金詔略曰仇讐肆彼憑陵天厭久矣鋌走不能擇音人競逐之若能立非常之勳則亦有不次之賞遂傳檄招諭中原官吏軍民從趙方之請也發明帝舜命禹征有苗其詞曰咨禹惟時有苗弗率汝徂征禹乃會羣后誓於師曰濟濟有衆咸聼朕命蠢兹有苗昏迷不恭侮慢自賢反道敗德君子在野小人在位民棄不保天降之咎肆豫以爾衆士奉詞代罪爾尚一乃心力其克有勳江沱宴安今已四世惟事姑息不思復讐今而敵人侵擾又非有苗負固不服之比宋金世讐又非有苗自賢之比既已見犯理宜報伐特書詔伐金所以見天理之在人心有不可得而泯沒者所以示中國有復讐之義明人心有逆順之機而宋人此舉誠為義聲丕振矣故書以深豫之廣義復讐之舉宋刻骨不銷者也而金軍方南侵則宋為有辭而直在宋矣此詔可謂適時而與托胄之詔不同也雖然宋於是時不能自固國本適足以為亡金之續耳可悲也哉東川大水太白經天秋七月朔日食發明大水者隂逆所成太白者悖戾所結日食者陽道之虧是時金人入寇兵連禍結則其應亦深切而著明矣凡綱目所書災異不言事應而事應具存未聞有其應而無其事者是以天道人心嘗相符而不相遠所以世之人主要當戒謹恐懼無時不然而流連荒亡之行勿使暫萌於胸中也奚可以為易而忽之哉李全率衆來歸詔李珏等節制京東忠義軍時李全等出沒島崓寶貨山積而不得食相率食人會鎮江武鋒卒沈鐸亡命山陽誘致米商獲利數十倍知楚州應純之償以玉貨北人至者輒舍之鐸因説純之以歸銅錢為名弛渡淮之禁由是來者莫可遏初楊安兒之未敗有意歸朝定遠民季先者大俠劉佑家厮養也嘗隨佑部綱客山陽楊安兒見而悅之處以運職安兒死先至山陽寅緣鐸得見純之道山東豪傑願歸正之意純之命先為機察諭意群豪以鐸為武鋒副將與高忠皎各集忠義民兵分二道伐金先遂以全五千人附忠皎忠皎與合兵攻海州糧援不繼退屯東海純之見北軍屢捷密聞於朝謂中原可復時頻嵗小稔朝野無事丞相史彌遠鑒開禧之事不明招納密敕珏純之慰接之號忠義軍就聼節制給忠義糧於是東海馬良高林宋德珍等萬人輻輳漣水李全等生羡心焉八月金以河南為中京冬十二月李全及其兄福襲金青莒州取之蒙古以穆呼哩為太師經略山南蒙古主以穆呼哩有佐命功拜太師國王承制行事賜誓劵金印分鴻吉哩等十軍及蕃漢諸軍並𨽻麾下建行省於燕雲且謂之曰太行之北朕自經略太行之南卿其勉之穆呼哩乃自中都南攻遂成及蠡州皆下之初蠡州拒守力屈乃降穆呼哩怒將屠其城時州人趙瑨從穆呼哩為署百户泣曰母與兄在城中乞以一身贖一城之命哀懇切至穆呼哩義而許之遂東擊齊定臨􅀈登萊等州而去蒙古圍夏興州夏主遵頊出奔西涼發明遵頊有民人焉有社稷焉蒙古內侵不能死守委而出奔不亦弱乎李氏之國從此衰微而不振矣直書出奔深罪之也戊寅十一年金興定二年春正月以李全為京東路總管二月金人圍棗陽孟宗政擊敗之宗政權棗陽初㫝事一愛僕犯新令立斬之軍民股栗於是築隄積水修治城堞簡閲軍士至是完顔薩布擁步騎圍城宗政與扈再興合兵角敵厯三月大小七十餘戰宗政身先士卒金人戰輒敗忿甚周城開濠控兵列濠外飛鋒鏑以綯鈴自警鈴響則犬吠宗政厚募壯士乘間突擊金人不能支盛兵薄城宗政隨方力拒隨州守許國援師至白水鼓聲相聞宗政率諸將出戰金人奔潰金人焚大散關入早郊堡三月利州統制王逸將兵復之進攻秦州至赤谷而潰金完顔阿林入早郊王師死者五萬人逾月王逸帥官軍及忠義人十萬復之追斬金統軍完顔贇進攻秦州至赤谷口沔州都統劉昌祖命退師且放散忠義人軍遂大潰夏四月金人陷西和成階州及河池興元都統吳政敗之乃去金兵合長安鳯翔之衆復攻早郊遂趨西和州劉昌祖焚城遁還時西和守臣楊克家成州守臣羅仲甲階州守臣侯頥以昌祖遁皆棄城走金兵遂入諸州前後獲糧九萬斛錢數千萬軍實不可勝計復犯大散關守將王立亦遁又犯黃牛堡吳政拒却之政至大散關執立斬之以徇事聞政進三官昌祖奪官竄韶州克家等並竄遠州發明甚矣宋之武功若是乎其不競也觀敵騎長驅入蜀如焚大散關入早郊堡陷西和階成及河池守將聞風而靡棄城逃奔而罔敢與之拒者獨王逸將兵復之吳政將兵敗之而中國之氣庶幾少伸賴有此耳嗚呼以久安之宋不能敵殘敝之金以殘敝之金反能敵久安之宋何耶蓋金以積威之勢故雖敗亡而其氣猶存宋以委靡之習故雖全盛而其風尚在是以立國者貴乎自強也故併及之五月金中都經略副使賈瑀殺苗道潤道潤將張柔討之至紫荆關遇蒙古與戰被執遂降蒙古道潤素與瑀有隙一日從數騎出瑀伏甲射之道潤顛於道左從者駭散有何伯祥者獨下馬掖道潤道潤悶絶不能乘馬瑀伏發前突伯祥奮鎗大呼殺數人賊乃遁去伯祥取道潤所佩金虎符以出令疾足間道以聞道潤之衆無所依部將靖安民代領之賈瑀不自安遣使告張柔曰吾得除道潤者以君不助兵故也柔怒叱使者曰瑀殺吾所事吾食瑀肉且未足怏意反以此言相戲邪遂檄召道潤部曲告以復讐之意衆皆羅拜推柔為長柔方會兵趨中山而蒙古兵出自紫荆關柔遇之遂戰於狼牙嶺柔馬跌為蒙古兵士所執至軍前見主帥明安柔立而不跪左右強之柔叱曰彼帥我亦帥也大丈夫死即死終不偷生為他人屈明安壯而釋之其潰卒稍稍來集明安空柔為變質其二親於燕京柔歎曰吾受國原恩不意猖獗至此顧忠孝不兩立姑為二親屈遂降蒙古以柔為河北都元帥發明賈瑀積憤而殺道潤張柔伐之可謂能倡義者故以討豫之然其降蒙古之事則不能無憾焉蓋柔戰敗被執奮志不降後因質其二親由是降之亦不得已耳漢遼西太守趙苞鮮卑劫質苞母苞不顧進戰母乃遇害苞遂嘔血而死程子論曰以君城降賊而求生其母固不可矣然亦當求所以生母之方奈何不顧而遽戰乎必不得已身往降之可也徐庶於此蓋得之矣尹氏發明曰苞急於王事遂至不能全其母故雖嘔血而死綱目亦略而不書所以權輕重而示訓也據趙張之事考程尹之説則是張柔之降為親所屈又非趙苞不顧之比然綱目亦略而不書其故則其輕重之權衡亦略可見矣抑又論之趙苞忠於王事不能全母程子何以議其非然則有父子而後有君臣其輕重為可見禮曰父母在不許友以死則其輕重為可知故程子曰以君城降賊固不可必不得已身往降之夫如是則得以兩全而無害云爾程子之言豈欺我哉廣義柔之所處即徐庶之事也其賢於王陵遠矣厥後終臣於蒙古而反為鄉道以滅金則其害於義也可勝言哉金石州人國安用來降詔以安用同知孟州事秋八月蒙古穆呼埋復攻取金河東諸州郡金元帥烏庫哩德升等死之穆呼哩圍太原環之數匝金元帥烏庫哩德升力拒之城西北隅壞德升聫車塞之三却三登矢石如雨守陴者不能立城破德升至府署謂其姑及妻曰吾守此數年不幸力窮乃自縊而死行省參政李革守平陽兵少援絶城陷或謂革宜上馬突圍出革歎曰吾不能保此何靣目見天子汝輩可去矣遂自殺節度使完顔恩徹亨守汾州元帥右監軍納哈塔布拉圖守潞州城破皆力戰而死發明烏庫哩德升等不過兜鍪之武臣尚能為君守地竭力禦之逮夫事不可支或自縊而死或自殺而死或力戰而死無一偷生面縛乞降者由其明於順逆之道故耳噫以一勇之夫皆能為君死義况中國士大夫背國事讐烏可以人名哉故綱目亦以全節豫之所以為人臣事君不忠之勸垂訓之義益深切矣冬十二月金主珣遣使來求和不納遂使其太子守緒會兵入寇金主欲乘勝來議和以開封府治中呂子羽為詳問使至淮中流不納逎去由是和好遂絶金主以布薩安貞為左副元帥輔太子守緒南侵發明晉顯元和八年春趙遣使來修好詔焚其幣君子豫之蓋宋氏立國江左奄奄略無振起之氣獨至女真遣使來求和不納是舉差強人意大書揭之蓋幸之也廣義嗚呼昔也宋之衰也求成于金而金不許今也金之衰也求成於宋而宋亦不許焉報復之勢其有窮乎曰然則何為而可曰自治而已人不求成於我我不求成於人國之富庶則修文德以守之耳周之成康漢之文景其庶幾焉己卯十二年金興定三年春正月金人復寇西和成鳯州入黃牛堡吳政拒戰死之政既死金人乘勝攻武休關都統李貴遁還權興元府事趙希昔棄城走金人遂入興元府沔州都統張威使石宣邀擊之於大安軍大破之殱其精兵三千人俘其將巴圖魯安金人乃遁去發明嗚呼宋之守將不過徒擁虛名一聞敵至莫不望風逃奔惟恐或後獨吳政以忠政自守前既大敗金人此復力拒金人勢不能支卒死於難其正大之氣屹然如山不可撼矣若政之忘身徇國者幾何人哉故綱目特書死之所以豫其全義也垂訓之意切矣金人復大舉圍棗陽趙方使知隨州許國等率師攻唐鄧以救之金額爾克圍棗陽塹其外繞以土城方計其空巢穴而來若搗其虛則棗陽之圍自解乃命國及扈再興引兵三萬餘分二道出攻唐鄧二州又命其子范監軍葵為後殿發明凡書救者未有不善之也是時金兵猖獗大舉圍城棗陽之危奚啻焚溺趙方部分諸將率兵救之然何以不直赴棗陽而乃攻唐鄧耶此吳子救蔡之義春秋所以為善救也故書豫之以曽從龍同知樞密院事任希夷簽書院事希夷嘗從朱熹學篤信力行為禮部尚書以朱熹張栻呂祖謙皆已賜諡而周惇頥程皓程頥張載四人為百代絶學之倡尚未贈諡乃上言乞定議賜諡朝廷從之金人入洋州竄董居誼於永州以聶子述為四川制置使守臣蔡晉卿遣兵拒之不克洋州遂陷金人焚其城而去居誼自利州遁還詔竄之夏人請會師伐金詔許之三月以鄭昭先知樞密院事曽從龍參知政事金人寇淮西知楚州賈涉使李全救却之詔加全廣州觀察使金人圍安豐軍及滁濠光州江淮制置使李珏命池州都統制武師道忠義軍都統制陳孝忠救之皆不克進金人遂分兵自光州犯黃州之麻城自濠州犯和州之石磧自盱眙犯滁州之全椒來安及揚州之天長真州之六合淮南流民渡江避亂諸城悉閉金遊騎數百至采石楊林渡建康大震時涉以淮東提刑知楚州節制京東忠義慮忠義人兵為金所用乃遣陳孝忠向滁州石硅夏全時青向濠州季先葛平楊德廣趨滁濠李全李福要其歸路李全進至渦口與金左都監赫舍哩約赫德駙馬阿哈連戰於化湖陂殺金將數人得其金牌金人乃解諸州之圍而去金追擊之復敗之於曹家莊而還金人自是不敢窺淮東初涉募能殺金太子者賞節度使殺親王者賞承宣使殺駙馬者賞觀察使全因致所得金牌於涉云殺駙馬阿哈所獲者涉請於朝乞如約受賞遂授全廣州觀察使而阿哈實不死也發明宋之名器至是益濫矣李全雖有拒却金人之功然而偶獲金牌詭稱已殺駙馬遂授觀察之使殊不知實為全之所欺也蓋全本降賊初非心乎宋者幸而纍勝不過優之以金帛而未可加之以官爵小人之心得志浸驕逮至他日之亂豈不實基於此乎由辨之不早也故綱目揭而備書於册其謹微之意深矣興元卒張福等作亂夏四月陷利州聶子述走保劒門福掠閬果興元軍士張福莫簡作亂以紅巾為號入利州聶子述退保劒門檄醴泉觀使安丙子知果州癸仲兼節制軍馬任討賊之事癸仲召沔州都統制張威等帥兵來會福等殺總領財賦楊九鼎遂掠閬果州曽從龍罷復以安丙為四川宣撫使張福等作亂四川大震張方魏了翁移書宰執謂安丙不起則賊未即平蜀未可定雖賊亦曰須安相公作宣撫使事乃定耳李壁李􅌫亦以國事勉丙丙乃至果州會詔丙為宣撫知興元府利州路安撫使民心始安發明復以者悔過之詞也是時張福作亂攻陷城邑其勢危矣董居誼之為制使而乃棄城逃歸聶子述之為制使而亦走保劒門其無謀可知安丙素得蜀心廢置既久兹因張方等之薦復為宣撫則人心從此而安盜賊從此而息矣可見衆小人收之為不足一君子安之為有餘是以為國者當得人才以輔治之也故下書討張福誅之乃所以著其功耳若丙可謂不辱君命而能行己志者焉特書於册蓋豫之也金築汴京裏城初珠格高琪請修南京裏城金主曰此役一興民滋病矣城雖完固能獨安乎高琪固請築之既而金主慮擾於民募人能致甓五十萬者遷一官百萬升一等於是平陽判官完顔阿拉左廂譏察霍定和發蔡京故居得二百萬有竒準格遷賞金主一日問曰人言此役恐不能就高琪曰茍防城有法正使兵來臣等愈得效力金主曰與其臨城曷若不令至此為善高琪無以對及城成高琪受金鼎之賞建碑書功於會朝門發明鑿斯池築斯城與民守之效死勿去此固國君守社稷之正義然必有其説焉與其敵來而守之曷若未至而拒之金主惑高琪之邪策築汴京之裏城不過用民力於無用之地耳地雖利而人不和孰為我守哉由是以守汴為得計而以防敵為非謀河北河東置之度外汴京亦從而困疲矣據事直書不再貶而其義自見廣義珠格高琪不務內治之修決意遷都南京其為計左矣既遷矣未聞其施一善政出一良策今又增築裏城所以為禦敵之計可謂左中之左者也嗚呼秦皇長城豈不固耶適足以為炎漢之資耳賈誼所謂秦之亡者仁義不施而攻守之異也然則恃險固不可與修德比亦其勢則然耳觀者勿以辭害義可也蒙古張柔侵金獲賈瑀殺之金武仙與戰於滿城敗績河北郡縣多降蒙古蒙古使柔帥兵南下遂克雄易保安諸州柔必欲誅賈瑀而瑀據孔山臺柔攻之不下臺無井泉汲山下柔先斷其汲道瑀窮乃降柔縛瑀剖心以祭苖道潤遂引兵次於滿城武仙會鎮定深冀兵數萬攻之柔全軍適出帳下才數百人柔命老弱婦女乘城自率壯士突出仙兵後毁其攻具從數騎策馬杖槊大呼入圍仙衆皆披靡復使緑山多張旗幟聲言救至曳柴揚塵鼓譟以進仙兵大潰柔追擊之尸陳數十里柔乘勝攻完州下之於是祁陽曲陽等帥皆降於柔柔遂圍中山府仙遣其將葛鐵鎗與柔戰於新樂飛矢中柔頰落其二齒柔拔矢以戰葛鐵鎗大敗死者數千人仙復遣劉成攻柔柔又敗之遂南掠金鼓城深澤寧晉諸縣由是深冀以北鎮定以東三十餘城望風降附柔之威名震於河朔發明殺者殺無罪也張柔此舉不為非義然何以不書誅而書殺原情定罪也賈瑀雖有擅殺苗道潤之罪然亦為金之臣子張柔既已降敵則於金君臣之義乖雖有殺瑀報道潤之心亦不過以賊攻賊固不足取矣然前史皆以誅賈瑀為文而分注亦然是未得去取之公也綱目正色書之曰殺所以罪柔之失節不以討賊之義豫之也然後權衡正而逆順明諸家之説不攻自破矣夫豈以作史常法而視之哉廣義張柔金之元帥也其為苗道潤報仇是矣當其降於蒙古非其本心也為二親屈也其既降矣則當以計出二親而歸於金可也烏可反攻金之城而略金之地哉故綱目書蒙古張柔者罪其反金也前書討賈瑀而此不書討而書殺者柔既反金而不豫其討賊也後欲叛逆者盍亦知所戒矣六月安丙討張福誅之福衆薄遂寧權府事程遇孫棄城走福入遂寧焚其城遂入普州守臣張已之棄城走福屯於普州之茗山安丙自果州如遂寧下令諸軍合圍絶其樵汲之路以困之張威兵至福窮青降威執之以獻於丙丙命臠其黨王才以祭楊九鼎而誅福既而張威捕莫簡及賊衆一千三百餘人誅之紅巾賊悉平丙班師還治於利州孟宗政扈再興合擊金人於棗陽大敗之追至鄧州而還金元帥額爾克擁步騎傅城宗政囊粳盛沙以覆樓棚列甕瀦水以隄火募炮手擊之一炮輒殺數人金人選精騎二千號弩手擁雲梯天橋先登又募鑿銀礦石工晝夜塪城運茆葦直抵圜樓下欲焚樓宗政先燬樓掘深坑防地道創戰棚防城損穿穽才透即施毒煙烈火鼓韛以薰之金人窒以濕氊折路以刳土城頺樓陷宗政撤樓益新架火山以絶其路列勇士以長鎗徑弩備其衝距樓陷所數丈築偃月城翼傅正城金人摘強兵披厚鎧氈衫鐵靣而前又濕氊濡革蒙火山擁雲挮徑抵西北圜樓登城城中軍以長戈舂其喉殺之敢勇軍自下夾擊金兵墜死燎熖金人連不得志會扈再興許國兩道並進掠唐鄧境焚其城柵糧儲金頓兵棗陽城下八十餘日趙方知其氣已竭乃召國再興還併東師𨽻於再興尅其合戰再興敗金人於瀼河又敗之城南宗政自城中出擊內外合勢士氣大振賈勇入金營自甫至三更殺其衆三萬金人潰額爾克單騎遁獲其資糧器甲不可勝計追金人至馬磴寨焚其城入鄧州而還金人自是不敢窺襄漢棗陽中原遣民來歸以萬數宗政發廩贍之給田創屋與居籍其勇壯號忠順軍俾出沒唐鄧間宗政由是威振境外金人呼為孟爺爺發明金人之圍棗陽至是已踰半載繯其城邑絶往來之使禁樵採之途其危甚矣內而孟宗政竭力捍禦外而扈再興合兵赴援此其所以大獲金勝也二將之功為如何哉惜其不能併力恢復至鄧遽還為可憾耳此綱目既豫其功又譏其餒也廣義嶽武穆嘗云師以曲直為老壯以逆順為強弱蓋金人無故南侵則曲逆在金故其師必老且弱此金之所以屢敗也宋以金之南侵而興師以伐之則直順在宋故其師必壯且強此宋之所以屢勝也兵志曰同力度德同德度義此之謂歟秋七月李全復齊州九月以賈涉主管淮東制置司節制京東河北軍馬初山東來歸者日衆而石圭以計殺沈鐸於漣水應純之亦罷去權楚州梁丙無以贍之季先乞預借兩月糧然後帥所部五千并馬良等萬人往密州就食丙不許先請速遣李全代領其衆丙亦不從而以石圭權軍務圭乃奪運糧之舟渡淮大掠至楚州南渡門焚燬幾盡丙遣人諭之不止知盱眙軍賈涉上書言忠義之人源源而來不立定額自為一軍處之北岸則安能以有限之財應無窮之需飢則噬人飽則用命其勢然也朝廷命涉節制忠義人兵涉受命即遣傳翼諭石圭楊德廣等以逆順禍福圭等乃謝罪涉慮其人衆思亂因滁濠之役分石圭陳孝忠夏全為兩屯李全為五寨又用陜西義勇法涅其手合諸軍汰者三萬有竒涅者不滿六萬人正軍尚屯七萬使主勝客朝廷嵗省費什三四至是分江淮為三司乃命涉管淮東蒙古恃穆津伐西域諸國金張林以山東諸郡附李全來歸詔以林為京東安撫使初蒙古克益都不守而去益都府卒張林與其黨復立府歸金以功為治中凶險不逞知府田琢在山東徵求過當甚失衆心林率其黨逐之琢戰敗乃還汴林遂據益都山東諸郡皆附之林欲歸附以自固而未決會李全自齊州還揣知林意乃薄兵青州城下遣人陳説國家威德勸林早附林恐全誘已猶豫未納全挺身入城惟數人從林乃開門納之相見甚歡謂得所托置酒結為兄弟全既得林要領附表奉青莒密登萊濰淄濵隸寧海濟南十二郡版籍來歸表辭有云舉七十城之全齊歸三百年之舊主詔授林武翼大夫京東安撫使兼京東總管冬十二月趙方使扈再興許國孟宗政帥師分道伐金方以金人屢敗必將同時並攻當先發以制之乃遣再興等帥師六萬分三道而進戒之曰毋深入毋攻城第潰其保甲燬其城寨空其資糧而已發明宋氏南渡奄踰四世國步多艱未遑遠略今女真搆兵安忍塗炭生民方且移戈南向志吞江表宋能不畏其強思所以自立朝議稍稍振起至是趙方帥師分道伐金雖未能一舉蕩定然亦足覘其意何之所在矣揭而書之所以尊中國存正統示人以克復之意其垂訓也大矣廣義趙方戒諸將之辭可謂得其機而握其要者歟李全襲泗州不克而還時大雨雪淮氷合全請於賈涉曰每恨泗州阻水今如平地全請取東西城自效涉許之全以長鎗三千人從夜半渡淮潛向泗之東城將踏濠氷傅城下掩金人不備俄城上荻炬數百齊舉遙謂全曰賊李三汝欲偷城耶天黑故以火燭之全知有備乃引兵還金右丞相珠格高琪有罪伏誅高琪自執政專固權寵擅作威福與平章政事高汝礪相倡和高琪主機務汝礪掌利權附己者用不附者斥凡言事忤意及負才力或與己頡頑者對金主陽稱其才使幹當於河北隂置之死地又以己為相不得兼樞密元帥以欖兵柄乃與汝礪力勸金主南侵置河北於意外凡精兵皆集河南茍且嵗月不肯輒出一卒以應方面之急至是使奴薩布殺其妻因歸罪於薩布而殺之以滅口事覺金主久知其姦遂下高琪於獄殺之初金主將遷汴欲置乣軍於平州高琪難之及發中都金主戒摶多厚撫乣軍摶多輒殺數人且勸金主取其元給器用故有卓多之難而中都以亡金主嘗嘆曰壞天下者高琪摶多二人也廣義高琪之罪路人所知也綱目書曰金右丞相珠格高琪有罪伏誅者以見金主於國步艱難之秋尤能奉行天討也蒙古攻高麗降之蒙古兵襲叛人於契丹經高麗之境高麗人洪大宣降且為鄉導共攻其國國王暾降自是交通使命往來不絶也庚辰十三年金興定四年春正月扈再興許國攻唐鄧州皆不克而還發明恢復與兼并異兼并謂之貪兵恢復謂之義兵宋失中原子孫有能恢復之計者皆當豫之故前書李全襲泗州不克而還此書扈再興許國攻唐鄧州不克而還皆無貶詞一以存中國之體二以伸義士之氣三以示不忘讐恥之心其與春秋書乾時之戰雖敗亦榮者同意固非豫其窮兵黷武也君子詳觀綱目所書之旨思過半矣其與晉書禇裒帥師伐趙不克而還同義孟宗政敗金人於湖陽三月金胥鼎致仕夏四月蒙古陷孟州金封經略使王福等九人為郡公分河北山東地以𨽻之初太原為蒙古所有河北州縣不能自立金主詔百官議所以為長久計翰林承旨圖克坦高等十六人謂制兵有三曰戰和守今欲戰則兵力不足欲和則彼不肯唯冇守耳河朔州郡既殘毁不可一槩守之宜取願就遷徒者屯於河南陜西不願者許自推其長保聚險阻宣徽使伊喇光祖等謂當募土人威望服衆者假以方面重權能復一道即授以本道總管能捍州郡即授以長佐必能各保一方宰臣欲置公府金主意未決中丞完顔伯嘉曰宋人以虛名致李全遂有山東茍能統衆守土雖三公何惜金主曰他日事定公府無乃多乎伯嘉曰若事定以三公就節鎮何不可金主從之乃封滄州經略使王福為滄海公以清觀滄州鹽山無隸樂陵東光寧津吳橋將陵阜城修縣𨽻之河間招撫使伊喇重嘉弩為河間公以獻蠡安深州河間肅寧安平武強饒陽六家莊郎山寨𨽻之真定經略使武仙為恆山公以真定府沃冀威鎮寧平定州抱犢寨欒城南宮縣𨽻之中都東路經略使張甫為高陽公以雄霸莫州高陽信安文安大成保定靜海寶坻武清安涎縣𨽻之中都西路經略使靖安民為昜水公以涿易安肅深州君氏川季鹿三保河北江礬山寨青白口朝天寨水谷歡谷東安寨𨽻之遼州刺史行元帥府事郭文振為晉陽公河北東路皆𨽻之平陽招撫使胡天作為平陽公以平陽晉安府隰吉州𨽻之昭義節度使完顔伯開為上黨公以澤潞沁州𨽻之山東安撫副使燕寧為東莒公以益都府路皆𨽻之九公皆兼宣撫使總帥本路兵馬署置官吏徵斂賦稅賞罰號令得以便冝行之除已畫定所管州縣外如能收復鄰近州縣者亦聽管屬同時九府財富兵強唯武仙耳廣義金主此舉最為有識不猶愈於蒙古之所取邪六月賈涉誘殺漣水忠義軍副都統季先其下推石圭為帥以拒涉李全自化湖陂之捷有輕諸將心以季先威望出已上隂結賈涉所任吏莫凱使譛先欲反涉信之乃以計命先赴樞密院議事於道殺之而遣統制陳選總先衆於漣水先部曲裴淵宋德珍孫武正王義深張山張友六人拒選不納而潛迎石圭於盱眙奉為統帥圭道楚城涉不之覺遂入漣水選還涉恥之謀分圭軍為六請於朝出修武京東路鈐轄印誥各六授淵等以分統先衆淵等陽從命而實不奉涉教令涉恐甚詔以圭為漣水忠義軍統轄發明季先初無遇惡特因李全忌而譛之故誘而殺之不得為天討也故書誘殺而不去其官既而季先之衆違涉教令而推石圭為帥以拒之然則激變之禍涉實尸之故直書以著其罪廣義李全狼子野心豈可以人理待之邪彼其化湖陂之捷有輕諸將心賈涉被其詐而以觀察使授之則既愚於前矣今又信其讒而殺季先果何義哉夫事茍出於非義則於人情為不順冝乎其下之拒命也烏有為國大臣而誘人以殺之耶書曰誘者譏涉也秋七月金使人如蒙古求和金使烏庫哩仲端如蒙古求和呼蒙古主為兄蒙古主不允八月金嚴實據青崖崓以魏博等郡來歸李全遂會張林襲東平敗績乃還金長清縣令嚴實為主將所疑挈家壁於青崖崓依益都張林以避之會趙拱以朝命諭京東過青崖實因求內附拱奉實欵至楚州賈涉以聞實亦分兵四出所至州縣皆下於是太行之東皆授實節制實乃舉魏博恩德懷衛開相等郡來歸涉因再遣拱往諭配以兵二千李全亦請往涉不能止乃帥楚州及盱眙忠義萬人以行拱説全曰將軍提兵渡河不用而歸非示武也今乘勝取東平可乎全乃合張林軍得數萬襲東平之城南金行省蒙古綱帥師固守全與林夾汝水而寨詰旦金監軍王庭玉以騎兵三百奄至全欣然上馬帥帳前所有騎赴之殺數人奪其馬逐北抵山谷遇金龍虎上將軍鄂博台盛兵以出旁有繡旗女將持槍突鬪全幾不免會諸將赴救拔全以出乃退保長清精鋭喪失大半全恐所携鎮江軍五百人懷憤乃使拱先將之以歸而自以餘衆道滄州假鹽利慰贍之尋還楚州發明金之臣來歸何以不書叛宋正陵遲幸其來也雖金臣有向義之心而宋不當納叛起釁故其書法如此見宋之不能知彼知己矣廣義李全輕佻非干城器也彼嚴實以魏博等郡來歸自歸耳奚可輕舉妄動而遂襲東平哉其能脫虎吻者幸焉張林攻金滄州王福以城降太子詢卒諡曰景獻安丙遣兵會夏人伐金丙遣夏人書定議同舉約以夏兵野戰我師攻城遂命利州統制王仕信帥師赴熙秦鞏鳯翔委丁焴節制且傳檄招諭陜西五路官吏軍民發明安丙遣兵伐金初非君命不亦專乎綱目書之何以略無貶詞是時宋遷江表中原淪於敵國在朝諸人宴安自肆曽不以讐敵為念獨丙志在恢復能以伐金取蜀為己任是以前書丙討張福誅之下書會夏人伐金是皆示其豫之之意也明乎此則知為臣者當以徇國為心為國者當以紹復為念而好攻戰務邀攻者與此異矣復海州以徐晞稷知州事夏取金會州金遣使如夏議和金恆山公武仙以真定降蒙古穆呼哩以史天倪權知河北西路兵馬事仙副之穆呼哩至滿城使蒙古布哈將輕騎三千出倒馬關適武仙遣葛鐵鎗攻臺州蒙古布哈與之遇葛鐵鎗戰敗仙遂舉城降史天倪説穆呼哩曰金中原已粗定而大兵所過猶縱鈔掠非王者弔民伐罪之意且王為天下除暴豈可效他軍所為乎穆呼哩善之即下令禁剽掠遣所俘老幼軍中肅然廣義大抵人心天理其機甚微而其應則甚速失此則亡得此則興其興其亡捷於影響惟視天理所在何如耳嗚呼蒙古始事而有可觀如此雖欲不元其可得乎九月夏人圍金鞏州官軍會之不克而還夏遣其樞密使寧子寧率衆二十萬圍鞏州且來趣兵王仕信帥師發宕昌四川宣撫司統制質俊李實帥師發下城安丙命諸將分道進兵沔州都統張威出天水利州都統程信出長道興元都統陳立出大散關統制田冒出子午谷金州都統陳昱出上津威下令所部諸將毋得擅進兵於是諸將遲疑不進質俊等克來遠鎮敗金人於定遠城王仕信克鹽川鎮程信引兵會夏人於鞏州攻城不克遂趨秦州夏人自定遠寨退師信復邀夏人共攻秦州不從遂自伏羌城引兵還諸將皆罷兵信以宣撫司命斬仕信於西和州罷威官發明其曰官軍貶金人也曰不克而還譏不果也既與夏人合兵伐金便當遄行毋致疑二而張威小人方且下令毋得擅進為言人心得無解體乎故書不克而還所以明其自止也豈不深可惜哉蒙古遣使如金蒙古主遣逹呼報金謂烏庫哩仲端曰向欲汝主授我河朔地彼此罷兵汝主不從今念汝遠來河朔既為我有關西數城未下者則割付我令汝主為河南王勿復違也冬十月金以時青為濟州宣撫使封滕陽公青與叔父全俱為紅襖賊及楊安兒劉二祖敗青承赦降𨽻軍中為濟州義軍萬戶後附李全來歸處之龜山有衆數萬至是金元帥赫舍哩約赫德遣人招之青以書乞假邳州以屯老幼當襲取盱眙盡定淮南以贖罪金主乃封青為滕陽公本處兵馬總領元帥兼宣撫使而未授以邳廣義公爵人臣之極者也金於時青既知為賊又公其爵則其國政之缺失蓋可見矣不亡何待書曰爵罔及惡德金人曷足以知之十一月蒙古穆呼哩入濟南嚴實復以魏博等郡降蒙古穆呼哩既戢士卒州郡悅附遂以輕騎入濟南嚴實挈所部三府六州戶三十萬詣軍門降穆呼哩承制拜實行尚書省事實將李信乘實出殺其家屬來降實攻信殺之復取青崖崓金人襲蒙古穆呼哩於濟南大敗穆呼哩進圍東平時金兵二十萬屯黃陵岡遣步卒二萬襲穆呼哩於濟南穆呼哩迎戰敗之遂薄黃陵岡金兵陳河南岸穆呼哩令騎下馬短兵接金兵大敗溺死者衆穆呼哩遂進陷楚邱由單州趨東平圍之蒙古耶律楚材進庚午元厯楚材都木逹王托雲八世孫金尚書右丞履之子貞祐三年為中都行省員外郎中都陷遂降於蒙古蒙古主嘗訪遼宗室召楚材謂之曰遼金世讐吾為汝報之矣楚材對曰臣祖父以來嘗北面事之既為臣子豈敢復懷二心讐君父邪蒙古主重其言命處左右備訪問楚材通術數之學尤邃於太玄時從征西域以金大明厯不應製庚午元厯上之蒙古主每征伐必令楚材預卜吉凶亦自灼羊脾以符之然後行廣義楚材八世祖遼之宗室也後人不能復讐而降金豈直二其心哉忘君父之大讐者也其既降於金矣則楚材乃金之臣也又不忠於金而降於蒙古則是自祖及孫舉懷二心而忘君以事讐者也何無愧心慚德而以懷二心之説告蒙古哉譬猶女之失身者雖其色越南威技成天巧不足貴也易曰見金夫不有躬無攸利其楚材之謂乎十二月石圭叛降蒙古賈涉命李全併將其軍石圭以入漣水非賈涉本意心懷不安而李全復請討圭於涉涉遂以全所統衆列於楚州之南渡門而移淮隂戰艦於淮岸以示圭有備因命一將招圭軍來者增錢糧不至者罷支給衆心遂散圭伎窮乃殺裴淵而挾孫武正宋德珍降於蒙古穆呼哩以圭為元帥圭既去漣水之衆未有所屬李全求併將之涉不能郤遂以付之發明前書推石圭為帥則圭猶為宋之臣子故不絶之也今而降敵直書曰叛者所以著其背主降敵正其不赦之罪也石圭中國之將今以私憤之故遂懷異圖則其罪可勝誅乎即綱目所書觀之可見誅亂臣討逆賊而為扶天理之至公也嗚呼微矣時青自金來附以為京東鈐轄蒙古穆呼哩以嚴實權山東西路行省事金兵固守東平不下穆呼哩謂嚴實曰東平糧盡必棄城去若然汝即入城安輯之勿苦郡縣以敗事也乃留蘇嚕克圖以蒙古兵屯守之以實權行省謂千戶薩里台曰東平破可命嚴實石圭分城內南北以守之遂北還金易水公靖安民為其下所殺安民出兵至礬山取擔車寨會蒙古兵圍安民所居山寨守寨者以安民妻子及老弱出降安民軍中聞之駭亂衆議欲降以保妻子安民不從遂遇害辛巳十四年金興定五年春正月時青入泗州西城二月金人來救青敗乃還金會兵於蔡州入寇三月陷黃蘄州引還扈再興李全追擊敗之初金人寇蘄知州李誠之百計禦之會黃州失守金人併兵攻蘄城始陷誠之并其妻子官屬皆死之金兵退再興邀擊於天長敗之及渡淮北去全又大敗之發明自金再冦遽陷蘄黃知州李誠之闔門死節向微再興李全之追敗則中國辱矣故特書以著其功金東莒公燕寧與蒙古戰敗死夏五月朔日食蒙古取金東平使嚴實石圭守之金以蒙古綱行省於邳州王庭玉行元帥府於黃陵岡東平被圍久糧道復絶行省蒙古綱監軍王庭玉不能守率衆南趨邳州蒙古蘇嚕克圖邀擊斬首七千級嚴實遂入城建行省於府第薩里台以穆呼哩命中分其城以嚴實撫安東平以北恩博等州石圭移治曹州書法為將得人敵人皆其役也穆呼哩雖古良將不是過焉六月立沂王嗣子貴和為皇子更名竑帝以國本未立命選太祖十世孫年十五嵗以上者教育宮中如高宗擇普安王故事於是立貴和為皇子以貴誠為秉義郎貴誠初名與莒燕懿王德昭之後希瓐之子也母全氏家於紹興山隂縣初慶元人余天錫為史彌遠府童子師性謹厚彌遠器重之彌遠在相位久以帝未有儲嗣而沂靖惠王近屬亦未有後欲借沂王置後為名隂擇宗室中可立者以備皇子之選會天錫告還鄉秋試彌遠密語之曰今沂王無後宗子賢厚者幸具以來天鍚渡浙舟抵越西門會天大雨過全保長家避雨保長知其為丞相客具雞黍甚肅須臾有二子侍立天鍚異而問之保長曰此吾外孫趙與莒與苪也日者嘗言二兒後當極貴天鍚因憶彌遠言及還臨安以告之彌送命召二子來保長大喜鬻田治衣冠集姻黨送之且詫其遇及見彌逺善相大竒之恐事泄不便遽使復歸保長大慙逾年彌遠忽謂天錫曰二子可復來乎天錫召之保長辭謝不遣彌遠乃使天錫密諭保長曰二子長者最貴宜還撫於其父家遂載至臨安及貴和立為皇子乃補與莒秉義郎賜名貴誠年十七矣發明貴和乃太祖十世之孫德昭之後帝以國本未立特命選之此天下之至公也直書皇子定名分也名分定之於此然後史彌遠不可挾私以廢之矣此綱目豫子之法所以防其僣竊之階人心天命於斯可見君子之為世慮豈不至深切哉此綱目謹於微之意也秋八月任希夷罷以宣繪同知樞密院事俞應符簽書院事京湖制置大使趙方卒方病革曰未死一日當立一日紀綱及卒人皆思之方少從張栻學初知青陽縣告其守史彌遠曰催科不擾是催科中撫字刑罰無差是刑罰中教化人以為名言方守襄漢十年以戰為守合官民兵為一體通制總司為一家許國之忠應變之略隱然有樽俎折衝之風故金人擾邉淮蜀大困而京西一境獨全能用名人如陳䀭遊九功輩皆拔為大吏扈再興孟宗政皆自土豪推誠擢任致其死力卒為名將故能藩屏一方使朝廷無北顧之憂發明趙方忠藎自守堅如鐵石守邉十年以身徇國抗疏主戰務雪仇耻此皆實德之可稱者觀其未死一日當立一日紀綱之言茍非心乎宋室者安能言之若是乎此固宋仁義之將而非他將之可及也卒而具官豈過豫之哉九月立宗室貴誠為沂王後貴誠凝重寡言潔修好學每朝參待漏他人或笑語貴誠獨儼然出入殿庭矩度有常見者斂容彌遠益異之至是立為沂靖惠王後廣義昔詩人詠周王嗣續綿長有曰瓜瓞綿綿蓋謂瓜之生也至於近根莖者反小及其蔓延於後則漸大焉今也宋之太祖德澤入人之深不幸而有太宗為之弟其一念之不仁天已鑒於𡨕𡨕之中而不善其報矣今使沂王絶嗣德昭有後嶷然於閭閻之間而重器漸有所托太祖血食漸有可親者豈非上天默祐太祖及人之德也哉書曰作善降之百祥作不善降之百殃其宋之太祖太宗之謂歟冬十月夏人復乞會師伐金蒙古穆呼哩侵夏夏人以兵附之遂取金葭州及綏德州十一月圍延安府穆呼哩由東勝州涉河引兵而西夏主聞之遣塔爾海監府等宴穆呼哩於河南且遣塔海甘布將兵五萬屬焉十月穆呼哩引兵東行入葭州金將王公佐遁穆呼哩以石天應權行臺守葭而自將兵攻綏德破馬克戎兩寨夏遣瑪爾布往會之瑪爾布問穆呼哩相見之儀穆呼哩曰汝主見我主即其禮也瑪爾布曰未受命不敢即拜因引衆去至是穆呼哩攻延安瑪爾布始贄馬而拜金帥哈逹與納哈塔邁珠禦之哈逹以兵三萬陳於城東蒙古將蒙古布哈先以騎士三千趨之約半夜伏發穆呼哩乃命軍士銜枚潛進伏於城東兩谷間明日蒙古布哈望見金兵佯棄旗鼓走金兵追之穆呼哩出伏乘其後鼓鼙震天金兵大亂穆呼哩追殺七千餘人哈逹走入延安城堅壁不出穆呼哩以城池堅深猝不可拔乃留軍圍之而自將兵南攻鄜坊等州四川宣撫使安丙卒詔以崔與之為四川制置使盡護蜀軍丙在四川以攻為守威功甚著朝廷賴之及卒詔與之盡護四蜀之師與之開誠布公拊循將士人人悅服軍政復立張林叛降蒙古穆呼哩以林行山東東路都元帥李福自膠西逃歸李全既併將漣水忠義益驕悍輕朝廷及遊金山作佛事以薦國殤知鎮江府喬行簡方舟逆全大合樂以享之全歸語其徒曰江南佳麗無比須與若等一到始造舭􅭥舟謀爭舟楫之利焉膠西當登寧海之衝百貨輻輳全使其兄福守之為窟宅計時互市始通北人尤重南貨價增十倍全誘啇人至山陽以舟浮其貨而中分之自淮轉海逹於膠西福又具車輦之而稅其半乃聽往諸郡貿易車夫皆督辦於張林林不能堪林財計仰六鹽場福恃弟有恩於林欲分其半林許福恣取鹽而不分埸福怒曰若背恩邪待與都統提兵取君頭耳林懼其黨李馬兒説林歸蒙古林遂以京東諸郡請降於蒙古穆呼哩以林行山東東路益都滄景濵隸等州都元帥府事福狼狽走還楚州林猶遺賈涉書言非已叛實由李福也發明張林自金來歸此背主降人已屬叛臣今無故而復降蒙古則又背宋而去觀小人之進退失據何其反覆之若是乎故直書叛以著其不赦之罪蓋林之叛皆李福兄弟相激而成今張林作亂不能捕獲奉頭鼠竄忠安在耶逃者匹夫之事以將帥之尊下效匹夫之行書逃歸不明深貶之也福等既激林反又從而逃之又豈事君之道也哉噫此綱目之所以為綱目而非君子莫能修之者矣廣義自古爭利之臣鮮有不敗其國事者賈涉得無罪乎十二月鄭昭先罷閏月遣使如蒙古通好也蒙古尋遣使來報壬午十五年金元光元年春正月朔受恭膺天命寶於大慶殿大赦初鎮江都統翟朝宗得璽於金師獻於朝既而趙拱又得玉印文與璽同而加大朝廷喜受之行慶賀禮大赦賈涉遺書彌遠謂天意隱而難知人事切而易見當思今日人事尚未有可答天意彌遠不懌發明書曰無教逸欲有邦兢兢業業一日二日萬幾無曠庶官天工人其代之言天子當以勤儉率諸侯不可以逸欲導之也今寧宗以得一璽一印而受賀大赦不亦愧乎時天下瓜分土字龜折惟宋立國江左少延中國之正統值斯之際明賞罰聚人才儲糗糧飾邉備尚恐弗及而乃區區得一璽印御殿受賀肆赦天下而行此驕奢之事耶噫彌遠專國阿順茍容當時諸臣罔敢可否惟賈涉遺書之詞深切時政彌遠不聽詎不惜哉直書於册不再貶而其義自見二月李全復泗州金人復入寇夏五月淮兵襲敗之金主以朝廷絶嵗幣國用以困乃命元帥左監軍額圖克行元帥事節制三路軍馬同簽書樞密院事時全副之由􅀈壽進渡淮敗官軍於高塘市攻固始縣破廬州將焦思忠兵既而獲生口言全之姪青受宋詔與全兵相拒全匿其事五月額爾克引還距淮二十里諸軍將渡全矯稱密詔諸軍且留收淮南麥遂下令人獲三石以給軍衆惑之留三日額爾克謂曰今淮水淺狹可以遠濟若值暴漲宋乘其後將不得完歸矣全力拒之是夕大雨明日淮水暴漲乃為橋渡軍官軍襲之全兵大敗橋壞全以輕舟先濟士卒皆覆沒金之兵財由是大竭金主詔數全罪而誅之進封子竑為濟國公以貴誠為邵州防禦使竑好鼓琴史彌遠買美人善鼓琴者納諸竑而厚撫其家使瞷竑動息美人知書慧黠竑嬖之時楊皇后專國政彌遠用事久宰執侍從臺諫藩閫皆所引薦莫敢誰何權勢熏灼竑心不能平嘗書楊后及彌遠之事於几上曰彌遠當決配八千里又嘗指宮壁輿地圖瓊崖曰吾他日得志置史彌遠於此又嘗呼彌遠為新恩以他日非新州則恩州也彌遠聞之大懼思以處竑而竑不知真德秀時兼宮教諫竑曰皇太子若能孝於慈母而敬大臣則天命歸之矣否則深可慮也竑不聽一日彌遠為其父浩飯僧淨慈寺與國子學録鄭清之登慧日閣屏人語曰皇子不堪負荷聞後沂邸者甚賢今欲擇講官君其善訓導之事成彌遠之坐即君坐也然言出於彌遠之口入於君之耳若一語泄吾與君皆族矣清之曰不敢乃以清之兼魏惠憲王府學教授清之日教貴誠為文又購高宗御書俾習焉清之謁彌遠即示以貴誠詩文翰墨譽之不容口彌遠嘗問清之曰吾聞皇姪之賢已熟大要竟如何清之曰其人之賢更僕不能數然一言以斷之曰不凡彌遠頷之再三策立之意益堅乃日媒孽竑之失言於帝覬帝廢竑立貴誠而帝不悟其意知濟南府种贇討張林林敗走李全入青州據之發明奉詞伐罪曰討張林叛降蒙古人神共慣然朝廷無討伐之師遠近無倡義之將則亂臣賊子終無所懲乎种贇仗義興師奉詞伐罪則斯舉誠為義戰矣故書討以豫之李全不能合兵討賊而乃乘問據城其罪滋甚蓋入者逆而不順之詞據者得非其有之謂曰入曰據深貶之也綱日是非之權衡此類是矣六月愈應符卒秋七月金平陽公胡天作降蒙古時穆呼哩徇青龍堡天作遂降八月長星見西方蒙古耶律楚材謂其主曰女真將易主矣發明厯觀自春秋以至綱目二千餘年以來其所書災異未有無其應者可見天道之與人心不可忽也當嘉定壬子之嵗而長星見於西方是時江表粗安敵勢甫息而長星之出不亦誣乎蓋明年而金主卒再踰年而帝崩史彌遠行廢立之事此非世之大變耶故謹而志之可見天變之來有徐有速但有徐速之不同未有有其變而無其應者在乎人君修為何如耳茍以天變為玩而忽之則日積月纍奚有不喪邦者哉噫其垂訓也切矣九月大名忠義彭義斌復京東州縣嚴實將朝海以青崖崓降以宣繪參知政事程卓同知樞密院事薛極簽書院事冬十月蒙古穆呼哩取金河中以石天應權河東關陜行臺穆呼哩所過州縣皆下時金於牛心寨僑治吉州事穆呼哩自隰州攻之知州楊貞令妻孥先墜崖已從之皆死穆呼哩入寨留兵守之且使蒙古布哈引遊騎出秦隴以為聲援及視山川夷險而自將兵下孟州晉陽霍邑等寨召石天應謂之曰河中為河東要郡擇守非君不可乃以天應權行臺平陽太原吉隰等帥並受節制穆呼哩遂趨長安使元哈納台布哈屯守之遣昻吉將兵斷潼關金王庭玉取曹州殺蒙古石圭十一月蒙古穆呼哩取金同州節度使完顔額爾布克死之發明死節必書嘉全義也蓋死節人臣之當然何以書勸善也能知綱目所書之意然後可與論褒善貶惡之權衡矣十二月以李全為保寧節度使京東河北鎮撫副使初全有戰功史彌遠欲加全官賈涉止之及加節鉞涉嘆曰朝廷但知官爵可以得其心寧知驕則將至於不可勸邪蒙古特穆津屠默哷城滅回回國大掠痕都斯坦國而還先是蒙古主遣子卓沁察罕台烏格台圖壘分攻鄂托羅爾玉龍哈實等城而自將攻都哩木及巴喇勒台城克之遂圍塔爾哈寨拔之進薄回回國其王委國而去逃匿海嶼不旬日庾死蒙古主遂次痕都斯坦國鐵門關侍衛見一獸鹿形馬尾緑色而獨角能為人言謂之曰汝君冝早回蒙古主怪之以問耶律楚材對曰此獸名角端解四夷語是惡殺之象今大軍征西已四年蓋上天惡殺遣之告陛下願承天心宥此數國人命實無疆之福蒙古遂大掠痕都斯坦而還發明君子所最謹者仁暴之辦若夫曰戎曰狄曰赤狄白狄之類春秋初未嘗罪之也蒙古特穆津前已書稱帝矣然於其國則止書蒙古於其名則止書特穆津至其卒也書姓書名書死純以暴戾罪之此綱目之所以為綱目非君子莫能修之蓋入者逆而不順之詞屠者殘暴不仁之詞滅者已甚之詞掠者惡之之詞此皆所以貶而罪之學者能深究其書法之旨始可與言綱日矣下書穆呼哩死於解州其義倣此廣義分注載角端之獸考之經典質之子史雖無其實然則楚材以是而諌蒙古者亦可謂因事納忠也癸未十六年金元光二年春正月金元帥都監侯小叔取河中殺蒙古石天應穆呼哩攻鳯翔府晝夜苦戰四十餘日不下將由河中北還金元帥右都監侯小叔襲河中破之殺石天應焚浮橋而退穆呼哩以天應子烏格代領其衆初金主命元帥都監阿嚕岱守河中阿嚕岱恇怯不能軍竭民膏血為浚築之計及絳州破阿嚕岱益懼馳奏河中孤城不可守有旨親視果不可守則棄之無至資敵阿嚕岱遂棄河中燒民居官舍一二日而盡尋有言河中重鎮國家基夲所在設為敵人所據則大河之險我不得專恃矣金主命有司復修葺之終不能成故隨守隨陷發明河中金之故地侯小叔得之何不書復蓋金之先世藉憑陵之威據中國之地故雖已失而用兵力以復之特書曰取不豫其復故地也此綱目維持正統之深意而非常史之可比矣三月蒙古穆呼哩死於解州穆呼哩自河中帥師還至解州聞喜縣疾篤謂弟岱遜曰我為國家助成大業干戈垂四十年無復遺恨所恨者汴京未下耳汝等勉之言乞而卒年五十四穆呼哩雄勇善謀與博爾濟慱勒呼齊拉衮俱以忠勇事其主號都爾本庫魯克猶華言四傑也蒙古主軍嘗失利會天大雪失牙帳所在卧草澤中穆呼哩與博爾濟張氈蔽之自暮逹曉竟不移足慱爾濟從征伐立功甚多極見親遇位終右萬户博勒呼身更百戰竟死於陳位終第一千户齊拉衮功與三人者等四人之子孫皆領宿衛號四集賽出官則為輔相焉夏五月蒙古初置逹嚕噶齊監治郡縣蒙古主避夏於八魯灣川分兵攻諸部落之近者悉下之至昆布寨與諸將會以西域漸定置逹嚕噶齊於各城監治之逹嚕噶齊猶華言掌印官也六月程卓卒淮東制置使賈涉卒涉以李全驕暴難制力求還朝在道卒初涉欲制忠義兵乃以翟朝宗統鎮江副司八千人屯楚州城中又分帳前忠義萬人命趙邦永高友統五千屯城西王暉於潭統五千屯淮隂李全輕鎮江兵而忌帳前忠義乃數稱高友等勇遇出軍必請以自隨涉不詐全每宴麾下併召涉帳前將校於是帳前亦願𨽻全然未能合也及涉卒邱夀邁攝帥事全請曰忠義烏合尺籍鹵莾莫若别置新籍一納諸朝一申制閫一留全所庶功過有考請給無弊夀邁從之全乃合帳前忠義與已軍盡籍之而併統其軍夀邁不悟秋八月金將納哈塔陸格殺蒙古綱謀以邳州來附金人殺之蒙古綱御下嚴邳州從冝經略使納哈塔陸格謀殺之據州反與蒙古將李二措致書海州言欲來附李全麾下周岊得之以報全全喜遣王喜兒以兵二千應接而已繼之二措納喜兒而囚之全欲攻邳四面阻水二措積徑弩備之全不得進合兵索戰而敗欲還楚州會濵隸有亂乃引兵趨青州金行院總帥約赫德討殺陸格復其城發明陸格殺主帥背本國乃金之亂賊也亂臣賊子人人得而誅之分注尚以討殺為文綱目變文書殺若無罪焉者何耶蒙古綱殘暴御下是以致陸格激變叛而降宋故書曰殺見罪在蒙古綱也綱目罪坐主將之意其嚴如此九月朔日食冬十二月以許國為淮東制置使初淮西都統許國奉祠家居欲傾賈涉而代之數言李全必反涉卒會召國入對國疏全姦謀益深反狀已著非有豪傑不能消弭蓋自鬻也遂易國文階為淮東安撫制置使兼知楚州命下聞者驚愕淮東參幕徐晞稷雅意開閫及聞國用乃注釋國疏以寄全全不樂金主珣卒子守緒立金主疾革時已暮夜近臣皆出惟前朝資明夫人鄭氏以年老侍側金主知其可托謂之曰速召太子主後事言絶而殂夫人祕之是夕后妃問安寢閣龎貴妃隂狡機慧常以其子英王守純年長不得立懷怨鄭氏恐其為變即紿之曰上方更衣后妃可少休他室伺其入遽鑰之急召大臣傳遺詔立皇太子守緒始啓戶出后妃發喪太子方入宫英王已先至太子知之分遣樞密院官及東宮親衛軍官伊喇布哈集軍三萬餘於東華門街部署既定命護衛四人監守純於近侍局乃即位於柩前蒙古攻夏夏主遵頊傳國於其子德旺遵頊自號上皇德旺改元乾定未幾遵頊卒德旺號之曰神定蒙古蘇布特擊欽察滅之大掠西畨邉部而還發明蒙古崛起沙漠憑陵海外恃其兵威以滅鄰國是乃天之所興莫能與之抗禦者也然勞師襲逺黷武窮兵君子譏馬凡書滅者不再貶而其失自見甲申十七年金哀宗守緒正大元年春三月召崔與之為禮部尚書以鄭損為四川制置使與之辭不拜與之治蜀將士輯睦府藏充實至是以疾歸廣州蜀人肖其像祠焉金使人來請和金主遣尚書令史李唐英至滁州通好既而復遣樞密判官伊喇布哈率兵至光州榜諭軍民更不南侵秋閏八月帝崩史彌遠矯詔立沂王子貴誠更名昀尊皇后為皇太后同聽政封皇子竑為濟王出居湖州八月丙戌帝不豫史彌遠遣鄭清之往沂王府告貴誠以將立之意貴誠默不應清之曰丞相以清之從遊久故使布腹心今不答一語則清之將何以答丞相貴誠始拱手徐言曰紹興老母在清之以告彌遠益相與嘆其不凡壬辰帝疾篤彌遠稱詔以貴誠為皇子改賜名昀授武泰軍節度使封成國公閏月丁酉帝崩彌遠遣皇后兄子谷石以廢立事白后后不可曰皇子竑先帝所立豈敢擅變谷等一夜七往返后終不許谷等乃拜泣曰內外軍民皆已歸心茍不立之禍變必生則楊氏無噍類矣后默然良久曰其人安在彌遠即於禁中遣快行宣昀令之曰今所宣是沂靖惠王府皇子非萬歲巷皇子茍誤則汝皆處斬皇子竑時聞帝崩跂足以需宣召久而不至乃屬目墻壁間見快行過其府而不入疑焉已而擁一人徑過天瞑不知為誰甚惑之昀入宮見后后拊其背曰汝今為吾子矣彌遠引昀至柩前舉哀畢然後召竑竑聞命即赴至則每過宮門禁衛拒其從者彌遠亦引竑至柩前􅘏哀畢引出帳殿帥夏震守之遂召百官立班聽遺制則引竑至舊班竑愕然曰今日之事我豈當仍在此班震紿之曰未宣制前當在此宣制後乃即位竑以為然已而遙見殿上燭影中有人在御座則盷已即位矣宣制畢閣門宣贊呼百官拜賀竑不肯拜震捽其首下拜遂稱遺詔以竑為開府儀同三司封濟陽郡王判寧國府尊楊皇后曰皇太后垂簾同聽政詔遵孝宗故事宮中自服三年喪尋進封竑為濟王出居湖州史臣曰寧宗恭儉守文初年以舊學輔導之功召用宿儒引拔善類其政可觀中更韓托胄內蓄群姦指正為偽外挑強鄰流毒淮甸函首求成國體虧矣及史彌遠擅權幸帝耄荒竊弄威福至於皇儲國統亦得乘機伺間遂其廢立之私他可知也發明矯詔何罪無君也易曰天尊地卑乾坤定矣司馬溫公曰禮莫大於分分莫大於名自古姦臣賊子其發也有端其積也有漸而其成也植根固而流波漫矣上自共歡下暨斯高其禍敗同一轍也竑昀雖皆彌遠所選然白十四年書立竑為皇子十五年進封竑為濟國公則名分定之於前久矣既而因聞流言彌遠憂懼而廢立之意益固特因寧宗未崩姑且隱忍寧宗已崩厥志斯遂彌遠何人而行廢立之事乎故書立沂王子貴誠書封皇子竑為濟王所以正名定分以明其當立不當立之義也綱目原於人心而定罪君子順於天理而用刑豈以彌遠關白太后而乃末減其罪哉前史止書立沂王子貴誠封竑為濟王而彌遠之惡得以少掩此君子所以懼而綱目所由作也今而正色書之略不少恕而必歸獄於彌遠然後人心正而名分明亂臣賊子始無所逃於天地之間焉廣義抑觀彌遠隂擇宗室中可立者之時即有希冀權寵之心况得副意之賢其志固矣然竑又以輕佻促之豈非益堅彌遠廢立之志邪雖然此亦上天隂祐理宗否則將以賢理宗者而賢竑矣彌遠何能為故曰其子之賢不肖皆天也豈人力之所能哉九月詔傅伯成為顯謨閣學士楊簡為寶謨閣學士辭不至史彌遠欲收衆望勸帝褒表老儒遂詔傅伯成楊簡及柴中行俱奉朝請伯成簡辭不至以真德秀直學士院魏了翁為起居郎初以德秀及禮部侍郎程珌吏部侍郎朱著並兼侍讀工部侍郎葛洪起居郎喬行簡宗正少卿陳貴誼軍器監王暨並兼侍講尋又以德秀直學士院召魏了翁為起居郎德秀之為起居舍人兼宮講也言事不避權貴且惓惓於復讐知史彌遠欲以爵祿縻天下士慨然謂劉爚曰吾徒須急引去使廟堂知世有不肯為從官者遂力請外至是自知潭州召還入對勸帝容受直言召用賢臣固結人心為本帝開納之了翁當開禧初以武學博士召試學士院對策諌開邉事御史徐相劾了翁狂妄了翁亦以親老出知嘉定府尋築室白鶴山下以所聞於輔廣李燔者開門授徒士爭負笈從之由是蜀人盡知義理之學及為潼川轉運判官上疏乞與周敦頥張載程皓程頥鍚爵定諡示學者趨向朝廷從之廣義抑考德秀嘗為宮教以諌皇子竑曰皇子若能孝於慈母以敬大臣則天命歸之否則深可慮也竑不聽德秀因力請外而去嗚呼何其先見之明若是耶至理宗即位之初為侍讀為直學士院為煥章閣待制任職不辭可謂能擇君者矣易蠱之上九不事王侯高尚其志蹇之六二王臣蹇蹇匪躬之故觀其去濟王也合乎蠱之上九就理宗也合乎蹇之六二一去一就惟其時而已非西山其孰能之哉追封希瓐為榮王以其子與苪襲封奉祀帝追封所生父希瓐為榮王生母全氏為國夫人而以弟與苪嗣之冬十月夏及金平夏人與金通好不交兵者八十年至貞祐初以小故生釁搆難十年一勝一負遂至精鋭俱盡兩國皆弊至是夏遣其吏部尚書李仲諤修好於金稱弟而不臣各用本國年號金遣禮部尚書奧敦良弼報之十一月以葛洪同簽書樞密院事御批續資治通鑑綱目卷十八
