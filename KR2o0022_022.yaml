body:
  text: 欽定四庫全書御批續資治通鑑綱目卷十七起庚戌宋光宗紹熙元年盡丁卯宋寧宗開禧三年凡十八年庚戌光宗皇帝紹熙元年金章宗璟明昌元年春正月朔帝朝夀皇於重華宫二月殿中侍御史劉光祖乞禁譏議道學者光祖入對言近臣是非不明則邪正互攻公論不正則私情交起此固道之消長時之否泰而實為國家之禍福社稷之存亡甚可畏也本朝士大夫學術最為近古初非有強國之術而國勢尊安根本深厚咸平景德之門道臻皇極治保太和至於慶厯嘉祐盛矣不幸而壞於豐熙之邪説疏棄正士招徠小人幸而元祐君子起而救之末流大分事故反覆紹聖元符之際羣凶得志絶滅綱常其論既勝其勢既成崇觀而下尚復何言臣始至時聞有譏貶道學之説而實未覩朋黨之分逮臣復來則朋黨已成而忠諫者獲罪矣夫以忠諫為罪其去紹聖幾何陛下即位之初凡所進退率用人言初無好惡之私豈以黨偏為主而一嵗之內逐者紛紛往往納忠之言謂為沽名之舉至於潔身以退亦曰憤懟而然欲激怒於至尊必加之以謗訕臣欲熄將來之禍故不憚反覆以陳伏幾聖心豁然永為皇極之主使是非由此而定邪正由此而别公論由此而明私意由此而熄道學之譏由此而消朋黨之迹由此而滅和平之福由此而集國家之事由此而理則生靈之幸社稷之福也不然相激相勝展轉反覆為禍無窮臣實未知稅駕之所帝下其章讀者至於流涕何淡見之數日恍惚無措是年廷試舉人婺州進士王介䇿亦言今之所謂道學者即世之君子正士也君子正士之名不可逐故設為此名一網去之聖明在上而天下以道學為諱將何以立國哉帝嘉歎擢為第三由是道學之譏少沮發明君子以理義為勇以道德為威當勇而勇則雖鈇鉞有所不能移當滅而威則雖鼎鑊有所不能屈自王淮倡禁道學之名陳賈乞禁道學之説正心誠意之道為世大禁修齊治平之理當時不遵何異洪水禽獸之害乎三四年間無敢言者光祖憤然上疏忠誠激烈讀之凛凛猶有生氣斯道將晦而復明正義既絶而復續茍非以義理為勇以道德為威者曷克臻此語曰見義不為無勇也君子豈肯負無勇之名哉直書於册深豫之也廣義嗚呼道學之在人猶日星之在天也人非道學則三綱淪九法斁幾於禽獸非人也天非日星則晷刻亡五行滅均於杳冥非天也是知人不可無道學猶天之不可無日星也亘古迄今何嘗有熄間有誣妄詆毁之者譬諸隂霾毒霧蔽於頃刻一遇飄風則掃滅殆盡會何損於日星之明哉故凶不能蔽之于唐虞防風不能蔽之于有夏藍夷不能蔽于商管蔡不能蔽于周春秋之君自蔽而孔子明之戰國之君自蔽而孟子明之漢自蔽而明之者董仲舒也唐自蔽而明之者韓退之也逮夫有宋朱子逺宗孔孟近述周程闡明道學如日中天如星正度何其正耶夫何淮陳賈林栗輩以狗鼠之見大擁隂霾劇施毒霧而蔽之乎未幾卒遇光祖飄風之一掃不能損於日星之明而人心為之一快也噫道學與天地相為悠久者也日星之亡道學斯滅然則詆誣道學者身豈久於日星哉借曰能久亦無以踰於日星也子貢曰仲尼日月也無得而踰焉臣敢以為文公頌夏四月以伯圭嗣秀王伯圭夀皇母兄而秀王之稱之長子也詔即湖州秀園立廟奉神主建祠臨安府以藏神御如濮王故事而以伯圭嗣王伯圭謙謹不以近屬自居每入見帝行家人禮宴私隆洽伯圭執臣禮愈恭秋七月以留正為左丞相王藺為樞密使葛邲參知政事胡晉臣簽書樞密院事冬十二月王藺罷以葛邲知樞密院事胡晉臣參知政事辛亥二年金明昌二年冬十一月帝有事於太廟后殺貴妃黃氏翌日郊大風雨不卒事而還帝有疾初帝欲誅宦者近習懼遂謀離間三宫帝疑之不能自解會帝得心疾夀皇購得良藥欲因帝至宫授之宦者遂訴於皇后曰太上合藥一大丸俟宫車過即投藥萬一不虞奈宗社何后覘藥實有心御之頃之內宴后請立嘉王擴為太子夀皇不許后曰妾六禮所聘嘉王妾親生也何為不可夀皇大怒后退持嘉王泣訴於帝謂夀王有廢立意帝惑之遂不朝夀皇一日帝浣手宫中覩宫人手白恱之他日后遣人送食合於帝啓之則宫人兩手也后又以黃貴妃有寵因帝祭太廟宿齋宫后殺貴妃以暴卒聞翌日合祭天地風雨大作黃壇燭盡滅不能成禮而罷卒既聞貴妃卒又值此變震懼增疾不視朝政事多決於后后益驕恣夀皇聞帝疾亟往南內視之且責后后怨愈深發明易曰坤道其順乎承天而時行此言地道順承天施而無所作為猶婦道無違夫子而罔敢専成也故又曰無攸遂在中饋夫李后之狡悍妬忌凶暴専輒積之有素由光宗溺愛袵席狎恩恃愛不能禁之於其始而乃受虐於其終唐髙宗之於武氏中宗之於韋氏用此道也嗚呼風雨之驟迅天地之震怒也黃壇之燭滅祖宗之譴告也光宗值此大變罹此大戚近在宫庭弗克詰責震懼增疾不視朝政何其愚哉人主視此則家齊而后國治國治而後天下平矣此固綱目經世之大訓也廣義李后殘虐天道應之如影響孰謂天人之相逺哉大書於册為鑒昭矣壬子三年金明昌三年春三月帝疾瘳羣臣請朝重華宫不果行帝自有疾重華溫凊之禮以及誕辰節序屢行夀皇傳旨而免既而帝神思寖清宰輔百官下至韋布之士以過宫為請者甚衆至有叩頭引裾號泣而諫者帝開悟有翻然夙駕之意既而不果行都人始以為憂發明書不果行譏不決也曲禮曰凡為人子之禮冬溫而夏凊昏定而晨省文王之為世子朝於王季日三雞初鳴而衣服至寢門外問內竪曰今日安否如何內竪曰安文王乃喜及日中又至亦如之及暮又至亦如之光宗惑妬婦之讒言乖父子之天性有疾不朝不得已也疾瘳不朝果何執乎由是內外羣臣合詞勸請既已開悟復為不行嗚呼光宗於私恩全之為有餘於公義聼之為不足何以模範天下哉故上書疾瘳下書不果行深罪之也廣義尚書曰立愛惟親孔子曰立愛自親始教民睦也况光宗乃父之事厥祖而克盡其道而光宗目覩其盛者也今光宗之於乃父反以不孝答之綱目書曰不從者則其大逆無道之實昭揭萬世其惡可勝言哉嗚呼黃屋中居一不孝之子則國之根本斬矣欲綿國祚得乎夏四月以丘崈為四川制置使初留正帥蜀慮吳氏世將謀去之不果至是議更蜀帥正言西邉三將惟吳氏世襲兵柄號為吳家軍不知有朝廷遂以户部侍郎丘崈往崈陛辭奏曰臣入蜀後吳挺脫至死下兵權不可復付其子臣請得以便宜撫定諸軍許之六月以陳騤同知樞密院事騤疏三十條如宫闈之分不嚴則權柄移內謁之漸不杜則明斷息謀臺諫於當路則私黨植咨將帥於近習則賄賂行不求讜論則過失彰不謹舊章則取舍錯宴飲不時則精神昏賜豫不節則財用竭皆切於時病冬十一月日南至越六日帝始朝重華宫十一月丙戌日南至丞相留正率百官詣重華宫稱慶兵部尚書羅點給事中尤袤中書舍人黃裳御史黃度尚書左選郎官葉適等上疏請帝朝重華宫不從吏部尚書趙汝愚入對往復規諫帝意乃悟汝愚又屬嗣秀王伯圭調護於是兩宫之情始通辛卯帝朝重華宫皇后繼至從容竟日而還都人大悅后歸謁家廟推恩使臣鄧從訓等一百八十人發明春秋莊二年書夫人薑氏會齊侯於禚傳曰婦人無外事送迎不出門見兄弟不踰閾在家從父既嫁從夫夫死從子今后歸謁家廟是光宗不能防間其妻失夫道也李氏之惡著矣所以病帝也曰夫可以制妻乎適人從夫通乎其下况於天子天子者神人之主風教之本也不能正家如正國何若光宗者事父母以孝待妻子以嚴威刑以督下車馬僕從莫不俟命皇后徒往乎皇后之往也則帝威命之不行嚴厲之不至爾是嵗諸路大水發明紹熙之治當時無足稱者然亦僅能擁虛位而已抑不知光宗惑妬后之言逆父子之德此小人之所喜而君子之所不取者况其大節既虧小何足數故凡逆氣乘之災異屢見故去年十一月書大風雨而又諸路大水迭出於册用見天人之變交應於時不可誣者踰二年夀皇憤崩稱疾不視而天位亦移矣然則餘慶餘殃之報夫豈僣差而或者以為賢君目之過矣癸丑四年金明昌四年春三月以葛邲為丞相陳騤參知政事胡晉臣知樞密院事趙汝愚同知院事御史汪義端與汝愚有隙上言髙宗聖訓不用宗室為宰執汝愚楚王元佐七世孫不宜用之汝愚亦力辭不許命當制學士申諭上意而黜義端汝愚乃拜命金以胥持國參知政事金初設經童科持國以經童入仕為太子祗應司令金主在東宫識之及即位遂大用持國為人柔佞有智術時李妃得幸持國知金主好色隂以祕術干之又多遺賂左右妃亦自嫌門地寒薄欲藉外廷為重乃數稱譽持國由是金主信任之持國與妃表裏擅政士子好利躁進者爭趨其門四方為之語曰經童作相監婢為妃惡其卑賤庸鄙也翰林應奉文字趙秉文上書論之金主召問秉文言頗差異命知大興府事內族膏鞫之秉文遂引同議者修撰王庭筠等五人皆下獄被斥然秉文詩文精絶與楊雲翼齊名時號為楊趙後為翰林學士而卒雲翼忠厚善屬文仕至禮部尚書庭筠博學和易尤工文且善字畫名重於時夏五月賜禮部進士陳亮及第亮才氣超邁喜談兵議論風生下筆數千言立就所交皆一時豪俊志存經濟隆興初上中興五論不報退居婺之永康益力學著書嘗圜視錢塘喟然嘆曰城可灌也蓋以地下於西湖耳淳熙中更名同詣闕上書極言時事因言錢塘非駐蹕之所夀皇赫然震動欲榜朝堂以厲羣言用种放故事召令上殿將擢用之曽覿聞而欲見也亮恥之踰垣而逃覿不悅大臣亦惡其言切直交沮之待命十日再詣闕上書夀皇欲官亮亮聞而笑曰吾欲為社稷開數百年之基寧用以博一官乎即渡江歸厲志讀書所學益慱其學自孟子後惟推王通嘗曰研窮義理之精微辨析古今之同異原心於眇忽較禮於分寸以積纍為上以涵飬為正睟面盎背則於諸儒誠有愧焉至於堂堂之陳正正之旗風雨雲雷交發而並至龍蛇虎豹變見而出沒推倒一世之智勇開拓萬古之心胸自謂差有一日之長蓋指朱熹吕祖謙也至是䇿進士問以禮樂刑政之要亮以君道師道對且曰臣竊嘆陛下於夀皇蒞政一十有八年之間寧有一政一事之不在聖懷而問安視寢之餘所以察辭而觀色因此而得彼者其端甚衆亦既得其機要而見諸施行矣豈徒一月四朝為京邑之美觀也哉帝得其䇿大喜以為善處父子之間御筆擢為第一授簽書建康府判官廳公事未上一夕卒發明觀亮之宏才博學而不為時論所容則其在廷之臣罔非持祿保位因循茍且之人可知矣逮夫光宗擢用亮乃告終可勝惜哉使其弗獲是顯則將沒齒無聞矣書之實所以哀之也廣義人才如亮者固不多得惜其氣質少純耳易曰謙謙君子用涉大川斯無弊矣利州安撫使吳挺卒丘崈使總領財賦楊輔等權總其軍崈命緦領財賦楊輔權安撫使統制官李世廣權總其軍以殺吳氏之權朝廷尋以興州都統制張詔代挺召浙東副總管薑特立還留正乞罷相不許六月正出城待罪帝念特立不已召之留正引唐憲宗召吐突承璀事乞罷不報乃待罪六和塔而上疏切諫於是著作郎沈有開著作左郎李唐卿祕書郎范黼彭龜年校書郎王奭正字蔡幼學顔棫吳獵項安世等上疏乞寢特立召命不報正因繳進前後錫賚及告敕乞歸田里亦不許發明溺愛袵席狎昵羣小此固人君縱欲之私情特立隂邪小人前既擯斥於外此復召之使還光宗躬自禁之躬自陷之則其縱欲之心駸駸乎已不可遏雖宰相之力諌羣臣之協詞皆不之恤若是乎為惡則易而為善則難也既而留正忿然出城待罪而光宗略無沮抑留連之意則君子小人之用舍從可知矣天下何由而平治哉直書於册不再貶而其義自見廣義抑觀薑特立者初非有翊戴之功惟以潛邸舊臣而已光宗何至執一己之偏而違衆論之公哉書曰留正待罪於城外則有以見留正望君改過之心也胡晉臣卒帝自有疾不視朝晉臣與留正同心輔政中外帖然其所奏陳以溫凊定省為先次及親君子逺小人抑撓幸消朋黨啓沃剴切彌縫縝密人無知者廣義觀分注所載則知留正胡晉臣南渡之賢相也列於丙魏姚宋夫何過哉然則何以於其卒而不銜之不銜之者非貶之也其與陳康伯卒例同秋七月以趙汝愚知樞密院事余端禮同知院事八月金主釋奠孔子廟北靣再拜九月羣臣請帝朝重華宫不聼冬十一月始朝帝制於后久不朝重華宫會九月重明節羣臣連章請帝過宫不聼而召內侍陳源為押班中書舍人陳傅良不草詞且上疏力諫給事中謝深甫言父子至親天理昭然太上之愛陛下亦猶陛下之愛嘉王太上春秋髙千秋萬嵗後陛下何以見天下帝感悟趣命駕往朝百官班立以俟帝出至御屏后挽留帝入曰天寒官家且飲酒百僚侍衛相顧莫敢言傅良趣斫進引帝𥚑請毋入因至屏後后叱曰此何地秀才欲頭邪傅良痛哭於庭后使人問曰此何理也傅良曰子諌父不聼則號泣而隨之后益怒遂傅旨罷還內傅良下殿徑行詔改祕閣修撰不受於是著作郎沈有開祕書郎彭龜年禮部侍郎倪思國子録王介等皆上疏請朝不從十月工部尚書趙彥逾等上書重華宫乞會慶節勿降旨免朝夀皇曰朕自秋涼以來思與皇帝相見卿等奏疏已令進御前矣及會慶節帝復稱疾不朝丞相以下皆上疏自劾乞罷黜嘉王府翊善黃裳請誅內侍楊舜卿彭龜年請逐陳源以謝天下太學生汪安仁等二百一十八人上書請朝重華宫皆不報十一月彥逾復力諫帝始往朝尚書左選郎官葉適奏自今宜於過宮之日令宰執侍從先詣起居異時兩宫聖意有難言者可因此傳致則責任有歸不可復使近習小人增損語言以生疑惑不報發明虞舜父頑母囂嘗欲害舜而舜克諧以孝罔敢怠遑書曰祗載見瞽瞍夔夔齋栗瞽瞍亦允若夫天子所為下觀而化也光宗之父非瞽瞍蔑視之心如塗人豈不為虞舜之罪人乎光宗制於妬婦無如之何三綱絶矣近在宫庭而曖昧若此則天下之大庶務之繁烏能偏理之哉故書羣臣請朝重華所以豫臣之勉君於善書不聼所以罪帝之不能從善書始朝所以譏帝之不誠於善綱目之義蓋亦循名責實焉耳廣義抑考去年十一月羣臣請朝夀皇不從因趙汝愚極諫從之至是羣臣又請朝而又不聼至十一月因趙彥逾力諌而始朝也嗚呼光宗之於孝宗父子不相見者十月矣一制虐后而不能行已志則君不得為臣綱父不得為子綱夫不得為妻綱矣三綱既絶尚可以名人國哉伯夷不立於惡人之朝以此類耳召留正赴都堂視事復命薑特立還浙東正出城待罪凡百四十日帝遣左司徐誼喻旨乃復入十二月夏主仁孝卒子純佑立仁孝在位五十五年始建學校於國中立小學於禁中親為訓導尊孔子為文宣帝然權臣擅國兵政衰弱於純佑立改元天慶號仁孝曰仁宗以朱熹知潭州使者自金還言金人問朱先生安在故有是命廣義賢人君子之於人國也豈小補哉惟其不用故其國卒無善治焉今也光宗於文公反不知之而金主則知之則其君之賢否蓋可見矣中庸曰聲名洋溢乎中國施及蠻貊其文公之謂乎甲寅五年金明昌五年春正月夀皇有疾葛邲罷邲為相専守祖宗法度薦進人才博采古論惟恐其人聞之嘗曰十二時中莫欺自己其實踐如此金購求遺書發明購求遺書帝王盛事而獨讓於金人為之中國視此當如何哉故前書釋奠孔子此書購求遺書皆所以不沒其善也夏四月帝及后幸玉津園羣臣請帝問疾重華宫不從自夀皇不豫羣臣請帝省視皆不報而與皇后幸玉津園兵部尚書羅點請先過重華且曰陛下為夀皇子四十餘年無一間言止緣初郊違豫夀皇嘗至南內督過左右之人自此讒間遂生憂疑以臣觀之夀皇與天下相忘久矣今大臣同心輔政百執事奉法循理宗室戚里三軍百姓皆無二志設有間離誅之不疑乃若深居不出久虧子道衆口謗讟禍患將作不可以不慮帝曰卿等可為朕調護之侍講黃裳對曰父子之親何俟調護點曰陛下一出即當釋然帝猶未許點乃率講官言之帝曰朕心未嘗不思夀皇點曰陛下久闕定省雖有此心何以自白起居舍人彭龜年連三疏請對不報屬帝視朝龜年不離班位伏地叩額血流積甃帝曰素知卿忠直欲何言龜年奏今日無大於過宫余端禮因曰叩額龍墀曲致忠懇臣子至此豈得已邪帝曰知之然猶不往夀皇疾益甚羣臣上疏請者相繼帝將以癸丑日朝至期丞相以下入宮門俟日昃帝復辭以疾於是羣臣請斥罷者百餘人詔不許裳與祕書少監孫逄吉等再上疏以請起居郎兼中書舍人陳傅良請以親王執政一人充重華宫使臺諫交章劾內侍陳源楊舜卿林億年離間之罪請逐之發明是時夀皇遘疾已逾三月此正光宗憂心悄悄不遑自逸之秋也故曰父母有疾不解帶湯藥必親嘗光宗為天下之共主司天下之綱常父無疾而不能省父有疾而不能視反携所愛共相逰樂縱耳目之欲忘天性之思其罪可勝言乎逮夫羣臣懇請問疾光宗愎諌勿從茍有人心者必於焉而變矣帝之舉措如此則是帝王而不孝烏可與論人道哉詩云永言孝思孝思惟則光宗其愧之焉綱目書此所以著其縱欲忘親溺情悖理之失耳五月夀皇疾大漸詔嘉王擴問疾重華宫陳傅良以帝不往重華宫乃繳上告敕出城待罪丞相留正等率宰執進諌帝拂衣起正引帝裾泣諌羅點進曰夀皇疾勢已危不及今一見後悔何及羣臣隨帝入至福寧殿內侍闔門慟哭而出越二日正等又請對帝令知閣門事韓托胄傳旨云宰執並出正等俱出浙江亭待罪夀皇聞之憂甚托胄奏曰昨傳旨令宰執出殿門今乃出都門請自往宣押入城於是正汝愚等復還第明日帝召羅點入對點言前日迫切獻忠舉措失禮陛下赦而不誅然引𥚑亦故事也帝曰引裾可也何得輒入宫禁乎點引辛毗事以謝且言夀皇止有一子既付神器惟恐見之不速耳從官及彭龜年黃裳沈有開奏乞令嘉王詣重華宫問疾許之王至宫夀王為之感動發明大漸者增劇之詞曲禮曰父母有疾冠者不櫛行不翔言不隋琴瑟不御食肉不至變味飲酒不至變貌笑不至矧怒不至詈疾止復故光宗之於夀皇生不能事疾不能藥至於大漸猶不能往羣臣力請皆不能從其罪甚矣逮至請之不已始命嘉王代行嗚呼上行下效捷於影響光宗乃夀皇之子而嘉王亦光宗之子光宗不孝於父而欲嘉王之孝於己其可及乎凡直書其事而貶自見者此類是矣六月夀皇崩帝稱疾不出留正等請夀聖皇太后代行喪禮夀皇崩年六十八是夕重華宫內侍訃於宰執私第趙汝愚恐帝疑惑不出視朝持其劄不上次日帝視朝汝愚以聞因請詣重華宫成禮帝許之至日昃不出宰相乃率百官詣重華宫發喪將成服留正與汝愚議介少傳吳琚請夀聖太后埀簾暫主喪事太后不許正等附奏云臣等連日造南內請對不獲纍上疏不得報今當率百官恭請若皇帝不出百官相與慟哭於宫門恐人情騷動為社稷憂乞太后降旨以皇帝有疾暫就宫中成服然喪不可以無主祝文稱孝子嗣皇帝宰臣不敢代行太后夀皇之母也請設行祭禮太后許之史臣曰髙宗以公天下之心擇太祖之後而立之乃得孝宗之賢聰明英毅卓然為南渡諸帝稱首即位之初鋭志恢復重違髙宗之命不輕出師又值金國平治無釁可乘然易表為書改臣稱姪減去嵗幣以定鄰好金人易宋之心至是亦寖異於前日故世宗每戒羣臣積錢榖謹邉備蓋忌帝之將有為也天厭兵革欲休生民故帝用兵之志弗遂而終自古人君起自外藩入繼大統而能盡宫庭之孝未有若帝者終喪三年又能却羣臣之請而力行之廟號孝宗其無愧乎發明孟子曰飬生不足以當大事惟送死可以當大事光宗於天性之恩乖戾已極生不能飬疾不能侍死不能葬是誠天地間之罪人也蓋稱者不宜稱也無疾而偽稱之者也當五內分裂之時正哀痛迫切之日安有父亡而子可稱疾不出者乎然親喪固所自盡也豈太后所能代而行之哉光宗誠可謂滅絶天理者矣故直書以著其惡廣義前書夏四月帝及后幸玉津園羣臣請帝問疾重華宫不從繼書五月夀皇疾大漸詔嘉王擴問疾重華宫至是書六月夀皇崩帝稱疾不出留正等請夀聖皇太后代行喪禮嗚呼虎狼之暴尚不泯乎父子之天君子迹趙惇之逆實虎狼禽獸之不若也然則孝宗之崩豈非逆惇有以致之乎繩以大法當與金之逆亮同科諸賢生於其朝亦云不幸甚矣且留正號為賢相以太后代行喪禮無乃不可乎彼太后孝宗之母也烏可以母行子之喪禮耶於時逆惇既托疾不出事誠太變矣正也即當請於太后曰嘉王陛下之親子也既代陛下問疾重華宫遂請攝行喪禮不然則是喪無所主豈可聞於敵國哉如此庶可以愧服逆惇之心而隂定嘉王之儲位也况正為異姓之卿耶昔昌邑王奔昭帝之喪居道上不素食霍光猶得以數其罪而廢之况惇親為逆行者哉正而能此則當行子孟之事不能則奉祠丘園不亦可乎今乃不此之䇿至於秋七月乃欲請建太子不蒙逆惇所允稱疾而逃果何義哉故曰君子作事謀始正其昧於此乎尊夀聖皇太后為太皇太后夀成皇后為皇太后秋七月留正請建太子不許遂稱疾而遁葉適留於留正曰帝疾而不執喪將何辭以謝天下今嘉王長若預建參決則疑謗釋矣正從之率宰執入奏云皇子嘉王仁孝夙成宜早正儲位以安人心不報越六日又請御批云甚好明日宰執同擬旨以進乞帝親批付學士院降詔是夕御劄付丞相云歷國事嵗久念欲退間正得之大懼因朝佯仆于庭即出門上表請老且云願陛下速回淵鑒追悟前非漸收人心庶保國祚初正始議帝以疾未克主喪宜立皇太子監國若未倦勤當復明辟設議內禪太子可即位而趙汝愚請以太皇太后旨禪位嘉王正謂建儲詔未下遽及此他日必難處與汝愚異遂以肩輿五鼓逃去發明有官守者不得其職則去有言責者不得其言則去此固人臣事君之常禮然以當時之事勢觀之太上初崩光宗稱疾國本未固人心皇惑尚賴一二大臣宏濟艱難傾否為泰之時留正既為首相總攬朝綱又非其他羣牧庶職之比必當紏率百僚共圖奠安宗社之長策可也建儲不允稱疾宵奔豈大臣國危與危之義乎故書稱疾而遁則其托詞避嫌之意可見矣此固責備賢者之意也太皇太后詔嘉王擴成服即位尊帝為太上皇帝皇后為太上皇后留正既去人心益搖會帝臨朝忽仆於朝趙汝愚憂危不知所出內禪之議益決屬工部尚書趙彥逾結殿帥郭果而與左選郎官葉適左司郎中徐誼謀可以白內禪意於太皇太后者乃遣知閣門事韓托胄托胄琦五世孫太后女弟之子也托胄因所善內侍張宗尹以奏太后不獲命明日往又不獲命逡巡將退內侍關禮見而問之托胄具述汝愚意禮令少俟入見太后而泣太后問故禮對曰聖人讀書萬卷亦嘗見有如此時而保無亂者乎太后曰此非汝所知禮曰此事人人知之今丞相已出所賴者趙知院旦夕亦去矣言與淚俱下太后驚曰知院同姓事體與他人異乃亦去乎禮曰知院未去非但以同姓故以太皇太后為可恃耳今定大計而不獲命勢不得不去去將如天下何願聖人三思太后問托胄安在禮曰臣已留其俟命太后曰事順則可令諭好為之禮報托胄且云來早太后於夀皇梓宫前垂簾引執政托胄復命日已向夕汝愚始以其事語陳騤余端禮亟命殿帥郭果等夜以兵分衛南北內關禮使傅昌朝密製黃袍是日嘉王謁告以入臨時將禫祭汝愚曰禫祭重事王不可不出翌日甲子羣臣入王亦入汝愚率百官詣梓宫前太后垂簾汝愚率同列再拜奏皇帝疾未能執喪臣等乞立皇子嘉王為太子以係人心皇帝批出有甚好二字繼有念欲退間之旨取太皇太后處分太后曰既有御筆相公當奉行汝愚曰茲事重大播之天下書之史册須議一指揮太后允諾汝愚袖出所擬太后指揮以進云皇帝以疾至今未能執喪曾有御筆自退間皇子嘉王擴可即皇帝位尊皇帝為太上皇帝皇后為太上皇后太后覽畢曰甚善汝愚奏自今臣等有合奏事當取嗣君處分然恐兩宫父子間有難處者須煩太后主張又奏上皇疾未平驟聞此事不無驚疑乞令都知楊舜卿提舉本宫任其責遂召舜卿至簾前靣諭之太后乃命汝愚以旨諭皇子即位皇子固辭曰恐負不孝名汝愚奏天子當以安社稷定國家為孝今中外人人憂亂萬一變生置太上皇何地衆扶皇子入素幄被黃袍方却立未坐汝愚率同列再拜皇子詣几筵奠哭盡哀須臾立仗訖催百官班皇子衰服出就重華殿東廡素幄立內侍扶掖乃坐百官起居訖行禫祭禮尋詔即以寢殿為泰安宫以奉上皇民心悅懌中外宴然汝愚之力也發明當時禪位之議非出於光宗之本心乃羣臣之權變故綱目特書太皇太后詔嘉王擴成服即位若夫髙宗孝宗之傳則異乎是故書法亦不容於強同也君子宜詳觀焉廣義嗚呼逆惇父疾不問安父崩不成服惟婦言是用動輒稱疾既云有疾何與虐后招搖玉津乎作偽心勞何益之有迹其所為大逆不道且五霸之君尚以誅不孝為盟當時金人若興問罪之師則宋人蕞爾之國其能保有乎汝愚貴戚之卿也此舉得矣孟子曰反覆之而不聼則易位汝愚有焉立皇后韓氏后琦六世孫父曰同卿托胄則其季父也被選入宫能順適兩宫意遂歸嘉王邸至是立為后大赦以趙汝愚兼權參知政事汝愚首裁抑僥幸收召四方知名之士中外引領望治復召留正赴都堂視事正既去及帝即位以為大行攢宫總護使入謝復出城大皇太后命速宣押趙汝愚復以為請帝手札遣使召正還侍御史張叔椿請議正棄國之罰乃徒叔椿為吏部侍郎而正復相詔求直言發明人君即位之初而能詔求直言此固為政之先務從善之盛心也然綱目雖書其詔求直言而分注略不見其言事之臣茍非言不足録是必虛應故事也不然堂堂中國濟濟多士豈無片言隻字之可紀哉觀於此則當時之政治亦略可見矣以趙汝愚為右丞相汝愚辭遂以為樞密使留正至汝愚乞免兼參知政事乃拜右丞相汝愚辭曰同姓之卿不幸處君臣之變敢言功乎乃命為樞密使以陳騤知樞密院事羅點簽書院事余端禮參知政事加殿前都指揮使郭杲武康節度使知閣門事韓托胄汝州防禦使韓托胄欲推定䇿功趙汝愚曰吾宗臣汝外戚也何可以言功惟爪牙之臣則當推賞乃加杲節錢但遷托胄防禦使托胄大失望然以傳導詔旨浸見親幸時時乘間竊弄威福如臨安府徐誼告汝愚曰托胄異時必為國患宜飽其欲而逺之不聼汝愚欲推葉適之功適辭曰國危效忠職也適何功之有及聞托胄觖望言於汝愚曰托胄所望不過節鉞宜與之不從適嘆曰禍自此始矣遂力求補外發明嘗觀君子之所存者天理小人之所存者人欲是以君子之謀事直而易小人之謀事曲而深臣於汝愚伲胄之事見之矣是時韓趙皆預定䇿之功趙為宗臣韓為外戚然趙能辭右相之命而韓欲冀節鉞之加此固君子小人立心處事之不同也逮夫趙加防禦韓心失望而為異日切齒之深讎當時徐誼葉適非不切諌趙皆弗從豈其智之不足耶盡吾天理之心而已矣橫逆之來烏足計哉綱目書此乃所以志其禍之始也吁貶內侍陳源等十人侍御史章頴論源及楊舜卿林億年離間之罪詔皆貶官斥外發明源等離間兩宫其罪已甚按法行辟死有餘辜寧宗於數閹奴惓惓不舍兹因公論僅克貶官果何謂乎綱目書貶陳源等若無罪然者所以譏宋罰之不以罪也嗚呼微矣八月召朱熹至以為煥章閣待制兼侍講先是黃裳為嘉王府翊善上諭之曰嘉王進學皆卿之功裳謝曰若欲進德修業追迹古先哲王則須尋天下第一等人上問為誰裳以熹對彭龜年為嘉王府直講因講魯莊公不能制其母云母不可制當制其侍御僕從王問此誰之説對曰朱熹説也自後每講必問熹説如何至是趙汝愚首薦熹遂自知潭州召入經筵熹在道聞泰安朝禮尚缺近習已有用事者即具奏云陛下嗣位之初方將一新庶政所宜愛惜名器若使幸門一開其弊不可復塞至於慱延儒臣専意講學必求所以深得親歡者為建極導民之本使所以大振朝綱者為防微慮逺之圖不報且辭新命不許及入對首言乃者太皇太后躬定大䇿陛下寅紹丕圖可謂處之以權而庶幾不失其正今反不能無疑於逆順之際竊為陛下憂之尤有可諉者亦曰陛下之心前日未嘗有求位之計今日未嘗忘思親之心此則所以行權而不失其正之根本也充未嘗求位之心以盡負罪引慝之誠充未嘗忘親之心以致溫凊定省之理始終不越乎此而大倫可正大本可立矣時趙彥逾按視孝宗山陵以為土肉淺薄下有水石孫逄吉覆按乞别求吉兆有旨集議熹上議狀言夀皇聖德衣冠之藏當博古名山不宜偏信臺史委之水泉沙礫之中不報廣義寧宗新服厥命而首舉大儒可謂慶矣綱目大書曰召朱熹為煥章閣侍制兼侍講文無美辭而美在其中矣增置講讀官從趙汝愚之請以給事中黃裳中書舍人陳傅良彭龜年為之詔經筵官開陳經旨救正缺失晚講官賜坐以講內批罷左丞相留正韓托胄浸謀預政數請都堂正使省吏諭之曰此非知閣日往來之地托胄怒而退會正與汝愚議攢宫不合托胄因間之於帝遂以手詔罷正出知建康府正謹法度惜名器毫髮不可干以私與周必大俱以相業稱發明觀易遁之大象曰君子以逺小人不惡而嚴傳曰嚴者君子自守之常而小人自不能近姤之九二曰包有魚無咎不利賔傳曰魚隂物二與初遇為包有魚之象然制之在已故猶可以無咎若不制而使遇於衆則其為害廣矣當時留正忌韓托胄之詣都堂拒之甚峻可謂有不惡而嚴之意然不能制之在己則其害為甚廣焉由此假托內批進退宰執其端雖微其勢浸盛是蓋留趙諸賢不能制之於微也雖然一介小人遽竊國柄寧宗之心如何哉綱目書此始焉惜之終焉譏之也以趙汝愚為右丞相汝愚本倚留正共事怒韓托胄不以告及來謁因不見之伲胄慙忿羅點謂汝愚曰公誤矣汝愚悟乃見之托胄終不懌九月羅點卒點孝友端介不為矯激之行或謂天下事非才不辦點曰當論其心心茍不正才雖過人果何取哉時給事中黃裳亦卒趙汝愚泣謂帝曰黃裳羅點相繼淪謝二臣不幸天下之不幸也以京鏜簽書樞密院事初帝以除鏜帥蜀趙汝愚謂人曰鏜望輕資淺豈可當此方面鏜聞而憾之由是韓托胄引以自助冬十月內批以謝深甫為御史中丞劉德秀為監察御史罷右正言黃度韓托胄日夜謀去趙汝愚知閣門事劉弼亦以不得預內禪心懷不平因謂托胄曰趙相欲専大功君豈惟不得節鉞將恐不免嶺海之行伲胄愕然問計弼曰惟有用臺諌耳伲胄問若何而可弼曰御筆批出是也托胄然之遂以內批拜給事中謝深甫為中丞會汝愚請令近臣薦御史伲胄密以其黨劉德秀屬深甫遂以內批用之由是劉三傑李沐等牽連以進言路皆伲胄之人排斥正士朱熹憂其害政每因進對為帝切言之又約吏部侍郎彭龜年同劾托胄會龜年出護使客不果熹復疏白汝愚當以厚賞酬托胄之勞勿使預政汝愚為人疏謂其易制不以為慮黃度將上疏論伲胄之姦伲胄覺之以御筆除度知平江府度言蔡京擅權天所下由以亂今伲胄假御筆逐諌臣使俯首去不得效一言非國之利也固辭奉祠歸飬發明一隂之生其勢雖微聖人必謹之者慮其浸也一小人之進其名雖卑君子必憂之者恐其蠧政也是故聖人作易每扶陽而抑隂先王治國恆親賢而逺佞蓋深甫德秀險邪小人伲胄黨類引為臺諌其志可知是乃拔茅茹而以其彚也小人豈不連類而進乎黃度將欲紏劾即被罷去則是正道不行而邪説暴橫矣小人之禍何其烈哉綱目特揭而書之於册者蓋亦深罪當時垂戒後世也廣義分注載內批由於伲胄於以見寧宗初政皆在托胄掌握寧宗特擁虛器而已伲胄薦引羣小而寧宗一切用之由是降其國于闍昧矣惜哉詔議祧廟時以孝宗祔廟議宗廟迭毁之制孫逄吉曽三復首請併祧禧宣二祖奉太祖居第一室祫祭則正東向之位有旨集議禧順翼宣四祖祧主宜有所歸自太祖首尊四祖之廟治平間議者以世數寖逺請遷禧祖於夾室後王安石等奏禧祖有廟與稷契無異請復其舊丞相趙汝愚不以復祀禧祖為然侍從多從其説吏部尚書鄭僑欲且祧宣祖而祔孝宗侍講朱熹以為藏之夾室則是以祖宗之主下藏於子孫之夾室又擬為廟制以為物豈有無本而生者廟堂不以聞而毁撤僖宣廟室更劄别廟以奉四祖發明若魯人祀春秋譏之然猶未至於祧廟也今寧宗欲議宗廟迭毁之制方且欲祧禧順翼宣而諛臣如孫逄吉曽三復又從而逢其惡故雖議終不決而綱目亦必直書以貶之也夫寧宗嗣宋鴻基躬為子孫今乃欲祧其四祖則其肆行不道為可知矣况伲胄區區椒房一外戚復何所憚宜得専執朝柄而不顧也噫閏月內批罷煥章閣待制兼侍講朱熹熹每進講務積誠意以感動帝心以平日所論著敷陳開析坦然明白可舉而行講畢有可以開益帝德者罄竭無隱帝亦虛心嘉納焉至是以黃度之去因講畢奏疏極言陛下即位未能旬月而進退宰臣移易臺諫皆出陛下之獨斷中外咸謂左右或竊其柄臣恐主威下移求治反亂矣疏入伲胄大怒使優人峩冠闊袖象大儒獻於帝前因乘間言熹迂闊不可用帝方倚任伲胄乃出御批云憫卿耆艾恐難立講已除卿宫觀趙汝愚袖御筆見帝且諌且拜帝不省汝愚因求罷政不許越二日伲胄使其黨封內批付熹熹即附奏謝遂行中書舍人陳傅良封還録黃起居郎劉光祖起居舍人鄧馹御史吳獵吏部侍郎孫逢吉登聞鼓院遊仲鴻交章留熹皆不報傅良光祖亦坐罷工部侍郎黃艾因侍講問逐熹之驟帝曰始除熹經筵耳今乃事事欲與聞艾力辨其故帝不聼熹登第五十年仕於外僅九考立朝才四十六日進講者七知無不言既去伲胄益無所忌憚矣發明若是乎君子之道難行也朱子在朝積誠諷諫罄竭無隱帝亦虛心嘉納庶幾有行道之基也兹因正人漸逐而乃上疏條陳激怒托胄擯斥經筵嗚呼君子所學者正道所行者正事其事君以正乃其分耳不意見忤權佞從中沮之使道既不行復為黜罷然則君子之於小人何薰蕕氷炭之相反也自假內批而君子不能措手足矣宋之世何治日常少而亂日常多哉特書內批而皆不去其官則惜君子而罪小人之意為可見廣義丞相留正之罷以內批待制文公之罷以內批羣姦謝深甫等進亦以內批厥後進伲胄罷龜年亦以內批則知寧宗雖處天位要亦韓氏之厮役耳噫寧宗暗弱而伲胄窮凶極惡如此寧不斬宋之國脈而召玉津之禍乎十一月以韓托胄兼樞密都承旨初詔托胄可特遷二官托胄覬覦節鉞意不滿力辭乃止遷一官為宜州觀察使怨趙汝愚益深至是特遷都承旨詔行孝宗皇帝喪三年先是有司請於易月之外用漆紗淺黃之制朱熹在講筵奏言自漢文短喪厯代因之天子遂無三年之喪為父且然則嫡孫承重可知人紀廢壞三綱不明千有餘年莫能釐正夀皇聖帝至性自天易月之外猶執通喪朝衣朝冠皆用大布所宜著在方册為萬世法桯陛下以世嫡承大統承重之服著在禮律宜遵夀皇已行之法一時倉卒不及詳議遂用漆紗淺黃之服使夀皇已行之禮舉而復墜臣竊痛之然既往之事不及追改啓殯發引禮當復用初喪之服至是詔遵用三年之制中外百官皆以涼衫視事蓋用熹言也葬永阜陵十二月內批罷吏部侍郎兼侍講彭龜年進韓托胄一官托胄權勢日重龜年上疏條奏其姦請去之且云陛下逐朱熹太暴故欲陛下亦亟去此小人母使天下人謂陛下去君子易去小人難於是龜年伲胄俱請祠帝欲兩罷其職陳騤進曰以閣門去經筵何以示天下既而內批龜年與郡托胄進一官與在京官觀給事中林大中中書舍人樓鑰繳奏以為非是不聼給是伲胄愈橫發明魯齊許氏曰人君處億兆之上所操者豫奪進退賞罰生殺之權不幸見欺以非為是以是為非其害可勝慨耶是時托胄權勢日重龜年上疏條陳既而兩皆請祠當辨是否然則罷托胄而用龜年於法則宜罷龜年而用托胄於義則悖夫何於龜年則罷其職於伲胄則進一官公道之心果安在哉由是豫奪賞罰之權亂而伲胄愈橫難制矣綱目書此蓋亦不得已之意也吁陳騤罷以余端禮知樞密院事京鏜參知政事鄭僑同知樞密院事騤與趙汝愚素不協未嘗同堂語及爭彭龜年事韓人托胄語人曰彭侍郎不貪好官故也元樞亦欲為好耶故罷之而引京鏜居政府以間汝愚汝愚孤立於朝天子亦無所倚信以趙彥逾為四川制置使工部尚書趙彥逾以有功於帝室冀趙汝愚引居政府及附蜀帥大怒遂與韓托胄合因陛辭疏廷臣姓名於帝指為汝愚之黨且曰老奴今去不惜為陛下言之由是帝亦疑汝愚矣乙邜寧宗皇帝慶元元年金明昌六年春正月白虹貫日以李沐為右正言二月罷右丞相趙汝愚韓托胄欲逐汝愚而難其名謀於京鏜鏜曰彼宗姓也誣以謀危社稷則一網打盡矣托胄然之以祕書監李沭嘗有怨於汝愚引為右正言使奏汝愚以同姓居相位將不利於社稷乞罷其政以尊安天位杜塞姦源是日汝愚出浙江亭待罪遂以觀文殿大學士出知福州謝深甫等論汝愚冒居相位今既罷免不當加以書殿隆名帥藩重寄乞令奉祠請咎命提舉洞霄宫直學士院鄭湜草制詞有曰頃我家之多難賴碩輔之精忠特危定傾安社稷以為悅任公竭節利國家無不為坐無貶詞亦免官兵部侍郎章頴侍經幃帝曰諌官有言趙汝愚者鄉等謂何同列漫無可否頴奏曰天地變遷人情危疑加以敵人嫚侮國勢未安未可輕退大臣願降詔宣諭汝愚毋聼其去國子祭酒李祥言去嵗國遭大戚中外洶洶留正棄宰相而去官僚幾欲解散軍民皆將為亂兩宫隔絶國喪無主汝愚以樞臣獨不避殞身滅族之禍奉太皇太后命翊陛下以登九五勛勞著於社稷精忠貫於天地乃卒受黯黮而去天下後世其謂何知臨安府徐誼素為汝愚所器凡有政務悉多咨訪之誼隨事禆助不避形迹又嘗勸汝愚早退及豫防托胄之姦托胄尤怨之及是與國子博士楊簡亦抗諭留汝愚李沐劾為黨皆斥之發明災異必書重天變也白虹者妖氣所凝托胄之謂也日者人君之表寧宗之謂也以白虹而貫日以妖氣而侵陽况當即位紀元之始其意豈不明且切歟宋之君臣未見其有憂勤修省之心而托胄小人反挾私忿以相報復官李沐之姦邪誣汝愚之謀逆寧宗不察是非罷其相位豈不深可哀哉汝愚不能制伲胄而卒為托胄所制詎非臣不密則失身之驗乎明乎此然後可論綱目之書法矣三月朔日食廣義二月趙汝愚鄭湜章頴李祥徐誼楊簡諸賢之罷三月即有日食之變况乎正月白虹貫日所以著伲胄凶惡之兆也上天垂戒近且昭矣寧宗恬不知省未聞其求直言言闕失之事方且滋伲胄之暴斥逐正人靡所不為迹其所以為君又徽欽之不若也徽欽特以金人方熾而寧宗則遇金人始衰故其事有不同耳雖然蒙古之禍未必不基於寧宗也夏四月安置大府寺丞吕祖儉於韶州祖儉上書訴趙汝愚之忠併論朱熹老儒彭龜年舊學李祥老成不當罷斥語侵韓伲胄有旨祖儉朋比罔上送韶州安置中書舍人鄧馹繳奏祖儉不當貶不從樓鑰因進讀論及之伲胄語人曰復有論救祖儉者當處以新州衆乃不敢言或謂托胄曰自趙丞相去天下已切齒今又投祖儉瘴鄉不幸或死則怨於重伲胄始改送吉州祖儉嘗曰因世變有所摧折失其素履者固不足言因世變而意氣有所加者亦私心也竟死吉州以余端禮為右丞相鄭僑參知政事京鏜知樞密院事謝深甫簽書院事流太學生楊宏中等六人宏中與周端朝張衜林仲麟蔣傅徐範六人伏闕上書言近者諌官李沐諭罷趙汝愚中外咨憤而李沐以為父老歡呼蒙蔽天聼一至於此陛下獨不念去嵗之事乎人情驚疑變在朝夕是時假非汝愚出死力定大議雖百李沐罔知攸濟當國家多難汝愚立樞府本兵柄指揮操縱何向不可不以此時為利今上下安妥乃有異意乎章頴李祥楊簡發於中激力辨其非即遭斥逐六館之士拂膺憤怨李沐自知邪正不兩立思欲盡覆正人以便其私必託朋黨以罔陛下之聼臣恐君子小人消長之機於此一判則靖康已然之驗何堪再見於今日邪伏願陛下念汝愚之忠勤察祥簡之非黨灼李沐之回邪竄沐以謝天下還祥等以收士心疏上詔宏中等罔亂上書扇搖國是悉送五百里外編管宏中衜仲麟範皆福州人端朝溫州人傳信州人傳久居太學忠鯁有聞扣閽之事皆其屬藁發明傳曰好直而惡枉天下之至情然人每失其正者心有所倚而不能自克也汝愚被讒而貶人神之所共憤然伲胄權傾人主滿朝側目無敢忤逆唯吕祖儉正明汝愚之寃於前楊宏中等暴白汝愚之寃於後激怒權姦遂背竄逐嗚呼公論不行而邪説暴橫君子不幸而處於昏曀之時也詳書於䇿其義自見廣義嗚呼君子不幸而處汙世鮮有不罹其禍者也自暴秦坑儒之後其間亡國之事或誣指朋黨或禁錮黨人未聞有流太學生之名也惟宋之徽髙二宗居此惡聲而不疑焉昔徽宗放太學生鄧肅於田里惑於蔡京也高宗殺太學生陳東惑於黃潛善也鄧肅之放陳東之死雖由於蔡京潛善然猶稟命於徽宗至于宏中等之流寧宗出自己見始有甚於徽髙也嗟夫太學者董子所謂賢士之所關也人君培飬之則國以之興戕賊之則國以之亡自古國之興亡皆由乎此况乎士之未遇者其平日涵飬薰陶孰不欲正君而善俗修政而立事辨義利之分明邪正之異茍於國事危迫之秋而不正言之則視君父為途人實自負於作飬也惡在其學為忠與孝哉彼宏中等非不知禍隨於言誠以情激於中不能自已是以但知在已之納忠而不虞君父之加罪也然則寧宗之流六君子六君子非所憂也而國無仁賢寧宗實可憂矣六月右正言劉德秀乞考核邪正真偽遂罷國子司業汪逵等自程皓程頥傳孔孟千載之學其徒楊時傅之羅從彥從彥傳之李侗朱熹師侗致知力行其學大振流俗醜正多不便之遂有道學之名隂以功詆及韓伲胄用事士大夫素為清議所擯者乃教以凡相與異者皆道學之人也隂疏姓名授之俾以次斥逐或又為言以道學目之則又何罪當名曰偽學蓋謂貪黷放肆乃人真情亷潔好修者皆偽耳由是有偽學之目善類皆不自安至是德秀上言邪正之辨無過於真與偽而已彼口道先王之言而行如市人所不為在興王之所必斥也昔孝宗垂意規復首務核實凡言行相違者未嘗不深知其姦臣願陛下以孝宗為法考核真偽以辨邪正詔下其章由是博士孫元卿袁燮國子正陳武皆罷汪逵入札子辨之德秀以逵為狂言亦被斥中丞何淡急欲執政亦上疏言專門之學流而為偽空虛短拙文詐沽名願風厲學者専師孔子不必自相標榜詔榜於朝堂既而吏部郎官師旦復請考核真偽被遷左司員外郎又有張貴模者指論太極圖亦被賞擢淡復上疏言在朝之臣大臣既孰知其邪迹然亦不敢白發以招報復之禍望明詔大臣去其所當去者發明易曰方以類聚物以羣分吉凶生矣伲胄得志誣陷善良巧立淫名簧惑主聽由是劉德秀之徒希求固寵羽翼成風而遂有邪正真偽之言嗚呼以正為邪以邪為正以真為偽以偽為真君子受禍博矣汪逵等上疏辨論遂皆罷黜然則正人何讎於國而見絶之深乎此小人之心邪欲既熾末流無窮駸駸乎不至於敗國亡家而不已其禍何烈哉是以人主謹於取舍毋使君子小人雜遝於清明之朝焉耳綱目書此其亦垂戒來世云廣義自古國於天地間者未有無正學扶持之而能獨立者也無正學則天理銷人欲熾人將相戕相賊如禽獸之相搏相噬者焉欲為君而臣弒之欲為父而子弒之人類之滅蓋有不難者矣故曰君不君臣不臣父不父子不子雖有粟吾得而食諸彼三代之學所以明人倫者其意蓋慮此也今寧宗之朝太學生流之國子官罷之則是居中國去人倫無君子之謂也尚可以名人國哉大易豐之上六有曰豐其屋蔀其家其户閴其無人三嵗不覿凶此之謂歟加韓托胄保寧節度使冬十一月竄故相趙汝愚於永州汝愚至衡州暴卒韓伲胄忌汝愚必欲置之死以息人言至是用何淡疏落汝愚觀文殿大學士及官觀監察御史胡紘遂上言汝愚倡引偽徒謀為不軌乘龍授鼎假夢為符因條奏其十不遜且及徐誼詔責汝愚寧逺軍節度副使永州安置誼惠州團練副使南安軍安置時汪義端當制遂用漢誅劉屈氂唐戮李林甫事示欲殺之之意迪功郎趙師召亦上書乞斬汝愚帝不從汝愚怡然就道謂諸子曰觀托胄之意必欲殺我我死汝曹尚可免也明年正月行至衡州病作衡守錢鍪承伲胄密諭窘辱百端汝愚暴薨天下聞而寃之訃聞有旨追復元官許歸葬中書舍人吳宗旦繳還復官之命汝愚學問有用常以司馬光富弼韓琦范仲淹自期凡平昔所聞於師友如張栻朱熹吕祖謙汪應辰王十朋胡銓李燾林光朝之言欲次第行之未果而罷政初汝愚嘗夢孝宗授以湯鼎背負白龍升天後翼嘉王以素服即位蓋其驗也讒者遂以為罪云發明汝愚賢相而為權姦所妬客死遐方誠神人之共憤天理所不容通鑑續編書安置提舉洞霄宫趙汝愚而不稱其官則是汝愚有罪之可貶也何以允愜輿情乎至我朝綱目始明其誣枉變文特書曰竄故相趙汝愚於永州至衡州暴卒所以扶天理遏人欲表忠賢之節正姦宄之心其旨嚴矣然而曰故相既以明其無罪曰暴卒復以哀其人命也廣義嗚呼汝愚安置永州可以快托胄之意矣何托胄肆毒若是之甚耶想夫托胄之意以為汝愚人望也其或不死他日必為我之憂此所以致其必死乃姦人之用心也彼汝愚之死人皆寃之臣獨惜其忠有餘而智不足也當其為右相之日已忤伲胄及伲胄勢質薰灼仗內批以斥逐忠良無一可免汝愚即當引退避伲胄如蛇蠍角巾私第奉祠丘園如韓世忠之避秦檜可也如此則忠智兩盡其美可勝言哉詩曰既明且哲以保其身汝愚不此之講惜哉金平章政事完顔守貞罷守貞剛忠明亮通習典故凡論對必傳經義時金有國七十年禮樂刑政多因舊制金主欲更定修正為一代法其儀式條約多守貞裁訂故明昌之始號稱清明又好接引善類以列朝廷為胥持國所忌罷去丙辰二年金承安元年春正月以余端禮京鏜為左右丞相謝深甫參知政事鄭僑知樞密院事何淡同知院事廣義權莫重於丞相樞密姦莫甚於端禮之徒以至姦之人而握至重之權則宋事日非斷可識矣二月以端明殿學士葉翥知貢舉翥與劉德秀同知貢舉奏言偽學之魁以匹夫竊人主之柄鼓動天下故文風未能丕變乞將語録之類盡行除毁故是科取士稍涉義理者悉皆黜落六經語孟中庸大學之書為世大禁淮西總領張釡上言邇者偽學盛行賴陛下聖明斥罷天下皆洗心滌慮不敢復為前日之習願明詔在位之臣上下堅守勿變毋使偽言偽行乘間而入以壞既定之規模乃除釡尚書左司郎官發明是時以偽學斥君子而所用者皆蠅營狗茍之徒如以余端禮京鏜為丞相謝深甫之為參政鄭僑之知樞密何淡同知院事葉翥之知貢舉此皆托胄之瓜牙其同惡相濟為如何哉天下不治從可知矣故綱目詳書以著其失也夏四月余端禮罷時韓伲胄擅權屏斥正士端禮鬱鬱不愜志稱疾求罷以何淡參知政事葉翥簽書樞密院事罷吏部侍郎倪思初翥要思列疏論偽學思不從韓伲胄遂薦翥而罷思秋七月罷殿中侍御史黃黼中書舍人汪義端引唐李林甫故事以偽學之黨皆名士欲盡除之大皇太后聞而非之帝乃詔臺諌給舍論奏不必更及舊事務在平正以副朕建中之意姚詔下韓托胄及其黨皆怒劉德秀遂與御史張伯垓愈等上疏力爭以為不可乃改不必更及舊事為不必専及舊事自是伲胄與其黨攻治之志愈急矣黃黼上言治道在黜首惡而任其賢使才者不失其職而不才者無所憾故仁宗嘗曰朕不欲留人過失於心此皇極之道也遂罷黼而以姚愈代之發明劉更生曰執狐疑之心者來讒賊之口持不斷之意者開羣枉之門讒邪進則衆賢退羣枉成則正士消是時羣隂盈朝君子道否倪思以不論偽學見逆伲胄而罷官黃黼以正言和解見忤托胄而罷黜是知小人之禍列於湯火蹈之即爛觸之即焦不亦慘乎寧宗故縱姦宄權勢下移是亦委裘之主爾綱目皆以無罪例書其義可見廣義分注載黃黼曰治道在黜首惡其意蓋指伲胄也於時前後左右皆托胄之黨而黃黼則一薛居州也一薛居州獨如宋王何八月禁用偽學之黨太常少卿胡紘上書言比年以來偽學猖獗圖為不軌動搖上皇詆誣聖德幾至大亂賴二三大臣臺諌出死力而排之故元惡隕命羣邪屏迹自御筆存救偏建中之説或者誤認天意急於奉承倡為調停之議取前日偽學之姦黨次第用之以冀幸其他日不相報復往者建中靖國之事可以為戒陛下何未悟也宜令退伏田里循省愆咎遂詔偽學之黨宰執權住進擬自是學禁愈急大理司直邵裒然言三十年來偽學顯行場屋之權盡歸其黨乞詔大臣審察其所學詔偽學之黨勿除在內差遣已而言者又論偽學之禍乞監元祐調停之説杜其根源遂有詔監司帥守薦舉改官並於奏牘前聲説非偽學之人會鄉試漕司前期取家狀必令書以不是偽學五字撫州推官柴中行獨申漕司云自幼習易讀程氏易傳未委是與不是偽學如以為偽不願考校士論壯之發明楊氏曰欲激人主之怒莫如黨論欲盡逐天下之君子以求空天下之人才亦莫如黨論親族黨也交遊黨也薦引黨也欲陷一士止於一士而已矣至舉而治之以黨則親族也交遊也所薦引也可一網而盡矣漢之黨錮唐之牛李與宋之黨人是也嗚呼是知小人之心欲欺人主以誣君子必杜撰淫名謂之偽學則庶幾君無疑心國無異議蓋將盡驅正人以遂己私云爾殊不知尺霧障天不虧於大寸雲點日何損於明也哉綱目特揭而書之者所以惡小人之専權哀君子之不幸也冬十月召陳賈為兵部侍郎以其嘗擊朱熹也十二月削祕閣修撰朱熹官竄處士蔡元定於道州熹家居自以蒙纍朝知遇之恩且尚帶從臣職名義不容默乃草封事數萬言陳姦邪蔽主之禍因以明丞相趙汝愚之寃子弟諸生更進迭諌以為必且賈禍熹不聽蔡元定請以蓍決之遇遁之同人熹默然取藁焚之遂上奏力辭職名詔仍充祕閣修撰時臺諫皆韓伲胄所引洶洶爭欲以熹為奇貨然無敢先發者胡紘未逹時嘗謁熹於建安熹待學子惟脫粟飯遇紘不能異也紘不悅語人曰此非人情隻雞尊酒山中未為乏也及是為監察御史乃鋭然以擊熹任責物色無所得經年醖釀章疏乃成會改太常少卿不果有沈繼祖者為小官時嘗採托熹語孟之語以自售至是以追論程頥得為御史紘以疏草授之繼祖謂可立致富貴遂誣論熹十罪且言熹剽竊張載程頥之餘論以喫菜事魔之妖術簧鼓後進張浮駕誕私立品題收召四方無行義之徒以益其黨伍潛形匿迹如鬼如魅乞禠熹職罷祠其徒蔡元定佐熹為妖乞送别州編管詔熹落職罷祠竄元定於道州已而選人余嚞上書乞斬熹以絶偽學謝深甫抵其書於地語同列日朱元晦蔡元定不過自相講明耳果何罪乎事乃止元定生而頴異父發博覽羣書以程氏語録邵氏經世張氏正蒙授元定曰此孔孟正脈也元定深涵其義既長辨折益精登建陽西山絶頂忍飢啖薺以讀書聞熹名往師之熹叩其學驚曰季通吾老友也凡性與天道之妙他弟子不得聞者必以語元定焉尤袤楊萬里交薦於朝召之不起會偽學黨禁之論起元定曰吾其不免乎及聞貶不辭家即就道熹與從遊者百餘人飢别蕭寺中坐客興歎有泣下者熹微視元定不異平時因喟然曰友朋相愛之情李通不挫之志可謂兩得矣衆謂宜緩行元定曰獲罪於天天可逃乎杖屨同其子沉行三千里腳為流血無蔑微見言靣至舂陵逺近來學者日衆州士子莫不趨席下以聼講説愛元定者謂宜謝生徒元定曰彼以學來何忍拒之若有禍患亦非閉門塞竇所能避也貽書訓諸子曰獨行勿愧影獨寢不愧衾勿以吾得罪故遂懈其志在道逾年卒元定於書無所不讀於事無所不究義理洞見大原圖書禮樂制度無不精妙著洪範解大衍詳説律吕新書行於世學者尊之曰西山先生熹嘗曰造化微妙惟深於理者能識之吾與季通言而不厭也每諸生請疑必令先質元定而後為之折衷小人無深嫉之故是時有朱熹倡偽蔡元定實羽翼之之奏發明天下有無形之禍僣非權臣而僣於權臣擾非盜賊而擾於盜賊強非敵國而強於敵國其惟朋黨之論乎是時嚴禁正學君子道否而狐媚狗趨之徒欲希富貴阿順成風以攻陷君子為竒功以排斥正人為能事沈繼祖據托姦言詆誣朱蔡誠王法之所不原也寧宗信而任之抑又何哉綱目以無罪例書之其義蓋可見矣廣義文公之罷官季通之竄逐綱目偹書於册適足以遺寧宗萬年之臭流朱蔡百世之芳然則抑之者乃所以掦之也毁之者乃所以譽之也於朱蔡二賢惡何損丁巳三年金承安二年春正月鄭僑罷夏閏六月貶留正為光祿卿居之邵州朝散大夫劉三傑免喪入見論偽學之黨今變而為逆黨防之不可不至及論留正共引偽學之罪伲胄大喜即日降旨除三傺右正言正坐貶邵州居住秋八月金胥持國有罪免九月復以持國參知政事持國為金主信任與李妃管擅朝政張復亨等十人皆趨走其門俱為御史臺官時謂之胥門十哲至是為言者所論持國致仕十人皆外補未幾復召持國參知政事發明去惡不逺則惡日長討罪不亟則罪益深持國擅竊君權濁亂朝政金主既知其姦而罷黜之矣復召用之謂之何哉直書於䇿深譏之也冬十一月太皇太后吳氏崩諡曰憲聖慈烈十二月籍偽學罷吏部侍郎黃由知綿州王沇上疏乞置偽學之籍仍自今曾受偽學舉薦關陛及刑法亷吏自代之人並令省部籍記姓名與間慢差遣從之於是偽學逆黨得罪著籍者趙汝愚留正周必大王藺四人為之首朱熹徐誼彭龜年陳傅良薛叔似章頴鄭湜樓鑰林大中黃由黃黼何異孫逄吉劉光祖吕祖儉葉適楊芳項安世沈有開曽三聘遊仲鴻吳獵李祥楊簡趙汝讜趙汝談陳峴范仲黼汪逵孫元卿袁燮陳武田淡黃度張體仁蔡幼學黃皓周南吳柔勝李􅌫王厚之孟浩趙鞏白炎震皇甫斌危仲任張致逺楊宏中周端朝張衙林仲麟蔣傳徐範蔡元定吕祖秦凡五十九人黃由上言人主不可待天下以黨與不必置籍以示不廣殿中侍御史張巖劾由阿附罷之而擢沇為利州路轉運判官發明上書籍偽學下書罷黃由則由為黨人而連坐之意明矣蓋宋之所謂偽學者皆正心誠意修齊治平之道治天下而舍此則將何所施乎寧宗之時小人道長君子道消誠天地閉賢人隱之時也君子不幸適丁其時立斯朝食斯祿而以斯道匡君道未得行先為窘辱使天下士大夫皆以正道自諱無敢言者然則小人之禍豈不甚可畏哉綱目比事而書之於䇿所以深為當時愧也廣義嗚呼學之為道伲胄所謂偽者乃所以為真也以真為偽偽者必多奚可籍哉然謂之籍則必有限而不知舉世皆偽豈特五十九人而已哉當時得與此籍者何其幸也黃由之言可謂辭不迫切而意已獨至者歟罷其官者由實快也戊午四年金承安三年春正月以葉翥同知樞密院事三月葬憲聖慈烈皇后夏五月加韓托胄少傅封豫國公詔嚴偽學之禁右諌議大夫姚愈復上言近世行險僥幸之徒倡為道學之名權臣力主其説結為死黨願下明詔播告天下於是命直學士院髙文虎草詔曰向者權臣擅朝偽邪朋比協肆姦宄包藏禍心賴天之靈宗廟之福朕獲奉慈訓膺受內禪隂謀壞散國勢復安嘉與士大夫厲精更始凡曰淫朋比德幾其自新而厯載臻兹弗迪厥化締交合盟窺伺間隙毁譽舛午流言間發以傾國是而惑衆心甚至竊附於元祐之衆賢而不思實類乎紹聖之姦黨朕既深詔二三大臣與夫侍從言議之官益維持正諭以明示天下矣諭告所抵宜各改視回聼毋復借疑似之説以惑亂世俗若其遂非不悔怙終不悛邦有常刑必罰毋赦詔既下韓托胄大喜即遷文虎愈於要職四川都大茶馬丁逄入對極論元祐建中調停之害且引蘇轍任伯雨之言為證京鏜何淡附托胄深悅逄言薦為軍器監發明嚴者已甚之詞也國勢以多才而扶抑不知正人君子何負於宋而棄絶之深耶自托胄得志無嵗不以偽學為事寧宗拱手而聼命焉甚可惡也孟子曰不仁者可與言哉安其危而利其災樂其所以亡者不仁而可與言則何亡國敗家之有嗚呼厥後偽學之禁甫息而窮兵黷武之念興天下之民從此疲矣然則小人不特貽禍於君子抑且貽禍於君父是以有天下國家之寄者不可不鑒爾吁廣義抑觀托胄以六經為偽學而禁之然其黨之草詔卒用六經之言如謝深甫韓氏之黨也乃曰朱元晦蔡元定不過自相講明耳果何罪乎觀此則托胄之黨非惡正而好偽也乃急於趨利亷耻道喪故也然則天理一點之明何嘗因其所好而泯滅哉此天之未定然也天定則其醜類自底滅亡耳何庸較之邪易曰君子得輿小人剝廬此之謂也秋七月葉翥罷八月以謝深甫知樞密院事許及之同知院事及之為吏部尚書諂事韓托胄無所不至居二年不遷見托胄流涕敘其知遇之意衰遲之狀不覺屈膝托胄惻然憐之故有是命托胄嘗值生辰羣公上夀既畢集及之適後至閽人掩關拒之及之大窘會門閘未及閉遂俯僂而入當時有由竇尚書屈膝執政之語傳以為笑育太祖十世孫與願於宫中賜名曮帝未有嗣京鏜等請擇宗室子育之詔育燕懿王德昭九世孫與願於宫中年六嵗矣尋以為福州觀察使賜名曮封衛國公以趙師􅋷為工部侍郎師􅋷附韓托胄得知臨安府托胄生日百官爭貢珍異師􅋷最後至出小合曰願獻少果核侑觴啓之乃粟金蒲桃小架上綴大珠百餘顆衆慙沮托胄有愛妾張談王陳四人皆封郡夫人其次有名位者又十人或獻北珠冠四枚於托胄托胄以遺四夫人其十人亦欲之未有以應也師􅋷間之亟市北珠製十冠以獻十人皆喜為求遷官拜工部侍郎托胄嘗與衆客飲南過山莊顧竹籬草舍曰此真田舍間氣象但欠犬吠雞鳴耳俄聞犬嘷叢薄視之乃師􅋷也托胄大笑聞者莫不鄙之冬十月金造承安實貨己未五年金承安四年春正月奪前起居舍人彭龜年等官初趙汝愚定䇿時樞密院直省官蔡璉從旁竊聼因而漏言汝愚竄之既而逃還臨安韓托胄聞之乃使璉誣告汝愚定策時有異謀具列賔僚所言凡七十餘紙詔下大理捕鞫彭龜年曽三聘沈有間葉適項世安等以實其事中書舍人范仲藝謂伲胄曰章惇蔡確之權不為不盛然而至今得罪於清議者以興大獄故耳相公胡為蹈之伲胄曰某初無此心以諸公見迫不容但已問其人乃知京鏜劉德秀實主其議伲胄取録黃藏之事遂格張釡劉三傑張巖程松等論之不己詔纍經赦宥宜免然猶奪龜年三聘官而擢璉進義副尉二月放主管玉虛觀劉光祖於房州光祖撰涪州學記謂學者明聖人之道以修其身而世方以道為偽以學為棄物好惡出於一時是非定於萬世諌議大夫張釡劾光祖佐逆不成蓄憤懷姦欺世罔上詔落職房州居住發明掦氏曰一陽獨存其猶嵗寒百果搖落之後尚餘一碩大之果而不為物食吁亦危矣自偽學之禁正人黜逐問有一二君子猶存如剝之碩果小人尚又吹毛求疵羅織其罪必求君子盡去小人盡留然後己否則有未巳年龜年以定䇿之事而奪其官光祖以撰記其事而落其職皆小人已甚之心也然則伲胄之罪可勝誅哉廣義觀光祖之言何其光明俊偉之至哉輝耀青史不亦宜乎夏五月行統天厯先是詔造新厯至是成賜名統天自建隆迄慶元二百五十年間厯十四變上距黃帝之厯凡五十變矣議者謂自渡江以來統天新厯尤復踈謬秋八月帝始朝太上皇於夀康宫帝率羣臣詣壽康宫上夀初見太上皇成禮而還明日羣臣以遇宫上夀禮成奉表稱賀發明始者初肇之詞以見帝未嘗朝至此而初見之也蓋形端則表正源潔則流清天子所為下觀而化也光宗既不朝其父寧宗亦不朝其父所謂上行下效捷於影響是以家齊而國治也豈非天理之反報乎雖然父雖不慈子不可以不孝光宗制於姤后而不朝其父此固無足言者寧宗既知其過安可效尤各欲自盡而已矣寧宗即位五年於兹朝父之禮僅克一見則其久曠定省豈不從可知哉特書始朝深罪之也廣義書曰始者以見前此未嘗朝也嗚呼寧宗之於光宗亦猶光宗之於孝宗也身教如此何足怪哉九月加韓托胄少師封平原郡王是嵗諸州大水發明加不宜加也托胄欺君蠧政無足言者而綱目前書加伲胄少傅封豫國公此書加伲胄少師封平原郡王噫一姦邪小人加爵之屢宜乎有以召天變也大水者隂逆而與怨氣并之所致帝行逆德而致隂沴宜矣諸州大水為天下記異也上書加伲胄爵下書諸州大水則伲胄召異莫明於此夫伲胄釁貫既盈為天所絶宋不之罪可勝惜哉綱目不言事應而事應具存觀於此類為可見矣六年金承安五年春閏二月以京鏜謝深甫為左右丞相何淡知樞密院事三月故祕閣修撰朱熹卒熹家貧故諸生自逺至者豆飯黎羮率與之共往往稱貸於人以給用非其道義一介不取也時攻偽學日急士之繩趣尺步稍以儒自名者無所容其身從遊之士特立不顧者屏伏丘壑倚阿巽懦者更名他師過門不入甚至變易衣冠狎遊市肆以自别其非黨而熹日與諸生講學不休或勸其謝遣生徒者笑而不答疾且革正坐整衣冠就枕而卒年七十一將葬右正言施康年言四方偽徒聚於信上欲送偽師之葬會聚之間非妄談時人短長則謬議時政得失望令守臣約束從之熹所著有易本義啓蒙蓍卦考誤詩集傳大學中庸章句或問論語孟子集注太極圖通書西銘解楚辭集注辨正韓文考異所編次有論孟集義孟子指要中庸輯略孝經刋誤小學書通鑑綱目宋名臣言行録家禮近思録河南程氏遺書伊洛淵源録儀禮經傳通解其門人不可勝計最知名者黃幹李燔張洽陳淳李方子黃灝蔡沉輔廣幹之言曰道之正統待人而後傳自周以來任傳道之責不過數人而能使斯道章章較著者一二人而止耳由孔子而後曾子子思得其微至孟子而始著由孟子而後周程張子繼其統至熹而始著衆以為知言幹初見熹夜不設榻不解帶熹語人曰直卿志堅思苦與之處甚有益因妻以女及熹病革以深衣及所著書授幹與之訣曰吾道之託在此吾無憾矣熹歿幹弟子日盛編禮著書講論經理朝夕不倦卒贈朝奉郎燔初見熹熹告以曽子宏毅之女燔因以宏名其齋凡諸生未逹者熹先令訪燔俟有所發乃從而折𠂻之諸生畏服燔嘗曰凡人不必待仕宦有位為執事方為功業但隨力到處有以及物即功業矣居家講道學者宗之卒贈直華文閣洽從熹學自六經傳注而下皆究其指歸熹嘉其篤志謂黃幹曰所望以永斯道之傳者二三君也洽自少用力於敬平居不異常人至義所當為則勇不可奪著春秋集注地理沿革表行於世仕終直寶章閣淳少習舉子業林宗臣見而竒之謂曰此非聖賢事業也因授以近思録淳讀之遂盡棄其業而學焉及熹至漳淳請受教為學益力熹語人曰吾南來喜得陳淳由是所聞皆切要語及熹沒淳追思之痛自裁抑無書不讀無物不格日積月纍義理貫通恬退自守多所著述仕終安溪主簿方子端敬純篤初見熹熹謂曰觀公為人自是寡過但寬大中要規矩和緩中要果決方子遂以果名其齋嘗曰吾於問學雖未能盡然幸於大本有見處此心常覺泰然不為物欲所漬耳灝性行端飭以孝友稱廣淳謹勤恪嘗著四書纂疏詩傳童子問以發明師旨沉元定子也著書傳發明凡卒故官録賢也子朱子發聖人未發之精藴集諸儒未集之大成正心修身安貧樂道樂則行之憂則違之誠當代之大賢也然卒忌讒邪弗果大用非朱子之不幸乃宋室之不幸也萬世而下仰其餘澤以先知覺後知以先覺覺後覺顧不偉哉是以朱子之屈於一時正所以伸於後世豈若凡卉之流春榮而秋瘁耶嗚呼若朱子者可謂身雖沒而名不與之俱沒矣廣義抑考寧宗之初嘗召文公為煥章閣待制兼侍講韓托胄欲攻偽學以內批罷之今綱目於其卒也何不以是官書而書曰故祕閣修撰蓋孝宗朝嘗以文公為崇政殿説書文公辭不至因以祕閣修撰奉祠然則綱目不書煥章閣待制兼侍講而書曰故祕閣修撰者承其志也夏六月朔日食太上皇后李氏崩諡曰慈懿許及之罷秋七月以陳自強簽書樞密院事自強嘗為韓托胄童子師及伲胄當國自強入都待銓欲見之無以自通僦居主人出入托胄家為入言之一日伲胄召自強比至則從官畢集托胄設褥於堂延自強升坐再拜次召從官同坐從官踧踖莫敢居上者托胄徐曰陳先生老儒汩沒可念坐客唯唯明日交章薦其才即除太學録未踰嵗三遷為祕書郎既入館即改右正言月餘拜諌議大夫御史中丞旬日遂秉政八月太上皇崩年五十有四史臣曰光宗幼有令聞嚮用儒雅即位之初總權綱屏嬖幸薄賦寬刑有可觀者及夫宫幃妬悍閹寺交搆驚憂至疾孝養日怠孝宗之業衰矣京鏜卒鏜初為刑部尚書帝甚尊禮時韓托胄權勢震天下鏜既得位一變其素守於國事漫無可否但奉行托胄風旨而已又薦劉德秀排擊善類偽學之名鏜實發之史臣曰士君子立身行事一失其正流而不知返遂為千古之罪人可不懼哉攢慈懿皇后於修吉寺九月處士吕祖泰上書請誅韓托胄詔配祖泰於欽州牢城祖泰祖儉從弟也性疏逹尚氣誼論世事無忌諱先是祖謙以言事貶祖泰語其友曰自吾兄之貶諸人箝口我雖無位義必以言報國當少須之今亦未敢以纍吾兄也至是祖儉卒祖泰乃擊登聞鼓上書論韓伲胄有無君之心請誅之以防禍亂其略曰道學自古所恃以為國者也丞相汝愚今之有大勳勞者也立偽學之禁逐汝愚之黨是將空陛下之國而陛下不知悟邪陳自強伲胄童稚之師躐致宰輔陛下舊學之臣彭龜年等今安在邪蘇師旦平江之吏胥周筠韓氏之厮役人人知之今師旦以潛邸隨龍筠以皇后親屬俱得大官不知陛下在潛邸時果識師旦乎椒房之親果有筠乎伲胄徒自尊大而卑陵朝廷一至於此願亟誅伲胄師旦筠而逐罷自強之徒故大臣在者獨周必大可用宜以代之不然事將不測書出中外大駭有旨吕祖泰挾私上書語言狂妄拘管連州右諫議大夫程松與祖泰狎友懼曰人知我素與遊其謂我與聞乎乃獨奏言祖泰有當誅之罪且其上書必有教之者今縱不殺猶當杖黥竄之逺方殿中侍御史陳讜亦以為言乃杖祖泰一百配欽州牢城收管祖泰自期必死冀以身悟朝廷了無懼色既至府尹為好語誘之曰誰教汝共為章試言之吾且置汝祖泰笑曰公何問之愚也吾固知必死而可受教於人且與人議之乎尹曰汝病風喪心邪祖泰曰以吾觀之若今之附韓氏得美官者乃病風喪心耳祖泰既得罪監察御史林采言偽習之成造端自周必大宜加絀削施康年亦言必大首倡偽徒私植黨與遂貶必大為少保發明楊氏曰隂極則生陽亂極則思治白公之亂楚幾危矣而國人望子高之來卒安楚者子高也此君子得輿而民所載之效也羣小剝正道以覆邦家如剝床焉自足及幹自幹及膚猶不已必剝其室廬此大厦將顛之時也有國者亦可以少悟矣祖泰憤伲胄之竊權遂直諫而獲罪謂之何哉是故舉處士所以罪在朝之臣也書請誅則所以豫祖泰而罪伲胄也書詔配祖泰所以譏不從善也嗚呼祖泰憂國忠矣托胄罪惡彰矣寧宗之位虛矣廣義抑觀自托胄竊弄威權以來其間但見阿附以得好官者日新月盛未聞有一攻其罪者焉所以然者正人端士擯斥殆盡舉朝皆韓氏之厠役奴𨽻也夫何怪哉祖泰無官守言責者也特激於中心不平故以死攻之耳今讀其章猶可以想見其浩然之氣矣噫千古英豪舍祖泰其誰歟冬十月加韓托胄太傅十一月皇后韓氏崩諡曰恭淑十二月葬永崇陵攢恭淑皇后於廣教寺辛酉嘉泰元年金泰和元年春二月臨安大火四日乃滅焚燒民居五萬二千餘家自渡江以來都城火災未有如是嵗者帝下詔罪已避殿減膳出內府錢十六萬米六萬餘斛分賜被火之家發明人火曰火大火者甚詞也是時托胄身都將相妨賢病國臨安之火安知非托胄為之不然天變何從而生乎此綱目書法之深意紀災異之道也嗚呼微矣秋七月何淡罷時吳挺子曦為殿前副都指揮使自以世守西蜀為國藩屛而身留行都不得如志乃以賄賂宰輔規圖帥蜀未及賂淡韓伲胄已許之淡持不可托胄怒曰始以君肯相就黜偽學汲引至此今顧立異邪遂罷奉祠淡急於榮進阿附托胄斥逐善類賢士為之一空士論罪之以陳自強參知政事張釡簽書樞密院事以吳曦為興州都統制曦至興州因譛副都統制王大節罷之由是兵權悉歸於曦異志遂成矣大旱發明大旱者恆暘也亂政之後又直凶年言民以訕上怨咨之氣感動天變而旱乾作矣其以大旱書者或不禱或雖禱而不雨也不禱則無憂國恤民之心禱而不雨格天之精意闕矣然是時姦臣當國帝擁虛位天變之生不亦宜哉綱目書大旱而不載其勤恤之政於下則宋之君臣其以災為玩以民為輕之意可見矣廣義前書二月臨安大火至七月書大旱一嵗中大火大旱所以著伲胄酷烈之徵也八月張釡罷以張巖參知政事程松同知樞密院事皆附韓托胄者松諂伲胄尤甚自知錢塘縣不二年為諫議大夫滿嵗未遷殊怏怏乃市一妾獻之名曰松夀托胄曰奈何與大諫同名答曰欲使賤名常逹鈞聽耳伲胄憐之遂除同知樞密院事奈曼襲西遼滅之西遼王珠勒呼出獵奈曼王庫楚類伏兵八千擒之而據其位尊珠勒呼為太上皇朝夕問起居珠勒呼尋死遼祀始絶發明輕行而掩之曰襲按胡傳曰滅國之與見滅罪孰為重奪人土地使不得有其民人毁人宗廟使不得奉其祭祀非至不仁者莫之忍為見滅而書滅亡國之善詞上下之同力也其亦不幸焉爾語曰興滅國繼絶世天下之民歸心焉今乃滅人之國而絶其世罪莫重矣奈曼滅西遼其舉號貶之耳凡書滅者不再貶而其惡自見壬戍二年金泰和二年春正月以蘇師旦兼樞密都承旨初韓托胄為平江府兵馬鈐轄時師旦以筆吏事之伲胄愛其辨慧帝登極竄姓名於藩邸吏士內遂以隨龍恩得官至是權勢日盛二月弛偽學黨禁復諸貶謫者官偽學之禍雖本於韓伲胄欲去異已以快所私然實京鏜創謀而何淡劉德秀胡紘成之及鏜死三人亦罷托胄厭前事之乖戾欲稍更改以消中外之議會張孝伯謂托胄曰不弛黨禁恐後不免報復之禍籍田令陳景思托胄之姻也亦謂托胄勿為已甚托胄然之於是趙汝愚追復資政殿學士黨人見在者徐誼劉光祖陳傅良章頴薛叔似葉適曽三聘項安世范仲黼黃灝詹體仁遊仲鴻諸人咸先後復官自便又削薦牘中不係偽學一節俾勿復有言時朱熹歿已踰年周必大留正各已貶秩致仕詔熹以待制致仕必大復少傅正復少保發明書之何嘉悔悟也易曰拔茅茹貞吉志在君也小人而變為君子則能以愛君為念而不計其私矣自禁正學人神共憤今托胄翻然悔悟改紘易轍弛偽學黨禁復貶謫者官豈非小人而變為君子者乎大抵聖人不貴於無過而貴於改過過而不改是謂過矣此綱目與人為善之意也禁私史有啇人私持起居郎熊克中興小厯及九朝通略等書欲渡淮旴𣅿軍以聞遂命諸道察郡邑書坊所鬻書凡事干國體者悉令毁棄言者因請取禮部員外郎李燾續通鑑長編知龍州王稱東都事略監都鹽倉李丙丁未録及通略語録家傳等書下史官考訂或有禆於公議即乞存留不許刋行從之廣義私史之議秦檜行之於前托胄踵之於後凶人造姦如出一手然既謂之史則非私矣何也史者公天下後世之是非者也惡有曰公曰私之異邪嗚呼托胄雖能禁於一時其能禁於天下後世乎書禁私史譏之也夏五月朔日食秋八月以袁説友同知樞密院事冬十一月以陳自強知樞密院事許及之參知政事十二月立貴妃楊氏為皇后后少以姿容選入宫帝即位封婕妤韓后崩中宫未有所屬時后為貴妃與曹美人俱有寵韓托胄以后頗涉書史知古今性警敏任權術而曹美人柔順勸帝立曹氏帝不從竟立后由是后與托胄有怨矣加韓托胄太師先是監惠民局夏允中上書請依文彥博故事以托胄平章軍國重事托胄繆為辭謝乞致仕詔不許而罷允中至是進位太師因以勢利蠱士大夫之心薛叔以辛棄疾陳謙等皆起廢顯用當時困於久斥者往往損晚節以規榮進政府樞密臺諌侍從皆出托胄之門而蘇師旦周筠又托胄厮役亦得預聞國政羣小滿朝勢熖薰灼是嵗大蝗發明蟲之傷稼曰蝗不曰蝗而曰大蝗志其甚耳其曰大蝗災重及民也而詳志之如此者急民事謹天災仁人之心王者之務也遇天災而不懼忽民事而不修而又為繁政重賦以感之國之危無日矣宋之君臣尚可與論徹彼桑土綢繆牖户之意哉癸亥三年金泰和三年春正月謝深甫罷初深甫力求罷政帝曰卿能為朕守法度惜名器不可言去至是固請乃許之張巖罷帝視太學發明書帝視太學而分注略不載其講讀推恩之實則當時以為文具可知矣臨學謁聖帝王之美事寧宗忽之可勝惜哉此綱目豫而未盡之意也以袁説友參知政事傅伯夀簽書樞密院事伯夀辭不拜二月以費士寅簽書樞密院事夏四月朔日食五月以陳自強為右丞相時托胄專權凡所欲為宰執惕息不敢為異自強至印空名敕劄授之惟所欲為宰執不預知也言路扼塞每月按舉小吏一二人課之月課又有泛論君德時事皆取其陳熟緩慢略無攖拂者言之或問之則愧謝曰聊以塞責爾加以苞苴盛行自強尤貪鄙四方致書餽必題其緘云某物若干并獻凡書題無并字則不開縱子弟親戚關通貨賄仕進干請必諧價而後豫都城大火自強所貯一夕煨燼托胄首遺之萬緡執政列郡聞之皆有助不數月得六十萬緡遂倍所失之數嘗語人曰自強惟一死以報師王每稱托胄為恩主恩父蘇師旦為叔堂吏史逹祖為兄托胄姦宄專國自強表裏之功為多廣義管子曰禮義亷恥國之四維四維不張國乃滅亡斯言也實人君致理之本此董仲書引之以為武帝告也今托胄敢行暴亂凡所引用者不次升擢致位通顯充牣朝廷同惡相濟曽何有於禮義亷恥者哉舉皆無禮無義無亷無恥之徒也南宋至此可謂通天地而閉塞之時也孟子謂伯夷得聖之清臣於此益有感焉以許及之知樞密院事秋七月造戰艦八月增置襄陽騎軍尋又置澉浦水軍九月袁説友罷冬十月以費士寅參知政事張孝伯同知樞密院事甲子四年金泰和四年春正月韓托胄定議伐金金為北鄙凖布等部所擾無嵗不興師討伐兵連禍結士卒塗炭府倉空匱國勢日弱羣盜蜂起賦斂日繁民不堪命有勸韓托胄立蓋世功名以自固者托胄然之恢復之議遂起聚財募卒出封樁庫黃金萬兩以待賞功命吳曦練兵西蜀既而安豐守臣厲仲方言淮北流民咸願歸附而浙東安撫使辛棄疾入見言金國必亂亡願屬元老大臣備兵為倉卒應變之計托胄大喜鄭挺鄧友龍等又附和其説托胄用師之意益鋭矣發明按春秋隱四年書翬帥師會伐鄭左氏謂宋公乞師公弗許羽父固請而行君子謂翬已有無君之心故春秋削去公子以示貶至隱十年又書翬帥師會伐宋先儒謂羽父先期而往不待君命故春秋不氏以貶之以戒兵柄下移之失未幾果有鍾巫之變此聖人垂訓於經所以戒後世制治未亂辨之於早者也今焉宋之托胄定議伐金以一時利害計之未為失䇿然斷自一心不待朝命之及已非征伐自天子出之意其與翬之固請不待君命殆又甚之况其師出無功則喪兵失地蓋自此始今綱目不書詔議伐金而直書韓托胄定議伐金則其專輒無君已見於此何待他時而後見耶此宋之權綱不舉所以終於不能克復者正坐此爾夫征伐天子之大權而使人臣執之得以專行於外其進其退率循己師而朝議若無與焉者是以成則為桓溫劉裕敗則為禇裒殷浩綱目皆正色書之初未嘗有豫之之意然則軍國大柄固不可一日不謹有天下國家者尚鑒之哉三月臨安大火詔百官陳時政闕失發明臨安之火至是兩見則其人為感召之意明矣上書托胄定議伐金此書臨安大火則是天意之與人心每相隨而不相逺不可得而誣者托胄欺君誤國時政闕失莫大於此何必詔百官以陳之乎修德應天則可以變災而為祥不能修德則所以變祥而為異書詔百官陳時政闕失而分注不載其言事之臣然則當時之求言亦文具焉耳吁廣義去年書大火大旱今年又書大火詔百官陳時政闕失蓋時政闕失莫有過於韓托胄之暴橫也火旱迭書於册豈非著托胄之酷烈也哉夏四月許及之罷時兵端開韓托胄欲令及之守金陵及之辭不行遂罷以張孝伯參知政事錢象祖同知樞密院事五月追封嶽飛為鄂王先己賜諡武穆至是韓托胄欲風厲諸將乃追封飛尋封劉光世為鄜王贈宇文虛中少保發明時將用兵追封飛爵本非得正曷為書蓋飛以忠貞事主為宋名將雖云非正然亦公論之不可泯者豈以小人之故而遂沒其善哉夫如是然後見綱目書法之意人心天理之機耳秋八月張孝伯罷冬十月以張巖參知政事十二月詔宰相兼國用使韓伲胄議恢復陳自強請遵孝宗典故創國用司總核內外財賦遂以自強兼國用使費士寅張巖同知國用事掊克民財州郡騷動乙丑開禧元年金泰和五年春三月費士寅罷韓托胄欲以士寅鎮興元為宣威之漸士寅固辭遂罷太白晝見發明太白者兵之象而晝見焉其異甚矣楊誠齋曰君子非徒警也有功用焉夫聞變而恐懼者警也警而已矣過則舍之徒警也君子則不然恐懼以先之修省以繼之修省者恐懼之功用也修其身省其過則恐無恐懼無懼矣宋之君臣略未見其恐懼修省之實而伲胄小人將荼毒於境內一念既動災變隨形然則天人相與之際甚可畏也孰謂天道無知其可怠而忽之也哉夏四月以錢象祖參知政事劉德秀簽書樞密院事以皇甫斌知襄陽府尋以斌為京西七路招撫副使竄武學生華嶽於建寧嶽上書諫朝廷未宜用兵啓邉釁且乞斬韓托胄蘇師旦周筠以謝天下托胄大怒下嶽大理編管建寧發明商高宗命傅説曰惟暨乃僚罔不同心以匡乃辟俾率先王迪我高后以康兆民説復於王曰惟木從繩則正后從諫則聖后克聖臣不命其承疇敢不祗若王之休命古之君臣更相戒勉如此未聞惡直言而罪之也華嶽既諫用兵乞誅元惡乃忠於國家者編管建寧謂之何哉厥後喪師失地民罹塗炭然則曲突徙薪之悔不能及矣直書曰竄深譏之也五月金以布薩揆為河南宣撫使金主璟聞朝廷將用兵召諸大臣問之皆曰宋敗衄之餘自救不暇恐不敢叛盟完顔匡獨曰彼置忠義保捷軍取先世開寶天禧紀元豈忘中國者哉璟然之乃命平章布薩揆宣撫會兵於汴以備之秋七月詔韓托胄平章軍國事從陳自強鄧友龍等請也命托胄三日一朝赴都堂治事論者謂托胄繫銜比吕夷簡省同字則其體尤尊比文彥博省重字則其所者廣於是三省印並納其第托胄置機速房於私第甚者假作御筆升黜將帥事關機要未嘗奏稟人莫敢言以蘇師旦為安遠節度使領閣門事韓托胄昵師旦為腹心故有是除八月金罷河南宣撫司布薩揆至汴移文來責敗盟三省樞密院答言邉臣生事已行貶黜所置兵亦已抽去揆信之會殿前副都指揮使郭倪濠州守將田俊邁誘虹縣民蘇貴等為間言於揆曰宋之增戍本虞他盜及聞行臺之建益畏讋不敢去備且兵皆白丁自裹糧糒窮蹙飢疾死者甚多揆益弛備以其言白於金主璟時金群臣皆勸先舉璟曰南北和好四十餘年民不知兵不可及聞揆言遂命罷宣撫司及新置兵以郭倪知揚州尋兼山東京東招撫使九月劉德秀罷遣使如金韓托胄欲審敵虛實故遣陳景俊往賀正旦景俊還金主璟諭之曰大定初世宗許宋世為姪國朕遵守至今豈意爾國屢犯我邉以此遣大臣宣撫河南及得爾國公移朕即罷司而爾國侵擾益甚朕惟和好嵗久委曲㴠容恐姪宋皇帝或未詳知卿歸國當具言之景俊還以告陳自強自強戒勿言由是用兵益決以邱崈為江淮宣撫使崈辭不拜初韓伲胄以北伐之議示崈崈曰中原淪陷且百年在我固不可一日而忘然兵凶戰危若首倡非常之舉兵交勝負未可知則首事之禍其誰任之必有誇誕貪進之人攘臂以僥幸萬一宜亟斥絶不然必誤國矣伲胄不納至是命崈宣撫江淮崈手書切諫曰金人未必有意敗盟中國當示大體宜申警軍實使吾常有勝勢若釁自彼作我有詞矣因力辭不拜托胄不悅廣義伲胄欲恢復者私也非公也邱崈之論不亦當乎冬十二月金遣使來金使太常卿趙之傑來賀正旦入見韓托胄故使贊者犯金主父嫌名以挑之之傑遂倨慢托胄請帝還內著作郎朱質乞斬敵使不報發明直書曰來不豫其朝也綱目之於金人因其來聘則嘉而進之因其倨慢則抑而外之所以嚴正統之義也丙寅二年金泰和六年春二月壽慈宫火太皇太后移居大內發明左氏曰人火曰火天火曰災夀慈宫太后之宫也天子欲尊崇其母故其宫曰夀慈夀慈火何以書以宫殿之重書之曰托胄擅權啓釁而天子不禁宋室不復能中興矣人火之天所以見戒乎宋之君臣恝不知懼豈不深可哀哉以程松為四川宣撫使吳曦副之松移司興元東軍三萬屬焉曦進屯河池西軍六萬屬焉仍聽節制財賦按劾計司曦由是益得自專松無所關與松始至欲以執政禮見曦責庭參曦聞之及境而還松用東西軍一千八百自衛曦抽摘以去松亦不悟尋詔曦兼陜西河東招撫使錢象祖罷韓托胄鋭意用兵象祖執不可遂以懷姦避事罷之尋奪二官信州居住夏四月以薛叔似為京湖宣撫使鄧友龍為兩淮宣撫使追奪秦檜王爵改諡繆醜論檜主和誤國之罪也廣義或曰秦檜主和議托胄主恢復非秦檜而是托胄可乎曰不可也曰何以知其不可也曰觀其所行則托胄似可是而秦檜是可非也究其心則托胄之主恢復即秦檜之主和議也一則懷覬覦之心一則圖蓋世之功豈皆為宗廟社稷計哉皆私也非公也自古立心弗公未有能濟其事者也易曰立心勿恆凶此之謂歟金復命布薩揆會兵河南金聞皇甫斌分兵規取唐鄧復命揆領行省於汴河南皆聽節制盡徵諸道籍兵分守要害命彰德守臣護韓琦墳凡宋宗族所居有司提控之吳曦反獻階成和鳯四州於金以求封曦既得志與其從弟晛及徐景望趙富米修之董鎮共為反謀隂遣其客姚淮源獻關外階成和鳯四州於金求封蜀王發明反者悖逆之詞吳氏父子世為蜀帥纍沐厚恩非一日矣值朝廷與金起釁正臣子奮不顧身夫何射一時之利忘父祖之勳假土地以資強鄰背君親而臣敵國擁兵謀逆叛主求封其罪可勝誅乎故直書曰反則不再貶而罪已可見廣義托胄之主恢復也用陳自強之掊尅而州郡騷動用兵崈宣撫江淮而邱􅀢不拜以吳曦為宣撫副使而吳曦謀反厥事之不濟也明矣郭倪遣兵復泗州五月下詔伐金韓托胄聞已得泗州及新息褒信穎上虹縣乃議降詔略曰天道好還中國有必伸之理人心效順匹夫無不報之仇維彼敵國猶託要盟朘生靈之資奉溪壑之欲此非出於得已彼乃為之當然軍入塞而公肆創殘使來庭而敢為桀驁洎行李之繼遣復嫚詞之見加含垢納汚在人情而已極聲罪致討屬敵運之將傾兵出有名師直為壯言乎遠言乎近孰無忠義之心為人子為人臣當念祖宗之憤直學士院李璧之詞也初兵部侍郎葉適輸對嘗言甘弱而幸安者衰改弱而就強者興伲胄聞而喜之以為直學士院欲籍其草詔以動中外而適以疾辭職乃改命璧云吕中曰小人擅朝欲為專寵固位之計往往至於用兵伲胄在朝窮姦極惡海內切齒而復不度事勢妄啓兵端三邉瘡痍生靈魚肉雖擢髮不足數其罪矣發明嗚呼用兵之道不以常勝而遽驕不以纍敗而頓挫故曰一勝一敗兵家之常郭倪輕浮小人素不習武今而遣兵復泗州乃一朝之幸非其能也托胄以為恢復可必下詔伐金下書攻宿大敗敗績唐州皆功未能成禍已先及何益之有雖然中國有必伸之理匹夫無不報之仇宋金世讐固宜報伐但其輕慮淺謀為可惡耳故綱目前書定議伐金此書下詔伐金而無罪詞者所以示中國復讐之義為臣子徇國之勸也故雖托胄之跋扈亦略恕之綱目貴復讐之意深矣廣義嗚呼觀其詔則是而於其時則非也譬則裘之於夏葛之於冬尚可以為用乎髙宗之時人心協和將士騰湧使有是詔則知張韓劉嶽之輩鼓勇爭先不啻虎而翼者也金人何足平哉惜乎冬之無裘夏之無葛矣今也言其國則國無其人言其邉則邉無其將天道乖戾人心暌離雖有此詔則夏裘而冬葛矣將焉用之特發於托胄一己之私耳噫嚴尤胸奴之䇿陳於王莽陳子昻明堂之議獻於武后托胄伐金之詔草於寧宗謂之適其時可乎臣故曰觀其詔則是而於其時則非也郭倪遣兵攻宿州大敗郭倪遣郭倬李汝翼會兵攻宿州敗還至蘄金人追而圍之倬執馬軍司統制田俊邁以與金人乃得免時建康都統李爽攻夀州亦敗皇甫斌敗績於唐州時江州都統王大節攻蔡州亦不克而潰發明兩兵相接曰戰言敗不言戰是不待戰而自敗之謂也言敗績見全軍皆潰也皇甫斌率衆伐金敗績唐州而綱目不書戰言安危強弱其勢不相敵也是皆君子之筆削非宋史之舊文矣蓋知己知彼可以百戰百勝茍不度德量力輕舉妄動必致喪師辱國而後己寧宗委政伲胄恣其所為伲胄輕啓邉釁而要求大利是托胄輕用民命以貽禍於國家也書敗績於唐州者言自敗也其自反亦至矣與春秋書王師敗績於茅戎同意詔以宗室均為沂王柄嗣賜名貴和柄孝宗孫魏惠獻王愷之子均之父曰希瞿太祖九世孫也六月鄧友龍免以邱崈為兩淮宣撫使韓托胄以師出無功免友龍而以崈代之駐揚州崈至鎮部署諸將悉以三衙江上軍分守江淮要害於是王大節李汝翼皇甫斌李爽等皆坐貶斬郭倬於鎮江秋七月蘇師旦有罪安置韶州韓托胄既喪師始覺為蘇師旦所誤一日召李璧飲酒酣語及師旦始謀事璧微摘其過以覘之因及言師旦怙勢招權使明公負謗非竄謫此人不足以謝天下托胄然之翌日罷師旦官籍其家旬日除名韶州安置廣義托胄之暴橫師旦之作俑也綱目於師旦書有罪者正名正罪也以張巖知樞密院事李璧參知政事夏李安全廢其主純佑而自立安全崇宗孫越王仁友子也廢純佑自立改元應天未幾純佑死安全號之曰桓宗發明曰廢主自立罪悖逆也安全以臣而廢君以強而篡國其罪亦云甚矣亂臣賊子法所必討今而在中國不能行吊伐之師在四鄰不能修連帥之職而乃縱賊不討恣其所為則當時之三綱亦可謂掃地矣尚可與論人道哉冬十月金布薩揆分兵南侵布薩揆分兵為九道南下揆兵三萬出頴壽完顔匡兵二萬五千出唐鄧赫舍哩子仁兵三萬出渦口赫舍哩呼沙呼兵二萬出清河口完顔充兵一萬出陳倉富察貞兵一萬出成紀完顔綱兵一萬出臨潭舒穆嚕仲兵五千出鹽川完顔疄兵五千出來逺金人圍楚州呼沙呼自清河口渡淮遂圍楚州十一月以邱崈簽書樞密院事督視江淮軍馬金人攻淮南日急詔郭杲將兵駐真州以援之又以崈督視江淮軍馬或勸崈棄廬和州為守江計崈曰棄淮則與敵共長江之險吾當與淮南俱存亡乃益增兵防守金人陷京西州軍招撫使趙淳焚樊城而遁金完顔匡陷光化棗陽江陵副都統魏友諒突圍奔襄陽趙淳焚樊城金人遂破信陽襄陽隨州進圍德安府發明遁者匹夫茍免之事罪怯也趙淳身為安撫親擁強兵不能招徠豪傑撫定黎民相與鑿池築城效死勿去而乃一聞敵至罔敢交鋒遂焚樊城接踵宵遁然則忠安在乎伲胄輕啓釁端得不償失遂使三邉瘡痍生靈魚肉兵連禍結身且不保然則蓋世功名者伊誰立哉觀綱目之所書見宋金之強弱矣吁金布薩揆陷安豐軍遂圍和州揆引兵至淮遣人密測淮水惟八疊灘可涉即遣鄂屯驤揚兵下蔡聲言欲渡守將何汝勵姚公左以為誠然悉衆屯花靨而備之揆乃遣薩布等潛師渡八疊駐於南岸官軍不虞其至遂皆潰走自相蹂踐死者不可勝計揆遂奪穎口下安豐軍及霍江縣進圍和州屯於瓦梁河以控真揚諸州之衝乃整軍列騎張旗幟於沿江上下於是江表大震金人入西和州十二月入成州吳曦焚河池退壁青野原曦既遣姚淮源如金因持重按兵河池韓托胄日夜望其進兵使者相繼曦恐謀泄乃遣兵攻秦隴與金人力戰以堅伲胄之心金人許封之約曰若按兵閉境不為異同使其師東下無西顧之憂則全蜀之地卿所素有當加封册一依康王故事更能順流東下助為犄角則旄麾所指盡以相付因命完顔綱經略之綱進兵水洛訪得曦族人吳端署為水洛城巡檢使遣人報曦曦得報意動以程松在興元未敢發詐稱杖殺端而隂遣使送欵於綱及金富察真破和尚原犯西和州曦將王喜等方力戰曦忽傳令退保黑谷軍遂潰真入成州曦因焚河池退壁清野原自是金人無復顧慮金人陷真州寇六合郭倪遣兵救之敗績倪棄揚州走金赫舍哩子仁陷滁州遂入真州州之士民奔逃渡江者十餘萬知鎮江府宇文紹節亟具舟以濟又廩食之自是淮西縣鎮皆沒於金發明走者匹夫輕身之事賤之也金兵入侵二月於兹如圍楚州陷京西陷安豐入西和入成州陷真州攻略自如罔敢與敵然則宋人守備之具應變之䇿亦疏略矣內既不修而欲為外攘之計其克濟乎雖然郭倪之徒前克泗州而以恢復自任今臨難不能為國一死却乃茍免逃奔其罪可勝誅哉故特書走以著其罪金人入大散關吳曦還興州時興州都統制母思以重兵守關曦聞金兵至因撤驀關之戍金人由扳閘谷繞出關後思孤軍不能支遂陷曦退屯置口完顔綱遣張仔會之曦言願附金之情仔請曦告身為報曦盡出以付仔綱乃以金主璟命遣馬良顯持詔書金印立曦為蜀王曦密受之遂還興州是夜天赤如血光燭地如晝翌日曦召幕屬諭意謂東南失守車駕幸四明今宜從權濟事王翼楊騤之抗言曰如此則相公忠孝八十年門戶一朝掃地矣曦曰吾意已決即遣任辛奉表獻蜀地圖及吳氏譜牒於金吕中曰恢復大計也當以人才為先今則總戎三邉者誰歟吳曦特膏梁之子弟郭倪郭倬李爽李汝翼皇甫斌又皆嵬瑣之庸才平居暇日不過尅剝士卒苞苴饋賂圖為進身之梯媒甚者外依仇敵俟以中國之動靜朝廷顧以推轂制閫之事悉委之師才出境而前者敗後者潰大者殱小者奔而統蜀漢之逆曦又以叛聞用兵以來敵之損未一二而吾國之喪敗已不可勝計矣邱崈遣使如金軍議和金布薩揆還軍下蔡金布薩揆欲通和罷兵購得韓琦五世孫元靚遣之渡淮邱崈獲之詰所以來之故元靚言兩國交兵北朝皆謂韓太師意今相州宗族墳墓皆不可保故來依太師耳崈使畢其説始露講解之意崈密使人護送北歸俾扣其實既而元靚回得金行省文字崈以聞於朝韓托胄方以師出屢敗悔其前謀輸家財二十萬以助軍而諭崈募人持書幣赴敵營議和崈乃遣劉祐持書於揆願講好息兵揆曰稱臣割地獻首禍之臣乃可崈復遣王文往言用兵乃蘇師旦鄧友龍皇甫斌等所為非朝廷意今三人皆已貶黜揆曰托胄若無意用兵師旦等豈敢專擅文還崈復遣使相繼以往因許還其淮北流移人及今年嵗幣揆始許之自和州退屯下蔡獨濠州尚使一統軍守之發明或以邱崈議和為非是曰天下之勢有強有弱天下之事有經有權雖以宋金世讐不可忘戰然揆諸國勢度諸事宜宋以積弱之國而抗積威之敵搆隙以來喪師失地金人不亡一鏃宋人所損甚多據京西陷淮南入西蜀宋人所恃者惟長江耳豈不岌岌乎其殆哉用是而觀則邱崈之議和乃權而得中者也金既許和還軍下蔡則其息兵自新之意可見矣大書特書交豫之也廣義昔者汴京之圍何其難解今和州之圍何其解之易耶曰勢不同也當夫斡里雅布圍汴也如拘狐兔於場汴宋垂亡之勢十無一二此其圍之所以難解也至若和之受圍也金非昔強宋非昔弱布薩揆素無南侵之意韓托胄自識用兵之非議和之説各中膏盲此其圍之所以易解也雖然寧宗之憂不在於金而所憂者國之無人耳薛叔似免叔似夙以功業自期及臨事絶無可稱屬郡多陷故坐免以吳獵為京湖宣撫使以畢再遇權山東京東招撫司時諸兵用兵皆敗唯再遇數有功金人常以水匱取勝再遇夜縳藁人數千衣以甲胄持旗幟戈矛嚴立成行昧爽鳴鼓金人驚視亟放水匱後知其非兵也甚沮乃出兵攻之金人大敗又嘗引金人與戰且前且却至於數四視日已晚乃以香料煮豆布地上復前縛戰佯為敗走金人乘勝追逐馬飢聞豆香皆就食鞭之不前反攻之金人馬死者不可勝計又嘗與金人對壘度金兵至者日衆難與爭鋒一夕拔營去留旗幟於營并縛生羊置其前二足於鼓上擊鼓有聲金人不覺為空營復相持數日及覺欲追之則已遠矣程松自興元逃歸金完顔綽哈攻鳯州松求援於吳曦曦紿言當發三千騎往松信不疑及曦受金詔宣言金使者欲得階成和鳯四州以和持書諷松使去松不知所為會報金兵至百姓奔走相蹂躪松亟趨米倉山而遁自閬州順流至重慶以書抵曦丐䐸禮稱曦為蜀王曦以匣封致餽松望見大恐疑為劍亟逃奔使者追與之乃金寶也松受而兼程出峽西向掩淚曰吾今始獲保頭顱矣發明逃者匹夫之事松為宣撫職任專城遇敵入境不能死守反效匹夫之行遁逃茍免不亦賤乎特書曰逃所以著其幸免而不知命之罪也有臣如此尚可以逭其誅戮乎觀今始得保頭顱之言豈事君能致其身者比哉此宋之所以終於不競焉爾蒙古却特特穆津稱帝號於鄂諾河特穆津之先有曰勃端察爾母阿倫果斡生二子而寡居夜寢屢有光明照其腹又生三子勃端察爾其季也其後子孫蕃衍各自為部居於烏桓之北與鄂囉奈曼九姓回鶻故城和林接壤世奉貢於遼金而緦𨽻於韃靼至伊蘇克依并諸部勢愈盛大攻塔塔爾部獲其部長特穆津還次於特哩衮盤陀山而生子因以特穆津名之伊蘇克依死特穆津幼其部衆多歸於族人泰楚特部泰楚特合七部人凡三萬攻之特穆津與其母諤楞率部人為十三翼大戰泰楚特等敗因得少安時泰楚特部地廣民衆而無紀律其下謀曰特穆津衣人以己衣乘人以己馬真吾主也因悉歸之泰楚特部遂微未幾塔塔爾部叛金特穆津自鄂諾河帥衆會金師同滅之以功授特穆津為察罕圖嚕猶中國之招討使也特穆津以奈曼部強盛事之甚謹奈曼反侵掠之特穆津乃大會屬部於特默格川議伐奈曼奈曼迪延汗營於杭愛山合默爾竒斯諸部兵勢頗盛特穆津與之大戰擒殺迪延汗諸部悉潰特穆津益以盛強明年遂攻西夏破拉吉哩寨經羅索城大掠而還至是大會諸部長於鄂諾河之源建九斿白旗遂自號為成吉斯汗先是金主遣衛王允濟往靖州受特穆津之貢允濟竒其狀貌歸言於金主請以事除之金主不許特穆津聞而憾之發明舉號斥名所以貶之也稱者不宜稱也是故不宜王而稱王則書稱王不宜帝而稱帝則書稱帝貴華賤夷春秋之大義也自三代既衰夷狄恣行莫之能禦由漢以來其強且大者如冒頓之控弦四十萬騎頡利之陵跨中原吐蕃之陷沒河隴盛則盛矣至於稱號不過從其本族未有與中國並稱而無别者有宋之時中國衰弱女真強大於是始稱帝號占據土宇綱目不得已以僣國例處之至於特穆津崛起沙漠僣號稱尊綱目必舉號而斥名嚴正統之分也於此雖書其稱帝自是以後止舉其號此綱目惡其恃強犯順也若使此時亦例以僣國主稱之則不足以示豫奪矣豈君子筆削之大權哉嗚呼微矣廣義大抵中國與外邦以人言固有中外之辨以天言則栽培傾覆一理而已故孔子發夷狄有君之論觀分注備載特穆津興國之由夫豈偶然哉其生也則光明照其母腹其長也則謙謹事夫奈曼俟其侵掠無狀然後會師伐之可謂得人心矣逮夫衛王允濟勸金主除之金主不許可謂得天心矣嗚呼其生也既異而又得天人之助雖欲不興得乎蒙古滅奈曼發明凡書滅者不再貶而其惡已見奈曼自嘉泰元年書滅西遼不五年而為蒙古所滅然則天理好還特假手以償滅遼之惡耳後世無故滅人家國者可不鑒哉此亦春秋惡惡短之意也丁卯三年金泰和七年春正月罷邱崈以張巖督視江淮軍馬時金已有和意崈上疏乞移書金帥以成前議且言金人既指韓托胄為元謀若移書宜暫免繫銜伲胄大怒罷崈以陳自強兼樞密使吳曦自稱蜀王權大安軍楊震仲死之曦遣將利吉引金兵入鳯州以四郡付之表鐡山為界曦即興州為行宫改元置百官遣董鎮至成都治宫殿欲徙居之議行金之制度號令稱臣於金分其所統兵十萬為統帥遣祿祁等戍萬州泛舟下嘉陵江聲言約金人來攻襄陽下黃榜於成都潼川利州夔州四路以興州為興德府召隨軍轉運使安丙為丞相長史權行都省事丙度不得脫徒死無益乃陽與而隂圖之曦又召權大安軍揚震仲震仲不屈飲藥而死其他如陳咸自髠其髮史次秦自瞽其目李道傳鄧性甫等悉棄官去發明直書自稱罪其僣也吳曦稱臣於金稱王於蜀是則一汚青史萬古凄涼大節一虧功名不足贖矣况叛逆之臣王法之所不原者乎震仲不辱偽命仰藥而死其忠全矣苟非明於君臣之義逆順之理者曷克以臻此哉故綱目以全節豫之豫在震仲則罪在吳曦矣綱目輕重之權衡豫奪之大法此類可見廣義楊震仲等不臣於曦而死者其龔勝任永馮信之徒歟二月以楊輔為四川制置使吳曦逐之輔知成都嘗言吳曦必反帝意輔能誅曦乃密詔授輔制置使許以便宜從事詔至人勸以倡義輔自以不習兵事且內郡無兵可用遷延不發曦移輔知遂寧府輔遂以印綬通判韓植棄成都而去以知建康府葉適兼江淮制置使適上言三國孫氏嘗以江北守江自南唐以來始失之乞兼節制江北諸州詔從之時羽檄旁午而適治事如平時軍須皆從官給民以不擾其防守皆盡法度金平章政事布薩揆卒於下蔡揆有疾金主命左丞相完顔宗浩行省事于汴至是揆卒揆為政多惠人樂為用四川轉運使安丙誅吳曦傳首臨安監興州合江倉楊巨源謀討曦乃隂與曦將張林朱邦寧及忠義士朱福等深相結眉州人程夢鍚知之以告轉運使安丙丙時稱疾未視事乃屬夢鍚以書致巨源延之卧所巨源曰先生而為逆賊丞相長史邪丙號哭曰目前兵將我所知不能奮起必得豪傑乃滅此賊巨源曰非先生不足以主此事非巨源不足以了此事會興州中軍正將李好義亦結軍士李貴進士楊君玉李坤辰李彪等數十人謀誅曦好義曰此事誓死報國救四屬生靈但曦死後若無威望者鎮撫恐一變未息一變復生欲奉安丙主事使坤辰來邀巨源與會巨源往與約還報丙丙大喜始出視事君玉與白子申共草密詔略曰惟干戈省厥躬既昧聖賢之戒雖犬馬識其主乃甘仇敵之臣邦有常刑罪在不赦二月乙亥未明好義帥共徒七十四人入偽宫時偽宫門洞開好義大呼而入曰奉朝廷密詔以安長史為宣撫令我誅反賊敢抗者夷其族曦衛兵千餘聞有詔皆棄挺而走巨源持詔乘馬自稱奉使入內戶曦啓戶欲逸李貴即前執之刃中曦頰曦反撲貴仆於地好義急呼王換斧其腰曦始縱貴貴遂斫其首馳告丙宣詔軍民拜舞聲動天地持曦首撫定城中市不易肆盡收曦黨殺之衆推丙權四川宣撫使巨源參贊軍事丙陳曦所以反及矯制平賊便宜賞功狀上疏自劾待罪函曦首及違制法物與曦所受金人詔印送朝廷曦僣立凡四十一日金遣珠格高琪奉册於曦未至而曦已誅矣先是韓托胄聞曦反大懼與曦書許以茅土之封且召知鎮江府宇文紹節問計紹節云安丙非附逆者必能討賊托胄乃密以帛書諭丙云若能圖曦報國以明本心即當不次推賞書皆未逹而誅曦露布已聞朝廷大喜曦首至臨安獻於廟社梟之市三日詔誅曦妻子家屬徙嶺南奪曦父挺官爵遷曦祖璘子孫出蜀存璘廟祀發明誅者討逆之詞吳曦僣竊四蜀寒心延頸以望王師久矣安丙之與楊巨源倡鳴大義聲罪致討卒收成功其誅亂討賊之績偉焉罪人斯得市不易肆宣播詔旨羣黎鼓舞可見以逆加順人心不從其從之者不過茍免刑罰而已非本心也然則安丙討賊之功大矣綱目豫奪之旨嚴矣廣義抑觀曦之伯父玠以豪俠立功於高宗時雖張韓劉嶽不足多讓至其子孫不肖反蒙首惡之誅可哀也已若夫安丙者不顧矯制之嫌以成平賊之績可謂識時逹權者歟以方信孺為國信所參議官如金軍韓托胄募可以報使金帥府者近臣薦信孺可使自蕭山丞召赴都命以使事信孺曰開釁自我金人設問首謀當以何詞答之托胄矍然遂以信孺為奉使金國通謝國信所參議官持張巖書以行三月安丙使興州將李好義等復西和階成鳯州及大散關楊巨源李好義謂安丙曰曦死賊破膽矣關外四州為蜀要害盍乘勢復取之不然必為後患丙從之於是分遣好義復西和州張林李簡復成州劉昌國復和州張翼復鳯州孫忠鋭復大散關好義進兵次於獨頭嶺會忠義及民兵夾擊金人死者蔽路七日至西和人人樂死前無留敵金將完顔欽遁去好義整衆而入軍民歡呼迎拜好義籍府庫以歸於官欲乘勝徑取秦隴以牽制淮寇宣撫司不許士氣皆沮廣義分注載李好義欲乘勝徑取秦隴以牽制淮寇於時安丙宣撫而不許其計失矣以楊輔為四川宣撫使安丙副之夏四月召輔知建康府吳曦既誅安丙趣楊輔還成都詔以輔為宣撫使丙副之兼知興州許奕為宣諭使改興州為沔州朝廷察丙與輔異召輔赴闕輔抵建康引咎不進著作佐郎楊簡言輔嘗棄成都不當召遂命輔知建康程松以罪竄灃州發明程松黨惡無謀擅離信地原情定罪死有餘辜今而不究可否僅竄灃州則宋之法網疏濶亦可見矣直書於册所以譏其縱賊不討之失耳以錢象祖參知政事金人復陷大散關五月太皇太后謝氏崩諡成肅李好義襲秦州與金將珠格高琪戰敗績好義還為吳曦將王喜所毒而卒朝廷慮喜為變授節度使移荆鄂都統制史臣曰曦之誅實楊巨源李好義之謀好義失於周防竟為王喜所圖宋知喜為曦黨既不能罪又以節鎮賞之幾何不為唐末之姑息以成藩鎮之禍乎六月安丙殺宣撫司參議官楊巨源初吳曦誅奬諭詔至興州巨源謂人曰詔命一字不及巨源疑有以蔽其功者俄報王喜授節度使而巨源與通判心益不平乃訴功於朝或謂安丙曰巨源謀亂丙令喜鞫其黨皆抵罪時巨源方與金人戰於鳯州之長橋而敗丙密使興元都統制彭輅收巨源械送閬州獄至大安龍尾灘丙使將校樊世顯殺之忠義之士聞者莫不扼腕流涕發明殺殺無罪也吳曦之誅巨源之力為多論功行賞固其宜也夫何詔命一字不及巨源則人心寧無不平之歎乎安丙不思蔽賢之失反怒巨源羅織抵罪又從而殺之其惡甚矣幾何而不為娟疾忌賢之人哉嗚呼當國家衰弱之餘生靈凋瘁正渴於用人之日而乃恣逞私憤戕殺忠良可哀也已綱目直書安丙殺宣撫司參謀官楊巨源所以著丙專權自恣之罪也巨源無罪故書殺而不去其官廣義安丙平賊之功巨源之力也合以重報而進階奈何惟與通判而已宜其心之不平也又况信讒而使叛臣之黨誣其罪而殺之果何義哉綱目所以削安丙之官而銜巨源者罪有所歸而寃有所伸也秋七月大旱蝗蝗飛蔽天食浙西豆粟皆盡詔郡邑賑恤之發明隂陽和而雷雨作今而恆暘不雨乃隂陽不和之故耳君為陽而臣為隂是時寧宗恭已於上伲胄擅權於下天下有道禮樂征伐自天子出伲胄一切專之隂陽不和莫此為甚人為感召天變隨形噫當兵亂倥傯之日民不聊生而又大旱蟲蝗相繼而作悲夫胡氏曰軍旅之後必有凶年言民以征役怨咨之氣感動天變而旱乾作矣所謂災者害及民物此之謂也綱目特書於䇿者見天道之與人心有感必應捷如影響然則有天下國家之責者可不知所恐懼耶九月貶方信孺官遣右司郎中王柟如金軍信孺至濠州赫舍哩子仁止之於獄露刃環守之絶其薪水要以五事信孺曰反俘歸幣可也縛送首謀自古無之稱藩割地則非臣子所敢言子仁怒曰若不望生還邪信孺曰吾將命出國門時已置生死度外矣子仁遣至汴見完顔宗浩出就傳舍宗浩使將命者來堅持五説信孺辨對不少屈宗浩不能詰授以報書曰和與戰俟再至決之信孺還朝廷以林拱辰為通謝使與信孺持國書誓草及許通謝百萬緡信孺至汴宗浩怒信孺不曲折建白遽以誓書來有誅戮禁錮之語信孺不為動將命者曰此非犒軍可了别出事目以示之信孺曰嵗幣不可再增故代以通謝錢今得此求彼吾有隕首而已會興州遣師復大散關宗浩益疑之乃遣信孺還復書於張巖曰若能稱臣即以江淮之間取中為界欲世為子國即盡割大江為界且斬元謀姦臣函首以獻及添嵗幣五萬兩匹犒師銀一千萬兩方可議和好信孺還致其書韓伲胄問之信孺言敵所欲者五事一割兩淮二增嵗幣三索歸正人四犒軍銀五不敢言伲胄固問之信孺徐曰欲得太師頭耳伲胄大怒奪信孺三官臨江軍居住信孺三使金師以口舌折強敵敵人計屈情見雖未即和然已有成説及貶欲再遣使顧在廷無可者近臣以王柟薦乃命假右司郎中持書北行柟倫之孫也廣義信孺義不屈金雖古名使何以加綱目書貶方信孺官者所以著伲胄之私憾與奪秦檜爵同但信孺秦檜人品則高下懸絶矣葬成肅皇后以趙淳為江淮制置使張巖免韓托胄怒金人欲罪首謀和議遂輟復鋭意用兵乃以淳鎮江淮而免張巖巖開督府九月費耗縣官錢三百七十萬緡而無成功冬十一月禮部侍郎史彌逺誅韓托胄於玉津園詔暴托胄罪惡於中外自兵興以來蜀口漢淮之民死於兵戈者不可勝計公私之力大屈而托胄意猶未已中外憂懼禮部侍郎兼資善堂翊善史彌逺入對因力陳危迫之勢請誅托胄以安邦皇后楊氏素怨托胄因使王子榮王曮具疏言伲胄再啓兵端將不利於社稷帝不答后從旁力贊之帝猶未許后請命其兄楊次山擇羣臣可任者與共圖之帝始允可次山遂語彌遠彌遠得密旨以錢象祖嘗諌用兵忤托胄乃先白象祖象祖許之象祖以告李璧彌逺自懷中出御筆批云韓托胄久任國柄輕啓兵端使南北生靈枉罹凶害可罷平章軍國事陳自強阿附充位可罷右丞相日下出國門仍命主管殿前司公事夏震以兵三百防護象祖欲奏審璧謂事留恐泄乃已翌日托胄入朝至太廟前震阿止之從者皆散震以兵擁托胄至玉津園側殛殺之彌逺象祖以誅托胄聞帝不信越三日猶以為未死後審其果然遂下詔暴托胄罪惡於中外蓋其謀始於彌逺而成於皇后及楊次山帝初無意也論功進彌逺為禮部尚書加震福州觀察使托胄專政十四年宰執侍從臺諌藩閫皆其門廡之人天子孤立於上威行宫省權震宇內嘗鑿山為沼下瞰太廟出入宫闈無度孝宗疇昔思政之所偃然居之老宫人見之往往垂涕顔棫草制以為得聖之清易祓撰答詔以元聖褒之四方投獻者謂伊霍旦奭不足以擬其勳余嚞請加九鍚趙師􅋷乞置平原郡王府官屬托胄皆當之不辭其嬖妾皆封郡國夫人每內宴與妃嬪雜坐恃勢驕倨掖庭皆惡之及籍其家多乘輿服御之飾其僣紊極矣發明誅者討有罪之詞托胄罪逆滔天擢髮難數亂臣賊子人人得而誅之者也况彌逺既受密旨名正言順誅之為宜然前史皆以殺托胄為詞而分注亦以殛殺為文綱目原情定罪變文書誅然後人神之憤泄討賊之義正矣或論賈似道之與韓托胄惡醜罪齊托胄為史彌逺所殺似道為鄭虎臣所殺然曷為此書誅而彼書殺耶循名責實故耳彌逺揚於王庭以正其罪親承密旨從而殛殺故綱目以討賊之義豫之虎臣挾其私憤弗克明正承命監押安可擅誅故綱目不以討賊之義豫之夫豈厚於彌逺而薄於虎臣乎要在正其是非權其輕重此綱目所以為史中之經也學者能究此義始可與言綱目矣廣義分注云托胄之死其謀始於彌逺而成於皇后楊次山而寧宗若不與者然綱目何以書誅蓋托胄罪惡彌天神人共怒所謂人人得而誅之者也豈特彌逺哉故於彌逺則書其官而於托胄則書誅者正天討也然其罪惡不暴之於未死之前而暴於既死之後者豈非畏其凶熖歟治韓托胄黨竄陳自強於永州斬蘇師旦流郭倪等於嶺南貶李璧等官韓托胄既死錢象祖探懷中堂帖授自強曰有旨丞相罷政自強即上馬顧曰望大參保全明日奪其三官永州居住尋竄雷州遣使即韶州誅師旦安置郭倪於梅州鄧友龍於循州郭僎於連州貶李璧張巖許及之葉適薛叔似皇甫斌等官秩有差發明首惡甫誅黨類宜治茍為不然則一托胄既沒衆托胄尚在幾何而不為托胄之行乎故詳書豫之然曷為不書有罪蓋既曰托胄黨則其罪可見何必書之以罪哉此綱目書法之深意耳廣義此剝之窮也以衛涇簽書樞密院事立榮王曮為皇太子更名懤尋更名詢十二月罷山東京東西路招撫司以錢象祖為右丞相兼樞密使衛涇雷孝友參知政事史彌逺同知樞密院事林大中簽書院事初韓托胄欲內交於大中大中不許而上書極論其姦因辭官屏居時事不挂於口托胄當國或勸其通書以免禍大中曰福不可求而得禍可懼而免耶不聽凡十二年而復起廣義此復之通也御批續資治通鑑綱目卷十七
