body:
  text: 欽定四庫全書御批續資治通鑑綱目卷七起壬子宋神宗熙寧五年盡乙丑宋神宗元豐八年凡十四年壬子五年春正月置京城邏卒察謗時政者發明虞舜謂禹曰違汝弼汝無靣從退有後言夏禹即天子位懸鐘鼓磬鐸鞀以待四方之士為銘於簨簴曰教寡人以道擊鼓喻以義者擊鐘告以事者振鐸語以憂者擊磬有訟獄者搖鞀商太甲謂伊尹曰既往背師保之訓弗克于厥初尚賴匡救之德惟厥終高宗命傅説曰旨哉説乃言惟服乃不良于言豫罔聞于行觀之古昔聖王惟慮聞言之弗及而竭誠以求之所以治隆俗美天下乂寧拒諫飾非如桀紂者國隨以滅身且不保是以有天下者當宵旰求言以匡不逮焉神宗即位于兹五年聞善如探湯信讒如飲醴去年書詔察奉行新法不職者今年書置京城邏卒察謗時政者一舉而拒諫飾非之事皆在其中能保邦於沒身而不亂者亦幸焉耳一書再書深譏之也廣義此即商鞅誹謗之禁耳然則宋之所以不秦者幸也春秋傳曰諸候有道守在四方况堂堂中國而致察于謗上者乎使時政皆得則四海之人皆為君守何以察為否則舟人皆敵國也雖置邏卒遍天下且不可况京城乎書之者譏之也二月以蔡挺為樞密副使挺知渭州甲兵整習常若寇至故多立功效然譎智深險在位歲久鬱鬱不得志寓意詞曲有玉關人老之句中使至使優伶歌之傳逹禁中帝聞而愍之故有是命三月南平王李日尊死子乾德嗣日尊公蘊之孫也既死乾德遣使來告哀詔封乾德交址郡王判汝州富弼致仕弼至汝州兩月即上言新法臣所不曉不可以治郡願歸洛養疾許之遂請老復授司空武寧節度使致仕弼雖家居朝廷有大利害知無不言帝雖不盡用而眷禮不衰嘗因王安石有所建明却之日富弼手疏稱老臣無所告訴但仰屋竊嘆者即當至矣其敬之如此發明邦有道榖固君子之所耻邦無道榖亦君子之所耻故君有過則當諫反覆之而不聽則當去蓋君臣皆以義合義合者何諫行言聽膏澤下於民之類是也否則雖榮之以高爵錫之以厚祿君子不能以茍食焉富弼前因論事之而貶判汝州則是諫不行而言不聽矣君子豈可以素餐乎故以老而乞致仕則於義為當去也前書范鎮歐陽修致仕此書富弼致仕皆子其知止也子在富弼則罪在神宗矣行市易法自王韶倡為緣邉市易之説王安石善之以為與漢平凖法同可以制物低昻而均通之遂用草澤魏繼宗議以內藏庫錢帛置市昜務于京師凡貨之可市及滯於民而不售者平其價市之願以昜官物者聽若次市於官者則度其田宅或金帛為抵當而貸之錢責期使償半歲輸息十一嵗倍之過期不輸息外每月更加罰錢以户部判官吕嘉問為提舉嘉問上建置十三事其一欲於律外禁兼并之家輒取利帝去之安石執不可已而帝聞其大煩碎人皆怨讟欲罷之以問安石安石對曰立法當論有害於人與否不當以煩碎廢也自是諸州上供薦席黃蘆之類六十色悉令計直從民願粥者市之以給用尋改提舉在京市易務為都提舉市易之司秦鳯兩浙黔州成都廣州鄆州六市易司皆𨽻焉廣義大抵因民之所利而利之者乃所以為利也蓋所謂利者義也易曰利用安身以崇德也若為國者不以義為利而以利為利則所謂私也豈利也哉然則為人上者與民爭利而不以義處之則是出警入蹕之中奉一啇人耳其不義孰甚焉况乎桑𢎞羊平凖之法實萬年願治者之罵名安石乃眯其目而井心踵此覆轍者其意何也不過溺於功名不顧驅神宗於不可為之地也善乎司馬公曰天地所生百物貨財止有此數不在民則在官譬如雨澤夏潦則秋旱不加賦而上用足者不過設法隂奪民利其害甚於加賦此乃桑𢎞羊欺武帝之言太史書之以見武帝之不明至其未年盜賊蜂起幾至於亂茍若武帝不悔過昭帝不變法則漢幾亡矣此真萬世之藥石也綱目書曰行市易法而分注云置市易務于京師者以見京師為天下之首置務於此則是神宗乃天下商賈之倡也噫以天下之君乃為天下商賈之首不亦陋哉夏五月詔宗室非袒免親者許應舉初試黜其不成文理者餘令覆試纍覆試不中者亦量材擢用行保馬法王安石建保甲養馬之法文彥博吳充以為不便安石持論益堅乃詔曾布等上其條約保甲願養馬者户一匹物力高願養二匹者聽皆以監牧見馬給之或官與其直令自市先于行開封府及陜西五路府界無過三千匹五路毋過五千匹襲逐盜賊外乘越三百里者有禁歲一閲其肥瘠死病者補償在府界者免體量草二百五十束加給以錢布在五路者歲免折變緣納錢三等以上十户為一保四等以下十户為一社以待病斃逋償者保戶馬死保戶獨償社尸馬死社戶半償之其後遂遍行于諸路發明説苑曰聖人之於天下百姓也其猶赤子乎飢者則食之寒者則衣之將之養之育之長之惟恐其不至於大也古之聖王愛養其民大率類此是以民之親君有不啻子弟之衛父兄手足之捍頭目也神宗惑於安石之邪説制作紛紛無一中禮上書行市易法此書行保馬法皆剝民奉君損下益上之事譬猶割肉以充腹飽而身斃其及救乎茍非元祐之政一新舊染則宋室之亂不不俟宣靖而可見也然則小人之禍可勝言哉故備書惡之王安石求去位帝不許先是樞密都承旨李評喜論事帝多從其言又嘗極言助役不便安石惡之會評妾奏罷閣門官吏安石言其作威福必欲罪之帝亦謂評有罪然未始罪評也明日安石入見乞東南一郡帝曰自古君臣如鄉與朕相知極少朕鄙鈍初未有知自卿在翰林始聞道德之説心稍開悟天下事方有緒卿何去安石固請帝曰卿得非以李評事謂朕有疑心朕自知制誥知卿屬以天下事如吕誨比卿少正卯盧把朕不為惑豈更有人能惑朕者未幾安石復自齎表入請帝不視以表授安石固令就職發明嘗觀神宗之待安石可謂過於厚安石之報神宗可謂過於薄因其稱疾則諭起之因其求去則不許之言聽計從心孚意契雖稷契臯夔之得君不過如此説苑曰王者知所以臨下而御衆則群臣服矣知所以聽言受事則不蔽欺矣知所以安利萬民則海內必定矣安石為政妨賢病國無一而非失人心之事竊寵祿於一己貽禍患於國家豈非報神宗若是其薄乎雖然蓋由神宗無知人之明耳茍有知人之明如説苑所云者烏能為小人所惑哉於戲此宋所以終於宋不能進而為三代之宋也故綱目直書以交罪之秋閏七月以章惇為湖北察訪使時帝思用兵以威四方湖北提點刑獄趙鼎上言峽州洞酋刻剝無度蠻衆願內附辰州布衣張翹亦上書言南北江利害遂詔中書檢正官章惇察訪荆湖北路經制蠻事八月王韶擊吐蕃敗之遂城武勝秦鳯駐泊都監張守約請名古渭寨為軍以根本隴右詔從之遂建為通逺軍使王韶知軍事以圖武勝韶引兵築乞神平堡而蕃酋瑪爾結日巴等族入境韶率兵度竹牛嶺逼之斬首百餘級焚其廬帳洮西震動瑪爾戩渡河來援瑪爾依其聲勢保集瑪爾本山知德順軍景思立以涇原兵出南路分遣諸將擊瑪爾于納木嘉勒擊瑪爾戩于古凌城制二酋不得動韶將大軍從東谷徑趨武勝未至數里敵迎戰敗還追至其城首領轄裕勒棄城遁衆出降遂城武勝建為鎮洮軍時瑪爾戩亦敗於古凌城初韶言措置洮河只用回易息錢未嘗輒費官本文彥博曰工師造屋初必小計冀人易於動工及既興作知不可已乃方增多帝曰屋壞豈可不修王安石曰主者善計自有忖度豈為工師所欺也彥博不復敢言由是韶進討敢肆欺誕朝廷不與計財發明天子討而不伐其日擊者譏黷武也説苑曰上不玩兵下不廢武聖人之治天下也先文德而後武力凡武之興為不服也文化不改然後加征王韶竭天下之財力較勝負於外方罪不容於誅矣雖其功蓋世烏足尚哉綱目於黷武者每書擊而不書討則其不貴功之意為可見爾後之不修文德而専尚武力者要當以神宗為鑒廣義分注載王安石文彥博論邉事則知神宗之與安石牢不可破者以其心德之一也雖使潞公如聖人則亦未如之何矣故曾公亮嘗曰介甫與帝如一人豈非天乎信哉使神宗移任介甫者以任潞公則貽謀必善而子孫亦未必有如金人之禍有天下者於任人之術不可不慎觀文殿學士致仕歐陽修卒是歲有詔求修所撰五代史而修卒矣修天資剛徑見義勇為平生與人盡言無隱奬引後進如恐不及賞識之下率為聞人及在政府士大夫有所干請輒靣諭可否雖臺諌論事亦必以是非詰之怨誹益衆自五代以來文體卑弱修遊隨州得唐韓愈遺藁讀而心慕之苦心探賾至忘寢食遂以文章名冠天下學者翕然師尊之諡文忠發明修以文章德行高一世見忌讒邪弗果大用誠可惜也故卒而具官特書致仕者所以明賢人處於散地則其不滿當時之意為可見矣貶唐坰為潮州别駕坰以父任得官嘗上書言秦二世制于趙高乃失之弱非失之強帝悅其言又言青苗法不行宜斬大臣異議如韓琦者數人王安石尤喜之薦使對賜進士子出身為崇文校書安石復令鄧綰舉為御史遂除太中允將用為諌官書安石疑其輕脫將背已立名不除職以本官同知諫院非故事也坰果怒安石易已凡奏二干疏論時事皆留中不出坰乃因百官起居日扣陛請對帝令諭以他日坰伏地不起遂召升殿坰至御座前進曰臣所言皆大臣不法請對陛下一一陳之乃搢笏展疏目安石曰王安石近御座聽劄子安石遲遲坰訶曰陛下前猶敢如此在外可知安石竦然而進坰大聲宣讀凡六十條大抵言安石専作威福曾布表裏擅權天下但知憚安石不復知有陛下彥博馮京知而不敢言王圭曲事安石無異厮僕且讀且目圭圭慙懼俯首先降又言薛向陳繹安石頥指氣使無異家奴張璪李定為安石爪牙張商英乃安石鷹犬逆意者雖賢為不肖附己者雖不肖為賢至詆安石為李林甫盧把帝屢止之坰慷慨自若略不退懾讀已下殿再拜而退侍臣衛士相顧失色閣門紏其瀆亂朝儀貶潮州别駕發明唐坰言事而貶曷為削去其官誅心也坰初附安石神宗悅而用之然其心冀得美職耳逮夫授官不協遂背安石是亦反覆之小人也故特削去其官雖然過則必憚改聖人之格言坰能力劾安石不懼艱險是蓋小人變為君子則能以愛君為念而不計其私矣觀其六十餘條之奏靣折廷爭其志為可矜耳故又嘉其悔悟而不書有罪此綱目筆削之至公褒貶之深意凡若此類非君子莫能修之廣義分注載唐坰劾安石似乎剛且直矣然而綱目不書其官者惡其私也頒方田均稅法帝惠田賦不均詔司農重定方田及均稅法頒之天下方田之法以東西南北各千步當四十一頃六十六畝一百六十步為一方歲以九月縣委令佐分地計量隨陂原平澤而定其地因赤淤黑壚而辨其色方量畢以地及色參定肥瘠而分五等以定其稅則至明年三月異揭以示民一季無訟即書戶帖連莊帳付之以為地符均稅之法縣各以其租額稅數為限舊嘗收蹙竒零如米不及十合而收為升絹不滿十分而收為寸之類今不得用其數均攤增展致溢舊額凡越額增數皆禁若瘠鹵不毛及衆所食利山林陂塘溝路墳墓皆不立稅凡田方之角立士為峯植其野之所宜木以封表之有方帳有莊帳有甲帳有户帖其分煙析産典賣割移官給契縣置簿皆以今所方之田為正令既具乃以巨野縣尉王曼為指教官先自京東路行之諸路倣焉廣義神宗紛紛謬舉黷于簡册至于方田均稅之法粗為可觀然亦不見其所謂什一也綱目特書之者猶為彼善於此九月少華山崩其下地裂陷居民數百戶發明朱子曰自古衰亂之世所以病乎中和者多矣天地之位萬物之育豈以是而失其常耶曰三辰失行山崩川竭則不必天翻地覆然後為不位矣兵亂凶荒胎殰卵殈則不必人消物盡然後為不育矣凡若此者豈非不中不和之所致而又安可誣哉神宗惑於邪僻而行逆德其中和之氣斫喪既久故少華山崩陷民數百而地道為之不位焉是知人君一心天鑒所繫君心靡正天變應之而不可須臾之怠荒也山崩雖微災異甚大故綱目必揭而書之則其重天變垂後戒亦深切而著明矣冬十月置熙河路以王韶為經略安撫使置熙河路領熙河洮岷州通逺軍升鎮洮軍為熙州以韶為經略安撫使兼知熙州然河洮岷三州猶未能復也十一月章惇招降梅山洞蠻置安化縣梅山洞蠻蘇氏舊不通中國其地東接潭南接邵西接辰北接鼎灃章惇招降之籍其民萬四千八百餘戶其田二十六萬四百餘畝均定其稅使歲一輸築武陽開峽二城置安化縣𨽻邵州十二月以陳升之為樞密使癸丑六年春二月王韶克河州獲瑪爾戩妻子以沈起知桂州自王安石用事始求邉功知雍州蕭注喜言兵羡王韶等獲高位乃上疏言交趾雖奉朝貫實包禍心失今不取必為後憂會交人為占城所敗或言其餘衆不滿萬取之易詔即以注知桂州經略之注入朝帝問攻取之䇿注復以為難度支判官沈起言南交小醜無不可取之理乃以起代注起受旨於安石遂一意事攻擾交址始二三月置經義局訓詩書周禮義以王安石提舉吕惠卿王雱同修撰帝欲召程皓預其事安石不可夏四月朔日食先是司天奏四月朔日當降天下罪囚一等至是雲食帝自三月即避殿減膳隂日不見王安石等進賀以為聖德所感乞御殿復膳從之文彥博罷彥博久居樞密以王安石多變舊典言于帝曰朝廷行事務合人心宜兼采衆論以靜重為先陛下勵精求治而人心未安蓋更張之過也祖宗法未必皆不可行但有偏而不舉之弊爾安石知為己發奮然排之曰求去民害何為不可若萬事隳脞乃西晉之風何益于治及市易司立至果實亦官監賣彥博以為損國體斂民怨致華嶽山崩為帝極言之安石曰華山變殆天意為小人發市易之起自為細民久困以抑兼并爾於官何利焉彥慱求去益力遂以司空河東節度使判河陽徒大名府身雖在外而帝眷有加置律學詔士之蒞官以法從事今所習非所學宜置律學命官舉人皆得入學習律令以范子淵提舉濬河司河溢北京夏津帝語執政聞京東調夫修河有壞産者且河決不過占一河之地或西或東利害無所校聽其所趨如何王安石曰北流不塞占公私田至多又水散漫久復澱塞昨修二股費至少而公私田皆出向之瀉鹵俱為沃壞庸非利乎况調夫已減於去嵗若復葺理隄防則夫愈減矣帝從之乃始置疏濬黃河司先有選人李公義者獻鐡龍爪揚泥車法以濬河其法用鐡為爪形繫舟尾乘流相繼而下一再過水深數尺宦官黃懷信以為可用而患其太輕安石請令懷信公義同議增損乃别置濬川杷其法以巨木長八尺齒長一尺列於木下如杷狀以石壓之兩傍繫大船各用滑車絞之撓蕩泥沙或謂水深則杷不及底淺則齒礙泥沙人皆知不可用惟安石善其法乃賞懷信而命公義官以杷法下大名令都大提舉河隄范子淵與通判知縣共試之皆言不可用會子淵以事至京師安石問其故子淵意附會遽曰法誠善苐同官議不合爾安石大悅及置濬河司將自衛州濬至海口差子淵都大提舉公議為之屬五月以熊本為梓夔察訪使瀘人叛詔遣中書檢正官熊本察訪梓夔得以便宜措置諸瀘事六月置軍器監王雱言今天下甲胄弓弩以千萬計而無一堅利者莫若更置其法斂數州之所作而聚以為一若今錢監之比擇知工事之臣使典其職且募良工為匠師帝頗采雱説置軍器監總內外軍器之政以吕惠卿判監事知南康軍周敦頥卒敦頥道州營道人初因舅鄭向任為分寧主簿有獄久不決敦頥至一訊立辨邑人驚曰老吏不如也調南安司理有囚法當不死轉運使王逵欲深治之敦頥力與辨逵不聽敦頥委手板將棄官去曰如此尚可仕乎殺人以媚人吾不為也逵悟囚得釋調桂陽罪令改知南昌富家大姓黠吏惡少惴惴焉不獨以得為憂而又以汙穢善政為耻歷知南康軍年五十根七而卒敦頥博學力行著太極圖易通明天理之原究萬物之終始言約而道大文質而義精得孔孟之本原大有功於學者為南安司理時通判程珦以其為學知道使二子皓頥往受業敦頥每令尋孔顔樂處所樂何事皓嘗曰自再見周茂叔後吟風弄月以歸有吾與點也之意侯師聖學於程頥未悟因見敦頥敦頥留與對榻夜談越三日乃還程頥驚異之曰非從周茂叔來邪其善開發人類此既至南康即築室于蓮花峯下前有溪合于湓江取營道所居濓溪以名之學者稱為濓溪先生發明周子得孔孟之本原大有功於學者誠當代之大儒也神宗親小人逺賢人而使之僅處南康弗為大用以終其身豈不深可歎哉故卒而具其官者不惟美周子乃所以譏神宗也廣義蓋嘗論之神宗之於濓溪當如成湯之於伊尹武丁之於傳説先主之於孔明置諸左右近其人以學之不可頃刻之或舍可也今則煩之以州縣未聞其一日之在廷然則神宗之朝尚可謂之有人哉及觀與神宗之相遇者不過王安石等憸邪之輩而已一時忠良擯斥殆盡况賢如濓溪者奚能見用邪雖然濓溪樂天知命安土敦仁使神宗得以大用於濂溪乎何加不用於濓溪乎何損嗚呼在濓溪固無所加損而神宗棄賢之罪不能免焉大易既濟之六二有曰婦喪其茀勿逐七日得之臣敢以為濓溪頌焉大蝗發明蝗食榖之蟲蝗曰大蝗其災甚矣然不言其地者為天下記異故耳夫以蝗之傷稼其為害大矣宋人察之以聞于朝宋史異之以書于册何也蓋蝗隂物也是時神宗上不能修德格天下又不能庇其民陽淑消而隂慝長矣此惡氣之應然也綱目書物象應欲人主慎所感也其旨深哉秋九月初䇿武舉之士凡武舉試義䇿于祕閣武藝于殿前司及殿試則又試騎射及䇿于庭䇿武藝俱優為右班殿直武藝次優為三班奉職又次借職末等三班差役初樞密院修武舉法不能答䇿者答兵書墨義王安石曰武舉而試墨義何異學究誦書不曉理者無補於事先王收勇力之士皆屬於車右者欲以備禦侮之用記誦何所施帝從之至是始䇿武舉之士發明説苑曰夫有文無武無以威下有武無文民畏不親文武俱行威德乃成既成威德民親乃服用是而觀則知有天下者文武之道可以並用而不可以相無者也宋世未嘗䇿武舉之士至神宗而始䇿之其庶幾不忘武事者矣特書曰初蓋豫之也吐蕃瑪爾戩復入河州王韶破之遂取岷宕洮疊四城帝御殿受賀韶既復河州降羌復入韶趨擊之瑪爾戩以其間據河州韶進破格納木藏城穿露骨山南入洮州境道狹隘釋馬徒行日至六七瑪爾戩留其黨守河州自將㞑官軍韶力戰破走之河州復平岷州首領摩琳沁以城降韶入之於是宕洮疊三州羌酋皆以城附韶軍行五十四日涉千八百里得州五斬首數千級獲牛羊馬以萬計捷書至帝御紫宸殿受群臣賀解所服玉帶賜王安石進韶左諌議大夫端明殿學士發明入者逆而不順之詞存中國也取者收奪之名聲罪伐人而強奪其土地者也魯取汶陽春秋所罪況非其有而取之乎宋恃大國之兵力非義奪人之土地誠春秋之所耻也神宗驕侈喜功御殿受賀其樂於自欺輕佻滿足之心見矣夫王者以天地之心為心行一不義殺一不辜而得天下有所不為何有恃其兵力強奪土地驕矜肆大而可以君臨天下哉直書于册不再貶而其失自見廣義王韶此捷神宗喜而受賀由君子觀之惡乎取蓋羌夷之屬地無賦稅居無宫室所得者不過牛羊駝馬而已抑不知朝廷軍費可償否乎故孟子有曰善戰者服上刑闢草萊任土地者次之或曰羌情不義動犯邉陲何以處之曰備禦之而已何以伐為用宣王之於獫狁逐之出塞未聞其興師動衆也趙充國之於西羌屯田守備未聞其窮兵黷武也今韶之舉乃安石生事之謀暫得一幸神宗即有賜帶之喜然不知嗜欲一耽而元氣索矣何其見之淺而慮之短邪易曰或錫之鞶帶終朝三禠之此其安石之謂乎收免行錢先是京師百物有行官司所須俱以責辦下逮貧民浮販類有陪折吕嘉問請約諸行利入厚薄令納錢以賦吏祿與免行戶祗應而禁中賣買百貨並下雜買場務仍置市司估物低昻凡內外官司欲占物價則取辦焉至是行之冬十月開直河時河北流閉已久水或橫決散漫常虞壅遏外都水監丞王令圖獻議於大名第四第五掃等處開修直河使大河還二股故道王安石主其議言于帝曰開直河則水勢分其不可開者以近河每開數尺即見水不容施功爾今苐見水即以濬川杷濬之茍置數千杷則諸河淺澱皆非所患歲可省開濬之費幾百千萬帝曰果爾甚善乃命范子淵領其事開直河深八尺凡退背魚肋河則塞之發明大戴禮曰上之親下也如腹心則下之親上也如赤子之見慈母也上下之相親如此然後令則從施則行神宗愛民之心一毫無有疲民之事相繼而興行新法則囿民以歸於水火矣事征伐則驅民以陷於鋒鏑矣開直河則率民以入於塗炭矣國以民為本茍傷其本則枝葉凋瘁雖有金城湯池孰與為守堅甲利兵孰與為敵乎自古迷而不悟者未有甚於神宗焉綱目凡有所興作而必書於册者見勞民為重事示後世治天下之大法也章惇擊南江蠻平之置沅州湖北蠻向永晤舒光銀各以其地降惇獨田氏有元猛者頗桀鷔惇遣左侍禁李資招諭之被殺因進兵破懿州南江州洞悉平遂置沅州以懿州新城為治所後城徽州蠻酋楊光富亦率其族姓二十三州洞歸附因置靖州行折二錢自王安石為政始罷銅禁姦民日銷錢為器邉關海舶不復譏錢之出國錢日耗張方平因對極論其害請詰問安石舉纍朝令典一旦削而除之其意安在安石深惡之至是行折二錢除在京及府界外諸路並通行甲寅七年春正月熊本討瀘夷降之本嘗通判戎州習夷中俗及至部以為彼能擾邉者介十二村豪為鄉導爾乃以計致百餘入梟之瀘川其徒股栗願矢死自贖獨柯隂一酋不至本合晏州千九姓之衆發黔南義軍強弩遣大將王宣等帥以進討瀘悉力旅拒宣敗之黃葛下追奔深入柯隂窘迫乞降本受之盡籍丁口土田及其重寶善馬歸之官以其酋箇怒知歸徠州其子乞弟為畨部巡檢於是淯井長寧烏蠻羅氏鬼主諸夷皆願世為漢官本帝勞之曰卿不傷財不害民一旦去百年之患至於檄奏詳明近時鮮儷擢集賢殿修撰賜三品服西南用兵自此始發明宋自用兵以來未嘗書討此書討者瀘夷久臣中國一旦不朝正王法之所必討而不原者其餘窮兵黷武大不侔矣故變文而書討所以豫其伐有罪也綱目之修循名責實而已廣義熊本開邉生事者王韶導之也二月知河州景思立與吐蕃别將戰于踏白城敗死三月瑪爾戬冦岷州刺史高遵裕擊走之瑪爾戩屢破屢敗而棟戩别將青宜結果莊之衆復數擾河州屬蕃時王韶入朝思立與戰于踏白城敗死瑪爾戩勢復熾冦岷州遵裕遣包順擊走之發明思立死於王事何不書死之而書敗死蓋內書與則主是戰者思立內為曲而外為直也故恕吐蕃而罪思立是以不以全節豫之而直書敗死以示貶不然綱目何不書吐蕃冦河州而特書知何州景思立與吐蕃别將戰于踏白城其義蓋可見矣茍不求其實而概以全節豫之則是非無别何以謂之綱目哉此微顯闡幽之意也遼使人來議疆事遣太常少卿劉忱報之遼以河東路沿邉增修戍壘起鋪舍侵八蔚應朔三州界內使林牙蕭禧來言乞行毁撤别立界至禧歸帝靣諭以三州地界俟遣官與北朝官即境上議之遂詔忱如遼遼遣樞密副使蕭素會忱于代州境上詔下樞密院議且手詔判相州韓琦司空富弼判河南府文彥博判永興軍曽公亮條代北事宜以聞琦言臣觀近年朝廷舉事似不以大敵為恤彼見形生疑必謂我有復燕之意故引先發制人之説造為釁端所以致疑其事有七招高麗朝貢一也取吐蕃之地建熙河二也植榆柳於西山以制蕃騎三也創保甲四也築河北城池五也置都作院頒弓矢新式六也置河北三十七將七也契丹素為敵國因事起疑不得不然臣嘗竊計始為陛下謀者必曰治國之本當先聚財積榖募兵于農則可以鞭笞四夷故散青苗錢為免役法置市易務次第取錢新制日下更改無常而監司督責以刻為明今農怨於畎畝商嘆于道路長吏不安其職陛下不盡知也夫欲攘斥四夷以興太平而先使邦本困搖衆心離怨此則為陛下始謀者大誤也臣今為陛下計宜遣報使具言向來興作乃修備之常疆土素定悉如舊境不可持此造端以隳纍世之好可疑之形如將官之類因而罷去益養民愛力選賢任能使天下悅服邉備日充若其果自敗盟則可一振威武恢復故疆攄纍朝之宿憤矣弼彥博公亮亦皆有言大抵度上以敵為憂故深指時事云大旱詔求直言夏四月權罷新法雨自去秋七月不兩至夏四月帝憂形于色欲盡罷法度之不善者王安石曰水旱常數堯湯所不免伹當修人事以應之帝曰朕所以恐懼者正為人事之未修爾今取免行錢大重人情咨怨自近臣以至后族無不言其害者馮京曰臣亦聞之安石曰士大夫不逞者以京為歸故京獨聞此言臣未之聞也翰林學士韓維言陛下損膳殿乃舉行故事恐不足以應變當痛自責已廣求直言帝即命韓維草詔行之初光州司法參軍鄭俠為安石所奬拔感其知已思欲盡忠及滿秩入京安石問以所聞俠曰青苖免役保甲市易數事與邉鄙用兵在俠心不能無區區也安石不答久之監安上門會歲飢征斂苛急東北流民每風沙霾曀扶携塞道羸疾愁苦身無完衣或茹木實草根至身被鎖械而負瓦揭木賣以償官纍纍不絶乃繪所見為圖奏疏詣閣門不納遂假稱密急發馬遞上之銀臺司且云旱由安石所致去安石十日不雨即乞斬臣宣德門外以正欺君之罪疏奏帝反覆觀圖長吁數四袖以入內是夕寢不能寐翌日遂命開封體放免行錢三司察市易司農發常平倉三衛具熙河所用兵諸路上民物流散之故青苖免役權息追呼方田保甲並罷凡十有八事民問歡呼相賀是日果大雨逺近沾洽發明國之所寶者民天之所愛者君民有疾苦君不能恤怨氣交并天必降災以警君故曰天視自我民視天聽自我民聽信斯言也是時新法害民天怒既久大旱之來是誠逆氣之所致也神宗能求直言胸中之惻隱頗萌矣逮夫權罷新法即日大雨則天人感應之理安可誣哉然不曰罷而曰權所以譏其偶值天變姑且罷之非真能革者去也嗚呼吾誰欺欺天乎即綱目所書觀之則人心天道可以觀而政治得失可以見是即王道之權衡爾下監安上門鄭俠獄復行新法輔臣入賀雨帝示以俠所進圖狀且責之皆再拜安石上章求去外間始知所行之由群姦切齒遂以俠付御史治其擅發馬遞罪吕惠卿鄧綰言于帝曰陛下數年忘寢與食成此美政天下方被其賜一旦用狂夫之言罷廢殆盡豈不惜哉相與環泣于帝前於是新法一切如故惟方田暫罷發明甚矣神宗易惑而難曉也天子深居九重生民休戚固難悉知幸而鄭俠繪圖以進時方大旱改法即雨驗諸天時人事新法果便民歟抑病民歟茍新法便民則人心必不咨嗟天意必不譴告耳不能以此自思而乃惑群姦之言下鄭俠于獄噫神宗何信善言之難而用邪言之易耶蓋由其素無禮義以養心因物有遷易於恐動云爾神宗所為如此則其欺天罔人於斯益見不足與有為審矣是以君子深為神宗惜也廣義新法之害朝士后族皆所不免况細民乎是以天人共怒卒不可解神宗非不知之特信安石之深而不能斷然罷去之耳今因大旱詔求直言嗚呼向來諌新法者其言直久矣但神宗蔽固已深而不能用豈其言之不直而别有所謂直者耶今以鄭俠一圖而權罷新法天亦為之果雨况實罷哉觀此則知天之不雨者特以新法之故隂陽為之不和耳一罷新法是日即雨天人之際何其影響之若是邪借曰雨於明日無乃滋人之惑矣使神宗由此而不復新法其為宋朝之福也豈淺哉夫何一聽狗鼠之輩悲號搖尾而遽復之君子為之長太息也吐蕃瑪爾戩圍河州王韶擊降之瑪爾戩冦河州圍之勢方盛韶自京師還至興平聞之乃與李憲日夜馳至熙州熙方城守韶命撤之選兵得二萬人諸將欲趨河州韶曰賊所以圍城者恃有外援也攻其所恃則圍自解乃直趨定羌城破西蕃結河川族斷夏國通路進臨寧河分命偏將入南山瑪爾戩援絶拔柵去韶還熙州以兵循西山繞踏白城後焚賊八千帳斬首七千餘級瑪爾戩乃率酋長八十餘人詣軍門乞降韶受之送瑪爾戩赴京初思立之覆師也羌勢復熾朝議欲棄熙河帝為之旰食數下詔戒韶持重勿出及是帝大喜授瑪爾戩營州團練使賜姓名趙思忠王安石免以韓絳同平章事吕惠卿參知政事安石執政六年更法度開邉疆老成正士廢黜殆盡狷慧少年超進用事天下怨之而帝倚任益專太皇太后嘗乘問語帝曰祖宗法度不宜輕改吾聞民間甚苦青苗助役宜罷之帝曰此以利民非若之也后又曰安石誠有才學然怨之者甚衆欲保全之不若岐暫出之於外帝曰群臣惟安石為國家當事時帝弟王皓在側因進曰太后言至言也不可不思帝怒曰是我敗壞天下邪汝自為之皓泣曰何至是邪皆不樂而罷久之太后流涕謂帝曰安石亂天下奈何帝始疑之及鄭俠疏進安石不自安遂求去位帝再四勉留安石請益堅乃以觀文殿大學士知江寧府吕惠卿使其黨變姓名日投匭留之安石感其意因乞韓絳代已而惠卿佐之帝從其請二人守其成規不少失時號絳為傳法沙門惠卿為護法善神惠卿懼中外有議新法者乃作書遍遺監司郡守使陳利害又從容白帝下詔言終不以吏違法之故為之廢法故安石所建無所更改發明左氏傳曰為國家者見惡如農夫之務去其草焉芟夷藴崇之絶其本根勿使能殖則善者信矣安石病國虐民滔天之罪神宗因太后之言不能貶黜以正王法而僅免其官果何謂哉矧韓絳惠卿安石之黨免安石而用韓吕則是安石實未嘗免也天下之痼疾何由而愈君側之蛇蝎何由而屏乎若神宗者真可為寄生之君焉綱目書此文無貶詞乃所以深貶之耳廣義太后與岐王於神宗為天合王安石於神宗為人合夫何神宗薄其所厚而厚其所薄哉嗚呼若神宗之昏庸暗弱當以赧獻桓靈目之宋之未亡特幸焉耳初榷蜀茶王韶建開河湟之䇿遣三司幹當公事李把入蜀經盡買茶於秦鳯熙河博馬以著作佐郎蒲宗閔同領其事初蜀之茶園皆民兩稅地不植五榖惟宜種茶賦稅一例折輸稅額總三十萬杞乃即蜀諸州創設官場更嚴私交易之令知彭州吕陶言市易司籠制百貨歲出息錢不過十之二今茶埸司盡𣙜民茶取息十之三茶户被害不可勝窮詔止收息十之一而陶亦以是得罪未幾以李稷都大提舉茶埸稷與宗閔務浚利刻急一年之間通課利及舊界息稅七十六萬七千餘緡稷又辟陸師閔幹當公事以自輔發明尹氏曰凡良法美意行於盛帝明王之世者後世皆廢不舉至於刻剝掊斂之政出於暴君汙吏之手者後世則踵而行之又從而增益推廣之如鹽鐡𣙜酤之類是也𣙜茶之法前此未有神宗始創而行之自此遂為不可易之法書初𣙜蜀茶蓋亦志作俑之端謹其始耳嗚呼民生口腹之物自是悉出於官矣五月罷制科自孔文仲對䇿忤王安石意因言于帝曰進士試䇿則是制科何必復置是邪帝然之吕惠卿執政復言制舉止於記誦非義理之學遂詔罷之三司使曾布提舉市易司吕嘉問免先是吕嘉問提舉市易連以羡課受賞帝聞其擾民以語王安石安石對曰嘉問奉法在公以是媒怨帝曰免行錢所收細瑣市易鬻及果實氷炭太傷國體安石力辨至譏帝為叢脞不知帝王大略帝曰即如是士大夫何故以為不便安石請言者姓名令嘉問條析及帝以旱故命韓維孫永集市人問之減坐賈錢千萬安石遂持嘉問條析奏曰朝廷所以許民輸錢免行者蓋人情安於樂業厭於追擾若一切罷去則無人祇承又吏胥䘵廩薄勢不得不求於民非重法莫禁以薄廪申重法則法有時而屈今取於民鮮而吏知自重此臣等推行之本意也議者乃欲除去是殆不然民未嘗不畏吏方其以行役觸罪雖欲出錢亦不可得今吏之祿可謂厚矣然未及昔日取民所得之半也時市易𨽻三司嘉問恃勢陵使薛向出其上及曽布代向懷不能平會帝出手札詢布布訪于魏繼宗具上嘉問多收息干賞挾官府而為兼并之事帝將委布考之安石言二人有私忿於是詔布與吕惠卿同治惠卿故憾布脅繼宗使誣布繼宗不從布言惠卿不可共事帝欲聽之安石不可帝遂詔中書曰朝廷設市易本為平凖以便民若周官泉府者今顧使中人之家失業若此吾民安得泰然也宜釐定其制布見帝言曰臣每聞德音欲以王道治天下今市易之為虐駸駸乎間架除陌之事矣如此之政書于牘不獨唐虞三代所無歷觀秦漢以來衰亂之世恐未之有也嘉問又請販鹽鬻帛豈不貽笑四方帝領之事未決安石去位嘉問持之以泣安石勞之曰吾已薦惠卿矣及惠卿執政遂治前獄刻布沮新法出知饒州嘉問亦出知常州以章惇為三司使六月作渾儀浮漏成時日官皆市井庸販法象圖器俱不能知乃以太常丞沈括提舉司天監括博學洽聞於天文方志律歷醫藥卜算無所不通皆有所論著始制渾儀景表五壺浮漏招衛朴造新歷募天下上太史占書雜用士人分方伎科為五至是渾儀浮漏成以括為右正言秋七月立手實法時免役出錢或未均吕惠卿用其弟曲陽縣尉和卿計創手實法其法官為定立物價使民各以田畝屋宅資貨畜産隨價自占凡居錢五當蕃息之錢一非用器食粟而輒隱落者許告有實以三分之一充賞預具式示民令依式為狀縣受而籍之以其價列定高下分為五等既該見一縣之民物産錢數乃參會通縣役錢本額而定所當輸錢詔從其言於是民家尺椽寸土檢括無遺至於雞豚亦遍抄之民不聊生初惠卿制是法然猶災傷五分以上不預荆湖察訪使蒲宗孟上言此天下良法使民自供初無所擾何待豐歲願詔有司勿以時豐凶弛張其法從之民於是益因矣九月三司火焚屋千八十楹案牘殆盡詔諸路熙寧五年文帳悉封上防其因火為姦也發明春秋之法人火曰火三司會計之所安石用事聚財瘠民民之銜怨久矣天之震怒深矣故上書立手實下書三司火則天意之於人心蓋可見焉詩云小心翼翼昭事上帝聿懷多福厥德不回以受方國神宗敬天勤民之心一毫無有宜乎天怒民怨而災異頻仍也分注言焚屋千八十楹案牘殆盡此非小變焉綱目遇災必書所以為後世人君忽天變者之戒耳冬十月置三司會計司初帝嘗患增置官司費財王安石謂增置官司所以省費帝曰古者什一而稅今取財百端安石謂古非特什一而已安石又欲盡祿天下之吏帝未之許而三司上新增吏祿歲至緡錢百十一萬有竒主新法者皆謂吏祿既厚則人知自重不敢冒法可以省刑然良吏實寡賕取如故往往陷重辟議者不以為善詔三司帳司會計是歲天下財用出入之數以聞令宰相提舉其事至是韓絳請選官置司以天下户口人丁稅賦場務坑冶河渡房園之類租額年課及一路錢榖出入之數去其重復歲比較增虧廢置及羡餘橫費計贏闕之處使有無相通而以任職能否為黜陟則國計大綱可以省察三司使章惇亦以為言乃詔置三司會計司以絳提舉十二月以王韶為樞密副使遼女真部節度使阿庫納死五國佛寧部節度使巴哩美入遼遼將致討阿庫納襲而擒之獻于遼主遼主召見燕賜加等以為生女真部節度使始有官屬紀綱漸立然不肯受印繫遼籍其部內舊無鐡鄰國有以甲胃往粥者以厚價售之得鐡既多因以修弓矢備器械兵勢稍振前後願附者衆至是五國穆延部舍音貝勒復入遼阿庫納伐之舍音敗走阿庫納將見遼邉將自陳敗舍音之功行次拉林水有疾而卒子和哩布嗣乙邜八年春正月蔡挺罷竄鄭俠于英州罷參知政事馮京放祕閣校理王安國于田里俠上疏論吕惠卿朋姦壅蔽仍取唐魏徴姚崇宋璟李林甫盧杞傳為兩軸題曰正直君子邪曲小人事業圖迹在位之臣與之暗合者各以其類復為書獻之且薦馮京可相并言禁中有人被甲登殿詬罵等事惠卿奏為謗訕令中丞鄧綰知制誥鄧潤甫治之遂編管俠于汀州御史臺吏楊忠信謁俠曰御史緘默不言而君上書不已是言責在監門而臺中無人也取懷中名臣諌疏二帙授俠曰以此為正人助京在政府嘗與惠卿爭辨而王安石弟安國素與俠善侍御史張璪承惠卿旨劾京與俠交通有迹時俠已行惠卿遂令奉禮郎舒亶往捕遇于陳州搜其篋得所録名臣諌疏有言新法事及親朋書尺悉按姓名治之獄成惠卿欲致俠以死帝曰俠所言非為身也忠誠亦可嘉豈宜深罪但徒英州京罷政出知毫州安國奪祕閣校理放歸田里判檢院丁諷鹽鐡副使王堯臣等皆得罪俠至英得僧屋將壓者居之英人無貧賤富貴皆加敬爭遣子弟從學為築室遷居之初安國任西京國子教授秩滿至京師帝以安石故特召對問曰漢文帝何如主安國對曰三代以後未有也帝曰但恨其才不能立法更制耳安國對曰文帝自代來入未央宫定變故我頃呼吸間恐無才者不能至用賈誼言待群臣有節専務以德化民海內興於禮義幾致刑措則文帝加有才一等矣帝曰王猛佐苻堅以蕞爾國而令必行今朕以天下之大不能使人何也曰猛教堅以峻刑法殺人致秦祚不傳世今刻薄小人必有以是誤陛下者願専以堯舜三代為法則下豈有不從者乎帝又問卿兄秉政外論謂何安國對曰恨知人不明聚斂太急爾帝不悅由是正授崇文院校書尋改祕閣校理安國屢以新法之弊力諫安石又嘗以各佞人目惠卿故惠卿銜之發明春秋之法詞煩而不殺必有美惡存焉新序有曰臣事君猶子事父也子為父死無所恨守節不移雖有鈇鉞湯鑊之誅而不懼也尊官顯位而不榮也鄭俠論吕惠卿而為群姦所嫉竄逐英州馮京安國特立不阿而為群姦所誣罷放别郡皆非其罪也噫神宗於小人則信之如蓍龜於君子則疾之如芒刺蓋由心術不端而邪氣乘間以入耳觀綱目之所書則其傷時之意可見廣義昔漢元帝知蕭望之之賢而不能用知𢎞恭石顯之姦而不能退今神宗知鄭俠之忠而不能用知安石之姦而不能退二君之昏庸合轍矣夫何神宗愚不知量反謂文帝不能立法更制及聞安國之對不識亦有愧於心否乎且安國者安石之弟也然其論安石之非在他人容或有傷於好惡而難以深信者人情然也至於人之親弟大非其兄之惡安敢輕議以傷天合人倫之重哉神宗於安國之論尚不悅况他人乎如是則向來諸賢之説宜其如水之沃石也吁若神宗者是誠亡宋之根柢也歟二月復以王安石同平章事初吕惠卿迎合安石建立新法安石故力援引驟至執政惠卿既得志忌安石復用遂欲逆閉其途凡可以害安石者無所不用其智安石聞而怨之時韓絳顓處中書事多稽留不決且數與惠卿爭論度不能制密請帝復用安石帝從之安石承命即倍道而進七日至汴京發明復以王安石同平章事二過之辭也神宗既知其過免未踰年至此復相者蓋由左右前後皆安石之黨以常情論之患得患失乃小人之素心蠅營狗茍亦小人之故態韓絳與惠卿不合請用安石安石承朝廷之命七日至汴何汲汲也小人之情狀豈不於斯而可見乎特書于䇿深譏之也廣義抑觀安石始欲要君之大用故君命屢及屢辭遷延顧盼不肯就道者若出于中心之誠也及乎人君求之之切大臣薦之之勤其心以為此正吾舞姦弄佞之秋也於是翻然而起其起也必合意者陟之咈意者黜之姦佞彚征忠良喪茀欺天罔人而絶無忌憚之心及其被黜又薦惠卿而預為起復之地奈何其主昏庸果欲召之即倍道而進無復一毫如向之遷延顧盼不肯就道者之心也噫安石於始也假君子之行以要君於終也逞小人之志以欺君要君欺君厥罪無律君子於安石乎何誅三月遼人復來議疆事遣知制誥沈括報之劉忱等與蕭素會于大黃平三議不能決遼初指蔚朔應三州分水嶺土壠為界及忱與之行視無土壠乃但云以分水嶺為界凡山皆有分水遼意至時可以罔取也相持久之至是遼主復遣蕭禧來致圖書以忱等遷延為言乃命韓縝代忱等與遼使議縝與禧爭辨或至夜分禧執分水嶺之説不變留館不肯辭曰必得請而後反帝不得已先遣知制誥沈括報聘括詣樞密院閲故牘得頃嵗所議疆地書指石長城為分界今所爭乃黃嵬山相逺三十餘里表論之帝喜曰大臣殊不究本末幾誤國事乃賜括白金千兩使行括至遼遼相楊益戒與議不能屈謾曰數里之地不忍而輕絶好乎括曰師直為壯曲為老今北朝棄先君之大信以威用其民非我朝不之利也凡六會竟不可奪乃還括在道圖其山川險易迂直風俗淳龎人情向背為使契丹圖上之夏四月以吳克為樞密使閠月陳升之罷升之深狡多數善傅會以取富貴初附安石及拜相即求解條例司世以是議之號為筌相六月王安石上三經新義詔頒于學官王安石等以所訓釋詩書周禮三經上進帝謂之曰今談經者人人殊何以一道德卿所著經其以頒行使學者歸一遂頒于學官號曰三經新義加安石左僕射吕惠卿給事中王雱龍圗閣直學士雱辭新命惠卿勸帝許之由是王吕之怨益深新義既頒一時學者無敢不傳習主司純用以取士先儒傳注一切廢而不用又黜春秋之書不列學官至詆之為斷爛朝報安石又以字學久不講後罷居金陵作字説二十四卷以進多穿鑿附會其流入于佛老發明嘗觀安石存心詭譎為學偏僻其自幼有矯世變俗之志而設施罔非矯世變俗之為前行新法而害民此上新義而誤士蓋可見矣夫以安石所釋詩書周禮三經上進先儒傳注一切廢棄而以春秋為斷爛不列于學官新義既頒天下傳習主司以之而取士學者以之而進身其惑世誣民充塞正道何異洪水禽獸之害乎説苑曰有國者不可不學春秋蓋春秋聖人筆削之書寓一王之大法存褒貶之至公安石棄而不用者特以誅辭討逆而心常厭惡云爾經曰非聖人者無法其罪可勝誅哉他日又作字説穿鑿附會流於佛老是乃援儒入墨非特當世之罪人實萬世之罪人也雖然浮雲蔽日不能損其真明聖賢之道昭著于上下貫徹乎古今又豈安石鄙夫所能損益耶據事直書而貶在其中者蓋此類是矣司徒侍中魏公韓琦卒琦卒前一夕大星隕州治櫪馬皆驚帝自為碑文載琦大節篆其首曰兩朝顧命定䇿元勳贈尚書令諡忠獻後追封魏王史臣曰琦相三朝立二帝厥功大矣當治平危疑之際兩宫幾成嫌隙琦處之裕如卒安社稷人服其量歐陽修稱其臨大事決大議垂紳正笏不動聲色措天下於泰山之安可謂社稷之臣豈不信哉秋七月詔韓縝如何東割地以畀遼遼使爭議疆事不決帝問于安石安石勸帝曰將欲取之必姑與之於是詔於分水嶺為界禧乃去至是遣天章閣待制韓縝如河東割新疆與之凡東西失地七百里遂為異日興兵之端發明孟子曰諸候所寶者三土地人民政事蓋三事皆國之寶而土地為先何則土地者受之天命傳之先君子孫當以世守決不輕易與人此貞常之理也仁宗之朝契丹求地當時富弼諸賢僅克增其歲弊不勞寸兵卒成和好此固外邦無厭之求宜遏而不宜縱也自去年至今契丹議疆兩見綱目而割地之謀朝議未許逮夫惑安石姑以與之之言棄東西七百餘里於乎幽薊之地未復尚為中華之耻矧以中華之地復割以賂外邦乎蓋由小人之必知有己而不知有人己之物則寶之如珠玉人之物則輕之如瓦礫云爾殊不知損今日之疆界為異日之爭端然則小人之禍不獨貽之於一時而且貽之於後世豈不惜哉直書割地不再貶而其惡自見廣義安石以祖宗之地輕以與人則後之權姦誤國得以效尤矣是以汴宋之未有檜賊南宋亡之有賈賊焉一皆割地與人而略無顧惜之心者皆安石之作偏也詩曰誰生厲階于今為梗信矣哉八月朔日食韓絳免先是絳與王安石議事不合會有劉佐者坐法免安石欲收佐用之絳執不可議于帝前不決絳即再拜求去帝驚曰此小事何必爾絳對曰小事尚不伸况大事乎帝為逐佐至是以疾求罷出知許州而三司會計司亦罷絳臨事果敢故韓琦以為有公輔器而薦用之特以素黨安石為清議所少冬十月吕惠卿有罪免御史蔡承禧論惠卿姦惡惠卿居家俟命中丞鄧綰亦欲彌縫前附惠卿之迹以媚安石安石子雱復深憾惠卿遂諷綰發惠卿兄弟強借秀州華亭富民錢五百萬與知華亭縣張若濟買田共為姦利事置獄鞫之惠卿竟罷出知陳州綰又論三司使章惇協濟惠卿之姦出知湖州發明按劉氏書法凡免官書某免者可免者也著所坐者有罪者也韓絳惠卿皆安石之黨然何以一書免而一書有罪免原情定罪也絳雖黨於安石然遇事輒爭非甚阿謏惠卿黨於安石頥指氣使罔敢異同考之分注參之書法則可知矣豈以小人之故而遂不别其涇渭哉綱目一字之褒美於華衮一字之貶感於鐵鉞此之謂也彗星見詔求直言罷手實法彗出軫帝以災異數見避殿減膳詔求直言赦天下詢政事之未協于民者王安石率同列上疏言晉武帝五年彗出軫十年又有孛而其在位二十八年與乙巳占所期不合蓋天道逺先王雖有官占而所信者人事而已禆竈言火而驗欲禳之國僑不聽鄭亦不火有如禆竈未免妄誕况今星工哉竊聞兩宫以此為憂望以臣等所言力行開慰帝曰聞民間殊苦新法安石對曰祁寒暑雨民猶怨咨此無庸恤帝曰豈若并祁寒暑兩之怨亦無邪安石不悅退而屬疾卧帝慰勉起之其黨謀曰今不取上素所不喜者暴進用之則權輕將有窺人間隙者安石是其䇿帝喜其出凡所進用悉從之鄧綰言凡民養生之具日用而家有之今欲盡令疏實則家有告訐之憂人懷隱匿之慮啇賈通殖貨利交易有無或春有之而夏已蕩析或秋貯之而冬已散亡公家簿書何由拘録其勢安得不犯徒使嚚訟者趨賞報怨畏怯者守死忍困而已詔罷手實法發明西山真氏曰君德無愧則天為之喜而祥瑞生焉君德有闕則天示之譴而災異形焉災祥雖異所以勉其為善一也天之愛君如此為人君者其可不以天之心為心乎日者人君之表彗者逆氣所并上書曰食下書彗見則其變甚矣神宗詔求直言罷手實法則庶幾有恐懼之心耳茍能自此而擴充之悉逺佞人盡革弊政則天意可回而人心可得惜乎神宗固已深終莫能悟可深嘆哉是以弭災之道莫如弭心心正則物無不正而災不為害民不為厲矣廣義手實之法始於惠卿當惠卿得志之日曽無一人論其非者及其免黜鄧綰小人乃乘其敗而奏免之然罷手實之法當矣夫何綱目止書曰罷手實法若不預綰然者蓋罷之者非綰之本心也特擠之以井上石耳此固春秋誅心之法也此綱目之深意也十一月交址大舉入寇陷欽亷州初廣西屯北兵二十指揮以備邉交人畏之會沈起坐邉議罷以知處州劉彛代之彛至奏罷正兵而用槍仗手分戍聽偏校言以為安南可取乃大治戈船交人來互市率皆遏絶表疏上訴亦不得逹至是遂分三道入寇一自廣府一自欽州一自昆崘關連陷欽亷二州殺土丁八千人事聞起坐貶安置郢州而除彛名熊夲擊渝州獠降之置南平軍渝州南川獠木斗叛詔本安撫之本進營銅佛埧破其衆木斗舉秦州地五百里來歸為四寨九保建銅佛埧為南平軍召本還知制誥本欲取媚安石因上疏曰天下之治有因有革期於趣時適治而已陛下出大號發大政可謂極因革之理然改制之始安常習故之群交歡合譟或諍于廷或謗于市或投劾引去者不可勝數陛下燭見至理獨立不奪今雖少定彼將伺隙而逞願陛下深念之勿使彼有以窺其間而終萬世難就之業天下幸甚遼耶律洪基殺其妻蕭氏蕭氏姿容冠絶工詩善談論好音樂立為后生太子濬時北院樞密使耶律伊遜專政勢傾一國而忌后明敏於是官婢單登等誣后與伶官趙惟一私通伊遜以聞詔伊遜劾狀遂族誅惟一而后賜自盡歸其尸於家後追諡宣懿發明易曰夫夫婦婦而家道正正家而天下定矣有夫婦然後有父子有父子然後有君臣是以夫婦之道誠人倫之大綱而不可忽者洪基惑權姦之譛遂殺其妻則其惡亦甚焉綱目特斥姓名而書殺所以惡而絶之也則其植人倫之本至深切矣十二月以元絳參知政事曾孝寬簽書樞密院事絳在翰林諂事王安石而安石嘗德曾公亮之助已欲引公亮子孝寬於政地以報之由是二人同升罷直學士院陳襄襄福州侯官人舉進士歷知仙居河陽縣留意教化進縣之弟於學或讒之於判府富弼謂其誘邑子以資過客弼疑焉人勸襄毁學舍以塞謗襄不從而講説不少解弼由是益竒之及弼相薦諸朝纍擢侍御史上疏論青苖之害曰臣觀制置司所議莫非引經以為言而其實則稱貸以取利是特管夷吾啇鞅之術望貶斥王安石吕惠卿以謝天下罷韓絳以杜大臣爭利而進者不聼乃請外帝惜其去留修起居注安石屢欲出之帝不許三遷直學士院帝嘗訪人材之可用者襄以司馬光韓維吕公著蘇頌范純仁蘇軾等三十三人對安石益惡之擲其書詔小失諷御史劾之遂知陳州發明書曰無輕民事惟難無安厥位惟危慎終于始有言逆于汝心必求諸道有言遜于汝志必求諸非道古之聖王治天下者其兢業如此尚何有怠荒之失乎陳喪因論新法初無大過言而不聽優容答之不當罷黜也神宗自變法以來諫者屢遭貶謫略無少恕噫茍親法便民則人必不言之矣何其護疾忌醫寧沒其身而不悟哉後之拒諫飾非者當以神宗為鑒更定解池鹽鈔法自薛向立鹽鈔本其後多虛鈔而鹽益輕至是多言官賣不便乞通商王安石主提舉張景溫之言至課民買官鹽隨貧富作業為多少之差買賣私鹽聽人告以犯人家財給之買官鹽食不盡留經宿者同私鹽法於是民間騷怨鹽鈔舊法每席六緍至是三緍有餘商不入粟邉儲失備丙辰九年春正月交址陷雍州知州事蘇緘死之交人圍雍知州蘇撼悉力拒守外援不至城遂陷緘義不死賊手命其家三十六人皆先死藏尸于坎乃縱火自焚城中人感緘之義無一人從賊者於是交人盡屠其民凡五萬八千餘口事聞詔贈緘奉國節度使諡曰忠勇發明見危授命君子本心殺身成仁賢者素志是時交人圍雍蘇緘拒守外援不至城陷而亡則其大節凛乎不撓矣肥義曰貞臣也難至而節見忠臣也纍至而行明茍不以忠貞自守確乎不拔而臨難不偷生茍免者幾希雖然人臣受爵祿於無事之時而不效死於有事之日尚何犬馬之足齒乎故綱目以全節豫緘者所以為後世人臣徇國之一勸耳廣義蘇緘死難始於王韶之開邉蕭注慕其功而釀成交址之釁也旡妄之六三有曰或繫之牛行人之得邑人之災此之謂與章惇招降五溪蠻遂城下溪州章惇使湖北提刑李平招納下溪州刺史彭師晏誓下州洞蠻張景謂彭德儒向永勝覃丈猛覃彥霸各以其地歸版籍師晏遂降詔築下溪州城賜名會溪戍以兵𨽻辰州出租賦如漢民遣師晏詣闕授禮賔副使自是五溪皆平二月以郭逵為安南招討使王安石聞欽亷陷不悅會得交人露布言中國作青苖助役之法窮困生民今出兵欲相拯濟安石怒自革敕榜詆之而以天章閣待制趙卨為招討使宦者嘉州防禦使李憲為副將兵討之憲久在西北邉好論兵王韶之開熙河憲與有勞故用之既而卨與李憲議事不合帝因問卨孰可代憲卨言逵老於邉事願以為使而已副之帝從其言仍詔占城占臘合擊交址吐蕃果莊冦五牟谷以种諤知岷州秋七月御史中丞鄧綰有罪免吕惠卿既出守陳而張若濟之獄久不成王雱令門下客嘉問練亨甫共取鄧綰所列惠卿事雜他書之下制獄王安石不知也省吏告惠卿于陳惠卿以狀聞且訟安石盡棄所學隆尚縱橫之末數方命矯令罔上要君帝以狀示安石安石謝無有歸以問雱雱言其情安石咎之雱忿患疽發背死帝頗厭安石所為綰慮安石去失勢乃上書言宜録安石子及壻仍賜第京師帝以語安石安石曰綰為國司直而為宰臣乞恩澤極傷國體當黜之帝以綰操心頗僻賦性姦回論事薦人不循分守斥知號州發明吕惠卿書有罪免則削其官此具其官何綰既當言責綱紀所司而乃為安石乞恩失職之甚此固小人之羽翼耳故特具其官具官正所以著其罪也其疾惡之旨嚴矣廣義自古小人比而不周解克有終當惠卿秩滿赴京之時即與安石定交其同聲相和者豈有一事之出于天理之公事事人欲之私也譬諸盜焉謀起于穿窬之初投機如膠漆贓分於負版之日反目如仇讐及其敗露則自相責讓今觀安石父子何以異於是哉後之謀國不臧者可以鑒矣八月罷粥祠廟司農粥祠廟於民應天府閼伯微子廟皆在粥中判官劉摯嘆曰一至於此往見判府張平曰獨不能為朝廷言之邪方平矍然託摯為奏曰閼伯遷商事丘主祀炎火為國家盛德所乘微子宋始封之君開國此地亦本朝受命建號所因又有雙廟乃唐張巡許逺孤城死敗能捍大患今若令承買小人規利冗褻瀆慢何所不為歲收微細實損國體乞留此三廟以慰邦人崇奉之意疏上帝大震怒批牘尾曰慢神辱國無甚於斯於是天下祠廟皆得罷粥廣義蓋聞所當去者淫祠耳未聞在祀典者得以去之也既不當去必尊敬奉承所謂以承上下神祗是也豈有粥之之理邪噫神宗於神尚敢慢之其於民也何有今於方平之奏罷粥乃爾其於未奏之前何為者邪冬十月王安石免以吳充王圭同平章事馮京知樞密院事安石之再相也屢謝病求去及子雱死尤悲傷不堪力請解機務帝益厭之乃以使相判江寧府尋改集禧觀使安石既退處金陵往往寫福建子三字蓋深悔為吕惠卿所誤也充子安持雖娶安石女而充心不善安石所為數為帝言新法不便帝察充中立無與及安石免遂相之充欲有所變革乞召還司馬光吕公著韓維蘇頌及薦孫覺李常程皓等數十人光自洛貽書充曰自新法之行中外洶洶民困於煩苛迫於誅斂怨流離轉死溝壑日夜引領冀朝廷覺悟一變敝法今日救天下之急當罷青苖免役保甲市易而息征伐之謀欲去此五者必先别利害開言路以悟人主之心今病雖已深猶未至膏肓失今不治遂為痼疾矣充不能用吕惠卿告安石罪發其私書有無使上知及勿令齊年知之語京與安石同年生故云帝以安石為欺而賢京故召用之廣義人心之有天理猶天之有日月天理為人欲所蔽猶日月為隂霾雲霧翳之也然人血氣既衰則人欲漸消天理為之發見天地間隂雲之氣將散則日月為之漸明其理一也今安石當國既久井心為惡朝士發言盈廷小民怨讟騰口自知向日所為被人所誤覺今是而昨非矣雖曰深悔悔將焉及曾子曰人之將死其言也善信哉十二月郭逵敗交址兵于富良江李乾德降逵次長沙先遣將復雍亷而自將西進至富良江蠻以精兵乘船逆戰官軍不能濟趙卨分遣將吏伐木治攻具機石如兩蠻船皆壞因設伏擊之斬首數千殺其偽太子洪真李乾德懼遣使奉表詣門軍納欵時官兵八萬人冒暑涉瘴地死者過半富良江去其國不逺逵不敢渡得其原州門州思浪州蘇茂州桄榔縣而還群有臣稱賀詔以廣源為順州赦乾德罪治劉彛沈起開釁之罪安置隨秀州詔宦者李憲節制秦鳯熙河諸軍時棟戩將果莊聚兵珧岷脅新附羌多叛歸之帝遣內侍押班李憲乘驛往秦鳯熙河措置邉事詔諸將皆受節制御史彭汝礪等極論其不可且言果莊之患小用憲之患大憲功不成其患小功成其患大章再上不聽發明嗚呼宦者之蠧至是深矣宦者之權至是極矣書以李憲節制熙河秦鳯諸軍是舉秦鳯熙河之大皆制於一閹宦之手使之措置邉事使之節制諸將合數鎮之兵權而歸之他時徽宗用貫卒覆天下是豈一朝一夕之故哉大書于册為後鑒也丁巳十年春二月王韶免韶與王安石有隙且以勤兵逺略歸曲朝廷帝亦不悅數以母老乞歸乃出知洪州韶鑿空開邉驟躋政地然用兵有機略臨出師召諸將授以指不復更問每戰必捷嘗夜卧帳中前部遇敵矢石已及呼聲振山谷侍者股栗而韶鼻息自如人服其量秋七月河決澶州自開直河水勢增漲田廬益壞外都水監丞程昉以不白水災憂死至是大決於澶州曹村北流斷絶河道南徙東匯于梁山張澤濼分為二𣲖一合南清河入于淮一合北清河入于海凡灌郡縣四十五而濮齊鄆徐尤甚壞田逾三十萬頃遣使修閉判大名府文彥博言溺勢變移四散漫流兩岸俱被水患而都水止固護東流北岸希省費之賞未嘗增修隄岸今者之決溢非天災實人力不至也逾年決口塞詔改曹村掃日靈平發明河決者隂逆而與怨氣交并之所致也變不虛生必俟人為之感而生災不妄見必俟人為之感而見故曰嚴恭寅畏小心翼翼時朝廷所用者皆小人天下所行者皆弊政民之所怨者非一日天之所警者非一事宋之君臣玩安忽危恬無戒懼悲夫尚書曰天聰明自我民聰明天明畏自我民明畏逹于上下敬哉有土古先哲王之治天下惟恐一念之惡或貽天怒故必如臨深淵如履薄冰求其無過而後已詎敢縱欲無度而不知所警哉九月河南邵雍卒雍天性高邁逈出千古而坦夷溫厚不見圭角時新法行吏牽迫不可為或投劾去雍門生故友居州縣者或貽書訪之雍曰此賢者所當盡力之時新法固嚴能寬一分則民受一分之賜矣投劾何益邪程皓嘗與雍議論終日退而嘆曰堯夫內聖外王之學也雍知慮絶人遇事能前知程頥嘗曰其心虛明自能知之及疾病司馬光張載皓頥晨夕候之卒年六十七皓為銘墓稱雍之學純一不雜汪洋浩大就其所至而論之可謂安且成矣所著皇極經世觀物內外篇漁樵問對傳于世元祐中賜諡康節發明雍未嘗出仕乃布衣耳何以書録賢也然何為特書河南而不曰處士蓋雍著書立言抱道自樂雖躬逄盛世而無一毫富貴之心天性高邁逈出千古而程子稱其純一不雜汪洋浩大就其所至而論之可謂安且成矣是誠豪傑之才聖賢之學耳豈他處士者之可比哉綱目書曰河南處士則不足以盡其美必曰河南邵雍卒表其為河南之人豪無出其右者其豫之深矣此皆綱目之特筆也廣義康節先生道德學行備本傳萬世學之者仰如山斗固非後生末學所可容喙然竊觀其語貽書者之言于以見其德氣溫厚如陽春可掬以至授之以官皆固辭乃受命既而竟稱疾不之官者感鵑聲之驗故也然一則不廢詔命一則能行己志敬君行己可謂兩得矣非深於道者孰能與於此哉先儒以復之六四贊朱子臣亦以此頌邵子云冬十一月遼魏王耶律伊遜殺其君之子濬濬幼好學善騎射既立為太子兼北南院樞密使時耶律伊遜擅政搆害宣懿皇后而立其黨蕭錫默之妹為后遂欲害濬會護衛蕭和克知伊遜姦狀伏橋下欲殺之適值暴雨橋壞所謀不遂乃下獄濬亦以母故有憂色副點檢蕭鍚沙謂伊遜曰臣民心屬太子一旦若立吾輩措身何地伊遜然之乃謀搆濬以罪隂令護衛耶律札喇誣告都宫使耶律薩喇及和克等謀廢立按驗無狀而罷既而伊遜復令蕭額都溫等誣首札喇前告非妄臣實與謀欲殺伊遜然後立太子臣若不言恐事覺連坐遼主信之遂命伊遜及耶律孝傑等鞫治薩喇等誣伏皆殺之而幽濬于别室濬具陳枉狀謂耶律延格曰吾為儲副尚何所求公當為我辨之延格伊遜之黨也因易其言為欵伏遼主大怒乃廢濬為庶人徙于上京濬將出曰我何罪至此蕭鍚沙叱使登車命衛士闔其所而去伊遜與耶律孝傑謀遣其私人蕭達和克等夜引力士入囚室紿以有赦召濬出殺之函首以還詐云疾薨遼主命有司葬于龍門山既而伊遜復隂遣人殺濬妃蕭氏遼主後知其寃悔恨無及追諡濬曰昭懷太子發明伊遜之惡至是極矣前因私忿而譛殺君后此因妬忌而譛殺君儲是蓋亂臣賊子積惡於有素其心以為吾君易欺而恣意忘誕吾君之子立焉必將正其罪而誅之故姦謀詭計浸潤之譛必欲害之而後已觸類而長則雖弒父與君亦何所憚而不為乎是以亂臣賊子要當謹之於微其微不謹其勢必盛逮至養成亂階則浸不能制矣易曰臣弒其君子弒其父非一朝一夕之故其所由來者漸矣由辨之不早辨也履霜堅氷至蓋言慎也故綱目斥名直書殺其君之子濬正名定罪其旨嚴哉同知太常禮院張載卒載自崇文歸終日危坐一室左右簡編俯而讀仰而思有得則識之或中夜起坐取以燭書其志道精思未嘗須臾息也敝衣疏食與諸生講學每告以知禮成性變化氣質之道學必如聖人而後已以為知人而不知天求為賢人而不求為聖人此泰漢以來學者大弊也故其學以易為宗以中庸為體以孔孟為法黜怪妄辨鬼神其家婚喪葬祭率用先王之意而傅以今禮又論定井田學校之法皆欲條理成書使可舉而措諸事業吕大防薦之召同知太常禮院以疾歸而卒世稱橫渠先生所著正蒙西銘行于世程頥言西銘明理一而分殊擴前聖所未發與孟子性善養氣之論同功發明橫渠之學以易為宗以中庸為體以孔孟為法是深得乎道統之傳者也卒而具官蓋豫之耳廣義邵子未嘗實歷其官故於其卒也識其地而不衛之張子嘗實歷其官故於其卒也銜之而不識其地綱目參酌二賢之巔末此書法之所以異焉戊午元豐元年春閏正月曾孝寬罷以孫固同知樞密院事初固與王安石議新法不合出知真定至是帝思其先見召用之夏六月朔日食秋九月交址來貢李乾德遣使來貢表求所失州縣詔不許未幾乾德歸所掠民乃以順州賜之其後定交址界復還其六縣二洞以吕公著薛向同知樞密院事公著在翰林帝嘗以釋老之事語之公著問曰堯舜知此道乎帝曰堯舜豈不知公著曰堯舜雖知此而惟以知人安民為難所以為堯舜也帝默然向幹局絶人尤善商財計算無遺䇿為陜西轉運副使八年改三司使洮河用兵資用浩繁向未嘗乏供給用心至到然不能不病民王安石方尚功利從中主之雖御史有言不聽也故益得展奮由文俗吏得大用議復肉刑帝初即位韓絳曾布建議復肉刑至是復詔輔臣議吕公著曰後世禮教未備而刑獄繁肉刑不可復將有踊貴屨賤之譏王圭欲取死囚試劓刖之公著曰不可刖而不死則此法遂行矣議遂寢冬十一月罷文武官功臣號十二月復置大理獄帝以國初廢大理獄非是又開封囚猥多乃命復置發明刑以止邪不可不用然而國有常典奚必過求蓋禮教未備則刑獄繁未聞禮教既備而刑獄繁者神宗議復肉刑置大理獄噫宋之刑獄不為不備奚屑屑以更張乎語曰善人教民七年亦可以勝殘去殺矣茍能以禮教服民則民親其上死其長自有刑措之風焉不能反本徒事於末民心何所適從哉故又曰道之以政齊之以刑民免而無耻道之以德齊之以禮有耻且格己未二年春二月召程皓判武學既而罷之皓自知扶溝縣召判武學命下數日李定何正臣劾其學術迂闊趨向僻異且新法之初首為異論復罷之吕公著上疏言方朝廷修改法度之初凡在朝野孰無論議陛下兼包豈悉記録而小人賊害指目未已如皓者陛下早自知之其立身行己素有本末昔在言路時有論列皆辭意忠厚不失臣子之體兼所除武學亦未為仕宦要津而小人斷斷必以為不可者直欲深梗正路其所措意非特一二人而已疏奏不納皓竟歸故官發明曰既而罷之譏不果也傅曰見賢而不能舉舉而不能先慢也時天下洶洶民思善政神宗知安石之姦而罷黜知程皓之賢而召還胸中之涇渭庶幾少明矣奈何群吠紛紜遂棄而勿用嗚呼此皆生民之大幾也吕公著上疏切諫恝然不納抑不知神宗何信讒之昜而樂善之難耶良由心中無主隨惑而隨遷云爾豈有明哲之君斷之以義而浮言安能搖奪哉善乎古人有曰用賢不難用賢不疑為難斯言信之矣綱目書此始焉喜之終焉惜之也夏五月元絳罷以蔡確參知政事確善觀人主意與時上下以王安石薦再調監察御史因為之用知帝已厭安石即論安石乘焉入宣德門與衛士競以賈直文彥博言濬川杷非濬河之具帝遣知制誥熊本行視以文彥博言為是確遂論本附彥博本坐罷確因代其職改知諌院判司農事覬欲得臺端因論中丞鄧潤甫御史上官均按獄失實潤甫均皆罷而確得中丞猶領司農凡常平免役之法皆成其手會太學生虞蕃訟博士受賄確深探其獄連引朝士自翰林學士許將及元絳子耆寧以下皆逮繫令獄卒與同寢處飲食旋溷共一室設大盆於前凡羹胾飯餅舉投其中以杓混攪分飼之如犬豕久繫不問幸而得問無一事不承遂劾絳為子有所屬請出知亳州確遂代其位確自諌院為參知政事皆以起獄奪人位而居之士大夫交口叱罵而確自以為得計也吳充數為帝言新法不便欲稍去甚者確曰曹參與蕭何有隙至代為相一遵何約束今陛下所自建立豈容一人挾怨而壞之法遂不變絳工於文辭而無特操仕已顯猶謂遲晚時論鄙之廣義蔡確一出而奪人之位如拾芥折枝耳何其易邪然觀其排擠之術未免論疏進於神宗而後施行神宗何不審其情偽之一二乎若神宗者誠蔡確股掌中之物也于時吕公著以知人安民之語告之而神宗默焉者不亦冝乎秋八月許二史直前奏事修起居注王存乞復唐貞觀二史之職執筆隨宰相入殿帝是其言又故事左右史雖日侍立而欲奏事必稟中書俟旨存與同修起居注王安禮因對及之乃詔許直前著為令冬十月立水居戶賦役法詔求水居船户五户至十户為一甲以輸賦役太皇太后曹氏崩帝事太后極誠孝后亦慈愛天至故事外家男子毋得入謁帝以后春秋高數請召弟佾入見久之乃許及見少頃后謂佾曰此非汝所當得留輒遣出焉帝嘗有意於燕薊已與大臣定議乃詣太后白其事后曰儲蓄賜豫備乎鎧仗士卒精乎帝曰固已辦之矣后曰事體至大吉凶悔吝生乎動得之不過南面受賀而已萬一不諧則生靈所繫未易以言茍可取之太祖太宗收復久矣何待今日帝曰敢不受教廣義太皇太后者仁宗之后太尉彬之孫也觀其訓神宗之言宛然乃祖不嗜殺人之仁也當時仁宗廢郭后而立太皇則太尉之德蓋可見矣雖然要亦杜太后作則於其始也厥後英宗之后高氏史稱為女中堯舜神宗之后向氏哲宗之后孟氏皆有賢德著稱豈非以其源流之深長也哉下知湖州蘇軾獄貶為黃州團練副使軾自徐徙湖上表以謝又以事不便民者不敢言以詩託諷庶有益於國中丞李定御史舒亶擲其語以為侮慢因論軾自熙寧以來作為文章怨謗君父交通戚里逮軾赴臺獄詔定與知諫院張璪御史何正臣舒亶等雜治之定等媒糵以為誹謗時事鍛錬久之且多引名士欲置之死太皇太后曹氏違豫中聞之謂帝曰嘗憶仁宗以制科得軾兄弟喜曰吾為子孫得兩宰相今聞軾以作詩繫獄得非仇人中傷之乎捃至於詩其過微矣宜熟察之帝曰謹受教吳充申救甚力帝亦憐之會同修起居注王安禮從容白帝曰自古大度之君不以言語罪人軾以才自奮謂爵祿可立取顧録録如此其心不能無觖望今一旦致於理恐後世謂陛下不能容才帝曰朕固不深譴也行為卿貰之第去勿漏言軾方賈怨於衆恐言者緣以害卿也王圭復舉軾詠檜詩曰根到九泉無曲處世間惟有蟄龍知以為不臣帝曰彼自詠檜爾何預朕事軾遂得輕比舒亶又言駙馬都尉王詵輩公為朋比如盛僑周邠固不足論若司馬光張方平范鎮陳襄劉摯皆略能誦説先王之言而所懷如此可置而不誅乎帝不從但貶軾黃州團練副使本州安置弟轍及詵皆坐謫貶張方平司馬光范鎮等二十二人俱罰銅初鮮于侁為京東轉運使以王安石吕惠卿當國正人不得立朝嘆曰吾有薦舉之權而所列非賢耻也遂舉劉摯李常蘇軾蘇轍劉攽范祖禹等及知揚州會軾自湖赴獄親朋皆絶與交道出廣陵侁往見之臺吏不許通或曰公與軾相知久其所往來文字書問宜焚之勿留不然且獲罪侁曰欺君負友吾不忍為以忠義分譴則所願也至是以舉吏纍謫主管西京御史臺發明甚矣小人之桀黠也茍欲中傷善類無所不至軾以詩諷政雖云小疵未為大咎而李定舒亶之徒摘其警詞以為侮慢嗟夫君子和而不同小人同而不和正邪相反賢否殊塗是以君子少有微瑕即為小人羅織在乎人君辨之何如耳茍不能辨而為小人所蔽則善善惡惡不公天下亦不可得而治矣綱目於軾以無罪例書則其權衡亦審焉庚申三年春正月遼出耶律伊遜于興中府伊遜又欲害太子濬之子延禧因言宋魏王和羅噶之子淳可為儲嗣羣臣畏伊遜莫敢言北院宣徽使蕭烏納伊勒希巴蕭托輝曰舍嫡不立是以國與人也遼主猶豫不決會獵於黑山見扈從官屬多隨乙辛後始惡其專遂改伊遜知南院大王事伊遜入謝遼主即日出之興中府其黨多黜遂封延禧梁王為設旗鼓蘇拉六人以護衛之生六年矣發明伊遜之惡已著曷為不書有罪遼治之不以罪也惡而不治則惡日長伊遜譛殺君后誣害君儲在王法之所不原遼主既知其姦不能明正其罪是以欲蓋彌張浸不能已而又欲害太子之子其惡益甚矣兹因臣諌僅出興中傳曰見不善而不能退退而不能逺過也既不能肆諸市朝又不能投諸荒昧則亂臣賊子何所懲戒乎綱目書此非為遼之亂臣賊子慮為天下後世之亂臣賊子慮也故夫書遼出耶律伊遜若無罪焉者所以深斥遼之失政刑也以章惇參知政事三月吳充罷充欲有所為每為王圭蔡確所沮至是諌官張璪論充與郭逵書止其進兵故安南無功充既遭同列困毁素病瘤積憂畏疾益侵遂罷為西太乙宫使踰月卒充為相務安靜心正而力不足知不可為而不能勇退為世所譏葬慈聖光獻皇后夏四月詔忠州團練使韓存寶經制瀘夷先是渝州獠冦南州其酋阿訛奔箇恕熊本重賞檄斬之阿訛桀黠習知邉隙箇恕匿不殺會箇恕老以兵屬其子乞弟遂與阿訛侵諸部時羅茍夷叛犯納溪提刑穆珦言羅茍起端不加誅則烏蠻觀望為害不細乃詔韓存寶擊之存寶召乞弟犄角討蕩五十六村十三囤蠻乞降承租賦乃罷兵至是乞弟率步騎六千至江安城下責平羅茍之賞數日乃引去知瀘州喬敘遣梓夔都監王宣以兵二千守江安而以賄招乞弟與盟於納溪蠻以為畏己益悖慢盟五日遂率衆圍熟夷羅箇牟族宣救之一軍皆沒事遂張驛召存寶授方略統三將兵萬八千趨東川存寶怯懦不敢進乞弟送款紿降存寶信之遂休兵於綿梓遂資間六月詔中書詳定官制國初承唐制三省無專職臺省寺監亦無定員類以他官主判三省長官不預朝政六曹不釐本務給舍不領本職諌議無言責起居不記注司諌正言非特旨供職亦不任諫諍其官人受授之别有官有職有差遣凡任者以登臺閣升禁從為顯宦而不以官之遲速為榮滯以差遣要劇為貴途而不以階勳爵邑有無為輕重議者多以正名為請帝慨然欲更其制乃置詳定官制局於中書命翰林學士張璪樞密副承旨張誠一領之詔祕書監劉几等定雅樂帝自即位於禮樂之事未遑制作至是將有事於明堂知禮院楊傑條上舊樂之失遂召致仕祕書監劉几侍郎范鎮與傑參議几傑請遵祖訓一切下王朴樂二律用仁宗時所制編鐘追考成周分樂之序辨正二舞容節而鎮欲求一桴二米真黍以律生尺改修鐘量廢四清聲詔悉從几傑議樂成第加恩賚鎮謝曰此劉几樂也臣何預焉復上疏論之不報發明制禮作樂固天子之當為然必功成作樂治定制禮未有功不成治不定而妄作禮樂者是時沿邉之塗炭未消天下之瘡痍未愈老弱轉乎溝壑壯者散於四方功之不成未有疏於此時者也治之不定未有甚於此時者也賈誼曰建久安之勢成長治之業以承祖廟以奉六親至孝也以幸天下以育羣生至仁也不能以此自明而遑遑汲汲惟以禮樂為事而生民之榮瘁置之度外是豈治天下者之心哉抑末也本之則無如之何此固謬妄焉耳直書定樂深譏之也秋七月彗出太微垣詔羣臣直言闕失王安石弟安禮應詔上疏曰人事失於下變象見於上陛下有仁民愛物之心而澤不下究意者左右大臣是非好惡不遵諸道乘權射利者用力殫於溝瘠取利究於圍夫足以干隂陽而召星變願察親近之行杜邪枉之門至於祈禳小數貶損舊章恐非所以應天者帝覽疏嘉歎諭之曰王圭欲使卿條具朕嘗謂不應沮格人言以自壅障今以一指蔽目雖泰華在前勿之見近習蔽其君何以異此卿當益自信遂進翰林學士知開封府發明神宗之世彗星兩見而此出太微垣其異尤甚然前書彗見而詔求直言此書彗出而詔言闕失則其於敬天求言之心庶幾少盡然卒不能見諸行事者由君心之蠧未除耳君心之蠧未除天變之來難遏君心之蠧者小人也是時小人盈朝迭興迭滅君心之蠧牢不可拔人事失於下變象見於上豈有人事不失而致變象者然則天心之與君心相為一體君心不臧天心垂戒董子仁愛之言至是益信矣後世人君其可不正其心術哉九月定百官寄祿格官制成下詔行之凡領空名者一切罷去而易之以階因以寄祿議者又欲罷樞密院歸兵部帝曰祖宗不以兵柄歸有司故專命官以統之互相維制何可廢也遂止帝嘗謂執政曰官制將行欲新舊人兩用指御史大夫曰非司馬光不可王圭蔡確相顧失色圭憂甚不知所出確日上久欲收靈武公能任責則相位可保也圭喜謝之因薦俞充帥慶使上平西夏策其意以為既用兵深入必不召光雖召將不至已而光果不召以馮京為樞密使薛向孫固吕公著為副使向尋免向既在政地養威持重同列質以西北事多默不對會詔民畜馬向既奉命旋知民不便欲改議御史舒亶論其反覆無大臣體斥知潁州冬十一月朔日食辛酉四年春正月馮京罷以孫固知樞密院事吕公著韓縝同知院事京再執政初與王安石不合後為吕惠卿所傾中立不倚人服其操宋進士自鄉舉至廷試皆第一者才三人王曽宋庠為名宰相京為名執政不愧科名云廣義小人之在朝勢必不容於君子書曰若苗之有莠若粟之有粃必見鋤治簸揚弗至於罷去不已也雖然安石惠卿不能容京於當時而千萬世士君子之公論自能容京也曽何損於京哉三月章惇有罪免以張璪參知政事朱服為御史惇密使客達意於服為服所白惇父俞又強占民田民遮訴惇惇繫之開封事併聞遂免知蔡州夏四月築河隄自大名至於瀛州河復大決澶州小吳掃詔都水監丞李立之經畫以聞帝謂輔臣曰河之為患久矣後世以事治水故常有礙夫水之趨下乃其性也如能順水所向遷徙城邑以避之復有何患已而立之言河流自乾寧軍至劈地口入海宜自北京至瀛州分立東西隄五十九掃詔從之立之在熙寧初已主立隄今竟行其言大抵熙寧專欲導河東流閉北流元豐以後因河決而北議者始欲復禹故迹帝愛惜民力思順水性而水官難其人王安石力主程昉范子淵二人尤以河事自任然糜費財用卒無成功發明河決之患雖因隄防不固然亦天變所致為神宗計者但當修政令明賞罰革弊事崇天道自然天意可回河不為害蓋君心無形之隄防人力有形之隄防無形之隄防既修有形之隄防自固茍忽無形之隄防惟事有形之隄防則雖糜費財用何足恃乎故綱目據事直書非所以豫之實所以譏之也五月立晉程嬰公孫杵臼廟於絳州報其存趙孤也追封嬰成信侯杵臼忠智侯發明程嬰杵臼一存孤一死節是誠晉之義士也蓋褒一善所以勸千萬人之不善者貶一惡所以戒千萬人之為惡者國語曰夫聖王之制祀也法施於民則祀之以死勤事則祀之以勞定國則祀之能禦大災則祀之能捍大患則祀之非是族也不在祀典神宗憫其忠節贈爵立廟可謂得其正矣神宗紛紛制作無一中禮獨此舉差協輿情故特表而出之所以深豫之爾廣義嗚呼自開闢以來忠義之士不為不少然能如二公之能以死生忠義把握如掌中之物千停萬當無毫髮爽者蓋於二公之外不多見焉夫何自漢魏晉唐以來未聞其有封報之典至是忽有此舉不亦偉哉况乎所封之銜既明且切之于册足以見神宗激勸忠義之典嗚呼休哉夏人幽其主秉常秋七月詔李憲會陜西河東五路之師討之知慶州俞充知帝有用兵意屢請西伐又言諜報云夏將李清本秦人説秉常以河南地來歸秉常母梁氏知之遂誅清奪秉常政而幽之宜興師問罪此千載一時也帝然之遂詔熙河經制李憲等大舉征夏而召鄜延副總管种諤入對諤至大言曰夏國無人秉常儒子往持其臂以來耳帝壯之乃決意西伐方議出師孫固諫曰舉兵易解禍難不可帝曰夏有釁不取則為遼人所有不可失也固曰必不得已請聲其罪薄伐之分裂其地使其酋長自守帝笑曰此真酈生之説爾時執政有言便當直渡河不可留行固曰然則孰為陛下任此者帝曰朕已屬李憲固曰伐國大事而使宦者為之則士大夫孰肯為用帝不悅他日固又曰今五路進師而無大帥就使成功兵必為亂帝諭以無其人吕公著進曰問罪之師當先擇帥既無其人曷若已之固曰公著言是也帝不聽竟命李憲出熙河种諤出鄜延高遵裕出環慶劉昌祚出涇原王中正出河東分道並進又詔吐蕃首領棟戬集兵會伐發明春秋之法凡亂臣賊子鄰國不能討則罪鄰國天子不能討則罪天子外邦不能討則罪外邦所以然者無非急欲討賊為天下法耳秉常不能立國而為母氏所幽禁暴誅亂王者義兵神宗能詔討之則天子之職全矣故特以討豫之然伐國大事而使宦者主之甚失國體此荀林父所以有邲之敗也綱目變文書討者以見師出有名故不計其人之美惡而亦豫焉所以見君子之心急於討賊云爾至於以宦者為將夫豈無其失哉詔定選格太祖設官分職多襲五代之制凡入仕有貢舉奏蔭攝署流外從軍五等吏部銓惟注擬州縣官幕職帝自即位欲更制度詔內外官司舉官悉罷又用判吏部蘇頌議凡文武銓注之法悉歸選部分左右曹掌之初中書有堂選百司群縣有奏舉皆不𨽻於有司王安石以中書總庶務選徒留滯不能精擇言於帝欲罷堂選曾公亮執不可而止至是既罷內外長吏舉官法堂選亦廢韓存寶棄市步軍都虞侯林廣擊瀘夷破之存寶坐逗遛無功斬於瀘州以廣代將乞弟復送欵帝以其反覆無降意督廣進兵廣遂敗乞弟於納江破樂共城斬首二千級乞弟遁廣帥兵深入自發納江即入叢箐無日不雨雪兵夫疾病死亡不可勝計往往取僵尸臠割食之過鴉飛不到山至歸徠州竟不得乞弟而還時朝廷懲安南無功方大舉伐夏故誅存寶以令諸將發明凡書棄市罪詞也存寶既承王命逗遛無功誠有罪矣故直書棄市以深絶之然何以不書有罪神宗喜事邉功無故擅興師旅經制瀘夷則其窮兵黷武之過不能無矣故不書有罪恕存寶也恕存寶乃所以責神宗也不然何以下書林廣擊瀘夷破之而不曰討乎權其輕重而書之於册此綱目所以為是非之斷案也九月李憲復蘭州憲總熙秦七軍及棟戩兵三萬敗夏人于西市新城復襲女遮谷破之遂復古蘭州城之請建為帥府种諤克米脂城諤率鄜延兵出綏德城以攻米脂夏人八萬來救諤與戰於無定川敗之遂克米脂冬十月髙遵裕復清遠軍內侍王中正以河東兵入宥州中正帥兵出麟州度無定河循水北行地皆沙濕士馬多陷沒糗糧不能繼又耻無功遂入於宥州時夏人棄城走河北城中遺民百餘家中正遂屠之掠其牛馬以充食發明春秋之法以者不以者也入者逆而不順之詞然前皆書復書克而此特書入者徇名責實也能以衆正可為王師中正既入宥州屠民掠貨是亦盜賊而已矣非王者問罪之師也是以行師之道當得老成之人茍使君子用事而又使小人參之雖貞亦凶矣曰入宥州貶而為盜也然特書內侍者所以見閽寺之不足任因以譏神宗用人之非耳變文直書為後戒也十一月朔日食高遵裕等兵潰李憲不至靈州而還劉昌祚率番漢兵五萬受遵裕節制令兩路合軍以進入境而慶兵不至昌祚次瑪伊克隘遇夏衆十萬扼險大破之遂薄靈州城兵幾入門遵裕嫉其功馳使止之昌祚按甲不敢進遵裕至圍城十八日不能下夏人決黃河七級渠以灌營復鈔絶餉道士卒凍溺死遂潰而還餘軍才萬三千而已夏人躡之復敗焉昌祚亦還涇原种諤留千人守米脂而自帥大衆進攻銀石夏州遂破石堡城進至夏州駐軍索家平會大校劉歸仁以衆潰而軍食又乏復值大雪乃引還死者不可勝計入塞者僅三萬人王中正自宥州行至奈王井糧盡士卒死者二萬人亦引退初詔憲帥五路兵直趨興靈憲總師東上營於天都山下焚夏之南牟內殿並其館庫追其統軍日木多凌丹敗之次於葫蘆河遂班師時五路兵皆至靈州獨憲不至發明昔程頥子傳易之詞曰任將授師之道當以長子帥師二在下而為師之主長子也若以弟子衆主之則所為雖正亦凶也自古任將不專而主覆敗者如晉荀林父邲之戰唐郭子儀相州之敗是也遵裕等妬功無策李憲等因人成事皆有罪也故書高遵裕等兵潰言兵不能潰乃遵裕等自潰之耳是時諸將皆至靈州獨憲不至故又書李憲不至靈州而還深罪之也此輕重之權衡耳以吳居厚為京東都轉運使居厚初為武安節度椎官奉行新法盡力核間田以均給梅山徭計勞得補司農官屬轉提舉河北常平遂擢京東轉運副使時方興鹽鐵居厚精心計籠絡鈎稽收羡息錢數百萬即萊蕪利國二冶官自鑄錢以能擢都轉運使議行河北鹽法搜剔無遺居厚起州縣凡流徒以言利得幸由是嗜進之士從風而靡壬戌五年春正月貶髙遵裕等官以李憲為涇原經略安撫制置使初夏人聞朝廷大舉母梁氏問策於廷諸將少者盡請戰一老將獨曰但堅壁清野縱其深入聚徑兵於靈夏而遣輕騎抄絶其餽連可不戰而困也梁氏從之師卒無功而還帝曰朕始以孫固言為迂今悔無及矣至是計敗師罪高遵裕責授郢州團練副使本州安置种諤王中正劉昌祚並降官憲欲以開蘭會邀功弭責孫固曰兵法後期者斬况諸路皆至而憲獨不行不可赦帝以憲有功但令詰其擅還之由憲以餽餉不接為辭釋勿誅憲復上再舉之策詔以為涇原經略安撫制置使知蘭州發明荀况曰公生明偏生暗王者之論無德不貴無能不官無功不賞無罪不罰朝無幸臣民無幸生遵裕等失律無功法固當黜然李憲既為首將衆至靈州違命不往推原其心厥罪已甚而反置之不問不惟不問而又加之以官則是神宗知有李憲而不知有國法也憲乃無知刑人而使之經略使之安撫使之制置涇原之事在其掌握是豈建官惟賢之義哉據事詳書其失自見廣義李文靖嘗以土木甲兵之事為憂至是驗矣使神宗早從孫固之言必無今日之悔秦誓曰尚猷詢兹黃髮則罔所愆為國者可以鑑矣夏四月朔日食御史中丞舒亶有罪免亶舉劾多私氣焰薰灼見者側目至是坐詐為録目奪兩秩勒停遠近稱快發明御史中丞乃天子耳目之司激濁揚清固其職也説苑曰人臣之術順從而復命無所敢專義不茍合位不茍尊必有益於國必有補於君亶舉劾多私氣焰薰灼是亦小人之流耳今坐詐偽奪秩勒停不亦宜乎故綱目具官而書有罪深絶之也以王圭為尚書左僕射兼門下侍郎蔡確為尚書右僕射兼中書侍郎章惇為門下侍郎張璪為中書侍郎蒲宗孟為尚書左丞王安禮為尚書右丞官制成改同中書門下平章事為左右僕射參知政事為門下中書侍郎尚書左右丞初議官制蓋倣唐六典事無大小並中書取旨門下審覆尚書受而行之三省分班奏事並歸中書確説圭曰公久在相位必得中書令圭信不疑確乃言於帝曰三省長官位髙不須置令但令左右僕射分兼兩省侍郎足矣帝以為然故確名為次相實顓大政圭以左僕射兼門下拱手而已帝雖以次敘相圭確然不加禮重屢因微失罰金每罰輒門謝宰相罰金門謝前此未有人皆耻之確既相屢興羅織之獄縉紳士大夫重足而立富弼在洛上書確小人不宜大用帝不從帝嘗語輔臣有無人才之歎宗孟率爾對曰人才半為司馬光邪説所壞帝不語直視久之曰蒲宗孟乃不取司馬光邪未論别事只辭樞密一節朕自即位以來惟見此一人他人則雖迫之使去亦不肯矣宗孟慚懼無以為容時李憲乞再舉伐夏帝以訪輔臣王圭對曰向所患者用不足朝廷今捐錢鈔五百萬緡以供軍食有餘矣安禮曰鈔不可噉必變而為錢錢又變為芻粟今距出征之期才兩月安能集事帝曰李憲以為已有備彼宦者能如是卿等獨無意乎唐平淮蔡唯裴度謀議與主同今乃不出公卿而出於閹寺朕甚耻之安禮曰淮西三州爾有裴度之謀李光顔李訴之將然猶引天下之兵力歷嵗而後定今夏氏之強非淮蔡比憲才非度匹諸將非有光顔訴輩臣懼無以副聖志也發明王圭蔡確皆姦險之徒而使為宰相章惇張璪皆邪佞之黨而使為參政蒲宗孟之徒頑鈍無恥亦居執政之官可謂極一時之遴選者矣天下何由而不亂乎君心何由而不蠧乎書曰元首叢脞哉股肱惰哉萬事墮哉者是已神宗即位一十五載其所退者皆一時之君子所進者皆一時之小人浸淫而至於哲徽二世壞亂極矣豈非端本澄源之大幾耶大書特書深譏之耳廣義此正小人彚征之時也安禮獨如宋王何以曾鞏為中書舍人鞏能文章為歐陽修所重帝深知其才命充史館修撰專典史事至是命為中書舍人時自三省百職事選授一新除書日至十數人人舉其職於訓辭典約而盡未幾卒吕公著嘗言於帝曰鞏為人行義不如政事政事不如文章以是不大用吕公著罷秋八月詔嵗以四孟月朝獻景靈宫帝以先朝御容多寓寺觀乃作十一殿于景靈宫凡神御皆迎入纍朝文臣執政官武臣節度使以上並圖形於兩廡凡執政官除拜赴宮恭謝其後南郊先詣宮行薦享禮並如太廟廣義春祀夏禴秋嘗冬蒸與夫大禘之禮自有太廟常典神宗此舉其諸謂之何哉書曰黷於祭祀時謂勿欽其神宗之謂乎給事中徐禧護兵城永樂种諤西討不能如志知延州沈括欲盡城橫山下瞰平夏使虜不得絶磧為冦諤遂上其䇿於朝且言興功當自銀州始帝以為然遣給事中徐禧內侍李舜舉往鄜延議之舜舉退詣執政王圭迎謂曰朝廷以邉事屬押班及李留後無西顧之憂矣舜舉曰四郊多壘卿大夫之辱也相公當國而以邉事屬二內臣可乎內臣止冝供禁廷灑掃之職爾豈可當將帥之任耶聞者代圭發慙禧至鄜延上言銀州雖據明堂川無定河之會而故城東南已為河水所吞其西北又阻天塹不如永樂之形勢險厄請先城永樂永樂依山無水泉种諤極言其不可帝從禧議乃詔禧護諸將往城之而命括移府並塞總兵為援陜西轉運判官李稷主餽銄禧以諤跋扈奏留諤守延州自率諸將往築十四日而成距故銀州治二十五里賜名銀州寨禧等退還米脂以兵萬人屬曲珍守之發明凡書城者完舊也築者創始也城者禦暴保民之所而城有制役有時魯嘗城費城郈城中邱城郎春秋譏之神宗惑徐禧之妄議護兵城之尋又失焉則亦何益之有况城以秋而收斂之時廢財妨農務而非時矣失其時制妄興大作無愛養斯民之意者其罪之輕重見矣九月夏人陷永樂徐禧等敗死禧等既城去九日夏人以數千騎來攻曲珍使報禧禧遂與李舜舉李稷往援之留沈括守米脂比抵永樂夏人傾國而至大將高永能請及其未陳擊之禧曰爾何知王師不鼓不成列執刀自率士卒拒戰夏人益衆進薄城下珍兵陳於水際將士皆有懼色珍白禧曰今衆心已搖不可戰戰必敗請收兵入城禧曰君為大將奈何遇敵先自退耶乃以七萬人陳於城下夏人縱鐵騎渡河珍曰此鐵鷂子軍也當其半濟擊之乃可以逞得地則其鋒不可當也禧不從鐵騎既濟震蕩衝突大衆繼之珍鋭卒敗奔還蹂後陳夏人乘之珍衆大潰珍收餘衆入城夏人圍之厚數里且據其水寨珍士卒晝夜血戰城中乏水已數日掘井不及泉渴死者十六七括與李憲援兵及饋餉皆為夏人所隔不得前种諤怨禧不遣救師城中大急會夜半大雨夏人環城急攻城遂陷禧舜舉稷永能皆為亂兵所害惟珍裸跣走免將校死者數百人喪士卒役夫二十餘萬夏人耀兵米脂城下而還自熙寧以來用兵得夏葭蘆吳保義合米脂浮圖塞門六堡而靈州永樂之役官軍熟羌義保死者六十萬人錢穀銀絹不可勝計事聞帝臨朝痛悼為之不食贈禧等官而貶括為均州團練副使隨州安置降珍為皇城使自靈武之敗秦晉困棘天下企望息兵而括諤進攻取之策禧素以邉事自任狂謀輕敵遂致覆敗自是帝始知邉臣不可倚信深自悔咎無意於西伐而夏人亦困敝矣初帝之遣禧也王安禮諫曰禧志大才疏必誤國事帝不聽及敗帝曰安禮每勸朕勿用兵少置獄蓋為是也發明不書死之而直書敗死貶之也師之六四曰師左次無咎未失常也春秋師次于郎次于召陵是已徐禧恃才妄作不能料敵卒以取敗遂使喪師失地身且不保是乃匹夫匹婦之為諒自經於溝瀆而英知之者矣茍信曲珍之謀全師入城徐圖進取則夏人必不如此猖獗王師必不如此挫衄焉孔子曰必也臨事而懼好謀而成詎不信哉禧死而不得以全節書者其以此耳廣義抑觀築永樂城者徐禧也陷永樂城者亦徐禧也今徐禧不度夏人來爭之勢惟邀築城永樂之功昔者子囊城郢尚爾取敗况永樂之懸居邉塞者乎嗚呼城永樂者是猶置羊牢於虎穴之傍也焉往而不被其吞陷哉神宗於禧輕信過聽而致喪師辱國之醜可謂噬臍無及矣故綱目書曰九月夏人陷永樂徐禧等敗死者以見永樂之城成於八月而九月即陷矣而徐禧敗死又所以見其敗其死冝也不然則當書曰徐禧死之此書法之所當辨也比而觀之其義見矣癸亥六年春二月夏人冦蘭州貶李憲為熙河都總管夏人數十萬圍蘭州已奪兩闋門鈐轄王文郁夜集死士七百餘人縋城擊走之未幾夏人復分道入冦亦多為諸路所敗中丞劉摯言熙河經略使李憲貪功生事一出欺罔避興靈會師之期頓兵以城蘭州遺患至今詔貶憲為熙河安撫經略都總管夏四月遼大雪平地丈餘馬死者十六七發明凡外災告則書所謂災者害及民物如水火兵戎之冦是也然此大雪耳何以書時當孟夏而大雪隨降則其異尤甚而與水火兵戎何殊焉天子於外夷有恤病救急之義則告為得禮而不可以不弔春秋四鄰同災許人不弔君子是以知許之先亡也凡志災見綱目有謹天戒恤民隱之心王者之事也與春秋書宋大水同義閏六月夏人復來修貢夏人亦敝於兵西南都統昴星嵬名濟移書示涇原劉昌祚乞通好如初昌祚以聞帝諭昌祚答之及入冦屢敗國用益竭乃遣謨箇咩迷乞遇來上表帝許之復詔陜西河東經略司其新復城寨徼循毋出二三里夏之歲賜悉如其舊未幾夏主上書乞還侵疆帝不許司徒韓公富弼卒遺表大略云陛下即位之初邪臣納説上誤聰明浸成禍患今上自輔臣下及多士畏禍圖利習成敝風去年永樂之役兵民死亡者數十萬今久戍未解百姓困窮豈悔過耻敗不思救禍之時乎天地至仁寧與羌夷校勝負願休兵息民使關陜之間稍遂生理兼陜西再團保甲州縣奉行勢侔星火人情惶駭不苦寢罷以綏懷之臣之所陳急於濟事若夫要道則在聖心所存與所用之人君子小人之辨爾弼早有公輔之望名聞夷狄遼使每至必問其出處安否臨事周悉不萬全不發當其敢言奮不顧身忠義之性老而彌篤家居一紀斯須未嘗忘朝廷訃聞贈太尉諡文忠發明弼厯仕三朝委身幹國忠義之性老而彌篤觀其所上遺表則為國憂民之心可見矣故卒而具其官爵者所以深嘉而亟豫之也秋七月孫固罷以韓縝知樞密院事安燾同知院事八月蒲宗孟免以王安禮李清臣為尚書左右丞御史論宗孟荒於酒色及繕治府舍過制故免九月朔日食冬十月遼耶律伊遜伏誅伊遜在興中府坐以禁物鬻人外國減死幽于萊州其黨耶律仁傑削爵為民至是伊遜復謀來奔及私藏兵甲事覺伏誅十一月太師文彥博致仕彥博自河南入朝帝嘉其輔立英宗而不伐其功加兩鎮節度使將行賜燕瓊林苑兩遣中使遺詩祖道當世榮之至是請老以太師致仕彥博之在河南也與冨弼等用白居易故事就弼第置酒相樂尚齒不尚官洛陽多名園古剎諸老鬚眉皓白衣冠甚偉都人常隨觀之已而圖形妙覺僧舍謂之洛陽耆英會司馬光年未六十以狄兼謨故事與焉發明凡書致仕豫知止也彥博厯仕三朝老於王事值斯之時弗克大用茍不致仕而去則不惟禍將及身抑且素餐之恥矣君子其可不知幾乎特書致仕蓋豫之也以陸師閔提舉成都茶場李稷既死以師閔代其任𣙜利尤刻稅息倍於稷十二月户部獻今嵗民數時天下凡二十三路東南際海西盡巴僰北極三關東西六千四百八十五里南北萬一千六百二十里天下主客户一千七百二十一萬一千七百一十三發明大中祥符七年户部奏户九百五萬五千七百二十九口二千一百九十七萬六千九百六十五至是所奏之數戶僅一千七百二十一萬一千七百一十三而口不與焉然自甲寅至癸亥一百十五年而所增者一萬九千四十一户神宗恃其戶口之數窮奢極欲自謂長享太平不料禍出目前生民塗炭較諸天寶不能三分之二然則有天下者豈可不知所戒哉甲子七年春正月夏人大舉冦蘭州初李憲以夏人數至蘭州河外而翺翔不進意必大舉乃增城守之備至是果大舉入冦步騎號八十萬圍蘭州意在必取督衆急攻矢如雨雹雲梯革洞百道並進凡十盡夜不充糧盡引去尋復冦延州順德軍定西城及熙河諸寨夏五月詔以孟軻配食孔子先是判國子監常秩請立孟軻楊雄像於廟庭仍賜爵號又請追尊孔子為帝下兩制禮官詳議以為非是而止知鄆州曾孝寬復請加封孟子乃詔封為鄒國公至是復詔孟子與顔子並配孔子又追封荀况為蘭陵伯揚雄為成都伯韓愈為昌黎伯從祀廟庭發明揚雄曰古者楊墨塞路孟子辭而闢之廓如也夫楊墨行正道廢孟子雖賢聖不得位空言無施雖切何補然賴其言而今之學者尚知宗孔氏崇仁義貴王賤霸而已然向無孟氏則皆服左衽而言侏離矣故韓愈嘗推尊孟氏以為功不在禹下者為此也自孔子既沒天生孟氏以續斯道之傳斯民之類不至糜爛絶滅者孟氏之功用也神宗惑於邪慝所為不正其視儒道不啻枘鑿之不相入然以孟軻配食孔子乃見於弊政倥偬之日故綱目特筆豫之亦以見天理之在人心自有不可得而泯沒者神宗紛紛制作獨此為美故特表而出之所以不沒其善也廣義嗚呼孟軻配享其舉當矣然封荀况揚雄無乃不可乎彼荀况嘗曰亂天下者必孟子子思也其於孟氏之道同乎否乎揚雄賦反騷以詆屈原作美新以頌王莽是皆叛孔孟而反正道者也以二子從祀孔廟不亦謬乎秋七月王安禮罷冬十二月端明殿學士司馬光上資治通鑑初光約戰國至秦二世如左氏體為通志以進英宗悅之命續其事就崇文殿開局許自選官屬得借龍圖天章三館祕閣書籍給御府筆墨繒帛及御前錢以供果餌以內臣為承受光遂與劉攽劉恕范祖禹及子康編集帝即位賜名資治通鑑製序文賜之會光出知永興軍以衰病乞間乃差判西京留司御史臺及提舉崇福宫前後六任聽以書局自隨光於是遍閲舊史旁采小説抉摘幽隱較計毫釐上起周威烈王二十三年下終五代又略舉事目年經國緯以備檢尋為目録又參考羣書評其同異俾歸一塗為考異合三百五十四卷厯十九年而成至是上之詔以光為資政殿學士降詔奬諭發明治鑑乃光等之自修總三百五十四卷厯十九年而成事非不備而功非不久亦所以寓一王之法存褒貶之功誠有天下者之所宜閲也光以是上之則庶幾有愛君之心耳其與上會計録祥瑞圖者豈不異哉故綱目直書以著其美乙丑八年春正月帝有疾三月詔立延安郡王傭為皇太子賜名煦皇太后權同聽政帝疾甚羣臣請立皇太子及請皇太后高氏權同聽政許之三月甲午朔立傭為皇太子賜名煦先是岐王皓嘉王頵日問起居太后既垂簾命二王毋輒入且隂敇中人梁惟簡妻製十嵗兒一黃袍懷以來蓋密為踐祚倉卒備也初太子之未立也職方員外郎邢恕與蔡確成謀密語太后之侄髙公繪公紀曰上疾不可諱延安糼沖宜早有定論岐嘉皆賢王也公繪驚曰此何言君欲禍吾家邪恕知計不行反宣言太后屬意岐王而與王圭表裏導確約圭入問疾陽鉤致圭語使知開封府蔡京伏劍士於外須圭小持異則執而誅之既而圭言上自有子定議立延安恕益無所施及太子已立猶與確自謂有定策功傳播其語於朝發明是時神宗寢疾羣姦謀變向非哲后在內維持調護則儲位易矣是以有天下者當亟立太子以正國本國本正而天下罔不正矣故綱目特書於策所以深幸之也帝崩太子即位赦帝崩年三十八太子即位生十年矣史臣曰神宗孝友謙抑敬畏輔相不事遊幸勵精圖治將大有為未幾王安石入相安石為人悻悻自信知祖宗志吞幽薊而數敗兵帝奮然將雪數世之耻未有所當遂以偏見曲學起而乘之天下洶洶騷動帝終不覺悟方斷然廢逐元老擯斥諫士致祖宗之良法美意變壞幾盡自是邪佞日進人心日離禍亂日起惜哉尊皇太后曰太皇太后皇后曰皇太后德妃朱氏曰皇太妃德妃帝生母也太皇太后既聽政散遣修京城役夫止造軍器及禁庭工技出近侍尤無狀者戒中外無苛斂寬民間保戶馬事由中旨王圭等弗預知也蔡確恩求媚於太后以自固太后從父高遵裕坐西征失律抵罪因上言乞復遵裕官后曰遵裕靈武之役塗炭百萬先帝中夜得報起環榻而行徹旦不能寐自是驚悸馴致大故禍由遵裕得免刑誅幸矣先帝肉未冷吾何敢顧私恩而違天下公議乎確悚栗而退廣義高遵裕太皇太后從父至親也觀其拒蔡確之請非其心之至公至明者能之乎且垂簾之始政事一新俱有可觀而神宗之不逮逺矣史稱其女中堯舜信哉此亦宋之大幸也罷京城邏卒及免行錢廢濬河司蠲逋賦尋詔寬民力有司或致廢格者監司御史紏劾之司馬光自洛入臨夏五月詔求直言光居洛十五年天下以為真宰相田夫野老皆號為司馬相公婦人女子亦知其為君實也神宗崩光欲入臨避嫌不敢時程皓在洛勸光行乃從之衛士見光皆以手加額曰此司馬相公也所至民遮道聚觀馬至不得行曰公無歸洛留相天子活百姓光懼亟還太后遣內侍梁惟簡勞光問為政所當先光請開言路詔榜朝堂而大臣有不悅者設六語云若隂有所懷犯非其分或扇搖機事之重或迎合已行之令上以僥幸希進下以眩惑流俗若此者罰無赦后復命示光光曰此非求諫乃拒諫也人臣惟不言言則入六事矣乃具論其情改詔行之於是上封事者千數發明衰之極者盛之漸否之甚者泰之基易曰有命無咎疇離祉此之謂也時民苦弊政天下疲勞其曰罷京城邏卒罷免行錢廢濬河司蠲逋賦求直言皆當時之所急者今兹一舉而恤民求言之意已在其中誠傾否為泰撥亂反正之宏綱耳其後新法漸革正人漸用生民既瘁而復蘇天下已傷而復愈蓋由太后之為母也故特詳書以著其美焉召程皓為宗正寺丞未至卒皓嘗曰新法之行乃吾黨激成之當時自愧不能以誠感上心遂致今日之禍豈可獨罪王安石也至是召為宗正丞未行而卒年五十四皓自十五六時與弟頥聞汝南周敦頥論道遂厭科舉之業慨然有求道之志未知其要泛濫於諸家出入於老釋者幾十年返求諸六經而後得之資性過人充養有道純粹之氣盎於面背門人交友從之嵗久未嘗見其忿厲之容遇事優為雖當倉卒不動聲色深有意經濟方召用遽卒士大夫識與不識莫不哀傷焉文彥博采衆論題其墓曰明道先生弟頥序之曰周公沒聖人之道不行孟軻死聖人之學不傳道不行百世無善治學不傳千載無真儒無善治士猶得以明夫善治之道以淑諸人以傳諸後無真儒則天下貿貿焉莫知所之人欲肆而天理滅矣先生生乎千百年之後得不傳之學於遺經以興起斯文為己任辨異端闢邪説使聖人之道煥然復明於世蓋自孟子之後一人而已然學者於道不知所向則孰知斯人之為功不知所至則孰知斯名之稱情也哉發明書召程皓喜之也書未至卒惜之也蓋自周公沒聖人之道不行孟軻死聖人之學不傳程子得不傳之學於遺經以興起斯文為己任辨異端闢邪説使聖人之道煥然復明於世蓋自孟子之後一人而已皓於神宗之朝弗果大用時方知其名而召用之而皓已告終矣豈非斯世斯民之大幾乎使天假之以年則其道大行而民被其澤不致邪説誣民充塞仁義焉是以君子深為皓惜而又為斯世惜也悲夫廣義書曰未至卒者傷吾道之不幸也吳居厚有罪貶知廬州居厚在京東最苛刻劇盜王沖因民怨聚衆數千欲乘其行部至徐篡取投諸鐵冶中居厚聞之間道遁去至是以言者論降知廬州尋謫為成州團練使黃州安置王圭卒圭以文學見推流輩然自執政至宰相凡十六年無所建明率道諛將順當時目為三旨相公以其上殿進呈云取聖旨上可否訖云領聖旨退諭稟事者云已得聖旨也發明王圭為相無所建明率道諛將順而已豈非小人之魁桀乎故卒而削去其官以示貶以蔡確韓縝為尚書左右僕射兼門下中書侍郎章惇知樞密院事以司馬光為門下侍郎詔起光知陳州過闕留為門下侍郎既而蘇軾自登州召還緣道人相聚號呼曰寄謝司馬相公毋去朝廷厚自愛以活我是時天下之民引領拭目以觀新政而議者猶謂三年無改於父之道光曰先帝之法其善者雖百世不可變也若王安石吕惠卿所建為天下害者改之當如救焚拯溺况太皇太后以母改子非子改父也於是衆議少止羅從彥曰孔子曰三年無改於父之道此孝子居喪志存父在之道不必主事而言也况當易危為安易亂為治之時速則濟緩則不及改之乃所以為孝也天子之孝在於保天下光不即理言之乃曰以母改子非子改父以此遏衆議則失之矣其後至紹聖時排陷忠良以害於治豈亦光有以召之邪六月賜楚州孝子徐積粟帛積事親孝旦夕必冠帶定省從胡瑗學所居一室寒一裘啜粟飲水雖瑗遺以食亦不受以父名石至終身不用石器行遇石則避而不踐中年屏居窮里而四方事無不知嘗借人書經夕還之借者紿言書中有金葉積賣衣償之不與辨後以近臣薦授楚州教授每升堂訓諸生曰諸生欲為君子而使勞己之力費己之財如此而不為君子猶可也不勞己之力不費己之財諸君何不為君子鄉人賤之父母惡之如此而不為君子猶可也鄉人榮之父母欲之諸君何不為君子聞者敬服及卒賜諡節孝發明治天下者褒忠臣所以勸民忠褒孝子所以勸民孝褒義士所以勸民義褒節婦所以勸民節此皆為國之善政風化之大間不可不講求之也徐積事親誠孝人無間言今能賜以粟帛則其褒孝之心極其切矣天下之人豈不觀感而興起於孝乎大書特書深豫之也廣義徐積仕者也何不銜之而稱其孝子乎曰銜之不足貴也稱孝子者乃所以貴之也學者味之其義得矣秋七月以吕公著為尚書左丞公著知揚州被召侍讀太后遣使迎問所欲言公著曰先帝本意以寬省民力為先而建議者以變法侵民為務與己異者一切斥去故日久而弊愈深法行而民愈困誠得中正之士講求天下之利病協力而為之冝不難矣既至拜左丞公著既居政府與司馬光同心輔政推本先帝之志凡欲革而未暇與革而未定者一一舉行之民歡呼鼓舞稱便罷保甲法先是司馬光言於太后曰兵出民間雖云古法然古者八百家才出甲士三人步卒七十二人間民甚多三時務農一時講武不妨稼穡自兩司馬以上皆選賢士大夫為之無侵漁之患故卒乘輯睦動則有功今籍鄉村之民二丁取一授以弓弩教之戰陳農民半為兵也三四年來又令三路置都教場無問四時每五日一教一丁在閲一丁供送雖云五日而保正長以泥堋除草為名聚之教場得賂則縱否則留之是三路耕耘收穫稼穡之事幾盡廢也至是復力言其公私勞擾有害無益遂詔罷之廣義溫公之罷新法所謂拯溺救焚不足以喻其快人心也使公之誠未信於上又何以致上之聽信如此哉易曰未占有孚溫公有焉冬十一月復以鮮于侁為京東轉運使熙寧末侁已嘗為京東轉運使至是居厚貶復用之司馬光語人曰今復以子駿為轉運使誠非所冝然朝廷欲救東土之敝非子駿不可此一路福星也安得百子駿布在天下乎侁既至奏罷萊蕪利國兩鐵冶又奏海鹽依河北通商民大悅葬永裕陵罷方田法十二月罷市易法貶吕嘉問知淮陽軍言者交論市易之患被於天下本錢無慮千二百萬緡率二分其息十有五年之間子本當數倍今乃僅足本錢蓋買物入官未轉售而先計息取償至於物貨苦惡上下相蒙虧折日多空有虛名而已監察御史韓川論市易以為雖曰平均物直而其實不免貨交取利就使有獲尚不可為况所獲不如所亡願趣罷其法於是詔罷市易而削前提舉市易光祿卿吕嘉問三秩貶知淮陽軍其黨皆降黜罷保馬法發明於戲民之憔悴於虐政可謂極其至矣今能於保甲方田市易保馬之法次第而罷之其革故鼎新為可見焉殆見天下之疾首蹙額者皆變為含哺鼓腹之俗耳茍或哲宗不改賢母之政一遵祖宗之法天下何由而亂耶惜乎哲宗不足以語此易曰山下有風蠱君子以振民育德此之謂也綱目備書皆喜而豫之之詞耳起居舍人邢恕有罪貶知隨州恕博貫經籍能文章從程頥學司馬光吕公著王安石吳充皆重之然天資詭詐冒進與蔡確謀立岐王皓事既不成會王圭卒恕與確及章惇宣言太皇太后及吳充有異議賴確擁護而止自以為功至是復為髙公繪草奏乞尊崇朱太妃為高氏異日計太后怒黜知隨州發明直書有罪貶惡而絶之之詞也前書吳居厚有罪貶者居厚之在東京最為苛刻邢恕之在朝廷最為詭詐皆憸邪之小人也觀綱目之所書則其疾惡之旨嚴矣廣義抑觀高后聽政之初起司馬光吕公著程皓貶嘉問邢恕罷保甲團教方田市易養馬諸法皆所以合天心而協人意者也孰謂女后當國而無足稱者哉御批續資治通鑑綱目卷七
