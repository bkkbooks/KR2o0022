body:
  text: 欽定四庫全書御批續資治通鑑綱目卷五起甲申宋仁宗慶厯四年盡癸卯宋仁宗嘉祐八年凡二十年甲申四年春正月帝復御經筵自元昊反罷進講崇政殿説書趙師民言帝王治經與品庶異不獨玩空文占古語也今方外小有事臣等即不復進見是以為先王遺籍可以講無事之朝不足贊有為之世臣愚以為過矣又獻勸講針帝嘉納之於是復命曾公亮等講讀經史嘗謂公亮等曰卿等宿儒博學多所發明朕雖盛暑亦未嘗倦但恐卿等勞爾發明人主不可一日不學仁宗因西鄙多故遂罷進講經筵久曠于兹有年昔漢光武受命中興東西誅戰不遑寧處而且投戈講藝息馬論道孝明帝庶政萬機無不簡心而垂情古典遊意經義兹以西方小警久廢進講之規失之甚矣蓋自即位之初書御經筵至是垂二十年僅克再見豈不深可惜哉故書復御既喜之而又譏之也荆王元儼卒元儼太宗第八子廣顙豐頥嚴毅不可犯天下崇憚之名聞外夷呼為八大王遼人入使必問王安否及所在莊獻臨朝自以屬尊望重恐為太后所忌深自沈晦既有疾帝親視之屛人與語所對皆忠言至是卒有司以年嵗不利財用方困請緩葬期范仲淹言荆王太宗愛子真宗愛弟屢被讒惑陛下仁聖力能保全豈忍送葬之際却惜財利而廢典禮請賜內藏庫金帛備葬事帝從之發眀書曰荆王元儼卒者為天下得人之惜也三月詔天下州縣立學行科舉新法時范仲淹意欲復古勸學數言興學校本行實詔近臣議於是宋祁等奏教不本於學校士不察於鄉里則不能核名實有司束以聲病學者専於記誦則不足盡人材參考衆説擇其便于今者莫若使士皆土著而教之於學校然後州縣察其履行則學者修飭矣先策論則文詞者留心於治亂矣簡程式則閎博者得以馳騁矣問大義則執經者不専於記誦矣帝從之乃詔天下皆立學本道使者選部屬官為教授員不足取於鄉里宿學有道業者士須在學三百日乃聽預秋試舊嘗克試者百日而止試于州者令相保任有匿服刑虧行冒名等禁三場先策次論次詩賦通考為去取而罷帖經墨義士通經術願對大義者試十道廣義分注載宋祁之論即三代取士之法備書于册其美可知契丹黨項諸部叛附于夏元昊侵黨項契丹遣使讓之元昊不聽黨項等部及夾山部若岱爾族八百户與山西部族節度使庫哩皆叛契丹降于元昊宜州蠻歐希範作亂討平之夏四月作太學五月帝謁孔子判國子監王拱辰田況王洙余靖等言漢太學二百四十房千八百室生徒三萬人唐學舍亦千二百間今取才養士之法盛矣而國子監才二百楹制度狹小不足以容詔以錫慶院為太學置內舍生二百人講殿既備帝謁孔子故事止肅揖帝特再拜賜直講孫復五品服初海陵人胡瑗為湖州教授訓人有法科條纎悉備具以身率先雖盛暑必公服坐堂上嚴師弟子之禮視諸生如其子弟諸生亦信愛如其父兄從之遊者常數百人時方尚詞賦湖學獨立經義治事齊以敦實學及興太學詔下湖州取其法著為令式發明善治天下者莫大乎育賢才而崇先哲育賢才則得人以資國家之用崇先哲則褒善以為斯道之倡此皆治天下之善政而王者之盛心焉仁宗自三月詔天下立學行科舉新法則育賢才之道著是月作太學謁孔子則崇先哲之義隆其所以培植國本振作斯文而為有宋盛德守文之主豈不從可見哉綱目特舉而備書之其豫之之意有在矣廣義書曰帝謁孔子所以著仁宗尊師重道之美契丹伐黨項夏人救之發明聲罪致討曰伐黨項契丹之藩服既書叛以正其罪於前復書伐以定其罪於後夏人納叛不為無罪故書救者非善詞也所以惡其助逆之非耳美惡不嫌同詞其義自見元昊復遣使來上表元昊遣使上誓表言兩失和好遂厯七年立誓自今願藏盟府其前日所掠將校民户各不復還自此有邉人逃亡亦毋得襲逐臣近以本國城寨進納朝廷其栲栲鐮刀南安承平故地及他邉境蕃漢所居乞畫中為界於內聽築城堡凡嵗賜銀綺絹茶二十五萬五千乞如常數臣不復以他相干乞頒誓詔蓋欲世世遵守永以為好儻君親之義不存或臣子之心渝變當使宗祀不永子孫罹殃帝遣使賜元昊詔曰俯閲來誓一皆如約時韓琦自陜西還與范仲淹並對言為今之䇿當以和好為權宜戰守為實務因畫和守戰三䇿又言北戎久強今乘元昊議和其勢愈重茍不大為之備禍未可量夫京師坦而無備若北戎一朝稱兵深入必促河朔重兵與之力戰彼戰勝則直趨澶淵若京城堅固戒河朔之兵勿與戰彼不得戰欲深入則前有堅城後有重兵必沮而自退退而邀之擊之皆可也故修京師非徒禦寇誠以伐深入之謀諌官余靖言王者守在四夷今無故而修京城是舍天下之大而為嬰城自守之計遂不果行發明書元昊遣使來上表則其歸欵之誠與前上書者異矣故恕其跋扈不恭之心而特書遣使所以嘉其悔過而進之也雖然元昊之來上表者非心服也力不瞻也時方有事於契丹苟不求和於宋則南北受敵自取敗亡耳故上一札之書以結中朝之好殊不知為緩兵之計也使宋室君臣茍能知此併力伐之安有西顧之憂哉惜乎不足以語此六月開寶寺塔火余靖上疏言五行之占本是災變宜戒懼以答天意而開有詔取舊瘞舍利入禁中竊恐巧佞之人推為靈異再圖營造廣事浮費以奉佛求福非天下所望也宜一塔不能自衛為火所毁況藉其福以庇於民哉發明開寶寺塔乃太宗所建以藏舍利者其淫名無謂莫此為甚厯朝因之而不能毁深可惜也大抵天地之間一義氣之周流開寶寺塔乃非義之建非義之建天必厭之故一夕大火焚燒俱盡豈不快哉凡人不能毁而天毁之者此類是也以范仲淹為陜西河東宣撫使初仲淹以忤吕夷簡放逐者數年及陜西用兵帝以其士望所屬拔用護邉及夷簡罷召還倚以為治中外想望其功業仲淹亦以天下為己任與富弼日夜謀慮興致太平然更張無漸規模闊大論者籍籍及按察使出多所舉劾衆心不悅任子之恩薄磨勘之法密僥幸者不便由是謗毁稍行先是石介奏記于弼責以行伊周之事夏竦怨介又欲因以傾弼等乃使女奴隂習介書久之習成遂改伊周曰伊霍且偽作介為弼撰廢立詔草飛語上聞帝雖不信而弼與仲淹恐懼不自安適聞契丹伐夏遂請行邉羅從彥曰小人之權幸可畏也以仁宗之英明急於圖治而富范等衄於讒間不果其志何耶古者人君立政立事君臣相與合心同謀明足以照之仁足以守之勇足以斷之為之不暴而持之以久故小人不得措其私權幸不得搖其成若慶厯之事鋭之於始而不究其終君臣之間毋乃有未至邪廣義文正功業不就豈文正之不幸耶仁宗之不幸也使得遂其初志則宋國不虛而契丹西夏不足平矣嗚呼惜哉京師旱蝗上謂輔臣曰方嵗旱而飛蝗百姓何罪罹此默禱上帝願歸咎朕躬余靖等言災異之來實由人事闕失今陛下既有引過之言逹於天地神祇伏乞必踐其言必行其實専聽斷攬威權號令信於人恩澤及於下則災異消和氣應矣發明書曰惟吉凶不僣在人惟天降災祥在德旱蝗雖由於天其實則在乎人茍能敬天恤民則旱不為災蝗不為厲反是則災異之害民必矣考之分注帝苦旱蝗憂及百姓默禱上帝願歸朕躬庶幾有恐懼修省之心矣故又曰慎乃儉德惟懷永圖仁宗其近之契丹初修國史秋七月大封宗室先是富弼言北人率以近親為名王將相以治國事掌兵柄今嵗荆王之薨識者憂之臣願陛下擇宗室中賢者數人封之內以藩屏王室外以威示四夷時祖宗之後未有封王爵者帝用弼議封秦王廷美子德文為東平王潤王元份子允讓為汝南王燕王德昭孫從藹為潁國公岐王德芳孫從照為安國公同時封王公者凡十人廣義封建重事也趙宋開國至此始封宗室不亦後乎孟子曰堯舜之仁不偏愛人急親賢也堯舜之知不偏愛物急先務也鄭公有焉契丹來告伐夏八月遣右正言余靖報之契丹主以夏援黨項之故徵諸道兵將討元昊遣使來告曰請為中國討賊慎無與和也時朝廷欲加元昊封册而契丹之使適至帝疑契丹與元昊同謀以見欺欲調發為備召羣臣議之富弼言契丹實有怨於元昊耳保無他也余靖言契丹挾詐不可輕許乃命靖致贐禮且覘其誠否而留夏國封册不發發明夷狄雖春秋所外者然能盡禮於中國則未嘗不進之如書荆人來聘之類是也契丹惡夏納叛將欲伐之又恐名義不正遣人來告則其尊中國之心可見矣因其來告遣使報之宋得體焉綱目有中國外邦交豫之者此類是也以富弼為河北宣撫使從弼請也弼及范仲淹既去石介不自安亦請外得濮州通判許公吕夷簡卒諡文靖自莊獻太后臨朝十餘年間天下晏然夷簡之力為多及西夏用師契丹求地夷簡選將命使二邉以寧獨建募萬勝軍加契丹嵗幣大為後日之患又成郭后之廢逐孔道輔范仲淹干外時論少之然所斥士旋復收用亦不終廢其於天下之事屈伸舒卷動有操術故當國最久雖數為言者所詆而帝眷倚不衰朱熹曰當許公用事之時其舉措不合衆心者多矣而又惡忠賢異巳必力排之逮其晚節知天下公議不可終拂又慮天下之事或至危亂而忠賢之排去者將起復用是以寧損故怨以為收之桑榆之計其慮患之意雖未必盡出於至公而補過之善天下實被其賜則與世之遂非長惡力戰天下之公議以貽患國家者相去逺矣發明夷簡輔相二紀得君専而行政久然其卒也何不具其官而獨存其爵蓋必有説焉自太后臨朝天下無事故其功也及募萬勝之軍加契丹之幣雖偷目前之安大為後日之患況以私忿而譛廢郭后惡直言而黜逐正人則是伐休休有容之量而愧是職亦多矣故削其官此豫而未盡豫之意也九月晏殊罷殊平居好賢及為相務進人材擢歐陽修等為諌官既而苦其論事煩數或面折之至是修出為河北都轉運使諌官奏留之殊獨不許孫甫蔡襄因上言殊為李宸妃碑不言生帝又役官兵治僦舍以規利乃降授工部尚書出知潁州殊剛簡清儉博學洽聞文章膽麗為世推重以杜衍同平章事兼樞密使賈昌朝為樞密使陳執中參知政事衍務裁僥幸每有內降率寢格不行積詔旨至十數輒納帝前帝嘗語歐陽修曰外人知杜衍封還內降邪凡有求於朕每以衍不可告之而止者多於所封還也執中自知青州召還諌官蔡襄孫甫等爭言執中剛愎不學若任以政天下不幸帝不聽諫官論不止乃命中使賫勑告即青州賜之明日諌官上殿帝作色迎謂之曰豈非論陳執中邪朕已召之矣乃不敢言發明分注載仁宗用陳執中之決則其拒諫不亦甚乎惡得賢契丹伐夏冬十月夏人誘而敗之契丹及夏平契丹主宗真親將騎兵十萬出金肅城遣弟重元將騎七千出南路樞密使蕭惠將兵六萬出北路三路濟河長驅入夏境四百里不見敵據德勝寺南壁以待惠與元昊戰于賀蘭山北敗之元昊見契丹兵盛乃請和退師十里請收叛黨以獻且進方物契丹主遣樞密副使蕭革迓之而進軍次于河曲元昊親率黨項三部以待罪契丹命革詰其納叛背盟之故賜之酒許其自新惠以為大軍既集宜加伐不可許和契丹主猶豫未決元昊以未得成言又退師三十里以候凡三退將百里每退必赭其地契丹馬無所食因許和元昊乃遷延以老之度其馬飢士疲因縱兵急攻惠營敗之乘勝攻南壁契丹主大敗從數騎走得免元昊入樞密使蕭孝友寨執駙馬蕭呼敦以去已而遣使歸其先所俘獲契丹亦遣所留夏使還之契丹主遂引兵還發明觀綱目所書則知契丹可謂勇而無謀者也而元昊則能勇而能怯者焉噫二國桀黠于當時有如此者仁宗雖欲髙枕得乎十一月詔戒朋黨相訐并戒按察恣為苛刻及文人肆言行怪者廣義國有朋黨非美名也揭而書之所以譏慶厯治亂邪正之雜揉耳君臣同心上下輯睦惡在其有朋黨哉契丹以雲州為西京雲州即雲中也契丹建為西京大同府於是契丹境內凡五京六州軍城百五十六縣二百九部族五千二屬國六十東至于海西至金山暨于流沙北至臚朐河南至白溝幅員萬里十二月册元昊為夏國主余靖使還知契丹已與夏和帝乃遣尚書員外郎張子奭克册禮使册元昊為夏國主仍賜對衣黃金帶銀鞍勒馬銀二萬兩絹二萬匹茶三萬斤册以漆書竹册籍以錦金塗銀印文曰夏國主印約稱臣奉正朔改所賜敕書為詔而不名許自置官屬使至京就驛貿賣宴坐朵殿使至其國相見用賔客禮置𣙜場於保安軍及髙平寨第不通青鹽命國子博士髙良夫等會夏人畫疆界然朝使往止留館宥州終不復至興靈而元昊帝其國中自若也發明宋以仁義為本而國勢恆病於不振何者以方興之師而不能克久疲之遼以全盛之師而不能制蕞爾之夏陵夷而至於宣靖建紹以後浸不足道也豈非積弱之勢有以致之耶昔孟子告齊宣王曰詩云王赫斯怒爰整其旅以遏徂莒以篤周祜以對于天下此文王之勇也書曰天降下民作之君作之師惟曰其助上帝寵之四方有罪無罪惟我在天下曷敢有越厥志一人衡行於天下武王恥之此武王之勇也是時元昊雖臣而稱帝自若所陷城邑不能復取而反贈以王爵賜以銀絹失策甚矣觀元昊不欲臣宋之意契丹請為討賊之言豈不見譏于外邦哉或者以元昊小醜不足與較嗚呼義當為而不為則過於弱義不當為而為之則失於強元昊父事宋朝臣事契丹則有輕宋之心在義之所當伐而不可逭者茍行姑息則是失國之體驕敵之情其如國法何哉此姑息元昊是非之斷也環州种世衡卒環原間敏珠爾密藏康努卜三族最大其北有二川交通西界宣撫使范仲淹議築古細腰城斷其路命世衡及知原州蔣偕董其事世衡時知環州方卧病檄至即將所部甲士晝夜興築城成而卒世衡善撫士卒得人死力教土人習弧矢以佐官軍吏民有謀某事辭某事者咸使之射從其中否而與奪之坐過失者亦用此得贖吏農工啇無不樂射在邉數年積毅通貨所至不煩縣官益兵增饋而武功自振夏戎聞屬羌不可誘土人皆善射乃不復以環為意及卒青澗及環人皆畫像祠之乙酉五年春正月罷杜衍范仲淹富弼以賈昌朝同平章事兼樞密使宋庠參知政事王貽永為樞密使吳育龐籍為副使仲淹弼既出宣撫攻者益衆二人在朝所為亦稍沮止衍獨左右之衍好薦引賢士而抑僥幸羣小咸怨衍壻蘇舜欽易簡子也能文章論議稍侵權貴時監進奏院循例祠神以伎樂娛賔集賢校理王益柔曙之子也於席上戲作傲歌御史中丞王拱辰聞之以二人皆仲淹所薦而舜欽又衍壻欲因是傾衍及仲淹乃諷御史魚周詢劉元瑜舉劾其事拱辰及張方平列狀請誅益柔章得象無所可否賈昌朝隂主之韓琦言于帝曰益柔狂語何足深計方平等皆陛下近臣今西陲用兵大事何限俱不為陛下論列而同狀攻一王益柔此其意可見矣帝感悟乃止黜益柔監復州酒稅而除舜欽名同席被斥者十餘人皆知名之士拱辰喜曰吾一舉網盡矣舜欽既得罪衍由是不安求去不許會諫官錢明逸論仲淹弼更張綱紀紛擾國經凡所推薦多挾朋黨陳執中復譛衍庇二人帝不悅遂併黜之衍罷知充州仲淹知邠州弼知鄆州衍清介有大節其去也君子惜之發明禮曰為人君者謹其好惡而已矣其臣果忠耶雖有浮言而勿去其臣果佞耶雖有譽言而必去斯得好惡之公也今杜衍等因羣吠紛紜同日罷職然三人素著忠直仁宗所目擊者而且信讒擯棄茍平日所不知者其能免於黜逐哉綱目不書杜衍等罷而書罷杜衍等其義可見耳吁廣義仲淹之服西夏富弼之使契丹其豐功偉績豈惟當時之罕及亦後世之所難能也􅎣何仁宗一聽讒人而遽罷二公耶況乎二公無罪可徵特指其與杜祁公為朋比而去之耳意若仁宗者可謂自壞其萬里長城者也其不智孰甚焉罷磨勘蔭子新法三月罷樞密副使韓琦范仲淹富弼罷去琦不能獨居上疏辨析且言近日臣僚多務攻擊忠良取抉私忿不報初陜西四路總管鄭戩遣靜邉寨主劉滬著作佐郎董士亷城水洛以通秦渭援兵知渭州尹洙以為前此屢困於賊者正由城寨多而兵勢分也今又益城不可奏罷其役會戩罷而滬等督役如故洙不平以張忠代之滬不受代洙乃諭裨將狄青往械滬及士亷下吏而罷水洛之役戩論奏不已琦是洙而朝議右戩竟徙洙知慶州釋滬等獄而復城水洛琦乃請外遂出知揚州河東轉運使歐陽修上疏曰杜衍范仲淹韓琦富弼天下皆知其有可用之賢而不聞其有可罷之罪自古小人讒害其識不逺欲廣陷良善則指為朋黨欲動搖大臣則誣以専權蓋去一善人而衆善人尚在則未為小人之利欲盡去之則善人少過唯指為朋黨則可盡逐自古大臣被主知蒙信任則難以他事動搖唯有専權是上之所惡方可傾之夫正士在朝羣邪所忌謀臣不用敵國之福也竊為陛下惜之羣邪益忌修因傳致修罪左遷知滁州洙博學有識度以為自唐以來文格卑弱至栁開始為古文而世未知宗尚乃與穆修復振起之為文簡而有法元昊反洙未嘗不在兵間故於西事尤為練習未幾卒發明禮曰大臣不可不敬也是民之表也邇臣不可不慎也是民之道也韓琦憤正人之悉去救尹洙之直言諫之不行琦力請外仁宗無辨出知揚州則於敬大臣之心為益疏矣涇渭何由而别哉綱目具官而書罷所以明其不宜罷也廣義范仲淹富弼韓琦一時罷去則宋國可謂空虛矣烏得不起契丹西夏之侮哉所謂國必自伐而後人伐之也奚足怪哉罷科舉新法范仲淹既去執政以新定科舉入學預試為不便且言詩賦聲病易考而策論汗漫難知祖宗以來莫之有改且得人嘗多矣帝下其議有司請如舊法乃詔前所更令悉罷之發明科舉之法國之得實才者莫切於此士之期進用者亦莫切於此誠治世之良規保邦之要法也自唐以詩賦取士雖亦求賢之國未免浮譁之失宋去唐未逺因之不革猶未盡善惟范仲淹定以策論則庶幾有性理之學焉仲淹去國朝議罷之豈不深可嘆哉上書罷磨勘蔭子新法此書罷科舉新法皆惜之之意也夏四月朔日食五月夏人歸石元孫諫官御史奏元孫軍敗不死為國辱請斬于塞下以示西人賈昌朝獨引春秋榖臣知罃故事請赦之因人對又袖出魏于禁傳以奏曰前代將臣覆沒而還多不加罪帝乃貸元孫編管全州子弟嘗受陳亡恩澤者並追奪之發明元孫之事當以臺諫之言為是而以宰相之言為非是時元昊反叛邉城未復正宜明君臣之義辨逆順之理今石元孫以總管敗沒于賊不能死義罪逆當誅況臺諫論奏尤為明切仁宗乃惑賈昌朝之言從而赦之是使偷生之徒橫行於天下而誅亂討逆之法亦不必立矣故綱目於此書夏人歸石元孫以深貶之嗚呼失節之臣猶且赦之況下於失節者乎綱目不書赦免猶為中國諱之也章得象罷得象在中書畏逺名勢宗黨親戚一切抑而不進然亦無所建明御史孫抗數論之得象乃上章求去遂出知陳州廣義既已罷黜諸賢則得象之才德果有出于諸賢之右者哉罷去宜矣以陳執中同平章事兼樞密使吳育參知政事丁度為樞密副使未幾執中與賈昌朝言西夏來庭乞免兼樞密使從之冬十月罷轉運兼按察使十一月罷京東安撫使富弼滁州狂人孔直溫謀反伏誅搜其家得石介書時介已死宣微南院使夏竦言介詐死乃弼遣介結契丹起兵期以一路兵為內應請發介棺驗之詔下充州訪介存亡杜衍以闔族保介必死提刑吕居簡亦言無故發棺何以示後始獲免遂罷弼安撫使伐孫復監虔州稅介子孫羈管他州發明甚矣小人之心至酷而不恕也茍有中傷君子者則必投間抵隙務致傾陷而後已是時夏竦深憾石介詞連富弼誣以謀通契丹之事嗚呼弼以赤心報國帝所深知安有潛結北敵如夏竦所云哉茍富弼欲反曷不於出使之時逮至今日而復懷疑二耶此理甚明無可疑者信讒而罷非其罪矣故書罷而不去其官丙戌六年春三月朔日食秋八月以吳育為樞密副使丁度參知政事育在政府遇事敢言時知永靜軍何綬疑通判江中立譛巳因誣以罪迫令自殺育欲坐綬死賈昌朝不可遂爭議帝前殿中皆失色育論辨不已曰臣所辨者職也顧力不勝願罷臣職知審刑院髙若訥附昌朝議綬竟減死一等帝以昌朝故乃命育與度易位謂近臣曰吳育剛正可用第嫉惡太過耳丁亥七年春二月大旱詔求直言賈昌朝吳育免昌朝育議不協論者多不直昌朝時方憫雨昌朝引漢册免三公故事乞罷御史中丞髙若訥上言大臣喧爭為不肅故雨不時若於是昌朝出判大名育出知許州發明人君所敬者天所寶者民不能敬天而災咎之來必矣不能保民而四海之叛必矣古之善治天下者未始不以敬天勤民為心焉吳元年六月久旱我太祖皇帝日減膳素食宫中皆然既而大雨羣臣請復膳曰亢陽為災實吾不德所致今雖得雨然苗稼焦損必多縱肉食奚能甘味得乎民心則得乎天心今欲弭天災但謹於修巳誠以愛民庶可答天之眷大哉王言萬世之鑒仁宗因大旱詔求直言其於敬天勤民之心誠庶幾矣宰相所以燮理隂陽隂陽不和咎將誰執故書昌朝吳育免於下以明其可免者也臣故敢併及之以夏竦同平章事尋改授樞密使竦制下諫官御史交章言大臣和則政事修竦前在關中與首相陳執中論議不合今不可使共事故改之以文彥博參知政事髙若訥為樞密副使帝禱于西太乙宫是日雨帝出禱雨于太乙宫日方炎赫帝却蓋不御及還而雨大浹發明春秋書六月雨志喜雨也上書大旱詔求直言此書帝禱于太乙宫是日雨則仁宗勤民之心益見矣是日雨者言天感應之速也是故人君不敬天則已茍或敬之而天必隨應捷如影響世豈可以常事忽天變乎直書于册所以深美之也冬十一月貝州卒王則據城反以明鎬為河北安撫使初涿人王則以嵗飢流至貝州自賣為人牧羊後𨽻宣毅軍為小校貝冀俗尚妖幻相與習五龍滴淚等經及諸圖讖書言釋迦佛衰謝彌勒佛當持世妖人爭信事之州吏張巒卜吉主其謀黨與連德齊諸州約以明年正旦斷澶州浮梁作亂會其黨以書謁北京留守賈昌朝事覺被報則故不待期亟以冬至日反時知州張得一方與官屬謁天慶觀則率其徒劫庫兵執得一囚之從通判董元亨索庫鑰元亨厲聲罵賊賊遂殺之又殺司理王奬等兵馬都監田斌以從卒巷戰不勝而出城扉闔提等刑獄田京等縋城出保南關入驍健營撫士卒凡有欲應賊者京以計盡誅之由是營兵在外者皆懾服南關得不陷則僣稱東平王建國曰安陽改元得聖旗幟號令率以佛為稱城以一樓為一州書州名補其徒為知州每面置一總管然縋城下者曰衆於是令民伍伍為保一人縋餘悉斬事聞以知開封府明鎬為體量安撫使而詔貝州有能獲賊者授諸衛上將軍鎬至貝州民汪文慶等自城上繫書射鎬帳約為內應夜垂絙以引官軍入城者數百人賊覺率衆拒戰官軍不利乃與文慶等復縋而出廣義觀綱目備載王則之事乃知去淫祠禁妖術實理國之要務也然以一小卒作亂尚干國慮如此況其他乎有國者當知先務云太子太傅致仕李迪卒諡文定戊子八年春正月以文彥博為河北宣撫使明鎬副之閏月執王則檻送京師誅之彥博同平章事鎬以貝州城峻不可攻乃為距闉將成為賊所焚鎬乃即南城為地道日攻其北以牽制之朝廷以則未下命彥博宣撫鎬為之副夏竦惡鎬恐其成功凡鎬所奏輒從中沮之彥博既受命請軍事得専行許之彥博至貝鎬穿道適通遂選壯士夜半由地道入城衆登城賊縱火牛官軍以槍中牛鼻牛還攻之賊大潰開東門遁總管王信追則擒之餘衆保村舍者皆被焚死竦復言所獲恐非真盜乃詔檻逆則京師磔于市則據城凡六十六日而敗改貝州為恩州張得一以降賊伏誅詔以彥博同平章事加明鎬端明殿學士封賈昌朝為安國公侍讀學士楊偕言賊發昌朝部中至出大臣乃能平昌朝為有罪不當賞弗聽發明上書以文彥博為河北宣撫使下書執王則檻送京師既見仁宗用人得其宜又見彥博任事得其當也據事直書義自見矣夏元昊卒年四十六子諒祚方期嵗密藏氏所生也養于母族鄂特彭遂因以三大將分治國政諡元昊曰武烈皇帝廟號景宗尊密藏氏為皇太后李燾曰元昊初娶裕勒且女雅爾氏生寧令格特愛之以為太子既而為寧令格納瑪伊克氏為妻見其美自娶之寧令格憤殺元昊不死劓其鼻而去匿鄂特彭家為其所殺元昊因鼻創死王稱曰自德明欵塞西鄙息肩矣元昊強梁凶悍乃謀僣尊以天下之力臨區區一方然未嘗少挫及敗於女色禍發其子彼能叛君而子亦能殺父此天道也發明元昊既嘗稱帝今而止斥其名者不豫其僣也然宋亦册為夏國主今卒而削之者元昊叛逆之賊宋不能討而反册之非其義矣故不以僣國例待之若生不加誅死不示貶則亂賊何所懲戒哉衛士作亂伏誅帝將以閏月望夕復張燈皇后諌止之越三日親從官顔秀等四人謀為亂夜入禁中越屋叩寢殿皇后方侍帝聞變遽起帝欲出后閍閣擁持趣召都知王守忠使引卒入衛賊傷宫嬪殿下聲徹帝所宦者以乳嫗毆小女子紿奏后叱之曰賊在近殺人敢妄言邪隂遣人挈水踵後賊果舉炬焚簾水隨滅之是夕所遣宦侍后皆親翦其髮曰以是徵賞故爭盡死力守忠兵至賊就擒滅詔領皇城司者皆坐斥事連副都知楊懷敏夏竦與懷敏相結欲曲庇之乃請御史與宦官同鞫于禁中丁度曰宿衛有變事關社稷請付外臺窮治因爭于帝前帝從竦議由是懷敏止降官領內職如故三月詔羣臣言時政闕失帝幸龍圖天章閣以手詔問輔臣及御史中丞以上時政闕失皆給筆札令即坐以對時陳執中不學少文固辭不對宋庠亦請至中書合議條奏乃聽兩府歸而上之翰林學士張方平方鎖院草制夜半與所條對俱上言汰冗兵退剩員慎磨勘擇將帥四事帝覽奏驚異詰旦更賜手札問詔所不及者方平復上備邉恤刑二事又言古今治亂之變只在上下之勢離合而已北來朝廷頗引輕險之人內為言官外為按察多發人曖昧之事議論展轉緣飾沽激天下承風靡然一變故將相以至卿大夫士一動一為輒曰恐致人言更相姑息専避嫌疑茍且因循求免謗咎何暇展布四體為國立事者哉願陛下深為留神務在通上下之情欲上下之情合惟審于聽受而已殿中侍御史何郯上言古者人君以天下至廣非一人總明所能盡故內則公卿大夫謀于朝外採百土庶人議于下今國家設侍從之官自學士以至待制皆自文學選以備顧問公卿之才並由此出自卿相承朝廷惟以文翰待之而不責其言議臣下亦以職分當爾自安循默以天下利害之大備言責者惟御史諫官僅十人而欲陛下聰明無所遺政理無所失不可得矣欲乞頒詔告諭兩制臣寮自今有聞朝政闕失並許上章論列欲進用臣寮取其裨補多者用為選首庶使親侍之臣各知責任務圖傾竭以助政化帝嘉納之發明人君有求治之心則必有求治之事夫治天下之道無他其在乎行善政而已大戴禮曰政善則民悅民悅則歸之如流水親之如父母仁宗幸天章龍圖之閣以手詔問輔弼御史之臣皆給筆札令即坐對蓋欲聞時政之闕失則其求治之心切矣憂國之心勤矣宜乎有以享太平之治也故綱目特書以著其美夏四月册諒祚為夏國主夏遣使來告哀朝廷及契丹皆遣使慰奠議者請因諒祚幼弱母族専國以節鉞啖其三大將使各有所部分以披其勢可以得志陕西安撫使程琳曰幸人之喪非所以柔逺人不如因而撫之帝乃遣使册諒祚為夏國主議者深惜朝廷之失機會發明册諒祚豫之乎曰非也是時元昊甫殁諒祚襁褓況母族専國民心皇皇此正恢復靈夏削平僣叛之時也夫何君臣優柔不斷坐失機會而為子孫終身之憂自是而後不過踵行故事耳豈不深可惜哉特書曰册蓋譏之也廣義程琳此舉乃宋襄陳餘之仁義也果何益于人國也哉于時即當興師問罪則憂國立可郡縣矣不此之務而乃為煦煦孑孑之事此議者所以深惜之也罷丁度為觀文殿學士以明鎬參知政事度以與夏竦議事不合求解政事乃置觀文殿學士以授之度性淳質在翰林十五年數論天下事未嘗及私帝雅重之文彥博數推鎬貝州之功且薦其才可大用帝遂以代度五月無雲而震夏竦免以宋庠為樞密使龎籍參知政事何郯論竦姦邪不可任樞要會京師一日無雲而震者五帝方坐便殿趣召翰林學士張方平至謂曰夏竦姦邪以致天變如此宜免之乃出知河南發明胡氏曰天人一理也萬物一氣也觀於隂陽寒暑之變以察其消息盈虛此制治於未亂慎於微之意也蓋天象之垂戒實人為之所感雲而震乃理之常無雲而震此理之變焉夏竦姦邪致傷和氣免之誠是也故以可免例書雖然仁宗因何郯之言罷夏竦之職庶幾有從善之心曷亦反求諸身而已矣惜乎仁宗徒知責人而不知責已也豈不深可惜哉特書於册其義自見六月明鎬卒河北京東大水冬十月以美人張氏為貴妃初衛士之變帝以美人有扈蹕功夏竦建議欲尊之同知諫院王贄因言賊本起皇后閣前請究其事冀動搖中宫隂為美人地上以問御史何郯郯曰此姦人之謀不可不察上悟事遂寢然美人卒以功進貴妃發明張氏一貴妃耳何以書所以譏仁宗偏愛之失也是時河北京東同時大水仁宗未聞有省已責躬之實却乃垂情嬖媵亟立貴妃謂之何哉蓋大水者隂沴婦人者隂類以氣感氣自然之理耳仁宗迷而不悟悲夫識者試觀之綱目之旨思過半矣己丑皇祐元年春正月朔日食二月彗星見發明仁宗頻年以來災異屢矣上書河北京東大水此書正月朔日食二月彗星見然則大水者隂逆之氣日食者陽道之虧彗星者惡氣所積皆非善變也胡氐有曰克謹天戒則雖有其象而無其應弗克畏天災咎之來必矣仁宗敬天勤民初無過舉意者宫闈偏寵而金革將興歟不五月而有儂智髙之反兵連禍結災不妄作信哉是以人君當克謹天戒不敢縱逸也夏五月加知青州富弼禮部侍郎辭不受河北京東大水民流就食青州富弼勸所部民出粟益以官廩得公私盧舍十餘萬區散處其人以便薪水官吏自前資待缺寄居者皆給其祿使即民所聚選老弱病瘠者廩之仍書其勞約他日為奏請受賞率五日輒遣人持酒肉飯糗慰藉出於至誠人人為盡力山林陂澤之利可資以生者聽民擅取死者為大冢葬之目日叢冢及麥大熟民各以逺近受糧而歸凡活五十餘萬人募為兵者萬計前此救災者皆聚民城郭中為粥食之蒸為疾疫及相蹈藉或待哺數曰不得粥而仆名為救之而實殺之自弼立法簡便周盡天下傳以為式帝聞遣使褒勞加拜禮部侍郎弼曰救災守臣職也固辭不受發明嘗以易謙之彖觀之曰天道虧盈而益謙地道變盈而流謙鬼神害盈而福謙人道惡盈而好謙謙尊而光卑而不可踰君子之終也然則謙之之道乃君子之德富弼始終勞謙其志可尚前使契丹有功加官而不受今救荒歉有功加官而固辭誠乃仁人之量君子之心乎後之頗竊寸功矜已誇人者豈不為富弼之罪人哉直書不受深豫之也廣義富弼公青州救荒至今膾炙人口況乎以功受賞古今令典鄭公辭而不受其與鰥官冒進者不啻天淵矣故記其時月而備書之者褒之也帝幸後苑觀刈麥帝御寶岐殿觀之謂輔臣曰朕作此殿不欲植花卉而嵗以種麥庶知稼穡之不易也發明綱目於兩宋之篇有書觀燈者有書觀芝者皆譏詞也此觀刈麥譏之歟曰非也觀燈觀芝皆無益之觀玩物喪志不恤國政如春秋書觀魚于棠之類皆譏也人君深居九重羅八珍而列九鼎稼穡之艱漠乎其為聞也是以瓊其宫而瑶其臺丘其糟而池其酒肆欲敗度可勝言哉仁宗之觀刈麥乃敦本之意耳非玩物喪志之比焉觀其宣諭輔臣之言其務本抑末之心可見耳又豈聞蟇問糜者所能倣佛耶故綱目特書以著其美廣義自古人君未有不以逸欲而亡奢侈而敗也觀於煬帝後主可見矣雖以成王之賢而周公尚有無逸之戒況其他乎今仁宗此舉正無逸所謂以勤而居逸者也綱目書此以昭千古之美不亦宜乎六月以賈昌朝為觀文殿大學士判尚書都省帝以昌朝舊學特置觀文殿大學士以寵之仍兼判尚書都省詔自今非嘗為相者毋得除後昌朝以山南東道節度使同平章事入見召赴邇英閣講乾卦帝曰將相侍講天下盛事昌朝頓首謝秋八月陳執中罷執中居位無所建明但延接卜相術士言者屢攻之遂以足疾求罷出知陳州以宋庠同平章事髙若訥參知政事龎籍為樞密使梁適為副使庠初執政遇事輒分别可否及再登用遂浮沉自安然天資忠厚嘗曰逆詐恃明殘人矜才吾終身不為也汰諸路兵文彥博龎籍建議省兵衆以為不可帝以為疑彥博籍共奏曰公私困竭正坐冗兵果有患臣請死之帝意遂決於是簡汰陜西及河北諸路羸兵為民者六萬減廩糧之半者二萬又詔減陜西兵屯內地以省邉費九月廣源州蠻儂智髙反寇雍州儂氏自唐初即雄於西原世為廣源州首領唐末交趾強盛廣源服屬之知儻猶州儂全福為交人所殺其妻改適商人生智髙冒姓儂氏既壯與其母據儻猶州建國曰大厯交人攻而執之釋其罪使知廣源州智髙怨交趾乃乘間襲據安德州僣稱南天國改元景瑞因招納亡命貢獻中國求內附朝廷不許復奉金函書以請亦不報智髙怒與廣州進士黃師宓等謀據廣南乃數出敝衣易穀食紿言洞中飢饉部落離散知雍州陳珙信之不設備智髙一夕忽縱火焚其居因紿衆曰平生積聚今為天火所焚生計窮矣當取雍廣以自王否則兵死衆從之遂率衆五千沿江東下攻雍州橫江寨守將張日新等戰死詔江南福建等路發兵備之罷武舉契丹伐夏夏人襲敗之契丹北院樞密使蕭惠帥師自河南進以伐夏戰艦糧艘綿亘數百里既入敵境偵候不逺鎧甲載于車軍士不得乘馬諸將請備不虞惠曰諒祚必自迎車駕何暇及我無故設備徒自弊耳契丹主既還惠師尚進未立營柵夏人奄至惠與麾下不及甲而走追者射之惠幾不得脫士卒死傷者不可勝計冬十月契丹復伐夏獲諒祚之母于賀蘭以歸發明復伐者已甚之辭獲諒祚之母以歸其惡􅉃矣伐人之國而虜其父母非至不仁者弗克忍為是時契丹夏人遞相報伐殊無義戰書之于册足以志強暴之相凌耳庚寅二年春二月夏侵契丹三月契丹伐夏秋九月大享天地于明堂赦自太祖以來未嘗親享明堂惟命有司攝事是嵗帝謂輔臣曰今年欲以季秋行大享明堂之禮夫明堂者布政之宫朝諸侯之位天子之路寢乃今大慶殿也其以大慶殿為明堂仍詔有司詳定儀注於是新作禮神王製樂八曲九月朝享景靈宫又享太廟乃大享天地于明堂以太祖太宗真宗配儀如圜丘大赦百官皆進秩發明明堂乃布政之宫非享祭之所蓋郊祀之禮國典攸存而大享天地于明堂此何禮也凡祭祀常禮則不書此特書之者所以著其失君臣俱罪之也廣義仁宗明堂之舉其義得矣然以太祖太宗真宗配者果何見哉必如郊祀后稷以配天宗祀文王于明堂以配上帝則庶乎無弊矣冬十月夏請平于契丹契丹不許夏兩遣使于契丹乞依舊稱藩契丹主遣北院都監蕭伊克等使夏索黨項叛户夏表契丹乞伐黨項權進駝馬牛羊等物而求唐隆鎮及罷所建城邑契丹主不許安置所獲曩霄妻屬于蘇州十一月詔外戚毋得任二府時張貴妃寵冠後庭堯佐其伯父也驟除宣徽節度景靈羣牧四使殿中侍御史唐介與知諫院包拯吳塗等力爭之中丞王舉正又留百官班廷論故有是詔且罷堯佐宣徽景靈二使閏月詔太子中舍致仕胡瑗定雅樂置局于祕閣詔太子中舍致仕胡瑗典作雅樂知制誥王洙言舊樂宫小而商大是臣強君弱之象乃參酌鏄鐘特罄制度與瑗等更造鐘磬上之賜名大安之樂其法與李照一律由是黃鍾律短而所奏樂音髙又其鐘弇而直聲鬱不發著作佐郎劉義叟曰此謂害金帝將感心腹之疾乎已而果然瑗等既上樂議者以為鐘磬皆不合古遂復命詳定而當議者各安所習久而不定乃命諸家作鍾律以獻而郊廟仍用舊樂益州鄉貢進士房庶嘗著樂書補亡二卷其説以為嘗得古本漢志云度起於黃鍾之長以子榖秬黍中者一黍之起積一千二百黍之廣度之九十分黃鍾之長一為一分今文脫之起積一千二百黍八字故自前世以來纍黍為尺以制律是律生於尺尺非起於黃鍾也蓋漢一為一分者九十分之一後儒誤以一黍為一分其法非是當以秬黍中者一千二百實管中黍盡得九十分為黃鍾之長九寸加為一尺則律定矣直祕閣范鎮是之時胡瑗等製樂已定故授庶校書郎而遣之惟集賢校理司馬光不以鎮言為是數與論難然世鮮鍾律之學竟不能決矣發明雅樂未易定惟能知音律之學者可定之宋世三定而迄無成功羣臣會議而卒無定論謂之何哉一書再書蓋惜之也廣義音律之學自古為難雖以胡安定司馬光范鎮諸賢尚不能精到況其他乎惟季通律吕新書為考亭之所尚焉辛卯三年春正月帝幸魏國大長公主第公主太宗女幼不好弄貌類太宗下嫁李遵朂賔客皆一時賢士大夫每燕集主必親視饔饎之節莊獻太后嘗賜金龍小冠辭不敢服太后訪以政事多語祖宗舊事以諷遵朂守許州暴得疾主亟欲往視不待奏而行從者才五六人居夫喪衰麻未嘗去身服除不復御鮮華嘗燕禁中帝親為簮花主辭曰自誓不復為此久矣未幾病目帝自臨視親舐主目左右感泣帝亦悲慟問子孫所欲主曰豈可以母疾而邀賞邪賚白金三千兩不受至是以暴疾聞帝促駕往視未至而主卒乃即主堂易服奠哭諡獻穆發明公主太宗之女仁宗之姑考之分注仁宗奉姑之心可謂至矣因主有疾親往視之因主病目親為舐之則其篤於天倫之愛豈不切哉特書于册蓋美之也三月宋庠免以劉沆參知政事時有偽造敕牒者庠弟祁之子與遊事覺包拯等言庠不戢子弟且在政府無所建明庠遂求去出知河南府夏六月詔州郡勿獻瑞物知無為軍茹孝標獻芝草帝曰朕以豐年為瑞賢臣為寶草木之異焉足尚哉免孝標罪而戒州郡勿復獻發明仁宗踐祚閲三十年觀綱目之所書自災異分擾之外凡前人宦官女寵奢侈聚斂神仙浮屠之事一亳無有可不謂之賢哉故綱目上書詔外戚無得任二府下書詔州郡勿獻瑞物等事皆所以豫之也嗚呼使仁宗有不邇聲色不殖貨利之德而又有布昭聖武表正萬邦之才豈不為有宋盛德之主惜哉廣義仁宗詔州郡勿復獻瑞其過于真宗逺矣特書于册豈溢美哉作隆儒殿秋八月京東淮浙飢諫官吳奎言近嵗以來水不潤下盜賊橫起皆隂盛所致今內寵驕恣近習回撓夷狄桀鷔讒邪交傷隂盛如此寧不致大異哉且朝廷之過常在乎無事之時因循而不為有事之後顛沛而失錯中外臣寮平時建一䇿主一官雖有可取皆抑而不行又從而媒蘖謂之生事如兩河盜賊行路之人皆已傳布而大臣不以為事至執殺官吏然後倉皇移易官守不亦晚乎事將有大于此者幸陛下留意發明禮曰三年耕必有一年之食九年耕必有三年之食以三十年之通雖有凶旱水溢民無菜色然後天子食日以舉樂用是而觀則宋之儲蓄亦歉矣救荒亦疏矣以致京東淮浙同時飢饉豈不深可惜哉是以有國家者要當廣其儲蓄以為凶年之資勿作無益以耗有用之財則國富而民歸矣反是則民有飢色野有餓莩雖有臺池鳥獸人君豈得而獨樂之哉冬十月以張堯佐為宣徽南院使貶殿中侍御史裏行唐介為英州别駕文彥博免堯佐復除宣徽使知河陽命下介謂同列曰是欲與宣徽而假河陽為名耳獨抗言之帝謂曰除擬本出中書介遂效文彥博知益州日造間金竒錦緣閹侍通宫掖以得執政今顯用堯佐益自固結請罷之而相富弼語甚切直帝怒郤其奏不視且曰將逺竄介徐讀疏畢曰臣忠憤所激鼎鑊不避何辭於謫帝急召執政示之曰介論事是其職至於彥博由妃嬪至宰相此何言也進用冢司豈應得預而乃薦弼時彥博在帝前介責之曰彥博宜自省即有之不可隱彥博拜謝不已帝怒益甚梁適叱介使下殿修起居注蔡襄趨進救之貶春州别駕王舉正言其太重帝亦悟明日取其疏入改英州而罷彥博知許州吳奎亦以介黨出知密州帝慮介或道死有殺直臣名命中使護之由是介直聲聞天下然彥博事之有無卒莫能辨王稱曰彥博雖有過宰相也使廷辱宰相而不問則於眷禮大臣之道有所未盡故斥介以慰彥博介雖訐臺諫也或偏信大臣而抑臺諫則於聽言之美為有愧故罷彥博而行介之言使之俱無怨焉嗚呼忘巳以用人虛心而從諫後之君人者當以仁宗為法發明臣謂王稱氏之論過矣何者人君謹其好惡察其是非勿以私意而廢羣議之公勿以邪謀而妨衆情之正茍或臺諫是而宰相非則納臺諫而黜宰相茍或宰相是而臺諫非則納宰相而黜臺諫此是非之公論也人臣事君當面折廷爭宰相非是廷辱何害介以直言而貶黜彥博徇私而免官是可謂之慰彥博而行介言乎新序有曰聖賢之君不以祿私親功多者授之不以官隨愛能當者處之故曰察能而授官者或功之君也堯佐以貴妃之弟而授宣徽之職彥博以宰相之任而存阿附之容羣臣不能言介獨言之仁宗則當行介之言賞介之直罷堯佐宣徽之職降彥博從官之列斯得好惡之至公賞罰之正理夫何堯佐職任如故彥博僅克免官而唐介乃貶英州奚以見其忘己用人虛心從諫之實乎觀綱目之所書則其義自見而王氏之説不攻自破矣此法明書法之意也廣義富弼有青州之功尚辭禮部侍郎堯佐果何人斯而欲驟除宣徽邪蓋于時張貴妃寵冠後宫堯佐其伯父也仁宗除其官乃私也非公也宜乎子方之力爭焉然則貶子方而卒除堯佐者仁宗私勝公微也書曰官不及私昵爵罔及惡德仁宗何足以知之夏竦卒賜諡文正同知禮院司馬光言諡之美者極于文正竦何人乃得此諡判考功劉敞言諡者有司之事竦姦邪而諡之以正不應法且侵臣官詔更諡文莊以龎籍同平章事髙若訥為樞密使梁適參知政事王堯臣為樞密副使壬辰四年夏五月資政殿學士汝南公范仲淹卒贈兵部尚書諡文正仲淹為政忠厚所至有恩邠慶二州之民與屬羌皆畫像立生祠其卒也哀號如父吕中曰先儒論本朝人物以仲淹為第一觀其所學必忠孝為本其所志則先天下之憂而憂後天下之樂而樂其有所為必盡其方曰為之自我者當如是其成與否有不在我者雖聖賢不能必此諸葛武侯不計成敗利鈍之誠心也仁宗晚年欲大用之而淹已即世豈天未欲平治天下歟發明仲淹立心正大為政忠厚吕氏中論之詳矣故卒而特具官爵以豫之然則剛目於夏竦姦邪則削其官仲淹忠直則具其官此所以為筆削之權衡是非之明鑑也廣義文正佐宋皆聖賢事業白璧無瑕者也故綱目於其卒也備記時月於年之下不惟書其官而又尊其爵者美之至也儂智髙陷雍橫諸州遂圍廣川詔鈐轄陳曙等發兵討之智髙攻陷雍州執知州陳珙等欲任司户孔宗旦以事宗旦不屈大罵而死智髙即州建大南國自稱仁惠皇帝改元啓厯置官屬時天下久安廣南州郡無備智髙所向守臣輒棄城走遂陷橫貴藤梧康瑞龔封八州知封州曹覲知康州趙師旦皆戰死智髙進圍廣州知州魏瓘力戰禦之知英州蘇緘搜募壯勇合數千人赴援扼賊歸路得黃師宓父斬之以徇而轉運使王罕亦自外至募民兵益修守備城得不陷事聞命陳曙討之又以余靖為廣西安撫使同提刑李樞及曙經制賊盜事復以楊畋體量安撫廣南發廣東鈴轄兵赴之以狄青為樞密副使初尹洙與青談兵善之薦於韓琦范仲淹曰此良將材也二人待之甚厚仲淹授以左氏春秋且曰將不知古今匹夫勇耳青由是折節讀書悉通秦漢以來將帥兵法纍進馬軍副都指揮使青起行伍十餘年而顯責面涅猶存帝嘗勑青傳藥除之青指其面曰陛下以功擢臣不問門地臣所以有今日由此涅耳臣願留以勸軍中不敢奉詔帝益重之至是自知延州召拜副使臺諫王舉正等諫其不可帝不聽秋七月儂智髙陷昭州九月以孫沔為廣南安撫使初以沔知秦州入見帝以秦事勉之對曰秦州不足煩聖慮陛下當以嶺南為憂臣觀賊勢方張官軍朝夕當有敗秦既而昭州鈐轄張忠以敗聞帝乃除沔湖南江西安撫使沔請發騎兵求武庫精甲梁適折沔曰毋張皇沔曰前日惟亡備故至此今乃欲示鎮靜邪夫實備不至而貌為鎮靜危亡之道也乃與兵七百人沔憂賊度嶺而北乃檄湖南江西曰大兵且至其繕治營壘多具燕犒賊疑不敢北侵行至鼎州加廣南安撫使以狄青為荆湖宣撫使督諸軍討儂智髙智髙寇擾日甚嶺外騷動楊畋等久無功帝以為憂智髙移書行營求雍桂節度使帝將受其降梁適曰若爾則嶺表非朝廷有矣會狄青上表請行遂以為宣撫使提舉廣南經制盜賊事青入對自言曰臣起行伍非戰伐無以報國願得蕃落數百騎益以禁兵羈賊首致闕下帝壯其言時命入內都知任守忠為青副知諫院李兑言唐失其政以宦者觀軍容致主掣肘是不足法遂罷守忠諫官韓絳復言青武人不宜専任帝以問龎籍籍力贊青可用且言號度令不専不如不遣乃詔嶺南諸軍皆受青節廣義或曰韓絳龎籍之言果有得失乎曰有曰何以言之曰如絳言則青不能立功如籍言則青必能立功籍之見乃武后去監軍御史之識也非得而何絳之見即仁宗用宦者監軍之左計也非失而何大臣謀國而有得失如此人主奚可不慎其所與哉以范祥為陜西轉運使制置解鹽事自復𣙜法兵民贊運不勝其苦並邉務誘人入中芻粟皆為虛估騰踊至數倍大耗京師錢幣太常博士范祥關中人也熟其利害常謂兩地之利甚博而不能少助邉計者公私浸漁之害也儻一變法嵗可省度支緡錢數十百萬乃畫䇿以獻遂命制置其事使推行之論者爭言其非是遣户部使包拯馳視還言其便論者猶籍籍驛召祥至與三司雜議皆是祥所建詔從之田況請久任祥以専其事乃擢祥為轉運使於是舊禁鹽地一切通商聽鹽入蜀罷九州軍入中芻粟令入實錢償以鹽授以要劵即池驗劵按數而出盡弛兵民輦運之役以商所入緡錢糴粟輸並邉九州軍而悉留𣙜貸物錢幣以實中都由是點商貪古無所僥幸關內之民得安其業公私便之冬十月以胡瑗為國子監直講瑗既居太學其徒至不能容取旁官舍處之禮部所得士瑗弟子十常居四五隨材髙下喜自修飭衣服容止往往相類人遇之不問可知為瑗弟子也時與孫復同為直講復教養不及瑗而治經過之然二人論見多不合常相避不見廣義孫復胡瑗為世通儒至於論見不合而常相避者要亦渣滓之未盡也人之全者豈得多見哉儂智髙陷賔州復入于雍時交趾請出兵助討智髙余靖以便宜許之請于朝狄青奏曰假兵于外以除內寇非我利也以一智髙橫踐二廣力不能制乃假蠻夷兵蠻夷貪得忘義因而啓亂何以禦之願罷交址助兵帝從之發明自皇祐元年書智髙反至是閲四載如陷雍橫圍廣州陷昭州陷賔州恣其攻略如陷無人之境守臣戍將非死則逃罔敢與敵於乎以烏合小醜橫行嶺南卒難𠞰捕宋之武備亦甚疏略矣易曰君子以除戎器戒不虞有天下者不可不鑒廣義余靖儒者也狄青武人也靖之見不逮于青逺矣青豈武人也哉十一月朔日食十二月狄青勒兵賔州陳曙兵敗青斬之以徇青行軍立行伍明約束野宿皆成營柵至廣南合孫沔余靖之兵進次賔州戒諸將無得妄與賊鬭聽吾所為廣西鈐轄陳曙承青未至輒以步兵八千擊賊潰于崑崙關殿直袁用等皆遁青曰令之不齊兵所以敗晨會諸將堂上揖曙起并召用等三十二人按以敗亡狀驅出軍門斬之沔靖相顧􅌓眙諸將股栗莫敢仰視發明師之初六爻曰師出以律否臧凶象曰師出以律失律凶也然則行師之道貴乎正紀律而肅號令否則未免輿尸之凶也狄青部分諸將號令嚴明陳曙邀功無謀王師敗績茍不正法則軍令不肅人無鬬志於是按罪行誅一軍股栗攻戰圖取卒能成功雖然青固能執法蓋亦朝廷委任之専耳所以任將不可不専行師不可不肅綱目不書殺而書斬蓋豫青而罪曙也癸巳五年春正月會靈觀火發明人火曰火厯觀宋之宫觀非義之建者未始不為天之所毁如開寶寺塔玉清昭應宫會靈觀皆毁于烈焰之中靡有孑遺是知人為不善天必厭之綱目特書于册者一以見作非義者之無益一以見逆天道者之有徵也然則人君豈可不修省以答天變乎合前後書法觀之然後可見綱目垂世立法之意深矣狄青夜度崑崙關大敗儂智髙于雍州智髙走大理廣南平青既誅陳曙因按兵止營令軍休十日衆莫測賊覘者還言軍未即進青明日即整兵自將前軍孫沔將次軍余靖為殿夕次崑崙關黎明整大將旗鼓諸將環立帳前待令乃發而青已微服與先鋒度關趣諸將會食關外賊方覺悉出逆戰右將孫節搏賊死山下賊氣鋭甚沔等懼失色青執白旗麾蕃落騎兵從左右翼擊之縱橫開合部伍不亂賊不知所為大敗走追奔五十里斬首數千級賊黨黃師宓儂建中等及偽官屬死者百五十七人生擒賊五百餘死者萬計智髙夜縱火燒城遁去由合江口入大理遲明青按兵入賊獲金帛巨萬招復老壯七千二百嘗為賊所俘脅者慰遣之梟師宓等于城下斂尸築京觀于城北隅時賊尸有衣金龍衣者衆謂智髙已死欲以上聞青曰安知其非詐邪寧失智髙不敢誣朝廷以貪功也廣南悉平捷至帝喜曰青破賊龎籍之力也又曰向非梁適言南方安危未可知也詔余靖經制廣西追捕智髙而召青沔還朝後二年靖遣都監蕭注入特磨道生獲智髙母及其弟智光子繼宗繼封又募死士使大理求智髙重譯得至會智髙已死於大理函首至京師乃誅其母及其弟子發明觀狄青之用兵可謂好謀而成出人意表者矣夜度崑崙出賊不意罪人斯得廣南悉平其峻功偉績為何如哉據事直書深豫之也廣義分注載秋青之言以為寧失智髙不敢誣朝廷以貪功其心事明白雖儒者何以過之噫青雖起於行伍而能人之所不能此其功之所以立也雖然向非龎籍之贊襄必將受制於閹竪矣況望其能立功哉詩曰侯誰在矣張仲孝友此之謂也夏五月髙若訥罷以狄青為樞密使孫沔為副使賞平廣南功也龎籍及臺諫朝士皆論青不可長省府帝不聽以孫抃為御史中丞韓絳奏抃非紏繩才抃即手疏曰臣觀方今士人趨進者多亷退者少以善求事為精神以能訐人為風采捷給者謂之有議論刻深者謂之有政事諫官所謂才者無乃謂是乎若然臣誠不能也上察其言趣令視事未幾抃舉吳中復為監察御史抃未始識其面或問之抃曰昔人恥為呈身御史今豈薦識面臺官邪秋七月龎籍罷籍長於吏事持法深峭士卒畏服及為相聲名減於治郡時閏月詔定內侍員詔自今內侍供奉至黃門以一百八十人為額仍詔內侍省都知押班須年五十以上厯任無贓私罪者乃得為之八月以陳執中梁適同平章事九月夏及契丹平冬十月朔日食十一月詔減畿內諸縣稅端明殿學士張方平言王畿賦斂之重詔開封府諸縣兩稅於元額減二分永為定式發明真氏曰有修德之實心然後有修德之實事有愛民之實心然後有愛民之實事未能無是心之實而能有其事之實者也上書詔定內侍員則其革弊之法嚴此書詔減畿內諸縣稅則其憂民之心切豈非修德愛民之實事乎一書再書深豫之耳甲午至和元年春正月貴妃張氏卒追册為溫成皇后二月孫沔罷貴妃巧慧多智數善承迎至贈其父堯封為郡王世父堯佐至太師姻戚莫不顯貴然帝守法度事無大小悉付外廷議凡宫禁干請雖已賜可或輒中郤妃嬖幸少比然終不得紊政及卒帝憂悼甚至輟朝七日禁京城舉樂一月追册為皇后治喪皇儀殿知制誥王洙鈎托非禮隂與內侍石全斌附會欲令孫沔讀册宰相護葬帝從之沔曰陛下若以臣沔讀册則可以樞密副使讀册則不可遂求罷乃知杭州時陳執中為首相奉行唯謹且引洙為員外翰林學士士論由是爭咎執中發明觀此則仁宗溺愛之心益著矣張氏以美人進位貴妃已為過寵今卒而追册為后失禮甚焉當時宰臣附會無敢可否者獨孫沔力辭讀册遂求罷政然亦不能辨正是非較諸羣臣則彼善於此耳綱目書沔罷於册后之下則其因是事而罷從可知矣比事而觀其義自見廣義五百之主尚曰無以妾為妻何中國之主而反以妃為后邪人謂宋朝家法過漢唐觀於此則所謂過者乃稱之過也豈真所謂過人之過者哉此綱目所以不書罷孫沔而書曰孫沔罷者以見罷出於沔而非出於上也沔之剛正豈常人之可及哉京師疫內出犀角二令太醫和藥以療民其一通天犀也左右請留供奉御帝曰吾豈貴異物而賤百姓哉立命碎之以田況為樞密副使三月王貽永罷以王德用為樞密使貽永尚真宗女鄭國公主自以祖宗來無外姻輔政者恆懼寵祿過盛故在樞府十五年能逺權勢帝由是益加尊禮至是以疾罷德用時以太子太師致仕會乾元節上夀立班廷中契丹使語譯者曰黑王相公乃復起邪帝聞之遂拜樞使夏四月朔日食用牲于社發明春秋莊二十五年辛未朔日有食之鼓用牲于社傳曰諸侯用幣于社伐鼓于朝退而自責皆恐懼修省以答天意而不敢忽也然則鼓用牲于社何以書譏不鼓于朝而鼓于社又用牲則非禮矣魯以諸侯之國用牲于社春秋譏之矧堂堂中國天子不知修省而乃效尤豈不誠可惜哉綱目特揭而書之所以深譏之耳秋七月以程戡參知政事梁適免適曉暢法令臨事有膽量而多挾智數貪黷怙權不戢子弟御史中丞孫抃御史馬遵吳中復論之出知鄭州八月以劉沆同平章事冬十月葬溫成皇后袝其主于太廟劉沆克溫成皇后園陵監護使既葬袝廟賜后閣中金器數百兩沆力辭而為其子請試學士院遂授館職發明於戲宋人是舉可謂徇私滅公全恩棄禮者矣蓋名不正則言不順張氏後宫之媵妾仁宗以溺愛之故生榮死哀追册為后則亦已矣相主太廟此何禮耶凡皇后之崩止書曰葬而不書袝主此特書者所以譏其溺愛不明違法悖禮之失也當時羣臣罔敢正名其失者則其阿諛苟容亦可見矣劉沆袝會葬事得授平章可恥之甚觀綱目之所書驗當時之得失其義可見乙未二年春三月改封孔子後世願為衍聖公世願孔子四十七代孫襲封文宣公太常博士祖無擇言祖諡不可加後嗣乃詔改封仍令世襲廣義按無擇所言不惟不敢黷先聖而且為先聖衍慶澤矣美號一加而至今作式無擇其有功于聖門也多矣夏四月定差衙前法初太宗立九等差役法後承平既久姦偽滋生而里正衙前主運官物陪償折耗役為至重民多破産者知并州韓琦請罷其法蔡襄亦為帝言之乃視資産多寡差排鄉户衙前置籍分為五則定役輕重而罷里正衙前自是民稍休息以趙抃為殿中侍御史抃彈劾不避權幸聲稱凜然京師目為鐵面御史其言務欲朝廷别白君子小人以為小人雖小過當力遏而絶之君子不幸詿誤當保全愛惜以成就其德時吳克鞠真卿馬遵吳中復等皆以直言居外歐陽修賈黯復求郡抃言近日正人端士紛紛引去者以正色立朝不能諂事權要傷之者衆耳由是克等悉得召還廣義人君用骨鯁之臣朝廷享清平之福清獻公一言見用則衆陽並進而羣隂自消孔子所謂一言興邦不其諒哉六月陳執中免知諫院范鎮論執中無學術非宰相器會執中嬖妾笞小婢出外舍死孫抃趙抃等論之不報至是以旱録囚范鎮言執中為相不病而家居陛下欲弭災變宜速退執中以快天下之望今臺臣不以隂陽不和責宰相而舍大索小暴揚燕私若因此為進退是因一婢逐一相非所以明等級辨堂陛也孫抃復與其屬合班論奏執中過失執中竟免然執中在中書八年人莫敢干以私以文彥博富弼同平章事帝嘗問置相於王素素對曰惟宦官宫妾不知姓名者可充其選帝曰如是則富弼爾至是彥博與弼同召至郊詔百官迎之范鎮言曰隆之以虛禮不若推之以至誠及宣制士大夫相慶于朝帝遣小黃門覘知之語翰林學士歐陽修曰古之命相或得諸夢卜今朕用二相人情如此豈不賢於夢卜哉修頓首賀會契丹使者耶律防至王德用與射于玉津園防曰天子以公典樞密而用富公為相將相皆得人矣廣義文富二公素望碩德華夷著稱今特舉以為相可謂厭天下之心矣故特書曰以文彥博富弼同平章事文無美辭而美在其中矣以張忭為御史中丞忭指切時政無所避畏帝謂之曰卿孤立乃能如是忭對曰臣仰托聖主致位侍從是為不孤今陛下之臣持祿養望者多而赤心謀國者少竊以為陛下乃孤立耳帝為感動發明仁宗以孫抃為御史中丞以趙抃為殿中侍御史以文彥博富弼同平章事以張忭為御史中丞則是宰相臺諫皆得其人矣綱目備書深豫之也秋八月契丹宗真死子洪基立宗真入秋山有疾翌日而殂廟號興宗長子燕趙國王洪基即位以太第重元為太叔大赦改元清寧尊皇太后為太皇太后遣使來告哀宗真性佻侻嘗因夜宴自入樂隊又數變服入酒肆寺觀尤重浮屠法僧有正拜三公三師兼政事令者其臣馬保忠嘗勸以臣下無勳勞宜序進之宗真怫然怒曰若爾則是君不得専豈社稷之福耶自是欲有遷除必先厚賜近臣以絶其言冬十月知辰州宋守信擊下溪蠻不克下溪州自彭允林至仕義相繼為刺史五世矣至是仕義子師寶怨父取其妻來奔辰州訴仕羲嘗殺誓下十三州將奪其印符而并其地自號如意大王補置官屬將起為亂知辰州宋守信聞之乃以師寶為鄉導帥兵數千深入討伐仕義遁入他洞不可得俘其孥官軍戰死者十八九守信等皆坐貶自是蠻獠數入寇掠邉吏不能制矣發明不曰討伐而曰擊惡黷武也自是蠻獠數入寇掠邉吏不能制矣擅開邉釁者果何益乎綱目貴義不貴功其旨深哉十二月修六塔河河入中國行太行西曲折山間不能為大患既出太岯東更平地二千餘里特以隄防為之限夏秋霖潦百川所會不免決溢而大名鄆澶滑孟濮齊淄滄隸濵德博懷衛鄭等郡及開封往往受其害於是詔諸州長吏兼河隄使防塞之法甚備而決溢之患時有説者以河隨時漲落自立春後凍解候人量水初至凡一寸則夏秋當至一尺頗為信驗謂之信水非時暴漲謂之客水隨決隨塞瀕河苦之至是河決大名館陶殿中丞李仲昌請自澶州商胡河穿六塔渠入橫隴故道以披其勢富弼是其䇿詔發三十萬丁修六塔河以回河道以仲昌提舉河渠翰材學士歐陽修三上疏力諫其不可行帝不聽發明唐憲元和十三年書浚龍首池綱目譏之甚矣驕侈之念未易克也災異迭見未果修為而役民之事已駸駸乎不可遏獨不思夫廣南盜發士卒暴露攻陷城邑民無寧居僅克逋誅未聞撫馭此正勞心焦思講求致理之時豈宜髙枕面肆宴安者哉等而上之正使外邦臣服河北克清四海寧謐在聖人處此猶且兢兢業業圖惟克終況十僅一二者乎書修六塔河則慶厯之駕已稅於此矣易曰其亡其亡君子得不為仁宗惜之丙申嘉祐元年春正月帝有疾文彥博等宿衛禁中二月帝疾瘳正月朔帝御大慶殿受朝暴感風眩趣行禮而罷翌日文彥博召內侍都知史志聰問狀對曰禁密不敢漏言彥博叱曰爾曹出入禁闥不令宰相知天子起居欲何為邪自今疾勢增損必以告不爾當行軍法又與劉沆富弼謀啓醮于大慶殿因留宿殿廬志聰白無故事彥博曰此豈論故事邪因赦死罪以下令輔臣禱天地宗廟社稷知開封府王素夜叩宫門上變彥博不使入明旦有言禁卒告都虞候欲為亂劉沆欲捕治彥博召都指揮使許懷德問都虞候何如人懷德稱其願可保彥博曰然則卒有怨誣之耳當亟誅之以靖衆乃請沆判狀尾斬卒于軍門北京留守賈昌朝素惡富弼隂結內侍武繼隆令司天官二人言國家不當穿河于北方致上體不安後數日二人又上言請皇后同聽治亦繼隆所教也志聰以其狀白執政彥博視而懷之徐召二人詰之曰天文變異汝職所當言也何得輒預國家大事汝罪當族二人懼色變彥博曰觀汝直狂愚耳未忍治汝罪自今無得復然二人退乃出狀示同列同列皆憤怒曰奴敢爾僣言何不斬之彥博曰斬之則事彰灼於中宫不安衆皆曰善既而議遣司天官定六塔方位復使二人往繼隆白請留之彥博曰彼本不敢妄言有教之者耳繼隆默不敢對二人至六塔恐治前罪更言六塔在東北非正北也二月帝疾愈御延和殿彥博等還私第當是時京師業業賴彥博弼持重衆心乃安已而劉沆白帝曰陛下違豫時彥博擅斬告反者彥博以沆判呈帝乃解發明是時仁宗有疾民心遑遑謀變者衆苟非文富諸賢宿衛禁中盡心調護則帝位易矣豈不甚可畏哉故綱目特表而出之蓋豫之也廣義仁宗有疾中外疑之況羣邪投間抵隙者不勝其衆于時若非潞公砥柱其間則仁宗或不能保厥躬矣易曰以杞包瓜含章有隕自天潞公有焉閏三月以王堯臣參知政事程戡為樞密副使戡以文彥博親故改授副使以唐介知諫院御史吳中復請召還唐介文彥博因言于帝曰介頃言臣事多中臣病其問雖有風聞之誤然當時責之太深請如中復奏乃召介知諫院時稱彥博長者夏四月河決六塔流殿中丞李仲昌于英州李仲昌等塞商胡北流入六塔河不能容是夕復決溺兵夫漂芻藁不可勝計詔三司判官沈立往行視內侍劉恢遂奏六塔之役水死者數千萬人穿土干犯忌禁且河口乃趙征村於國姓御名有嫌而大興鍾斸非便詔罷其役令御史吳中復內侍鄧守恭置獄于澶劾仲昌等違詔旨不俟秋冬塞北流以致決潰于是流仲昌于英州餘各被謫有差發明修六塔仲昌之謀耳今而河決六塔則仲昌不為無罪曷為以無罪例書然謀之者仲昌主之者富弼況河決亦天變之告戒非人力所能為當恐懼修省以答天變可也夫何君臣之間殊未見更相戒飭之意而徒流仲昌置獄犴豈應變之道哉綱目書流仲昌而不著所坐君臣交罪之也廣義六塔之役富鄭公是之文忠公非之至是將四月矣竟無成功而徒損人夫國用者則二公識見亦於是可占矣五月罷知諫院范鎮帝性寬仁言事者競為激訐鎮獨務引大體非關朝廷安危生民利疚則未嘗言及帝暴疾文彥博因請帝建儲帝許之會疾瘳而止至是鎮奮然曰天下事尚有大於此者乎即上疏曰置諫官者為宗廟社稷計也諫官而不以宗廟社稷計事陛下是愛死嗜利之人臣不為也方陛下不豫海內皇皇莫之所為陛下獨以祖宗後裔為念是為宗廟社稷之慮至深且明也昔太祖舍其子而立太宗天下之大公也真宗以周王薨養宗子于宫中天下之大慮也願以太祖之心行真宗故事拔近屬賢者優其禮秩而試以政事俟有聖嗣復遣還邸章纍上不報執政諭之曰奈何效希名于進之人鎮貽書曰比天象見變當有急兵鎮義當死職不可死亂兵之下此乃鎮擇死之時尚何顧希名干進之嫌哉因復上疏言之愈切除兼侍御史知雜事鎮以言不從固辭執政諭之曰今間言已入為之甚難鎮曰事當論其是非不當問其難易諸公謂今日難于前日安知異日不難於今日乎凡見帝面陳者三因泣下帝亦泣謂曰朕知卿忠當更俟二三年鎮前後章凡十九上待命百餘日鬚髮皆白朝廷知不可奪乃罷知諫院改紏察在京刑獄時并州通判司馬光亦言建儲事且勸鎮以死爭之翰林學士歐陽修殿中侍御史包拯吕景初趙知知制誥吳奎劉敞等皆上疏力請於是文彥博富弼王堯臣等相繼勸帝早定大計皆不見聽發明歐陽氏曰人主之善馭下者嘗欲聞難言之言然後下無隱情上無壅聽姦宄不作禍亂不生難言之言人主當聞況易言之言乎蓋建儲國家之大計不可不早為之定仁宗春秋鼎盛儲位久曠范鎮職當言責理合備陳仁宗不聽則已罷而黜之夫豈從善之道哉故書罷知諫院范鎮則其以無故而罷諫臣之意可見矣廣義建儲國之大事也大事者何大本也大本不立則懷姦蓄慝者誰無覬覦之心哉范公不顧成敗利鈍而極言其事者此仁人君子正誼明道而無謀利計功之説也復之六四曰中行獨復范公有焉六月大水社稷壇壞詔求直言京師自四月大雨水注安上門門關折壞官私廬舍數萬區諸路言江河決溢河北尤甚至是雨壞太社太稷壇詔羣臣實封言闕失而分遣使賑恤被傷者發明大水者隂逆而與怨氣并之所致也水壞社稷其異大矣人君行逆德者必致隂沴仁宗無其逆德而致隂沴何蓋太子社稷之本是時太子未建社稷未固故水壞社稷者得非此之慮歟仁宗但能詔求直言而不能反求諸心則是雖有求言之名而無求言之實災變何從而弭哉所謂人無釁焉妖不妄作信斯言矣廣義范鎮諫立儲則凡言之直者無有直于此也至是又詔求直言是猶舍玉而求玉也奚可哉彗出紫微垣秋八月朔日食罷狄青判陳州以韓琦為樞密使青在樞府每出入士卒輒指目以相矜誇至壅馬足不得行又其家數有光怪會大水青避于相國寺行止殿上人情頗疑翰林學士歐陽修言青掌國機密而得軍情非國家之利知制誥劉敞出知揚州陛辭亦言陛下幸愛青不如出之以全其終帝然之乃以使相判陳州冬十一月王德用罷以賈昌朝為樞密使德用將家子習知軍中情偽善以恩撫下故多得士心雖屢臨邉境未嘗親矢石督攻戰而名聞四夷閭閻婦女小兒亦呼為黑王相公十二月劉沆免以曽公亮參知政事沆初以附張貴妃得進數為御史論列沆深疾之因上言自慶厯後臺諫官用事朝廷命令之出事無當否悉論之必勝而後已専務決人隂私莫辨之事以中傷士大夫執政畏其言進擢尤速請行御史遷次之格滿二嵗者與知州帝從之會御史范師道趙抃嵗滿求補郡沆引格出之中丞張忭曰天子耳目之官而宰相挾私斥之可乎上疏極言沆遂出知應天沆長於吏事然任數善刺探權近過失隂持之以軒輊取事以包拯知開封府拯立朝剛毅貴戚宦官為之斂手聞者皆憚之以其笑比黃河清童稚婦女亦知其名呼曰包待制京師為之語曰關節不到有閻羅包老丁酉二年春二月祁公杜衍卒衍臨終作遺疏略曰無以久安而忽邉防無以既富而輕財用宜早建儲副以安人心語不及私諡正獻以翰林學士歐陽修知貢舉帝切於求士進士諸科一舉而獲選者至千三百餘人士子習尚險怪竒澀之文號太學體張方平嘗言文章之變與政通邇來文格日失其舊各出新意相勝為竒驅扇浮薄重虧雅俗非取賢斂才備治具之意雖下詔揭示而士習不改翰林學士歐陽修知貢舉痛抑新體凡為時所推譽者皆被黜榜出澆薄之士候修晨朝聚譟于馬首街司邏卒不能禁止然自是場屋之習遂為之變三月護國節度使同平章事狄青卒青為人慎密寡言其計事必審中機會而後發行師先正部伍明賞罰與士卒同飢寒勞苦雖敵猝犯之無一士敢先後者故數有功嘗有持狄梁公畫像及告身詣青獻之以為青之逺祖青謝之曰一時遭際安敢自附梁公厚贈其人而遣之卒諡武襄發明杜衍卒而不具其官狄青則具其官豈厚於青而薄於衍乎徇名責實也然則青衍之優劣叛矣綱目之豫奪嚴矣夏四月幽州地大震壞城郭覆壓死者數萬人發明自元年至是災異多矣如大水社稷壇壞彗出紫微垣八月朔日食幽州地大震綱目備書于册而宋之君臣殊未見其修德應天之實而皆視為泛常恝不之顧可勝惜哉即綱目之所書驗當時之得失則政治之得失從可知矣秋八月諸州置廣惠倉初天下沒入户絶田官自粥之至是韓琦請留勿粥募人耕而收其租别為倉貯之以給州縣之老幼貧疾不能自存者謂之廣惠倉以提刑領其事嵗終具出納之數上三司每千户留田租百石以是為差户寡而田有餘則粥如舊廣義普天之下莫非王土率土之濵莫非王臣是知田與民皆國之所有者韓魏公請置廣惠倉于諸州則是因其人之田而給養其民所謂惠而不費者也易曰弗損益之無咎貞吉利有攸往得臣無家魏公其庶幾矣九月契丹來聘遣翰林學士胡宿報之初契丹主宗真來求御容會卒乃已至是洪基復遣使來求欲成先志帝遣張忭報聘且諭之曰昔文成第也弟先面兄於禮為順今南朝乃伯父之尊當先致恭於是復使其臣蕭扈來致其像宿乃奉御容如契丹契丹主具儀仗迎謁及瞻視驚肅再拜謂左右曰我若生中國不過與之持鞭持蓋一都虞候耳發明凡夷狄書來聘嘉其慕義自通故進之也契丹之來求御容耳能求御容則是有尊敬中國之心故特進之綱目於契丹侵邉則書入境於契丹求地則書來求於契丹求通則書來聘見君子之心樂與人為善因其侵夏則黜之因其慕義則進之其謹尊卑之辨嚴上下之防審矣然來而後報禮之宜耳故又書遣報以豫之冬十二月詔間嵗一舉士置明經科進士諸科待試京師者恆六七千人一不幸有故不應詔往往沈淪十數年以此毁行干進者不可勝數王洙侍邇英閣講周禮至三年大比帝曰古者選士如此今率四五嵗一下詔故士有抑而不得進者孰若栽其數而屢舉也下有司議咸請易以間嵗之法則無滯才之歎薦舉數既減半主司易以詳較得士必精於是下詔間嵗貢舉進士諸科悉解舊額之半增設明經試法凡明兩經或三經五經各問大義十條兩經通八三經通六五經通五為合格兼以論語孝經䇿時務三條出身與進士等未幾以登第者衆驟致顯擢復下詔定其遷次之格以裁抑之發明間嵗舉士置明經科則仁宗求賢之心可謂切矣人才疊出豈不宜哉特書于册蓋豫之也戊戌三年夏六月文彥博賈昌朝罷彥博以老求罷以使相判河南封潞國公知諫院陳旭等恐昌朝遂代為相乃率僚屬上言昌朝通交女謁建大第别創客位以待宦者宦官有矯制者樞密院釋不治昌朝竟出判許州昌朝在侍從中多得名譽及執政始不為正人所與以韓琦同平章事宋庠田況為樞密使張忭為副使時羣臣皆以建儲為言帝依違不決琦既相乘間進曰皇嗣者天下安危之所繫自昔禍亂之起皆由䇿不早定陛下何不擇宗室之賢以為宗廟社稷計帝曰後宫將有就館者姑待之已而又生女琦懷漢書孔光傳以進曰成帝無嗣立弟之子彼中才之主猶能如是況陛下乎願以太祖之心為心則無不可者帝不答以包拯為御史中丞拯言東宫虛位日久天下以為憂夫萬物皆有根本而太子者天下之根本也根本不立禍孰大焉帝曰卿欲誰立拯曰臣非材備位所以乞豫建太子者為宗廟萬世計耳陛下問臣欲誰立是疑臣也臣年七十且無子非邀後福者帝喜曰徐當議之廣義嗚呼堯舜以子不肖即傳於賢者正以見天下者天下之天下非己之所得私也苟不傳賢以定之無乃啓天下後世禍亂之源乎堯舜所以為萬世法者此也仁宗無子而貪戀厥位其私孰甚焉迹其本心是營莬裘者之不若也何足貴哉秋八月朔日食王堯臣卒下溪蠻降先是彭仕羲陳乞內屬帝遣殿中丞雷簡夫往視之簡夫度仕羲未可專用恩澤誘化至則督諸將進兵築明溪上下二寨據其險要拓取故地五百餘里仕羲計窮遂歸連嵗所掠甲仗士卒詔辰州還其弩及銅柱自是復通中國然黠鷔益甚冬閏十二月罷伎吏知州軍提點刑獄己亥四年春正月朔日食用牲于社知制誥劉敞言社者上公之神羣隂之長故日食則伐鼓于社所以責上公退羣隂今反祠而請之是屈天子之禮從諸侯之制抑陽扶隂降尊貶重非承天戒尊朝廷之義也發明元旦日食非小變也仁宗未聞修己之實而徒用牲于社失禮甚焉夫社者羣隂之長日食伐鼓所以退羣隂春秋用牲于社君子譏之今反祠而請之則是屈天子之禮從諸侯之制抑陽扶隂降尊貶重其不可也明矣綱目前書日食而用牲于社此書日食而用牲于社然則當時羣臣無敢言其非能言其非者惟劉敞一人而已帝不見聽惜哉二月更𣙜茶法自茶為官𣙜民私蓄盜販皆有禁臘茶之禁尤嚴園户困於征取官司並緣侵擾因陷罪戾至破産逃匿者嵗比有之著作佐郎何鬲三班奉職王嘉麟皆上書請罷給茶本錢縱園户貿易而官收租錢與所在征算歸𣙜貨務以償邉糴之費可以疏利源寬民力富粥韓琦曽公亮然其䇿請于帝行之下三司議三司言茶課給本收利所獲甚微而煩擾為患園户輸納侵害日甚小民趨利犯法益繁宜約嵗入息錢之數均賦於民恣其買賣所在收算而不給本錢遂詔弛舊禁俾通商利凡嵗輸緡錢三十三萬八千有竒謂之租錢與諸路本錢悉儲以待邉糴自是惟臘茶禁如舊餘茶肆行天下矣論者又謂茶户困於輸錢良民賦不時入刑亦及之商賈利薄販鬻者少必致嵗額不登經費日􅕚翰林學士歐陽修知制誥劉敞皆請除前令帝不聽夏四月封周世宗後柴詠為崇義公給田十頃以奉周祀從著作佐郎何鬲請也廣義昔成王封微子於宋聖人定為書之一篇其公平廣大氣象至今藹然可想綱目書曰夏四月封周世宗後柴詠為崇義公且給田十頃以奉周祀則是周成王復見于宋也仁宗其賢矣乎五月除猜防大臣條約前兩制不許至執政私第執政所薦士不得充臺官詔並除之秋七月放宫人帝以月食幾盡修隂教以應天變前後出宫女幾五百人時後宫得幸者十人謂之十閣而劉氏黃氏在十閣中尤驕恣通請謁御史中丞韓絳密以聞帝曰非卿言朕不知也當審驗之遂并出二人發明月食者隂道之虧仁宗以月食幾盡修隂教以應天變前後出宫女幾五百人則其應天之變為如何哉大書特書蓋豫之也田況罷況寬厚明敏有文武材好論天下事言甚明切以疾罷冬十月大祫于太廟帝將親祫下禮官集議東向之位同判宗正寺趙良規請正太祖東向之位而知太常禮院韓維請如故事虛東向之位便時禮官不敢決乃與待制以上及臺諫官同議太祖為受命之君然僖祖以降四廟在上故大祫止列昭穆而虛東向魏晉以來已用此禮詔從之十一月汝南王允讓卒追封濮王允讓天資渾厚內寬外莊知太宗正寺二十年宗子有好學者勉進之以善若不率教則勸戒之至不變始正其罪故皆畏服及薨諡安懿以其子宗實育宫中故恤典有加召河南處士邵雍不至雍河南人少時自雄其才慷慨欲樹功名於書無所不讀始為學即堅苦刻勵寒不爐暑不扇夜不就枕者數年既而踰河汾涉淮漢周流齊魯宋鄭久之幡然來歸曰道在是矣遂不復出初北海李之才受易於河南穆修修受於种放而放受之於陳摶源流最逺之才攝共城令雍時居母憂于蘇門山躬㸑以養父之才叩門來謁勞苦之曰好學篤志果何似雍曰簡䇿迹外未有適也之才曰君非迹簡䇿者其如物理之學何他日則又曰物理之學學矣不有性命之學乎雍再拜願受業之才遂授以河圖洛書伏羲八卦六十四卦圖象雍由是探賾索隱妙悟神契玩心髙明深造曲暢遂衍伏羲先天之旨著書十餘萬言富弼司馬光吕公著諸賢居洛中雅敬雍恆相從遊為市園宅雍德氣粹然望之知其賢然不事表暴不設防畛羣居燕笑終日不為甚異人無貴賤少長一接以誠故賢者悅其德不賢者服其化留守王拱辰薦雍遺逸授將作主簿後復舉逸士補潁州團練推官皆固辭乃受命竟稱疾不之官發明書處士豫雍也雍躬逢盛世而以孔孟之道自樂於巳不以孔孟之道見屈於人誠蠱之上九衆方有為而獨不事王侯髙尚其事者也逮夫朝廷聘召力辭不就其泥塗軒冕之心著矣若雍者天下豈得而多見哉厥後卒老衡茅終身不仕而其名譽道德推重當時惡在其能仕宦也故書美之廣義或曰康節當治朝而召之不至者無乃不可乎曰康節非惡此而逃之也蓋其心樂乎道無德無喪心與道俱知有道之可貴而不知有官爵之可榮也譬猶魚樂乎水鳥欣於木皆出自然非由勉強然非深於通者孰能與於此哉庚子五年春正月鑿二股河自李仲昌貶河事久無議者河北都轉運使韓贄言四界首古大河所經宜浚二股渠分河流入金赤河可以紓決溢之患朝廷如其䇿役三千人幾月而成未幾又併五股而浚之發明魯人浚洙春秋譏之古之人君知民為國之本不作無益以勞民而使之耕食鑿飲無妨農時所以百姓充足倉廪富饒而長享雍熙之治也仁宗敬天勤民之心不為無有然前書修六塔河此書鑿二股河曽謂是役非民力乎蓋由中心無主易於惑動云爾民者國之根本斧其根則枝葉豈有不凋瘁者哉此君子所以深為仁宗惜也夏四月程戡免以孫抃為樞密副使戡與宋庠不合數爭議於帝前臺諫以為言帝不悅殿中侍御史吕誨復論戡結貴幸以致位乃免置寬恤民力司詔置于三司遣官分路訪寬恤民力事五月召王安石為三司度支判官安石臨川人好讀書善屬文曽鞏携其所撰以示歐陽修修為之延譽擢進士上第授淮南判官故事秩滿許獻文求試館職安石獨否調知鄞縣通判舒州文彥博為相薦其恬退乞不次進用以激奔競之風歐陽修薦為諫官安石皆以祖母年髙辭修以其須祿養復言于朝召為羣牧判官改度支判官安石議論髙竒能以辨博濟其説果於自用慨然有矯世變俗之志於是上萬言書其大要以為今天下之財力日以困窮風俗日以衰壞患在不知法度不法先王之政故也法先王之政者法其意而已法其意則吾所改易更革不至乎傾駭天下之耳目囂天下之口而固已合先王之政矣因天下之刀以生天下之財取天下之財以供天下之費自吉治世未嘗以財不足為患也患在治財無其道耳先是館閣之命屢下安石輒辭不起士大夫謂其無意於世恨不識其面朝廷每欲畀以美官惟患其不就也及赴是職聞者莫不喜悅吕祖謙曰安石變法之藴亦略見於此書特其學不用於嘉祐而盡用於熙寧世道升降之機識者於此三致意馬發明始之初六曰繫於金柅貞吉有攸往見凶羸豕孚蹢躅傳曰一隂始生靜正則吉往進則凶故以二義戎小人使不害於君子則有吉而無凶然其勢不可止也故以羸豕孚蹢躅曉君子使深為之備云古之聖人於一隂始生之時其道雖徴其勢必盛故謹微之意至於如此宋自用安石變更法制毒流四海其禍至耗宣靖而未巳然觀其所上之書則其矯世變俗之志昭然可見雖得遂志於熙豐其進實甚耗嘉祐綱目因其召用而特書于册者以明小人肇禍之始此正姤之初六羸豕晡躅之戒耳其謹微之意益深切哉廣義朱子綱目載李林甫柔佞多狡深結宦官嬪妃故得居相位今文潞文忠交薦安石之賢則君子反被其賣其姦豈林甫之可及哉書曰召者以見朝廷與一時羣賢皆被其愚又所以著其亂政之漸也易曰履霜堅氷至書曰始焰熖厥攸灼敘弗其絶詩曰維彼雨雪先集維霰皆安石之謂乎六月契丹新置國子監契丹主自即位求直言者再復詔設學養士頒五經傳疏置博士助教各一人歐陽修等上新唐書先是帝以劉煦等所撰唐史卑弱淺陋命翰林學士歐陽修端明殿學士宋祁刋修之曽公亮提舉其事十有七年而成凡二百二十五卷事增於前文省於舊修撰紀志表祁撰傳故事每書首止列官尊一人修以祁為先進且於唐書功多故各著其名以自異發明唐書何以曰新考之分注仁宗以劉煦等所撰唐史卑弱淺陋命修等刋修之故書曰新然事增於前文省於舊積之十有七年而始成蓋亦難矣綱目特書于册一以美帝之存心古典一以美修等迪君於美也其與上會計録者豈不大相懸絶哉各十一月宋庠免以曽公亮為樞密使庠前後所至以慎靜為治然愛信幼子縱其與小人逰殿中侍御史吕誨論庠昏惰乃罷判鄭州以張忭孫抃參知政事歐陽修陳旭趙槩為樞密副使辛丑六年春三月起復富弼同平章事弼固辭許之弼以母喪去位詔為罷春宴故事執政遭喪皆起復帝虛位五起之弼固辭終制且曰起復金革之變禮不可施於平世帝乃許之發明起復者乃金革之變禮非治世之常規無金革之變奪人之喪自奪其喪皆非也宋制執事遭喪皆起復則是背禮甚矣仁宗虛位五起而富弼固辭不就君子之存心有異於人信哉特書固辭深豫之也廣義大抵以道事君不以寵利移易其心者大臣之體也今鄭公以母喪去位君起之頻公辭之固是誠不以寵利易其心而深得大臣之體者也綱目紀其年月而大書于册者其垂訓之意至矣夏四月陳旭罷知諫院唐介趙抃御史范師道吕誨上疏論旭隂結宦者故得大用帝曰朕選用執政豈容內臣預議耶乃兩罷之旭知定州介等亦外補以包拯為樞密副使六月朔日食司天言當食六分之半食四分而雨羣臣欲援至和例稱賀同判尚書禮部司馬光言日之所照周遍華夷雲之所蔽至為近狹雖京師不見四方必有見者天意若曰人君為隂邪所蔽災慝甚明天下皆知其憂危而朝廷獨不知也食不滿分者乃厯官術數不精當治其罪亦非所以為賀也帝從之以司馬光知諫院光入對首言臣昔通判并州所言三章願陛下果斷力行帝沉思久之曰得非欲選宗室為繼嗣者乎此忠臣之言但人不敢及耳光對曰臣言此自謂必死不意陛下開納帝曰此何害古今皆有之光復以三劄子上其一論君德有三曰仁曰明曰武仁者非嫗煦姑息之謂興教化修政治養百姓利萬物此人君之仁也明者非煩苛伺察之謂知道誼識安危别賢愚辨是非此人君之明也武者非強亢暴戾之謂唯道所在斷之不疑姦不能惑佞不能移此人君之武也陛下天性慈惠謹微接下子育元元泛愛羣生雖古先聖王之仁殆無過過然踐祚垂四十年而朝廷紀綱猶有虧缺閭里窮民猶有怨歎意者羣臣不能宣揚聖化將陛下之於三德萬分一亦有所未盡歟臣伏見陛下推心御物端拱淵默羣臣各以其意有所敷奏陛下不復詢訪利害一皆可之誠使陛下左右前後之臣皆忠實正人則善矣或有一姦邪在焉則豈可不為之寒心哉其二論致治之道有三曰任官曰信賞曰必罰國家御羣臣之道纍日月以進秩循資塗而授任苟日月積久則不問其人之賢愚而置髙位資塗相值則不問其人之能否而居重職非特如是而已國家采名不采實誅文不誅意夫以名行賞則天下飾名以求功以文行罰則天下巧文以逃罪陛下誠能慎選在位之士而用之有功則增秩加賞而勿徙其官無功則降黜廢棄而更求能者有罪則流竄刑誅而勿加寬貸其三言養兵之術務精不務多赦書害多而利少非國家之善政又進五規曰保業惜時逺謀重微務實又言故事凡臣僚上殿奏事悉屏左右內臣今內臣不過去御坐數步君臣對問之言皆可聽聞恐漏泄機事非便帝皆嘉納之詔自今止令御藥侍臣及扶侍四人立殿角以備宣喚餘悉屏之以王安石知制誥安石自度支判官改同修起居注辭之吏日閣門吏賫敕就付之拒不受吏隨而拜之則避于厠吏置敕於案而去又遣還之上章至八九乃受及徑除知制誥安石遂不復辭矣秋八月以曽公亮同平章事張忭為樞密使胡宿為副使宿為人清慎忠實臨事不妄發既發亦不可回止其當重任尤能顧惜大體羣臣多務更張革弊宿曰變法古人所難不務守祖宗成法而徒紛紛無益於治也閏月䇿賢良方正直言極諫之士王介蘇軾蘇轍皆在舉中轍對切直胡宿力請黜之帝不許曰以直言召人奈何以直棄之乃收入第四等王安石意轍右宰相專攻人主比之谷永不肯撰詞韓琦曰此人謂宰相不足用欲得婁師德郝處浚而用之尚以谷永疑之乎改命沈遘為之詞審時有詔舍人院無得申請改除文字安石爭之曰如是則舍人不得復行其職而一聽大臣所為今大臣之弱者不敢為陛下守法而強者則挾上旨以造令諫官御史無敢逆其意者臣實懼焉語皆侵執政執政者不悅曽以母喪遂去職發明漢文二年書詔舉賢良方正直言極諫之士綱目美之蓋人君之德雖不一然敬天聽言乃其要者今仁宗乃能詔䇿賢良方正一舉而求賢聽言之意皆在其中天下之人自是欣躍感戴革故鼎新四海皆延丰采仁宗之德不亦善乎言曰直言諫曰極諫書之于册足為千古之美以歐陽修參知政事時韓琦為首相法令典故問曽公亮文學之事問修三人同心輔政百官奉法循理朝廷稱治修以兵民官吏財利之要中書所當知者集為總目遇事取視之不復求諸有司冬十月起復宗實知宗正寺固辭不拜羣臣以儲位未建為憂言者雖切而帝未之允司馬光上疏曰向者臣進豫建太子之説意謂即行今寂無所聞此必有小人言陛下春秋鼎盛何遽為此不祥之事小人無逺慮特飲倉卒之際援立其所厚善者耳定䇿國老門生天子之禍可勝言哉帝大感動曰送中書光見韓琦等曰諸公不及今定議異日禁中夜半出寸紙以某人為嗣則天下莫敢違琦等拱手曰敢不盡力時知江州吕誨亦上疏言之及琦入對以光誨二疏進讀帝遽曰朕有意久矣誰可者琦皇恐對曰此非臣輩所可議當出自聖擇帝曰宫中嘗食二子小者甚純近不慧大者可也琦請其名帝曰宗實琦等遂力贊之議乃定宗實天性篤孝好讀書不為燕嬉褻慢服御儉素如儒者時居濮王喪乃起復知宗正寺琦曰事若行不可中正陛下斷自不疑乞內中批出帝意不欲宫人知曰只中書行足矣命下宗實固辭乞終喪帝復以問琦琦對曰陛下既知其賢而選之今不敢遽當蓋器識逺大所以為賢也願固起之帝曰然發明是時宗實居父濮王之喪仁宗將起為嗣是以命知宗正宗實固辭乞終喪制則其賢可知矣故書固辭不拜以深豫之廣義大抵天下者天下之天下非人君之天下也昔者堯老而舜攝舜老而禹攝未聞堯舜之無子也特以其不肖而傳之于賢耳今也仁宗春秋既髙矣嫡嗣又無矣顧乃栖栖焉不肯建儲者何哉其心以為天意若錫吾胤則目可暝于晏駕之時所謂遺腹之植不猶愈於委裘之朝乎殊不知傳子傳賢皆出于天非人力之所能為也況仁宗既有遘疾之險又有猶子之賢于時不定儲二可乎此羣賢所以深懼而力請也壬寅七年春三月孫抃罷以趙槩參知政事吳奎為樞密副使夏四月樞密副使包拯卒拯性峭直耿介與人不苟合不一毫妄取平居無私書故人親黨于謁一切絶之然惡吏苛刻務敦厚于人未嘗不恕其飲食服用喜儉朴雖貴如布衣時卒贈禮部尚書諡孝肅發明包拯峭直耿介公正無私是誠宋室之賢臣也故卒而具官以著其公勤之績耳秋八月立宗實為皇子賜名曙九月進封巨鹿郡公宗實既終喪韓琦言宗正之命初出外人皆知必為皇子不若遂正其名帝從之琦至中書召翰林學士王圭草詔圭曰此大事也非面受旨不可明日請對曰海內望此舉久矣果出自聖意乎帝曰朕意決矣圭再拜賀始退而草詔詔下宗實復稱疾固辭章十餘上記室周孟陽請其故實實曰非敢徼福以避禍也孟陽曰今已有此迹設固辭不受中人别有所奉遂得燕安無患乎宗實始悟司馬光言于帝曰皇子辭不資之富至于旬月其賢於人逺矣然父召無諾君命召不俟駕願以臣子大義責之宜必入帝從之宗實遂受命將入宫戒其舍人曰謹守吾舍上有適嗣吾歸矣因肩輿赴召良賤不滿三十人行李蕭然唯書數厨而已中外相賀冬十月賜諸路錢助糴常平倉詔天下常平倉多所移用而不足以支凶年其令內藏庫三司共出緡錢一百萬下諸路助糴之發明蘇氏曰善治天下者必明於天下之情而後得御天下之術仁宗以常平移用不足以支凶年復詔出錢諸路助糴則其勤恤民隱之心可見矣合前後所書觀之則仁宗憂國之誠而綱目樂豫之意為可見爾後之治天下者當鑒於斯知府州折繼祖卒初繼祖欲解去州事下河東安撫使梁適體量適言折氏世襲此州比年監司一以條約繩之尤為煩密繼祖不自安故欲解去乞慰存之詔不許至是卒以其兄子克柔權領州事癸卯八年春三月帝崩巨鹿公曙即位尊皇后為皇太后赦帝暴疾崩於福寧殿皇后聞之悉斂諸門鑰置于前黎明召皇子入以遺詔令嗣位皇子驚再言曰曙不敢為因反走韓琦等共掖留之四月朔皇子即位欲亮隂三年命琦攝冢宰宰臣不可乃止史臣曰仁宗恭儉仁恕敬天重民有司嘗請以玉清舊址為苑帝曰吾奉先帝苑囿猶以為廣何以是為燕私嘗服浣濯帷帟衾裯多用繒絁嘗中夜飢思燒羊戒勿宣索曰恐膳夫自此戕賊物命以備不時之需大辟疑者皆令上讞嵗活千餘人每諭輔臣曰朕未嘗詈人以死況敢濫用刑乎四十二年之間吏治若偷惰而任事蔑殘刻之人刑法似縱弛而決獄多平允之士國未嘗無弊幸而不足以纍治世之體朝未嘗無小人而不足以勝善類之氣君臣上下惻怛之心忠厚之政所以培壅國基者厚矣子孫一矯其所為馴致于亂傳曰為人君止於仁帝誠無愧焉吕中曰國家之有天下強不如秦富不如隋形勢不如漢土地不如唐所恃者人心而已太祖肇之太宗真宗培之至仁宗四十二年深仁厚澤刑以不殺為威財以不畜為富兵以不用為功人才以不作聰明為賢以寬厚待民以恩禮待士夫而以至誠待夷狄蘇軾謂社稷長逺終必賴之者誠確論也廣義太抵文勝乎質史家之謬瑜不掩瑕斯為定論觀史臣吕氏之言固足以知仁宗之賢然無罪而廢正后飾非而謫諫官是誰之過與此有識君子所以不滿臣史臣吕中也帝有疾詔請皇太后權同聽政帝有暴疾詔請皇太后權同處分軍國事后乃御內東門小殿垂簾宰臣日奏事后性慈儉頗涉經史多援以決事中外章奏日數十上一一能記綱要有疑未決者則曰公輩更議之未嘗出己意檢柅曹氏及左右臣僕毫分不以假借官省肅然發明太后聽政固非清朝之令典是時英宗有疾而詔同聽政則非臨朝者比矣故書權同聽政以見非専輒之意也立皇后高氏后侍中瓊之曽孫母曹氏太后姊也故少育于宫中與帝同年生又俱撫育于太后仁宗嘗曰異日必以為配既長出宫婚于濮邸封京兆郡君生三子至是册為皇后五月以富弼為樞密使秋七月帝疾瘳帝疾甚舉措或改常度遇宦者尤少恩左右多不悅乃共為讒間兩宫遂成隙內外洶懼知諫院吕誨上書兩宫開陳大義詞旨深切多人所難言者然兩宫猶未釋然一日韓琦歐陽修奏事簾前太后嗚咽流涕且道所以琦曰此病故爾疾已必不然子疾母可不容之乎后意不解修進曰太后事先帝數十年仁德著于天下昔溫成之寵太后處之裕如今母子間反不能容邪后意稍和修復曰先帝在位久德澤在人故一日晏駕天下奉戴嗣君無敢異同者今太后一婦人臣等五六措大耳非先帝遺意天下誰肯聽從后默然久之琦進曰臣等在外聖躬若失調護太后不得辭其責后驚曰是何言我心更切也同列聞者莫不流汗後數日琦獨見帝帝曰太后待我少恩琦對曰自古聖帝明王不為少矣獨稱舜為大孝豈其餘盡不孝哉父母慈而子孝此常事不足道惟父母不慈而子不失孝乃為可稱但恐陛下事之未至矣父母豈有不慈者哉帝大感悟帝自六月不御殿至是初御紫宸殿見百官琦因請乘輿禱雨具素服以出人情大安廣義書傳曰大臣一身百責攸萃震撼擊撞欲其鎮定甘辛燥濕欲其調劑盤結紛錯欲其解紓黯暗汚濁欲其茹納然則事之震撼擊撞甘辛燥濕黯暗汚濁者孰有過于此哉今也韓吕歐陽各奮忠誠幹乾坤于再造復日月于既食非曠度洪量者能如是乎蓋易曰大車以載有攸往無咎其韓吕歐陽之謂乎契丹耶律元重反兵敗自殺契丹主尊寵其叔重元甚至賜以金劵免拜不名而重元隂懷異圖是月契丹主田于欒水之太子山重元子楚王尼嚕古與樞密同知蕭呼敦等四百人謀作亂敦睦官使耶律良上變契丹主召南院樞密使耶律仁先語之且急召尼嚕古仁先曰此曹凶逆臣固疑之陛下宜謹為備臣請帥衛士討之尼嚕古聞召知事泄遂誘脅弩手軍犯帷殿契丹主急欲走南北院仁先曰陛下若舍扈從而行敵必躡其後且南北大王心未可知乃止仁先環車為營折行馬為兵仗帥官屬近侍三十餘騎陳抵杻外使北院樞密使耶律伊遜等率宿衛士卒數千人與尼嚕古戰敵衆多降尼嚕古躍馬突出為近侍渤海阿蘇等射殺之重元被傷而退其黨謂呼敦等曰行宫無備宜乘夜劫之若候明日外援必至其誰從我呼敦曰第圍之勿令外軍得入彼何能為黎明而發何遲之有重元從之令四面巡警待旦遂奉重元僣位以呼敦為樞密使而率奚人二千薄行宫會五院部節度蕭塔喇聞召領兵適至仁先俟敵氣沮背營而陳乘便奮擊塔喇自外擾之其徒大奔追殺二十餘里重元走大漠嘆曰尼嚕古使我至此乃自殺黨與皆伏誅契丹主執仁先手曰平亂皆卿之力也加尚父進封宋王伊遜等加賞有差冬十月葬永昭陵御批續資治通鑑綱目卷五
