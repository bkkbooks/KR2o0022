body:
  text: 乾隆四十七年十一月御製續資治通鑑綱目内發明廣義題辭甚矣周禮等發明廣義之為誣而謬也大一統而斥偏安内中華而外夷狄此天地之常經古今之通義是故夷狄而中華則中華之中華而夷狄則夷狄之此亦春秋之法司馬光朱子所爲急急也兹發明廣義乃専以貴中華賤夷狄爲事貴中華賤夷狄猶可也至於吹毛求疵顛倒是非則不可而矢口謾罵誣白為黑又豈温良君子之所為哉嘗考遼金元三朝惟金世宗元世祖二帝最為賢明史册具在美不勝書而廣義則曰世宗固一世之賢君雖中華令主何以過之然羣臣不能将順其美以底大順要亦天厭其徳故使之有君無臣僅成一代之小康耳夫賢如金世宗而又責其無臣且謂天厭厥徳金世宗有何徳之可厭豈非中外之見芥蔕於胷腹好議論不樂成人之美乎又如金禁女眞人學南人衣飾一條金主謂從官曰女真舊風最為純直汝等當習學之不可忘此正敦尚節儉率由舊章發明乃云用夏變夷固為美事奚必禁而絶之特書曰禁深貶之也夫以遵舊制不忘本者而貶之尤為拘迂紕繆且自古變祖宗之章服制度者不數世而國勢衰弱元魏遼元已事可鍳彰彰甚明秉筆者獨不觀前史之事乎最其甚者䝉古額哷布格自歸於工都䝉古主釋不治其黨布拉噶等伏誅一事額哷布格世祖介弟也受命鎮和林乃敢搆逆興兵僭稱尊號其罪可勝誅乎元世祖以諸王乃太祖之裔不忍加戮惟誅布拉噶等此世祖之大度曲貸其死可謂韙矣乃發明謂世祖致令其弟僭立和林則所以處之未盡其道布格之悖未如象之頑而世祖處弟之友豈不有愧於舜乎云云其言尤為背謬夫象之傲不過不順於家所為鬩牆之釁耳額哷布格則儼然稱帝謀危宗社也其罪之輕重大小不待智者明之而猶謂不如象之頑乎益不然矣且春秋之義善善欲長從未有以堯舜責人者若象於舜升庸之後如額哷布格之所為舜亦未必復封之有庳而乃以此責元世祖非惟不公且不明矣又如書太子珍戩卒一條下載中庶子巴拜以其子阿巴齊入見諭之以毋讀䝉古書須習漢人文字初閲之以為太子珍戩今人毋讀䝉古書是忘本矣因重檢閲元史本傳則云中庶子巴拜以其子阿巴齊入見諭令入學巴拜即令其子入䝉古學逾年又見太子問讀何書其子以䝉古書對太子曰我命汝學漢人文字耳云云盖珍戩之意以䝉古人習䝉古書自其家傳舊學如今滿洲人之於清文童而習之不須入學始能也命學漢人文字則欲其兼通經史知古今事耳乃綱目刪改本文且云諭之以毋讀䝉古書則是毫釐千里而使後之讀綱目者竟以珍戩為忘本有是理乎總之是書之成乃成化時商輅修輯其後周禮續為發明張時泰又續為廣義附刻于後吹毛求疵顛倒是非甚至矢口謾罵誣白為黑其所闗于世道人心甚大昨既命皇子及軍機大臣量為刪去其破口者以符孔子春秋之義兹復舉其尤紕繆者數端用作題辭仍録是書卷端以存是非曲直之公以昭天命人心之正俾覧古者得以折衷焉雖然千萬年後寧無如周禮輩其人者之顛倒是非誣白為黑者乎吾于是知懼矣然而悠悠之口其亦不必懼而已矣
