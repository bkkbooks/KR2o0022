body:
  text: 欽定四庫全書御批續資治通鑑綱目卷十五起丙寅宋高宗紹興十六年盡壬午宋高宗紹興三十二年凡十七年丙寅十六年金皇統六年春正月行籍田禮先是知度州薛弼言州民朽柱中有文曰天下太平年秦檜大喜乞詔付史館於是修彌文以飾治具如鄉飲耕籍之類節節備舉為茍安餘杭之計自此不復巡幸江上而祥瑞之奏日聞矣發明甚矣宋之苟安嵗月而無必奮之志也益曰吁戒哉敬戒無虞罔失法度罔逰於逸罔淫於樂任賢勿二去邪勿疑疑謀勿成百志惟熙罔違道以千百姓之譽罔咈百姓以從己之欲無怠無荒四夷來王古之君臣更相戒飭以成冶功而未間同趨於宴安之轍也高宗忘恢復之志秦檜獻逢迎之詞自此茍安之事日作而祥瑞之奏日聞矣吁安有賢明之君忠良之臣而忘親釋怨以行此文具之事哉綱目書行籍田禮文無貶辭乃深貶之耳夏五月金韓企先卒企先為金右丞相每欲為官擇人專以培植奬勸後進為己任推轂士類甄别人物一時臺諌多君子號稱賢相廣義觀分注所載之實則知敵國之有人矣嗚呼天下治亂係宰相當徽宗之時則有蔡京王黼欽宗紹亂則有張邦昌高宗南渡則有黃潛善汪伯彥其觀金之企先猶天淵之相絶耳金曷得不興而宋也曷得不衰乎六月金殺其翰林學士宇文虗中金人重虗中之才號為國師而虗中持才輕肆好譏訕凡見女真人輒以礦鹵日之貴人逹官積不能平至是唐古酬等告虗中謀反有司鞫治無狀乃羅織虗中家圖書為反具虗中曰死自吾分至於圖籍南來士大夫家家有之翰林直學士髙士談圖書尤多於我家豈亦反耶有司承順風旨并殺士談於是虗中與老幼百口同日焚死士談瓊孫也發明按分注則虗中無罪為唐古酬等所譛而羅織以害之也故稱國以殺而不去其官以見金之失政矣蓋虗中叛宋降金乃亂賊耳曷不書誅而書殺彼虗中誠難逃背逆之罪然金誅之為無名故書殺也雖然虗中叛宋而降金欲保富貴於役齒今不旋踵而罹禍然則背主降讐者果何益哉廣義姦臣降敵而不能逃天網之密者虗中士談是也綱目書此其為叛臣之戒昭矣秋九月金劉豫死發明尹氏曰所貴乎士君子者以其審於出處之際明於去就之義者也武王行大義平殘賊舉天下莫或非之伯夷叔齊乃獨奮然耻其所為不食周粟而死若二子者豈好死而惡生哉誠以君臣天地之大義亘古今而不可泯故寧死而不屈耳自世道堙微士君子不明於大節故有忍耻蒙垢仕非其地者劉豫在建炎初固嘗出仕於朝後知濟南府當其敵騎縱橫四郊多壘豫宜死守城邑保障山東誠足嘉尚之洎敵甫退之後豫既不能扞禦不於此時引身而退乃復偷生茍免服為臣虜雖僣立齊國然亦稱臣奉貢而犬馬之矣金以憑陵徑捍之師一旦崛起席捲中原據有宋土士君子稍有仁心者必羞見其靣目安有拜伏於前為之臣子受其爵食其祿而不知愧耻者哉豫以一身事二姓大節已虧况嘗稱兵犯順率金寇宋又君子之所深病者固宜直筆深貶之也觀綱目所書金劉豫死則豫之失身於金盡東海之波不足以泄其耻矣士君子之立身至此豈不深可歎哉如漢書莾大夫揚雄死同意廣義劉豫者宋臣也綱目何以繫之於金死者庶人之稱也劉豫嘗為齊帝矣何以曰死曰豫固宋臣繫之金者羲絶於宋也以死書者誅其叛逆而庶人之也嗚呼嚴哉冬十二月金遣使如西遼西遼殺之先是回紇遣使入貢於金言耶律逹實與其國鄰逹實已死金遣鈕祐祿罕努與使俱往遼主遇之於野罕努語不遜遼主怒而殺之廣義抑考西遼與金亦不共戴天者也殺金之使不亦宜乎丁卯十七年金皇統七年春正月以李若國參知政事何若簽書樞密院事二月李若谷罷三月以假拂參知政事何若罷夏四月以汪勃簽書樞密院事金主亶殺其文武從官十餘人金主自即位以來委政於尼瑪哈烏布烏珠雖初年國家多故而吏清政簡百姓樂業既而其后費摩氏干政朝官往往因之以取宰相金主欲立繼嗣為后所制心不能平因縱酒自遣酗怒至於手創侍臣至是宴便殿醉殺户部尚書宗禮無何又殺橫海節度使田玨左司郎中奚毅翰林待制邢具瞻及王植髙鳯庭王效趙益興龔夷鑒等發明稱國以殺者所以著其擅殺之也傳曰義繫於殺而見殺者之是非有不足紀則止書其官曹殺其大夫宋殺其大夫是也義繫於人則兼書其名氏楚殺其大夫得臣陳殺其大夫泄野之類是也金主制於晨牝心不能平縱酒自遣酗怒殺人此何理耶詩云刑于寡妻至於兄弟以御于家邦金主不能刑于寡妻安能至于兄弟以御于家邦哉明此然後得好惡之公矣廣義抑觀亶為后所制而反移怒於郡臣果何理哉綱目書此所以著金政之不綱也五月安置提舉江州太平觀洪皓於英州秦檜惡皓饒州通判李勤因誣皓作欺世飛語乃責濠州團練副使英州安置秋八月故相趙鼎卒於吉陽軍鼎潛居深處門人故吏皆不敢通問惟廣西帥張宗元時饋醪米會降旨趙鼎李光遇赦不不檢舉且令本軍月具存亡申省鼎遣人語其子汾曰秦檜必欲殺我我死汝曹無患不爾禍及一家矣自書墓中石記鄉里及除拜嵗月且書銘旌云身騎箕尾歸天上氣作山河壯木朝遺言其子乞歸葬遂不食而死天下聞而悲之鼎為相專以固本為先以為本固而後敵可圖讐可復惜其見忌于檜齎志以沒然中興賢相鼎為稱首發明凡卒故官録賢也趙鼎當國步危疑之際𢎞濟艱難獻可替否內足國用外籌軍旅誠中興之賢相也賊檜讒忌貶竄遐方兹因迫抑齎志以沒豈不深可惜哉時鼎罷相既久而猶書故相者罷之非罪不與其罷也此亦書法之深意廣義汾注載降旨趙鼎李光遇赦永不檢舉且令本軍月具存亡申省觀此則知當時國命皆執於姦臣檜賊之手髙宗特擁虛器而已悲夫九月罷四川宣撫副使鄭剛中剛中治蜀有方略秦檜忌之使人求其隂事召還責貴陽軍安置未幾四川宣撫司亦罷發明孔子曰臧文仲其竊位者與知栁下惠之賢而不與共立也蓋文仲蔽賢聖人罪之何况忌賢而又扼抑之乎秦檜惡洪皓而安置英州忌剛中而罷黜其職此蓋小人殘忍之心勝耳嗚呼在朝之賢忌而擯棄在野之賢欲其薦引固甚難矣藢賢之罪小忌賢之罪大檜誠臧文仲之罪人也綱目備書而其義自見廣義分注載剛中治蜀頗有方略秦檜忌之觀此則知賊檜之心直欲銷宋而後已講和特其餌耳嗚呼宋何負於檜哉冬十月朔日食十二月金及蒙古和初逹蘭既誅其子勝花都郎君率其父故部曲以叛與蒙古通蒙古益強烏珠討之連年不能克乃與之議和割西平河以北二十七國寨與之嵗遺牛羊米豆且册立其長敖拉貝勒為蒙輔國王不受自號大蒙古國至是始和嵗遺甚厚於是蒙古自稱祖元皇帝改元天興發明書金及蒙古和以見欲和者金也蒙古拒金不屈則見蒙古之浸強金伐蒙古不克則見女貞之漸弱識者可以觀二國之興亡矣戊辰十八年金皇統八年春二月假拂罷拂聞趙鼎死於海南為之歎息秦檜怒侍御史余堯弼論拂與小臣私交漏泄政機遂罷為資政殿學士尋落職興國軍居住三月以秦熺知樞密院事秦檜問敕令所刪定官胡寧曰兒子近除外議如何寧曰以為必不襲蔡京之迹檜怒之寧宏弟也夏四月朔日食秦熺罷為觀文殿學士兼侍讀位次右僕射熺乞避父子共政也尋加少保發明秦熺檜之飬子不學無術驟登政府此固髙宗溺愛不明之失及熺能辭避位次僕射則是未嘗辭之也故綱目不曰罷秦熺而曰秦熺罷以見黜陟之令聽其在彼髙宗亦無如之何也已書之所以著其輕褻名器庇豢姦邪之罪耳吁五月放浙東副總管李顯忠於台州顯忠熟知西邊山川險昜因上恢復䇿秦檜惡之降官奉祠台州居住發明孟子曰言無實不祥不祥之實蔽賢者當之夫顯忠之放初無所因由上恢復之䇿見忤秦檜故耳然則恢復之事為時大諱而不足以言矣吁小人之心毒非蛇蝎而毒于蛇蝎威非狼虎而威于狼虎詎不深可畏哉髙宗恭己南靣受制姦諛天下之事浸不可為矣書之所以哀之也六月金以完顔亮平章政事亮本名都古嚕訥太祖子烏布子為人慓急猜忌殘其任數自以己與金主同為太祖孫常懷覬望及為中京留守專立威以壓伏小人結明安蕭裕每與論天下事裕傾險揣知其意因曰留守先太師太祖長子德望如此人心天意宜有所屬誠有志舉大事願竭力以從亮喜遂與謀議及入為右丞進平章務攬持權柄用其腹心為省臺要職引裕為兵部侍郎秋七月寬諸郡雜稅帝曰人知取之為取而不知豫之為取若稍與展免俟家給人足稅斂自然易辦於是蠲廬光二州上貢錢未汀漳二州秋稅處州三縣被水民家紬絹卾州舊額絹各一年又蠲四川積貸常平錢三十萬緡京西路請佃田租及州縣場務稅錢發明治國以養民為本養民以寬恤為先自喪亂以來東南之民疲於供饋水旱繼作弗克存生帝能惻其懷念特寬雜稅然後民得盡力於農畝而仰事俯畜之有餘矣誠仁人之量王者之心也綱目特書乃所以不沒其善耳八月汪勃罷以詹大方簽書樞密院事九月詹大方卒冬十月以余堯弼簽書樞密院事金烏珠卒金自尼瑪哈死逹蘭富勒呼等皆有自為之意烏布獨立不能如之何使無烏珠則國勢殆矣故其國論功以為尼瑪哈後惟烏珠一人耳十一月竄胡銓于海南秦檜諷司諌羅汝楫論銓飾非橫議竄新州同郡王廷圭嘗以詩贈銓坐流辰州新州守張隸承檜旨論銓與客唱酬謗訕怨望詔送海南編管以隸提舉湖北常平至官一日卒時洪皓在英州閩人倪察為守聞隸以巧中遷官取使節欲效之即使人伺隙捕皓家奴置獄中釀成其罪未及發而察卒事乃解十二月金以完顔亮為右丞相亮生日金主遣近侍局直長大興國以司馬光畫像王陶罕廄馬賜之后亦附賜禮物金主聞之怒杖興國而奪回賜物亮本懷不軌疑畏愈甚發明是時亮既畜篡逆之心兹因奪回賜物逆謀益決金主不能鑒之於微惜哉故曰臣弒其君子弒其父非一朝一夕之故其所由來者漸矣由辨之不早辨也故特書以著其基禍之始云己巳十九年金皇統九年十二月以後廢主亮天德元年春三月朔日食夏五月金出完顔亮於行臺秋九月復召入平章政事金主以完顔亮為太保領三省事四月壬申夜大風雨雷電震壞金主寢殿鴟尾有火入寢內燒緯幔金主趨别殿避之越五日有龍鬪於榆林河水大風壞民居官舍瓦木人畜皆飄揚十數里死傷者數百人五月以天變肆赦命翰林學士張鈞草詔參知政事蕭肄摘其語以為誹謗金主殺鈞且問誰使為之左丞相宗賢曰都古嚕訥使之金主不悅遂出亮亮過中京與留守蕭裕定約而去九月至良鄉召還莫測其故大恐及至復拜平章謀逆益甚發明是時完顔亮逆節既萌金主因天變之異出之行臺其庶幾矣夫何行至良鄉尋復召用則是促之使叛耳既懷嫌隙豈宜復用乎易曰亂之所生也則言語以為階君不密則失臣臣不密則失身幾事不密則害成是以君子慎密而不出也金主酷信逆亮疑而復釋則是幾事不密所以愈益其篡竊之心也是故亂臣賊子要當制之於切矣微其微不謹其盛難制深可畏哉綱目書此垂戒冬十月金主亶殺其弟胙王常勝遂殺其后費摩氏金宰臣議遷遼陽渤海之民於燕南近侍高夀星等當遷訴於費摩后后白金主金主怒遂杖平章政事秉德石丞唐古辨而殺左司郎中薩哈壽星等竟不遷秉德辨二人怨望遂與大理卿烏達謀廢立烏達以告完顔亮一日亮與辨語因問曰若舉大事誰可立者辨曰胙王常勝乎問其次曰鄧王子阿林亮曰阿林屬疏安得立辨曰公豈有意耶亮曰果不得已捨我其誰於是旦夕相與密謀護衛將軍特斯疑之以告費摩后后白金主金主怒召辨謂曰爾與亮謀何事將如我何杖之亮因此忌常勝阿林惡特斯會河南兵士孫進作亂自稱皇弟阿襌大王而金主之弟止有常勝扎拉亮乘此構常勝扎拉阿林達蘭特斯皆殺之金主積怒於后遂亦殺之而召胙王妃薩摩入宫繼之又殺烏庫哩氏及瓜爾佳氏及張氏發明孔子曰不逆詐不億不信抑亦先覺者是賢乎完顔亮朵頤金鼎緣非一日而所忌者常勝費摩耳兹因亮譖無先覺之明相繼而殺謂之何哉蓋莫親於兄弟而殺其弟莫厚於夫婦而殺其后以親為疏以厚為薄宜乎有以來逆亮之弒也是以國君棄三綱則必有篡奪之禍金主之謂也十二月金完顏亮弒其主亶而自立護衛十人長布薩呼圖舊受烏布恩圖克坦額呼楚克亮姻家亮皆使為內應大興國嘗以羅小藏屬亮得為尚書省令史亮度興國被杖怨望使羅卜藏結興國內應興國給事寢殿夜嘗取符鑰歸家十二月丁巳乘呼圖額呼楚克內直作變夜二鼓興國以符鑰啓門亮與妹壻圖克坦貞平章政事秉德左丞唐古辨大理卿烏達羅卜藏等以刀藏衣下入宫門者以辨乃國壻亮又至親不疑而納之及殿門衛士始覺有變亮等抽刀劫之莫敢動遂入寢殿金主常置佩刀於榻是夜興國先取刀投榻下金主求刀不得額呼楚克先進刃呼圖次之金主頓仆亮前手刃之血濺滿其面與衣金主既殂秉德等未有所屬呼圖曰始者議立平章今復何疑秉德遂與羣臣奉亮即位詐以金主欲議立后召大臣因殺曹國王宗敏左丞相宗賢以秉德為左丞相唐古辨為右丞相烏達為平章政事諡費摩后為悼平皇后廢亶為東昏王大赦改元發明金人逞其兵力據有中原其國族自相戕殺乃亂之本是故金亶殺其文武從官殺其子殺其弟殺其后與夫完顏良弒殺其主皆詳書於册所以見君臣大義順之者昌逆之者亡昭然天冠地履之不可紊也前史止載完顏亮弒其君完顏亶至綱目始正名定罪其餘僣竊之誅略同此類皆所以扶三綱立人極使天下後世亂臣賊子知所懼其垂訓也大矣臣故因而論之庚午二年年金天德二年春正月殿司軍士施全刺秦檜不克檜殺之檜趨朝殿前司後軍使臣施全挾刃於道遮檜肩輿刺之不中捕送大理檜親鞫之全對曰舉天下皆欲殺敵人汝獨不肯故我欲殺汝也詔磔於市自是檜每出列五十兵持長梃以自衛發明賊檜姦邪人所共憤施全杖義刺檜其志可嘉然曷為不書討而書刺蓋全不勝一朝之忿亡其身以及其親不以討有罪之例與之也然全之死前史皆書誅而此變文書殺者檜固有罪不豫其討有罪也綱目循名責實而豫奪之旨公矣廣義施全刺秦檜而本朝綱目不書曰盜昔者聶政殺俠纍而文公綱目乃書曰盜者何曰施全聶政不同也俠纍秦檜亦異也觀全對檜之辭至今直氣凛然則知其為烈丈夫矣豈聶政之流哉特其勢不在己故不免於刺耳施全得預機務也必行誅討何以刺為綱目所以豫之而不盜者此金主尊其嫡母圖克坦氏母大氏皆為太后圖克坦氏遇下有恩意與大氏相得至歡金主弒亶圖克坦氏曰帝雖失道人臣豈可至此金主銜之至是追尊烏布為帝廟號德宗二母俱尊為大后圖克坦氏居東宫號永壽宫大氏居西宫號永寧宫圖克坦后生日酒酣大氏起為夀圖克坦后與諸公主宗婦語大氏跪者久之金主怒而出明日召與圖克坦后語者杖之大氏以為不可金主曰今日之事豈能尚如前日耶三月以余堯弼參知政事巫伋簽書樞密院事遣堯弼使金賀即位也及還金主以上皇玉帶附遺於帝其祕書郎張仲軻曰此希世之寶也金主曰江南之地他日當為我有此置之外府耳仲軻由是知金主有南侵之意遂每事先意逢之下李光子孟堅於大理獄流之峽州責降徽猷閣直學士胡寅等官有差光在瓊嘗作私史其仲子孟堅為所親陸升之言之升之許其事秦檜命兩浙轉運副使曹泳究實泳言孟堅省記父光所作小史語涉譏謗送大理寺獄成詔光遇赦永不檢舉孟堅除名編管峽州於是胡寅程瑀潘良貴宗頴張燾許欣賀允中吳元許八人皆緣坐責降有差有從政郎楊煒常州通判沈長卿舊與李光言和戎非便和雷州王躍求內徙李光俱坐貶又有太常主簿吳元美作夏二子傳指蚊蠅也其鄉人告之以為譏毁大臣且言元美與李光交故其亭號潛光檜大怒竄之容州發明甚矣小人之營私也罪人不孥先王大禁賊檜因憤孟堅私史之故羅織繫獄流之峽州胡寅等緣坐皆為責降夫復何罪嗚呼衛寒莫如重裘止謗莫如自修己有過則彼言當矣己無過則彼言妄矣反求諸身益加砥礪奚必憤其私議而疾之乎綱目書此詞煩而不殺其義蓋可見矣夏四月置力田科募民耕兩淮田從知廬州吳逵請也金主亮大殺其宗室初亮在熙宗世見太宗諸子盛強忌之及即位遂與蕭裕謀殺之又以前左丞相秉德首謀廢立而不即勸進銜之將盡誅焉於是豫教尚書省令史蕭玉上變遂召領三省事阿嚕左丞相唐古辨判大宗正寺呼爾察繫鞠至則殺之因遣使如東京殺留守阿林北京殺留守呼拉布南京殺領行臺事秉德并誅其親屬復殺太宗子孫七十餘人尼瑪哈子孫三十餘人諸宗室五十餘人太宗尼瑪哈後皆絶而烏達蕭裕蕭玉等皆受重賞梁又令玉子尚主曰朕無以報卿使朕女為卿男婦代朕事卿也冬十月金主亮殺其左副元帥薩里罕等夷其族亮復忌舍音諸子盛強及宗室勳舊大臣欲盡除之乃諷都元帥府令史約索誣飾上變遂殺薩里罕及景祖孫穆里延舍音子博濟及其族百數十人以魏王威台孫呼爾察好修飾亦族之發明逆亮殘忌之心至是益甚矣既忌太宗諸子盛強而大殺其宗室復忌舍音諸子盛強而殺薩里罕殺其身而又夷其族自非殘暴酷虐之至者弗克忍為民罔常懷懷於有仁逆亮欲篡位則弒其君惡盛強則赤其族欲為久安長治之計既平內患遂謀併吞厥後世宗甫立身且不保吁逆亮見忌宗室卒為宗室所圖孰謂果無天道乎不在顓臾而在蕭牆之內也故直書以著其惡秦檜有疾詔執政赴檜第議事十二月甲子檜始朝命肩輿入宫門二孫塤堪扶掖升殿不拜發明嗚呼高宗誠可謂不知薰蕕之别者矣君薨百官總已以聽於冡宰三年者嗣君居諒隂之中故也時宋非居諒隂帝又非有疾病胡為高枕自肆溺於宴安間因檜疾使臣赴第則是挈全國之萬機皆決於檜而高宗不可一日無檜者也高宗忘親釋怨委政姦臣而恣其敗壞豈不深可歎哉故書秦檜有疾若至尊然者所以譏高宗尊寵姦回書詔執政赴檜第議事所以著高宗挈國授賊之意辛未二十一年金天德三年春正月金置國子監二月以巫伋為金國祈請使伋至金首請迎靖康帝歸國金主曰不知歸後何處頓放伋唯唯而退發明逆亮弒君篡國罪不可赦不可親也女真與宋世讐不共戴天不可忘也前遣使賀即位此遣使迎欽宗直書於册譏宋之釋國怨親仇讐也蓋怨莫重於父母之讐有父母之讐而不知怨乃欲以屈己請之也則人倫廢天理滅矣又何有於其國哉三月金大營宫室於燕金主稍習經史慕中國朝著之尊密有遷都意遂下詔求直言而上書者多謂上京僻在一隅不若徙燕以應天地之中與金主意合乃遣左丞相張浩右丞相張通古等調諸路夫匠築燕京宫室城周九里三步其宫室一依汴京制度運一木之費至二十萬牽一車之力至五百人宫殿之飾遍傳黃金而後間以五采金屑飛空如落雪一殿之費以億萬計成而復毁務極菙麗發明不曰營而曰大營志土木之盛也無益妄費民不聊生逆亮之不亡其國顧不幸哉故直書以著其奢縱之罪焉耳夏五月金主亮納其叔母阿蘭及宗婦於宫阿蘭亮叔曹王阿里布妻也亮殺阿里布而納之封為昭妃命圖克坦貞語宰相曰朕嗣續未廣前所誅黨人諸婦多朕中表親宜選納焉宰相乃奏請行之遂納阿嚕子蘇爾圖呼嚕子呼喇勒和碩台秉德弟嘉哩四人之妻於宫尋封嘉哩妻高氏為修儀崇義節度使烏達妻唐古鼎格舊嘗與亮私及為帝鼎格使侍婢來朝亮諷使殺烏達許以為后鼎格初不忍亮訹之曰不殺汝夫將族滅汝家鼎格大恐縊殺烏達即納之宫中封貴妃大愛幸後與舊家奴姦賜死又使祕書監完顔文出其妻唐古實格以為麗妃使伊喇補出其妻富察伊徹而納之伊徹亮姊之女也發明娶妻不娶同姓者為逺嫌也豈論同源與否哉亮納叔母宗婦名分甚明又非漢劉聰納劉殷二女之比瀆倫甚矣亮肆其凶惡身為篡逆大殺宗室悍然不顧豈復知有叔母宗婦哉書之蓋以著其罪之難逭耳彛倫雜亂烏可與論人道乎秋七月除薪米稅八月太傳鎮南武安寧國節度使咸平王韓世忠卒世忠性戅直勇敢忠義事關廟社必流涕極言屢詆和議觸秦檜嗜義輕財錫賚悉分將士持軍嚴重與士卒同甘苦器伏規畫精絶過人嘗中毒矢入骨以強弩括取之十指俱全四不能動刀痕箭瘢如刻畫然知人善奬用成閔解元劉寶等起行伍秉將旄皆其部曲也及解兵罷政卧家凡十年至是卒孝宗朝追封蘄王諡忠武子彥直彥質彥古皆以才見用發明世忠勳業卓冠一時至於忠精誠確尤為難及宋史書世忠卒而不書其爵李燾長編書太傅寧國節度使而不書其位號通鑑續編闕而不書史法固無義例也至綱目備載其爵諡位號大書於册以見褒崇之意君子固當參考觀之然後知書法詳略皆有深意存乎其間毋但以作史常法視之也與唐書郭子儀卒同意冬十一月余堯弼罷壬申二十二年金天德四年春三月編管王庶子之竒之荀於嶺南初庶卒於貶所其子之竒之荀撫棺而哭曰秦檜秦檜此讐必報親舊皆掩其口曰禍未已也至是為人所告坐謗朝廷編管於梅容州又以直龍圖閣葉三省監都作院王逺嘗通書王庶及趙鼎力詆和議安置三省於筠州逺於高州發明王庶為賊檜搆陷客死遐荒則其私忿既逞斯可已矣又何必逮其子而編管之乎此蓋小人忌刻之心勝不至於覆人之宗絶人之祀而不止也嗚呼君子不幸而處昏亂之朝小人恣橫正道湮沒不惟身不可保抑且子孫受禍哀哉綱目直書於册所以深罪當時垂戒後世之意切矣夏四月巫伋罷以章復簽書樞密院事伋與秦檜居同里一日檜語伋曰里中有何新事伋曰有一術士自鄉里來頗能論命檜色變曰是人言公何日拜相伋惶恐而退中丞章復聞之即劾伋隂懷異意遂罷五月襄陽大水平地五尺漢水冒城而入秋九月章復罷冬十月以宋朴簽書樞密院事十二月金主亮召濟南尹烏祿妻烏凌阿氏未至自殺葛王烏祿時為濟南尹烏凌阿氏儀容整肅亮召之乃謂烏祿曰我不行上必殺王我當自勉不以相纍也遂召王府臣僕曰為我禱東嶽使皇天后土明監我心行至良鄉得間自殺發明夫婦人倫之大綱君臣天地之大義妻之事夫猶臣之事君妻之事夫則雖夫亡而不再醮守夫婦之義也臣之事君則雖國亡而不再仕守君臣之義也故曰忠臣不事二君貞女不更二夫烏凌阿氏之被召以為不行則纍其夫相從則背其義由是徐至良鄉乘間自殺既不失其身又不纍其夫是誠兩全而無害者矣易曰婦人貞吉從一而終也禮曰無别無義禽獸之道也烏凌阿全節死逆亮獨無愧乎蓋逆亮傷敗彛倫滅絶天理又可以人道望之哉據事直書所以豫烏凌阿罪逆亮也癸酉二十三年金貞元元年春三月金遷都於燕金主自上京至燕京初備法駕下詔改元親選良家子百三十人充後宫以燕列國之名不當為京師號遂改燕京為中都大興府汴京為南京削上京之名止稱會寧府又改中京大定府為北京而東京遼陽府西京大同府如舊以王循友知建康府循友知鎮江上書乞加秦檜九錫檜喜而遷之踰年檜以循友罪其族黨安置藤州夏四月金太后大氏卒金主遷都於燕親屬皆從留圖克坦太后於會寧圖克坦后憂懼每中使至必易衣以俟命大氏在燕常思念圖克坦后病篤以不得見圖克坦后為恨將死謂金主曰汝以我之故不令永夀宫偕來我死必迎致之事之當如事我五月潼川大水平地丈五尺死者甚衆冬十月宋朴罷以史才簽書樞密院事甲戌二十四年金貞元二年春正月地震發明水與地皆隂質其驗諸政事亦隂象也前書襄陽大水次書潼川大水此書地震憸邪在位兵戎竊發之機也是時賊檜當國毒流縉紳逆亮都燕漸謀南冦得非此之應歟宋之君臣略未見其兢業自修之實又未見其防姦禦侮之謀災異迭見視為泛常豈不深可惜乎即綱目之所書觀之則當時政治之得失亦可見矣金右丞相蕭裕謀反坐誅裕在相位恃功專恣金主倚信之他相仰承而已裕以金主猜忌忍殺恐禍及遂與蕭豐嘉努等謀立故遼主豫王延禧之孫事覺伏誅發明逆亮篡國以來如殺宗室如殺薩里罕皆書殺而未嘗書誅此書誅者原情定罪也金亮任蕭裕之專而蕭裕懷廢立之意故既書謀反則必正以坐誅之名亂臣賊子不討將接迹於天下矣豈因逆亮之故而遂廢討逆之公哉然曷為不去其官裕為宰相况又得君不能盡心敷治而乃遽懷逆謀書官正所以見其罪也厥旨微矣夏五月朔日食金始置交鈔庫金以銅少造鈔引一貫二貫三貫四貫五貫十貫五等謂之大鈔一伯二伯三伯五伯七伯五等謂之小鈔與錢並用以七年為限納舊易新諸路置官庫受之每貫取工墨錢十五文公私便焉六月史才罷以魏師遜簽書樞密院事秋七月張俊卒俊握兵最早屢立戰功帝於諸將中眷注特厚然忌劉錡附秦檜殺嶽飛為世所鄙薄焉發明張俊屢立戰功得君最專豈無官爵之可書乎然忌劉錡附秦檜殺嶽飛此固小人之所為也故卒而削去其官所以深貶之耳以敷文閣待制秦塤修撰實録院初知舉魏師遜等議以秦熺子塤為榜首上讀其䇿覺所用皆檜熺語遂進張孝祥第一而塤第三時檜之子姪姻黨皆擢高第天下切齒至是以塤修撰實録院祖父孫三世同領史職前此未有也廣義分注云祖父孫三世同領史職前此未有者皆言秦檜自知其惡之稔故引子孫任史職以掩之也噫檜之計亦姦矣其如天下後世何然後知檜之姦乃所以為拙也八月禁百官避輪對秦檜擅政以來屏塞人言蔽上耳目一時獻言者非誦檜功德則訐人語言以中傷善類欲有言者恐觸忌諱僅論銷金布翠乞禁鹿胎冠子之類以塞責而已故皆避免輪對至是上乃諭執政曰百官輪對正欲聞所未聞近輪對者多謁告避免可令檢舉約束冬十一月魏師遜罷以施巨參知政事鄭仲熊簽書樞密院事自秦檜專國士大夫有名望者悉屏之逺方凡齷齪委靡之徒一言契合即登政府稍出一語輒斥去之不異奴𨽻故自万俟卨罷至此十年參預政事者才四人而已加秦熺少傅封嘉國公金主亮納其諸從姊妹於宫夀寧縣主實庫斡里雅布女也靜樂縣主布拉及實訥烏珠之女也舒庫爾額爾衮之女也混同縣君蘇嚕克沁及其妹伊都阿嚕之女也皆亮之從姊妹郕國夫人重節富勒呼之女孫亮之姪也張定安妻鼐喇古太后大氏之兄嫂也富魯和卓薩喀之妹也皆有夫亮無所忌恥皆召與之私分屬諸妃位下蘇嚕克沁最得幸每召必親候廊下立久則坐舒爾庫膝上凡宫人在外有夫者初猶分番出入後乃盡遣其夫往會寧不聽出外每幸婦人必奏樂撤幃或妃嬪列坐輒率意淫亂使共觀常於卧內遍設地衣倮逐為戲發明亮纂賊也本無足責然據有中土僣號稱尊故其所為亦不容盡略是以前書納叔母及宗婦次書召烏凌阿氏此書納其諸從姊妹皆以著其雜亂之醜也夫同姓尚不可為况叔母乎宗婦尚為不可况姊妹乎據事直書惡自見矣十二月西遼耶律伊哷死其妹布沙堪權國事子幼故也布沙堪自號承天皇太后諡伊呼曰仁宗乙亥二十五年金貞元三年夏四月施巨罷五月朔日食六月鄭仲熊罷以湯思退簽書樞密院事改嶽州為純州嶽陽軍為華陽軍或言嶽州乃嶽飛駐軍之地又與其姓同乞改之蓋以媚秦檜也嶽州人謂飛駐軍乃卾州於我州何與而改之廣義嗚呼小人中傷善類不至於聲銷影沉不止也且嶽武穆既薨其子壻皆殁足可以遂賊檜之姦志矣今也姓同州名果何害耶先正文公謂小人之心私而刻彼賊檜殆有甚焉者也然則君子不幸而遇此則將若之何哉蓋度其勢可除則乘時亟行誅討否則奉身退避如韓世忠者不亦善乎金汴京火金主隂冇南侵之意乃謀遷汴遣完顔長寧為南京留守經畫之既而大火宫室盡焚金主大怒杖殺長寧發明是時金將南侵謀遷於汴既而大火宫室盡焚則天厭其德不能久享國祚之意可見矣孰謂天道無知而可以忽乎哉綱目不書事應而事應已在其中然後知人心天命不可誣耳噫秋八月下趙鼎子汾等於大理獄秦檜於一德格天閣書趙鼎李光胡銓三人姓名必欲殺之及鼎死而憾不已江西運判張常先箋注前帥張宗元與張浚詩言於朝其詞連逮者數十家將誣以不軌而盡去之會汪召錫告宗室知泉州令襟觀檜家廟記口誦君子之澤五世而斬謫居汀州檜乃諷殿中侍御史徐嚞論趙汾與令襟飲别厚贐必有姦謀詔送汾令襟大理鞫問使汾自誣與張浚李光胡寅胡銓等五十三人謀大逆獄成而檜病不能書矣發明賊檜殘忌之心至是愈烈矣前書下李光子書下孟堅於大理獄次書編管王庶子於嶺南此趙鼎子汾等於大理獄則是獄犴頻置延及無辜李光王庶趙鼎既卒而猶憾之不已禍及子孫其罪可勝誅哉若檜者存一日則貽害一日妬賢之心老而彌篤矣一書再書深罪之也以董德元參知政事秦檜門人冬十月徙洪皓於袁州未至卒皓居英州九年始復朝奉郎徙袁州至南雄卒卒後一日秦檜死皓久在北庭為金人所敬既歸金人至必問皓為何官居何地不幸為檜所忌不死於敵國而死於讒慝聞者悼之廣義皓在金國抱印符卧起十五年金人啖以美官略不動心身雖在金心不忘宋常以大讐未復為耻其視子卿之節無愧焉噫子卿歸漢而功輝麟閣洪皓歸宋而竄死遐方其與子卿不同有如此者君子為之長太息也進封秦檜為建康郡王加其子熺少師並致仕是夕檜死檜病帝幸其第問焉無一語惟流涕而已熺奏請代居相位者為誰帝曰此事卿不當與帝還宫命沈虛中草檜及熺制並令致仕熺夜遣塤與右司員外郎林一飛宗正丞鄭柟見其黨殿中侍御史徐嚞右正言張扶謀請己為相檜卒遺表云願陛下固鄰國之歡盟謹國是之搖動贈申王諡忠獻檜居相位十九年倡和誤國忘讐斁倫包藏禍心劫制君父隂結內侍及醫師王繼先伺上微旨動靜必具知之郡國事惟申省無至上前者性隂險深阻如崖穽不可測同列論事上前未嘗力辨但以一二語傾擠之俾帝自怒一時忠臣良將誅鋤略盡其玩鈍無耻者率為檜用爭以誣陷善類為功凡無罪可狀者則曰立黨沽名曰訕謗曰指斥甚則曰有無君心章疏皆檜自操以授言官識之者曰此老秦筆也晚年殘忍尤甚屢興大獄察事之卒布滿京城稍議之者即捕治中以深文如知饒州洪興祖作程瑀論語解序引不使大臣怨乎不以即以為譏已毁其板編管興祖於昭州京西運副魏安行嘗為鏤梓亦編管於欽州其羅織人類此執政惟取備員甫入輒出惟深德王次翁厯四年始出之立久任之説士淹滯失職有十年不解者然附之則立與擢用開門受賂富敵於國外國珍寶死猶及門檜每事與帝爭勝曹筠言水漲詔逐之檜升為從官周葵欲言梁汝嘉檜不待帝言即改除之猶是張扶請檜乘金根車吕原中獻秦城王氣詩其勢漸不可制檜既死帝謂楊存中曰朕今日始免防檜逆謀矣朱熹曰紹興之初賢才並用紀綱復張諸將屢以捷告恢復之勢蓋十八九金人於是始露和議以阻吾計而宰相秦檜歸自金庭獨以長樂梓宫藉口攘却衆謀熒惑主聽使和議翕然以定而不可破士大夫狃於積衷之俗見國家無事而檜與其徒皆享成功無後患顧以忘讐忍辱為事理之當然嗚呼始則唱邪謀以悮國中則挾敵勢以要君使人倫不明人心不正而末流之弊遺君後親無所不至此檜之罪所以上通於天萬死不足贖也發明史稱賊檜包藏禍心脅制君父戕殺忠良主和誤國雖擢髮不足以數其罪也是故雖殞於病悸然不免直書其死者忘親釋怨檜實尸之且又為之相也噫劉豫叛君則書曰死秦檜誤國則書曰死皆所以討亂臣誅賊子之特筆也然則惡惡之情見矣命義之戒嚴矣士君子擇善之致昭矣廣義或曰秦檜在金金人未嘗加以殊恩異禮反從而臣之及其歸也髙宗賜以恩禮之隆是何德金而欲忘宋之若是耶否則將以議和以叨富貴也曰非也抑嘗考夫姦檜之顛末矣彼於靖康二年二月金人執張叔夜及秦檜以去是年五月叔夜自殺於金軍秦檜偷生不死是在金也亦無忠義之事見書則其無君之心蓋不待主和議而後見原其所志不過欲為張邦昌劉豫耳蓋金人以邦昌之愚立為楚帝劉豫厚賂達蘭又得為帝於齊二人之逆罪不容誅矣當夫金人以和議餌宋檜則首倡之故逹蘭隂縱其還使主和議以忘宋斯時也逹蘭必以立豫者以許檜焉故檜堅執其議而衆言不能奪也厥後逹蘭所誅檜猶妄想前圖所以力阻恢復之謀殺害忠良而不顧焉曰邦昌以僣逆受誅劉豫以武穆計廢二人之事皆檜目擊者也檜尚欲為是邪知而欲為則謂之愚非姦也曰姦人者富貴利逹迷其心觀其用計則姦究其實境則愚然則姦者正所以愚也善乎東萊之論莊公曰始吾以莊公為至險終則以莊公為至拙檜之謂歟且夫檜之心非不知邦昌劉豫之禍也其心以為邦昌劉豫無能為者也使我堅主和議而訹宋以亡之則金人必德我而與之以國南北惟我與金而已金雖強倘我智力能禦亦未必如汴宋之亡不然甘為石晉可也曰何以知其然耶曰當檜縱還之初嘗言如欲天下無事須是南自南北自北耳况乎厯觀綱目所書或諸將復一州得一捷檜必嫉之甚則至欲畫淮為界以畀金間有言金人之情者必為之忌諱况於殺武穆之後檜則各遣諸將還鎮縱金以取土地一日對髙宗言事金之禮當如髙麗之事本朝則檜之微意蓋可見矣幸而天福宋胤絶其後嗣不得萬一遂其姦而死桓溫曰不能流芳百世亦當遺臭年其賊檜之謂乎綱目書曰是夕檜死者深憾其幸免於刑戮也金主亮迎其太后圖克坦氏至燕亮命以大房山雲峯寺為山陵遣右丞相布薩思恭等如會寧奉遷太祖太宗梓宫迎圖克坦后至流沙河亮親迎之命左右持杖二束跪太后前曰亮不孝久缺溫清願笞之后掖之曰今庶民有克家子尚且愛之不忍笞我有子如是寧忍笞乎叱杖者退既至居夀康宫亮事之外極恭順后起則自扶之常從輿輦徒行后所御物或自執之見者以為至孝雖太后亦信其誠廣義分注載亮事其后之禮得不感動於人耶逆亮狡詐如此雖親母尚信其誠况髙宗乎黜秦檜姻黨十一月釋趙汾及李孟堅王之竒等自便臺諌湯鵬舉等纍疏言秦檜之姦請逐其親黨詔安置户部侍郎曹泳於新州罷端明殿學士鄭仲熊等四人徙侍御史徐嚞正言張扶為他官知建康府王會等六人俱以諂附貪昌罷又竄吕願中等於逺州秦塤秦焞秦焆等俱以檜黨濫科革正之莫及張常先等八人並以告訐濫叨官爵送逺近編管尋釋趙汾奪二官與李孟堅王之竒等皆令自便廣義觀於此則知髙宗治檜黨於檜死之後者非不知檜之姦也特受其制而不敢為耳即易所謂輿説輻夫妻反目者也哀哉以魏良臣恭知政事十二月復張浚胡寅張九成等二十九人官徙李光胡銓於近州光移郴州銓移衡州光尋卒發明自賊檜搆陷善類延及無辜君子之受害亦多矣今而釋趙汾等自便復張浚等官徙李光等於近是皆革故鼎新收人心之大機也故備書以豫之二十六年金正隆元年春正月追復趙鼎鄭剛中等官二月魏良臣罷三月罷宰相兼樞密使以邊事已定也以万俟卨參知政事竄東平進士梁勛於逺州勛上書言金人必舉兵宜為之備帝怒編管勛於千里外州軍而下詔曰講和之䇿斷自朕志秦檜但能贊朕而已豈以存亡而渝定議耶近者無知之輩鼓倡浮言以惑衆聽至有偽撰詔命召用舊臣抗章公車妄議邉事朕甚駭之自今有此當重置典憲發明設險守國固王公之當然思患預防亦君子之宜然高宗忍恥事讐偷安茍且謂和議可以固守謂江南可以久居而祖宗之中原父母之深恨一切付之以不問但見賀正旦賀生辰賀即位稱臣奉貢恬然無恥殊不知金亮之目中久無江南矣梁勛度金必內侵上書設備是亦思患預防者貶斥於外謂之何哉此高宗所以卒老江南而無必為之志也綱目直書以著其拒諌之失廣義觀分注高宗之詔辭於以見高宗以和議定於中秦檜以和議倡於外高宗得秦檜以濟其欲秦檜得高宗以逞其姦故曰二人同心其利斷金向來恢復諸諌詎能入哉高宗庸懦無識於是詔蓋可見矣夏五月以沈該万俟卨為左右僕射並同平章事湯思退知樞密院事初秦檜病篤召董德元湯思退至卧內屬以後事各贈黃金千兩德元慮檜以為自外不敢辭思退慮檜以為期其死不敢受帝聞思退不受以為非檜黨遂信任之六月以程克俊參知政事靖康帝卒於金發明魯昭公薨於乾侯胡傳曰諸侯失國出奔衆矣鄭伯突為祭仲所逐入於櫟而復國衛侯術為孫寧所逐入於夷儀而復國昭公在外八年終以客死為天下笑故春秋詳録其所因以為後世戒欽宗受父之託不能死守社稷服為臣僕三十餘年以善而終豈非幸歟然必書靖康帝者不豫金之廢共主也其不曰崩者已失天下故貶而絶之也為人君者觀綱目所書卒於金之義知社稷之無常奉也亦必少警矣嗚呼可謂深切而著明矣命史館重修日歷以秦熺修不實也秋七月彗出井詔求直言八月程克俊罷以張綱參知政事綱初為給事中以秦檜用事遂致任卧家者二十餘年嘗書座右曰以直行己以正立朝以靜退高天下其篤守如此九月以陳誠之同知樞密院事冬十月復安置觀文殿大學士張浚於永州浚去國二十年天下士無賢不肖莫不傾心慕焉武夫健將言浚者必咨嗟嘆息至兒童婦女亦知有張都督金使至必問浚安在惟恐其復用而秦檜懼其正論害己令臺臣有所彈劾語必及浚謂為國賊必欲殺之檜死乃復觀文殿大學士判洪州時喪母將歸葬會星變求直言浚慮敵數年間勢必求釁用兵而吾方溺於晏安謂敵可信莫為之備沈該万俟卨居相位尤不厭天下望自以大臣義同休戚不敢以居喪為嫌乃上疏極言沈該万俟􅩲湯思退以敵未有釁而浚乃若禍在年嵗間者皆笑其狂臺諌湯鵬舉凌哲等論浚名在罪籍唱異議以動國是若使歸蜀恐或逺方生患復安置永州發明君子之事君義而已矣不以用舍而二其心不以存亡而易其節茍合義死生以之初不計其身家之利害也兹因彗出詔求直言浚條陳時事力詆姦臣見忤沈該之黨而乃復貶永州吁既求直言反忌言者則是以天變為玩戲之物而無警懼之心審矣直書於册不再貶而其義自見廣義分注載張浚自以大臣義同休戚不敢自隱其賢而必以其道者其忠誠可謂至矣然檜雖死而浚猶罹竄逐亦高宗懼聞恢復之一念也嗚呼浚遇高宗其不幸孰甚焉丁丑二十七年金正隆二年春二月以湯鵬舉參知政事三月万俟卨卒卨為相主和固位無異秦檜士論薄之發明高宗宰相書卒者僅數人李綱趙鼎書爵万俟卨不書爵卨不人道也何以言之夫宰相燮理隂陽幹旋造化股肱元首德撫匹夷固當公平正大而無一毫偏僻之失斯為宜也卨私憾嶽飛以傾之誤國主和君臣俱辱高宗茍能按罪行辟則卨豈容但已况其相業無聞如惡張浚言事之類此皆小人所為故綱目於其卒也削去其官以示貶耳若不别其賢否而概書之何以為豫奪之權衡哉夏六月以湯思退為尚書右僕射同平章事發明死万俟􅩲而相湯思退則是魯衛之政兄弟也又安足以贊襄治道黼黻皇猷哉高宗之命相僅如此則其弗克有為亦可知矣書之乃所以譏之也秋八月以湯鵬舉知樞密院事九月張綱罷以陳康伯參知政事冬十一月湯鵬舉免戊寅二十八年金正隆三年春二月以陳誠之知樞密院事王綸同知院事三月朔日食秋七月金以李通參知政事初金主亮召其幸臣祕書少監張仲軻左諫議大夫馬欽校書郎田與信等便殿侍坐金主謂仲軻曰漢之封疆不過七八千里今吾國幅貟萬里可謂大矣仲軻曰本朝疆土雖大而天下有四主若能一之乃為大矣金主曰彼且何罪而伐之仲軻曰臣聞宋人買馬修器械招納山東叛亡豈得謂無罪金主喜曰向者梁珫嘗為朕言宋有劉貴妃者姿質美艷今一舉而兩得之俗所謂行掉臂也江南聞我舉兵必逺竄耳欽與信皆對曰海島蠻越臣等皆知道路彼將安往金主曰然則天與我也朕舉兵滅宋逺不過二三年然後討平髙麗夏國一統之後論功遷秩分賞將士彼必忘勞矣時金主恃其纍世強盛欲大肆征伐以一天下嘗曰天下一家可以為正統及拜李通參知政事通揣知金主意遂與仲軻欽及近習羣小輩盛言江南富庶子女玉帛之多逢其意金主以通為謀主遂議興兵南侵九月以王剛中為四川制置使初剛中言敵國之情強則犯邊弱則請盟今勿計其強弱而先擇將帥搜士卒實邊儲備軍械加我數年國勢富強彼請盟則為漢文帝犯邊則為唐太宗上壯其言會西蜀謀帥帝曰無如王綱中矣遂有是命冬十月金營汴京金主亮遣其左承相張浩參政敬嗣暉如汴京營建宫室國子司業黃中使還上言金人治汴京必欲徙居以迫我不可不早為之備若彼果至汴則壯士健馬不數日可及境矣湯思退大怒左遷中官發明書營宫譏妄費也逆亮將謀併宋已非一日向自會寧而遷燕今自燕京而都汴其南侵之兆已盟矣而湯思退之徒方恃和好諱言用兵豈不深可歎哉下書籍諸路兵造戰具所以著其實也己卯二十九年金正隆四年春二月金籍諸路兵造戰具金主亮謀南侵乃造戰船於通州遣使籍諸路明安部族及契丹奚人不限丁數悉僉之二十四萬又僉中都南都中原渤海丁壯年二十以上五十以下皆籍之凡二十七萬雖親老丁多求一子留侍亦不聽又遣使分詣諸道總管府篤造兵器命諸路舊貯軍器並致於燕時又建汴宫修燕城民不能堪箭翎一尺至千錢村落間往往椎牛以供筋革至於烏鵲狗彘無不被害之者發明兵乃防姦之資戰乃禦侮之略是故黷武非春秋所貴息兵為君子所嘉亮籍衆兵造戰具初非防姦究又非禦暴客不過欲逞一時之私而懷吞併之心焉耳中國不競而為外邦所侮不能北向而一決徒恃和議諱言戰功豈不深可惜哉綱目特書所以惡金而哀宋也夏五月貶禮部侍郎孫道夫知綿州道夫使金還金主亮謂之曰歸白爾帝事我上國多有不誠今略舉二事爾民有逃入我境者邊吏皆即發還我民有叛入爾境者有司索之往往託詞不發一也爾於沿邊盜買鞍馬備戰具二也蓋欲南侵故先設此二事為辭道夫還具奏之帝曰朝廷待之甚厚彼以何名為兵端道夫曰彼身殺其君而奪之位興兵豈問有名湯思退沈該不以為然道夫每對帝輒言武事該疑其引用張浚忌之故貶發明明者能決幾微於未然智者能料禍患於將然故曰人無逺慮必有近憂時是金營汴宫而南侵之勢已成籍兵造器而南侵之機已肇况道夫使金逆亮親諭高宗何故溺愛讐敵而略不加意乎逆亮篡弒姦淫骨肉三綱絶而五倫廢安肯顧兩國之好而不背盟者哉道夫直言而被貶則非其罪為可知矣書以譏之宜也廣義大抵高宗南渡不過偷安而已當其被金南逐常懷北顧之憂而以大讐未復為恥可也故凡敵情之真偽敵勢之強弱敵國之治亂與其君臣之輯睦悖戾等事豈可一日而忘之耶今也道夫之歸金雖無一言以及邊事尚當詢其所以何如耳况以其指瑕造釁為言而奏哉今者既得其迹而乃恬不為慮決非中興之主也臣故曰高宗南渡不過偷安而已六月遣王綸使金帝聞金主亮有南侵意疑之使王綸往覘綸還入對言鄰國恭順和好無他皆陛下威德所致湯思退等皆賀帝曰中外之論皆欲沿邊屯戍軍馬移易將帥為進取之計萬一輕舉兵連禍結何時而已陳誠之罷沈該免秋七月以賀允中參知政事八月召監潭州南嶽廟朱熹不至熹徽州婺源人少有求道之志父松知饒州疾亟屬熹曰胡憲劉勉之劉子翬三人學有淵源吾所敬畏吾即死汝往事之熹奉以告而稟學焉既博求經傳復遍交當世有識之士及舉進士為泉州同安主簿罷歸聞延平李侗學於羅從彥得伊洛之正遂徒步往從之其學大要窮理致知反躬踐實而以居敬為主築室武夷山中四方遊學之士從之者如市上聞其賢故召之熹卒不至憲安國從子生而靜慤不妄笑語紹興中與勉之同入太學時禁伊洛之學憲與勉之求得程頥書潛抄默誦夜以繼日聞涪陵譙定受易學於頥二人往從受業久未有得定曰心為物漬故不有見惟學乃可明耳憲悟曰所謂學者非克己工夫耶自是一意下學不求人知一旦揖諸生歸崇安故山力田賣藥以奉其親從遊日衆號籍溪先生仕終祕書省正字朱熹嘗言從憲及勉之子翬三君子遊而事籍溪先生為久得其學為多勉之從譙定劉安世楊時受學卒業乃還崇安結草堂讀書其中力耕自給淡然無求於世惟與憲子翬日相往來講論學者踵至勉之隨其才器為説聖賢之道因以女妻熹門人號曰白水先生子翬韐仲子以父死國難痛憤致疾棄興化通判隱居武夷山中者十七年與憲勉之交相得每見講學外無雜言他所與逰皆知名士而期以任重致逺者朱熹而已熹初從子翬遊子翬以易之不逺復三言俾佩之終身學者稱為屏山先生發明不至何嘉其志也朱子師事李侗契其要領二程之道獨得其宗高宗既聞其賢即命召之朱子抱道自樂卒辭不至可謂甘性分於鼎飴視勢分於浮雲而漠然無有動於中者也君子人歟君子人也回視頗有一技一能而嘵嘵自鳴以為仕宦之捷徑者詎可同日語哉故夫書召以豫高宗之求賢書不至以豫朱子之樂道此皆綱目之所特筆也九月以湯思退陳康伯為尚書左右僕射並同平章事帝謂康伯曰卿靜重明敏一語不妄發真宰相也今與思退共政如有可否勿憚啇確康伯曰大臣論國事自當盡心若依阿植黨臣所不敢皇太后韋氏崩帝事后甚謹先意承志惟恐不及或一食稍減輒不勝憂懼常戒宫人曰太后年已高惟優遊無事起居適意即壽考康寧事有所闋慎勿令知第來白朕至是崩年八十矣諡曰顯仁冬十一月攢顯仁皇后十二月以王綸知樞密院事庚辰三十年金正隆五年春正月以葉義問同知樞密院事二月以普安郡王瑗為皇子更名瑋進封建王初帝知瑗之賢欲立為嗣恐太后意所不欲遲回久之及后崩帝問吏部尚書張燾以方今大計對曰儲嗣者國之本也天下大計無踰於此今兩邸名分宜早定帝喜曰朕懷此久矣開春當議典禮燾頓首謝至是利州提點刑獄范如圭掇至和嘉祐間名臣奏章凡三十六篇合為一書囊封以獻請斷以至公勿疑帝感悟即日下詔以普安郡王為皇子加思平郡王璩開府儀同三司判大宗正寺稱皇侄發明高宗仗義建立賢王邇者椒寢未繁册為宗社之本可謂始終不負公天下之心太宗視此烏能及哉綱目特書於册所以深美之耳夏六月王綸罷秋七月以葉義問知樞密院事朱倬參知政事倬初以張浚薦自宜興簿入對時方以劉豫為憂倬䇿其必敗帝大喜而秦檜惡之出為越州教授檜死倬知惠州陛辭因言前事帝問卿何久淹如此倬言為秦檜所扼帝愀然慰愈目送之且曰人不知卿惟朕獨知遂纍擢至中丞論事多所禆益帝信任之八月朔日食賀允中致仕九月以李寶為浙西副總管寶嘗陷金拔身自海道來歸至是召對詢以北事歷歷如數乃授官令於平江督海舟捍禦冬十二月湯思退有罪免侍御史陳俊卿論思退挾巧詐之心濟傾邪之術觀其所為多效秦檜蓋思退致身皆秦檜父子恩也宜置之憲典遂奉祠發明不曰免而曰有罪免貶絶之詞也思退姦邪之小人是乃秦檜之遺黨欺君誤國倣效成風豈宜宰正百官乎兹因臺臣之劾即免思退之官則庶幾可以泄人神之憤矣廣義或曰秦檜主和議誠有覬覦之心而其心又非思退之所知者思退復踵其姦何如曰秦檜固有覬覦之心思退踵之者不過欲如檜之富貴耳小人之喻於利何嘗知有君父耶俊卿論免思退其為高宗之幸豈淺鮮哉綱目書有罪者誅其姦於未死也初行會子戶部侍郎錢端禮被旨造會子儲見錢於城內外流轉其合發官錢並許兊會子輸左藏庫初行於兩浙遂通行諸州辛巳三十一年金正隆六年十月世宗雍大定元年春正月朔日食帝不受朝風雷大雨雪侍御史汪徹言春秋魯隱公時大雨震雷繼以雨雪孔子以八日之間再有大變謹而書之今一夕之間二異交至隂盛也今臣下無姦萌戚屬無乖剌而又無女謁之私意者殆為兵象乎願陛下飭大臣常謹於備邊也發明正旦日食大變也蓋日者衆陽之宗人君之表當正旦而食其異甚矣風為隂氣雷者陽氣之發雨雪者隂氣之凝時當正月雷未可以出而風雷此陽失節也雷已出則雪不當復降而大雨雪此隂氣縱也隂陽運動有常而無忒凡失其道人為感之也今陽失節而隂氣縱兵連禍結之機兆矣綱目災異必書雖不言其事應而事應具存惟明於天人相感之際響應之理則見君子所書之意矣二月分經義詩賦為兩科以取士禮部侍郎金安節言熙寧元豐以來經義詩賦廢興離合隨時更革近合科以來通經者苦賦體雕刻習賦者病經旨淵微心有弗精業難兼濟後進往往得志而老生宿儒多困也請復立兩科永為成憲從之三月以楊椿參知政事以陳康伯朱倬為尚書左右僕射並同平章事以吳拱知襄陽府先是陳康伯以金人必敗盟請早為之備及聞金人詔決欲敗盟乃召楊存中及三衙帥至都堂議舉兵又侍從臺諫集議康伯傳上旨曰今日更不論和與守直問戰當如何時上意雅欲視師內侍省都知張去為隂沮用兵且陳退避䇿中外妄傳幸閩蜀人情洶洶朱倬無一語康伯奏曰金敵敗盟天人共憤今日之事有進無退聖意堅決則將士之意自倍願分三衙禁旅助襄漢待其先發應之乃以利州西路都統制吳拱知襄陽部兵三千戍之拱玠之子也夏五月金主亮使人來求漢淮之地始聞靖康帝之喪金主亮嘗密隱畫工於奉使中俾寫臨安湖山以歸為屏而圖已之像䇿馬於吳山絶頂題詩其上有立馬吳山第一峯之句至是遣其簽書樞密院事高景山右司員外郎王全來賀天申節亮謂全曰汝見宋主即面數其焚南京宫室沿邊買馬招致叛亡之罪當令大臣來此朕將親詰之且索漢淮之地如不從則厲聲詆責之彼必不敢害汝蓋欲激怒以為南侵之名也又謂景山曰回日以全所言奏聞全至臨安一如金主之言以詆帝帝謂全曰聞公北方名家何乃如是全復曰趙桓今已死矣帝始聞淵聖崩遽起發哀而罷詔持斬衰三年上淵聖廟號曰欽宗發明始聞者因金使來而初得聞喪罪慢也蓋欽宗亦嘗君臨天下况為高宗之兄不幸客死金庭是乃宋之大耻且人生莫重於人倫人倫莫先於父兄今而上皇欽宗相繼殂落高宗僅能求還上皇太后邢氏之喪而付欽宗於不問夫復何説父母之讐不共戴天兄弟之讐不與同國高宗匿怨而事仇金豈不誤哉故直書始聞以深譏之廣義宋纍使至金何其卑屈也金遣使至宋何其倨傲也國步凌夷其可嘆乎汪徹論天變之應至是驗矣以吳璘為四川宣撫使六月以劉錡為江淮浙西制置使屯揚州時宿將無在者乃以錡為江淮浙西制置使節制逐路軍馬故遼人伊喇斡罕叛金圍臨潢初金主亮徴兵南侵使牌印素赫如西北路盡僉契丹丁壯契丹人曰西北路接近鄰國世世征伐相與讐怨若男丁盡從軍彼以兵來則盡係纍矣幸使者入朝言之素赫畏罪不敢言遂與牌印耶律娜等盡起男丁於是西北路招討司譯史薩巴與部衆殺招討使完顏烏色及素赫等而執耶律娜取招討使司貯甲三千遂反議立故遼主延禧子孫衆推都監老和尚為招討使山後山前諸羣牧皆應之咸平府穆昆瓜里舉兵據咸平繕完器甲出府庫財物募兵以應薩巴其勢益張金主亮使布薩呼圖等討之皆無功而薩巴自度大軍必相繼而至勢不可支謀歸於西遼乃率衆沿龍駒河西出薩巴既行而舊居山前者皆不欲往偽置六院節度使伊喇幹罕殺薩巴執老和尚等自為都元帥擁衆東還至臨潢府東南新羅塞東京留守曹國公烏祿使伊喇扎巴招之幹罕已約降已而復謂扎巴曰若降爾能保我輩無事乎扎巴見幹罕兵衆強盛車帳滿野意其可以有成反説之曰我之始來以汝輩不能有為今觀兵勢強盛如此汝等欲如羣羊為人所驅去乎將欲恃天時乎若果有大志吾亦不復還矣其黨有前伯特夲部族節度綽哈者言昔古紳丞相賢能人也嘗説西北部族他日當有事今日正合此語恐不可降也於是幹罕決意不降遂攻臨潢圍之衆至五萬發明凡書故將豫義也遼金世讐而能倡義伐金謀立故主皆綱目之所豫者曷為以叛書誅心焉考之分注起兵者譯史薩巴及老和尚等而猶有謀立故主之心幹罕不能助之起義而乃殺薩巴執老和尚以奪其軍况又約降烏祿則是其心非純乎為遼者故不以起義豫之而變文書曰叛所以著其不赦之罪焉耳綱目誅心之法其旨嚴哉廣義伊喇幹罕叛無非因民之不忍也亮也何不自返而欲南侵耶金主亮遷都於汴發明書曰遷汴者民非欲遷為金主之所遷也傳曰懷土常物之大情遷國重事也雖違害就利去危即安猶或恐沉溺於衆不肯率從而况迫於橫逆非其所欲棄久安之田里刈薪徙之蓬藋道途之勤營築之勞豈不惻然有隱乎肆行莫顧其不仁甚矣凡書遷不再貶而其惡自見矣秋七月金大括馬於諸路先是調馬於諸路以戶口為差計五六十萬匹仍令户自養以俟至是又大括騾馬官至七品聽留一匹等而上之并舊籍民馬其在東者給西軍在西者給東軍交相往來晝夜絡繹不絶死者狼籍於道其亡失多者官吏懼罪或自殺所過蹂踐民田調發牽馬夫役詔河南州縣所貯糧米以備大軍不得他用贏馬所至當給芻粟而無可給有司以為請金主亮曰北方比嵗民間儲畜尚多今禾稼滿野贏馬可就牧田中借今再嵗不獲亦何傷乎於是國內騷然盜賊蜂起大者連城邑小者保山澤有以盜賊事聞者亮輒杖而黜其官太醫使祈宰上疏諌南侵亮殺之由是群臣不敢言金主亮大殺宋遼宗室之在其國者凡百三十餘人發明嗚呼逆亮殘暴之心至是極矣宋遼宗室久陷邊陲歷朝既加寬貸之恩逆亮乃懷殺戮之慘使元元帝胄靡有孑遺哀哉雖然逆亮弒君篡國彛倫掃地莫親於己之宗室而尚加屠戮况疏之者耶宋遼宗室服為臣虜殆欲偷安於一時不料禍出於目下譬猶身履虎尾其不為彼所嘻者幾希矣故直書大殺以著其暴廣義自古鄰於強敵者未有能善其後者也蓋鄰之幸我之不幸也烏能保敵人之不肆吞陷哉此聖人所以拳拳焉嚴一民尺土之防者蓋懼後世罹禍之慘也君子觀劉石金亮之恣誅戮則知有天下者慎固封守不可以不之講也周麟之有罪免初麟之受命賀金遷都憚不欲行陳康伯以國事勉之麟之語侵康伯康伯曰使某不為宰相當自行大臣與國存亡雖死安避麟之竟辭行至是是坐免遣樞密都承旨徐嚞如金至旴𣅿金人郤之乃還嚞至旴𣅿金主亮使韓汝嘉就境上止之曰朕始至此比聞北方小警欲復歸中都無庸來賀也嚞乃還發明為國者莫大乎别天冠地履之分正名分綱常之道共主而屈於藩位則是天冠地履之倒置矣忘讐而交於強鄰則是名分綱常之逆施矣高宗釋父母之讐結強鄰之好誠萬世之恥也夫何既知逆亮以渝盟復遣使臣以往賀何其愚之若是耶逮至旴𣅿為金所郤嗚呼宋使於金則事之為甚恭金郤宋使則待之為甚倨堂堂中國而為外邦所侮詎不深可醜哉高宗舉措如此誠不可與論自強之道矣詳書於册深譏之也八月宿遷人魏勝起兵復海州詔以勝知州事勝多智勇應募為弓箭手居山陽及金人籍諸路民為兵勝躍曰此其時也聚義士三百北渡淮取漣水軍宣布朝廷德意不殺一人金知海州事高文富遣兵捕勝勝迎擊走之追至城下文富閉門固守勝令城外多張旗幟舉煙火為疑兵又使人向諸城門諭以金人棄信背盟無名興兵及本朝寬大之意城中人聞即開門獨文富與其子安仁率牙兵拒之勝殺安仁及州兵千餘擒文富民皆安堵如故勝遣人諭朐山懷仁沭陽東海諸縣皆定之乃蠲租稅釋罪囚發倉庫犒戰士分忠義士為五軍紀律明肅部分如宿將勝益募忠義以圖收復逺近聞之響應旬日得兵數千勝將董成率所部千餘人直入沂州殺金守將及軍士三千餘衆悉降得器甲數萬金遣蒙古鎮國以兵萬餘取海州抵州北二十里新橋勝帥兵出迎之設伏於隘障以待衆殊死戰伏發敵大敗殺鎮國馘千人降三百人軍聲益振山東之民咸欲來附勝傳檄招諭結集以待王師之至沂民壁蒼山者數十萬金人圍之久不下寨首滕􅀢告急於勝勝提兵往救之陳於山下金人多伏兵勝兵遇伏皆赴寨金人襲之勝單騎而殿以大刀奮擊金人望見勝知其為將也以五百騎圍之數重勝馳突四擊金陳開復闔戰移時身被數十槍冒創出圍金兵追之馬中矢踣步而入寨無敢當者金人又急攻絶其水岩中食乾糒殺牛馬飲血勝默禱而雨驟作金人攻益急周山為營勝度其必復攻海州因間出寨趨城中金人果解蒼山圍自新橋抵城下勝出戰皆捷金分兵四面攻之勝募士登城以禦矢石如雨者七日金兵死傷多遁去發明金人據有中原勢陵華夏誠臣子之所共憤仇恥之所必雪者也茍有侣義而起為國恢復綱目之所豫也魏勝乘時崛起號召豪傑委身百戰遂復海州可謂致命遂志者矣非明於君臣之大義曷克以臻此哉故綱目特筆起義曰宿遷人魏勝起兵復海州所以深嘉而亟豫之也廣義信義者收復人心之本也魏勝以匹夫而行信義其效如此况有疆埸者耶若勝者其過人逺矣以成閔為京湖制置使金主亮弒其太后圖克坦氏九月遂大舉入冦圖克坦后聞亮欲南侵以言諌之亮不悅每謁見還宫必忿怒人不知其故及至汴后居寧德宫使侍婢高福娘問亮起居亮幸之因使伺后動靜凡后所為事無大小福娘夫特默格教福娘增飾其言以聞及契丹反樞密使布薩呼圖往討辭謁后后謂曰國家世居上京既徙中都今又至汴復將興兵涉江淮伐宋疲弊中國我嘗諫止之不見聽也契丹事復如此奈何福娘以告亮亮意謂后嘗養鄭王充為己子充四子皆成立恐呼圖將兵在外或有異圖乃召點檢大懷忠等使弒后且指名后左右數人皆令殺之后方摴蒱懷忠等至令后跪受詔后愕然方下跪尚衣局使華特默從後擊之仆而復起者再高福娘等縊殺之并殺其左右數人亮命焚后於宫中棄骨於水并殺鄭王充之子塔納阿里布等三人遂召呼圖等還皆殺之封高福娘為勛圖夫人以特默格為澤州刺史又以尚書令張浩左丞相蕭玉諌伐宋仗而釋之自是莫有敢諌者遂分諸道兵為三十二軍置左右大都督及三道都統制府以總之以賔都為左大都督李通副之赫舍哩良弼為右大都督烏雅富勒琿副之蘇保衡為浙東道水軍都統制完顔正嘉副之由海道徑趨臨安劉萼為漢南道行營兵馬都統制自蔡州瞰荆襄圖克坦喀齊喀為西蜀道行營兵馬都統制由鳯翔取大散關駐軍以俟後命左監軍圖克坦貞將兵二萬入淮隂九月亮召諸將授方略賜宴於尚書省命皇后圖克坦氏太子光英居守張浩蕭玉敬嗣暉留治省事亮戎服乘馬具裝啓行妃嬪皆從衆六十萬號百萬氊帳相望鈺鼓之聲不絶李通造浮梁於淮水之上將自清河口入淮東逺近大震發明弒者下殺上之名所以著亮之罪也逆亮欲為君則弒其君欲伐國則弒其母此誠人情之大變天理所不容其惡可勝言乎前史皆以殺太后為文分注因之亦云縊殺至綱目始正名定罪變文書弒所以扶天理遏人欲正丅分植綱常逆亮之罪益暴白而不可掩矣大舉者惡恃衆也入冦者外而罪之也上書弒太后下書遂入冦則是因太后之阻殺之而始遂其志耳其義豈不明且切哉廣義嗚呼自開闢以來未有如亮之窮凶極惡滅絶天理者也且虎狼尚有父子蜂蟻猶有君臣雎鳩有夫婦之别鶺鴒有兄弟之情凡得天地以生而有知覺運動者莫不各有一偏之情而况人為萬物之靈者耶今焉迹亮之所為是盈天地間醜惡之物不足以充其類也高宗不此之察而反以信義責之謬矣以黃祖舜同知樞密院事金人犯黃牛堡吳璘等敗之遂復秦隴洮三州金圖克坦喀齊喀將兵扼大散關逰騎攻黃牛堡守將李彥堅告急人情洶洶制置使王綱中跨一馬馳二百里至吳璘營起璘於帳中責之曰大將與國義同休戚臨敵安得高枕而卧璘大驚即馳至殺金平駐軍靑野原益調內郡兵分道而進授以方略以援黃牛剛中又以蠟書扺張王彥濟師西師大集李彥堅以神臂弓射金師郤之璘遣别將彭青至寶雞渭河夜劫橋頭寨破之又遣劉海復秦州彭青復隴州曹休復洮州金師既退剛中倍道馳還謂其屬李燾曰將帥之功吾何有焉燾嘆曰身督戰而功成不居過人逺矣劉錡遣兵復泗州高平人王友直起兵復大名遣使入朝友直幼從父佐遊志復中原聞金主亮渝盟乃結豪傑謂之曰權所以濟事權歸於正何害於理即矯制自稱河北等路安撫制置使以其徒王任為副使遍諭州縣勤王未幾得衆數萬制為十三軍置統置等官以統之進攻大名一鼓而克撫定衆庶諭以紹興年號遣人入朝奏事未幾自壽春來歸詔以為忠義都統制發明凡書起兵豫倡義也友直交結豪傑志復中原是能以忠義自守者也既而甫復大名遣使入覲則其心宋亦可見矣故特書豫之所以為臣子循國之一勸耳廣義友直之變通武穆之所不逮焉冬十月金人圍海州魏勝李寶合擊大敗之金主亮渡淮慮勝睨其後分軍數萬圍海州會李寶帥舟師由海道將拒敵於膠西勝遣人邀之寶遡風至東海慷慨厲士赴援與勝同擊金兵於新橋敗之勝還守北關金兵逼關勝登關門張樂飲酒犒軍士令固守勿出戰踰時乃少遣士出慿險隘擊之金人知不可攻率軍轉而渡河襲關後勝斂兵入城金人欲過砂堰圜城為營勝先已據堰拒之尋以單騎逐敵於東門外大聲叱之金騎五百皆望風退勝又追十數里金兵駭散翌早乘昏霧四面薄城急攻勝竭力捍禦城上鎔金液投火牛金兵不能前多死傷乃拔寨走金人渡淮劉錡進軍楚州以拒之劉錡兵至揚州建大將旗鼓軍容甚肅觀者嘆息以兵駐清河口扼金師金人以氊褁船載糧而來錡使善沒者鑿沉其舟金人自渦口渡淮錡次於淮隂列兵運河岸以扼之金人立曹國公烏祿為帝於遼陽更名雍金主亮自發汴京將士在道多亡歸者哈斯罕明安福壽高忠建盧萬家博索路總管默音東京穆昆金珠等始受甲於大名即舉步亡歸從者至二萬餘皆公言於路曰我輩今往東京立新天子矣時東京留守烏祿許王鄂爾多之子太祖之孫也性仁孝沉靜明達衆心歸之亮嘗使摩囉歡圖淮北諸王烏祿聞而憂懼會故吏祿錦自汴還具言金主弒母等事且曰將遣使害宗室兄弟矣烏祿益懼謀於其舅興元少尹李石石勸烏祿先殺副留守高存福烏祿遂執存祿將殺之適福壽等以軍入東京乃共殺存福等烏祿遂御宣政殿即位大赦改元大定下詔暴揚亮罪惡數十事追尊鄂爾多為帝廟曰睿宗發明綱目凡偕國之君自立者則書某稱帝為人所立者則曰以某稱帝今烏祿亦為衆所立何不曰金人以曹國公烏祿稱帝而書金人立曹國公烏祿為帝所以明金人心服而立之也逆亮滅絶倫理帥兵南下寡助之至親戚叛之乃獨夫耳金之國豈亮所可有乎豫在烏祿則罪在逆亮矣權其輕重而書之若此此所以為綱目微君子莫能修之廣義書曰金人立曹國公烏祿為帝者於以見通國之人立雍而逐亮也亮雖欲歸國得乎劉錡將王權軍潰於昭關錡引還揚州金主亮入廬州錡遣都統王權措置淮西權不從錡節制聞金兵大至即棄廬州退屯昭關不戰而潰錡聞之遂自淮隂退還揚州金主亮入廬州權自昭關退保和州吳拱成閔遣兵復唐鄧諸州帝親征詔葉義問督視江淮軍馬虞允文參謀軍事帝聞王權敗召楊存中至內殿議禦敵之䇿因命存中就陳康伯議欲航海避敵康伯延之入解衣置酒帝聞之已自寬明日康伯入奏曰間有勸陛下幸越趨閩者審爾大事去矣盍靜以待之一日帝忽降手詔曰如敵未退散百官康伯焚詔而後奏曰百官散主勢孤矣帝意既堅康伯乃請下詔親征帝從之以葉義問督視江淮軍馬中書舍人虞允文參贊軍事尋以楊存中為御營宿衛使發明征者上伐下之詞尊中國也自和議既成偷安江左餘二十年矣忘讐事金委為固然兹因逆亮搆隙陵轢中原帝能渙起宸斷率將親征可謂稍振委靡之氣矣蓋由陳康伯之為相也在紹興初則有趙鼎在紹興末則有康伯皆能以義正君而有回天之力焉耳據事直書其義自見廣義康伯此舉即寇凖澶淵之役也其獨斷之堅者豈非以金人衆叛親離也哉金人陷真州統制邵宏淵逆戰敗走詔吳璘出兵漢中璘遂復商虢州王權退屯采石金主亮入和州亮入和州以梁山濼水涸先所造戰船不得進命李通復造船督責苛急將士日夜不得休息壞城中民居以為材木煮死人膏為油用之發明王權不忠之罪至是益著矣前違劉錡節制軍潰昭關而廬州既陷此乃退屯采石略無邀擊而和州復失有臣如此安能免其誅戮乎故下書編管瓊州所以豫其罰有罪也李寶大破金人於陳家島殺其將完顏正嘉寶既解海州之闈遂與其子公佐引舟師至膠西石臼島敵舟已出海口泊陳家島相拒僅一山時北風盛寶禱於石臼神風自拖樓中來如鍾鐸聲衆咸奮引舟握創待戰敵操舟者皆中原遺民遙見寶船紿敵兵入舟中使不知王師猝至風駛舟疾過山薄敵鼓聲震蕩海波騰躍敵大驚掣矴舉帆帆皆油纈彌亘數十里浪捲聚一隅窘束無復行次寶命火箭射之煙焰隨發延燒數百艘火所不及者猶欲前拒寶叱壯士躍登其舟以短兵擊殺之降其衆三千餘人斬其帥完顏正嘉等六人擒倪詢等上於朝獲其統軍符印與文書器甲糧斛以萬計餘物衆不能舉者悉焚之火四晝夜不滅金人陷揚州劉錡遣兵拒於皂角林大敗之錡以舟渡真掦之民於江南留屯瓜州金人來爭錡命步將吳超員琦王佐等拒之於阜角林錡陷重圍下馬死戰佐以步卒設伏林中金人既入張弩俄發金人以運河岸狹非騎兵之利稍稍引去追擊大破之斬其統軍制高景山十一月召張浚判建康府殿中侍御史陳俊卿上疏極言浚忠蓋帝悟乃詔復官判建康浚至嶽陽買舟冒風雪而行時金兵充斥浚遇東來者云敵兵方盛焚采石煙熖張天慎毋輕進浚曰吾赴君父之急知直前求乘輿所在而已遂乘小舟徑進時長江無一舟敢行北岸者廣義或曰張魏公冒險以赴君父之急固為當矣倘有不利則身且不保其如君父之急何曰魏公惟盡其忠誠而已至於生死得喪何暇計哉編管王權於瓊州以李顯忠代將其軍金人侵瓜州葉義問使中軍統制劉汜禦之敗績義問走建康時劉錡病甚求解兵柄留其侄中軍統制汜以千五百人塞瓜州李橫以八千固守詔錡還鎮江專防江於是盡失兩淮之地金人攻瓜洲汜以克敵弓射郤之葉義問至鎮江見錡病劇以李橫權錡軍遂督兵渡江衆以為不可義問強之汜請出戰錡不從汜拜家廟而行金人以重兵逼瓜洲汜先退李橫以孤軍不能當亦郤失其都統制印橫左軍統制魏俊右軍統置王方死之橫汜僅以身免錡聞汜敗因憤悶疾益甚義問聞之乃遵陸趨建康市人皆媟罵之發明金兵南逼蔓衍江淮正臣子奮激立功之秋也瓜洲之戰劉錡未可而劉汜竟違之義問以促之遂使王師敗績迄無成功然則劉汜輕佻失律固無足責義問身為都督不能捐生循國而乃奉頭鼠竄苟有丈夫之志者豈不愧死亡地哉分注以遵陸趨建康為文綱目變文直書曰走所以著其效匹夫輕身之事而其罪殆不可掩矣嗚呼宋人積弱之勢於此益可見矣虞允文大敗金軍於采石金主亮趨揚州亮築臺江上自披金甲登臺殺黑馬以祭天以一羊一豕投於江中召賓都等謂之曰舟揖已具可以濟江矣富勒琿曰臣觀宋舟甚大我舟小而行遲恐不可濟亮怒曰爾昔從梁王追趙搆入海島豈皆大舟耶誓明日渡江晨炊玉麟堂先濟者與黃金一兩亮置黃旗紅旗於岸上以號令進止時葉義問命虞允文往蕪湖迎李顯忠交王權軍且犒師允文至采石權已去顯忠未來敵騎充斥官軍三五星散解鞍束甲坐道傍皆權敗兵也允文謂坐待顯忠則誤國事遂立召諸將勉以忠義曰金帛告命皆在此以待有功衆曰今既有主請死戰或謂允文曰公受命犒師不受命督戰他人壤之公受其咎也允文叱之曰危及社稷吾將安避乃命諸將列大陳不動分戈船為五其二並東西岸其一駐中流藏精兵待戰其二藏小港備不測部分甫畢敵已大呼亮操小紅旗麾數百艘絶江而來瞬息之間抵南岸者七十艘直簿官軍軍小却允文入陳中撫統制時俊之背曰汝膽略聞四方立陳後則兒女子爾俊即揮雙刀出士殊死戰中流官軍以海􆅵船衝敵州皆平沉敵半死半戰日暮未退會冇潰卒自光州至允文授以旗鼓從山後轉出敵疑援兵至始遁允文又命徑弩尾擊追射大敗之金兵還和州凡不死於江者亮悉敲殺之會報曹國公已即位於東京改元大定亮拊髀嘆曰朕本欲平江南改元大定此非天乎因出其素所書取一戎衣天下大定改元事以示羣臣遂召諸將帥謀北遷且分兵渡江李通曰陛下親征深入異境無功而還若衆散於前敵乘於後非萬全計若留兵渡江車駕北還諸將亦將解體令燕北諸軍近遼陽者恐冇異志宜先發其渡江斂舟焚之絶其歸望然後陛下北遷南北皆指日而定矣亮然之允文知亮敗明當復來夜半部分諸將分海州縋上流别遣盛新以舟師截金人於揚林河口明旦敵果至因夾擊之復大敗焚其舟三百敵遣偽詔來論王權似有宿約者允文曰此反間也乃復書言權因退師已置憲典新將李顯忠也願快戰以決雌雄亮得書大怒遂焚其龍鳯舟斬梁漢臣及造舟者二人率其軍趨揚州使符寶郎耶律摩多護神果軍扼淮渡凡自軍中還至淮上無都督府文字皆殺之發明采石之戰不過敗卒數百而破敵十萬之衆以勢似力皆不可敵也允文書生獨能勝之得非其運籌決䇿有人大過人乎雖然當敵騎充斥我軍單弱允文勉以忠義士氣百倍卒收成功金人大衄可見天理之在人心有不可得而泯沒者允文之勝乃忠義固結人心云爾否則雖堅甲利兵奚足恃哉孟子曰多助之至天下順之此之謂也故特書以深豫之廣義或曰虞允文之敗金人也何其成功若是之速哉曰允文之識時達權嶽武穆之所不及也况亮已知雍為國人所立自知舉國之人皆不願戴已也然其兵已出矣何可已乎譬猶人之外雖無病其臟腑已受疾矣是以貌雖欲勝而心實孤焉况亮以貪暴殘虐御下允文以公忠信義勉人又加以決䇿臨陳之機此其所以成功之速也曰然則其與謝玄之肥水周瑜之赤壁劉錡之順昌孰優曰允文優何優乎曰謝玄周喻劉錡宿將也允文書生也彼皆出師禦敵此則將命犒師特以見當時事危勢迫故不顧矯制之小嫌以成退敵之大功也噫以宿將之才而勝敵於豫備者易以書生之見而勝敵於倉卒者難此允文之所以優也劉錡罷以成閔李顯忠吳拱為兩淮京湖三路招討使顯忠至采石虞允文語之曰敵入揚州必與瓜州兵合京口無備我當往公能分兵相助乎顯忠分萬六千與之允文遂還京口時敵屯重兵滁河造三閘儲水深數尺塞瓜洲口楊存中成閔邵宏淵諸軍皆集京口凡二十餘萬允文以戰艦數少不足用聚材改治之命張深守滁河口扼大江之衝以苗定駐下蜀為援且謁劉錡問疾錡執允文手曰疾何必問朝廷養兵三十年一技不施而大功乃出一儒生我輩愧死矣以疾篤召還提舉萬壽觀詔以閔等為招討使閔準東顯忠準西拱湖北京西廣義劉錡為將無瑕可指世稱張韓劉嶽之劉謂光世也若以光世之劉為劉錡之劉則庶乎得其當矣金主亮為其下所殺亮至瓜洲居於龜山寺虞允文與楊存中臨江按試命戰士踏車船中流上下三周金山回轉如飛敵持滿以待相顧駭愕亮笑曰紙船耳有一將跪奏南軍有備不可輕願駐掦州徐圖進取亮怒杖之五十召諸將約以三日濟江否則盡殺之驍騎高僧欲誘其黨以亡事覺亮命衆創銼之乃下令軍士亡者殺其富埒琿富埒琿亡者殺其穆昆穆昆亡者殺其明安明安亡者殺其總管由是軍士益危懼亮又令軍中運鴉鶻船於瓜洲期以明日渡江敢後者死衆欲亡歸乃決計於浙西都統制耶律元宜及明安唐古烏頁且曰前阻淮渡皆成擒矣比間遼陽新天子即位不若共行大事然後舉軍北還元宜然之乃期詰旦衛軍番代即行事黎明元宜等帥諸將以衆薄亮營亮聞亂意宋兵奄至攬衣遽起箭入帳中亮取視之愕然曰乃我兵也近侍大慶山曰事急矣當出避之亮曰走將安往方取弓已中箭仆地延安少尹納哈塔鄂勒博創之手足猶動遂縊殺之軍士攘取行營服用皆盡乃取驍騎指揮使大磐衣巾褁其尸而焚之收其妃嬪及李通郭安國圖克坦永年梁珫大慶山皆殺之元宜自為左領軍副大都督使人殺太子光英於汴退軍三十里遣人持檄詣鎮江軍議和未幾金軍在荆襄兩淮者皆拔柵北還史臣曰完顏亮智足以拒諌言足以飾非欲為君則弒其君欲圖鄰則弒其毋欲奪人之妻則使之殺其夫三綱絶矣何暇他論至於屠滅宗族翦刈忠良婦姑姊妹盡入嬪禦卒之戾氣感召身由惡終使天下後世稱無道主以亮為首可不戒哉可不戒哉發明逆亮以臣反君故有臣禍之報天道昭昭固已甚明綱目於此書殺而不書其殺者逆亮既不君其君亦安能復臣其臣哉然而不書誅者則以臣下殺之故耳獨夫殘虐內外離心曽不再傳其下圖之直書曰殺亂臣賊子盍亦以是少警哉廣義嗚呼亮以慘酷不仁施之天以慘酷不仁報之天網之密毫釐不爽可畏也哉曰然則何以不書曰弒而書曰殺蓋書殺者所以著亮之惡以見國人殺之不以人主待之也十二月成閔李顯忠收復兩淮州郡帝如建康張浚至建康即具行宫儀物請車駕臨幸帝從之帝至建康張浚迎拜道左衛士見浚無不以手加額浚起復用風采隱然軍民皆倚為重金主雍入燕壬午三十二年金大定二年春正月朔日食山東人耿京起兵復東平遣其將辛棄疾來朝金主亮死中原豪傑並起山東忠義耿京據東平自稱天平節度使以齊州歷城人辛棄疾掌書記棄疾勸京來歸京遣疾奉表詣行在帝大喜厚賚之以京知東平府金主雍遣使來聘金主雍下令散南征之衆以高忠建為報諭宋國使且告即位發明凡書來聘者嘉其慕義自通故進之也金自紹興十三年書來聘至是餘二十年而再書蓋亦鮮耳金主雍散南征之兵遣報諭之使是蓋慕義自通者故書豫之君子不盡絶人之意可見矣二月以虞允文為川陜宣諭使允文還朝帝慰籍嘉嘆謂陳俊卿曰允文朕之裴度及是陛辭言金亮既主新主初立彼國方亂天相我恢復也和則海內氣沮戰則海內氣伸帝以為然充文至蜀遂與吳璘經略中原帝還臨安時將祔欽宗於太廟帝還臨安謂張浚曰卿在此朕無北顧憂矣御史吳芾言建康可以控帶襄漢經略淮甸大駕宜留以繫中原之望若還臨安則西北之勢不能相接不從發明敵至則如建康敵退則還臨安是知高宗惟以東南為安便其無意於中原之心久矣雖吳芾之反覆切諫帝不俞允惜哉書還臨安乃所以譏之也廣義高宗不欲都建康者畏金兵之迫己也決意還臨安者欲偷生於一隅也其無志可知矣金以張浩為尚書令金主雍嘗為宰相曰進賢退不肖宰相之職也有才能高於己者或懼其分權往往不肯引置之同列朕甚不取卿等毋以此為心時有近侍進言欲罷科舉者金主問浩曰自古帝王有不用文學者乎浩曰有之曰誰歟浩曰秦始王金主顧近侍曰豈可使我為秦始皇事遂寢廣義分注載金主雍與羣臣問答之辭炳炳可觀其不負國人共戴之心矣閏月祔欽宗主於太廟吳璘復大散關分兵守和尚原金人走寶雞璘遣兵復河源州及積石鎮戎軍遂復大散關楊椿罷太尉威武節度使劉錡卒錡以劉汜敗發怒嘔血數升至是卒贈開府儀同三司諡武穆錡慷慨深毅有儒將風金主亮之南下也令有敢言劉姓名者斬枚舉南朝諸將問其下孰敢當者皆隨名姓以對其答如響至錡莫有應者亮曰吾自當之惜錡以疾不能成功齎恨而沒發明錡慷慨深毅有儒將風忠義之心老而彌篤而與韓嶽齊名是誠宋之良將也兹因劉汜之敗發憤嘔血而死然則非憂國之至者能如是乎惜其為秦檜所忌廢處散地二十餘年時方倚以為重而錡乃告終矣詎不深可嘆哉卒而具官蓋豫之也耿京將張安國殺京以降金辛棄疾還執安國送臨安斬之張安國殺京降金辛棄疾還至海州與衆謀曰我緣主帥來歸朝不期事變何以復命乃約李寶統制王世隆等徑趨金營即帳中縳安國獻於臨安斬之詔授棄疾江淮判官棄疾獻議恢復持論徑直不為迎合衆壯之發明耿京山東之豪傑仗義掘起遂復東平綱目前書起兵復東平皆所以豫之也安國隂蓄異志殺京降金則其判逆之罪固無足論者棄疾痛主將之無辜憤逆賊之背國謀於諸將執送臨安其討賊之義正矣茍非明於大義奚能爾哉綱目特揭而書之於册者皆所以深豫之意焉耳廣義君子觀棄疾之事不可謂宋無人矣特患高宗不能駕馭之耳使其得周宣王漢光武其功業奚止是哉吳璘復德順軍及環州璘遣姚仲取鞏王彥屯啇虢陜華惠逢取熙河或久攻不下或既得復失竟無成功仲舍鞏攻德順跔四句不克璘以李師顏代之遣子挺節制軍馬挺與敵戰於瓦亭大敗之擒其千户耶律紏堅等百三十七人金人懲其敗悉兵趨德順璘自將往督師先壁於險且治夾河戰地璘至城下守禆者聞呼相公來觀望咨嗟矢不忍發璘按行諸屯斬不用命者先以數百騎嘗敵敵一鳴鼓鋭士空壁躍出突璘軍璘軍得先冶地無不一當百至暮璘忽傳呼某將戰不力人益奮博敵大敗遁入壁黎明師再至敵堅壁不動會大風雪金人拔營去凡八日而克璘入城市不改肆父老擁馬迎之璘又遣嚴忠取環州遂還河池時姚仲等又復蘭會熙鞏等州及永安軍遣起居舍人洪邁使金金高忠建至臨安議遣使報聘且賀即位工部侍郎張闡請嚴遣使之命正敵圖之禮彼或不從則有戰耳如是則中國之威可以復振帝然之遂遣洪邁充賀登極使帝謂執政曰向日講和夲謂梓宫太后雖屈己卑辭有所不憚今兩國之盟已絶宜正名畫境朝儀嵗幣當先定之邁乃奏接伴禮儀十有四字既而忠建責事以臣禮以取新復州郡陳康伯以義折之乃止邁行書用敵國禮帝手札賜邁曰祖宗陵寢隔濶三十年不得以時灑掃祭祀心實痛之若彼能以河南地見歸必欲居尊如故正復屈己亦何所惜邁奏言山東之兵未解則兩國之好不成至燕金閣門見圖書不成式抑令於表中改陪臣二字朝見之儀必欲用舊禮邁執不可金鎖使館三日水漿不通及見金人語不遜欲留邁張浩不可乃遣還邁皓季子也發明邁乃皓之季子慷慨忠烈有諸父風出使女真正議無屈則其不愧是職亦多矣故特具官以嘉不辱也廣義高宗既然張闌敵國之禮尚何朝儀嵗幣之當先定哉其怯懦之心猶滯於胸中也至若邁能盡使節其無愧於乃父也夏四月以汪徹參知政事金人復攻海州鎮江都統張子蓋及魏勝大敗之金人復遣烏錦太師發諸路兵二十餘萬攻海州先遣一軍自州西南斷勝軍餉道勝擇勇悍士三千餘錡拒於石門堰金軍不能進逮夜始還留千人備險隘金兵十萬來奪勝率衆鏖戰殺數千人餘皆遁去勝還入城無何金兵環城圍數重勝與郭蔚分兵備禦或獨出擾之使不得休息又間夜發兵劫其營或焚其攻具既而金人併力急攻勝告急於李寶寶以聞命張子蓋往援進次石湫堰金人陳萬騎於河東子蓋率精鋭數千騎擊之統制張汜略陳中流矢死子蓋曰事急矣奮臂大呼馳入陳勝等繼之殊死戰賊大敗擁溺石湫河死者半圍遂解子蓋浚之姪也金追廢亮為海陵煬王蕭玉敬嗣暉許霖等輔亮為虐皆誅放歸田里特默格及其妻髙氏伏五月立建王瑋為皇太子更名眘音慎初金亮南侵兩淮失守朝臣多勸帝退避建王瑋不勝其憤及帝下詔親征瑋請率師前驅直講史浩聞之入言於瑋曰皇子不宜將兵因為草奏請扈蹕以供子職帝亦欲瑋遍識諸將遂命從幸金陵及還臨安帝欲遜位陳康伯密贊大議乞先正名俾天下咸知聖意遂草立太子詔以進帝從之瑋既立更名眘廣義孝宗之在藩邸而其直氣凛然不可犯者其有得於范沖朱震尹焞者多矣嗚呼有天下者烏可不以端人正士而預養國夲哉罷三招討司以李顯忠主管侍衛軍馬司成閔主管殿前衙司吳拱主管侍衛步軍司顯忠隂結金都統蕭琦為內應請出師欲自宿亳趨汴由汴京以通關陜關陜既通則鄜延一路熟知顯忠威名必皆嚮應且欲起其舊部曲數萬以取河東會詔罷兵乃止六月追封子稱為秀王詔集議子稱封爵戶部侍郎汪應辰定其稱曰太子本生之親宜入內降曰皇太子所生父可封秀王諡安僖母張氏為王夫人朱倬罷帝傳位於太子自稱太上皇帝皇后稱太上皇后太子即位大赦帝降手札皇太子可即皇帝位朕稱太上皇帝后稱太上皇后退居德夀宫太子固讓不許遂即位班退上皇即駕之德夀宫帝服袍履步出祥曦門冒雨掖輦以行及宫門弗止上皇麾謝再三且令左右扶掖以還顧謂羣臣曰付託得人吾無憾矣史臣曰高宗恭儉仁厚以之繼體守文則有餘撥亂反正則不足當其初立因四方勤王之師內相李綱外任宗澤天下之事宜無不可為者顧乃播遷窮僻坐失事機始惑於汪黃終制於秦檜偷安忍耻匿怨忘親以貽來世之譏悲夫發明書自稱譏之也大上之號乃嗣君之所尊崇耳其曰自稱則非義焉高宗在位三紀於兹時非不久年非不高國不闢而日蹙事不治而日壞而徒稱臣奉貢偷安一隅中興之能事畢矣至是厭倦萬幾傳位太子則父母之讐終身不得一雪君子疾沒世而名無稱焉高宗寧無愧怍乎綱目書此文無貶辭然其貶之之意隱然見於書法之間矣帝朝太上皇於德壽宫帝五日一朝太上皇不許自是月四朝以龍大淵為樞密副都承旨會覿幹辦皇城司二人帝潛邸內知客也尋以大淵知閣門事覿同知閣門事詔中外臣庶陳時政闕失監南嶽廟朱熹封事首言帝王之學必先格物致知以極夫事物之變使義理所存纎悉必照則自然意誠心正而可以應天下之務次言修攘之計不時定者講和之説疑之也今金於我有不共戴天之讐則不可和也明矣願斷以義理之公參以利害之實閉關絶約任賢使能立紀綱勵風俗使吾修政禦敵之外孑然無一毫可恃為遷延中己之資而不敢懷頃刻自安之意更相激厲以圖事功數年之外國富兵強視吾力之強弱觀彼釁之淺深徐起而圖之中原故地不為吾有而將焉往次言四海利病係斯民之休戚斯民之休戚係守令之賢否監司者守令之綱朝廷者監司之本欲斯民之得所本原之地亦在朝廷而已發明人君之德雖不一而求言聽諫乃其大者自賊檜諱言時事天下括囊久矣孝宗嗣位而首開言路其亦知所先務焉蠱之六五曰幹父之蠱用譽象曰幹父之蠱承以德也當時政事闕失者固多今既詔陳之則因革修廢之道豈不從可見哉若孝宗者可謂能知求治之方耳直書於册深豫之也秋七月召張浚入朝以為江淮宣撫使封魏國公帝手書召浚入見浚至帝改容曰久聞公名今朝廷所恃惟公因賜之坐浚從容言人主之學以心為本一心合天何事不濟所謂天者天下之公理而已必兢業自持使清明在躬則賞罰舉措無有不當人心自歸敵讐自服帝竦然曰當不忘公言加浚少傳魏國公宣撫江淮浚見帝英武力陳和議之非勸帝堅意以圖恢復欲遣舟師自海道搗山東命諸將出師掎角以向中原翰林學士史浩以潛邸舊臣時預樞密議欲城采石瓜洲浚言不守兩淮而守江於是示敵以削弱怠戰守之氣不若先城泗州浩不悅遂與有隙凡浚所規畫浩必沮之竟無成功廣義魏公之遇孝宗可謂受知於君之深者也其恢復之功必將收之於桑榆矣然則見沮於史浩豈人力之所能哉孟子曰行或使之止或尼之行止非人所能也其魏公之謂乎追復嶽飛官以禮改葬官其孫六人發明嶽飛為將十年有折衝禦侮之功固非他將比也然為賊檜所陷以沒其身至是追復官爵以禮改葬是亦公論之不容泯者書以豫之宜矣八月以史浩參知政事九月罷川陜宣諭使虞允文浩上言官軍西討東不可過寶雞北不可過德順若兵宿於外去川口逺則敵必襲之朝廷遂欲棄三路允文上言恢復莫先於陜西陜西五路新復州郡又係於德順之存亡一旦棄之則窺蜀之路愈多西和成階利害至重不可不慮於是允文罷知夔州以王畫之望代之明年允文入對言今日有八可戰且以笏地陳棄地利害帝曰此史浩誤朕也改允文知太平發明詩曰亂之初生僭始既㴠亂之又生君子信讒君子如怒亂庶遄沮君子如祉亂庶遄己史浩沮恢復之計允文上恢復之圖則二人之忠邪蓋可見矣夫何偏信史浩卒罷允文則是帝信讒邪而棄正論則亂何由而可止乎孝宗嗣位之初先斥正人而悅佞士又何以望其中興也哉即綱目所書觀之則其曲直權衡審矣故遼人伊哷斡罕稱帝金將布薩忠義討平之斡罕稱帝改元天正兵勢大張往討者多為所敗金主遣右副元帥默音討之遇於長濼斡罕大敗率衆西走默音復追敗於霧􅟶河斡罕去攻懿州金師久無功布薩忠義自請行乃以為右副元帥代默音忠義及赫舍哩志寧追之至梟嶺西陷泉大敗之斡罕以數騎僅免收合散卒萬餘入奚部其黨多降斡罕自知勢窮北走沙陀其徒執之獻於右都監完顏思敬送中都斬之其黨悉平惟扎巴不服頗為邊患金人苦之冬十月葉義問罷以張燾同知樞密院事十一月金以布薩忠義為都元帥赫舍哩志寧副之金主以宋不稱臣乃詔忠義總戎事居南京節制諸軍復令志寧駐軍淮陽忠義將行金主諭之曰宋若歸侵地貢禮如故則可罷兵忠義至汴簡閲士卒分屯要害十二月詔宰相復兼樞密使詔吳璘班師金以重兵扼鳯翔爭吳璘新復十三州三軍璘亟馳德順以備之已而金富察世傑率師十萬來攻璘力戰拒之時議棄三路遂詔璘班師發明書詔班師譏之也是時新復三路則中興之機在此一舉矣夫何議棄三路而自沮戰功乎吁惜哉御批續資治通鑑綱目卷十五
