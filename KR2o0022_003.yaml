body:
  text: 成化御製原序朕惟天地綱常之道載諸經古今治亂之蹟備諸史自昔帝王以人文化成天下未始不資於經史焉我太宗文皇帝表章五經四書輯成大全綱常之道粲然復明後有作者不可尚已朕祇承丕緒潛心經訓服膺有年間閲歴代史書舛雜浩繁不可殫紀惟宋儒朱子因司馬氏資治通鑑著爲綱目權度精切筆削謹嚴自周威烈王至於五季治亂之蹟瞭然如指諸掌蓋深有得於孔子春秋之心法者也展玩之餘因命儒臣重加校訂鋟梓頒行顧宋元二代之史迄無定夲雖有長編續編之作然采擇不精是非頗謬槩以朱子書法未能盡合乃申敕儒臣發秘閣之載籍參國史之夲文一遵朱子凡例編纂二史俾上接通鑑綱目共爲一書始於宋建隆庚申終於元至正丁未凡四百有八年總二十有七卷名曰續資治通鑑綱目而凡誅亂討逆内夏外夷扶天理而遏人欲正名分以植綱常亦庻幾得朱子之意而可以羽翼乎聖經仍命梓行嘉惠天下於戯人不考古無以證今觀是編者足以鑒前代之是非知後來之得失而因以勸於為善懲於爲惡正道由是而明風俗以之而厚所謂以人文化成天下者有不在兹乎用述其槩冠於篇端以垂示無窮焉成化十二年十一月十五日
