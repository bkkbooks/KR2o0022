body:
  text: 欽定四庫全書御批續資治通鑑綱目卷二十五起壬子元仁宗皇慶元年盡己巳元文宗天厯二年凡十八年壬子仁宗皇帝皇慶元年春正月制進翰林國史院秩帝諭省臣曰翰林集賢儒臣須朕自選用毋輒擬奏人言御史臺任重朕謂國史院尤重蓋御史臺是一時公論國史院是萬世公論於是升翰林國史院秩從一品尋敕博選中外才學之士居之夏四月帝如上都五月以阿薩爾為左丞相章律為平章政事六月朔日食敕左右勿僥幸乞加官時朝廷封拜繁多羣臣無功而受王公之爵者前後相繼於是誠左右勤職業勿妄僥幸加官御史中丞郝天挺言自先帝即位之時大事初定故於左右三五有功之人爵之太髙遂使近幸之臣因而相王公師保接迹於朝比者雖令迫裁罷曾未經歲又復紛然春秋云服之不𠂻身之災也是以朝廷名器重則斗升之祿足以鼓舞豪傑名器濫則雖日拜卿相而人不勸矣又言國初設官在內須三十月在外須三周歲考其殿最以為黜陟比者省院櫜部之臣久者一二歲少者三五月甚有旬日之間而屢遷數昜者奔走往來之不暇何暇宣風布化參理機務哉乞自今惟大臣可息闕選授其餘內外大小官屬必候任滿方許超遷庶免朝除夕改啓幸長姦之弊發明善治天下者莫先於慎名器名器慎則奔競之徒不得以覬覦由是正朝廷以正百官百官正萬民皆自此而推之耳武宗爵賞大濫不為慎惜故左右之人加官者乘此元世之大弊也茍不於此而禁絶之則販繪屠狗之流亦將魚貫而進天下不至於大亂者幾希矣仁宗即位之初首為此懼敕令左右勿乞加官則其防微杜漸革夤緣之途遏覬覦之路而向之所謂僥幸加官者一切罷之而不敘皆撥亂反正之盛心也直書于册蓋豫之耳廣義書此足以見其重名器也文無美辭而美在其中矣秋七月帝還大都冬十月赦十二月李孟罷以張圭為平章政事帝欲以伶人曹耀珠為禮部尚書圭曰伶人為宗伯何以示後世力諫止之癸丑二年春二月特們德爾罷以圗古勒為右丞相立皇后鴻吉哩氏彗出東井丞相圗古勒言頻年亢旱民黎艱食而又隕霜雨沙天象示警皆由臣等理不職所致乞罷黜以答天譴帝曰事豈關汝其勿復言御史臺亦言富人夤緣特旨濫授官爵微政宣徽用人多廢罪之流內侍託為貧乏互奏恩賞而西僧以作佛事之故纍釋重囚諸王駙馬寺觀土田徴租民間擾害尤甚皆今之弊政所宜悉革也制曰可夏四月帝如上都五月以額卜德哷勒為平章政事六月京師地再震詔以周敦頥程皓程頥張載邵雍司馬光朱熹張栻吕祖謙許衡並從祀孔子廟庭發明夫以褒髙年所以長其長也恤稚孤所以幼其幼也嘉孝子所以親其親也旌節婦所以義其義也此皆為國之先務而崇儒重道尤為國之先務也十賢從祀獨見於仁宗之朝其意善矣蓋世祖既未能行成宗又不能舉而武宗亦未能及仁宗慨然創始從祀廟庭可謂發祖宗之未發行前代之未行則其崇儒先重吾道之意彰彰明耳所以卓冠羣倫逈為元世之令主焉比而觀之其義自見廣義書詔以諸賢從祀者崇道統也河決陳亳睢三州開封陳留等縣漂民田廬秋八月帝還大都冬十一月初詔行科舉初世祖時議定科舉新制未及行至是中書省臣復以為言乃命定其條制詔天下三歲一開科蒙古色目人與漢人南各命題蒙古色目人願試漢人南人科目中選者加一等注授廣義科舉書曰初詔行者以見元人前此未嘗設科取士也京師大旱疫帝問弭災之道翰林學士程巨夫舉湯禱桑林事以對帝嘆曰北實朕之責也赤子何罪陜西行臺治書侍御史尉遲德誠亦上言西僧以作佛事疏放罪囚以為祈福奴婢殺主妻妾殺夫皆獲夤緣以免實紊典常必欲修政以答天譴夫豈有先於此者哉發明仁宗即位僅二年而災異之多迭書于册如六月日食彗出束井京師地再震河決京師大旱疫綱目皆筆而不削者是時弊政多革朝廷清明而災異不息何耶意者西僧佛事疏放罪囚奴婢殺主妻妾殺夫夤緣獲免實紊典常天下之亂莫此為甚也尉遲德誠之言是矣帝不深鑒惜哉甲寅延祐元年春正月詔求遺逸二月圖古勒罷以阿薩爾為右丞相趙世延參知政事省臣言比奉詔漢人參政宜用儒者侍御史趙世延其人也帝曰世延誠可用然永古特非漢人其署宜居右遂拜參知政事三月帝如上都夏六月敕自今宦者勿得授文階發明文武之階宦者雜授此漢唐之陋習也有宋因之而不革元朝襲之而尤甚此皆昏君庸主不顧是非之通患也且宦者之職不過使之供灑掃掌門禁傳命令服走趨而已文武之階豈宦者所宜任乎仁宗痛懲此弊一新故轍是亦知過必改之盛心也使其自今勉之改昜陋習勿為他日之搖奪又豈非有元盛德之主哉惜乎鮮克有終不能無失耳秋八月帝還大都地震冀寧汴梁及武安涉縣壤官民廬舍龎死者三百四十八九月復以特們德爾為右丞相阿薩爾為左丞相先是阿薩爾自言非世勳族姓不可以居右相因舉特們德爾自代遂拜特們德爾開府儀同三司録軍國重事居數月復進右丞相阿薩爾為左丞相冬十一月詔吏坐贓罪者黥其面十二月復以李孟為平章政事詔定官民車服之制帝以士民靡麗相尚僣禮費財命中書省定民車服等第惟蒙古及集賽諸色人不禁然亦不許服龍鳯文發明昜大象曰上天下澤履君子以辨上下定民志程傳曰天在上澤居下上下之正理也人之所履當如是故取其象為履君子觀履之象以辨别上下之分以定其民志夫上下之分明然後民志有定民志定然後可以言治民志不定天下不可得而治也是時士民尚侈僣禮費財蓋由上下之分不明士民之志未定貴賤何由而别乎尊卑何由而正乎仁宗既知其弊禁僣用之階定車服之制然後貴賤既明尊卑斯正而民之志於是乎定也豈不深合乎時中也哉復以齊履謙為國子司業初履謙與吳澄俱在國學既罷去學制稍廢至是復以履謙為司業乃酌舊制議立升齋積分之法每季考其學行以次第升既升上齋踰再歲始與私試辭理俱優者一分辭平理優者為半分歲終積至八分者為髙等禮部集賢歲選六人以貢帝從其議詔經理浙江西河南民田章律言經理之法世祖已行但其間尚多欺蔽遂遣吏等往三省行之限民四十日以所有田自實於官期限猝迫貪刻用事富民點吏並緑為姦於是民不聊生盜賊蜂起田野荒蕪其弊反有甚於前者樞密副使吳元圭入見言世祖限田四百畝以給軍需餘田悉令貢賦稅况江南之平幾四十年戶有定籍田有定畝今經理之法務以增多為能加之有司頭會箕斂元元困苦日甚臣恐變生不測非國之福帝命並遵舊制乙卯二年春正月遣使巡行天下分十二道問民疾苦黜陟官吏三月初賜進士呼圖克岱爾張起巖等五十六人及第出身有差分進士為兩榜蒙古色目人為右漢人南人為左第一名從六品第二名以下及第二甲皆正七品第三甲正八品兩榜並同發明仁宗誠可謂有元文明之主矣前書初詔行科舉此書初賜進士元自混一至是歷三主四十餘年所未當行至仁宗而始行之則其興賢育才之意良可見矣是以皇慶延祐之治號稱治平良以此也若仁宗者誠功光祖宗德垂後世而屹然為一代之規模焉耳豈不美哉特書曰初蓋豫之也章律罷律謁告歸江南奪民田中丞楊多爾濟劾之罷為江浙平章政事夏四月朔日食帝如上都五月成紀縣山移是夜疾風電雹北山南移至西河川次日再移平地突出土阜高者二三丈陷沒民居監察御火馬祖常言山不動之物今而動焉由在野有當用不用之賢在官有當言不言之佞故致然爾發明天道常動地道常靜茍或宜動而靜宜靜而動則是失乎常理是乃所以為異也是故三王修德百軌順度天地於焉而位萬物於焉而育自無三辰失行山崩川竭兵亂凶荒胎殨卵殈之患矣然而欲天地之位必位吾心之天地欲萬物之育必育吾心之萬物夫綱目所書山崩川竭有矣未聞有山移者山馬而移則其變豈不大哉故特謹而書之加宦官續元睴昭文館大學士發明加不宜加也語曰先行其言而後從之又曰君子欲納於言而敏於行是故言之非難行之為難所以古之聖賢必欲言行之相符也蓋學士文學之任非宦者所可得為去年夏書敕自今宦者勿得授文階至是年五月僅克踰期而書加宦者續元暉昭文館大學士曾謂學士之職非文階乎此蓋中心無主能言而不能行未始不為物欲之撓括耳綱目所謂王道之權衡此類是矣江西湖廣飢秋七月畿內大雨水贛州民蔡五九兵起擒斬之初經理之法既行特們德兒猶以為未實復下令括田增稅而鼐智密鼎在江西酷虐尤甚信豐一縣撒民廬千九百區夷墓揚骨以為所增頃畝居民怨毒入骨贛州民蔡五九等遂率衆寇抄汀漳諸路陷寧化縣據之稱王建號詔遣章律討之擒斬五九餘黨悉平廣義大抵民之率衆為寇者豈其得已也哉由乎上之人有以促之也故秦始皇以頭會箕而促陳勝之徒唐僖宗以賦斂愈急而促黃巢之黨女直之勢強而宋徽宗括民田以促之蒙古之方張而金裒宗括民粟以促之何也食為民之天也民之無食猶魚之無水木之無土耳魚無水不活木無土不生民無食必死然而魚也木也乃無為之物也若其無水無土則安于死耳豈有他哉至於民者至愚而神固非魚與木也是以君人者一失其馭必將激其憤悶之心而有不勝其禍者矣書曰豫臨兆民乎若朽索之馭六馬其以此歟有天下者慎勿以非道促之可也故綱目於蔡五九不書曰作亂而書曰兵起者意有在焉八月帝還大都以趙世延為御史中丞世延自參知政事遷中丞詔省臣自平章以下送之人臺其禮前所無有由是為特們德爾所忌用太后旨出為雲南右丞陛辭帝令仍為中丞冬十月以郭貫為參知政事貫初為河東亷訪副使帝在東宫時幸五臺因問河東亷訪使穆爾濟達何以有善政左右曰副使郭貫之教也厚賜之及帝即位纍遷至浙西亷訪使至是以為參知政事十一月彗見紫微垣赦丞相阿薩爾以星變乞避位帝曰此朕之愆豈卿等所致其復乃職茍政有過差勿憚於改而凡可以安百姓者當悉言之因赦免各路差稅有差發明自七月至于是月綱目書江西湖廣飢畿內大雨水贛州兵起彗見紫微垣此皆災異盜賊併之而起然則朝廷譬猶元氣而四方譬猶邪慝元氣固則百邪不能入元氣不固則邪惡乘之而入矣是誠先儒所為朝廷腹心元氣也即綱目之所書驗當時之得失則天變之應信不可誣矣立武宗子和實拉為周王出鎮雲南初武宗既立帝為太子後丞相三寶努復勸立和實拉召喀喇托克托言之托克托曰太弟定宗社居東宫久兄弟叔姪世世相丞孰敢紊其序乎三寶努曰今日兄已授弟異日能保叔授其姪乎托克托曰我不可渝彼失其信天寶鑒之至是議立太子丞相特們德爾欲徼竄請立皇子碩迪巴拉又與太后幸臣實勒們譛王於兩宫遂封為周王遣出鎮雲南廣義仁宗此舉即宋太宗之所為也其有負於武宗也多矣詔免江浙等三省自實田租二年時方警贛州之亂而章律在江浙復以括田迫民有至死者御史臺上書纍言經理及括田之害詔罷之復命河南自實田自延祐五年始止科其半而汴梁一路凡減虛增之數二十二萬石發明漢文賜田租之半君子豫之元自經理括田之害民病深矣仁宗知此而能詔免自實田租二年則是有勤恤民隱之心也豈不善哉揭而書之蓋豫之耳丙辰三年春二月帝如上都平章政事張圭謝病歸初皇太后以張圭嘗劾特們德爾不可使為太師至是與帝如上都方度居庸關潛召圭切責杖之圭創甚與歸京師明日遂出國門時圭子景元宿衛左右以父病篤辭還帝驚問故殊不懌遣使賜之酒進拜大司徒遂謝病歸發明以病免實也謝病歸託也書平章政事張圭謝病歸病帝也元之世綱目書謝病歸三而已世祖時則有許衡仁宗時則有張圭文宗時則有虞集皆出於不得已託詞而去者也太后怒圭嘗劾特們德爾瞷帝出幸切責杖之君子豈可以茍祿乎遂謝病歸當時之設是官亦文具矣如漢書諌大夫王吉謝病歸同意君子宜參考之禁方春畋獵初有議禁民畋獵犯者抵死左司郎中韓若愚曰齊宣王之囿方四十里殺其麇鹿者如殺人之罪孟子非之衆以為然遂減其刑太史令郭守敬卒守敬之學長於天文水利太史令王恂以學自負每見守敬制度精巧深嘆服之王褘曰自宋以來學者於天文水利之故不講久矣守敬獨能任其絶學度越往古以成一代之制也發明太史令微之微者其卒未嘗書此何以書録賢也守敬長於天文水利以成一代之制則其不愧是職亦多矣故書豫之夏五月以拜特穆爾蕭拜珠並為平章政事秋八月帝還大都冬十月以趙孟俯為翰林學士承旨帝在東宫素知其名及即位召除集賢侍講學士至是拜翰林學士承旨有間之者言國史不宜今孟俯與帝曰子昻世祖所簡拔朕置之館閣使典述作傳之後世此屬呶呶何也復厚賜之廣義子昻以趙宋宗室臣事讐元其醜固不足言矣若其修史至張𢎞範襲崖山之日其視陸秀夫張世傑為何如人矣嗚呼悲哉綱目記其時月而大書之者愧子昻於千古也十一月周王和實拉逃居漠北和實拉次延安其臣圖古勒及武宗舊臣哩日嘉琿等謀曰天下者我武宗之天下也王之出鎮本非上意由讒搆致然請聞之朝廷庶可杜塞離間遂與陜西丞相阿斯罕平章塔齊爾西臺大夫圖魯卜中丞托歡發關中兵分道自潼關河中府入已而搭齊爾背約襲殺阿斯罕嘉琿和實拉乃徒至金山西北集諸王察克台等部居之發明逃者匹夫之事書逃何誅心也和實拉惑其臣圖古勒之謀潛懷不軌因事弗成逃居漢北則周王不能辭其謀逆之罪矣直書逃居則其畏罪茍免之意豈不為可見哉十二月立子碩迪巴拉為皇太子仍兼中書令樞密使丁巳四年春二月詔郡縣復置義倉三月帝如上都夏四月不雨帝嘗夜坐謂侍臣曰雨暘不時奈何蕭拜珠曰宰相之過也帝曰卿不在中書邪拜珠惶愧頃之帝露香禱于天既而大雨左右以雨衣進帝曰朕為民祈雨何避焉發明僖三年春正月不雨夏四月不雨榖梁曰不雨者勤雨也每時而一書閔雨也胡氏曰閔雨者有志乎民者也歷時而總書不憂雨也不憂雨者無志乎民者也按詩稱僖公儉以足用寬以愛民務農重榖則誠賢君也其有志乎民審矣故冬不雨而書春不雨而書夏不雨而書以著其勤也今而四月不雨帝露香禱于天既而大雨則其憂民之心為可知回視忽不知懼豈不大相縣絶也哉故綱目特書夏四月不雨乃所以著其勤耳此綱目取法春秋之意也五月以齊勤特穆爾鄂博哈雅並為平章政事六月特們德爾罷以阿薩爾為右丞相特們德爾之再入相恃勢貪虐凶穢滋甚中外切齒羣臣不知所為平章政事蕭拜珠稍牽制之中丞楊多爾濟慨然以糾正其罪為已任上都冨民張弼殺人繫獄特們德爾使家奴脅留守賀勝使出之勝不可多爾濟亷德特們德爾受弼賂巨萬萬乃與拜珠及勝奏之而內外御史凡四十餘人共劾其桀黠姦貪欺上罔下占據晉王田及衛兵特地竊食郊廟供祀馬受諸王人等珍玉之賄動以萬計誤國之罪在僧格阿哈瑪特之上四海嫉憤咸願車裂斬首以快人心奏上帝震怒特們德爾懼逃匿大后宫多爾濟特之益急太后召多爾濟責之帝不忍傷太后意但罷其相位而遷多爾濟為集賢學士以額卜德哷勒復為平章政事秋七月李孟罷以王毅為平章政事賜衛士錢帛帝出見衛士有弊衣者駐馬問之對曰戍守邉鎮餘十五年以故貧耳帝曰此輩久勞于外留守臣未嘗以聞非朕親見何由知之自今有類此者必言於朕因命賜之錢帛發明賜衛士錢帛何以書所以豫其恤民之心也帝閔衛士之貧特命賜以錢帛其意善矣故特書豫之八月帝還大都帝在御已久猶居東宫而飲酒無度監察御史馬祖常上書言天子承天繼統當極保愛玉食之御猶審五味之宜酒醴之供可不思百拜之義大內正衙朝賀之地雖陛下不忘東宫之舊竊慮起民間觀聽之疑且國家百年朝儀尚闕誠使羣臣奏對之際御史執簡史官執筆則雖有懷姦利乞官賞者不敢出諸其口乞令中書集議或三日二日常出視朝則治道昭明生民之福也九月以博迪蘇為右丞相阿薩爾復為左丞相阿薩爾奏事畢帝問曰卿等日所行者何事對曰奉行詔旨而已帝曰卿等嘗奉行朕旨雖祖宗遣訓導朝廷決令皆不遵守夫法者所以辨上下定民志自古未有法不立而天下治者使人君制法宰相能守法則民知畏避免於刑戳若法弛民慢怨言並興求治難矣阿薩爾言故事丞相必用蒙古勳臣臣係西域人不壓人望因懇辭遂以宣微使博迪蘇為右丞相阿薩爾仍左丞相嶺北地震三日發明綱目書地震多矣未有書地震三日者地震三日則其變大也仁宗即位未幾而災異迭見帝豈有舛政逆令以干天地之和者乎寬仁恭儉而天變若此特以忌刻少思而變異應之捷於影響然則人君一念之間所繫若此觀之綱目之所書則天人相與之際毫忽無忒可不謹諸可不畏諸戊午五年春正月賜邁珠爵魯國公邁珠由湖廣平章政事進爵魯國公大司農未幾御史言比年以名爵太濫方詔裁罷近聞禮部鑄太尉司徒等印二十有六此輩無功於國載諸史册貽笑將來宜令革去從之廣義書曰官不及私昵爵罔及惡德况乎上公之爵迫近天子是以周成王以宋公封微子而諄諄作書致戒者慮其有僣擬之失也然非功德隆盛者詎能及哉今元人少有私愛者遽以是爵賜之其於名器也不亦輕且瀆矣元人何足道哉二月朔日食寫金字佛經共麇金三千九百兩初宣院使歲會內廷佛事之費以斤數者麵四十三萬九千五百油七萬九千酥蜜共五萬餘蓋自至元三十年間醮祠佛事之目僅百有二大德七年再立功德使司增至五百餘至是僧徒冒利無歷歲費滋甚較之大德又不知幾倍矣發明書醜之也侏􅍣之言何益於事佛氏之教何善於人而以金字寫之糜金三千九百兩他物稱是抑奚以有用之財為無益之費乎嗚呼以所費之金養天下之賢士以所寫之字録天下之竒書豈不安富尊榮而超軼前古耶不能以此自明而作為無益之事詎非大為盛德之纍哉直書于册不再貶而其失自見廣義嗚呼自東漢以來奉佛養僧者未有如元人之盛然而無補於國家者是佛之不靈而僧之無法也明矣世有溺而不知返者哀哉夏四月以齊諾史弼並為平章政事帝如上都六月術者趙子玉謀作亂伏誅衛王阿穆爾克貶髙麗子玉言於王府司馬曹圖卜台日阿穆爾克名應圖讖因潛謀備兵器航海往髙麗取阿穆爾克至大都俟時而發至利澤縣事覺詔誅子玉等七人發明子玉倡為鬼説愚誘衛王其謀既露自取亡滅然則讖緯術數之學果何益哉故既以作亂書之至此則正其伏誅之罪也然而以妖術惑衆者可以鑒矣秋八月帝還大都九月以伊拉齊為平章政事冬十一月增江南茶稅初世祖時置𣙜茶都轉運司於江州總江南及兩淮茶稅尋改江西其稅自二萬四千錠以漸增至一十九萬二千八百錠至是又因江西茶副帕哈哩鼎言立滅引增課之法敕以二十五萬錠為額復增至二十八萬九千餘錠郡縣所輪竭山谷之産不能充其半餘皆鑿空取之民間歲以為常時轉運司得以専制有司凡五品以下官皆朲決州縣莫敢誰何江南僉事鄧文原請罷其同俾郡縣領之不報發明書增不宜增也王者為國與民同利而不私其所有故文王之治岐關市譏而不征澤梁無禁世祖初置𣙜茶司以徵其稅今復增而益之則郡縣所輸竭山谷之産不能充其半餘皆鑿空取之民之貽害亦甚矣故書增稅以深貶之己未六年春二月朔日食夏四月帝如上都以特們德爾為太子太師特們德爾家居未逾年復夤緣起為太子太師中外聞之莫不驚駭時御史中丞趙世延論其不法數十事并內外臺劾其不可輔導東宫者又四十餘人然以太后之故皆不聽發明蓬生麻中不扶自直白沙在泥不染而黑此先正之格言也昜曰蒙以養正聖功也特們德爾姦邪小人夤緣進取以之為太子太師則幾何而不為太子之纍乎是時趙世延論其不法帝皆不聼嗚呼仁宗號稱明睿而反溺愛小人為之羽翼他日養成亂階伊誰之過歟故特書以志其基禍之本揚州火燬官民廬舍二萬三千三百餘區六月山東淮南諸路大水秋八月帝還大都冬十二月詔太子參決朝政帝嘗顧侍臣曰卿等以朕居帝位為安邪朕惟祖宗創業艱難恆懼不能守成使百姓樂得其所朕念慮在茲卿等固不知也至是復語左右曰前代皆有太上皇之號今太子且長可居大位朕欲為太上皇與若等遊觀西山以終天年羣臣皆稱善右司郎中伊嚕特穆爾曰臣聞昔所謂太上皇若唐玄宗宋徽宗皆當禍亂不得已而為之願陛下正大位保無疆之業前代虛名何足墓哉帝乃止庚申七年春正月朔日食帝崩廟號仁宗國語稱曰布延圖皇帝帝天性恭儉通逹儒術兼曉釋典不事遊畋不喜征伐不崇貨利事皇太后終身不違顔色待宗戚勳舊始終以禮大臣親老時加恩賚大官進膳必分賜貴近有司奏大辟每慘惻移時其孜孜為治一遵世祖成憲云發明日食正旦變之大者也上書揚州火書山東淮南諸路大水此書正月朔日食而即書帝崩於下則其變不虞生信矣世之人主以災異為玩而略無恐懼之心然以災異之已然者觀之則捷如影響木有一毫之差忒所以綱目必書而不削者欲使後之人君驗已然之災異修將然之德政而毋敢怠荒耳茍或不然又豈遇災而懼者哉博迪蘇罷太后以特們德爾為右丞相帝崩方四日特們德爾遂以太后命復入中書後數日參議省事青沙津有罪應杖太后又欲笞之太子曰不可法者天下之公徇私而輕重之非所以正天下也微政院使實勒們復以太后命請遷轉朝官太子曰此豈除官時邪且先帝舊臣豈宜輕動俟豫即位之後議于宗親元老賢者任之邪者黜之可也發明牝雞之晨惟家之索太后不知夫死從子之義擅拜右相不亦專乎考之分注特們德爾以太后命復入中書則是特們德爾不能逃其夤緑之罪此特書太后以者可見特們德爾之再相獨太后主之其他皆不欲也厥後專權擅政戕殺忠良誰實尸之乎此可見小人之才本不足以大授焉爾二月太子以赫嚕趙世榮並為平章政事籍江南冒為白雲僧者為民先是省臣言江南白雲宗總攝沈明仁強奪民田二萬頃誑誘愚俗十萬人私賂近侍妄受司空名爵已奉旨追奪請汰其徒并還所奪民田江浙省臣亦言明仁擅度僧四千八百人贓賄巨萬至是始正其罪籍其胃度為僧者復為民廣義嗚呼自元人入主中國紀綱不立法度廢弛未有若此之甚且以沈明仁江南一愚民耳得以夤緣作妖至于若此之盛而猶不見正其何罪則元政之不綱也明矣國還之衰於此可見特們德爾殺前中書平章政事蕭拜珠御史中丞楊多爾濟初特們德爾以肅拜珠及多爾濟攻其姦惡必欲報之至是以太后旨召二人至徽政院與徽政使實勒們御史大夫托克托呼問之罪以違太后旨多爾濟曰中丞之職恨不即斬汝以謝天下果違太后旨汝豈有今日邪特們德爾人引同時御史二人證其罪多爾濟唾之曰汝等備員風憲為是狗彘事邪坐者皆慙俯首特們德爾即起入奏未幾稱旨執二人載諸國門之外殺之是日風沙晦冥都人恟恟道路相視以目復欲奪多爾濟妻劉氏與人劉翦髮毁容自誓乃免時特們德爾日思報復讐怨誅戮不已左丞張思明謂曰山陵甫畢新君未立丞相恣行殺戮人皆謂隂有不臣之心萬一諸王駙馬疑而不至奈何不可不熟慮也衆皆危之特們德爾大悟曰非左丞言幾誤吾事發明嗚呼小人之心私而不公之心也茍有徼疵每懷念慮一旦得志遂相報復此固小人之常態也特們德爾憤拜珠多爾濟攻其姦惡必欲報之誣以違旨遂皆殺之然則小人挾其私憤濫及無辜而使忠臣義士陷於凶熖之中而人主不能為之辨明羣臣不能為之籲告哀哉直書特們德爾赦則其無君之罪又安足辭權其輕重正其是非此綱目所以為斷案也廣義中書平章政事與夫御史中丞位高責重者也特們德爾殺之若草菅則元人之失政可見矣三月太子即位大赦尊皇太后為太皇太后皇后為皇太后加特們德爾太師尋詔中外母沮議之特們德爾既復相即奏委平章王毅右丞髙昉等徵理在京錢榖虧耗者七十八萬石及諸路歲貢幣帛稍泚繆者俱責償所司程督嚴刻怨㴤復興矣奪李孟封爵左遷為集賢侍講學士特們德爾以孟初不附已讒搆于上盡奪其前後封拜制命仆其先墓碑左遷為集賢侍講學士欲因其不就中害之孟拜命欣然帝謂特們德爾子巴爾濟蘇曰爾輩謂孟不肯為是官今何如由是無敢言者發明小人子禍至是烈矣奪者強削之詞特們德爾疾孟初不附已讒搆於上盡奪其官則亦已矣而左遷之為學士嗚呼英宗未即位之前聽其所為今既即位之後亦聽其所為是豈人君之道也哉觀乎此然後可知當時之得失矣廣義抑觀孟以仁宗東宫舊恩超擢至此仁宗既崩孟勢孤矣于時即當引去可也然則可去而不去孟焉得為智乎以拜珠為平章政事拜昧安國孫也初襲為宿衛長帝在東宫聞其賢君之辭曰嫌疑之際君子所慎我掌天子宿衛而私往來東宫我固得罪亦豈皇太子之福耶卒不往至是由太常禮儀院使擢拜平章政事夏四月帝如上都近臣獻七寶帶却之有獻七寶帶者因近臣以進帝曰朕登大位不聞卿等進賢而為人獻帶是以帶誘朕也其還之發明人主初意之善或未必能保其終如英宗之清儉蓋終其身而不改亦可謂之賢主矣若其治效不進要自圖維經畫未得其䇿烏可以彼掩此併沒其善而不録哉此綱目所以於近臣獻七寶帶却之之事皆特書于册者也廣義分注所載誠中原英主之見也乃出于元帝之口不亦異乎孔子曰夷狄之有君不如諸夏之亡也信哉殺上都留守賀勝特們德爾怨勝嘗發張弼之獄乃奏其便服迎詔為不敬殺之籍其家發明尹氏曰人君之德莫大乎明明則姦邪不能欺莫大乎暗暗則姦邪得以乘特們德爾怨勝嘗發張弼之獄乃搆殺之而英宗竟不察其是否一聞誣譛即正典刑而其不明之過為可知矣賀勝宛抑之心為何如哉故書殺而不去其官明無罪也阿薩爾罷出為領北行省平章政事以拜珠為左丞相鼐喇呼塔斯哈雅並平章政事平章政事赫嚕御史大夫托克托呼等謀逆伏誅有告赫嚕托克托呼哈薩爾實勒們等與約蘇穆爾妻伊埒薩巴謀廢立事拜珠曰此輩擅權亂政久矣今猶不懲謀危社稷請鞫狀帝曰彼若以太皇太后為詞奈何命悉誅之籍其家發明赫嚕等謀為不軌將圖廢立此誠亂臣賊子之魁桀耳按罪行辟特書伏誅則其悖逆之罪豈不於斯正乎至若不去其官所以深著其惡也以特穆爾圖為平章政事六月以喀喇托克托為御史大夫詔免沙門繇役秋七月鼐喇呼罷以亷恂為平章政事八月下四川平章政事趙世延獄初世延既解中丞出為四川年章特們德爾猶怨之不已仁宗崩即屬其黨誘世延從弟索納爾哈呼誣告之逮世延置對既遇赦猶煆鍊成獄請置極典詔以經赦置不問特們德爾更以他事罔上繫之于獄過令自裁世延終無所屈發明凡書下某官獄無罪之詞也自特們德爾專政以來凡有私憤期於必報欲殺則搆以罪而殺之欲左遷則搆以罪而左遷之欲奪其官則搆以罪奪之欲下之獄則搆以罪下之有求必得無原不從而英宗略無可否於其間者英宗之待小人如是其厚而待君子如是其薄豈不深可惜哉直書下獄而不言所坐有所歸矣冬十月帝還大都十一月始服衮冕享太廟帝將以四時躬享太廟命禮官與中書翰林集議其禮制曰此追逺報本之道也毋以朕勞於對越而有所損焉至是以恭謝太廟乃備法駕服衮冕以行禮至仁宗室輒歔欷流涕左右莫不感動自是始以明年正月四時親享歲以為常禮畢還宫鼓吹交作萬姓聳觀百年廢典一旦復見至有感泣者廣義英宗即位之初見于史册者其謬多矣獨此最為得之河南飢帝問其故羣臣皆莫對帝曰良由朕治道未治卿等又不盡職致隂陽不和災害荐至自今宜各務勤恪以應天心母使吾民重困詔上書言事者得專逹特們德爾奏比詔內外直言得失今上封事者或徑至御前乞令臣等開視乃入奏聞帝曰言事者當直至御前如細民訴訟者則禁之發明易泰之彖曰天地交而萬物通也上下交而其志同也否之録曰天地不交而萬物不通也上下不交而天下無邦也是故國之治者由其上情得以下通下情得以上逹國之亂者由其上情不能下通下情不能上逹耳今令言事者得以專逹則庶幾無壅蔽之失矣豈不為當時之盛事哉故書豫之廣義特們德爾之計可謂姦矣英宗拒之不亦當乎辛酉英宗皇帝至治元年春正月罷元夕張燈于禁中帝欲以元夕張燈禁中為鰲山時張養浩以禮部尚書參議中書省事遂具疏因拜珠以諫曰世祖臨御三十餘年每值元夕閭閶之間燈火亦禁况闕庭宫掖之嚴邃尤當戒慎今燈山之搆所玩者小所繫者大所樂者淺所患者深帝大怒既而喜曰非張希孟不敢言即罷之賜養浩尚服金織幣以旌其直發明禁中張燈甚非美事世祖每痛抑之自是以後因而不禁則其失國之體大矣英宗因張養沿之言尋為革罷則一舉而聽言革弊皆在其中又豈其他愎諫自賢者比哉故綱目特揭而書之于册則豫之之意蓋可見耳廣義分注載養浩之言豈特元人之所當戒實萬世有天下者之所當法也英宗悅其言以旌其直不明而能之乎二月殺監察御史觀音保等時敕建西山佛寺甚亟御史觀音保索約勒哈迪密實成圭李謙亨以歲飢且東作方興上章極諫帝怒殺觀音保索約勒哈迪密實杖圭謙亨流尼嚕罕地發明人君之德莫大乎剛明剛則斷不偏明則聽合理茍無剛明之德則以直為枉以枉為直者多矣值東作方興之時督西山佛寺之役人不能諫也而觀音保等諫之人不能言也而觀音保等言之蓋亦忠於朝廷者不聽則已殺之何為英宗又非昏庸之主曷為舉措之若是耶書殺而不去其官所以譏其失政之刑也廣義蒙古篤於奉佛若飲醇酒而不覺自醉蔽固深密雖聖人與居莫之能化觀音保等不能勘破此意而反遭毒手孰云智乎然則不立于惡人之朝者豈伯夷之矯情也哉三月帝如上都帝以寮罕諾爾行宫制度卑隘欲更廣之拜珠曰北地若寒入夏始種粟黍陛下初登大寶不求民瘼而遽興大役以妨農務恐失民望從之以特克實為御史大夫領侍衛親軍都指揮使夏五月遷武宗子圖卜特穆爾于瓊州時特們德爾懷私固寵搆釁骨肉諳王大臣莫不自危中政使耀珠告托歡徹爾等交通親王於是徙圖卜特穆爾海南因禁日者毋交通諸王駙馬掌隂陽五科者毋泄占侯六月朔日食禁妄言時政趙元祚等以言事勒歸田里因禁妄言時政廣義于時元人之政皆出特們德爾然則禁言時政者彼將恣已所為而無己憚也噫時政且禁言之則凡欲攻特們德爾之惡者尚誰為之脫潁哉以濟爾噶朗為平章政事渾河溢被災者二萬三千二百户時大雨水滹沱河及巨馬河俱溢秋九月帝還大都先是駐蹕興和左右以寒請還上曰兵以牛馬為重民以稼穡為本朕遲留蓋欲馬得芻牧民得刈穫何計乎寒至是始還冬十一月命特克實領左右阿蘇衛十二月立皇后伊竒哩氏作壽安山寺佛像置中瑞司領之治銅五十萬斤時復遣帝師往西畨受戒賜金千兩銀四千餘兩鈔幣各巨萬發明作不宜作也天子主普天之下居臣民之上發號施令罔敢不正設政行辟罔敢不端以其為萬邦之表率故也今乃費有用之財作無益之像縱使其佛果靈安能舍爭土而居於土木骨骸之上乎此理甚明無足疑者英宗何若是之愚耶弗思甚也噫以堂堂萬乘之君而作僧剎佛像豈不深可愧哉故特書譏之壬戌二年春正月敕有司恤孔氏子孫貧乏者廣義嗚呼為往聖開來學為生民立命為萬世開太平者吾夫子也不有吾夫子者出則人類之絶久矣雖有帝王之興將何以理天下哉其有功於國家有功於生民自開闢以來未有盛於吾夫子也彼佛氏特西方之夷族耳駕一偏之説以聾瞽愚騃引徒延蔓蟠踞中原卒不可解至於季元其勢益烈蓋自世祖以來集僧四萬作資戒會毁宋故宫為佛寺幸大聖壽萬安寺建天壽萬寧寺寫金字佛經作壽安山寺佛像靡費巨萬略不致惜至於吾夫子但恤其子孫之貧乏者而未嘗見其有殊恩異禮甚則遣宦者而釋奠焉向無加號一美則與俳優之侮者幾矣嗚呼其所厚者薄而其所薄者厚元人之謂也二月以竒徹瑪嚕並為平章政事禁捕駕鵝違者籍其家免河南陜西十二郡民租之半以旱潦民飢故也發明人君之德不一而恤民之道為先能恤其民則所以得民心者正其所以得天心也今因十二郡旱潦民飢之故特免半祖則其恤民之心藹然見於書法之間矣此皆綱目之特筆也夏四月帝如上都秋七月特們德爾卒特們德爾自復相以來恃其權寵乘間肆毒睚眥之私無有不報帝覺其所譛毁者皆先帝舊人滋不悅其所為乃任拜珠委以心腹由是特們德爾漸見疏外因稱疾不出及聞拜珠奉旨往立其祖安圖碑于范陽將復蒞省事入廟至內門帝聞其來遣人止之遂快快而還尋卒于家發明特們德爾不書爵惡其姦侫也特們德爾憾蕭拜珠乃搆他事以殺之誤國妨賢厥罪匪一英宗茍能行天討特們德爾豈容輕宥况其相業無聞如奪李孟之爵如殺上都留守賀勝之類此皆小人所為故綱目於其卒也削去其官以示貶耳若生免刑誅死無譏奪則何以為筆削之權衡哉廣義是賊也報復私讐殺害無辜可謂罪大惡極者矣合正典憲以快人心今而得戴其元以歸地下賊實幸焉太皇太后鴻吉哩氏崩時有司將以十月事于太廟太常奏國哀以日之易月句有二日外乃舉祀事帝曰太廟禮不可廢迎香去樂可也九月京師地震冬十月以拜珠為右丞相特們德爾死進拜珠右丞相遂不置左相獨任以政十一月朔日食十二月復以張圭為平章政事癸亥三年春正月起王約吳元圭韓從益商議中書省事吳澄為翰林直學士時約等以年老致仕丞相拜珠一新正務遵禮老臣傳詔復起約等俾以其祿家居每日一至中書省議事至治之多所參酌澄延祐初詔起為集賢直學士以疾不果行至是以拜珠薦起為翰林直學士發明起者徴擢之詞豫之也此舉皆當時之君子以之為用則其尊主庇民之心可見矣蓋由拜珠之為相也特筆書之意有在耳廣義拜珠為相即薦老臣庶乎其得體矣罷上都諸路金銀冶上都雲州興和宣德蔚州奉聖州及雞鳴山房山黃蘆三義諸金銀冶聽民採煉以十分之三輸官廣義特書于册所以著其不專利之美也出趙世延于獄世延拘囚再歲其弟自以所言涉誣亡去丞相拜珠為言其無辜乃得釋因著令原告逃亡百日不出則釋待對者二月頒行大元通制時法制不一有司無所遵守命完顔納丹曹伯啓等纂集纍朝格例而損益之凡為條二千五百三十有九名曰大元通制頒行天下伯啓言五刑者刑異五等今黥杖徒役於千里之外百無一生還者是一人身被五刑非五刑各底於一人也法當改丞相雖是之而卒不果行命特克實振舉臺綱帝嘗謂臺臣曰朕深居九重臣下姦貪民生疾苦豈能周知故用卿等為耳目曩者特們德爾貪蠧無壓汝等拱默不言其人雖死宜籍其家以懲後敕寫金字藏經時方書金字藏經帝在上都使左丞蘇蘇詔學士吳澄為序澄曰主上寫金為民祚福甚盛舉也若用以追薦臣所未諭蓋福田利益雖人所樂聞而輪回之説不過謂為善者死則上通高明其極品與日月齊光為惡者死則下淪汚穢其極下與沙蟲同類其徒遂創為薦拔之論以惑世人今列聖之神上同日月何用薦拔且自國初以來凡寫經追薦不知其幾若未效是無佛法矣若已效是誣其祖矣撰為文辭不可以示後世發明三代以後英君誼辟如漢武之衣章六經明帝之臨雍拜老唐太宗之增廣生員明皇之作孝經序宋真宗之頒九經于州縣此皆播在簡册可為考者逮至冇元之世事佛漸謹如作佛寺幸佛寺寫金字經兩見綱目君子前後書之略無假借皆所以著其崇尚虛無而不知禮義之失也傳曰其所令反其所好而民不從安有天子崇尚虛無而欲化天下於禮義豈不難哉廣義吳澄拒元人之詔可謂不惡而嚴者矣道學之寄豈曰無人三月帝如上都夏四月詔行助役法遣使考視稅籍高下出田若干畒使應役之人更掌之收其歲入以助役費官不得預六月追奪特們德爾官爵特們德爾既死罪惡日彰監察御史蓋繼元宋翼言其姦貪負國生逃顯戮死有餘辜乃命毁所立碑并追奪官爵及封贈制書籍沒其家資大風拔木大風雨雹拔柳林行宫木二千餘株奉元行宫正殿災帝語羣臣曰世皇建此宫室至朕而燬實朕不能圖治之故也嘗御大安閣見太祖世祖遺衣皆縑素木綿重加補綴嗟嘆良久謂侍臣曰祖宗創業艱難服用節儉乃如此朕焉敢頃刻忘之發明大風拔木行宫殿災不祥甚矣元之君臣既無修德應天之實至是天變示戒猶不知警不踰月而君臣遇禍元祚幾滅綱目詳而書之所以示人主兢業恐懼之端為後世戒耳於元乎何誅廣義觀英宗不敢忘其祖之節儉其過于方乃祖於田舍翁者遠矣秋七月詔減海運糧拜珠以海運糧視世祖時頓增數倍今江南民力困極而京倉克滿奏乞歲減二十萬石帝遂併特們德爾所增江淮糧免之廣義書詔減海運糧者所以著元人之富庶也特患不能持盈守成國祚之所以衰矣八月癸亥御史大夫特克實弒帝于南坡及右丞相拜珠初特們德爾既奪爵籍産特克實等姦黨不自安帝在上都以夜寐不寧命作佛事拜珠以國用不足諫止之既而懼者復隂誘羣僧言國當有厄非作佛事大赦無以禳之拜珠叱曰爾輩不過圖得金帛而已又欲庇有罪邪姦黨聞之益懼乃生異謀至是帝自上都還駐驆南坡是夕特克實與知樞密院事額森特穆爾諸王額特布哈等謀逆以特克實阿蘇衛兵為外應特克實先與前平章政事齊勤特穆爾殺右丞相拜珠特克實直犯禁幄手弒帝于卧所時年二十一廟號英宗國語稱曰格根皇帝帝性剛明嘗以地震避殿撤樂減膳近臣有稱觴賀者叱曰朕方修德不暇汝為大臣不能匡輔反為諂邪拜珠進曰咎在臣等宜求賢自代帝曰毋多遜朕之過也嘗謂宰執曰中書選人署事旬日御史臺即改除之臺除者中書亦然今山林儒逸良多卿等不能盡心求訪惟以親戚故舊更相引用邪其明斷多類此然以果於刑戮姦黨畏誅遂搆大變發明莊十二秋八月甲午宋萬弒其君捷及其大夫仇牧君子美牧能死君難夫君弒而大夫死於其難春秋書之者其所取也大夫死於弒君之難而有不書者故知孔父牧息皆所取也著其節而書及不失官而書右丞相是綱目所賢也特克實將弒英宗拜珠生存則不可德而弒於是先攻拜珠而後及其君能為有無亦庶幾焉亂臣賊子畜無君之心者必先翦其所忌則有終其身而不敢動者也不有君子其能國乎綱目賢拜珠示後世人主崇奬節義之臣乃天下之大間有國之急務也綱目取則春秋故其書法如此然後知春秋綱目前後一轍而亂臣賊子始無所逃於鈇鉞之誅矣廣義或曰分注載帝命作佛事而姦臣又誘羣僧言國當有厄非作佛事無以禳之拜珠叱拒之乃已假令作之英宗果免于弒厄乎曰不免曰何以知其不免曰時特克實逆謀已成作亦弒不作亦弒弒與不弒實無係于佛事之作不作也特克實自知不行弒逆亦難免于誅戳此逆賊之本心也故史稱英宗果於誅戮姦黨畏誅遂搆大變有足徴矣曰然則未有甲子具書于册者也此何以書八月癸亥曰位莫重于君相君相被弒事變之極也此綱目之所以特筆也諸王額特布哈等奉璽綬迎晉王伊蘇特穆爾于北邉九月晉王即位于龍居河赦伊蘇特穆爾裕宗之孫晉王噶瑪拉長子襲封晉王仍鎮北邊初王府內史都爾蘇得幸於王嘗偵伺朝廷事機其子哈克繖事丞相拜珠得入宿衛久之哈克繖知特克實欲害拜珠遂歸是年三月宣徽使塔坦來王邸為都爾蘇言主上將不利於晉王由此二人深相要結八月一日特克實密遣烏魯斯告曰我與哈克繖額森特額爾實逹爾謀定事成推立王為皇帝又以告都爾蘇曰汝與巴蘇呼知之勿令舒瑪爾節聞也於是王囚烏魯斯遣巴勒密實特等赴上都以密謀告變未至帝遇弒諸王額特布哈及額森特穆爾奉皇帝璽綬來迎晉王遂立于龍居河大赦天下以額森特穆爾為右丞相都爾蘇為平章政事特克實樞密院事冬十月特克實額森特穆爾等伏誅諸王邁努言於帝曰不誅元凶則陛下善名不著天勒下後世何從而知帝深然之於是誅額森特穆爾鄂哲索諾木圖們等於行在所命舒瑪爾節寧珠入京收特克實齊勤特穆爾等悉誅之戮其子孫籍沒家産惟特們德爾子治書侍御史索諾木議流張圭曰索諾木從賊親斫丞相拜珠臂乃欲活之邪尋亦伏誅餘黨俱免官發明弒君子賊法所必討帝因諸王邁努之詣悉正典刑討賊之義正也蓋亂臣賊子始則弒其君者欲圖後主之榮利然往往滅亡誅戮無一全生然則果何益哉雖然弒君天下之大惡而亂臣賊子終無所逃者可見天理之在人心有不可得而汩沒耳茍使亂臣賊子而得以逃其生抑將肆其欲而無禁矣直書伏誅所以扶三綱而立人極也廣義書特克實等伏誅著元人討賊之義也以額卜德哷勒平章政事十二月帝至大都詔雪楊多爾濟蕭拜珠賀勝等寃御史言特們德爾專政誣殺楊多爾濟蕭拜珠賀勝巴延觀音保索約勒哈迪密實黥竄李謙亨成圭罷免王毅高昉張志弼請詔雪之詔存者召還録用死者贈官有差發明多爾濟等為特們德爾之誣殺銜寃泉壤今已久矣帝初即位而能首雪其寃此亦存天理於既沒也大書特書深豫之耳追尊考晉王為皇帝母鴻吉哩氏為皇后廟號顯宗盜竊太廟神主太廟神主制皆用黃金為之至是仁宗及莊懿慈聖皇后金主為盜所竊太常博士李好文言在禮神主當以木為之金玉祭器宜貯之别室不從時參知政事瑪喇勒領太常禮儀使當遷左丞集賢大學士張圭曰太常奉宗祐不謹當得罪而反遷官何以謝在天之靈命遂格發明定九年經書盜竊寶玉大弓君子則罪其不能守夫以元失其政姦臣檀權雖先帝神主猶不能守而盜得竊諸太廟其能國乎故大書之所以譏帝與執政之臣見不恭之大也此義行則有天下國家者各知所守之職不敢忽矣流諸王伊嚕特穆爾等于邉地伊嚕特穆爾雲南額特布哈海南庫魯克布哈尼嚕罕博羅烏魯斯布哈海島並坐與特克實逆謀封邁努為泰寧王舒瑪爾節言南坡之變諸王邁努逃赴潛邸願郊死力且請誅戮元凶上契宸𠂻嘗蒙奬諭今臣等議宗戚中能自拔黨逆者惟有邁努請加封賞以示激勸遂以泰寧縣五千戶封邁努為泰寧王以都爾蘇為左丞相茂穆蘇寧珠索多並加光祿大夫賜舒瑪爾節等金有差以討逆功也甲子泰定皇帝泰定元年春正月以奈曼台為平章政事召圖卜特穆爾于瓊州二月開經筵江浙行省左丞趙簡請開經筵及擇師傅令太子及諸王大臣子孫受學章上遂命平章政事張圭翰林學士承旨和塔拉都哩默色學士吳澄集賢直學士鄧文原王結等以常範資治通鑑大學衍義貞觀政要等書進講發明人君莫大乎好學君不學則無以知治亂臣不學則無以濟經綸此學所以為治天下之先務也元昜五主歷年五十然未見其有能開經筵者帝即位之初未遑他務而首開經筵可謂能知先務者矣豈不為自我作古者哉綱目特書意有在爾廣義元自世宗以來紛紛繆舉迭見于册而未有開經筵之美事也至此忽有是舉如雲霧一開而日星朗然豈不為之一快立皇后巴拜哈斯氏立子喇實晉巴為皇太子夏四月帝如上都大風地震帝以烈風地震戒飭百官并詔大都守臣集議以聞張圭自大都至以其與樞密院御史臺翰林集賢院等官集議言圖們德爾嘗與特克實之徒結為父子終以遺患搆成弒逆子索諾木親與逆謀今復給還所籍家産其諸子尚在京師夤緣再入宿衛宜仍籍其家産竄其子孫以明不共戴天之義諸王額特布哈博囉伊嚕特穆爾庫魯克布哈與特克實逆謀罪止於流竄宜誅之以謝天下遼王托克托鎮遼東因國家有變報復讐忿殺親王妃主百餘人分其羊馬畜産殘忍骨肉今不之罪乃復厚賜放還臣恐國之紀綱從此不振况令死者含寃感傷和氣宜奪削其爵土置之他所以彰天威武備卿齊里前太尉布哈矯制令英實強收鄭國寶妻噶哈刑曹逮鞫服實竟原其罪夫匹婦銜寃三年不雨宜仍付刑曹鞫正其罪賈胡中賣寶石分珠寸石價直數萬夫以經國有用之寶而昜此不濟飢寒之物是皆時貴與中貴之人妄稱呈獻冒給回賜高其價直且至十倍彼此通同暗行分用宜行禁止自古聖君惟誠於治政可以動天地感鬼神初未嘗徼福於僧道也至元三十年醮祠佛事之目止百有二大德七年再立功德使司積五百有餘今年一增其目明年即指為例已倍四之三矣比年佛事愈繁享國不氷致災愈速事無應驗斷可知矣宜罷功德使司及纍朝忌日醮祠佛事名目止令宣政院主領修舉餘悉停罷遊惰之徒妄投宿衛部屬及宦者女紅太醫隂陽之屬不可勝數一人收籍一門蠲復一歲所請衣馬芻糧數十户所徴入不足以給之耗國損民為甚宜如世祖時支請之數給之餘悉減汰特們德爾専恣特克實搆逆良善死於非命皆未申理宜加褒贈優敘其子孫天下繫囚寃帶宜命省臺選官審録結正邉鎮利病宜命行省行臺體究興除廣海鎮戍卒更病者宜給粥食藥力死者給鈔責所司及同鄉者歸骨於其家廣東採珠勞擾宜悉停罷至元三十年以後冗員宜悉減併不該常調之人不得濫入常選凡官養馬駝宜如大德團槽之制所賜勳戚及宦者之田悉拘還官其僧道典買民田及民間所施産業宜悉役之左右之臣非有功勳勞效著明實迹不加以賞賜請皆著為令凡數千言詞甚切至帝皆不從發明風乃隂氣地乃隂質前書大風拔木而有弒逆大變此書大風地震者夫小人隂之類也是時大姦雖誅羣惡尚在夤緑進用漸干政事而大風地震之應不在茲乎分注既載其集議之事而所上之言帝復不聽惡在其能集議耶故綱目皆削而不書者則其不滿當時之意可見矣廣義觀張圭一疏凡數千言詞甚切至帝皆不從嗚呼圭以切至之言告其君而不獲見聽者道不行也道既不行又不能去惡在其為大臣哉秋八月帝還大都封圖卜特穆爾為懷王徙雲南王旺沁為梁王冬十月命左右丞相日直禁中是歲水旱蝗發明其曰水旱蝗災及民物也言災而不言地災重及民也而詳志之如此者重民事謹天災仁人之心王者之務也胡氏曰遇天災而不懼忽民事而不修而又為繁政重賦以蹙之國之亡無日矣綱目書此欲後世人君遇天變而當懼修民事而不忽而不可視之為泛常也其義豈不明且切哉此綱目書災異而不書祥瑞之深意爾乙丑二年春正月命懷王圖卜特穆爾出居建康三月帝如上都夏四月革大臣兼領軍務參知政事遵逹布哈言大臣領軍政前古所無特克實以御史大夫額森特穆爾以知樞密院事皆領衛兵如虎而翼故成逆謀乞軍衛之職勿以大臣領之庶勳舊之家得以保全從之仍賜幣帛以旌其直五月河溢汴梁秋九月帝還大都冬十月都爾蘇罷為御史大夫十一月復以為左丞相發明不書罷都爾蘇而書都爾蘇罷為御史大夫則是可罷者也復以為相果何禮乎帝之是非誠大謬矣故書復以為左丞相以著其成過也十二月以達實特穆爾為右丞相丙寅三年春二月以察納為平章政事帝如上都夏四月畿內河北山東飢初張圭歸省保定帝思念之召還問曰卿來時民間如何圭曰臣老少賔客不能遠知保定真定河問臣鄉里也民飢甚朝廷雖賑以金帛惠未及者十五六帝惻然命賑糧四月至是復令免三路及濟南等郡縣民半租發明飢必書重民災也夫以畿內河北山東皆元根本之地而同月飢焉則民之憔悴亦甚矣孟子曰凶年飢歲君子民老弱轉乎溝壑壯者散而之四方者幾千人矣而君子倉廩實府庫克有司皆莫之告是上慢而殘下也泰定之世災異迭見而飢饉頻仍則其業亦殆矣哉故特謹而書之禁西僧馳驛擾民先是西臺御史李昌言嘗經平涼府靜會定西等州見西番僧佩金字圓符絡繹道途馳騎纍百傳舍至不能容則假館民舍因迫逐男子姦汚婦女奉元一路自正月至七月往返者百八十五次用馬至八百四十餘匹較之諸王行省之使十多六七驛戶無所控訴臺察莫得誰何且國家之製圓符本為邉防警報之虞僧人何事而輒佩之乞更正僧人給驛法且得以紏察不報至是聞其擾民禁之秋七月帝還大都河決陽武漂民居萬六千五百餘家尋復壞汴梁樂利隄發丁夫六萬四千人築之冬十月賜大天源延聖寺田中書省臣言養給軍民必資地利况土地祖宗所有子孫當共惜之臣恐茲復藉為口實妄興工役徼福利以逞私欲也帝嘉納之然不能用廣義嗚呼泰定可謂愚矣去年大風地震又水旱蝗今年畿內河北山東民飢并河決陽武况以西僧馳驛擾民方禁止之今又以田而賜僧寺何其恬不知省耶惟其若是故明年旱蝗民飢山崩地震日蝕迭見于册不亡得乎十二月赦都爾蘇當國與平章額卜德哷勒以私意欲因赦酬纍朝賈胡所獻諸物之直及擢用英廟至今為憲臺奪官者左司都事宋本言今天警災異而畏獻物未酬直者憤怨形諸王言必貽笑天下憲司裭有罪者官世祖成法也今上即位纍詔法世祖若擢用之是廢成憲而反汗前詔也復有邪侫贓穢者將治之邪置不問邪衆開本言相視嘆息明日觀詔本遂稱疾不出發明治世以大德不以小惠此諸葛武候之言也是時都爾蘇當國以私意肆赦酬纍朝賈胡獻物之直嗚呼以朝廷之恩典為小人之隂謀則失禮甚矣不存大德而務小惠豈不為諸葛武候之罪人乎小人擅政而欺其君如此則其他時事從可知爾然則泰定縱而不察以聽小人之所為享國不永烏足道哉故直書赦以深譏之丁卯四年春正月御史臺臣請親祀郊廟不允先是監察御史趙思魯以大禮未舉言天子親祀郊廟所以通精誠逆福釐生蒸民阜萬物百王不易之禮也宜講求故事對越以格絶嘏至是御史臺臣復以為言帝曰朕遵世祖舊制其命大臣攝之發明郊所以祀天地廟所以祀祖宗皆帝王職分之當為非出位之事也然必有其誠則有其神無其誠則無其神故必親往祀之所以通精誠報厥本生蒸民阜萬物百王不易之禮也泰定愎言不從乃以朕遵世祖舊制為言嗚呼世祖舊制固多而不遵者不少何獨郊廟一事遵之乎此皆理屈詞窮強辨飾非之意耳安有見義不為尚可謂之賢君哉直書不允深貶之也廣義大抵祀者國之大事况乎天子之禮豈有大於祭天享親之禮耶是禮也奚可使人攝之聖人曰吾不與祭如不祭噫於此不用其誠惡乎用其誠泰定享國不永厥有由矣帝如上都夏四月盜竊武宗神主發明泰定之世兩書盜竊神主則其怠慢不恭之罪著矣夫以太廟神主所守至嚴而使盜得竊之尚可謂之有人之國哉此皆元人無意守廟而妖氣乘之竊其神主云爾然此特書竊武宗神主者誠以武宗舍子而立弟仁宗立子而舍姪則是遼武宗之約而絶其矣今而盜竊其主得非元人無意武宗而變異隨之以生焉不然綱目何不概書盜竊太廟神主而必書盜竊武宗神主邪此綱目書法之深意而非元史舊文之可比也旱蝗民飢秋八月山崩震通漕縣山崩碉門地震有聲如雷畫晦天全道山崩飛石斃人鳯翔興元成都峽州江陵地同日皆震九月朔日食發明泰定即位才四年爾旱蝗民飢山崩地震日食地裂大風水旱之變紛紛見於史册未幾果有帝崩之應諸王爭立朝政紊亂豈非以先事而戒變不虛生者乎災異若此先儒有言一念之善祥風和氣一念之惡妖星厲鬼後之有天下者可不戒諸閠月帝還大都冬十二月蔡公張圭卒戊辰致和元年文宗皇帝圖卜特穆爾天歷元年春二月帝如上都命簽樞密院事雅克特穆爾等居守徙懷王圖卜特穆爾於江陵夏四月禁蒙古色目人居親喪逹實特穆爾都爾蘇請凡蒙古色目人效漢法丁憂者除其名從之發明三年之喪者子生三年然後免於父母之懷夫三年之喪天下之通喪也不以貴而隆不以賤而殺不以中外而有異此通行之逹道耳蒙古色目雖云夷狄然皆有父母之養初不生於空桑者詩不云乎蓼蓼者莪匪莪伊蒿哀哀父母生我劬勞未聞欲居親喪而反禁絶之者也元之悖禮可勝惜哉故特書禁所以明其不當禁也五月以達實特穆爾為平章政事秋七月寧夏地震帝崩于上都帝崩文宗不為立廟諡世止稱為泰定帝王禕曰武宗以兄弟相及約繼世子孫迭居大位而仁宗惑於憸言不守宿諾傳位英宗乃使武宗二子明宗文宗出居於外及英宗遇弒而明宗在北文宗在南晉邸乘間入繼大統或謂晉邸非所宜立雖然晉王於世祖孫也於次為長雖守藩服嘗有盟書今而國統之弗繼則求所當立者舍晉王之系將誰屬邪然則謂晉邸非所宜立者亦過也舊傳英宗之弒晉邸與聞焉故其殁不舉請諡升祔之典明其為賊也然考之實録皆不得其實傳聞之謬烏可信哉廣義抑觀文宗不為泰定立廟諡者文宗之意以為已為武宗之子仁宗當遵武宗之約傳位于兄和實拉以及於已今泰定乃裕宗之孫又非英宗之子故不為之立廟諡者其意蓋為此也所以然者私憾也豈以其與聞乎弒而然耶觀者考焉八月簽樞密院事雅克特穆爾謀逆執中書省御史臺臣額卜德哷勒等下獄遂遣使迎懷王圖卜特穆爾于江陵雅克特穆爾以帝由晉邸入繼與諸王滿都等乘帝有疾恆懷異圖以身受武宗寵拔之恩欲迎其二子周王和實拉懷王圖卜特穆爾立之至是帝崩于上都皇后皇太子遣使詣大都命平章政事額卜德哷勒掌百司印章及諭安百姓雅克特穆爾因與安西王隂結勇士八月甲午黎明百官集興聖宫雅克特穆爾率黨十七人兵皆露創號於衆曰武宗皇帝有子二人天下正統當歸之敢有不順者斬執平章政事額卜德哷勒御史臺臣特默格并左丞托多參政王上熙參議托克托吳秉道等下獄乃與安西王入守內庭分處腹心於樞密推前湖廣左丞相拜布哈琳為左丞相詹事塔斯哈雅為平章蘇蘇為左丞王布濟逹為樞密副使與右丞趙世延等分典庶務時有諸衛軍無統屬者及謁選并罷退軍官皆給之符牌以待調遣衆既受命皆注目而立未知所謝乃指使南向拜衆驚竦毛髮凛然始知其意在懷王也雅克特穆爾宿禁中達旦不寐一夕再徙人莫知其處者將一月又恐人心疑懼謀令逹實特穆爾矯為南使云懷王旦夕且至復令奈瑪台為北使稱周王亦從諸王南來矣發明晉人舍嫡立幼春秋譏之書謀逆罪悖也泰定元年書立喇實晉巴為皇太子則是神器有屬而非倉卒無繼者之比今而泰定既崩太子當立父沒子剮禮之正耳安有舍其儲嗣而立懷王者乎雅克特穆爾不顧大議逞其邪謀棄太子而迎懷王背國法而射厚利其罪可勝誅哉觀綱目之所書則逆順之勢昭然矣此所以為是非之斷案也廣義或曰分注載雅克特穆爾以帝由晉邸入與諸王滿都等乘帝有疾恆懷異圖以身受武宗寵拔之意欲迎其二子周王和實拉懷王圖卜特穆爾立之觀于此則知其欲報武宗之恩故也何以大書其謀逆耶曰豫讓有言既以委質為臣而求殺之是二心也今雅克特穆爾臣事泰定尚何異圖之懷乎臣事其君而懷異圖此所以為逆也况乎逆事成於一月然後矯使以迎懷王其初意將欲自移元鼎久知人心不服不得已而迎懷王耳曰周王兄也懷王弟也雅克特爾何不迎其其兄反迎其弟耶曰周王和實拉於仁宗朝嘗造謀以正名分且欲誅讒搆之人事弗獲成逃居漠北若圖卜特穆爾泰定初嘗召於瓊州矣後又封為懷王又命出居建康又徙江陵道路之近消息之通實非周王之比且于時人心洶洶雅克特穆爾慮禍及故矯召懷王以解急難耳觀其謂衆曰懷王旦夕且至其意瞭然矣綱目書謀逆者誅其心也夫何過哉河南行省平章政事巴延殺參知政事圖卜台初明埓棟阿至河南以密謀告巴延巴延從之遂殺其僚屬庫哩等而勒兵以俟參知政事圖卜台獨曰今蒙古軍與宿衛之士在上都而令特默齊軍守諸隘吾恐此事之不可成也巴延不從是夜圖卜台手刃欲殺之巴延覺遂拔斂殺圖卜台而奪其所部軍器焉匹圖卜特穆爾發江陵使以巴延為河南左丞相發明殺殺無罪也巴延助逆無道興兵犯順而圖卜台弗從則其所守者君臣之義耳圖卜台欲誅巴延而為巴延所殺悲夫當時上無天子下無方伯而使忠臣義士戕殺於逆之手無所籲告可哀也已故直書巴延殺則其專輒無君之罪著矣雅克特穆爾遣薩敦守居庸關騰吉斯屯古北口諸王滿都等謀叛附于雅克特穆爾伏誅諸王滿都阿穆爾台庫庫楚平章瑪魯集賢學士烏魯斯布哈太常禮儀院使噶海齊等十八人同謀附雅克特穆爾事覺悉誅之發明欲知順逆之勢當觀向背之人滿都等元室懿親視雅克特穆爾叛不能倡義討賊而乃助逆無道則其罪不待辨説而自明矣今而事覺遂皆誅夷嗚呼逆謀未成其身先戮然則倡邪鼓亂者果何益哉故既書謀叛以正其不赦之罪復書伏誅以正其討賊之罪由是亂臣賊子義安能茍免於天地之問哉皇太子喇實晉巴即位於上都遣梁王旺沁右丞相達實特穆爾將兵分道討雅克特穆爾時年九歲改元天順發明書皇太子即位于上都所以豫正統而明當立也至是直書分兵討者正名定罪故耳今焉正其名義則明嗣君誅亂討逆而著雅克特穆爾之罪也權其輕重而書之以討且著其正統之歸則亦足少伸大義於天下而使三綱之理未盡泯也嗚呼矣廣義書皇太子討雅克特穆爾正名定罪也懷王圖卜特穆爾入京師以明埒棟阿庫庫台蘇蘇並為平章政事曹立為右丞巴延為御史大夫趙世延為御史中丞高昌王特穆爾布哈知樞密院事發明入者逆而不順之詞不曰至而曰入不豫其至也懷王既知泰定之子已正儲位則當力辭不至帥兵討賊則其名義庶幾正也奈何欲竊神器怡然就道即入京師而略無一毫遜避之意則難乎免於叛逆之罪矣今入京師而書曰懷王猶見其為元之臣子至於襲位以後皆斥其名以著其篡逆而非元之臣子也其旨嚴哉九月圖卜特穆爾殺平章政事額卜德哷勒流左丞托多等于逺州發明額卜德哷勒之殺前史以伏誅書未免失是非之公論矣夫附皇太子拒圖卜特穆爾則是舍逆從順大義所在反謂之伏誅可乎此君子所為懼綱目所由作也噫必有君子者出然後綱目之義大明於天下矣此綱目徇名責實之深意諸王額森特穆爾等兵由遼東入遷民鎮圖卜特穆爾襲帝位圖卜特穆爾至雅克特穆爾言擾攘之際不正大位不足以係天下之志圖卜特穆爾以其兄和實拉在漠北欲虛位俟之雅克特穆爾曰人心向背之機間不容髮一或失之噬臍無及圖卜特穆爾曰不得已當明吾志播告中外遂即帝位改元天歷詔天下曰謹俟大兄之至以遂固讓之心大赦封雅克特穆爾為太平王右丞相知樞密院加巴延太尉發明襲者掩取之詞罪其逆也前書皇太子喇實晉巴即位者正也此止曰圖卜特穆爾何蓋不豫其有天下也故書襲帝位若曰襲而取之云爾綱目於秦書胡亥襲位所以明其不當立然胡亥之立猶書矯詔圖卜特穆爾入京師竊據寶位則較諸矯詔襲位者又不侔故綱目直書襲位以著其篡逆之罪廣義按春秋傳輕行而取之曰襲書曰襲者明其無上授也梁王旺沁等兵入居庸關與雅克特穆爾戰不利旺沁等兵次榆林雅克特穆爾將兵拒之遣薩敦先馳至榆林西乘其未陳薄之旺沁兵稍却圖卜特穆爾令雅克特穆爾禦遼東兵次薊州旺沁等兵遂破居庸關雅克特穆爾聞之倍道還逆戰於愈河之北旺沁兵復不利還至紅橋阻水而陳相持者纍日旺沁再戰再北遂率餘衆遁還發明雅克特穆爾有可誅之罪則當選擇良將聲罪致討詔告天下以誅亂臣猶或庶幾焉耳既不能然乃以梁王為制將不諳軍務安能成功至是辱王師故書與雅克特穆爾戰不利以罪之其為中興之纍多矣惜哉與唐書吐突承瓘討王承宗戰不利義同君子宜並觀之靖安王扣布哈等兵破潼關河南大震扣布哈等將陜西省兵東繫潼關破之遂克閿鄉陜州御史大夫額森特穆爾分兵北渡河中趨懷孟河東官吏皆棄城走特默格南過武關破鄧州直趨襄陽下郡縣三十餘橫絶數千里河南大震諸王額森特穆爾等兵破通州遂趨京師雅克特穆爾拒之引還圖們岱爾及諸王額森穆爾軍破通州將襲京師雅克特穆爾引軍還擊之陽翟王太平敗沒死者蔽野餘兵皆潰而還諸王呼喇台等兵入紫荆關守關軍士皆潰散遂乘勝進逼京城遇敵兵於良鄉南轉戰至瀘溝橋聞雅克特穆爾援兵至乃引去發明圖卜特穆爾襲位雅克特穆爾謀逆至是踰三月而諸王舉兵皆不書反誅亂臣討賊子汲汲然惟恐或後蓋以大盜未除環四海之內未有能正之者諸王雖不純乎義要之名曰為元誅亂之意固可暴白於天下故綱目詳書于册亦足以見討賊有人大義未遂終泯者也然前史之修以圖卜特穆爾為王故於諸王舉兵之事往往以謀反入寇書之夫誅亂臣討賊子大義所在反謂之入寇可乎此君子所為懼綱目所由作也由是大義明而是非正矣冬十月圖卜特穆爾遣使至陜西省臣執之送上都雅克特穆爾遣人召陜西行省平章特默齊行臺御史滿濟勒哈台不至至是使者頒懷王即位詔至陜西及甘肅省臣臺臣焚毁其詔執其使械送於上都既而使者持詔至浙江歸言省臣亦皆不服懷王欲悉誅之中書左司郎中䇿丹勸雅克特穆爾曰雲南四川且猶未定乃欲以使臣一言殺行省大臣恐非盛德事雅克特穆爾入言之事乃止圖卜特穆爾兵陷上都梁王旺沁遁走遼王托克托死之先是齊王伊嚕特穆爾及東路蒙古元帥布哈特穆爾等聞懷王即位乃舉兵趨上都圍之時諸王大臣出戰屢敗勢蹙都爾蘇等奉皇帝寶降梁王旺沁遁走遼王托克托遇害帝不知所終伊嚕特穆爾獲皇帝寶又收諸王百司符印遣兵送都爾蘇等於京師發明書陷何賊之也考之分注攻陷上都者伊嚕特穆爾等必歸獄圖卜特穆爾者討首惡也遁走者匹夫之事梁王遇難不能委身一戰同死社稷而乃逃遁茍免不亦賤乎遼王托克托死兵難而分注以遇害為文綱目變文直書死之所以豫其能全厥義也觀綱目之所書然後邪正逆順各得其所而邪逆者必無容身之地矣廣義陷上都者乃齊王伊嚕特穆爾與東路元帥布哈特穆爾等非圖卜特穆爾兵也綱目書圖卜特穆爾兵陷上都與趙穿弒君而董狐直書趙盾意同誅首惡也圖卜特穆爾告祭郊廟靖安王扣布哈等大敗河南兵進拔虎牢尋引還扣布哈等兵至鞏縣黑石渡與河而兵戰大敗之獲其輜重巨萬遂克虎牢旋引軍至汴會有使者來言上都已破河南省臣遣使來招諭扣布哈等殺其使臣十餘輩後圖布特穆爾遣使親諭之乃逡巡引去發明扣布哈等率兵討賊所向克捷名義頗正今而大敗河南兵進拔虎牢則其兵力足以破賊而反正明矣既而河南招諭殺其使者茍能自此聲大義於天下南向一決反正乘與則討賊之義不亦偉乎惜其因賊親諭逡巡引還而甘於自盡豈不深可惜哉特書引還深罪之也十一月圖卜特穆爾遷泰定皇后鴻吉哩氏于東安州遣使迎周王和實拉于漠北圖卜特穆爾殺梁王旺沁左右丞相都爾蘇等梁王旺沁遁圖卜特穆爾募有能捕之者官五品以上尋被執賜死都爾蘇茂穆蘇寧珠薩題勒密實額森特穆爾皆棄市時復欲盡戮朝臣之在上都者平章政事敬儼抗論謂是皆常歲從行之人殺之非罪衆賴以免發明書圖卜特穆爾告祭南郊以罪其僣書圖卜特穆爾遷泰定皇后于東安州以罪其逆書圖卜特穆爾殺梁王旺沁等以罪其專然書殺而特皆不去其官所以明梁王等之無罪因以見圖卜穆爾有罪也明乎此然後可知綱目誅亂討逆之深意矣四川平章政事囊嘉特稱兵燒絶棧道囊嘉特自稱鎮西王以其省左丞托克托為平章雲南亷訪使楊靜為左丞殺平章庫春等稱兵燒絶棧道發明不曰起兵而曰稱兵者不宜稱也燒絶棧道其惡尤甚矣囊嘉特茍能少知大義移檄天下共謀討賊反正乘興是乃臣子徇國之心也奈何自稱為王燒絶棧道則是乘時為逆而非為元討賊者矣然何以不書反是時逆賊在上囊嘉特雖反與之等耳茍以不書則是以逆賊為正而天下必昧討賊之心焉綱目所以恕囊嘉特者正以罪圖卜特穆爾也其旨嚴哉此所以為綱目徵君子莫能修之弛蒙古色目人居親喪之禁自願者聽廣義短喪之説君子非之久矣况曰禁乎王道本乎人情豈容強哉至此書曰弛者幸之也已天歷已二年春正月周王和實拉稱帝于和寧之北圖卜特穆爾遣使奉迎勸進王南還至和寧之北遂即位遣使還報諸王舊臣及兩都之民聞王使者皆歡呼鼓舞爭先迎謁所至成聚發明綱目凡正統之年歲下大書而僣國之與篡位者則分注細書之此所謂正統於天而人道定矣然通鑑於天歷二年皆大書綱目則斥而細書之不豫其為正統也漢之吕后王莾唐之武后其義亦然稱者不宜稱也是故不宜王而正則書稱王不宜帝而帝則書稱帝稱皇帝所以明其僣耳此綱目書法之深意君子宜詳察馬廣義抑觀周王和實拉懷王圖卜特穆爾皆武宗之子而周王兄也懷王弟也周王蓋嘗欲正名分而不得遂逃居漠北而懷王遣使迎之其義得矣今也周王急於得國稱帝中道果何義哉且懷王姦雄之首而其襲帝位逐諸王皆其功也周王逃生不暇尚何功之有哉夫懷王於帝位豈不欲耶而其迎兄於漠北者公論不容而惟恐人心之不從也觀其襲位之時有曰謹俟大兄之至以遂固讓之心則其姦雄之念不攻自破矣為周王者則當因其迎而至京師朝見百官雍容不追而致推讓之辭則彼姦雄之心庶可折矣然後不得已而即位可也惟其慮不出此此所以來翁果察圖之禍惜哉陜西大旱飢陜西自泰定二年至是不雨歲大飢人相食詔起張養浩為西臺御史中丞往賑之先是養浩棄官家居七詔不起至是命登車即行道經華山禱于嶽祠一雨三日到官復大雨禾黍自生秦人大喜時斗米十三緍鈔稍昏即不用詣庫倒換纍日不能得民大窘養浩檢庫中未毁昏鈔得一千八十五萬悉以印識其背乂刻十貫五貫為券給貧民命米商視印記詣庫驗數易與新鈔又率富商出粟及奏行納粟補官之令聞民有殺子以啖母者為之大慟出私錢濟之且命出其肉遍示闔府官屬責其不能賑貸發明和氣足以致祥乖氣足以致異未有嘉祥非和氣所召而災異非乖氣所感者也是時周王兄弟各相為逆人神共憤天理不容由是悖逆之氣磅礡充塞而旱乾作矣旱乾既作而飢饉生矣用是而觀則知天人相與之際有感必應疾如桴鼓豈不甚可畏哉二月圖卜特穆爾立其妃鴻吉哩氏為皇后追尊周王母伊竒哩氏母唐古氏並為皇后伊竒哩氏周王母唐古氏圖卜特穆爾母也廣義追尊周王母者掩人耳目也三月圖卜特穆爾遣雅克特穆爾奉皇帝寶赴漠北夏四月王以雅克特穆爾為太師圖卜特穆爾遣雅克特穆爾奉皇帝璽上周王諭廷臣曰寶璽既北上繼今國事其遣人聞行在所雅克特穆爾見周王嘉其功以為太師復諭之曰凡京師百官朕弟所用者並仍舊其諭以朕意雅克特穆爾奏陛下君臨萬方國家大事所任者省院臺而已宜擇人居之乃用哈瑪爾圖等為平章政事等官皆武宗舊人也是日宴諸王大臣於行殿因諭臺臣曰太祖有訓美色名馬人皆玩之然方寸一有係纍即能敗名喪德卿等亦嘗念及此乎世祖初立御史臺首命塔齊爾布達嘉勒二人協司其政天下國家譬如一人之身中書其右手也樞密其左手也左右手有疾治之以良醫省院闕失不以御史臺治之可乎凡諸王百司違法越禮一聽舉劾風紀重則貪墨懼猶斧斤重則入木深也朕有缺失卿等亦當以聞不汝責也發明圖卜特穆爾迎周王奉寶璽非出於中心特畏名義不正故姑塞人議耳不然何以弒之於行幄耶然周王既書稱帝而此不書者不豫其為帝也此不斥其名而止書周王者是時上無天子况又較諸懷寧猶可恕而綱目豈厚於周王而薄於懷寧乎然皆循名責實之意也廣義周王和實拉既稱帝于和寧之北則圖卜特穆爾此舉亦出於事不獲已也周王遣使立圖卜特穆爾為太子廣義太子天下之本京師帝王所居王者欲建太子則當尊居京師詔告天下中外無猜庶乎絶覬覦之心而有以定民志圖卜特穆爾於去年十一月既已奉迎周王於漠北矣何以遲遲其行久戀漠北以忽京師之重適足成圖卜特穆爾朵頥之勢且圖卜特穆爾欲得國之心如火斯熱然其迎兄於漠北而奉竄赴之者皆其偽也豈其本心哉今而周王遙立其為太子是保其逆謀也翁果察圖之禍誰其尸之以徹爾特穆爾為平章政事旱蝗民飢河南北山東兩浙飢民毋慮百餘萬戶囊嘉特降尋殺之圖卜特穆爾遣使四川赦囊嘉特囊嘉特聽詔歸順蜀地悉定尋殺之於市籍其家發明囊嘉特稱兵僣號其罪甚矣誅之宜矣曷為以殺書囊嘉特賊圖卜特穆爾亦賊耳直書曰殺不豫賊討賊也秋七月朔日食西臺御史中丞張養浩卒養浩自到官未嘗家居止宿公署夜禱于天晝出賑飢每一念至即拊膺慟哭竟得疾而卒關中之民如失父母至順間追贈平章政事濵國公諡文忠太白經天發明嗚呼天人相與之際甚可畏也是時圖卜特穆爾畜無兄之心其謀未露而其徵已見天象昭昭特以著其骨肉相殘之慘耳是以人心之茫昧難知而天象之明灼可驗是故唐太宗之殺建成元吉而太白見秦分圖卜特穆爾殺周王而太白經天變不虛生信哉明乎天人之理然後可與論綱目書法之意矣八月丙戍周王次翁果察圖圖卜特穆爾入見庚寅王暴卒廟號明宗胡粹中曰聞之故老雅克特穆爾奉上璽綬明宗從官有不為之禮者雅克特穆爾怒且懼既而帝暴崩雅克特穆爾聞哭聲奔入帳中取寶璽扶文宗上馬南馳本史乃言皇太子入哭盡哀雅克特穆爾以后命奉皇帝寶授于太子其説不合豈當時忌諱有不敢明言之者歟發明周王圖卜特穆爾兄武宗嫡嗣圖卜特穆爾欲奪其位乃以弟弒其兄是尚可以君天下乎曰然則何以不書弒曰唐陳𢎞志之逆憲宗以暴崩于巾和殿書今之周王亦以暴卒書之其書圖前後如一則弒逆明矣然憲宗既已屬疾故逆黨尚可隱諱遷就其説至於周王則素無疾一旦圖卜特穆爾入見而是夕暴卒其為弒逆尤更彰彰無可疑者綱目凡以善終者皆不書其地惟弒則書地暴崩則書地皆以著其實也故書暴卒以著其欺世之罪又以見當時臣子不敢明言其事之意固非以為圖卜特穆爾諱其大惡也亦所以發明綱目之意也觀者試思之廣義嗚呼當是時也惟知有圖卜特穆爾不知有周王也况入見之時以雅克特穆爾為之輔翼故於八月丙戌入見至庚寅王暴卒是圖卜特穆爾在帳已五日矣弒兄之罪奚逃綱目於事變之大者必甲子其日以志之也與特克實弒君例同圖卜特穆爾以巴延為左丞相竒徹台阿爾斯蘭哈雅趙世延並為平章政事多爾濟為右丞阿榮趙世安並參知政事逹實特穆爾知樞密院特穆爾布哈特穆爾圖並御史大夫圖卜特穆爾復襲位于上都大赦發明書復襲位重貶之也圖卜特穆爾篡位其素心也其逆兄漠北者姑欲塞人之議耳故行幄一見兄乃暴卒既沒其兄復襲其位則其悖逆之心遂矣此圖卜特穆爾始終之論也大書于册深罪之耳廣義前既襲帝位于上都而今又襲之兩曰襲者其惡甚矣建龍翔集慶寺于建康命阿榮趙世安督工臺臣監造於是南臺御史言陛下龍潛建業居民困於供給幸而獲覩今日莫不跂望非常之恩今奪民時毁民居以創佛寺臺臣表正百官委以監造豈其禮哉昔漢高祖復豐沛兩縣光武免南陽稅三年今不務此而隆重佛教何以慰斯民之望且佛教慈悲方便今尊佛氏而害生民無乃違其教乎書奏為免臺臣監役發明甚矣亂臣賊子之欺世也既竊其位志驕意滿肆為興作誇耀於人其志僣矣圖卜特穆爾居建康今而竭其財力營建僧剎以為龍翔於此慶集於此而建寺以誇示於民嗚呼傷敗彛倫滅絶天理幸而襲位欲蓋彌張由君子觀之豈不甚為可耻乎綱目特書于册所以深貶之爾廣義圖卜特穆爾襲位之初即奉佛教其用意差别矣豈久安長治之象哉吁春秋責備賢者君子於元何誅詔修經世大典敕翰林國史院同奎章閣學士采輯本朝故事凖唐宋會要為經世大典冬十月徵故中書省臣托多王士熙等十二人于貶所放歸田里十一月湖廣徭賊寇邉凡二百八十餘處十二月以西僧年扎克䇿喇實為帝師帝師至上命朝臣一品以下咸郊迎大臣俯伏進觴帝師不為動惟國子祭酒富珠哩翀舉觴立進曰帝師釋迦之徒天下僧人師也豫孔子之徒天下儒人師也請各不為禮帝師笑而起舉觴卒飲衆為之栗然發明若是乎元人之無識也西僧雖賢不過釋教所祟奉耳所謂帝師者必其有道德之可尊有規矩之可法父子能親君臣能義夫婦能别長幼能序朋友能信首出庶物車乎為一世之楷範然後可為帝者之師也今䇿喇實以寂滅之教愚誑流俗誠清朝之所厭棄者以為帝何何其謬哉故綱目直書以著其失廣義昔梁武帝三舍身於同泰寺為奴餓死臺城今以西僧為帝師則是願為其弟子也奴與弟子其分雖殊而其所以事之之義一而已矣梁之武帝元之文宗其愚一也且朱子綱目有書曰國師者而尹氏發明曰謂之國師于以見舉國之人皆師之矣今而曰帝師殆有甚焉嗚呼自東漢以來奉佛之篤者莫如梁武帝元文宗然而梁祚之不長元運之不永是佛之不靈也明矣使其有靈而故短梁之祚促元之運則是佛之行曾黑白之不分有是理哉御批續資治通鑑綱目卷二十五
