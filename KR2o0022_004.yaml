body:
  text: 凡例凡提綱分目悉遵朱子凡例凡事迹悉據正史謂宋遼金元史及皇明實録正史或有闕略異同參取宋長編元經世大典等書增入訂正或事有可疑正史不載而傳聞彰著者略述於目之末以圈隔之或出某人曰以為别疑以傳疑也凡得天下有救世之功者每進綱目於漢唐皆然宋得天下頗類唐故開寶八年大書如武德七年例凡入中原而未一統者不紀元遼金夏皆不紀倣漢唐例及金元得中原然後分注紀年於宋年下倣晉魏例凡外邦得統中國正統未絶猶繫之中國及外邦全有天下謂元世祖中國統絶然後以統繫之其間書法間亦有異如中國有稱兵者不書反叛之類及中國有義兵起即夷之於列國如秦隋之末凡未踰年不成君不帝不崩如元明宗倣春秋王子猛及子野之例凡遼金元官名悉從簡略人名更改異同者依其初稱及其夲史為據凡諸儒論斷附於目中皆稱姓名其出於正史者止稱史臣
