body:
  text: 總目錄史部十五史評類第一卷凡一十五年起庚申周㳟帝元年宋太祖建隆元年盡甲戍宋太袓開寳七年第二卷凡二十三年起乙亥宋太祖開寳八年盡丁酉宋太宗至道三年第三卷凡二十五年起戊戌宋真宗咸平元年盡壬戌宋真宗乾興元年第四卷凡二十一年起癸亥宋仁宗天聖元年盡癸未宋仁宗慶厯三年第五卷凡二十年起甲申宋仁宗慶厯四年盡癸邜宋仁宗嘉祐八年第六卷凡八年起甲辰宋英宗治平元年盡辛亥宋神宗熈寕四年第七卷凡一十四年起壬子宋神宗熈寧五年盡乙丑宋神宗元豊八年第八卷凡一十五年起丙寅宋哲宗元祐元年盡庚辰宋哲宗元符三年第九卷凡一十四年起辛巳宋徽宗建中靖國元年盡甲午宋徽宗政和四年第十卷凡一十一年起乙未宋徽宗政和五年盡乙巳宋徽宗宣和七年第十一卷凡二年起丙午宋欽宗靖康元年盡丁未宋髙宗建炎元年第十二卷凡三年起戊申宋髙宗建炎二年盡庚戌宋髙宗建炎四年第十三卷凡七年起辛亥宋髙宗紹興元年盡丁巳宋髙宗紹興七年第十四卷凡八年起戊午宋髙宗紹興八年盡乙丑宋髙宗紹興十五年第十五卷凡一十七年起丙寅宋髙宗紹興十六年盡壬午宋髙宗紹興三十二年第十六卷凡二十七年起癸未宋孝宗隆興元年盡己酉宋孝宗淳熈十六年第十七卷凡一十八年起庚戌宋光宗紹熈元年盡丁邜宋寧宗開禧三年第十八卷凡一十七年起戊辰宋寧宗嘉定元年盡甲申宋寕宗嘉定十七年第十九卷凡九年起乙酉宋理宗寶慶元年盡癸巳宋理宗紹定六年第二十卷凡二十五年起甲午宋理宗端平元年盡戊午宋理宗寶祐六年第二十一卷凡一十六年起己未宋理宗開慶元年盡甲戌宋度宗咸淳十年第二十二卷凡五年起乙亥宋帝㬎德祐元年盡己邜宋帝昺祥興二年第二十三卷凡一十五年起庚辰元世祖至元十七年盡甲午元世祖至元三十一年第二十四卷凡一十七年起乙未元成宗元貞元年盡辛亥元武宗至大四年第二十五卷凡一十八年起壬子元仁宗皇慶元年盡己巳元文宗天厯二年第二十六卷凡二十三年起庚午元文宗至順元年盡壬辰元順帝至正十二年第二十七卷凡一十五年起癸巳元順帝至正十三年盡丁未元順帝至正二十七年臣等謹案續資治通鑑綱目二十七卷明商輅等撰始于宋太祖建隆元年庚申訖于元順帝至正二十七年丁未大書分注悉準朱子綱目之例厥後周禮撰廣義散系各條之下其持議偏駮紀事失實名為續朱子之書實無能為役也明陳仁錫刋本取以附于朱子綱目之後用備宋遼金元四朝事實逮我聖祖仁皇帝御批綱目遂因仁錫之舊並是書亦予加批刋布其中紕繆間有駁斥而未嘗改正我皇上稽古示訓一稟大公洞燭是編之非如金禁女真人學南人衣飾乃敦儉由舊之美也䝉古額哷布格僣號于和林後自歸上都元世祖以其為太祖之裔不忍加戮止誅其黨乃敦族含容之度也而是書曲加詆毁又如巴拜以其子入見太子珍戬珍戬諭之以學漢人文字蓋欲其兼通經史也而是書刪改其文曰諭之以毋讀䝉古書則并其事實失之矣此其背謬之最甚者其他誣罔是非顛倒黑白不勝枚舉因命諸皇子及軍機大臣詳加考訂存其時事之可稽者易其論議之偏謬者更正板刻俾曲直不淆考驗可據卷首冠以𠡠諭及御製題辭于是春秋筆削之㫖燦然具在非獨是書之幸亦億萬世讀史論古者之幸也乾隆四十九年九月恭校上總纂官臣紀昀臣陸錫熊臣孫士毅總校官臣陸費墀
