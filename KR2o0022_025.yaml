body:
  text: 欽定四庫全書御批續資治通鑑綱目卷二十起甲午宋理宗端平元年盡戊午宋理宗寶祐六年凡二十五年甲午端平元年金天興二年是嵗金亡春正月金主守緒傳位于其宗室承麟孟珙以蒙古兵入蔡州守緒及其尚書右丞完顔呼沙呼死之承麟為亂兵所殺金亡蒙古兵以正旦會飲歌吹之聲四望相接城中飢窘嘆息而已孟珙見黑氣壓城上日無光降者言城中絶糧已三月鞍靴敗鼓皆縻煮且聼以老弱互食諸軍日以人畜骨和芹泥食之又往往斬敗軍全隊拘具肉以食故欲降者衆珙乃下令諸軍銜枚分運雲梯布城下以攻之金自被圍以來戰沒將帥甚衆至是禁近以及舍人牌印省部椽屬亦皆供役分守四城蒙古兵鑿西城為五門整軍以入督軍鏖戰及暮乃退聲言來日復集是夕金主集百官傳位于東面元帥承麟承麟者世祖和勒博之後拜甡之弟也拜泣不敢受金主曰朕所以付卿者豈得已哉以朕肌體肥重不便鞍馬馳突卿平日趫捷有將略萬一得免祚祀不絶此朕志也承麟起受璽明日承麟即位時孟珙之師向南門至金字樓列雲梯令諸軍聞鼓則進馬義先登趙榮繼之萬衆競進大戰城上烏庫哩鎬及其將帥二百人皆降金百官稱賀禮畢亟出捍敵而南城之陴已立宋旗幟矣俄傾四面鼓譟夾攻聲振天地南面守門者棄門走門西開孟珙招江海搭齊爾之師以入呼沙呼帥精兵一千巷戰不能禦金主守緒知事急即取寶玉置于幽蘭軒環之以草命近侍曰死便火我遂自經死呼沙呼聞之謂將士曰吾君已崩吾何以戰為吾不能死于亂兵之手吾赴汝水從吾君矣諸君其善為計言訖赴水死將士皆曰相公能死吾輩獨不能邪於是參政富珠哩小羅索烏陵阿呼圖總帥元志元帥裕珊爾赫舍哩柏壽烏庫哩和勒端軍士五百餘人皆從死焉承麟退保子城聞守緒死帥群臣入哭因謂衆曰先帝在位十年勤儉寬仁圖復舊業有志未就可哀也已宜諡曰哀奠未畢城已陷諸將禁近共舉火焚之奉御絳山收其骨將瘞之汝水上江海入宮執參政張天綱孟珙問金主所在天綱曰城危時自經矣珙乃與塔齊爾分金主骨及寶玉法物是日承麟亦為亂兵所殺金亡金自宣宗之世為宰相樞密者往往臨事推讓低言緩語以為養相體每有四方兵革災異輒以聖主心困或俟再議因循茍且以度時日及出兵則以近侍監戰臨事多所牽制故師出無功國亂不聞以底于亡史臣曰金之初興天下莫強焉太祖太宗威制中國大槩欲效遼初故事立楚立齊委而去之宋人不競遂失故物熙宗海陵濟以虗政中原觖望金事幾去世宗以仁易暴休息斯民故金祚百有餘年由大定之政有以固結人心爾章宗志存潤色誅求無藝至於衛紹紀綱大壞宣宗南渡棄厥本根連兵宋夏內致困憊哀宗之世無足為者區區生聚宗圖存於亡力盡乃斃可哀也矣雖然國君死社稷哀無愧焉發明僖二十六年公以楚師伐齊取榖君子譏之蓋蒙古強而宋室弱而能用其師進退在己故特書曰以以者不以者也夫因人成事取人之邑為已有失計甚矣患之起必自此始其致危之也守緒書及其尚書右丞呼沙呼皆書死之所以深褒亟豫為萬世臣子死節者之勸也書金亡所以見金之自亡而非珙輩所能滅之也此皆書法之深意也雖然國君死社稷在義之當然守緒東奔西走圖存於亡志不可為同死社稷可哀也矣回視偷生茍免甘于臣敵如漢之劉禪晉之懷愍宋之徽欽豈不有愧于守緒哉嗚呼夷狄之有君不如諸夏之亡也廣義抑觀金之亡也其所亡之迹不異於汴宋焉夫蒙古攻金西京赫舍哩呼沙呼棄城遁與夫鄭損棄關逃歸此即童貫自太原逃歸也蒙古分兵拔金河北河東諸郡即尼瑪哈幹里雅布分道入冦也蘇布特之圍汴京與斡里雅布之圍京師也無異伊喇布哈帥師戰敗而逃其與姚平仲襲金營不克而遁也不殊昔也康王為質于金以請平今也曹王為質于蒙古亦請平昔斡里雅布引兵北去而赦今則蘇布特退師河洛而亦赦宰相以紙鳶紙燈而退敵其郭京之六甲妖術歟申福殺蒙古行人唐慶等其平州人殺金國之使歟宋括民田金亦括民粟宋之郭藥師以城降于金金之武仙亦以城降蒙古徽宗奔亳州而斡里雅布圍汴金主奔河北而蘇布特亦圍汴焉若夫崔立作亂殺參政而幽親王官努作亂殺左丞而幽其主宋實無之至於蒙古以其后妃族屬北還其事尤甚於徽欽播遷之日金主如蔡州艱苦萬狀其情尤切於徽宗幸亳之時不惟是耳若其伏節死義之臣在金惟陳和尚齊克紳完顔薩布三人而已其在宋也則有种師中王稟方笈韓揆張克戩等三十人劉竧等十三人又有劉韐李若水宣贊舍人吳革及欽宗渡白溝而有張叔夜焉嗟夫板蕩之秋其疾風徑草金何若是之寡而宋何若是之多邪蓋宋之養士豈若金人之待士哉報施之道自不能無差除耳若其間傷禮而敗義亂倫而絶理者則宋之與金亦無甚相徑庭矣觀此則知天網之密斷斷乎不可逃也後之欲肆凶惡而奪人家國者盍以前車為鑒以陳蔡西北地分屬蒙古蒙古以劉福為河南道總管史嵩之使孟珙等分屯京西嵩之使孟珙還師襄陽江海還師信陽王旻戍隨州王安國守棗陽蔣成守光化楊恢守均州並益兵飭傋經理屯田于唐鄧州金穆延烏登以息州來歸蒙古追殺之烏登行省于息州與諸將帥日以歌酒為樂軍士淫縱及蔡州破與富珠哩中羅索瓜爾佳玖珠等送欵請降為金主發喪設祭上諡曰昭宗州民因奉烏登為丞相中羅索為平章舉城南遷遂焚樓櫓蒙古望見火起追及于羅山自萬戶以下凡七百人皆被殺廣義蒙古奮楊雄踞之心也且烏登以息州來歸宋乃其心之所願耳譬諸一人以物餽人彼自餽耳豈可以其不我餽而奪之耶孟子所謂禦人於國門之外可乎不可乎書曰追殺之者所以著其強暴而目中無宋也宋烏可以仁義待之而不慮哉二月蒙古入徐州金完顔用安自殺三月以賈貴妃弟似道為籍田令似道涉之子少落魄為遊博不事操行以蔭補嘉興司倉帝以貴妃故纍擢籍田令恃寵不檢日縱遊諸妓家至夜即燕逰湖上不返帝嘗夜慿髙望西湖中燈火異常時語左右曰此必似道也明日詢之果然使京尹史巖之戒之巖之對曰似道雖有少年氣習然其才可大用也發明貴妃之弟至微也籍田之令至卑也何以書志禍始也似道賈涉之子少為遊博不事操行然其誤國之兆已蓋萌於此矣理宗茍能明此則必謹之於微如姤之繫于金柅勿使浸盛夫何以貴妃之故溺愛不明漸進用事他年貽害病國妨賢故易又曰包有魚義不及賔也豈可不謹於微而使之浸盛乎宋之亡天下其源蓋出於此故謹志之然不曰以賈似道為籍田令而必曰以賈貴妃弟似道為籍田令則其發身非正任用非人之意可見矣特書于册深貶之也廣義觀分注所載則知理宗知似道之無賴有素矣知而用之則是理宗甘心於用小人也南宋之亡豈無自哉詔太常簿朱揚祖詣河南省謁八陵史嵩之露布至詔遣朱揚祖林拓往省謁八陵尋遣朱復之詣八陵相度修奉夏四月獻金俘於太廟論功行賞有差史嵩之遣使以孟珙所獲金哀宗遺骨及寶玉法物并俘囚張天綱完顔海罕等獻于臨安四月丙戌備禮告于太廟藏其骨于大理寺獄庫加孟珙帶御器械江海以下論功行賞有差知臨安府薛瓊問天綱曰有何面目到此天綱曰國之興亡何代無之我金之亡比汝二帝何如瓊叱之明日奏其語帝召天綱問曰汝真不畏死邪天綱對曰大丈夫患死之不中節耳何畏之有因祈死不已帝不聼初有司令天綱供狀必欲書金主為虜主天綱曰殺即殺焉用狀為有司不能屈聼其所供天綱但書故主而已聞者憐之後莫知其所終身監察御史王遂言史嵩之本不知兵矜功自侈謀詭祕欺君誤國留之襄陽一日則有一日之憂不報洪咨夔亦言殘金雖滅鄰國方強益嚴守備猶恐不逮豈可動色相賀渙然解體以重方來之憂帝嘉納之發明金人之禍上至社稷下至山陵中至君父誠萬世必報之讐也宋雖藉蒙古以克成功則祖宗之耻亦略少泄矣蓋祖宗陵寢隔絶百年今得視謁祖宗讐耻含蓄數世今得獻俘此皆臣子之至快中國之大伸耳蒙古雖屬強敵非宋世讐茍能謹飭邉備申固夙盟則國可常保宋未遽亡惜其甫滅殘金志益張大自入洛之師既舉而兵革之禍無休矣豈不深可哀哉特書于册蓋豫之也廣義嗚呼自常情觀之則孟珙之功誠偉也使非假蒙古之強而欲成其志殆恐其難矣紹興間設無秦檜之姦則嶽武穆不必以弱假強而能獨收其功也必矣武穆之功一收則天地泰德業成賢人出普天之下莫非宋土率土之濵莫非宋臣而髙宗中興之業雖周之宣王漢之光武不能過也而武穆之豐功盛烈曾何沗於古之方叔召虎鄧冦諸賢哉蒙古雖云倔起不過元昊之徒耳何足憂乎臣閲史至此因喜孟珙之復讐而恨武穆之不遂故併及之五月賜黃幹李燔李道傳等諡録其子詔幹燔道傳及陳宓樓昉徐瑄胡夢昱等厄于權姦而各行其志沒齒無怨其賜諡復官録用其子金武仙奔澤州戍兵殺之六月以曽從龍參知政事喬行簡知樞密院事鄭性之簽書院事詔復故濟王竑官爵太常少卿徐橋嘗侍講開陳友愛大義帝悟乃命復竑官爵有司檢視墓域以時致祭時竑妻吳氏自請為尼特賜號彗淨法空大師紹興府月給衣資緡錢發明前書追貶竑為巴陵郡公此不書何不豫其追貶也濟王見忌彌逺死於無辜其抱恨泉壤久矣帝能追復其官爵亦可謂過而能改者焉前書賜黃幹等諡此書復濟王官爵皆所以豫其能悔也趙范趙葵請復三京詔知廬州全子才會兵趨汴金故將李伯淵等誅崔立以降范葵欲乘時撫定中原建守河據關收復三京之議朝臣多以為未可獨鄭清之力主其説乃命趙范移司黃州刻日進兵范參議官丘嶽曰方興之敵新盟而退氣盛鋒鋭寧肯捐所得以與人邪我師若往彼必突至非惟進退失據開釁致兵必自此始且千里長驅以爭空城得之當勭餽餉後必悔之范不聼史嵩之亦言荆襄方爾飢饉未可興師杜杲復陳守境之利出師之害喬行簡時在告上疏曰八陵有可朝之路中原有可復之機以大有為之資當大有為之會則事之有成固可坐而策也臣不憂師出之無功而憂事力之不可繼有功而至於不可繼則其憂始深矣夫規恢進取必須選將練兵豐財足食而今將乏卒寡財匱食竭臣恐北方未可圖而南方已先騷動矣願堅持聖意定為國論以絶紛紛之説皆不聼而詔知廬州全子才合淮西兵萬人赴汴時汴京都尉李伯淵李琦李賤奴等為崔立所侮謀殺之及聞子才軍至伯淵等以書約降而陽與立謀備禦之策六月伯淵燒封丘門以警動立立殊不安伯淵等乃來約立視火立從苑秀折希顔等數騎往既還伯淵親送之倉卒中就馬上抱立立顧曰汝欲殺我邪伯淵曰殺汝何傷即出七首橫刺之立墜馬死伏兵起元帥三合殺苑秀折希顔後至見立墜馬謂與人鬬欲前解之隨為軍所殺伯淵繫立尸馬尾至內前號于衆曰立殺害劫奪蒸淫暴虐大逆不道古今無有當殺之否萬口齊應曰寸斬之未稱也乃梟立首望承天門祭哀宗伯淵以下軍民皆慟或剖其心生噉之以三尸挂闕前槐樹上發明請復三京何以無貶詞三京宋之故地也書故將何豫義也崔立背君降敵其罪已甚故直書誅以正其罪崔立悖逆未幾身且不保然則偷生茍免者果何益乎雖然三京淪於蒙古固為臣子之耻恢復故疆乃其分也然必度其事勢吾之兵甲精歟倉廪盈歟人才足歟府庫充歟然後舉事猶慮弗及况蒙古以方張不制之敵新與訂盟豈冝遽叛則是中國先失信於強敵而曲在宋矣又安能不致蒙古之雲擾哉他日下詔罪已方悔前愆嗚呼晚矣故直書以著其自取之失也廣義二趙自楊州之捷其志驕矣獨不思蒙古乃方張之勍敵其用兵又非李全之比况乎軍用不足豈可以頻年出師乎理宗過聼其計而貽他日莫大之禍尚誰咎哉孔子曰人無逺慮必有近憂抑亦似宋之君臣乎趙葵帥師會全子才于汴秋七月葵將楊誼等入洛陽全子才次于汴趙葵自滁州以淮西兵五萬取泗州由泗趨汴以會之葵謂子才曰我輩始謀據關守河今已抵汴半月不急攻洛陽潼關何待邪子才以糧餉未集對葵督促益急乃檄鈐轄范用吉樊辛李先胡顯等提兵萬三千命淮西制置司機冝文字徐敏子為監軍先令西上又命楊誼以廬州強弩軍萬五千繼之各給五日糧七月徐敏子啓行遣和州寧淮軍正將張迪以二百人趨洛陽迪至城下城中寂然無應者至晚有民庶三百餘家登城投降迪與敏子遂帥衆入城蒙古聞之復引兵南下八月朱揚祖還自河南揚祖朝陵行至襄陽會諜報蒙古哨騎已及孟津陜府潼關河南皆增屯戍設伏兵又聞淮閫刻日進師衆畏不前孟珙曰淮東之師由淮西遡汴非旬餘不逹吾選精騎疾馳不十日可竣事逮師至東京吾已歸矣於是珙與二使晝夜兼行至陵下奉宣御表成禮而還揚祖以八陵圖上進帝問諸陵相去幾何及陵前澗水新復揚祖悉以對帝忍涕太息久之蒙古復引兵至洛陽城下楊誼軍潰趙葵全子才遂棄汴而歸徐敏子入洛之明日軍食已竭乃采蒿和麵作餅而食之楊誼至洛東三十里方散坐蓐食忽數里外有立黃紅涼繖者衆方駭異而蒙古伏兵突起深蒿中楊誼倉卒無備師遂大潰為蒙古擁入洛水者無數誼僅以身免是晚有潰卒奔告于洛曰楊誼一軍已為蒙古大陳衝散今蒙古兵已據北岸矣於是在洛之師皆奪氣八月朔旦蒙古兵至洛陽城下立寨敏子與戰勝負相當士卒乏糧因殺馬而食敏子等不能留乃班師趙葵全子才在汴亦以史嵩之不致餽糧用不繼所復州郡率皆空城無兵食可因蒙古兵又決黃河寸金淀之水以灌官軍官軍多溺死遂皆引師南還趙范以入洛之師敗績上表劾葵子才輕遣偏師趙楷劉子澄參贊失計師退無律致後陳覆敗詔葵削一秩措置河南京東營田邉備子才削一秩措置唐鄧息州營田邉備餘貶䄮有差鄭清之力辭解政不許喬行簡上言三京撓敗之餘事與前異但當益修戰守之備帝嘉納之發明嗚呼趙葵子才輕佻無謀之心著矣前之請復三京者乃葵之兄弟既曰有志恢復亦當恪持乃心既入大梁不能固守蒙古甫至心喪膽落未聞與之一戰而乃接踵逃奔其罪可勝誅乎故書兵潰者所以明其自潰云爾他日兵連禍結喪師失地誰實尸之綱目書棄汴而歸者所以正其偷生茍免之意也廣義見小敵怯見大敵勇此劉將軍所以起人之駭也今趙葵未見蒙古之師而主收復三京之議目中可謂無人而中原不足定矣何其勇邪及其一遇蒙古之師未嘗接戰遽爾倉皇逃歸何其懦邪其與劉將軍不亦異乎此特子陽之見耳理宗過聼而貽異日崖山之禍罪將焉歸書曰靜言庸違趙葵是也識者於葵乎何誅京湖制置使史嵩之免九月以趙范代之召真德秀為翰林學士魏了翁直學士院帝因民望召還二人德秀入對帝迎謂曰卿去國十年每切思賢德秀以大學衍義上進因言于帝曰天之所助者順人之所助者信天厭金德久矣陛下儻能敬德以迓續休命中原終為吾有若徒以力求之而不反其本天意難測臣實憂之了翁入對言事剴切反覆利害之端至漏下四十刻乃退帝皆嘉納之廣義德秀了翁大儒也綱目特書曰召者所以著理宗用賢之美也冬十月陳貴誼卒詔真德秀進講大學衍義發明人主不忘講習是其盛心大學衍義乃德秀所無非發明格致誠正之功修齊治平之業誠有國者之所當講也理宗於萬幾之暇特詔德秀進講是編自非留心於聖學者曷克以臻此哉其與玩物喪志者異矣特書于册深豫之也十二月蒙古使王楫來蒙古使王楫來言曰何為而敗盟也自是河淮之間無寧日矣廣義抑考紹定四年七月沔州統制張宣殺蒙古行人蘇巴爾罕蒙古即曰宋自食言背盟棄好今日之事曲直有分觀此則知其噬宋之心萌于胸中久矣譬則投種于地待時而發夫何理宗二趙不此之察回轅未絶即欲收復三京果何䇿哉况乎殘金之滅蒙古之力也宋亦何能今也宋之君臣不能反已惟欲勝人適足以招蒙古敗盟之責耳若然則直在蒙古而曲在宋也明矣致寇之至尚誰尤哉乙未二年春正月以程芾為蒙古通好使發明桓二年書公及戎盟于唐冬公至自唐君子譏其逺與戎盟至者危之也蓋所貴乎中國者以其嚴內外别尊卑辨上下明等夷可也宋既藉蒙古以滅金復動三軍以啓釁然則既有啓釁之謀必有禦侮之䇿夫何不能自強而復通好以中國天子而通好於敵國豈不深可醜乎直書通好不再貶而其失自見詔孟珙屯黃州珙留襄陽招中原精鋭之士萬五千餘分屯漅北樊城新野唐鄧間以備蒙古名鎮北軍詔以珙為襄陽都統制珙赴樞密院稟議因入對帝曰卿名將子忠勤體國破蔡滅金功緒昭著珙對曰此宗社威靈陛下聖德與三軍將士之勞臣何力之有授主管侍衛馬軍司公事時暫黃州駐劄朝辭帝問恢復珙對曰願陛下寬民力蓄人材以俟機會帝問和議珙對曰臣介胄之士當言戰不當言和賜賚甚厚珙至黃增陴浚隍搜訪軍實邉民來歸者日以千數為屋三萬間以居之厚加賑貸又慮軍民雜處因髙阜為齊安鎮淮二寨以居諸軍二月蒙古城和林和林本唐回鶻必齊克汗故城蒙古以為會同之所至是城之周圍五里許三月以真德秀參知政事陳卓同簽書樞密院事夏五月德秀卒德秀拜參知政事時已得疾遂三上表乞祠帝不得已授資政殿學士提舉萬夀宮逾旬而卒贈銀青光祿大夫諡文忠德秀立朝不蒲十年奏疏將數十萬言皆切當世要務直聲震朝廷四方文士誦其文想見風采及宦遊所至惠政深洽不愧其言由是中外交頌都城人時驚傳􅐓洞奔擁出關曰直院至矣果至則又填塞聚觀不置史彌逺以是忌之輒擯不用而聲聞愈彰及歸朝將大用則既衰矣然自韓托胄立偽學之名以錮善類凡近世大儒之書皆顯禁絶之德秀晚出獨慨然以斯文自任講習而服行之黨禁既開正學遂明于後世德秀之力為多六月以鄭清之喬行簡為左右丞相兼樞密使曽從龍知樞密院事鄭性之同知院事陳卓簽書院事葛洪免召崔與之參知政事不至與之自成都乞歸廣州每有除命皆力辭不起及拜廣東安撫會摧鋒軍士作亂與之肩輿登城叛兵望之俯伏聼命而散因即家治事帝注想彌切召參大政與之力辭帝乃遣使趣之且訪以政事之當行罷者人材之當用舍者與之上疏曰天生人才自足以供一代之用惟辨其君子小人而已忠實而有才者上也才不髙而忠實存者次也用人之道無逾于此帝嘉納之召命益力與之控辭至十三疏不許蒙古主使其子庫騰等分道入寇蒙古主命子庫騰將塔爾海侵蜀特穆爾岱及張柔等侵漢昆布哈及察罕等侵江淮命姪莽賚扣征西域唐古婁庫濟伐髙麗蒙古人每甲一人西征一人南征中州戶每十戶一人南征一人征髙麗發明蒙古曷為書主以宋室偏安既不能為恢復之圖又復啓強鄰之隙蒙古已據中原故從其本國稱也入者外之之詞寇者惡之之詞所以正稱名之分嚴內外之防也嗚呼宋弗自強搆怨蒙古而使蒙古見責背盟棄好之釁江淮川陜日事兵爭失地喪師宋室益弱然則趙葵等首謀啓釁者可勝誅哉綱目書此所以志其召禍之始云秋七月蒙古將昆布哈來寇唐州全子才等棄師走趙范帥兵敗蒙古于上閘而還發明走者匹夫之事賤之也子才身為大將親帥雄兵又非力不能及之比而乃效匹夫之行棄師而走不亦賤乎故書棄師走所以著其茍免之罪也趙范帥師拒敵敗于上閘則其正大之氣為可想見噫全趙之勇怯分矣綱目之豫奪公矣其旨嚴矣冬十月金鞏昌總帥汪世顯降蒙古金亡郡縣皆降獨世顯堅守不下一日謂其衆曰宗祀已失吾何愛一死千萬人之命懸于吾手平居享髙爵厚祿死其分也餘者何罪與其自經于溝瀆姑徇一時之節孰若屈已紓斯人之禍會蒙古庫騰入蜀次于鞏昌城下世顯率耆老持牛羊酒幣迎謁庫騰謂之曰吾征討有年所至皆下汝獨固守何也世顯曰有君在上賣國市恩之人諒所不取庫騰大悅戒其下秋毫勿犯俾世顯仍舊職即日令帥所部從征世顯遂截嘉陵進趨大安庫騰資其糧械十二月以魏了翁同簽書樞密院事督視江淮京湖軍馬了翁在朝几六月前後二十餘疏皆當世急務帝將引以共政而忌者相與合謀排擯之且言了翁知兵體乃命出視師賜便冝詔書如張浚故事陛辭御書唐嚴武詩及鶴山書院四大字賜之了翁開幕府于江州以吳潛為參謀官趙善瀚馬先祖為參議官廣義嗟夫理宗得賢如此可謂幸矣使無讒阻而得以置諸左右則髙宗傳説之事可望矣夫何君臣方遇而􅎱疾即生而使賢者席不暇暖豈天不欲祚宋歟曽從龍卒以余嶸同簽書樞密院事蒙古庫騰入沔州殺知州事髙稼進圍青野原利州統制曹友聞將兵救却之稼在沔葺理創殘招集流散民皆襁負歸之及數與蒙古力戰竒功甚多至是庫騰自鳳州入西川東路之師多敗遂搗西池谷距沔九十里吏民議退保大安稼言于制置使趙彥呐曰今日之事有進無退若能進據險地以身捍蜀敵有後顧必不深入若倉皇召兵退守內地敵長驅而前蜀事去矣彥呐曰吾志也已而竟行留稼守沔蒙古自白水關入六股株距沔六十里沔無城依山為阻稼升髙鼓譟盛旗鼓為疑兵彥呐至蜀口輟帳前總管和彥威以軍還沔召小校楊俊何璘以兵會又選精兵千人命王宣帥以助之已而蒙古大至何璘遁沔州遂陷衆擁稼出户稼叱之不能止敵圍殺之彥呐聞稼死沔州破乃進屯青野原蒙古圍之曹友聞曰青野為蜀咽喉不可緩也即往救之半夜截戰遂解其圍既而蒙古先鋒汪世顯搗大安友聞又救之指麾甫畢蒙古大軍數萬突至友聞迎戰又敗之敵乃退友聞遂引兵扼仙人關發明具官而書殺所以明稼不失所守也沔州無備而髙稼被殺可謂非忠乎救者未有不善者也當時蜀將非一而未聞有救援之師獨友聞親帥六軍與之決戰遂救却之則其攘敵之功急君之念誠矣直書于册豈過豫乎安南入貢丙申三年春正月蒙古將特穆爾岱寇江陵統制李復明死之二月蒙古初行交鈔從耶律楚材之請也以萬錠為額召魏了翁還簽書樞密院事固辭不拜廷臣多忌了翁者故謀假出督以外之甫二旬復以建督為非召之還而帝不悟於是了翁固辭求去廣義既補出外又召之還如呼小兒然是豈當時待賢之禮邪了翁固辭不拜不亦當乎易曰髙尚其志了翁有焉以陳韡為松江制置使史嵩之為淮西制置使韡兼知建康府嵩之兼知廬州三月襄陽將王旻等作亂以城降蒙古趙范在襄陽以北軍將王旻李伯淵樊文彬黃國弼等為腹心朝夕酣狎了無上下之序民訟邉防一切廢弛既而南北軍交爭范失於撫馭於是旻伯淵焚襄陽城郭倉庫相繼降于蒙古時城中官民尚四萬七千有竒財粟在庫者無慮三十萬軍器二十四庫皆為蒙古所有金銀鹽鈔不與焉南軍將李虎不救焚不定變反因勢劫掠襄陽為之一空自嶽飛收復以來生聚繁庶城髙池深甲於西陲一旦灰燼詔削趙范三官仍舊職任發明甚矣宋之諸臣誠可謂昧於去就之幾矣所貴乎人者以其明綱常正倫理辨忠邪之分明逆順之勢此其所以異於禽獸者也茍棄綱常而不顧輕倫理而不恤忠邪之分不能明順逆之勢不能決抑何禽獸之足擬乎王旻等皆衣冠宿將戍守襄陽不能為君死守而乃乘時為亂以中土而啖強鄰背其主而事仇敵然則其惡不亦甚乎故書作亂所以著其叛逆之罪廣義嗚呼開邉者趙范也養亂者亦趙范也亡宋禍蒙范實揭之是則雖殺百全其何以贖莫大之罪范也何可勝誅夏四月魏了翁罷了翁乞歸田里不允以資政殿學士知潭州時殿中侍御史李韶訟曰了翁刻志問學幾四十年忠言讜論載在國史比者樞庭之詔未幾改鎮改鎮未久有旨于祠不知國家人才曄然有稱如了翁者幾人願亟召還處以台輔不報下詔罪已時師屢為蒙古所敗襄漢淮蜀日事兵爭帝悔前事命學士吳泳草詔罪已泳以監察御史王萬忠伉有大志精於邉防以詔意訪之萬曰兵固失矣言之甚恐亦不可今邉民生意如髮宜以振厲奮發興感人心因為條具沿邉事宜泳從其言草詔上進其略有曰數年之間多難已甚屬讐金之寖滅而蒙古之與鄰逮合謀成破蔡之功恐假道有及虞之勢心之憂矣臍可噬乎又曰兵民之死戰鬬戶口之困流離室廬靡存骼胔相望是皆朕明不能燭德有未孚上無以格天心下無以定民志今方施令發政以為綏輯之圖補卒搜乘以嚴守禦之備想瘡痍之溢目如疾病之在身發明徵於色發於聲而後喻者此中人以下之資也蓋古之聖賢之料事不在於已成之後而在於未成之前夫有終身之憂然後可免一朝之患故曰人無逺慮必有近憂理宗信淺謀之士興不教之師三京未復禍患先成邉境不寧師徒撓敗下詔罪已其及救乎是謂不能料事於未成之前而乃料事於已成之後此中人以下之通患耳然則有天下國家者可不致謹於微哉特書于册蓋譏之也廣義昔秦穆公輕用杞子之言卒致三帥見囚於晉襄而有悔過之辭聖人録之於書然穆公悔過而秦後以昌理宗悔過而宋葉以微何也蓋悔過之心無異而敵國之勢不同也彼秦之與晉地醜德齊者也宋之與元衆寡不敵者也况敵勢方強又非晉襄之比故穆公之師雖喪而後則無虞理宗之勢一失而後憂方大秦宋豈可以概言哉後世之君欲信輕佻之徒以開邉理宗紀不可不讀蒙古陷隨郢州荆門軍蒙古初括中原民戶定賦稅初蒙古唯事進取所降之戶因以與將士自一社之民各有所主不相統攝至是詔括户口以大臣呼圖克領之民始𨽻州縣時群臣共欲以丁為戶耶律楚材以為不可衆皆曰我朝及西域諸國莫不以丁為戶豈可舍大朝之法而從亡國之政邪楚材曰自古有中原者未嘗以丁為戶若果行之可輸一年之賦遂即逃散矣蒙古主從楚材之議及呼圖克以所括戶一百四萬上蒙古主議割裂諸州郡分賜諸王貴族為湯沐邑楚材奏曰尾大不掉易以生隙不曰如多與金帛足以為恩蒙古主曰業已許之矣楚材若置官吏必自朝命除恆賦外不令擅自徵斂差可久也蒙古主從之楚材又定賦稅每二戶出絲一斤以供官用五戶出絲一斤以與受賜貴戚功臣之家上田每畝稅三升半中田三升下田二升半水田畝五升啇稅三十分之一鹽每銀一兩四十斤已上以為永額朝臣皆謂太輕楚材曰將來必有以利進者則以為重矣發明嗚呼中原乃宋室之故土太祖之舊物髙宗不兢陷沒金人金亡入於蒙古此誠宋室之不兢也今而以汴宋之民為蒙古所有以之而括民戶以之而定賦稅侵尋不已至於滅亡豈不深可哀哉綱目書此蓋亦不得已焉爾五月以趙葵為淮東制置使葵兼知揚州墾田治兵邉備以飭秋七月陳卓罷以鄭性之參知政事李鳴復簽書樞密院事八月趙范有罪免論失襄陽之罪也發明襄陽乃宋室之根本江南之藩屏誠冝守而不冝失也范輕佻速禍以失要地則根本搖而藩屏徹矣幾何而不喪師蹙國哉功懋必賞罪重則罰此又為國之正辟也特書有罪免則其徇名責實之意深矣蒙古陷棗陽軍德安府初蒙古破許州獲金軍資庫使姚樞楊惟中見之以兄事樞時北庭無漢人士大夫太祖見樞至甚喜特加重焉及庫騰南侵俾樞從惟中即軍中求儒釋道醫卜之人樞招致稍衆至是破棗陽特穆爾岱欲坑士樞力與辨得脫死者數十人繼拔德安得趙復復以儒學見重于世其徒稱為江漢先生既被獲不欲北行力求死所樞止與共宿譬説百端曰徒死無益隨吾而北可保無他也至燕名益大著學徒百人由是北方始知學經而樞亦初得覩程朱性理之書廣義姚樞金之臣也趙復民也復尚力求死所樞惟一意從之則二人之優劣蓋可知矣九月有事于明堂大雨震電鄭清之喬行簡免發明明堂之祭不為小矣大雨震電不為常矣大抵隂陽和則風雨時自然災異不生禍亂不作今既大雨則是陰氣縱震電則是陽失節既縱而又失節則其變豈不甚可畏哉清之行簡皆位首相隂陽不和莫能逃責故特以可免例書之雖然與其歸罪於人昌若自責於已是時賢否雜進外患交侵國事斷可識耳理宗何故責人則明而恕已則昏也耶召崔與之為右丞相兼樞密使復辭不至廣義與之識見不凡矣去年六月以參知政事召抗疏力辭今年九月復以右丞相召復辭不至嗚呼位莫重於是官也與之豈惡彼而逃之哉蓋以知時事之不可為故耳况乎年壽既髙敵人方熾又非筋力衰憊者之可辦也未幾奉祠不三年而卒則所見豈常情之可及哉噫與之清風高節溢于簡册可慕也已曹友聞與蒙古戰于陽平關敗績死之蒙古庫騰遂入成都曹友聞帥師扼仙人關諜報蒙古合蕃漢軍五十餘萬將至友聞謂弟萬曰國家安危在此一舉衆寡不敵豈容浪戰唯當乘髙據險出竒設伏以待之蒙古攻武休關敗都統李顯忠軍遂入興元欲衝大安軍制置使趙彥呐檄友聞控制大安以保蜀口友聞以為不可彥呐不從友聞乃遣弟萬及友諒引兵上雞冠隘多張旗幟示敵堅守友聞選精鋭萬人夜渡江密往流溪設伏約曰敵至內以鳴鼓舉火為應外呼殺聲蒙古兵果至萬出逆戰蒙古巴圖爾及逹海帥步騎萬餘人往來搏戰矢石如雨萬身被數創令諸軍舉烽友聞分所部為三以禦敵親帥精兵三千人疾馳至隘下先遣統領劉虎帥敢死士五百衝敵前鋒不動友聞乃伏三百騎道傍而令虎銜枚突陳會大風雨諸將請曰雨不止淖濘深沒足宜似少霽友聞叱曰敵知我伏兵在此緩必失機遂擁兵齊進友聞入龍尾頭萬聞之五鼓出隘口與友聞會內外兩軍皆殊死戰血流二十里兩軍素以綿裘代鐡甲經雨濡濕不利步鬭黎明蒙古兵增以鐡騎四面圍繞友聞嘆曰此殆天乎吾有死而已於是極口詬罵殺所乘馬以示必死血戰愈厲與萬俱死軍盡沒蒙古孟珙引兵敗蒙古特穆爾岱於江陵特穆爾岱攻江陵史嵩之遣珙救之珙遣張順先渡自以全師繼之變易旌旗服色循環往來夜則烈炬照江數十里相接珙又遣趙武等與戰珙親往節度遂破蒙古二十四寨還民二萬而歸蒙古將察罕寇真州知州事邱嶽敗之蒙古攻真州嶽部分嚴明守具周悉蒙古兵薄城輒敗嶽乘勝出戰於胥浦橋以強弩射其致師者一人死之敵兵少卻嶽曰敵兵十部於我不可以力勝也乃為三伏設炮石待之于西城敵至伏起炮發殺其驍將敵衆大擾嶽選勇士龔敵營焚其廬帳越二日皆引去發明蒙古入寇喪師失地獨孟珙敗之於江陵邱嶽敗之于真州則二人之功為何如哉書以豫之冝也復成都丁酉嘉熙元年春正月以李􅌫同知樞密院事宣撫四川二月以鄭性之知樞密院事鄒應龍簽書院事李宗勉同簽書院事李鳴復罷詔經筵進講朱熹通鑑綱目發明治鑑目録司馬公晚筆也其書太簡不足以備歷代顛末舉要補遺胡文定續書也其事固備不足以示後來鑒戒然則成先正未成之志發遺書未發之藴此朱子綱目之作其有益於治孟珙引兵敗蒙古特穆爾岱於江陵特穆爾岱攻江陵史嵩之遣珙救之珙遣張順先渡自以全師繼之變易旌旗服色循環往來夜則烈炬照江數十里相接珙又遣趙武等與戰珙親往節度遂破蒙古二十四寨還民二萬而歸蒙古將察罕寇真州知州事邱嶽敗之蒙古攻真州嶽部分嚴明守具周悉蒙古兵薄城輒敗嶽乘勝出戰於胥浦橋以強弩射其致師者一人死之敵兵少卻嶽曰敵兵十部於我不可以力勝也乃為三伏設炮石待之于西城敵至伏起炮發殺其驍將敵衆大擾嶽選勇士龔敵營焚其廬帳越二日皆引去發明蒙古入寇喪師失地獨孟珙敗之於江陵邱嶽敗之于真州則二人之功為何如哉書以豫之冝也復成都丁酉嘉熙元年春正月以李􅐉同知樞密院事宣撫四川二月以鄭性之知樞密院事鄒應龍簽書院事李宗勉同簽書院事李鳴復罷詔經筵進講朱熹通鑑綱目發明治鑑目録司馬公晚筆也其書太簡不足以備歷代顛末舉要補遺胡文定續書也其事固備不足以示後來鑒戒然則成先正未成之志發遺書未發之藴此朱子綱目之作其有益於治道也不少誠為人君之當講也理宗能召經筵進講綱目是蓋能知先務而不惑他岐者矣直書于册深豫之也蒙古始給官府符印定驛令初諸路官府自為符印僣越無度耶律楚材請中書省依式鑄給名器始重時諸王貴戚皆得自起驛馬道路騷擾所至須索百端楚材復請給牌劄定分例其弊始革三月資政殿學士魏了翁卒贈少師諡文靖蒙古擊欽察諸部降之欽察去中國三萬餘里夏夜極短日暫沒輒出土産良馬富者以萬計俗衽金革勇猛剛烈青目赤髮莽賚扣師至衮騰吉斯海會大風海水涸遂進師屠其衆生獲其酋長巴齊瑪克進兵圍俄羅嘶默齊嘶城皆降之夏五月臨安大火臨安大火自已至酉燒民廬五十三萬士民上書咸訴濟王之寃進士潘牥對䇿亦以為言并及史彌逺侍御史蔣峴彌逺之黨也上疏謂火災天數何預故同王遂劾方大琮王邁劉克莊等鼓扇異論并斥牥姓逆賊語涉不順請皆論以漢法自是群臣無敢復言濟王之寃矣發明寧宗之時四書臨安大火然當時政事舛錯敵國交侵故天變所以形之也是時強敵啓侵伐之謀朝政有不修之失天變之來莫切於此有上書訴濟王之寃者而蔣峴鄙夫以為火災天數無預故王噫君可欺天不可欺天可欺人不可欺臨安之境無故大火而乃以天數歸之則其逢君之惡何甚哉綱目書之得無意乎六月鄒應龍罷秋八月以李鳴復參知政事李宗勉簽書樞密院事蒙古校儒士于諸路耶律楚材奏制器者必用良工守成者必用儒臣儒臣之事業非積數十年殆未易成也蒙古主曰果爾可官其人楚材請校試之乃命稅課使劉中楊奐隨郡考試以經義詞賦論分為三科儒人被俘為奴者亦令就士其主匿弗遣者死得士凡四千三十人免為奴者四之一楚材又請一衡量立鈔法定均輸庶政略備民稍蘇息冬十月蒙古寇安豐知軍事杜杲力戰禦之蒙古引還蒙古昆布哈趨攻黃州孟珙帥師救却之遂攻安豐杜杲繕完守禦蒙古以火炮焚樓櫓杲隨陷隨補完蒙古令巴圖爾斫牌權木巴圖爾者皆死囚為之攻城以自贖杲募善射者用小箭射其目巴圗爾多傷而退蒙古填壕為二十七壩杲分兵扼壩蒙古乘風縱火俄而風雪驟作杲募壯士奪壩路士皆奮躍死戰會池州都統制呂文德突圍入城合力捍禦蒙古引去淮右以安文德安豐人魁梧勇悍嘗鬻薪城中趙葵見其遺屨長尺有咫異而訪之值文德出獵暮負虎鹿各一而歸召至帳下遂纍功勞超擢軍職十二月朔日食日與金木水火四星俱躔斗食將既戊戌二年春正月以余天錫同簽書樞密院事二月以史嵩之參知政事督視京湖江西軍馬置司鄂州尋兼督視淮南西路光蘄黃夔施州夏四月以李鳴復知樞密院事余天錫簽書院事李宗勉參知政事喬行簡請以兵事委鳴復財用委宗勉楮幣委天錫當會議者臣則參酌行之帝從其請六月李􅌫卒秋七月以趙以夫同知樞密院事九月蒙古圍廬州杜杲敗走之蒙古察罕帥兵號八十萬圍廬州期破廬後造舟巢湖以窺江左於壕外築土城六十里穿兩壕攻具皆數倍于攻安豐時杜杲極力守禦蒙古築壩髙於城樓杲以油灌草即壩下焚之皆為煨燼又於串樓內立雁翅七層俄炮中壩上衆驚杲乘勝出戰蒙古敗走杲追躡數十里又練舟師扼淮河遣其子庶監呂文德聶斌伏精鋭於要害蒙古不能進遂引師北歸詔加杲淮西制置使以孟珙為京湖制置使冬十月珙復郢州荆門軍珙受詔收復京襄珙謂必得郢然後可以通餽餉得荆門然後可以出竒兵及至嶽州檄江陵節制司搗襄郢召諸將指授方略發兵深入遂復郢州荆門軍蒙古建太極書院于燕京時濓溪周子之學未至於河朔楊惟中用師于蜀湖京漢得名士數十人始知其道之粹乃收集伊洛諸書載送燕京師還與姚樞謀建太極書院及周子祠以二程張楊遊朱六子配食請趙復為師選俊秀有識度者為道學生由是河朔始知道學發明建書院乃中國禮義之事雖蒙古而能修中國禮義之事則是崇儒重道而知所立政之基者也豈非綱目之所深豫乎見君子之心樂與人為善不存軒輕之見而遂沒其善耳廣義嗚呼道學之有益于人國也豈小補哉蓋人有華夷之辨道無華夷之分中國用之則中國尊而外夷不能為之侮夷狄用之則夷狄強而中國不能為之固中國失此必亡其國夷狄得此必昌其國是知道學者國家之根本生民之命脈宋自安石之後迭相攻擊不少假借至於理宗之世方得舒伸蓋以斬伐於前而不甚滋蔓矣相彼蒙古立國之初而能尊重吾道於干戈擾攘之秋耶蓋亦深契吾道之有禆于家國故也吁元之興也宋之亡也豈無自哉君子不以國之南北而沒其善可也孔子曰有教無類豈徒言哉己亥三年春正月以喬行簡為少傅平章軍國重事李宗勉為左丞相兼樞密使史嵩之為右丞相兼樞密使督視江淮四川京湖軍馬嵩之既相一時正人如杜範遊似劉應起李韶趙汝騰等皆以不合遂去時三相當國論者謂喬失之泛李失之狹史失之專然宗勉清謹守法猶號為賢以余天錫參知政事遊似簽書樞密院事三月孟珙復襄陽珙遣兵及蒙古三戰皆捷遂復信陽光化軍樊城襄陽因上奏曰取襄不難而守為難非將士不勇也非車馬器械不精也實在乎事力之不給爾襄樊為朝廷根本今百戰而得之當加經理如護元氣非甲兵十萬不足分守與其抽兵于敵來之後孰若保此全勝上兵伐謀此不爭之爭也乃以蔡息降人置忠衛軍襄郢降人置先鋒軍發明語曰君子可大受而不可以小知也小人不可大受而可以小知也蓋君子以小知而不以大受則是任非其才不幾乎有仇覽棲臠之議小人以大受而不以小知則亦任非其才不幾乎有臧文竊位之譏要在人君知人善任可也珙自去冬為京湖制置使十月書復郢州荆門軍三月書復樊城襄陽府施為措置逈出人表則是上不負其君之託下不負其已之才矣君子人歟君子人也直書于册以深豫之秋八月以遊似參知政事許應龍簽書樞密院事林略同簽書院事蒙古軍復破成都而去蒙古塔爾海兵入蜀制置使丁黼聞之先遣妻子南歸誓死守至是塔爾海自新井入詐竪宋將旗黼以為潰卒以旗榜招之既審知其非領兵夜出城南迎戰至石筍街兵散力戰而死蒙古遂取漢卭簡眉閬蓬州遂寧重慶順慶府尋引還黼帥蜀為政寬大蜀人思之冬十月許應龍林略罷十一月以范鍾簽書樞密院事十二月觀文殿大學士致仕崔與之卒與之未嘗造朝帝盧位待之致仕踰年而卒與之晚出畨禺屹然有大臣風與張九齡齊名異代贈少師封南海郡公諡清獻發明與之有學有守屹然有大臣風史稱其與唐之張九齡齊名異代誠宋之純臣也卒而具官所以深豫之耳孟珙遣兵禦蒙古于蜀口遂復夔州孟珙諜知蒙古塔爾海帥衆號八十萬南侵䇿其必道施黔以透湖湘乃請粟十萬石以給軍餉以三千人屯峽州千人屯歸州命弟瑛以精兵五千駐松滋為夔聲援增兵守歸州隘口萬戶谷及蒙古至珙密遣將禦之又以千人屯施州蒙古既人蜀珙增置營寨分布戰艦遣兵間道抵均州防遏且設䇿備禦未幾蒙古渡萬州湖灘施夔震動珙兄璟時知峽州帥兵迎拒于歸州大堙寨得捷于巴東遂復夔州以陳塤為國子司業塤史彌逺之甥也紹定中為太常博士上疏乞去君側之蠱媚以正主德從天下之公論以新庶政蓋指賈貴妃及彌逺也彌逺召謂曰何為好名塤曰好名孟子所不取然求士於三代之上惟恐其好名求士於三代之下惟恐其不好名耳因力請外彌逺卒乃召還歷官吏部侍郎至是授司業諸生相慶以為得師蒙古以溫都爾哈瑪爾提領諸路課稅初耶律楚林定課稅銀額每歲五十萬兩及河南降戶口滋息增至一百一十萬兩至是回回溫都爾哈瑪爾以二百二十萬兩撲買之楚材持不可曰雖取五百萬亦可得不過嚴設法禁隂奪民利耳反復爭論聲色俱厲蒙古主曰爾欲鬬搏邪楚材力不能奪乃太息曰民之困窮將自此始矣庚子四年春正月彗見營室臨安大飢飢者奪食於路市中殺人以賣盜於隱處掠賣人以徼利日未晡路無行人發明彗者逆戻之氣所成兵之家也襄二十四年經書大飢胡傳曰古者救災之政若國凶荒或發倉廩以賑乏或移粟以通用或徙民以就食或為粥溢以救餓莩或興作以聚失業之人緩刑舍禁弛力薄征索國神除盜賊弛射侯而不燕置廷道而不修殺禮物而不備雖有旱乾水溢民無菜色所以備之者如此其至今有彗孛之災而又大飢蓋所以賑業之者有不備矣故書之以為戒彗見營室則天之變形臨安大飢則民之災甚當時賑業之不備修德之不誠亦可見矣然而下書蒙古張柔入冦則又變不虛生之微也人君知此可不反身修德以應非常之變也哉蒙古張柔等分道入寇二月以孟珙為四川宣撫使珙遂大興屯田珙條具上流事冝會諜知蒙古於襄樊信陽隨州招集軍民布種積船材于鄧之順陽乃分兵撓其勢潛兵燒所積船材又度其必因糧於蔡遣兵火其積聚遂拜四川安撫使知夔州節制歸峽鼎澧軍馬珙至鎮招集散民為寧武軍以降人回鶻愛里巴圗爾為飛鶻軍釐蜀政之弊為條班諸郡縣且曰不擇險要立寨柵則難責兵以衛民不集流離安耕種則難責民以養兵乃立賞罰以課殿最俾諸州奉行之尋兼夔州路制置屯田調夫築堰募農給種首秭歸尾漢口為屯二十為頃十八萬八千二百八十又創南陽竹林兩書院以處襄漢四川流寓之士以李庭芝施州建始縣庭芝訓農治兵選壯士雜官軍教之期年民皆知戰守善馳逐無事則植戈而耕敵至則悉出而戰珙下其法於所部行之廣義孟珙屯田之舉雖趙充國諸葛孔明何以過之書曰大興屯田豫之也夏四月召史嵩之還以杜杲為沿江制置使知建康府蒙古復使王楫來楫前後凡五至以和議未決隱憂致卒遣使歸其柩于蒙古發明蒙古大夫未有以名氏通者其曰王楫進之也王楫兩稱名吳楫也曰來嘉服義也楫凡五至皆欲通兩國之好息天下之兵其意善矣蒙古而能求通於中國此綱目之所豫者故稱名曰來以豫之如春秋書楚屈完來盟同意秋九月喬行簡罷行簡告老乃以少師為醴泉觀使尋卒冬閠十二月李宗勉卒以遊似知樞密院事徐榮叟簽書院事范鍾參知政事蒙古嚴實卒子忠濟嗣辛丑淳祐元年春正月詔加周敦頥張載程皓程頥封爵與朱熹並從祀孔子廟庭黜王安石從祀詔曰孔子之道自孟軻後不得其傳至我朝周敦頥張載程皓程頥真見實踐深探聖域千載絶學始有指歸中興以來又得朱熹精思明辨表裏混融使大學論孟中庸之書本末洞徹孔子之道益以大明于世朕每觀五臣論著啓沃良多今視學有日其令學宮列諸從祀以示崇奬之意尋以王安石謂天命不足畏祖宗不足法人言不足恤為萬世罪人豈冝從祀孔子其黜之越二日加封敦頥汝南伯載郿伯皓河南伯頥伊陽伯發明龜鑑曰尊祀黃耉周家所以師賢分祀聖哲唐家所以崇道此則耆德之儒名教所師有不可以不重也蓋五賢當世之大儒禮冝從祀安石當時之小人法冝迸黜理宗一尊之一黜之然後人心正天理明而邪説淫詞不能加喙於其間矣儒學重則吾道亦重儒學輕則吾道亦輕宋褒先儒其審諸此歟好善惡惡天下至情然人每失其正者心有所倚而不能自克也今善者好之惡者惡之則是得好惡之正理宗豈非發祖宗未發之典也哉據事直書其義自見廣義申包胥曰人衆者勝天天定亦能勝人夫人固不可以勝天然而能勝之者以天之未定耳逮夫天之一定則人之紛紜舛錯者必將勢解力散退伏之不暇何勝云乎哉昔王氏以妾婦之道蠱神宗而神宗恬不知省由是得以鼓其邪説以聾瞽一世其間道德君子鋤治簸揚之殆盡故王氏之説盛行於當時間有廉恥弗顧急於進取者悉從其説以叨富貴均以聖人目之何其盛哉此人衆或可以勝天也今焉理宗信道篤而見理明觀其詔辭何其專且敬耶於是尊崇群賢追封髙爵陪杞聖人顯榮萬世尊正道辟邪説如集冠裳軒冕於青天白日之下抑何其盛邪此天定所以能勝人也嗚呼人能勝天不過勝於一時天能勝人實能勝於萬世理宗能以天勝乎人如此則其賢於有宋厯世之君也多矣三月趙以夫罷秋七月髙麗王暾以族子為質于蒙古先是蒙古伐髙麗髙麗屢敗乃復入貢請平蒙古令其王暾親朝當罷兵至是暾以族子為質于蒙古八月求遺書發明求遺書帝王之美事也理宗能行乎此則亦庶幾知務本之學焉故通鑑不書而綱目持書之所以不沒其善也若理宗者亦可謂中興有道之令主矣冬十月蒙古以伊囉斡齊行省事于燕京主管漢民公事以姚樞為郎中十一月蒙古主烏格台卒第六后尼瑪察氏稱制烏格台立十有三年卒年五十六廟號太宗性嗜酒晚年尤甚耶律楚材數諫不聼乃持酒槽鐡口以獻曰此鐡為酒所蝕尚致如此况人之五臟邪蒙古主乃少減是年二月疾篤脈絶六皇后不知所為召楚材問之楚材對曰今任使非人賣官鬻獄囚繫非辜者多宜赦天下后亟欲行之楚材曰非君命不可頃之蒙古主少蘇后以為言乃首肯之赦發而脈復生十一月疾愈楚材以太一數推之不冝田獵左右皆曰不騎射何以為樂出田五日還至烏特古呼蘭溫都爾哈瑪爾進酒飲極夜乃罷翌日卒初蒙古主有旨以孫實勒們為嗣至是后召楚材問之楚材曰此非外姓臣所敢知自有先帝遺詔幸遵行之后不從遂稱制於和林實勒們蒙古主第四子庫春之子也成都將田世顯叛以城降蒙古制置使陳隆之死之塔爾海汪世顯等復入蜀進圍城都隆之守彌旬誓與城存亡部將田世顯潛送欵于蒙古乘夜開門北兵突入隆之舉家數百口皆死檻送隆之至漢州命諭守臣王夔降隆之大呼曰大丈夫死爾勿降也遂見殺漢州兵三千出戰城破盡為蒙古所屠發明田世顯以城降敵其惡已甚故直書叛以著不赦之罪陳隆之既執不降舉家死義逮至檻送漢州俾降王夔觀其大呼之言曰大丈夫死爾勿降也則君臣之大義曉然於方寸之間矣較諸世顯之徒貪利忘君背國降敵竊榮利於一時受唾罵於萬世者豈可同日語哉故特以全節豫之十二月余天錫卒蒙古使伊埒默色等來至淮上守將囚之蒙古使伊埒默色來議和從行者七十餘人伊埒默色曰吾與汝等奉命南下楚人多詐倘遇害當死焉毋辱君命已而馳抵淮上守將以兵脅之曰爾命在我生死頃刻間耳若能降官爵可立致不然必不汝貸伊埒默色曰吾持節南來以通國好反誘我以不義有死而已守將知其不可遒乃囚之長沙飛虎寨發明行人所以通兩國之好國之安危繫焉誠不可以沮抑之也今既囚之則是失交鄰之道啓兩國之爭其不可也必矣宋囚敵使而致禍亂豈非宋之自取哉故直書囚以譏其失壬寅二年春正月遊似罷以范鍾知樞密院事趙葵同知院事别之傑簽書院事廣義抑考趙葵不度德量力遽爾輕佻強敵以基亡宋之禍罪莫大焉今也理宗不科其棄汴逃歸之罪反以同知院事其味於事機之大可勝言哉以徐榮叟參知政事蒙古復寇蜀孟珙分兵禦之蒙古伊克諾延耶律珠格自京兆取道商房以趨三川遂攻瀘州孟珙遣一軍屯江陵及郢州一軍屯沙市一軍自江陵出襄與諸軍會又遣一軍屯涪州且下令應出戍主兵官不許失棄寸土權開州梁棟以之糧還司珙曰是棄城也斬以徇由是諸將稟命惟謹蒙古燕京行省郎中姚樞棄官隱于蘇門蒙古伊囉斡齊在燕惟事貨賂以樞為幕長分及之樞一切拒絶因辭職去擕家往輝州之蘇門作家廟别為室奉孔子及宋儒周程張邵司馬六君子像刋小學四書并諸經傅注以惠學者讀書鳴琴若將終身發明是時伊囉斡齊行省燕京惟事賄賂分及姚樞樞以為君子奚可以貸取一切拒絶蓋立乎人之本朝而道不行恥也由是辭職而去隱於蘇門誠遁世無悶不見是而無悶者矣讀書鳴琴何以踰吾性分之樂哉故書棄官隱於蘇門則其浮雲富貴敝屣功名舉天下勢分之樂一毫無有動於其中者爾故特表而出之廣義易曰女子貞不字十年乃字蓋言君子當慎其所從也然樞以金之亡臣而仕蒙古則已昧其所從於始矣今則翻然悔悟棄官就隱所謂覺今是而昨非其得九五之嘉遁者也詩曰衡門之下可以棲遲泌之洋洋可以樂飢樞其有焉夏五月趙葵罷六月徐榮叟罷中書舍人李韶言道揆之地愛善類不勝於愛爵祿畏公議不勝於畏權勢與嵩之議不合出知泉州榮叟言韶議論不阿請留之帝不聼亦罷以别之傑同知樞密院事高定子簽書院事杜範同簽書院事定子尋罷範抗言時政無隱情史嵩之外示寬容內實忌之秋七月蒙古兵渡淮入揚滁和州九月朔日食冬十月蒙古陷通州屠其民發明嗚呼殺戮之禍至是極矣宋室不兢而使蒙古之徒侵據華夏慿陵之氣荼毒生民既陷通州則亦已矣而又驅一城生靈陷鋒鏑之下非至不仁者弗克忍為爭城以戰殺人盈城其罪可勝誅乎故綱目直書屠以著其暴十二月别之傑罷癸卯三年春正月蒙古張柔分兵屯田于襄城二月以余玠為四川制置使初玠家貧落魄無行亡命走揚州上謁趙葵葵壯之留置幕府俾帥舟師泝淮入河抵汴所向有功纍推淮東制置副使入對言方今指即戎之士為粗人斥為噲伍願陛下視文武之士為一勿令偏有所重偏則必至於激文武交激非國之福帝曰卿人物議論皆不尋常可獨當一面乃授四川宣諭使至是加制置使知重慶府蜀中財賦入戶部三司者五百餘萬緡入四總領所者二千五百餘萬緡金銀綾錦之類不預焉自寶慶三年失關外端平三年蜀地殘破所存州郡無幾國用益窮十六年間凡授宣撫使者三人制置使者九人俱無成績於是兩川無復紀律遺民咸不聊生監司戎帥各專號令擅辟守宰蕩無法度蜀日益壞玠至大更弊政遴選守宰築招賢館于府左士之至者玠不厭接隨其材而任之遂於利閬城大獲山以護蜀口蓬州城營山渠州城大良平嘉定城舊治瀘州城神臂山其他因山為壘棊布星列如臂使指氣勢聯絡屯兵聚糧為必守計民始有安土之心廣義玠識高量洪其賢於范葵輩多矣為時名將夫何愧哉三月朔日食蒙古中書令耶律楚材以憂卒尼瑪察氏稱制溫都爾哈瑪爾專政事權傾中外后至以御寶空紙使自書填楚材曰天下者先帝之天下朝廷自有憲章今欲紊之臣不敢奉詔又有旨凡溫都爾哈瑪爾建白令史不為書者斷其手楚材曰國之典故先帝悉委老臣令史何預焉事若合理自當奉行如不可行死且不避况截手乎后不悅楚材憤悒成疾而卒或譛之曰楚材為相二十年天下貢賦半入其家后命近臣覆視之惟琴玩十餘及古今書畫金石遺文數千卷楚材天資英邁夏出人表止色立朝不為勢屈每陳國家利病生民休戚辭色懇切蒙古太宗嘗曰汝又欲為百姓哭邪楚材每言興一利不若除一害生一事不若減一事人以為名言至順初贈太師追封廣寧王諡文正宋子貞曰元承大亂之後天綱人理幾乎泯絶加以南比之政每每相戾出入用事之臣又皆諸畨降附言語不通趨向不同楚材以一書生孤立其間欲行其所學可謂難矣然見於設施者十不二三向使無楚材政事不知其何如耳發明蒙古之臣卒而未嘗具官此獨具官何録賢也是時尼瑪察氏稱制凡事專決楚材諫既不行言亦不聼憤抑而卒嗚呼寃哉故書以憂卒則其抑鬱不得伸之意可見矣廣義楚材失節之臣也臣既備論其所由於前矣綱目於此而書曰以憂卒者所以志其不克令終也夫既不能善其始又不能善其終雖有周公之才美何足觀哉蒙古以汪世顯為秦鞏諸州總帥尋卒蒙古入蜀世顯之功為多至是庫騰承制拜世顯便宜總帥統秦鞏定西金蘭洮會環隴慶陽平涼德順鎮戎原階成岷疊西和二十州事尋卒子德臣代為總帥將兵從入蜀余玠城釣魚山徙合州治之播州冉璡及弟璞俱有文武材隱居蠻中前後閫帥辟召皆堅辭不至聞玠賢自詣府上謁玠待以上客璡璞居數月無所言玠疑之乃更闢别館以處之且日使人窺其所為兄弟終日不言惟對踞以堊畫地為山川城池之形起則漫去如是又旬日請見玠屏人曰某兄弟辱明公禮遇思有以少禆益為今日西蜀之計其在徙合州城乎玠不覺躍起執其手曰此玠志也但未得其所耳璡曰蜀口形勝之地莫若釣魚山請徙此若任得其人積粟以守之賢於十萬師逺矣玠大喜曰玠固疑先生非淺士先生之謀玠不敢掠以歸已遂密以其謀聞于朝請不次官之詔璡權發遣合州璞權通判徙城之事悉以任之釣魚城成蜀始可守發明城非春秋所貴然亦有二義焉城於無事之時譏病民也城於有事之時豫設險也釣魚山城而蜀始可守矣故書豫之廣義余玠賢將也觀其求賢之心待賢之禮可謂兩盡矣向無璡璞兄弟之嘉謀惡能以成厥功哉書曰出入自爾師虞庶言同則繹玠誠有焉甲辰四年春正月以李鳴復參知政事杜範同知樞密院事劉伯正簽書院事範固辭遂與鳴復俱罷初範為殿中侍御史嘗論鄭清之李鳴復之過不行即棄官去至是不屑與鳴復共政上疏辭位而去帝遣使召還太學諸生亦上書留範而斥鳴復并斥史嵩之嵩之諷諌議大夫劉晉之併論罷二人三月以金淵簽書樞密院事夏六月賜禮部進士留夢炎及第發明綱目凡書賜及第分注或載其同榜之人或載其所上之䇿今而分注皆略而不存是必同榜之人皆一時猥鄙而不足紀所上之䇿或一時浮靡而不足録耳不然綱目何以但書留夢炎及第分注皆削而不書哉厥後夢炎用事背國降元則其素乏風節已可見於此矣此綱目書法之深意學者要當詳察焉以呂文德為淮西招撫使先是以文德為侍衛副都指揮使總兩淮軍馬既而蒙古圍壽春文德解其圍遂有是命未幾文德又敗蒙古于五河復其城秋九月詔起復史嵩之將作監徐元杰大學生黃愷伯等上書論之不報先是黃濤劉應起徐霖等俱上書論嵩之深姦擅權帝不聼而論者益衆及其父彌忠疾亟嵩之謁告許之翌日彌忠卒詔嵩之起復徐元杰上疏曰陛下為四海綱常之主大臣身任道揆扶翊綱常自聞嵩之有起復之命凡有父母之心者莫不失聲涕零是果何為而然人心天理誰實無之興言及此非可使聞於鄰國也臣懇懇納忠何敢詆訐特為陸下愛惜民彛而己疏出史憾之帝亦不聼於是太學生黃愷伯等百四十四人上書曰嵩之心術回邪蹤迹詭祕曩者開督府以和議墮將士心以厚資竊宰相位羅天下之小人為私黨奪天下之利權歸私室蓄謀積慮險不可測在朝廷一日則貽一日之禍一嵗則貽一歲之憂萬口一辭惟恐其去之不速今嵩之不去徘徊牽引彌縫貴戚買囑貂璫轉移上心𠂻私御筆必得起復之禮然後從容就道切不見其憂戚之容大臣佐天子以孝治天下孝不行於大臣是率天下而為無父之國矣以法繩之雖置之鐵鉞盾不足謝天下况復置之具瞻之位乎武學生翁日善等六十七人京學生劉時舉等九十四人宗學生與寰等三十四人皆上書切諫亦不報時范鍾劉伯正領相事惡京學生言事謂皆遊士鼓倡之諷京尹趙與籌盡削遊士之籍發明天子禮義綱常之主宰相風節教化之司欲正乎逺先正乎近左右不正難以言治是故孟子之告滕君曰啜粥面深墨即位而哭百官有司莫敢不哀先之也上有好者下必有甚焉者矣君子之德風也􅘁人之德草也草上之風必偃蓋奪情非令典起復非美名嵩之既為相國則非常人之比江南巳為小康又非金之時甫丁父憂即營起復此烏足以令天下乎由是徐元杰論之於前三學生言之於後帝違衆論而不聼豈理也哉則是理宗知有嵩之而不知有公法也故詳書以譏之廣義昔周之季尹氏世秉國鈞為政不平將覆宗國故家父作詩以刺之東萊釋之曰致亂者雖尹氏而用尹氏者則王心之蔽也今宋之史氏亦秉鈞三世矣其所任用者非姻婭則險邪然其亂宋之政濁宋之朝傾宋之國其與周之尹氏何以異哉今於其父喪未終而復之無乃長其姦之甚乎嗚呼史氏之心廷臣知之四學生知之路人知之而其溺而不知者獨理宗耳然所謂之知者何知南宋敗亡之禍必梯於史氏也詩曰國既卒斬何用不監此之謂乎冬十月以劉漢弼為左司諌史嵩之久擅國柄帝亦患苦之乃夜降御筆黜四不才臺諌於是諌議大夫劉晉之侍御史王瓚監察御史龔基先胡清獻皆罷去以漢粥為左司諌漢弼首贊帝曰拔去隂邪庶可轉危而安否則是非不兩立邪正不並進陛下雖欲收召善類不可得矣帝嘉納之十一月詔史嵩之終喪徐元杰復上疏論嵩之起復士論紛然乞許其舉執政自代帝曰學校雖是正論但言之太甚元杰對曰正論乃國家元氣今正論猶在學校要當保養一線之脈因乞引去左司諌劉漢弼亦上言願聼嵩之終喪亟選賢臣早定相位又論馬光祖奪情總賦淮東乃嵩之預為引例之地乞勒令追服以補名教會嵩之亦自知不為衆論所容上疏乞終制帝乃許之金淵等有罪免上欲更新庶政乃召王伯大李性傳陳韡等赴闕於是劉漢弼及右正言鄭宷監察御史江萬里相繼言簽書樞密院事金淵諫議大夫劉晉之兵部尚書鄭起潛吏部侍郎濮斗南陳一薦起居舍人韓祥國子祭酒項容孫起居郎葉蕡主管侍衛步軍司王德明及知州林光謙等皆附麗史嵩之為之腹心盤據要路公論之所切齒詔淵罷政于祠餘各貶官有差發明淵等附麗嵩之盤據要路頤指氣使靡所不為公論之不行久矣蓋欲服惡鷙先剪羽翼欲去大姦先黜同類同類不黜則夤緣為非大姦雖去而猶未去也故淵等既削其官而又書有罪以深貶之十二月以范鍾杜範為左右丞相並兼樞密使範入相首上五事曰正治本謂政事當常出於中書毋使旁蹊得竊威福曰肅宮闈謂當嚴內外之限使官府一體曰擇人才謂當隨其所長用之而久於職毋徒守遷轉之常格曰惜名器謂如文臣貼職武臣閣衛不當為徇私市恩之地曰節財用謂當自人主一身始自宮掖始自貴近始考封樁國用出入之數而補窒其罅漏求鹽策楮幣變更之目而斟酌其利害仍乞早定國本以安人心以劉伯正參知政事遊似知樞密院事趙葵同知院事以孟珙兼知江陵府珙至江陵登城歎曰江陵所恃三海不知沮洳有變為桑田者敵一鳴鞭即至城外蓋自城以東古嶺先鋒直至三汊無限隔乃修復內隘十有一别作十隘于外有距城數十里者沮漳之水舊自城西入江因障而東之俾繞城北入于漢而三海遂通為一隨其髙下為匱蓄泄三百里間渺然巨浸土木之工百七十萬民不知役因繪圖上之乙丑五年春正月劉伯正罷以李性傳簽書樞密院事夏四月右丞相兼樞密使杜範卒發明杜範為相僅五閲月而弊政侈俗亦為之漸革者正其身以率物也綱目前書範為左丞相初無美詞至是範卒書官書諡始足以表其賢此屬詞比事之意也與唐楊綰書法同六月工部侍郎徐元杰暴卒史嵩之既去元老舊德次第收召杜範既入相復延元杰議政多所裨益六月朔元杰當侍立先一日謁范鍾歸是夕熱大作夜四鼓指爪忽裂以死三學諸生相繼伏闕上言昔小人傾君子者不過使之死于蠻煙瘴雨之鄉今蠻煙瘴雨不在嶺海而在朝廷詔付臨安府鞫治常所給使之人獄迄無成劉漢弼亦每以姦邪未盡屏汰為慮未幾以腫疾暴死太學生蔡德潤等百七十有三人復叩閽上書訟寃詔給元杰漢弼官田五百畝緡錢五千恤其家時杜範入相八十日卒元杰漢弼相繼暴死時謂諸公皆中毒堂食無敢下筯者初嵩之從子璟卿嘗上書諌嵩之曰久開督府所成何功東南民力困於征輸州縣匱于應辦誠恐禍起蕭墻危如朝露為今之計莫若盡去在幕之群小悉召在野之君子相與改絃易轍戮力王事以收桑榆之功言甚切至居無何璟卿暴卒相傳亦嵩之致毒云發明甚矣小人之中傷善類也同已者親之如兄弟異已者視之如仇讐姑即寧埋兩朝􅘁人觀之韓托胄專擅政政忌趙汝愚之異已譛貶衡州中毒而卒史嵩之竊㺯國鈞忌徐元杰之異已雖未譛貶中毒而卒甫隔兩朝如出一轍蓋由小人之行貪位慕祿乃其素志妬賢疾能又其本心一旦從而論之黜而罷之則其患失之心寧能自已故切齒以怨異已之人必欲置之死地然後可以快其私憤耳噫理宗不競而使左右之正人為姦臣無故而害當時群臣既不能詰理宗又不能討而君子死於無辜小人益肆暴虐豈不深可惜哉直書暴卒其義自見秋七月蒙古察罕會張柔掠淮西至揚州而去冬十一月以陳韡同簽書樞密院事十二月以遊似為右丞相兼樞密使趙葵知樞密院事李性傳同知院事性傳尋罷丙午六年蒙古定宗貴由元年春正月朔日食發明日食正旦此天下大變也自蒙古擾亂至是十餘年矣天道一變故特以是戒警之又十餘年而咸淳改元宋祚益弱自是強敵橫行宋室遂滅孰謂天道無知乎即綱目所書觀之始可以見君子書法之意深矣二月范鍾罷鍾為相雖無赫赫可稱而直清守法與遊似不協力辭而去夏六月以陳韡參知政事秋七月蒙古主庫裕克立庫裕克太宗長子六皇后臨朝四年至是會諸王百官議立庫裕克即位于昂吉蘇默托里之地朝政猶出於后九月寧武節度使漢東公孟珙卒以賈似道為京湖制置使珙忠君體國之念可貫金石在軍中參佐部曲論事言人人異珙徐以片言折𠂻衆志皆愜謁士遊客老校退卒一以恩意撫接名位雖重惟建旗鼓臨將吏而色凛然無敢涕唾者退則掃地焚香隱几危坐若蕭然事外逺貨色絶滋味尤邃於易學纍贈太師追封吉國公諡忠襄發明史稱珙忠君體國之念可貫金石故卒而具其官爵以豫之蓋京湖宋室之根本江南之要衝誠冝擇人以制置也今乃以落魄無羈不學無術之似道為之多見其不勝任也故下書蒙古寇京湖江淮之境此其驗耳可見君子小人平日卒未能别逮至臨大事決大謀則君子小人於斯而判矣吁可歎哉冬十二月詔史嵩之致仕嵩之服除有嚮用之意殿中侍御史章琰正言李昂英監察御史黃師雍論其無父無君乞寢宮祠削官逺竄詔皆落職豫祠翰林學士李韶與從官抗疏言陛下不能正姦臣之罪其過不専在上蓋大臣百執事不能輔天子以討有罪乞斷以春秋義亟賜裁處乃命嵩之以觀文殿大學士永國公致仕詔不復用蒙古寇京湖江淮之境蒙古萬戶史權等耀兵淮南攻虎頭關塞拔之進至黃州丁未七年夏四月以王伯大簽書樞密院事吳潛同簽書院事遊似罷以鄭清之為太傅右丞相兼樞密使中使及門清之方放浪湖山寓僧剎竟夕不歸詰旦始還入對力辭不允以趙葵為樞密使督視江淮京湖軍馬陳韡知樞密院事湖南安撫大使葵兼知建康府韡兼知潭州秋七月吳潛罷以别之傑參知政事鄭宷同簽書樞密院事八月宷罷蒙古侵髙麗髙麗歲貢不入蒙古伐之自後終憲宗八年凡四易將拔其城十有四戊申八年春三月蒙古主庫裕克卒后烏拉海額實稱制庫裕克年四十三卒于杭錫雅爾地廟號定宗時國內大旱河水盡涸野草自焚牛馬死者十八九人不聊生諸王及各部又遣使於諸郡徵求貨財或於西域回鶻索取珠璣或於海東取鷹鶻驛騎絡驛晝夜不絶民力益困皇后烏拉海額實抱庫春之子實勒們聼政諸王大臣皆不服發明前書第六后尼瑪察氏稱制此書后烏拉海額實稱制則禍胎之伏其來久矣然而不至於亡國者豈非幸歟綱目特舉而書之於册者所以為後世戒耳於毋后乎何誅秋七月以王伯大參知政事應㒡同知樞密院事謝方叔簽書院事史宅之同簽書院事伯大尋罷冬十月别之傑罷己酉九年春閠二月以鄭清之為太師左丞相趙葵為右丞相並兼樞密使應㒡謝方叔參知政事史宅之同知樞密院事清之辭免太師許之夏四月朔日食五月陳韡罷秋九月嚴中外上書之禁諌臣言譁徒吻士結黨扣閽簧鼓是非為攫利之計詔中外士庶上書其言有益於國者必加精採倘涉私邪朋姦罔上妄肆雌黃當嚴加究問是時臺綱不振嬖寵干政彈文及其私黨則內降聖旨宣諭刪去謂之節帖臺諫不敢與爭發明是時臺綱不振嬖寵干政正宜激濁揚清一新政令之時也而理宗嚴中外上書之禁則人皆以為言而獲罪言之何益率天下之人而禍其正言者必是之舉矣舜之所謂大知者以其不自用而取諸人也執其兩端用其中於民未聞分邪正之等而禁之者也人君在乎察之何如耳今既禁之則言事之臣必曰我之言未審是歟非歟雖有忠言亦將括囊而無咎矣執肯為之盡言哉故直書以著其失冬十一月應㒡罷十二月以吳潛同知樞密院事徐清叟簽書院事史宅之卒庚戌十年春三月以賈似道為兩淮制置大使李曽伯為京湖制置使似道兼知揚州曾伯知江陵府廣義孟珙之於似道其賢不肖相去逺矣理宗於孟珙之卒而即以似道代之則宋事之不克濟蓋可知矣嗚呼趙宋東南之日誰其失之可哀也已趙葵罷言者論葵非由科目進且曰宰相須用讀書人葵因力辭其表有云霍光不學無術每思張詠之語以自慚后稷所讀何書敢以趙抃之言而自解帝不得已授醴泉觀使兼侍讀復固辭乃以觀文殿大學士判潭州冬余玠出兵至興元而還玠帥蜀慷慨自許有挈故地還天子之語上嘉之數而年之間建城璧築關隘增屯堡邉境稍息寖以驕恣鄭清之再相因從臾其進兵於是一意出師雖有小捷至興元遇蒙古將汪德臣鄭鼎無功而還發明莊八年秋書師還君子以為譏久役也余玠輕舉大衆妄動久役至興元而頓兵不進遇蒙古而無功乃還則玩兵耀武欲為不果未有如此之甚也至是師為重矣義繫於師故書出兵至興元而還以著勞民毒衆之罪為後戒也志存恢復則必勇往何以甫出而遽還乎綱目王道之權衡此類是矣辛亥十一年憲宗莽賚扣元年春三月以謝方叔知樞密院事徐清叟同知院事吳潛參知政事夏六月蒙古主莾賚扣初定宗卒久未立君中外洶洶至是諸王穆格及大將烏蘭哈逹等咸會議所立時定宗后所遣使者在坐曰昔太宗命以皇孫實勒們為嗣諸王百官皆與聞之今實勒們故在而議欲他屬將置之何地邪烏蘭哈逹等不聼共推莽賚扣即位于奎騰教拉之地追尊其考圓壘為帝廟號睿宗實勒們及諸弟心不能平莽賚扣察諸王有異同者並羈縻之取主謀者誅之遂頒便冝事于國中罷不急之役凡諸王大臣濫發牌印詔旨宣命盡收之政始歸一烏蘭哈逹蘇布特之子也秋七月蒙古主命其弟呼必賚總治漠南開府金蓮川詔凡軍民在漠南者聼呼必賚總之遂開府于金蓮川時姚樞隱居蘇門呼必賚遣趙壁召之樞至大喜待以客禮樞乃為書數千言上之首陳帝王之道與治國平天下之大經曩為八目曰修身力學尊賢親親畏天愛民好善逺佞次及救時之弊為條三十呼必賚竒其才動必召問樞因言于呼必賚曰今土地人民財賦皆在漢地王若盡有之則天子何為後必有間之者矣不若惟持兵權凡事付之有司則勢順理安呼必賚從之廣義抑考淳祐二年姚樞棄官隱于蘇門若無復有仕進行道之心者蓋以知夫出處之非正也至是以皇弟召而至者何也守道之不堅也蒙古遣察罕等將兵分道寇淮蜀冬十一月鄭清之卒清之以老病固求解政遂以太傅充醴泉觀使奉朝請越六日而卒清之不好立異自與史彌逺議廢立得至宰輔然端平之初召用正人清之之力也其再相則年齒暮政歸妻子間廢之人或因緣以賄進為世所少發明清之何以不書官蓋宰相代天出治當以平心處之今清之欲希進用則附史彌逺以進之擅行廢立傾覆紀綱理宗茍能明行天討則清之必蒙顯戮况其相業無聞政歸妻子幾致傾危社稷之類此皆小人所為故綱目於其卒也削去其官以示貶耳若生榮死安無復譏刺何以懲戒乎小人哉以謝方叔為左丞相吳潛為右丞相並兼樞密使時二揆虛席嵩之貨遊士上書薦已喧傳麻制已下衆心洶洶及聼宣制則方叔潛也始帝欲相嵩之中夜忽悟召學士改相二人以徐清叟參知政事董槐簽書樞密院事蒙古呼必賚置經略司于汴分兵屯田自庫騰取漢上諸郡因留軍戍境上繼而襄樊壽泗復降而壽泗之民盡為軍官分有由是降附路絶雖歲侵淮蜀軍將惟利剽殺城無居民野皆榛莾至是呼必賚從姚樞之請置經略司於汴以孟克史天澤楊惟中趙壁為使俾屯田唐鄧等州授之兵牛敵至則戰退則耕西起襄鄧東連清口桃源列障守之初河南總管劉福貪酷虐害遺民將二十年惟中召福聼束約福以數千人擁衛而至惟中握大挺擊殺之百姓莫不稱快廣義姚樞諫行言聼足以慰其行道之心矣其如出處節義何蒙古號西域僧納摩為國師納摩西域竺乾國人與兄鄂多齊俱學浮屠定宗嘗命鄂多齊佩金符奉使省民憲宗復禮納摩令總天下釋教鄂多齊亦貴用事發明所貴乎立國者以其有先後措施之節也蒙古初事草創中土未得盡入版圖干戈未息不思勵精圖治撫綏勞來遽以納摩為國師豈欲效先王以神道設教之意耶是其先不急之務舍本求末以資𡨕福曽何足語于治天下之道哉蒙古習俗固然無足怪者然既據有華夏當以民生吏治為先顧乃崇尚虛無又使之佩帶金符省視民瘼開後來干政之漸此舉實作之俑也故特書之以著其非壬子十二年春二月朔日食蒙古城沔州發明築城何必書一以著要害之地為敵所據一以著邉將之令為敵所罔也與唐書吐蕃作三河橋同意蒙古主莾賚扣徙諸王于邊殺定宗后烏拉海額實竄實勒們于摩多齊莽賚扣以諸王欲立實勒們乃徙太宗后克勒竒呼塔于壙端所居地之西分遷諸王于各邊以大宗后妃家資分賜諸王定宗后及實勒們毋以厭禳並賜死禁錮實勒們于摩多齊之地發明實勒們太宗之孫太宗臨殂命立為嗣則實勒們禮所當立也諸王皆以為言因烏蘭哈逹等不聼推莾賚扣則是諸王之言為是而哈逹之言為非莾賚扣憤諸王異已疾故后之厭禳一徙之一殺之一竄之果可以欺天下乎故綱目皆以無罪例書所以著莾賚扣之罪其義亦深切而著明矣夏六月閩淅大水嚴衛婺信台處建劍邵同日大水冒城郭漂室廬人民死者以萬數詔遣使分行賑恤之徐清叟言漢關中大水翼奉以為后親舅之故今宜少抑宦官戚畹以回天意發明大水者隂逆而與怨氣交并之所致也君上為陽臣下為隂朝廷為陽后宮為隂君子為陽小人為隂是時蒙古竊發於外戚宦充滿於內小人乘間於中而陰沴之來必矣嗚呼人事無形而難知天變有象而易見人事始乖於下天變即形於上然則天人相與之際甚可畏也人君其可以為常而忽之哉欲弭天變先弭人變正此之謂也夫豈無其故而綱目書之欲使後之人主遇災而懼無敢怠荒焉耳蒙古分漢地封宗屬蒙古主以中州封同姓命弟呼必賚於汴京關中自擇其一姚樞曰南京河徙無常土薄水淺㵼鹵生之不若關中呼必賚遂請於蒙古主蒙古主曰關中户寡河南懷孟地狹民夥可取自益由是盡有關中河南之地呼必賚遂分遣使戍興元諸州又奏割河東解州鹽池以供軍立從宜府於京兆屯田鳯翔募民受鹽入粟轉漕嘉陵秋八月蒙古使呼必賚將兵擊大理冬十月蒙古兵入嘉定府蒙古汪德臣將兵掠成都薄嘉定四川大震帥守俞興元用等夜開關力戰始解去議者謂余玠出師之誤有以召之以徐清叟參知政事董槐同知樞密院事十一月吳潛罷詔求直言時臨安火三日乃熄詔求直言帝又諭輔臣曰近來早朝多奏臣下辭免等細事而事體大者乃從繳進甚非臨朝聼政之意自今冝就早朝面奏發明蹇之大象有曰山下有水蹇君子以反身修德當蹇難之時而能反身修德此又聖人之所貴也是年夏有隂沴之形至冬而有火災之變帝能恐懼詔求直言亦庶幾有敬天聼言之心矣使其自此而擴充之則可以回天命於將墜延國祚於未頺而古人所謂周雖舊邦其命維新者將復見於今日矣惜其徒有求言之心而無聼言之實也此其所以無救於滅亡之道歟癸丑寶祐元年春正月詔以與芮子禥為皇子封永嘉郡王帝在位歲久無子群臣屢以為言至是乃下詔以母弟嗣榮王與芮子孜為皇子賜名禥封永嘉郡王明年進封忠王蒙古兵渡漢江寇萬州京湖都統髙逹拒却之二月朔日食蒙古城利州蒙古汪德臣既城沔利且耕且守蜀土不可復矣發明前書蒙古城沔州此書蒙古城利州則且耕且守而蜀土浸不可復矣宋室不競而使強敵竊據要地豈不深可惜哉一書再書哀中國也夏五月召余玠還六月以余晦為四川宣諭使初利州都統王夔素殘悍號王夜叉恃功驕恣桀鷔不受節度所至劫掠蜀人苦之玠至嘉定夔帥所部兵迎謁班聲如雷江水為沸旗幟精明舟中皆戰掉失色而玠自若也徐命吏班賞夔退謂人曰儒者乃有此人玠久欲誅夔獨患其握重兵居外謀於親將楊成成曰今縱弗誅養成其勢後一舉足西蜀危矣玠意遂決夜召夔計事潛以成代領其衆夔才離營而新將以單騎入矣夔至玠斬之會戎州帥欲舉統制姚世安為代玠素欲革軍中舉代之弊以三千騎至雲頂山下遣都統金某往代世安世安閉關不納而世安案結丞相謝方叔子姓至是求援於方叔方叔遂倡言玠失戎利心帝惑之世安乃與玠抗玠鬱鬱不樂玠專制四屬凡有奏疏詞氣不謹帝不能平會徐清叟入對語及玠因言玠不知事君之禮陛下何不出其不意而召之帝不答清叟曰陛下豈以玠握大權召之或不至邪臣度玠素失士心必不敢帝然之乃以資政殿學士召而以知鄂州余晦為宣諭使蒙古伐西域秋九月資政殿學士余玠暴卒玠之治蜀也任都統張實治軍旅安撫王惟忠治財賦監簿朱文炳接賔客皆有常度自寶慶以來蜀關未有及之者然久假便宜之權不顧嫌疑昧於勇退遂來讒賊之口又置機捕官雖足以亷得事情然寄耳目於群小故人多懷疑懼至是聞召不自安一夕暴疾卒或謂仰藥死蜀人莫不悲之發明暴卒者不得其死之詞余玠治蜀措置有方邊民悅服自寶慶以來蜀閫未有能及之者也兹因讒忌即命召還於人心寧無不平之氣乎未幾仰藥而死蜀人悲之茍非素得民心者安能若是哉故書暴卒所以惜玠而罪宋也其旨淵乎微矣廣義余玠者蜀之長城也玠卒之後蜀豈復為宋也有哉孟子曰國必自伐然後人伐之此之謂八月以余晦為四川制置使冬十二月蒙古呼必賚滅大理遂入吐蕃降之呼必賚以烏蘭哈逹總諸軍事分三道以進自臨洮經行山谷二千餘里自金沙江乘革囊及筏以濟摩莎蠻主迎降進薄大理城大破其兵虜其王段智興分兵取附都鄯善烏㸑等部進入吐蕃其酋索和爾圖一出降兵威所加鮮不欵附呼必賚遂班師留烏蘭哈逹攻諸夷之未附者甲寅二年春正月蒙古呼必賚以姚樞為京兆勸農使樞從呼必賚征大理嘗遇夜宴陳宋太祖遣曹彬取南唐不殺一人市不易肆事明日呼必賚據鞍呼曰汝昨夕言曹彬不殺事吾能為之吾能為之及師至大理呼必賚命樞裂帛為旗書止殺之令分號街陌由是民得相完呼必賚既還京兆以樞為勸農使教民耕植二月余晦遣兵城紫金山蒙古襲取之紫金山蜀之要地余晦遣都統井閏以兵數萬城之蒙古汪德臣選精卒銜枚夜進大破之僅以身免城遂為蒙古所據發明春秋齊侯襲莒言掩襲而取之也余晦遣兵數萬往城紫金不能周慮萬全而乃為敵所取噫紫金蜀之要地而棄以資敵則西蜀安能保障乎然則余晦之罪不能辭矣蒙古寇合州守將王堅敗之夏四月以徐清叟知樞密院事董槐參知政事六月詔籍余玠家財侍御史吳燧等論故蜀帥余玠聚斂罔利七罪玠死其子如孫盡竊帑廋之積以歸詔籍録玠家財以犒師賑邉如孫遂認錢三千萬徵之纍年始足廣義玠立功西蜀不為少矣使玠誠有私藏亦當付之八議况無乎籍之非義也分注徵之纍年則其子冒認明矣理宗於國勢日促之際而待功臣如此則凡欲立功者孰不為之解體哉此舉夫矣加賈似道同知樞密院事發明加不當加也淳祐十年書以賈似道為兩淮制置使此獨書加者蓋同知樞密執政之漸似道不學無術以任兩淮制置已為過望安可使之知樞密院乎耳夫職者天職也祿者天祿也天子代天理物人臣弼亮天工皆使之共天位食天祿所以至公無私必賢而有德能而有才斯為冝耳安可以已之私昵而加天之爵祿哉厥後養成亂皆卒為亡國之本是蓋不能謹之於微以致其盛而難制焉耳從之有天下國家者其於戚畹尤宜加察而不可使之專執朝政於清明之時然後天下庶可得而治也此皆已往之失而將來之所冝戒自是而後例皆倣此召余晦還閠月以李曽伯為四川宣撫使置司夔州初晦制下徐清叟奏曰朝廷命令不甚行於西蜀者十有二年今者天斃余玠乃陛下大有為之機也今以素無行檢輕儇浮薄不堪任重余晦者當之臣恐五十四州軍民不特望而輕鄙之敵人聞之亦且竊笑中國之無人矣乞收回所除內批帝不聼及晦在蜀屢敗邉事日急帝乃召晦還董槐上疏請行且請頓重兵置司夔州以固荆蜀輔車之勢帝以槐言事無隱方嚮用之不許而以李曽伯代晦釋蒙古使者遣歸時伊埒默色已死秋九月殺利州西路安撫使王惟忠惟忠以余晦鎮蜀心輕之呼其小字曰余再五來也晦怒誣奏惟忠潛通北國詔下大理獄勘官陳大方煆成其事遂斬于市血上流而色不變且謂大方曰吾死訴于天未幾大方亦死發明凡書殺殺無罪也值西蜀多故之秋正朝廷用人之際録功隱過此其時也况無故而恣行誅殛乎余晦因惟忠所輕心生慙憤羅織其罪誣奏於朝理宗不能察其非群臣不能究其枉煅成其事殺諸市朝豈不深可哀哉直書殺而不去其官所以著宋之失政刑矣廣義余晦之非人望素矣今又不能自反而誣陷無辜其逆理不亦甚乎分注備載惟忠之寃干以見陽施陰報理所宜也夫何怪哉冬十一月呼必賚以亷希憲為京兆宣撫使希憲輝和爾人少侍呼必賚篤好經書一日方讀孟子聞召因懷以進呼必賚問其説希憲以性善義利仁暴之旨為對呼必賚善之目為亷孟子乂一日與諸貴臣校射連發三中衆驚服曰真文武材也自大理還以京兆分地置宣撫司命希憲為使京兆控制隴蜀諸王貴蕃分布左右民雜戌羌尤號難治希憲講求民病抑強扶弱境內大安蒙古張柔城亳州柔以連歲勤兵兩淮艱于糧運奏請據亳之利蒙古主乃召柔率山前八軍城而戍之柔又以渦水北隘淺不可舟軍既病涉曹濮魏博秉皆不至又以百文口為宋往來之道俱築甬路一自亳而汴一自亳而南置堡立柵密為偵邏由是糧無不逹乙卯三年春正月迅雷罷元夕張燈起居郎牟子才上疏言元夜張燈侈靡倡優下賤竒技獻笑媟汙清禁上纍聖德今震霆示威願聖明覺悟天意可回帝納其言發明迅雷疾電正月而迅雷大變也震之上六震索索視矍矍征凶震不于其躬于其鄰無咎宣王周盛世之君也遇災而懼側身修行景公宋小國之君也反身修德熒惑亦為之退舍此皆恐懼而能修省者也帝因迅雷而罷元夕張燈然亦末務非究其本也必若訪求直言以輔政之闕失去其邪罔以肅朝之綱紀然後憂勤愓勵省身克己則天變於我乎弭矣罷其張燈又豈可為弭變之道哉此綱目豫而未盡豫之意耳二月治全子才等喪師罪罷其祠祿蒙古侵漢蜀荆淮帝深憂之給事中王野言國家與蒙古本無深讐而兵連禍結皆原於入洛之師輕而無謀遂致隻輪不返乞罷全子才劉子澄辭祿以為喪師誤國之戒從之廣義入洛之師起於趙範趙葵之輕佻成於鄭清之力主其説而子才等不過為從者耳今也舍渠魁而治脅從其何以服人心哉書曰殲厥渠魁脅從罔治理宗其昧於此乎蒙古呼必賚徵許衡為京兆提學衡懷慶河內人幼有異質七歲入學授章句問其師曰讀書何為師曰取科第耳曰如此而已乎師大竒之謂衡父母曰兒頴悟非常他日必有過人者吾非其師也遂辭去稍長嗜學如飢渴然遭世亂且貧無書嘗從日者家得書疏義避難徂徠山得易王弼説夜思晝誦言動必揆諸義既而亂少定往來河洛間從桞城姚樞得程朱氏書益大有得尋居蘇門與樞及竇默相講習慨然以道自任嘗語人曰綱常不可一日亡於天下茍在上者無以任之則在下之任也凡喪祭娶嫁必徵於禮以倡其鄉人學者寖盛衡常語之曰進學之序必當棄前日章句之習從事於小學因悉取向來簡帙焚之使無大小皆自小學入是時秦人新脫於兵欲學無師聞衡來人人莫不嘉幸於是郡縣皆建學民大之三月以王野簽書樞密院事雨土詔不許傳播邉事夏五月四川地震閩浙大水發明雨土者雨而土也土者少陽幼君大臣之象地震大水者陰極敵人竊發之類也雨土者小人將擅國政之徵而地震大水者又蒙古侵軼之應未幾有似道蒙古之事天人之際休咎之徵焉可誣也而宋之君臣方且昏冥於豫弗克自強而天變屢形不幾乎入於荒唐之事矣豈人君敬天勤民之德哉比事而書其義自見以宦者董宋臣幹辦佑聖觀宋臣逢迎上意起梅堂芙蓉閣香蘭亭豪奪民田引倡優入宮招權納賄無所不至人以董閻羅目之監察御史洪天錫上疏言天下之患三曰宦官外戚小人蓋指宋臣及謝堂勵文翁帝俾天錫易疏欲自戒飭之天錫又言自古姦人雖慿怙其心未嘗不畏人主之知茍知之而止於戒飭則慿怙愈張不若未知之為愈也不報發明以四海九州而奉一人則凡膳羞服御之物其所以供上之用者皆有常職厯代以來未常闕事至理宗始以宦者幹辦佑聖遂至豪奪白取讐斂於民雖諌官御史交章論列抗疏奏陳皆不之納是豈為民父母之意哉書以宦者董宋臣幹辦佑聖觀是公行幹辦白晝使之行劫於通衢耳斯民何其重不幸耶如唐書以宦者為宮市使義同六月以丁大全為右司諌大全鎮江人面藍色為戚里婢壻寅緣閫妃及內侍盧允升董宋臣遂得寵于帝自蕭山尉纍拜右司諌時正言陳大方侍御史胡大昌與大全同除人目為三不吠犬罷監察御史洪天錫秋七月謝方叔徐清叟免時雨土天錫以其異為蒙力言陰陽君子小人之辨又言蜀中地震閩浙大水上下窮空逺近嗟怨獨貴戚宦閹享富貴耳舉天下窮且怨陛下能獨與數十人者共天下乎會吳民列訴宦官董宋臣奪其田天錫下其事有司而御前提舉所謂田屬御莊不當白臺儀鸞司亦牒常平天錫謂御史所以雪寃常平所以均役若中貴人得以控之則內外臺可廢猶為國有紀綱乎乃伸劾宋臣併盧允升及言修內司止于供繕修比年動曰御前姦贓之老吏逃逋之凶渠一竄名其間則有司不得舉手狡者獻謀暴者助虐其展轉受害者皆良民也願母使史臣書之曰內司之橫自今始書六七上悉留中天錫遂去宗正寺丞趙崇嶓移書責丞相謝方叔不能正救而讒者又曰天錫之論方叔意也於是監察御史朱應元論罷方叔及參知政事徐清叟宋臣允升猶以為未快厚賂人上書力詆天錫方叔且乞誅之使天下明知宰相臺諌之去出自獨繼於內待初無預焉於是方叔出提舉洞霄宮發明人君既知臣賢否得失而不能內存諸心他日為姦人所譛奮然誅斥此中才庸主之通患也向使理宗當洪天錫上言之時少能反覆致思嘉而赦之則真偽是否或可少得其實而理宗曽不及此遂墮小人計中他時誰復敢為天子直諌者哉綱目於天鍚之罷初無貶詞則亦以其無罪可書耳方叔清叟既居宰輔不能救援雖讒譛而免然不書其官者又以其昧於主暗時艱之義故也然則是舉君臣俱有其失豈不深可惜歟西南夷盡降蒙古烏蘭哈逹自吐蕃進攻白蠻烏蠻及鬼蠻諸部所向風靡羅羅斯及阿伯兩國大懼舉國以降及乘勝攻下阿魯諸酋西南夷悉平得五城八府四郡蠻部三十七八月王野罷以董槐為右丞相兼樞密使程元鳯簽書樞密院事蔡抗同簽書院事抗處士元定之孫也丙辰四年春三月以蒲擇之為四川制置使置司重慶夏四月以程元鳯參知政事蔡抗同知樞密院事加賈似道參知政事職任依舊似道威權日盛臺諌嘗論其二部將即毅然求去孫子秀新除淮東總領外人忽傳似道已密奏不可矣執政遂不敢遣子秀以似道所善陸壑代之其見憚如此五月賜禮部進士文天祥及第天祥以法天不息為對其言萬餘帝親拔為第一考官王應麟奏曰是卷古誼若龜鑑忠肝如鐡石臣敢為得人賀六月丁大全逐右丞相董槐詔罷槐提舉洞霄宮竄太學生陳宜中等于逺州槐自以為人主所振拔茍可以利安國家者無不為嘗言于帝有害政者三一戚里不奉法二執法大吏久於其官而擅威福三皇城司不檢士將率不檢下故士卒橫士卒橫則變生於無時執法威福擅故賢不肖混淆賢不肖混淆則姦邪肆賢人伏而不出親戚不奉法故法令輕法令輕故朝廷卑三者不去政且廢願自上除之於是嫉之者滋甚時帝年寖髙操柄獨斷群臣無當意者漸喜狎佞人丁大全方諂事內嬖得侍御史竊㺯威權帝弗覺悟大全嘗遣客私於槐槐曰吾聞人臣無私交吾惟事上不敢私結約幸為謝丁君大全度槐終不容已乃日夜刻求槐短槐入對極言大全邪佞不可近帝曰大全未嘗短卿卿勿疑槐曰臣與大全何怨顧陛下拔臣至此臣知大全姦邪而噤不言是負陛下也且陛下謂大全忠而臣以為姦不可與俱事陛下矣上書乞骸骨不報大全益怨之乃上章劾槐章未下大全夜半以臺檄調隅兵百餘人露刃圍槐第驅迫之出紿令輿槐至大理寺欲以此脅之須史出北關棄槐􅑧呼而散槐徐步入接待寺罷相之制始下物論殊駭三學生屢上書言之乃詔槐以觀文殿大學士提舉洞霄宮大全既逐槐益恣橫用事道路以目太學生陳宜中黃鏞林則祖曽唯劉黻陳宗六人上書攻之大全怒使御史吳衍劾之削其籍編管逺州立碑三學戒諸生勿得妄議國政士論翕然稱宜中等號為六君子發明逐者強逼之詞所以著其無君也自古小人之陷君子不過讒譛也誣罔也中傷也羅織也然後假公營私或黜貶於逺方或廢棄於散地或罷其祠祿或錮其子孫然未聞調隅兵圍第驅迫之出者此蓋小人妬悍專恣之心勝耳嗚呼天子在上百僚在下而臺諌擅逐丞相天子不能禁百僚不能言獨陳冝中等雖無官守言責之寄乃存好善惡惡之心上書救槐皆遭貶竄抑何罪耶是時公論不行邪説暴橫理宗亦可謂寄生之君矣安得久而不亡其國哉故夫書丁大全逐右丞相董槐所以罪其專輒書詔罷槐提舉洞霄宮所以譏其不明書竄太學生陳宜中等所以豫其倡義綱目之旨其嚴矣乎廣義丞相者即有虞之百揆有周之冢宰也上佐天子下理庶物天子之下萬民之上居廟堂與天子相可否者也豈權臣得以相侮者哉况大全素無汗馬之勞又無人望清譽特以理宗晚節不君私昵過寵之極故得以濁亂朝綱而肆其凶惡耳若推其極至於齊之田魯之桓蓋有不難者矣彼陳宜中等不忍朝政廢壤故中心有激極詆大全之姦扶綱常也且諸臣百工既畏大全之勢而不言太學生又不言則是視其君如路人矣讀聖賢書所學何事今六人為公論所惜而有君子之號則彼不言者皆小人也而理宗朝廷不得為朝廷矣嗚呼東漢之末而有八俊八厨八顧八及之名故卒至于淪亡而不可救今宜中等不幸有此徽號殆恐元雖不南而董卓曹暪復起趙氏之蕭牆矣噫復君父之讐者理宗也貽亡國之禍者亦理宗也理宗者功之首罪之魁也君子惡乎取秋七月以程元鳯為右氶相兼樞密使蔡抗參知政事張磻簽書樞密院事九月監察御史朱熠乞汰冗吏不報熠言境土蹙而賦斂日繁官吏增而調度日廣景德慶厯時以三百二十餘郡之財賦供一萬餘員之俸祿今日以一百餘郡之事力瞻二萬四千餘員之冗官邉郡則有科降支移內地則欠經常納解欲寬民力必汰冗員帝嘉之而不能用發明傳曰生財有大道生之者衆食之者寡則財恆足矣茍生之者寡食之者衆則財又其能足乎蓋冗吏多則蠶食衆蠶食衆則賦斂繁賦斂繁則民生瘁慶厯時以三百餘郡之財賦供一萬餘員之俸祿今以一百餘郡之事力贍二萬四千餘員之冗官誠以汰之以省費也朱熠言之理宗不悟又豈善於治國者哉直書不報深貶之也蒙古城開平府初邢臺人劉秉忠英爽不羈以家貧為府令史一日因案牘事不愜意嘆曰吾家奕世衣冠今乃泊沒為刀筆吏乎即棄去隱居武安山尋為僧於天寧寺往來雲中值呼必賚遣人召僧海雲海雲邀秉忠與俱既入見應對稱旨秉忠於書無所不讀尤邃於易及邵氏經世書至於天文地理律歷三式六壬遁甲之屬無不精通論天下事如指諸掌呼必賚大愛之凡征伐謀議皆與至是蒙古主欲建城市修宮室為都會之所呼必賚以秉忠薦因命相宅秉忠以桓州東灤水比之龍岡為吉詔秉忠營之命曰開平府冬十一月以張磻同知樞密院事丁大全簽書院事馬天驥同簽書院事時閻妃怙寵大全天驥用事有無名子書八字於朝門曰閻馬丁當國勢將亡蔡抗罷十二月罷知嚴州吳槃帝以御寶黃册催內藏坊場錢槃奏言內庫理財太急督促太峻龍章鳯篆施於帑藏之催科寶册泥封下同官吏之文檄居萬乘之崇髙而啇財賄之有無事雖至微關係甚大董宋臣諷臺諌邵澤劾罷之發明治國者當正肅朝綱朝綱不正難以化逺而小人得以竊其權衡生民有以罹其塗炭四海不至於擾亂者幾希矣是時理宗惑於群小利心益熾乃以御寶黃册催內藏坊場之錢則是甚失國體而朝綱為之不正矣吳槃上疏極諌言甚切直理宗茍能明此則當嘉吳槃革弊政可也惡而罷之謂之何哉故直書罷而不去其官所以明其無罪耳丁巳五年春正月加賈似道知樞密院事召吳淵參知政事淵未至卒淵有才略所至有能名然政尚嚴酷好興羅織之獄籍入豪橫故時有蜈蚣之謡至是自京湖制置使召還未至卒蒙古罷呼必賚開府命阿勒逹爾行省事于京兆或讒呼必賚得中土心蒙古主遣阿勒逹爾行省事于京兆劉太平佐之鈎考諸路財賦置局聞中推集經略宣撫官吏下及征商煆鍊羅織無所不至曰俟呼經局日入此罪者惟劉黑馬史天澤以聞悉誅之必賚聞之不樂姚樞曰帝君也大王為皇弟臣也事難與較逺將受禍莫若盡王邸妃主自歸朝廷為久居謀疑將自釋及呼必賚見蒙古主皆泣下竟不令有所白而止因罷鈎考局而呼必賚所署置諸司皆廢蒙古寇襄陽入其郛蒙古董文蔚既城光化棗陽儲餱糧會攻襄陽樊城南據漢江北沮湖水卒不得渡文蔚夜領兵于湖水陜隘處伐木拔根立于水實以薪草為橘頃之即成至曉兵悉渡圍已合城中大驚文蔚復統軍前行奪外城襄陽守將髙逹力戰于白河乃還夏五月城荆山為懷逺軍以夏貴知軍事六月馬天驥罷蒙古將烏蘭哈逹入交趾屠其城烏蘭哈逹兵入交趾邉使論降皆見囚及兵至洮江交人戰敗其王陳曰煚走海島蒙古得前所遣使於獄中以破竹束體入比釋縛一使死因屠其城留九曰以熱不能堪班師發明直書曰屠所以著其暴也蒙古殘忍之心至是益甚矣取其城邑則已必屠而滅之然後可以快其憤哉此其所以習于殘暴而非王者仁義之師嗚呼綱目之書法嚴矣秋八月以張磻參知政事丁大全同知樞密院事蒙古主蒙哥莽賚扣分道入寇以其少弟額哷布格守和林諸王伊遜克駙馬約蘇爾等請伐宋蒙古主亦怒宋囚使臣命諸王額哷布格居守和林阿勒逹爾輔之自將南侵由西蜀以入先命張柔從呼必賚攻鄂趨杭州塔齊爾攻荆山又詔烏蘭哈逹自交廣引兵會鄂李全子壇進攻海州澾水等處蒙古主進次六盤軍四萬號十萬分三道而入蒙古主由隴州趨散關諸王摩格由洋州趨米倉萬戶布爾察克由潼關趨沔州額哷布格呼必賚之弟也廣義特書蒙古主分道入寇使其弟守和林是中國盡為蒙古所有之機也故特書之以見親率軍旅空國而來宋欲不亡得乎回鶻貢于蒙古回鶻獻水精盆珍珠傘等物可值銀三萬餘錠蒙古主曰方今百姓疲弊所急者錢耳朕獨有此何為却之賽音諤德齊以為言蒙古主償其直且禁其勿復有所獻冬十月張磻卒以林存簽書樞密院事戊午六年春正月以丁大全參知政事二月以馬光祖為京湖制置使光祖為松江制置辟召僚屬皆極一時之選至是移鎮江陵以汪立言呂文德王登王鑑為參議官蒲擇之率兵復成都及蒙古戰敗績乃還蒙古耨哷將前軍欲會都元帥阿逹哈於成都擇之遣安撫劉整等據遂寧江箭灘渡以斷東路耨哷軍至不能渡自旦至暮大戰整等軍敗耨哷遂長驅至成都擇之命楊大淵等守劒門及靈泉山自將兵取成都會阿逹哈死耨哷率諸將大破大淵等于靈泉山進圍雲頂山城扼其歸路擇之兵潰城中食盡亦殺主將以降成都彭漢懷綿等州威茂諸蕃悉降蒙古發明戰而言及主乎是戰者也內不言敗謂與讐戰雖敗亦榮也是時敵勢漸逼內外洶洶擇之分遣諸將禦于蜀口既復成都戰而敗績則其志亦可嘉尚也已茍使其功得成則南宋之氣庶幾少伸春秋所謂義戰者此類是也故書豫之蒙古入西域平克實密爾諸國初蒙古遣宗王實喇伐西域至是實喇以扎木諾延郭侃總統諸軍前後平西域克實密爾十餘國轉鬬萬里西渡海收富浪國遣使獻捷實喇遂留鎮西域夏四月程元鳯罷以丁大全為右丞相兼樞密使時大全謀奪相位元鳯謹飭有餘而乏風節遂力請罷以林存同知樞密院事朱熠簽書院事秋九月蒙古主莽賚扣入劒門冬十一月陷鵝頂堡諸城耨哷聞蒙古主次漢中留密喇卜和卓劉哈瑪爾守成都自帥衆渡馬湖獲守將張實遣招苦竹隘實入隘遂與守將楊立堅守蒙古主渡江陵江至白水命總帥汪德臣造浮橋以濟進次劒門至苦竹隘使其將史樞急攻取之楊立迎戰于巷敗死蒙古獲張實殺之因殱其餘衆十一月進圍長寧山守將王佐徐昕戰敗蒙古進攻鵝頂堡知縣王仲降城遂破佐死焉蒙古主入城殺佐之子及徐昕等四十餘人由是青居大良運山石泉龍州守將劉淵蒲元圭張大悅趙順等俱以城降惟運山轉運使施擇善不屈死蒙古諸王摩格塔齊爾並略地還引兵來會發明嗚呼蒙古之強至是甚矣宋室之衰至是極矣自蒙古寇蜀入劒門陷諸堡如入無人之境守將迎降者十有八九戰死者十無二三而使全蜀之地相繼陷沒兩川之民委於鋒刃豈不深可哀哉然則當時之事勢亦略可觀也據事直言深惜之耳林存罷以賈似道為樞密使兩淮宣撫使以朱熠同知樞密院事蒙古將李璮陷海州漣水軍賈似道上書請罪詔不問璮取漣海拔四城殺官軍幾盡維揚大震似道抗章引咎詔特與放罪發明四海分裂兵交怨結若復廢法何用討賊此諸葛孔明誅馬謖之詞是時蒙古入寇中原未復正冝明君臣之義辨逆順之理今似道為兩淮宣撫蒙古陷漣海罪固當罰况草昧之時尢冝正法理宗乃以袵席之愛從而赦之是使不忠之徒橫行於天下而君臣上下之分亦不必立矣故綱目書請罪書詔不問以深貶之蓋謂之詔不問則其咎固在理宗而非出於他人也嗚呼不忠罪猶且釋之况下於不忠事者乎其與唐書將軍王去榮有罪敕免死同義十二月詔馬光祖等進軍歸峽州以援蜀詔光祖移司峽州六郡鎮撫向士璧移司紹慶士壁遂進師歸州與光祖迎戰房州蒙古少却蒙古主莽賚扣入閬州守將楊大淵以城降蒙古主取隆雅州至閬之大獲山遣王仲入招大淵官大淵殺之蒙古主督諸軍力攻大淵懼遂以城降推趙廣死之已而大淵逃歸蒙古主怒欲屠其城將官李呼喇濟曰大淵去事未可測亟追之乃單騎至城下門未閉大呼入城曰皇帝使我撫汝軍民即下馬執大淵手曰上方宣諭賞賜不待而來何也大淵曰恐城寨有他變是以亟歸耳因與偕來蒙古主大悅以大淵為都元帥發明既曰守將則是固守城邑乃其職也以城降之果何義乎背其君父以臣于人低首下心於仇敵之前卑詞靦面於蒙古之主非至無耻者弗克屑為大淵既任專城不能守君之地而乃以城降之則其罪可勝誅哉直書于册深罪之也綱目書此其亦不得已焉耳吁御批續資治通鑑綱目卷二十
