body:
  text: 欽定四庫全書御批續資治通鑑綱目卷二十四起乙未元成宗元貞元年盡辛亥元武宗至大四年凡十七年乙未成宗皇帝元貞元年春正月以劉國傑為湖廣平章政事辰灃地接溪洞宋嘗選民立屯免其繇役使禦諸蠻在澧曰隘丁在辰曰寨兵宋亡皆廢國傑悉復其制又視盜出沒之地置戌三十八所分屯將士以守之由是東盡交廣西亘黔中周湖廣四境皆有屯戌制度周密諸蠻不能復寇入朝賜玉帶錦衣旌其功臺臣言國傑在軍中每傾家資賞賚將士帝命估償之二月帝如上都翰林學士承旨留夢炎致仕上以其在先朝言無所隱厚賜遣之初世祖嘗問夢炎葉李優劣於趙孟俯對曰夢炎臣之父執其人重厚篤於自信好謀能斷有大臣器葉李所讀之書臣皆讀之所知所能臣皆知之能之世祖曰汝以夢炎優於李邪夢炎為宋狀元至宰相當賈似道誤國依阿取容李以布衣乃伏闕上書是賢於夢炎也發明夢炎故宋臣也而以元爵書何哉賣國求利背主事讎是非亡宋之臣也以元爵書之其罪自見而不免勒令致仕者則亦使後之臣子安於義命毋非覬以徼利耳然則鴟梟小人徒負不義之名者果何益哉如五代書梁禮部尚書蘇循致仕同意廣義觀孟俯論夢炎人品要亦為已而設及世祖右葉李而左夢炎于時不知孟俯之顔曽不為之厚乎三月安南入貢地震夏四月廣京師賑糶米肆帝以京師米貴益廣世祖之制設三十肆發米七萬餘石糶之其肆每年增糶多至四十萬石行之既久多為強豪巧取乃令有司籍貧民户數驗口給之減賑糶之直三分之一每嵗亦不下二十餘萬石閏月蘭州河清上下三百餘里凡三日發明河清往往以為國之嘉祥羣臣稱賀者有之中外上表者有之此皆諛臣庸主之通患也善治天下者以豐年為瑞以賢才為寶其他如景星慶雲靈芝甘露不足為祥也今蘭州河清議者皆謂元嘉祥殊不知綱目未修則固以為嘉祥綱目既修則足以為災異此綱目取法春秋之意也茍以為嘉祥則下文必無陜西旱飢之書矣明乎此然後可知君子筆削之深意云廣義河清之事臣前論之備矣非瑞也書之所以著元運之衰釐正選法省臣言阿哈瑪特僧格怙勢賣官無賢否選法大壞詔敏珠爾多卜丹何榮祖等釐正之五月升江南諸縣為州以戶為差戶四萬五萬者為下州五萬至十萬為中州凡為中州二十八下州十五又以户不及額降連州路為州六月陜西旱飢行省右丞許扆議發廩賑之同列以未經奏請不可扆曰民為邦本今飢餒若此若俟命下無及矣擅發之罪吾當任之遂發粟賑之命亦尋下發明軍旅之後必有凶年此春秋已驗之事也是時軍旅頻興弊政未息而民怨懟之氣足以感召天變而乾旱作矣古者三年耕必有一年之畜九年耕必有三年之畜是以雖有凶年民無菜色以其有畜故也成宗即位未幾而災異迭見亦未見其恐懼修省之實也既旱而飢民病深矣廣義許扆可謂識時逹權者也同列何足以知之秋九月帝還大都冬十一月伊實特穆爾卒十二月立皇后巴約特氏丙申二年春正月詔諸王公主駙馬毋輒罪官吏時諸王錫錫等部曲卒恣橫擾民駙馬曼濟台私殺有罪有司官吏輒被號召至是詔令非奉旨毋輒加罪發明欲治乎外先治乎內欲正乎疏先正乎親其內不治難以治外不正乎親難以正疏今成宗禁宗室外戚毋罪官吏是亦能知其弊而革之於己然者乎故書以豫之二月以博果密為昭文館大學士平章軍國事丹津為平章政事博果密以與同列多異議久稱疾不出帝曰朕知卿疾之故以卿不能從人人亦不能從卿也欲以丹津代卿何如博果密曰津實勝臣乃拜博果密為昭文館大學士平章軍國重事辭曰是職也國朝惟史天澤嘗為之臣不敢當制去重字而以津代為平章政事廣義博果密之於成宗可謂君臣相遇者也然則元之狂瀾未倒者博果密為之砥柱也直書于册美自見矣三月帝如上都夏六月頒官吏受賕條格凡十三等南臺御史大夫阿喇卜丹言立法貴於輕重得宜使民不至易犯今所降條格除枉法外其不枉法者自二十兩以下罪與受一分者同科似輕重少偏秋八月立捕盜賞格御史臺臣言內地盜賊衆多乞立條格督責所屬期至盡滅乃詔諸人能告捕者強盜一名賞鈔五十貫竊盜半之應捕者又半之皆微諸犯人無可徴者官給之時山東東西道亷訪使陳天祥上疏曰盜賊之起各有所因除嵗凶諉之天時宜且勿論如軍旅不息工役荐興厚斂煩刑皆足致盜中間保護滋長之者赦令是也赦者小人之幸君子之不幸彼強梁之徒執兵殺人有司盡力以擒之朝廷加恩以釋之旦脫係纍暮即行劫既不感恩又不畏法夫凶殘悖逆性已頑定誠非善化所能移惟嚴刑以制之可也天祥既上疏乃嚴督有司追捕自其所部南至漢江二千餘里多就擒者廣義孔子曰茍子之不欲雖賞之不竊天祥之論不亦當乎但曰民非善化所能移無乃意圓而語滯乎括江南隱蔽田凡巴延阿珠阿爾哈雅等下江南所據田及權豪隱蔽者悉括之令輸租冬十月贑州兵起江西行省左丞董士選擊平之贑州民劉六十聚衆至萬餘建立名號朝廷遣將討之觀望退縮賊勢益盛士選請自往進至興國距其營不百里命將校分兵守地悉置激亂之人於法復誅姦民之為囊槖者於是民爭出自效數日六十就擒餘衆悉散事平士選遣使奏聞但請黜贓吏數人而已略不及破賊事時稱其不伐發明綱目於盜賊則書兵起以討罪則書擊之然其書法義例內外之辨雖易世而猶未已也其旨嚴矣丁酉大德元年春正月以額森特穆爾為平章政事帝如上都太后幸五臺山初為太后建寺於五臺山至是成太后將臨幸之監察御史李元禮上疏言五臺山創建寺宇工役俱興供億煩重民不聊生伏聞太后臨幸五臺尤不可者有五盛夏禾稼方茂民食所仰騎從經過無不蹂躪一也親勞聖體經冒風日往復數千里山川之險萬一調養失宜悔將何及二也天子舉動必書簡册以貽萬世書而不法將焉用之三也財用不天降皆出於民今日支持調度百倍曩時而又勞民傷財以奉土木四也佛以慈悲為教雖窮天下珍玩供養不為喜雖無一物為獻亦不怒今太后欲為兆民祈福而先勞聖體使天子曠定省之禮五也伏望回轅中道端處宫中上以循先皇后懿範次以盡聖天子之孝誠下以慰元元之望如此則不祈福而福自至矣臺臣不敢以聞其後侍御史萬僧與中丞崔彧有隙取元禮章封入奏之曰崔中丞私比漢人李御史為大言謗佛謂不宜建寺帝怒命鄂勒哲博果密鞫之鄂勒哲曰吾亦嘗以此諫太后曰我非喜建此寺蓋先帝嘗許為之非汝所知也博果密曰他御史懼不敢言言者惟一元禮可賞鄂勒哲等入言之帝沈思良久曰御史言是也乃罷萬僧復元禮職初司程陸信等董建寺之役驅迫民夫數千冒險入山谷伐木運石死者萬餘人河東廉訪使王忱乘太后幸五臺因言建寺本以福民今福未及而害己甚恐非朝廷意也太后聞之為減其役仍賜恤死者之家發明莊二十年春二月經書夫人薑氏如莒君子譏之今太后幸五臺而綱目書者禮義天下之大防也其禁亂之所由生猶防止水之所自來也婦人從人者也夫死從子而成宗失子之道不能防其母禁亂之所由生彼婦人無故不踰閫閾况太后天下之母尤非閭里之婦可比擅興土木建寺五臺無故離京恣為遊幸成宗未聞幾諫惟務阿徇豈不深可惜哉直書于册其義自見廣義元禮諫后一疏可謂善矣非鄂勒哲博果密之救亦難乎免于下獄矣孰知蒙古中而有若人也哉夏四月朔日食秋七月河決杞縣蒲口先是河決汴梁發丁夫三萬塞之至是蒲口復決乃命廉訪使尚文相度形勢為久利之策又言河自陳留抵睢東西百有餘里南岸視水髙六七尺或四五尺北岸故堤水視田髙三四尺或髙下等大較南髙於北約八九尺隄安得不壞水安得不北也蒲口今決千有餘步東走歸舊瀆行二百里至歸德橫隄之下復合正流或強遏之上決下潰功不可成揆今之計河北郡縣宜順水性築長隄以禦泛溢歸德徐邳之民任擇所便避其衝突被害民戶量給河南退灘地以為業異時決他所亦如之亦一時救患之良䇿也蒲口不塞便帝從之會河朔郡縣及山東憲部爭言不塞則河北桑田盡化魚鱉之區塞之便帝復從之是後蒲口復決障塞之役無之而水北入河復故道竟如文言祅星出奎發明書曰惠迪吉從逆凶惟影響成宗所為靡善故逆氣乘之感召天變彼如日者衆陽之宗人君之表河決者陰盛之徴祅星者逆氣之乘皆所以兆當時之象而警當時之君也成宗置之度外恝然弗懼何其謬哉自書契以來天變之形未有無其應者也成宗曷不加意耶以當時之天變驗當時之政事則天人之理可想見矣九月帝還大都冬十月欽察都指揮使綽和爾攻破巴林之地還擊海都軍敗走之巴林之地時為海都所據綽和爾帥師踰金山進攻之其將逹蘭台阻逹嚕噶河而軍伐木柵岸以自庇士皆下馬跪坐持弓矢以待綽和爾奮師馳擊大破之盡得其人馬廬帳還次阿嚕河與海都援將巴拜遇綽和爾麾軍渡河蹙之巴拜敗走僅以身免以吳元圭為吏部尚書時選曹銓注多有私其鄉人者元圭曰此風不可長自視事請謁悉皆謝絶禁諸王駙馬奪民田仍禁民間以公私土田呈獻及受其獻者發明前書詔諸王駙馬毋輒罪官吏此書禁諸王駙馬奪民田皆所以深豫其革弊也成宗其庶幾憂勤於民事也戊戌二年春正月增太廟牲用馬從伊徹察喇請也凡舉大祭其馬牲既與三牲同登于爼而割奠之饌復興籩豆俱設將奠牲盤酹馬湩則蒙古太祝升詣第一座呼帝后神諱以致祭年月日數牲齊品物致其祝語列室皆如之禮畢則以割奠之餘撤于櫺星門外名曰拋撒茶飯蓋以國佫行事尤所重也二月以張九思梁德圭並為平章政事初太子珍戬卒朝職欲罷詹事院九思時為詹事丞抗言曰皇孫宗社人心所屬詹事正所以輔成道德者奈何罷之尋進拜中書左丞德圭一名梁溫都爾世祖時參知政事治事有敏才京師地震世祖怪州郡報囚之數過多德圭曰當國者急於徴索蔓延收繫以致此爾帝悟為赦中外逋負尋拜右丞罷中外土木之役先是中書省臣屢言諸王藩戚賜與繁重向之所儲散之殆盡至是遂諭省臣會計天下財帛嵗入及賜與營建嵗費之數鄂勒哲因言嵗入之數不償所費又豫於至元鈔本借二十萬錠因以節用為請帝為罷中外土木之役帝如上都開鐵幡竿渠時欲開鐵幡竿渠召郭守敬至上都議之守敬曰頻年山水暴下非大為渠堰廣五七十步不可執政吝於工費以其言為過縮其廣三之一明年大雨山水注下渠不能客漂沒人畜廬帳幾犯行殿帝謂省臣曰郭太史神人也惜其言不用爾發明上書罷土木之役所以豫其省無益也然而土木之役罷未幾而開鐵幡竿渠即見於下曽謂開渠非土木之役乎蓋由其心無定主因物而遷前因鄂勒哲言而罷土木之役此因郭守敬之言而開鐵幡竿渠則其易惑難曉朝令夕改不於是而可見乎比而觀之則成宗之治國蓋可見矣三月以兩淮間田給蒙古軍夏五月以何榮祖為平章政事六月徵湖廣夏稅初阿爾哈雅下湖廣罷宋夏稅用內郡例改科門攤每户一貫二錢蓋是夏稅增鈔五萬餘錠至是宣慰張國紀復請課夏稅與門攤併徵湖湘重罹其害御史臺以為言詔趣罷之尋復改門攤為夏稅而併徵之每戶計三貫四錢之上視江浙江西為差重云發明夏稅未嘗書此書何譏病民也古者什一而稅民無科擾今而因張國紀之言請科夏稅門攤併徵由是湖湘之間重罹其害矣豈不深可歎哉特書曰徵蓋譏之也秋七月大雨河決漂歸德屬縣田廬禾稼詔免田租一年遣尚書諾海御史劉賡等塞之自蒲口首事凡築九十六所召髙麗王謜入朝髙麗王昛既傳國於其子謜有言謜僣設司空司徒等官而又擅殺其臣金吕中書請詔謜入朝因留不遣復以昛為髙麗王江西江浙水九月帝還大都冬十二月定嵗課三十取一命廉訪司嵗舉廉幹者各二人彗星見出子孫星下發明嗚呼災異之多未有多於成宗之世也書大雨河決書江西江浙水書彗星見數月之間三異迭出此蓋人事無稽天象隨見是皆綱目之特筆而非元史之舊文也元成溺豫未嘗修省悲夫綱目比書于册所以為後世人君不重天變之戒耳於元乎何誅駙馬髙唐王竒爾濟蘇勒兵備邊遇寇敗沒是嵗秋諸王將帥共議備邊事成曰敵往嵗不冬出且可休兵于境竒爾濟蘇獨嚴兵待之冬敵果大至竒爾濟蘇三戰三克乘勝逐比馬躓為敵所執誘使降不屈又欲妻以女竒爾濟蘇毅然曰我天子壻也非天子命而可再娶乎竟不屈死焉己亥三年春正月遣使問民疾苦省臣以天變屢見請依故事引咎避位上曰此漢人所説豈可一一盡從邪卿但當擇賢者任之爾時翰林學士復亦因星變上書陳數事且言古者刑不上大夫今郡守之貴以徵租受杖非所以勵廉隅江南公田租太重宜減以貸貧民多采用之發明春省耕而補不足秋省斂而助不給此先王憂民之意也一民之飢猶已飢之一民之寒猶已寒之恤其飢寒救其疾苦此固為民父母之盛心書曰如保赤子良有以也成宗因星變民飢之故惕然於中遣使按問則其恤飢寒救疾苦之意為可見矣回視疾民如讐恝不之顧者寧無彼善於此哉故特書豫之廣義昔漢文帝賜民田租之半國史褒之後世賢之蓋以其知民者國之本財者民之心傷其心則是傷其本其本既傷烏有枝葉獨茂者哉彼好利之君不此之察惟欲利歸于上是猶日斫其本而望其校葉之茂也元人知此而有是舉美可知矣當時之民一何幸哉以哈喇哈斯為左丞相帝問閻復曰中書左相難其人卿試舉所知誰可任者復以哈喇哈斯對遂由江浙左丞相召入用之二月帝如上都遣僧一山使日本江浙平章政事伊蘇岱爾復勸帝用兵日本帝曰今非其時因其俗奉佛遂遣一山往使而日本竟不至發明往使絶域必得忠義望如宋之洪皓富弼諸賢則不辱君命矣今乃因日本奉佛遣僧使之則是失使人之道而虧國體矣豈不深可醜哉直書于册不再貶而其失自見命何榮祖等更定律令帝諭榮祖曰律令良法也宜早定之既而書成上之且言臣所擇者三百八十條一條有該三四事者帝曰古今異宜不必相沿詔元老大臣聚聽之未及頒行而榮祖卒夏五月復立征東行省高麗王昛既復爵既而使臣自其國還者言昛不能服其衆乃復立征東行省以福建都元帥竒爾濟蘇為平章政事共理之秋七月放江南僧寺佃户五十萬為編民江南編民五十餘萬悉入嘉木楊喇勒智寺籍為佃户至是因省臣言檢放之八月朔太史奏日食不應太史言是日已時當日食二分有竒至期不食衆懼保章正齊履謙曰當食不食在古有之矧已時近午陽盛隂微故當食不食遂考唐開元以來當食不食者凡十事以聞九月帝還大都冬十二月以鄂爾根薩里為平章政事帝初撫軍北邊數召鄂爾根薩里不往世祖遣奉皇太子寶僅一至及即位語之曰朕在潛邸誰不願侍朕者惟卿數召不往真得大臣體自是召對不名賜坐視諸侯王嘗語左右曰若全平章真全材也命復入中書鄂爾根薩里父别名萬全故以全為氏云命兄子哈尚鎮漠北哈尚帝兄達爾瑪巴拉之長子帝以寧逺王庫庫楚總兵北邊怠于備禦命哈尚即軍中代之省民出公田租時公田為民害而荆湖尤甚部內實無田隨民所輸租取之户無大小皆出公田租雖水旱不免荆湖宣慰使立智理威上民所不便十餘事於朝而言公田尤切廷議遣使理之會有詔凡官無公田者始給以俸民力少蘇焉發明王者有愛民之心則必有愛民之政有憂民之心則必有憂民之政在人君所為何如耳然古之人君未有愛民而亡其國者亦未有憂民而覆其邦者是時公田擾害天下騷然成宗頗能垂念命省田租則其愛民憂民之心可謂一舉而兩全者矣豈不為盛德之事也哉據事直書蓋豫之耳庚子四年春二月朔日食皇太后鴻吉哩氏崩后有賢德事昭睿順聖皇后執婦道甚謹及尊為太后置徽政院長其財賦院官有受獻浙西田七百頃者籍於位下后曰我寡居婦人衣食自有餘況江而率土皆國家所有曷敢私之即命盡易院官之受獻者后之弟欲因后求官后拒之曰勿以纍我也崩諡徽仁裕聖皇后三月帝如上都夏四月以布哷齊為平章政事五月緬阿散哥也弒其王的立普哇拿阿迪提牙遣雲南平章政事色辰額哷等發兵討之初緬人僧哥倫作亂緬王執其兄阿散哥也尋釋之阿散哥也乃率其黨囚王於豕牢因弒之王次子奔訴京師詔遣色辰額哷等率行省兵二千人討之發明弒君天下之大惡討賊天下之至公綱目原於人心而定罪君子順於天理而用刑阿散哥也以臣而弒其君天下之大惡也成宗出師而討賊天下之至公也元世用師不一皆未合義惟此舉差強人意故特變文而書討所以豫其誅亂討逆之公也又豈窮兵黷武之比哉此綱目書法之深意耳昭文館大學士平章軍國事博果密卒初世祖每聞博果密之言必嘆曰恨卿生晚不得早聞此言然亦吾子孫之福臨終以白璧之曰他日持此以見朕也博果密雖厯顯要而家素貧卒無以葬鈔賻賻之贈魯國公諡文貞發明元學士帶平章軍國事者多矣未有於其卒而書之者獨博果密特書于册所以表其盡忠乃職而深示其褒焉耳廣義抑觀博果密之事成宗世祖無得而議其賢蓋可知矣況其所挫暴君如止嬰兒之欲非德望素孚者能之乎故綱目於其卒而備書其銜者志其美也秋八月更定蔭敘格正一品子敘正五從五品子敘從九餘以是為差蒙古色目人特優一級閏月帝還大都冬十二月遣雲南行省左丞劉深將兵擊八百媳婦鄂勒哲因劉深言勸帝曰世祖以神武一海內功蓋萬世今陛下嗣大厯服未有武功以彰休烈西南夷有八百媳婦未奉正朔請往征之哈喇哈斯曰山嶠小夷遼絶萬里可諭之使來不必逺厪兵力不聽竟發兵二萬命深及哈喇岱等將之以往御史中丞董士選亦言不當輕信一人妄言而置百萬生靈於死地帝變色曰事已成卿勿復言麾之出發明以武功定天下以文教興太平此先王之法也世祖既以武功定天下成宗宜以文教興太平鄂勒哲劉深之徒導用武功以彰休烈斯言豈不逄君之惡乎其逺人未服也則修文德以來之既來之則安之聖人之服逺人不過如此安可稱干比戈較勝逺夷而始謂稀世之功乎他日兵連禍結民罹塗炭誰實尸之元臣謀國不臧而致是戚惜哉故直書擊以深貶之廣義大抵八百媳婦乃窮遐極逺之國雖以秦皇漢武之強未嘗得以征之也今成宗乃正守成之時何以武功為哉借曰武功亦不當如是之黷也鄂勒哲之與博果密無所軒輊者也觀其勸帝之言其不逮博果密逺矣使博果密若在成宗豈有是舉哉孟子所謂格君心之非者其博果密之謂也辛丑五年春正月罷征東行省先是征東行省平章竒爾濟蘇言髙麗王擅署官府及僣用天下禮儀器物況官冗民稀刑罰不一若止依本俗行事實難撫治帝遣刑部尚書王泰亨等往釐正之既而王昛言設行省監制其國不便帝亦以竒爾濟蘇不能和輯髙麗遂罷行省徵之還夏五月劉深兵次順元蠻酋宋隆濟等連兵反劉深等取道順元逺冒煙瘴未戰士卒死者已什七八驅民轉餉溪谷之間一夫負粟八斗率數人佐之數十日乃逹死者亦數十萬人中外騷然而深復令雲南調民供餽及脅求水西王官之妻蛇節金三千兩馬三千匹隆濟因紿其曰官軍徵發汝等將悉剪髮黥面為兵衆惑之隆濟遂連蛇節率苗獠諸蠻攻破楊黃諸寨進攻貴州知府張懷德力戰敗死遂圍深窮谷中梁王庫庫兵救之賊衆稍却廣義劉深以狗馬之見致寇喪師罪不容誅矣然則綱目備書之者一以志逺人終難臣服之理一以志元人貪得無厭之實後之有天下者惟當修內治而已彼逺夷之服與不服奚暇計哉書曰無怠無荒四夷來王元人何足以知此秋七月詔色辰額哷移兵伐金齒諸蠻時征緬師還為金齒所遮士多戰死金齒地連八百媳婦諸蠻相效不輸稅賦賊殺官吏詔遣色辰額哷等移征緬兵討之發明聲罪致討曰伐此何以書伐王師討緬金齒邀遮則是助逆無道而有釁可乘故書伐所以徇名而責實也此所以為是非之權衡耳若惡其窮兵之故而概以擊書何以謂之綱目哉廣義自古有天下者未有如元代之盛也今而頻嵗與窮冦爭鋒譬猶富翁與貧人窶子較纎毫之利豈得為智乎觀者比而論之則元人貪婪無識也瞭然矣八月彗出井入紫微垣發明凡書彗孛皆兵之象也是時征伐四夷黎民愁怨詩不云乎有芃者狐率彼幽草有棧之車行彼周道此之謂也然則天變之來乃民怨憤之氣并之所致既出于井又入紫微其異莫甚於此矣茍使成宗悔悟省躬責已期底治平則逺人不期服而自服天變不期消而自消何必勞師逺涉然後為快哉海都復大舉入寇哈尚大破之海都走死海都與都爾斡諸部大舉入寇哈尚督綽和爾等五軍合擊大破之阿實克射都爾斡中膝遁去海都不得志引還旋亦死九月誅高慶察罕布哈免色辰額哷為庶人色辰額哷等兵攻阿散哥也不克引還言賊降在旦夕慶等受其賂首倡為還計是以無功詔遣官鞫之得色辰額哷以下將校受賂狀詔誅慶及察罕布哈色辰額哷等遇赦削奪官爵為庶人發明髙慶等既承君命弔伐緬邦則必誅其叛臣立其故主撫其羣黎宣上德澤然後旋師則不辱君命矣夫何受彼賄賂倡為還計則不惟縱賊不討抑且自肆無君其罪甚明不容諱者故髙慶書誅罪首謀也色辰額哷書免罪從謀也然後罪之輕重可見而權之高下可知矣此綱目之斷案也禁酒時以嵗凶禁酒仍弛山澤之禁聽民漁獵冬十月益海運糧以畿內嵗飢增明年海運糧為百二十萬石帝還大都十一月遣劉國傑率師討宋隆濟及蛇節劉深兵敗帝始悔不用哈喇哈斯及董士選之言乃遣劉國傑及楊賽音布哈等率四川雲南湖廣各省兵分道進討諸蠻别敕梁王提兵應之軍中機務一聽國傑處分發明朝廷用兵本及八百媳婦而宋隆濟等之無預也夫何連兵相反共抗王師則其逆節已明罪惡甚矣故變文而書討此綱目輕重之權衡也噫壬寅六年春正月免朱清張瑄官尋誅之二人父子致位顯要宗戚皆纍大官田園館舍遍天下巨艘大舶交諸畨中廩藏倉庾相望車馬填塞門巷僕從佩金虎符為萬户千户者纍數十人江南僧石祖進托其不法事上聞時中書亦言二人屢致人言宜罷其官詔御史臺鞫之既而伏誅尋籍其家禁錮其親屬流其妻子逺方其妻子被逮時賂江浙平章托克托祈蔽其罪托克托以聞帝喜曰托克托我家老臣子孫其志固宜與衆人殊也賜內帑黃金五十兩以旌之廣義考之朱清張瑄乃宋季之海盜因其備知海道曲折故使其掌都漕運萬户府由是欺上罔下遂致富殷固足以見元人用人之失矣然則何以書免朱清張瑄官尋誅之曰此正名定罪又足以見元人之得也學者味之劉深引兵還南臺御史中丞陳天祥上書誎伐西南夷不報宋隆濟纍攻圍貴州不解深等糧盡道梗不通遂引兵還隆濟復率衆邀之輜重委棄士卒殺傷殆盡南臺御史中丞陳天祥上書諫曰八百媳婦乃荒裔小夷取之不足為利不取不足為害而劉深欺上罔下帥兵伐之經過八畨縱橫自恣中途變生所在皆叛既不能制亂反為亂衆所制食盡計窮倉皇退走喪師十八九棄地千餘里朝廷再發四省之兵使劉二巴圖總督以圖收復湖南湖北大發運糧丁夫衆至二十餘萬况當農時驅北愁苦之人往回數千里中何事不有比聞從征敗卒言西南諸夷皆重山復嶺陡澗深林其窄隘處僅容一人一騎上如登髙下如入井賊若乘險邀擊我軍雖衆亦難施為或諸蠻逺遁阻險以老我師進不得前旁無所掠將不戰自困矣且自征伐倭國占城交緬諸夷以來近三十年未嘗有尺土一民之益計其所費可勝言哉去嵗西征及今此舉何以異之乞早正深罪仍下明詔招諭彼必自相歸順不須逺勞王師與小醜爭一旦之勝負也為今之計宜駐兵近境多市軍糧內安外固漸次服之此王者之師萬全之利也茍謂業已如此欲罷不能亦當詳審成敗算定而行彼諸蠻皆烏合之衆必無久能同心捍我之理但急之則相救緩之則相疑以計使之互相讐怨待彼有可乘之隙我有可動之時徐命諸軍數道俱進服從者懷之以仁抗敵者威之以武恩威兼濟功乃易成若復舍恩任威深蹈覆轍恐他日之患有甚於今日者也不報遂謝病去發明善言者不善事之模範不善言者善事之蟊賊是以古之人君不以一己之聰明為聰明而以衆人之聰明為聰明所以用人則大自用則小堯舜以衆人之聰明為聰明然後治隆俗美桀紂以一己之聰明為聰明然後身弒國亡是時用兵西南之夷劉深無功而返陳天祥上疏直諫言甚剴切帝不見聽可勝惜哉嗚呼自用而不用人其流之弊不至於桀紂之轍者幾希矣故書不報以深貶之廣義分注載天祥一書何其曲盡人情而善與元人謀國也夫何元人專務貪得雖有嘉謨嘉猷曽不為之一介於意焉譬則聾者之於大韶瞽者之於子都耳惡能致其聽視耶使天祥於此而不去則其見與是書背矣何足貴哉然則謝病去者乃其髙致也傳曰道合則服從不可則去天祥有焉詔收富民護持璽書帝語臺臣曰聞江南富民侵占民田致貧者流徙卿等亦聞之否對曰富民多乞護持璽書依倚以欺貧民官府不能詰治宜悉追收為便命即行之毋越三日二月帝有疾三月赦西南夷俱叛遣陜西行省平章政事伊蘇岱爾等討平之免劉深等官烏撒烏蒙東川芒部及武定威楚普安諸蠻因蛇節之亂皆以供輸煩勞為辭乘釁起兵攻掠州縣焚燒堡寨遣伊蘇岱爾等將兵會劉國傑討之時國傑方討順元蠻不及來會伊蘇岱爾等率師分道並進次第平之夏四月帝如上都五月太廟寢殿災發明天火曰災災及太廟之寢殿大變也元人守護不嚴而使非常之火延及太廟其怠慢不恭何其甚乎雖然變不虛生災不妄作有如斯之人事然後可召如斯之災異豈有人事不感而天災罔應者耶此皆非常之變有非人力所可勝者縱使守護之嚴安能制天災之變也歟春秋新宫災三日哭元之君臣絶無惕厲何謬如之此元之所以終於不振安能挽回天變哉六月朔日食太史院失於推策詔議其罪秋九月龍興民訛言括童男女至有殺其子者命捕為首者三人誅之始息發明漢哀之時書關東民訛言行籌君子以志當時之不祥蓋訛言雖非真有然國有訛言亦不祥之兆也此皆人心皇惑是以妖氣乘之易於恐動爾安有皇風清穆治教休明而尚有所謂訛言者乎上書日食則天變為之既形此書訛言而人心為之恐懼天人感應如此成宗悖罔而不察亦誤矣冬十月帝還大都癸邜七年春二月以阿喇卜丹茂巴爾斯並為平章政事汰諸司冗員定中書省自左右丞相而下平章政事二員左右丞各一員參知政事二員定為八府三月遣使巡行天下罷贓汚官吏萬八千四百七十三人審寃獄五千一百七十六事劉國傑敗宋隆濟及蛇節於墨特川擒斬之初國傑師出播州境與賊遇戰失利乃令軍士人持一盾布釘其上俟陳合即棄盾佯走賊果逐之馬遇盾皆仆國傑鼓譟趣之賊大敗既而餘冦復合要戰國傑不應數日命楊賽音布哈分兵先進大軍繼之賊兵潰乘勝逐北千里殺獲無算遂破之於墨特川擒斬蛇節隆濟遁去尋為兄子宋阿重執之來獻詔斬之餘黨相繼平廣義嗚呼人徒知國傑之斬隆濟蛇節為勝而不知其勝者乃所以為負也蓋隆濟蛇節乃窮荒末裔之小醜得之不足以為喜失之不足以為憂況其道路隘塞水土異宜十人而供一兵亦云未足其費可勝言哉今而得斬隆濟蛇節為幸而元人之所以自斬者亦多矣觀者以意逆志可也復以特爾格為平章政事特爾格乞解機務詔仍以平章議中書省事時諸王朝見未有知典故者帝曰特爾格諳之凡賜豫諸王禮節悉命掌行至是復以為平章政事鄂勒哲及巴延等坐贓巴延等免官鄂勒哲釋不問初朱清張瑄遍以金帛結貴近無不受其賂者事敗監察御史杜肯構言鄂勒哲等與二人交通宜罪之詔巴延密喇卜和卓梁德圭巴特瑪琳沁等戌邊丹津鄂爾根薩里等罷職不敘籍其家惟鄂勒哲不報既而御史及樞密院臣復言中丞董士選亦嘗貸二家鈔為非義帝曰既曰稱貸不必問也發明易曰九五訟元吉象曰訟元吉以中正也朱子傳曰陽剛中正以居尊位聽訟而得其平者也中則聽不偏正則斷合理時鄂勒哲巴延俱坐贓罪免之俱免釋之俱釋今而巴延等免官釋鄂勒哲不問則是聽訟不得其平而有徇情偏愛之弊矣又豈權衡之至公哉綱目書此詞繁而不殺其義可見誅劉深罷雲南分省時有司會赦議釋深罪哈喇哈斯曰徼名首釁喪師辱國非常罪比不誅無以謝天下遂誅之廣義初劉深欲假征八百媳婦以立功自謂計之得矣今而功不能立誅不可免果何謂哉揆厥所元由其始謀之不臧也書曰慎厥終惟其始君子戒焉帝如上都蘭溪處士金履祥卒履祥少從學同郡王柏及何基之門二人蓋得朱熹之傳者宋將亡遂絶意進取屏居金華山中嘗以劉恕外紀記司馬氏通鑑以前事不本於經舛繆不可信乃斷自尚書旁采子史損益之作通鑑前編他如論孟大學諸經傳及禮樂書各有注疏授其門人許謙以傳當時以為基之清介純實似尹和靖柏之高明剛正似謝上蔡履祥則親得之二氏而並充於己者也居仁山之下學者因稱仁山先生至正中賜諡文安發明處士未嘗書卒者卒處士所以録賢也履祥得朱子不傳之緒於遺經抱道自樂不求聞達是蓋輕富貴於鴻毛而重道德於泰山者也故特書於册以深豫之廣義於履祥卒而地之書以處士者重道也夏五月朔日食右丞相鄂勒哲卒廣義鄂勒哲博果密等賢然因劉深之見以開西南夷之釁乃其所短也君子病焉六月遣蒙古軍戍瓜沙二州御史言瓜沙二州為邊鎮重地今大軍內屯甘州使官民反居邊外非宜乞以蒙古軍萬人分鎮二州險隘兼立屯田以供軍從之秋七月都勒斡遣使乞降都勒斡敗聚其屬及海都之子謀遣使請命使至伊徹察喇會諸王將帥議曰都勒斡乞降當待命於上然往返再閲月恐失事機乃使瑪古哈喇往報之既遣始以聞帝嘉之詔慎飭軍士安置驛傳以俟自是諸王叛者相率來歸兩浙大飢平江等十五路霪兩害稼詔發粟賑民一月仍減直鬻米三十萬石協濟之時台州諸路旱飢尤甚行省檄浙東元帥托歡徹爾賑之托歡徹爾殘虐不恤治中陳孚訴于宣撫使亟發廩民之殍者已十六七發明綱目飢嵗多矣書於册者十九而書大飢十成宗獨有其二何也是嵗平江等十五路霪雨而遽至于大飢者成宗為國務華去實舍本逐末軍旅頻興賦斂日急而不敦其內府庫竭矣農力耗矣天降飢饉亦無以賑恤萬民矣綱目所以獨兩書飢以示後世為國之不可不敦本也以哈喇哈斯為右丞相阿固岱為左丞相八月地震平陽太原尤甚村堡移徒地裂成渠壞廬舍萬八百區人民壓死不可勝計詔問致災之由齊履謙言地為陰而主靜妻道臣道子道也三者失其道則地為之不寧弭之之道大臣當返躬責已去專制之威以答天變不可徒為祈禳也時帝寢疾宰臣及中宫專政故履謙言及之而集賢大學士陳天祥亦上書極陳隂陽不和天地不位為時政之弊言尤切直執政者惡之抑不以聞天祥自被召起且一嵗每以不見帝言鬱鬱不自釋尋復謝病歸廣義考之天祥自上書諌伐西南夷不報遂謝病歸以其諌不行也然被召而復起者猶望其君之改也今因地震而猶極諌者非不知向之諌不行也蓋以臣子不忍一日而忘君父也至此而復謝病歸者知其諫之終不可行也噫天祥之事成宗可謂曲盡其心者矣觀者勿以馮婦目之庶有以得天祥之志九月帝還大都復以茂巴爾斯為平章政事遣翰林直學士王約使高麗徴其臣吳祈入朝尋流之安西昛既復位厚斂淫刑國人羣訴于朝因得其國相吳祈專權離間上父子狀詔遣約諭之曰天地間至親者父子至重者君臣彼小人知自利寧肯為汝家國地邪昛泣謝罪且請子謜還國姦人黨與悉從約治遂徵祈赴闕鞫之流安西冬十月詔互遷行省官之久任者時諸道奉使言行省官久任多與所𨽻編民聨姻殊為害政詔互遷之十二月彗出紫微垣發明成宗之世彗星三見于綱目前書彗星見次書彗出井入紫微垣此書出紫微垣綱目皆存而不削者所以志當時君臣溺於豐亨之樂置天變於度外忽人言而不恤豈不深可哀哉是以有天下國家者其亡其亡繫於苞桑而常存戒懼不可暫忽也反是天下欲治其可得哉詔蒙古軍居山東河南者免戌甘肅簽樞密院齊諾言蒙古軍戌山東河南者戍甘肅動涉萬里每行必鬻田産甚或賣妻子戍者未歸代者當發困苦日甚今邊陲無事而虛殫兵力誠為非計乞以近甘肅之兵戍之而山東河南前戍者今有司為贖其田産妻子從之詔翰林太史院官勿致仕時詔內外官七十者並聽致仕獨郭守敬以先朝舊德朝政多咨之纍請謝事不許自是凡翰林太史官不許致仕著為令廣義人臣四十始仕七十致仕此古今之通典也然則翰林史院雖曰密勿豈髦荒之人所可居耶勿許致仕者元人不經之失也甲辰八年春正月地震平陽君甚民居摧毀皇后問平章政事阿錫葉曰災異如此殆下民所自致即對曰天地永警民何與焉發明綱目書地震五十九而成宗之世則有五焉地為陰而主靜要道臣道子道也三者夫其道則地為之不寧蓋陰陽不和天地不位時政之弊莫明于此者齊履謙陳天祥言之于前阿錫葉言之于後皆論之功直深合至理成宗忽而不晤復而不從豈足謂弭變之道哉君子備嘗豫册則其深罪當時垂戒後世之意可見矣二月帝如上都增置國子生初增蒙古生百員至是增置二百員選宿衛大臣子孫充之尋後分教于上都夏五月朔日食秋九月帝還大都復巴延等宫以阿里為平章政事御史杜肯構等言巴延等樹黨受賕謫戎逺方道路相慶方經數月遽聞召復相位又與原鞫之人列坐朝堂天下皆已巴延梁德圭巴特瑪琳沁為三凶三凶不誅無以謝天下況密剩卜和車阿里等與之同惡相濟濁亂朝綱是以比年災異屢見雖朝廷存恤之詔纍頒而禍亂之源未塞上失其政民受其殃乞將羣凶或斥或誅明正其罪御史中丞何通亦以為言前後章疏十上皆不報發明前書巴延等俱坐賊免官則是巴延貪婪之罪不可赦也夫巴延貪婪既不能討按罪行辟又不能誅卒復巴延官鄂勒哲不問成宗繆政如此曽不自知修言然則書復巴延等官不知前日免之也何為而免今日復之也何為而復參考觀之義自見矣冬十月立哈尚為懷寧王乙巳九年春二月建天夀萬寧寺寺中塑祕密佛形像醜怪皇后幸寺見之惡焉以帕障其面而過尋勑毀之發明易曰王假有廟致孝享也此言為國者不可不立宗廟以祀其先經曰春秋祭祀以時思之此言為國者不可不時享廟以致其敬是故宗廟書成則罪其慢世祖之時曽毁宋宫為佛寺成宗建天壽萬寧寺此豈父作子述之義乎以有用之財建無益之剎其心獨無愧恥乎成宗之諂佛極其誠敬宜乎佛為之祐而享喬松之夀也不二年而崩殂敬佛延年反更促夀佛不足信亦可知矣後之人君欲崇尚浮屠者可不知所鑒哉三月帝如上都隕霜殺桑般陽益都河間諸路凡殺桑二百四十一萬七千餘本發明僖三千三年冬經書隕霜不殺草胡氏以為宜殺而不殺天失其道草木猶干犯之此蓋君弱臣強之象定元年冬十月經書隕霜殺菽穀梁以為未可以殺而殺舉重可殺而不殺舉輕其象則刑罰不中之應當時三月序屬暮春按禮月令鳴鳩拂其明戴勝降于桑霜不可以降桑不可以殺今而隕霜殺桑四十餘萬則是陰陽失常而下千上之證也後二年成宗晏駕請王爭立國祚幾危然其應豈不明且切歟綱目書此不言事應而事應具存欲使後之人君保天明命不敢縱逸云爾夏四月大同地震有聲如雷壞官民廬舍五千餘間壓死二千餘人始定郊祀禮元初代有拜天之禮然皆徇用國俗郊祀之事自平金宋後猶未舉行至是哈喇哈斯等宣祈天保民之事有天子親祀者三曰天曰祖宗曰社稷而祭天尤國之大事也陛下雖未及親祀宜如宗廟社稷嵗時遣官攝行之制下翰林集以不常及中書謀之以為周禮冬至圓邵禮天夏至方邱禮地西漢元始間始合祭天地厯東漢至宋千有餘年分祭合祭訖無定議然時既不同禮樂亦異王莾之制何可法也今當循三代之典祀天南郊而方邱之禮續議以聞又按周作壇壝三成近代增四成以廣天文從祀之位今宜去其一成以合陽竒之數每成高八尺一寸以合乾之九九壇設丙巳之地以就陽位又古者器用陶匏席用藁鞂以祀天漢唐而後禮樂玉帛日益繁縟宋金多循唐禮今欲修嚴非革創所能備舉宜取唐制損益而行之既而太常復議尊祖配天之儀者臣曰自古漢人有天下率尊祖以配天宗廟已有時享郊止祭天為宜中丞何瑋曰嚴父配天不易之制也不從廣義抑考蒙古自宋理宗淳祐六年其得國為定宗貴由元年至宋度宗咸淳七年蒙古改國號曰元故自貴由至改號凡二十四年又自改號生此凡三十四年通計自貴由元年至此則元之有國以來凡五十八年至是始定郊祀禮者以見前此皆苟且其禮而未嘗有以定之也嗚呼于天猶且慢之則其亂倫續禮也宜矣元人何足道哉六月立子德夀為皇太子秋七月命兄子阿裕爾巴里巴特喇居懷州逹爾瑪巴拉次子哈尚母弟也以月津巴特瑪琳沁為平章政事八月給曲阜林廟灑掃户以尚珍署田五十頃供嵗祀發明成宗即位以來制作紛紛未盡合禮獨給曲阜林廟灑掃户一節出人意表可見天理之在人心有不可得而我沒者于此為盡見矣夫盡特書深豫之也賈胡獻寶珠西域賈人有獻珍寶求售者議以六十萬錠酬其直省臣有謂左丞尚文者曰此所謂雅庫特珠也六十萬酬之不為過矣父問何所用之若曰含之可不渴尉而可使目有光文曰一人含之千萬人不渴則誠寶也若一寶一濟一人則用已微矣吾之所謂寶者米粟是也有之則百姓安無則天下亂以功用較之豈不愈于彼乎發明天變迭見災異頻仍此正憂勤惕厲不遑寧處之時也而賈胡首獻寶珠大書于册則成宗之志為己荒矣今夫世有好飲之人或因人言或自警省知其有傷生敗德之事強自禁止若將終身不復飲者然未幾口埀涎而心燥渴又復肆飲不至於沈湎沒身而不止成宗之失不幸類是綱目書此則亦未如之何也已豈不深可戒哉深可惜哉與唐憲時裴均進銀器同意九月帝還大都冬十二月太子德夀卒丙午十年春正月罷江南白雲宗都僧録司汰其民歸州縣各寺田悉令輸租初南臺御史言江南寺觀田畝厯年詔免租賦上虧公額下侵民利其所録民户或罹飢窘為其徒者坐視不恤乞於秋成之時驗其頃畝減半徴之以備凶嵗推賑其民庶幾利害稍均不如費於官府也從之廣義嗚呼世之願治者孰不以三代之盛望之殊不知三代之時未嘗有蠧政害民之事也其養民者惟聞其五十而貢七十而助百畝而徹是也其他未聞焉其教民者惟聞其校以教民庠以養民序以習射是也其他亦未聞焉降自東漢唐宋以及季元緇黃塞道髠秃盈途蠧政害民莫此為甚間有君臣圖治動以三代之盛期之者不惟不知其本而且崇長蠧政害民之事是猶欲稼之盛而不去螟蟊螣賊也其可乎哉大書曰春正月罷江南白雲宗都僧録司者亦為元人一時之幸也閏月以徹爾阿薩爾為平章政事二月帝如上都夏五月遣髙麗王謜還國復置征東行省髙麗王昛既卒遂遣謜還仍置行省鎮撫之謜尋更名章秋八月開城地震先是晉寧冀寧及諸郡地數震至是開城又大震壞王宫及官民廬舍壓死五千餘人冬十一月帝還大都十二月有疾丁未十一年春正月安西王阿南達及諸王莾賚特穆爾入朝帝崩廟號成宗國語稱鄂勒哲圖皇帝史臣曰帝承天下混一之後善於守成惟其末年連嵗寢疾國家政事內則決於宫閫外則委於大臣其所以不至廢墜者則以去世祖未逺成憲具在故也左丞相阿固岱等謀奉皇后臨朝以安西王攝政右丞相哈喇哈斯遣使迎懷寧王哈尚於漠北及弟阿裕爾巴里巴特喇於懷州后以己嘗謀出阿裕爾巴里巴特喇及其母居於懷州恐其兄懷寧王立必報前怨乃命召安西王入京師欲立之而左丞相阿固岱平章賽音諤德齊巴特瑪琳沁巴延及諸王莾賚特穆爾隂謀斷哈尚歸路奉皇后埀簾聽政立安西王輔之於是阿固岱以祔廟及攝位事集廷臣議之太常卿田忠良博士張升曰制祔廟必書嗣皇帝名今將何書而御史中丞何瑋亦執不可阿固岱變色曰制自天降邪公等不畏死敢沮大事瑋曰死畏不義爾茍死於義何畏義遂寢時右丞相哈喇哈斯收百司符印封府庫稱疾守宿掖門內旨日數至皆不聽衆欲害之未敢發懷寧王適遣康王托克托赴京師哈喇哈斯令急還報復遣使南迎阿裕爾巴里巴特喇於懷州發明是時成宗既崩儲嗣久闕懷寧王兄弟乃裕宗之子成宗之姓天理人心皆當迎立今皇后有宿憾阿固岱相與協謀則是皆助逆之人也茍非哈喇哈斯潛往迎之則亂臣賊子之邪謀遂矣綱目書此詞繁而不殺則其逆順之勢彰彰明耳然則小人之禍可勝言哉二月阿裕爾巴里巴特喇至大都誅阿固岱等執阿南達歸於上都哈喇哈斯使至懷州阿裕爾巴里巴特喇疑未行傅李孟曰支子不嗣世祖之典訓也今宫車宴駕大太子逺在萬里殿下當急還宫廷以安人心阿裕爾巴里巴特喇奉其母還大都先遣孟趨哈喇哈斯覘之適后使問疾哈喇哈斯所孟入長揖引其手診之衆謂孟醫也竟不疑既而知安西之變有日還報曰事急矣不可不早圖之阿裕爾巴里巴特喇曰以卜決之孟召卜者謂曰大事待汝而決第云其吉及入筮果吉孟曰筮不違人是為大同阿裕爾巴里巴特喇喜振袖起衆翼之上馬諸臣皆步從入哭盡衷復出居舊邸安西之黨見阿裕爾巴里巴特喇至遂謀以三月三日偽賀其生辰因以舉事者哈喇哈斯許之夜遣告阿裕爾巴里巴特喇曰懷寧王逺不能猝至恐變生不測當先事而發阿裕爾巴里巴特喇遣都萬户囊嘉特詣諸王圖喇定計囊嘉特力贊之乃先二日率衛士入內稱懷寧王遣使召安西計事至即并諸王莾賚特穆爾執之械送上都誅阿固岱巴特瑪琳沁賽音諤德齊巴延諸王庫庫伊克圖進曰今罪人斯得太子實世祖之孫宜正大位阿裕爾巴里巴特喇曰惡人潛結宫壼亂我家法故誅之豈欲作威福以覬神器邪懷寧王吾兄也宜正大位已遣使奉璽北迎之矣遂自監國與哈喇哈斯日夜居禁中以備變俾李孟參知政事孟損益庶務裁抑僥幸羣小多不樂既而曰執政大臣當自天子親用今鑾與在道孟未見顔色誠不敢冒大任固辭弗許遂逃去不知所之發明直書曰誅所以豫其討有罪也阿裕爾巴里巴特喇削平內難或勸即位力辭弗受權為監國以俟乃兄則其志亦可尚矣回視蒯輒之徒豈不大相懸絶哉故特表而出之所以深豫之耳廣義阿裕爾巴里巴特喇誠剛明正大人也觀其拒伊克圖之言非見得思義者能之乎其視乘時射利者逺矣况乎其傳李孟不肯專任而遽爾逃去又其慮事之深者也元世而有斯人可尚也已夏五月懷寧王哈尚至上都廢皇后巴約特氏居東安殺之誅安西王阿南逹及諸王莾賚特穆爾遂即位大赦哈尚聞帝崩自阿勒台山至和林諸王勳戚合辭勸進王曰吾母及弟在大都俟宗親畢會議之阿裕爾巴里巴特喇既平內難母鴻吉哩妃惑於日者言欲哈尚讓位阿裕爾巴里巴特喇哈尚聞之語喀喇托克托曰我久在邊陲又系次居長星命之言茫昧難信設我即位後所行上合天心下副民望則雖一日之短亦足埀名萬年何可以隂陽家言而乖祖宗之託哉此殆用事之臣擅權専殺恐他日或治其罪故為是姦謀爾汝為我往察事機疾歸報我乃親率大軍由西道諸王昻輝由中道綽和爾由東道各以徑卒一萬從而遲回不進托克托至大都入道哈尚言妃愕然曰修短之説雖出術家為太子周思逺慮乃我深愛今貪憝已除宗室大臣議已定太子不速來何為汝所致言殆有讒間汝歸為彌縫之而趣其來先是妃以哈尚不至復遣阿實克布哈迎之道安西謀變始末及太弟監國與諸王羣臣推戴之意托克托復繼往行至中道哈尚與中望見之趣使同載托克托述妃言哈尚大感悟以阿實克布哈為平章政事遣還報兩宫阿裕爾巴里巴特喇侍其母來會於上都哈尚遂即位發明廢不宜廢也殺不宜殺也巴約特氏成宗之后懷寧王之嬸后雖有順從叛逆之謀然不過誅其同謀足矣以臣而廢君以姪而殺嬸三綱則未正也人心則未安也故書廢書殺以罪之至若安西王等共謀不軌其惡已萌故書誅以正其悖逆之罪耳既而內難甫平即位肆赦所以豫其當立也綱目有以斷斯獄矣追尊考曰順宗皇帝尊母鴻吉哩氏為皇太后加哈喇哈斯托多爾海太傅阿實克布哈太尉以塔喇海為左丞相綽和爾竒塔特布濟克莾賚布哈並平章政事六月立弟阿裕爾巴里巴特喇為皇太子詔定祔廟之次哈喇哈斯等言與翰林太常議皇考大行皇帝母兄也二帝神主依兄弟之次祔廟為宜議諡皇考曰昭聖衍孝皇帝廟號順宗大行皇帝曰欽明廣孝皇帝廟號成宗升祔太廟大祖居中睿宗西第一世祖第二裕宗第三順宗東第一成宗第二先元妃鴻吉哩氏宜諡貞慈靜懿皇后祔成宗廟制可胡粹中曰睿宗裕宗順宗皆未嘗居天子之位但當祔食於其所出之帝而各為立廟已非禮矣况成宗為君時順宗為之臣豈有依次升祔而躋順宗於成宗之上者乎失禮之下又失禮焉哈喇哈斯何瑋諸臣何能逃其責乎發明追尊祖考皆有常典悖禮則過中失禮則不及要當求合於中道而已睿裕順三宗未嘗南面而稱尊不過追尊之為帝耳成宗雖弟君也順宗雖兄臣也以順宗而升成宗之上則是以臣而居君之上以君而居臣之下失禮甚矣為元之計者但當食於其所出之帝於禮頗安於義斯正今而各為立廟豈禮也哉嗚呼追尊立廟本為孝誠而元人失所以尊崇之道欲孝其親而反為不孝也惡在其能尊崇耶綱目但書詔定祔廟之次而不書其所以詔定之故則其不滿當時之意為可見矣以綽和爾布哷齊並為平章政事秋七月封圖喇為越王左遷右丞相哈喇哈斯為和林左丞相以伊徹察喇為和林右丞相進爵洪陽王初皇太子入定內難阿固岱有勇力人莫能近圖喇實手縛之以功封越王哈喇哈斯力爭以為舊制非親王不得加一字之封圖喇疏屬豈可以一日之功廢萬世之制帝不聽圖喇因譛帝曰安西謀干大統時丞相亦嘗署其牘由是而罷為和林行省左丞相仍大傳復録軍國重事哈喇哈斯至鎮斬為盜者一人分遣使者賑貸降民奏出鈔帛易牛羊以給之近水者教取魚鱉為食命諸部置傳車相去各三百里凡十傳轉米數萬石以餉飢民又度地置倉廩積粟以待來者求古渠浚之溉田數千頃治稱海屯田令部民雜耕其間嵗得米二十餘萬北邊大治發明按劉氏書法左遷之詞三左遷某為某官無罪之詞也某人以罪左遷有罪之詞也某人左遷薄乎云爾之詞也武宗德圖喇手縛阿固岱之功不顧親疏加以王爵則是徇私恩而亂祖法矣哈喇哈斯力爭不可乃為左遷是豈納諫聽言之義乎毋作聰明以亂舊章今封圖喇為王則是亂祖宗之舊章失禮之中又失禮焉故詳書譏之以塔喇海為右丞相塔斯布哈為左丞相塔斯哈雅嘉琿帕哈哩鼎拜布哈並平章政事制加孔子號曰大成制曰先孔子而聖者非孔子無以明後孔子而聖者非孔子無以法所謂祖述堯舜憲章文武儀範百王師表萬世者也可加大成至聖文宣王遣使闕里祀以大牢於戲父子之親君臣之義永為聖教之遵天地之大日月之明奚罄名言之妙尚資神化祚我皇元發明孟子曰伯夷聖之清者也伊尹聖之任者也桞下惠聖之和者也孔子聖之時者也孔子之謂集大成集大成也者金聲而玉振之者也今武宗嗣位加號大成此蓋發前王未發之緒不亦美乎天扎一頒吾道爭氣紛紛制作獨此為先是以元季崛起入主中華而綿延於百年之久者其精神命脈豈不在於茲哉直書於册深豫之也廣義嗚呼厯代加吾夫子之尊號者至元武宗可謂至矣盡矣不可以有加矣後有欲尊吾夫子者殆恐不及元人此舉之為當也以都指揮使茂穆蘇及伶官實迪等並為平章政事茂穆蘇角抵屢勝遙授平章政事實迪等授平章仍領玉宸樂院使未幾樂工有犯法者刑部逮之實迪等以玉宸與刑部秩皆三品官皆榮祿大夫留不遣中書以聞帝曰凡諸司視其資級授之散官不可超越其間冗職名官髙者宜尊舊制降之發明五代時唐以伶人陳俊儲德源為刺史君子譏之夫以伶人賤工不學無術唐以為刺史尚猶不可况平章執政之官又豈伶官之所宜任乎蓋賢者仕於伶官古亦有之未聞用伶人為平章者也揭而書之所以志武宗荒逸之本八月停內降旨選官省臣言內降旨與官者八百八十與人已除三百未除者有五百餘請自今越奏者乞勿與又外任官多帶相銜非制御史臺臣亦言御史亷訪司官宜從本臺公選不當從諸臣所請降內旨用之帝曰若此者卿等皆當執勿與未幾省臣復言此有應入帝調者或未入仕及已嘗廢黜者亦復請自內降已嘗奉詔禁革之後所降內旨復有百餘臣等竊為中書政務他人輒得干請如此責效實難自今銓選錢榖之事不由中書議者不得奏聞從之賜諸王孝經中書右丞博囉持穆爾以國字譯者經進詔曰此孔子微言王公庶民皆當由此而行命刻板模印諸王以下咸賜之廣義賜諸王孝經者厯代未嘗見諸史册也元人此旨深得天下孝治之旨特書於册美可知矣以塔爾海為平章政事九月帝至自上都冬十月命皇太子領中書令省臣言初置中書省時裕宗為皇太子嘗至省署敕行中書令事後僧格遷立尚書省不四載而罷今復建中書於舊省乞徙中書令位請皇太子入省一蒞之制可十二月山東飢遣禮部尚書吳鼎往賑之時議發米四萬石不給則以鈔折之鼎曰民得鈔將何從易米請於朝易米以行徵處士蕭㪺為太子右諭德㪺陜西奉元人初出為府史語當道不合即引退力學三十年不求進鄉人有暮行遇盜詭曰我蕭先生也盜驚愕釋去世祖時辟為陜西儒學提舉不赴後纍授集賢直學士國子司業改集賢侍讀學士皆不赴至是徵拜太子右諭德扶病至京師入覲東宫書酒誥為獻以朝廷時尚酒也尋以病請解職或問之則曰禮東宫東面師傅西面此禮今可行乎俄擢集賢學士國子祭酒依前右諭德疾作固辭而歸卒諡貞敏發明凡徵處士不起者則書不至受職而復還者則書尋辭歸或書尋遣歸此通例也今蕭㪺纍徴不起及至以病辭歸此何以不書辭歸而直書太子右諭德若真仕於朝者是蓋不蒲之意也㪺既不欲仕則亦已矣况前纍召不起今而扶病至京何耶原其心不過向之辟為儒學提舉未親君也後之授為國子司業亦未親君也逮至太子諭德則志得意滿雖疾不辭奈何禮貌既衰疾作解職又豈誠於恬退者比哉故綱目削去其辭歸之實其不滿之意為可見耳戊申武宗皇帝至大元年春正月以阿實克布哈為右丞相行御史大夫事初阿實克布哈見帝容日悴乘間進曰陛下八珍之味不知御萬金之身不知愛而惟麴藥是耽妃嬪是好是酒兩斧伐孤樹未有不顛仆者陛下縱不自愛獨不思祖宗付託之重天下仰望之切乎帝大悅曰非卿孰為朕言因命進酒阿實克布哈頓首謝曰臣欲陛下節飲而反勸之是臣之言不信於陛下也臣不敢奉詔左右皆賀帝得直臣遂授右丞相行御史大夫事尋以太子請復入中書既又賜爵康國公廣義武宗即位之初而首得直臣如此宜其有以善其終矣然而享國不永者不可獨委諸天也乃説而不繹之所致歟兩浙飢民飢者四十六萬户死者甚衆詔户月給米六斗以沒入朱清張瑄財産賑之時浙東宣慰同知托歡徹爾議行勸貸令斂富民錢百五十餘萬以二十五萬屬寧海縣簿胡長孺藏之長孺察其有乾沒意悉散於民既而果索其錢長孺抱成案進曰錢在是托歡徹爾雖怒不敢問發明武宗即位未踰碁而飢饉之事兩見綱目前書山東飢此書兩浙飢分注雖各載其賑濟之實然而卒無益於飢荒者由其內不蓄而倉廩竭外不正而災異生徒以左枝右梧而行姑息又何益於飢荒也哉後之人君要當敦本抑末毋徒委之大數也嗚呼綱目垂戒之意亦切矣西僧毆上都留守李璧釋不問西畨僧之在上都者強市民薪民欣於璧璧方詢其由僧已率其黨持白梃突入公府隔案引璧髮捽諸地捶撲交下拽歸閉諸空室久乃得脫奔欣於朝僧竟遇赦免未幾其徒恭噶等與諸王哈喇巴爾妃爭道拉妃墮車毆之語侵上事聞亦釋不問時宣政院方奉旨言毆西僧者斷其手詈者截其舌皇太子聞之亟上言此法昔所未有遂寢其令發明嗚呼上都留守而為西僧所毆則其有愧是名亦多矣雖然西僧之所以強橫者由上之人縱之有素也僧毆留釋之不問天下之事安有大於此者乎反有以斷手哉舌之令豈禮也哉綱目特書於册一以見當時崇尚異端之極一以見當時威令不行之故噫元政乖剌如此此其所以國是日非而罔知禮義之道也廣義上都元人根本之地李璧上都留後之臣上都非郡邑之可方李璧非具臣之可比朝廷自宜待之厚而寵之異焉夫何比昵畨僧縱其毆厚果何理哉且夫城之狐社之鼠人不加害者非畏狐鼠也畏乎隳城損社之獲罪也况璧為國大臣豈畨僧可得而毆者耶今被其毆釋而不問其國法安在哉是宜後日畨僧之徒得以再毆王妃也嗚呼厯代之寵異端未有若此之甚厥後姦宄竊發妖人橫起實由是焉嗚呼西漢亡於外戚東漢亡於宦官唐亡於藩鎮宗沒於姦臣元敗於番僧然則敗亡之事雖異而其機則同識者恨之三月建興聖宫為皇太后所居帝如上都以托克托穆爾為平章政事夏四月罷征東行省髙麗王章奏言陛下令臣還國復設行省中國比嵗飢饉又以數百人仰食其土則民益不勝其困帝從其請罷之六月隴西雲南地大震加宦者李邦寧大司徒兼左丞相邦寧在宋為小黃門初從瀛國公入見世祖留給事內庭至是帝欲以為江浙平章辭曰臣以閹腐餘命前朝赦而用之使承乏中涓今陛下復欲至臣宰輔臣聞宰輔者佐天子治天下者也奈何辱以寺人陛下縱不臣惜如天下後世何誠不敢奉詔帝大悅加大司徒遙授左丞相仍領太醫院事發明書加宦者李邦寧大司徒兼左丞相文無貶詞然以一宦者而居六卿之職又兼左揆之任則元室之卑從可知矣貽是禍者非武宗乎分注載邦寧所辭之言可謂能守其分者武宗聞之獨無愧哉廣義嗚呼漢之將亡也天子呼宦官為父母唐之將亡也宦官目天子為門生宋將亡而封宦者為大王元將亡而加宦者為丞相濁亂綱常未有若此之甚也不有豪傑起而一之則天理民彛孰從而正之哉天道好還無足怪也秋七月皇子和實拉請括河南田詔止之和實拉請立總管府括河南歸德汝寧瀕河荒地嵗收其租中書言瀕河之地出沒無常近有齊默格者妄稱省中委之括地以有主之田指為荒地所至騷動被害之民相率來訴方議其罪遇赦獲免今乃妄以其地獻於皇子且河南連嵗凶荒脫從所請為害非細帝曰安用多言其止勿行築呼鷹臺於漷州初改鷹坊為仁虞院秩正二品命右丞相澤中等為院使領其事至是築呼鷹臺於漷州發明築呼鷹臺何以書所以志其荒縱之失也蓋王者不寶逺物則逺人格所寶惟賢則邇人安外作禽荒先王大戒以萬乘之君務鷹隼之好又烏足以貽厥孫謀也哉故直書以深譏之以塔斯布哈為右丞相竒塔特布濟克為左丞相詔內外機務並從中書區處諸王公主駙馬毋沮撓之近侍官屬及內外諸司事非由中書議者毋隔越奏聞八月諸路水旱蝗江淮民採草根樹皮為食而河南山東有父食其子者詔凡遣使賑貸之處差稅並蠲除之既而省臣言夏秋之間鞏昌地震歸德暴風濟寧泰安真定大水民居蕩析江浙飢荒之餘疫癘大作死者相枕藉父鬻其子夫離其妻哭聲震野所不忍聞是皆臣等不才猥當大任以致政事乖違隂陽失序願退位以避賢路帝曰災害事有由來非爾等所致也但當慎所行爾發明武宗即位僅踰期而兩書飢一書地震而此書諸路水旱蝗則帝之世災異之多甚矣當是時政事舛錯賢否混淆君日驕而臣日諂是以災異迭形每相告戒惜乎武宗蔽固已深終莫能悟惟知自樂而不知憂民惟知自侈而不知畏天徒使當時之民溺於塗炭悲夫綱目一書再書不一而足所以深罪武宗而重訓來世也噫廣義大抵上天之心於人君無所不變故示以災眚者欲其修省也逮其恬不知省然後别監厥德而用集大命焉今觀武宗曰災害事有由來非爾等所致但當慎所行爾然謂之慎行者亦不知其慎所行者何事也其自誣如此天將何以祐之耶欲享國長久得乎九月帝還大都冬十月以西僧嘉勒斡巴勒為翰林學士承旨發明賢者在位能者在職國家間暇及是時明其政刑此固治國之急務也翰林乃文學淵藪之地必才德俱優者方可任之當時之才德俱優屈於下僚者不少武宗不聞拔擢之而乃以西僧為之乎蓋異端難與論正道釋氏不可授儒官自有書契以來未聞以僧為翰林學士者武宗酷信西僧前毆留守而不問此為學士而不疑豈不貽笑於天下哉元固蒙古名器顛倒其如治國何綱目特揭而書之于册者所以深譏其名器之濫也廣義嗚呼以文苑清髙之地而君一虛無寂滅之緇流尚何足以言倫理哉揭之於册遺臭萬年十一月省臣請汰冗官節財用省臣言世祖時自中書以下諸司官有定員邇者諸司遞升一級一司多至二三十員事不改舊而官日增乞如大德十年員數冗濫悉汰之又今中都築城大都建寺及為諸貴近營造私第軍民困斃廩藏空虛而用度日廣每賜一人動至巨萬恐至不繼宜暫節縮况百司之事每於中書有千預者乞申禁之帝曰嘗令諸人每於中書之政他日或有乘朕忽忘持內降文記至中書者其執之以來禁賈人乘驛時有進沈檀異木可構宫室者勑江浙行省驛致之中書省臣言西域賈人佩虎符馳驛馬名奉勑求珍異乃或以一豹上獻亦要回賜虎符國之信器驛馬使臣所需卑之啇賈誠非所宜既又言江浙諸驛半嵗之間使人過者千二百有餘桑烏保赫鼎等進獅豹鴉鶻數日食肉千餘斤自今有來獻者乞令自備資力從之廣義孔子曰上有好者下必有甚焉昔武王即位之初西旅貢獒召公以為非所當受作書致告夫以一獒之貢受之若可以無害誠以人君玩物之心一萌則下之窺其所好者蓋將投間抵隙而無所不知矣老氏曰圖難於其易為大於其細者此也今武宗甫爾即位兩浙遂飢縱僧毆臣寵任宦者諸路水旱蝗築呼鷹臺其間無一善政惟務珍禽竒獸寶玉是玩遂使賈人乘驛貢獻滿途噫自古人君溺於玩物者未有甚於武宗也彼省臣所謂乞令自備資力者是猶或紾其兄之臂子謂之姑徐徐云爾以竒塔特布濟克為右丞相托克托為左丞相核天下屯田中書言天下屯田一百二十餘處由所用非人多致廢弛除四川甘州應昌雲南為地遼逺餘當選習農務者往核其可興者興可廢者廢詔從之閏月太傅哈喇哈斯卒諡忠獻詔有司贖飢民所鬻子女發明贖飢民所鬻子女何以書所以豫其仁民之心也雖然君無積蓄以養民而使民有菜色鬻其子女武宗之心能無愧乎然既能贖而歸之則又非恝然不顧者之比故又進而豫之所以嘉其一念之善耳吁可嘆哉以齊勤特穆爾為平章政事伊徹察喇進攻徹伯爾諸部漠北悉平伊徹察喇言徹伯爾諸王之在邊境者素無悛心儻諸部合謀必為國患請撫按都勒斡子庫春及處諸部來歸者於金山之陽遣軍屯田山北脫彼有謀吾已搗其腹心矣帝稱善趣進軍攻之徹伯爾等果欲棄庫春不納遂相率來降漠北悉平左遷敬儼為兩淮轉運使時儼為江南治書侍御史以議立尚書省不便忤宰臣意適兩淮鹽法久滯乃左遷儼為轉運使欲陷之儼至黜貪理敝課復增羡至二十五萬引河南省臣來會鹽策欲以所增羡為嵗入常額儼以民罷已甚以羡為額病民以為己不可遂止己酉二年春正月越王圖喇有罪賜死圖喇居常怏怏有怨望意去年秋帝幸涼亭將御舟圖喇前止之言涉不遜帝由是銜之及宴萬嵗山圖喇醉起解腰帶擲地瞋目謂帝曰爾與我者止此耳帝疑其有異志命省臣鞫之辭服遂誅之發明按劉氏書法賜死之例有四者所坐賜死有罪者也書貶某賜死書賜某死皆可罪而未宜死者也直書某有罪賜死宜死者也有所罪者也武宗不顧親疏即加王爵而圖喇居常怨望將謀不軌此蓋小人之心得此欲彼不自滿足之意也使武宗茍能知此安有今日之患乎故直書以正其罪始親享太廟以受尊號告謝太廟為享親之始廣義祖宗之享豈可使人為之書曰使親享者以見自此以前皆使人攝之也噫尊祖敬宗之禮於此知所重矣追還內降璽書丞相哈斯布哈等言朝廷璽書不由中書徑令翰林頒給者自大德六年至今凡六千三百餘道皆干土田户口錢榖銓選獄訟害民妨政之事請悉追奪後凡不由中書者乞勿與之制可帝如上都御史言京師之內工役繁興加之嵗旱民飢狂愚易惑今乘輿行幸乞命丞相一人留守京師著為令從之夏六月復徵僧道賦稅從省臣言也秋七月河決歸德又決封邱發明嗚呼當時河決之害亦多矣是豈當時隄防之不固歟抑亦當時氣數之使然歟曰非也蓋隄防傳襲既久至是而決則非不固可見河道相因數世至是而決則非氣數可知是乃隂陽失常不能自固而實天變之所致也豈可委之隄防氣數之末乎茍以隄防氣數為言則人君視為泛常將何所警懼也哉八月復置尚書省以竒塔特布濟克為右丞相托克托為左丞相三寶努約蘇為平章政事保巴為右丞孟克特穆爾為左丞王羆參知政事初帝從托克托嘉琿帕哈哩鼎言欲復至尚書省分理財用御史臺臣言昔年阿哈瑪特僧格相繼立尚書省綜理財用事敗併入中書今四方地震水災嵗仍不登百姓重困又復立之則必增置有司濫設官吏殆非益民之事且綜理財用在人為之若止命中書未晃不可帝曰卿言良是此二人者願任其事姑聽其行焉至是約蘇又與保巴言其事帝命與塔斯布哈集議保巴言政事得失皆前日中書所為今欲舉正彼懼有纍孰願行者臣請乞舊事從中書新政從尚書尚書省官以竒塔特布濟克托克托為丞相三寶努約蘇為平章保巴為右丞王羆為參知政事帝並從之塔斯布哈言此大事遽爾更張乞與老臣更議之帝不從三寶努言尚書省既立更新庶政變易鈔法用官六十四員其中宿衛之士有之品秩未至者有之未厯仕者有之此皆素習於事既已任之乞勿拘例授以宣勑仍改各行中書省為行尚書省以尚書省條畫頒示天下敢有沮撓者罪之發明書復置尚書省以明其不宜置也今所用之者皆一時之小人自是羣小用事變更制度而天下由是多事矣故備書于册以深譏之廣義此即王安石制置條例司耳竒塔特布濟克不以盧世榮僧格為鑒又踵其覆轍厥後自取誅戮不亦宜乎置太子右衛率府命右丞相托克托御史大夫布森尼敦領府事取河南蒙古軍萬人𨽻之王約曰左衛率府舊制有之今置右府何為諸公深思之不可以纍儲宫也太子又命取安西兵器給宿衛士約謂詹事鄂勒哲曰今移文千里取兵器人必驚疑主上聞之奈何鄂勒哲曰實慮不及此家令薛居言陜西分地五事命往理之約不為署行語之曰太子潛龍也當勿用之時為飛龍之事可乎遂止太子喜諭羣下曰事未經王彥博議者勿啓一日約方啓事二宦官侍側太子問曰自古宦官壞人家國有諸對曰宦官善惡皆有之但恐處置失宜耳太子深然其言廣義君子觀王約告仁宗之言可謂不負厥職者矣然而仁宗之善政屢見于史册者謂非王約輔導於其始可乎若王約者貽仁宗之哲命者也九月頒行至大銀鈔帝從約蘇言鈔法大壞乃改造至大銀鈔凡十三等平每一兩淮至元鈔五貫白銀一兩黃金一錢隨路立準行用庫及常平倉以權物價毋令沸騰元之鈔法至是凡三變云帝還大都始鑄錢元行鈔法雖皆以錢為文而廢錢弗鑄至是始詔大都立資國院山東河東遼陽江淮湖廣四川立泉貨監六産銅之地設提舉司十九鑄錢曰至大通寶者每一文淮銀鈔一釐曰大元通寶者準至大錢十文與厯代錢通用其當五當三折二並以舊數用之既而御史言至大銀鈔始行品目繁多民猶未悟而又兼行銅錢慮有相妨今民間拘收銅器甚急民殊不便乞與省臣詳議不報復行內降旨尚書省言三宫內降之旨曩中書奏請勿行臣等謂宜仍舊行之儻於大事有害則復奏請中書之務乞以盡歸臣等從之冬十月以皇太子兼尚書令初帝從竒塔特布濟克言由尚書省任人以宣敕散官委之中書至是太子言舊制百官宣敕皆歸中書以臣為中書令故也自今勑牒宜令尚書省給降宣命仍委中書從之質江南富民子為軍約蘇言江南平垂四十年其民止輸地稅餘皆無與富室有占編民奴役之者動輒百千家有多至萬家者其力可知乞令有司收糧五萬石以上者石輸二升於官仍質一子而軍之所輸之糧半入京師以養御士半留於彼以備凶年富國安民無善於此詔如其言行之發明語曰以不教民戰是謂棄之武宗惑約蘇之言以江南子弟質之為軍則不惟欺其民而抑且虐其民矣安有欺君虐民之臣尚可逭其誅戮乎直書於册交譏之也廣義約蘇欲質江南富民子為軍者憂其為亂也其計不亦左乎十一月八百媳婦諸蠻亂八百媳婦及大小徹里諸蠻作亂詔遣雲南右丞索勒濟爾威往諭之比至為賊所賂復肆攻掠遂以敗還以阿薩爾為尚書左丞相行中書平章政事尋出商議遼陽行省事十二月帝親饗太廟發明易曰萃亨王假有廟祭義曰公假于太廟朱子曰廟所以聚祖考之精神又人必能聚已之精神則可以至於廟而承祖考也然則王者親享太廟以已之精神聚祖考之精神則必親享而可元世未嘗親享遣官代之則是失萃聚之義也而悖禮亦甚矣武宗能親享之此綱目所以特書以豫之也庚戌三年春正月徵李孟入見以為平章政事同知樞密院事初孟既逃去有于帝者曰內難初定時孟嘗勸皇太子自取帝弗之信一日太子侍內宴忽戚然改容帝曰吾弟何不樂太子從容起謝曰賴天地祖宗神靈神器有歸然成今日母子兄弟之惟者李道復之功居多適思之不自知其變於色也帝即命搜訪之得於許昌徑山召見謂宰臣曰此皇祖妣命為朕賔師者宜速任之至是乃授中書平章事集賢大學士同知樞密院事廣義抑觀仁宗之起李孟可謂兩得矣一以釋武宗之疑一以全青宫之義仁宗其賢乎立皇后鴻吉哩氏二月寧王庫庫楚謀反流於髙麗庫庫楚與圖喇子喇特納實哩謀為不軌事覺下庫庫楚獄竄喇特納實哩於漠北磔西僧特哩等二十四人于市遂欲誅庫庫楚平章政事特爾格辨其誣詔釋之流於髙麗以約蘇為尚書左丞相三月賜諸王徹伯爾幣帛初世祖以海都叛詔積其分地五户絲為幣帛俟其來降賜之至是其子徹伯爾來歸尚書省臣請以賜之帝命省臣備述其故以與之使彼知所愧發明有功則賞雖讎不廢有罪則刑雖親不逭此固人君賞罰之至公也前者庫庫楚謀反罪狀甚明而僅流之於髙麗徹伯爾海都之子叛不能誅乃賜幣帛此皆過於姑媳而非奉天伐暴之意也昔管蔡流言周公誅之豈周公手刃同氣耶奉行天討不能順私恩以廢公法耳今而謀反者僅流髙麗悖逆者賜之幣帛而不知有功者將何所賞乎元之政刑如此又安能久享其國哉帝如上都夏五月詔尚書省右丞相托克托左丞相三寶努總百司庶務尋加托克托太師爵義國公三寶努爵楚國公荆襄大水山崩襄陽峽州路荆門州壞官民廨舍二萬一千八百餘間死者三千四百餘人發明詩云震電不寧不令百川沸騰山冡崒崩髙岸為谷深谷為陵哀今之人胡憯莫懲是時荆襄大水山崩死者三千四百人則其變之非小明矣元之君臣曽未見其宵旰不寧更相戒飭之意而徒上下偷安置之度外則其自暴自棄不足以有為豈不明且切歟綱目書此其垂戒來世也大矣廣義上書詔尚書省右丞相托克托右丞相三寶努總百司庶務且以各封公爵繼書荆襄大水山崩者所以著寵任興利之臣専權之應也天道福善禍淫捷於影饗可不畏哉可不戒哉秋九月帝還大都冬十月詔減宫人膳尚書省言宣徽院廪給日增儲雖廣亦不能給帝曰比見後宫飲膳與朕無異其核實減之詔大司農修明勸農之令十一月始以太祖配享南郊先是三寶努等言奉詔舉行郊杞典禮臣等議欲祀北郊必先南郊今嵗冬至祀天圜邱尊太祖皇帝配享來嵗夏至祀方邱尊世祖皇帝配享至是有事南郊以太祖配享廣義武宗之政見諸史册獨此可觀亦書曰始者以見前此未有也殺大都留守鄭阿爾斯蘭阿爾斯蘭襲父職為武衛都指揮使尚書省搆其與兄榮祖等十七人圖為不軌置獄鞫之並棄市籍其家中外寃之發明凡書殺殺無罪也阿爾斯蘭初無罪犯尚書省搆其不軌置獄阿爾斯蘭誣服即為棄市然則果何罪哉前史皆以棄市書綱目變文直書曰殺所以明其無罪因以譏元人之失政刑也安有無罪殺人而可為民之父母乎故特不去其官城中都辛亥四年春正月帝崩廟號武宗國語曰庫魯克皇帝史臣曰帝慨然欲創治改法而有為故其封爵太濫賜賚太泛至元大德之政於是稍有更變云廣義抑觀史臣之論武宗有曰帝慨然欲創治改法而有為故其封爵太濫賜賚太泛於戲此豈善論武宗者哉且元人創治立法固為不善如其不善則當速改武宗慨然欲創治改法亦可謂有為矣然為之不善不若不為之為愈焉彼武宗之時正守成之時也觀其創治改法不過寵任西僧為丞相為翰林承旨封興利之臣托克托等為公築呼鷹臺縱僧毆上都留守李璧聽才殺大都留守鄭阿爾斯蘭其曰復置尚書省綜理財用即王安石制置條例司也其曰有進沈香異木可為宫室者即命乘驛致之即宋徽宋土木宫室之費也然則所為之不善者抑亦孰有大於此類哉其所得者惟聽阿實克布哈之諌酒色省臣請汰冗官節財用核天下屯田詔有司贖飢民所鬻子女詔大司農修明勸農之令始以太祖配享南郊其所得者如是而已噫所失者大而多所得者小而寡然爵及惡德費出不經謂之太濫太泛可乎史氏之論未為當也若曰元之武宗創治改法而有為臣未之信焉皇太子罷尚書省誅托克托三寶努約蘇保巴王羆流孟克特穆爾於海南皇太子以托克托等變亂舊章流毒百姓凡誤圗者欲悉誅之延慶使楊多爾濟諌曰為政而首尚殺非帝王治也太子感其言特誅其尤者既而御史言托克托等既正典刑而黨附之徒布在百司若博囉特穆爾竒爾濟蘇烏納爾等貪汚害政今中書方欲用為各省平章參政等官宜加罷黜從之尋復以行尚書省為行中書省百司庶務復歸中書發明托克托等變亂舊章流毒百姓其罪亦已甚矣五刑五用舍此而誰適皇太子既知其弊悉皆革正托克托等則誅孟克特穆爾則流所以分首從而權輕重也此皆前人已壞之緒茍不一新政令則四海困窮而天之祿亦永終矣是乃撥亂反正之宏綱古今人心之天理而斯世寧不為之一快哉故特表而出之廣義仁宗速改其兄之不善其賢於武宗逺矣故特書皇太子者美之也罷城中都皇太子以司徒蕭珍城中都徼功毒民遂追奪其符印令百姓禁錮之凡中都所括民田悉還之民發明昔魯人為長府閔子騫曰仍舊貫如之何何必改作蓋改作未免勞民而傷財一長府之作閔子止之况役數萬之衆以築中都之城乎前書城中都此書罷城中都則仁宗憂民之心切而治國之心勤矣宜其得享承平之治也以特們德爾為右丞相鄂勒哲李孟並平章政事召先朝舊臣程鵬飛等十五人召先朝諳知政務老臣程鵬飛董士選李謙章律陳天祥尚文劉正郝天挺董士珍蕭㪺劉敏中王思亷韓從益趙君信程文海十五人詣闕同議庶政天祥等五人不至謙至首陳九事正陳八事皆欲朝廷守成憲開言路重名爵節財用興學校定律令舉切時弊二月罷喀喇托克托為江浙行省左丞相托克托至進父老問民間利病咸謂杭城舊有便河通江滸湮廢已久若疏鑿以通舟楫物價必平僚佐或難之托克托曰吾陛辭日密旨許以便宜行事民以為便行之可也俄有詔禁土功托克托曰敬天莫先勤民民蒙其利則災沴自弭土功何尤焉不一月河成三月皇太子即位大赦皇太后欲用陰陽家言令太子即位隆福宫御史中丞張圭言當御大明殿帝悟移仗大明殿既即位親解所御衣及濟遜衣二十襲金帶一賜之詔百司遞升品秩者復舊制詔武宗時百司遞升品秩者悉從至元舊制既又諭省臣曰卿等裒集中統至元以來條章擇老臣明法律者斟酌重輕折中歸一頒行天下俾有司遵行之則抵罪老庶無寃抑寧夏地裂遣宦者李邦寧釋奠於孔子邦寧既受命行禮方就位忽大風起殿上及兩廡燭盡滅燭臺底鐵鐏入地尺許無不拔者邦寧悚息伏地諸執事皆伏良久風息乃成禮邦寧因慚悔纍日初帝在東宫邦寧知三寶努等畏帝英明乘間言於武宗曰陛下富於春秋皇子漸長父作子述古之道也未聞有子而立弟者武宗不悅曰朕志已定汝自往東宫言之邦寧慚懼而退及帝即位左右咸請誅之帝曰帝王厯數自有天命其言何足介懷加邦寧開府儀同三司為集賢院大學士尋卒發明邦寧前既為大司徒兼左丞相此何以不書不豫其有是職也語曰吾不與祭如不祭帝既不能親奠孔子則或遣親王或命大臣則庶幾可也今以邦寧閹奴而俾之祗謁先聖之廟乎既而大風燭燭弗克成禮此蓋夫子在天之靈不欲享此非禮之祭也仁宗知敬孔子而不知所以敬之之禮是則欲敬孔子而反為所以褻孔子耳曽謂孔子不如林放乎綱目據事直書所以發千古之一笑爾廣義或曰分注載風起燭滅之事果有是乎曰有曰何以知其有也曰理焉而已吾夫子德配天地道貫古今其形而下者與天雖異其形而上者與天則同故曰形雖是人其實則是一團天理天即理也理之所在氣亦隨之理氣有二乎哉蓋吾夫子與天合德豈形餘奴𨽻之賤惡者可得而奠享耶此理必然無足怪者不然宋光宗紹熙二年合祭天地是何風雨大作而黃壇燭盡滅即綱目備書於册者所以甚元人之惡也夫何惑夏四月罷行至大銀鈔銅錢帝以至大銀鈔輕重失宜至大大元銅錢新舊恣用行之未久為弊甚滋詔並罷之楊多爾濟曰法有便否不當視立法之人為廢置銅錢與楮幣相權而用古之道也何可遽廢耶言雖不用時論是之五月遣兵擊八百媳婦陜西侍御史趙世延諌曰蠻夷事在羈縻先朝用兵不已致亡失軍旅誅戮省臣今苐當選重臣知治體者付以邊寄兵宜勿用也不聽秋閏七月賜李孟爵秦國公孟感帝知遇頗以國事為已任見當時賜豫太廣名爵太濫風俗太僭擬無章每勸帝言人君之柄在刑與賞刑不足懲賞不足勸何以為治帝在懷州深見吏弊既即位欲痛剗除之孟曰吏亦當有賢者在激厲之而已帝曰卿儒者宜與此曹氣類不合而曲為保護如此真長者之言也嘗謂之曰朕在位必卿在中書賜爵秦國公圖其象命詞臣贊之每入見稱曰道復而不名集覽道復李孟表字增國子生為三百人初帝命李孟領國子學諭之曰國學人材所自出卿宜數課諸生勉其德業至是又諭省臣曰昔世祖注意國學如博果密等皆蒙古人而教以成材朕今親定國子生為三百人仍增陪堂生二十人通一經者以次補伴讀著為式既而孟等言方今進用儒者而老成日以凋謝四方儒士有成材者請擢任國學翰林祕書太常或儒學提舉等職俾學者有所激勸帝從之詔自今勿限資給果材而賢雖白身亦任用之九月還陳益稷舊賜田益稷言自世祖朝來歸妻子皆為其國人所害朝廷因遙授王爵賜漢陽田五百頃俾自瞻今臣年幾七十而有司拘所授田就食無所帝謂省臣曰益稷來歸宜厚賜以懷逺人其進勛爵授田如故冬十一月罷營繕初帝諭太府監臣曰財用足則可以養萬民給軍旅雖一繒之微非朕命母輒與人至是李孟言每嵗支鈔六百餘萬錠又土木營繕百餘處計用數百萬錠內降旨賞賜復用三百餘萬錠北邊軍需又六七百萬錠帑藏見貯止十一萬餘安能周給浮費宜悉停罷帝納其言罷諸營繕時都水監傳旨給驛往取杭州所造龍舟省臣諫曰陛下踐祚詔天下凡非宣索毋得擅進誠取此舟有乖前詔遂命止之發明罷營繕所以省財力也是時飢饉相仍弊政繼作此天下蠱懷之時也帝於武宗弊政一切更新如罷行至大銀鈔銅錢如增國子生如罷營繕皆武宗之所未行者帝能行之此其所以卓冠武宗也歟大書特書深豫之爾復以阿薩爾為平章政事十一月詔停內降旨帝初諭省臣曰朕前戒近侍毋以文記傳旨中書敢有犯者徑連其人治之至是省臣復言祖宗立法選慿黜陟以示激勸今官未及考或無故更代或躐等進階僭受國公丞相等職諸司已裁而復置者有之今春以來內降旨除官千餘人其中欺偽豈能盡知壞亂選法莫此為甚帝曰自今凡內降旨一切勿行御批續資治通鑑綱目卷二十四
